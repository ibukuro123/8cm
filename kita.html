<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">

<style>
  :root{
    --paper:#e3ddcb;
    --paper-deep:#d6cfba;
    --edge:#c2b9a0;
    --ink:#2b2722;
    --ink-soft:#6d6557;
    --pencil:#4d5157;
    --shu:#a8402c;
    --fs:17px;
    --lh:2.05;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    background:#b9b09a;
    background-image:
      radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.18), transparent 60%),
      repeating-linear-gradient(102deg, rgba(0,0,0,.025) 0 2px, transparent 2px 5px);
    color:var(--ink);
    font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP","Songti SC",serif;
    overflow:hidden;
    -webkit-text-size-adjust:100%;
  }
  #app{height:100dvh;display:flex;flex-direction:column;}

  /* ---- top bar ---- */
  .bar{
    flex:0 0 auto;display:flex;align-items:center;gap:14px;
    padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
  }
  .bar button{
    font:inherit;font-size:13px;letter-spacing:.14em;
    background:none;border:none;color:#4a4335;padding:6px 2px;cursor:pointer;
  }
  .bar button:focus-visible{outline:1.5px solid var(--shu);outline-offset:3px;}

  /* ---- ruler ---- */
  .ruler{flex:1 1 auto;display:flex;align-items:flex-end;gap:6px;height:26px;}
  .ruler .rn{font-size:11px;color:#5c5343;line-height:1;padding-bottom:3px;}
  .ruler svg{flex:1 1 auto;width:100%;height:100%;display:block;overflow:visible;}
  .rulerline{stroke:#5c5343;stroke-width:1;}
  .tick{stroke:#5c5343;stroke-width:1;}
  .tick.mm{stroke:#5c5343;opacity:.45;}
  .num{fill:#5c5343;font-size:9px;font-family:inherit;}
  #mark{transition:transform .35s cubic-bezier(.3,.7,.3,1);}
  #mark line{stroke:var(--pencil);stroke-width:2;stroke-linecap:round;}
  #mark text{fill:var(--pencil);font-size:8.5px;letter-spacing:.06em;}
  #finalmark{opacity:0;}
  #finalmark line{stroke:var(--shu);stroke-width:2.4;stroke-linecap:round;}
  #finalmark text{fill:var(--shu);font-size:9px;}
  #finalmark.show{opacity:1;animation:scratch .7s ease-out;}
  @keyframes scratch{from{clip-path:inset(0 0 100% 0);}to{clip-path:inset(0 0 0 0);}}

  /* ---- book ---- */
  #book{flex:1 1 auto;position:relative;padding:0 10px 4px;min-height:0;}
  .spread{
    height:100%;display:flex;gap:0;justify-content:center;
    filter:drop-shadow(0 10px 22px rgba(60,50,30,.32));
  }
  body.vert .spread{flex-direction:row-reverse;}
  .page{
    position:relative;flex:1 1 0;min-width:0;height:100%;max-width:640px;
    background:var(--paper);
    background-image:
      radial-gradient(ellipse at 20% 12%, rgba(255,255,255,.5), transparent 55%),
      radial-gradient(ellipse at 85% 90%, rgba(150,130,90,.18), transparent 60%);
    padding:26px 20px calc(22px + env(safe-area-inset-bottom));
    overflow:hidden;
    font-size:var(--fs);line-height:var(--lh);
    letter-spacing:.03em;
    text-align:justify;
  }
  body.vert .page{writing-mode:vertical-rl;text-orientation:mixed;text-align:start;}
  .col{inline-size:var(--colw,100%);block-size:100%;margin-inline:auto;}
  .page.blank{background:var(--paper-deep);}
  #pageB{display:none;}
  body.spread #pageB{display:block;}
  body.spread #pageA{box-shadow:inset -14px 0 22px -16px rgba(90,72,40,.55);}
  body.spread #pageB{box-shadow:inset 14px 0 22px -16px rgba(90,72,40,.55);}
  body.spread.vert #pageA{box-shadow:inset 14px 0 22px -16px rgba(90,72,40,.55);}
  body.spread.vert #pageB{box-shadow:inset -14px 0 22px -16px rgba(90,72,40,.55);}

  .flip{animation:flip .26s ease;}
  @keyframes flip{from{opacity:.15;transform:translateX(var(--dx,10px));}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){
    .flip{animation:none;} #mark{transition:none;} #finalmark.show{animation:none;}
  }

  /* ---- text blocks ---- */
  .page p{margin:0;text-indent:1em;}
  .page p + p{margin-top:0;}
  body.vert .page p{text-indent:1em;}
  .page h2{
    margin:0 0 1.6em;font-size:1.22em;font-weight:600;letter-spacing:.22em;
    line-height:1.7;text-indent:0;
  }
  body:not(.vert) .page h2{border-bottom:1px solid rgba(90,80,60,.28);padding-bottom:.5em;}
  body.vert .page h2{border-left:1px solid rgba(90,80,60,.28);padding-left:.5em;margin:0 0 1.6em 0;}
  .page blockquote{
    margin:1.2em .4em;padding:0 1em;color:#4b4335;font-size:.94em;
    border-left:2px solid rgba(120,100,60,.4);
  }
  body.vert .page blockquote{
    margin:.4em 1.2em;padding:1em 0;border-left:none;
    border-top:2px solid rgba(120,100,60,.4);
  }
  .sep{margin:1.5em auto;width:34%;height:0;border-top:1px solid rgba(90,80,60,.3);}
  body.vert .sep{margin:auto 1.5em;height:34%;width:0;border-top:none;border-left:1px solid rgba(90,80,60,.3);}
  .endmark{margin:2em 0 0;text-align:center;letter-spacing:.6em;color:var(--ink-soft);text-indent:0;}
  strong{font-weight:700;}
  body.vert strong{
    text-emphasis:filled dot var(--ink);-webkit-text-emphasis:filled dot var(--ink);
    font-weight:inherit;
  }
  em{font-style:normal;color:var(--ink-soft);}

  /* ---- cover ---- */
  .cover{display:flex;align-items:center;justify-content:center;height:100%;max-height:100%;}
  .cover-in{text-align:center;max-width:100%;}
  body.vert .cover-in{writing-mode:vertical-rl;height:100%;max-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;}
  .cover h1{
    margin:0;font-size:min(6.6vh,8.2vw,50px);font-weight:400;
    letter-spacing:.22em;line-height:1.45;text-indent:0;
  }
  body.vert .cover h1{max-height:100%;}
  .cover .sub{margin-top:1.4em;font-size:.86em;letter-spacing:.34em;color:var(--ink-soft);}
  body.vert .cover .sub{margin:1.4em 0 0;}
  .cover .pillar{margin-top:2.2em;}
  body.vert .cover .pillar{margin:2.2em 0 0;}
  .cover .pillar svg{max-height:22vh;}

  /* ---- tap zones + footer ---- */
  .zone{position:absolute;top:0;bottom:0;width:34%;border:none;background:none;cursor:pointer;padding:0;}
  .zone.l{left:0;} .zone.r{right:0;}
  .zone:focus-visible{outline:1.5px dashed var(--shu);outline-offset:-6px;}
  .foot{
    flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;
    padding:8px 18px calc(env(safe-area-inset-bottom) + 8px);
    font-size:11.5px;letter-spacing:.14em;color:#514936;
  }
  .foot span{opacity:.85;}

  /* ---- sheets ---- */
  .sheet{
    position:fixed;inset:0;z-index:20;display:none;
    background:rgba(40,34,24,.5);backdrop-filter:blur(2px);
  }
  .sheet.open{display:block;}
  .sheet-in{
    position:absolute;left:0;right:0;bottom:0;max-height:76%;overflow:auto;
    background:var(--paper);padding:22px 22px calc(env(safe-area-inset-bottom) + 26px);
    border-radius:2px 2px 0 0;
  }
  .sheet h3{margin:0 0 16px;font-size:14px;letter-spacing:.24em;font-weight:600;color:#4a4335;}
  .toc-item{
    display:flex;justify-content:space-between;gap:14px;width:100%;
    font:inherit;font-size:15px;text-align:left;background:none;border:none;
    padding:11px 0;border-bottom:1px solid rgba(90,80,60,.18);color:var(--ink);cursor:pointer;
  }
  .toc-item .pg{font-size:11px;color:var(--ink-soft);letter-spacing:.1em;flex:0 0 auto;}
  .toc-item[aria-current="true"]{color:var(--shu);}
  .row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid rgba(90,80,60,.18);}
  .row:last-child{border-bottom:none;}
  .row .lab{font-size:14px;letter-spacing:.1em;}
  .seg{display:flex;border:1px solid rgba(90,80,60,.4);}
  .seg button{
    font:inherit;font-size:13px;padding:7px 15px;background:none;border:none;cursor:pointer;color:#4a4335;
    border-left:1px solid rgba(90,80,60,.25);
  }
  .seg button:first-child{border-left:none;}
  .seg button[aria-pressed="true"]{background:#4a4335;color:var(--paper);}
  .close{margin-top:20px;width:100%;font:inherit;font-size:13px;letter-spacing:.2em;padding:12px;background:none;border:1px solid rgba(90,80,60,.4);cursor:pointer;color:#4a4335;}

  #measure{position:fixed;top:-99999px;left:0;visibility:hidden;pointer-events:none;}

  /* ---- 電子版デザイン ---- */
  .page .opener{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#f1ece0;writing-mode:horizontal-tb;}
  .page .opener img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;}
  .sep{display:flex;align-items:center;justify-content:center;border:none !important;margin:1.4em auto;width:auto;height:auto;}
  body.vert .sep{margin:auto 1.3em;width:auto;height:auto;}
  body:not(.vert) .sep svg{transform:rotate(-90deg);}
  body.vert .sep svg{transform:none;}

  /* ---- 目次ページ・しおり ---- */
  .bar button{white-space:nowrap;flex:0 0 auto;}
  .ruler .rn{white-space:nowrap;flex:0 0 auto;}
  .ruler{min-width:0;} .ruler svg{min-width:0;}
  .bar{gap:10px;}
  .tocpage{position:relative;z-index:3;pointer-events:none;display:flex;flex-direction:column;gap:.45em;height:100%;}
  body.vert .tocpage{padding-top:0;}
  .tocpage h2{margin:0 0 .5em;border:none !important;padding:0 !important;font-size:1.05em;letter-spacing:.5em;}
  .tocpage .ti{display:flex;align-items:center;gap:.5em;font:inherit;background:none;border:none;padding:0;margin:0;color:var(--ink);cursor:pointer;text-align:start;line-height:1.3;}
  .tocpage .tb{pointer-events:auto;display:flex;align-items:center;gap:.5em;font:inherit;background:none;border:none;padding:.1em;margin:0;color:inherit;cursor:pointer;line-height:1.3;}
  .tocpage .tb:focus-visible{outline:1.5px solid var(--shu);outline-offset:2px;}
  .tocpage .tb:active .t{color:var(--shu);}
  .tocpage .ti .n{color:var(--ink-soft);font-size:.85em;letter-spacing:.2em;flex:0 0 auto;}
  .tocpage .ti .t{flex:0 1 auto;}
  .tocpage .ti .d{flex:1 1 auto;min-width:1em;min-height:1em;border:0 dotted rgba(90,80,60,.45);}
  body:not(.vert) .tocpage .ti .d{border-bottom-width:1px;}
  body.vert .tocpage .ti .d{border-left-width:1px;}
  .tocpage .ti .p{display:inline-block;writing-mode:horizontal-tb;font-size:.72em;color:var(--ink-soft);letter-spacing:.05em;flex:0 0 auto;}
  .page.marked::after{content:"";position:absolute;top:14px;right:18px;width:40px;height:14px;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2040%2014%22%3E%3Cg%20fill%3D%22%236e7478%22%3E%3Cellipse%20cx%3D%2214%22%20cy%3D%227%22%20rx%3D%228.2%22%20ry%3D%224.3%22%20transform%3D%22rotate%28-6%2014%207%29%22%2F%3E%3Cellipse%20cx%3D%2228.5%22%20cy%3D%227.4%22%20rx%3D%223.6%22%20ry%3D%223.2%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E") no-repeat center/contain;z-index:4;pointer-events:none;opacity:.95;}
  body.spread.vert #pageB.marked::after, body.spread:not(.vert) #pageA.marked::after{right:auto;left:22px;}
  #bmBtn[aria-pressed="true"]{color:var(--shu);}
  .foot .bmjump{font:inherit;font-size:11px;letter-spacing:.14em;background:none;border:1px solid rgba(168,64,44,.55);color:var(--shu);padding:3px 10px;cursor:pointer;margin:0 8px;}
  .foot .bmjump[hidden]{display:none;}
  .sheet .bm-item{width:100%;text-align:left;font:inherit;font-size:13px;letter-spacing:.12em;background:none;border:1px solid rgba(168,64,44,.5);color:var(--shu);padding:10px 12px;margin:0 0 14px;cursor:pointer;}
  .sheet .bm-item[hidden]{display:none;}

  /* 縦書きのとき、算用数字を立てる（縦中横） */
  body.vert .tcy{text-combine-upright:all;-webkit-text-combine:horizontal;}
  /* 傍点 */
  em.bt{font-style:normal;-webkit-text-emphasis:filled sesame;text-emphasis:filled sesame;-webkit-text-emphasis-position:over right;text-emphasis-position:over right;}
  /* 目盛りが十四から0へ */
  #rulerSvg .kt{opacity:.35;}
  #rulerSvg .kt.passed{opacity:1;}
  #kmark path{fill:var(--pencil);}
  #kmark{transition:transform .35s cubic-bezier(.3,.7,.3,1);}
  #rulerSvg .num.kz.fin{fill:var(--shu);font-weight:700;}
  @media (prefers-reduced-motion:reduce){#kmark{transition:none;}}
  /* 札が五枚めくれる */
  #rulerSvg .back{fill:none;stroke:#5c5343;stroke-width:1;opacity:.5;}
  #rulerSvg .backline{stroke:#5c5343;stroke-width:1;opacity:.35;}
  #rulerSvg .face,#rulerSvg .pip{opacity:0;}
  #rulerSvg .card.on .back,#rulerSvg .card.on .backline{opacity:0;}
  #rulerSvg .card.on .face{opacity:1;fill:#efeade;stroke:var(--pencil);stroke-width:1.1;}
  #rulerSvg .card.on .pip{opacity:1;fill:var(--pencil);}
  #rulerSvg .card.on.fin .pip{fill:var(--shu);}
  #rulerSvg .card.on.fin .face{stroke:var(--shu);}
  #rulerSvg .card.flip{animation:cardflip .46s ease-in-out;}
  @keyframes cardflip{0%{transform:scaleX(1);}50%{transform:scaleX(.06);}100%{transform:scaleX(1);}}
  @media (prefers-reduced-motion:reduce){#rulerSvg .card.flip{animation:none;}}
  #homeLink{font:inherit;font-size:inherit;letter-spacing:.14em;color:var(--ink-soft);text-decoration:none;white-space:nowrap;flex:0 0 auto;}
  #homeLink:hover,#homeLink:focus-visible{color:var(--ink);}
  #homeLink[hidden]{display:none;}
  .nextnav{margin:2.4em 0 0;text-align:center;text-indent:0;line-height:2;}
  .nextnav .lead{display:block;font-size:.8em;letter-spacing:.3em;color:var(--ink-soft);}
  .nextnav a{display:inline-block;margin-top:.4em;padding:.35em 1.1em;border:1px solid rgba(168,64,44,.55);color:var(--shu);
    text-decoration:none;letter-spacing:.12em;font-size:.95em;}
  .nextnav a + a{margin-left:.8em;}
  .page .opener.cov{overflow:hidden;}
  .page .opener.cov .covbg{position:absolute;left:-12px;right:-12px;height:52%;background-repeat:no-repeat;background-size:100% 4000%;filter:blur(6px);}
  .page .opener.cov .covbg.t{top:-12px;background-position:center top;}
  .page .opener.cov .covbg.b{bottom:-12px;background-position:center bottom;}
  .page .opener.cov img{position:relative;
    -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 4%,#000 96%,transparent 100%);
            mask-image:linear-gradient(180deg,transparent 0,#000 4%,#000 96%,transparent 100%);}
  .page .opener.cov.lr .covbg{top:-12px;bottom:-12px;height:auto;width:52%;background-size:4000% 100%;}
  .page .opener.cov.lr .covbg.t{left:-12px;right:auto;background-position:left center;}
  .page .opener.cov.lr .covbg.b{right:-12px;left:auto;bottom:-12px;background-position:right center;}
  .page .opener.cov.lr img{
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 3%,#000 97%,transparent 100%);
            mask-image:linear-gradient(90deg,transparent 0,#000 3%,#000 97%,transparent 100%);}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#cbc3ad">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="8センチメートル">
</head>
<body class="vert">
<div id="app">
  <div class="bar">
    <a id="homeLink" href="index.html" hidden>ほかの本</a>
    <button id="tocBtn" aria-haspopup="dialog">目次</button>
    <div class="ruler" aria-hidden="true">
            <svg id="rulerSvg" viewBox="0 0 300 26" preserveAspectRatio="xMidYMid meet"></svg>
          </div>
    <button id="bmBtn" aria-pressed="false" aria-label="このページにしおりをはさむ">しおり</button>
    <button id="setBtn" aria-haspopup="dialog">表示</button>
  </div>

  <div id="book">
    <div class="spread">
      <section class="page" id="pageA" aria-live="polite"><div class="col"></div></section>
      <section class="page" id="pageB"><div class="col"></div></section>
    </div>
    <button class="zone l" id="zoneL" aria-label="前後のページ"></button>
    <button class="zone r" id="zoneR" aria-label="前後のページ"></button>
  </div>

  <div class="foot">
    <span id="chapNow"></span>
    <button class="bmjump" id="bmJump" type="button" hidden>しおりへ</button>
    <span id="pageNow"></span>
  </div>
</div>

<div class="sheet" id="tocSheet" role="dialog" aria-label="目次">
  <div class="sheet-in">
    <h3>目次</h3>
    <button class="bm-item" id="bmItem" type="button" hidden>しおりのページへ</button>
    <div id="tocList"></div>
    <button class="close" data-close>閉じる</button>
  </div>
</div>

<div class="sheet" id="setSheet" role="dialog" aria-label="表示設定">
  <div class="sheet-in">
    <h3>表示</h3>
    <div class="row">
      <span class="lab">組み方</span>
      <div class="seg" id="dirSeg">
        <button data-dir="v" aria-pressed="true">縦書き</button>
        <button data-dir="h" aria-pressed="false">横書き</button>
      </div>
    </div>
    <div class="row">
      <span class="lab">文字の大きさ</span>
      <div class="seg" id="sizeSeg">
        <button data-size="0" aria-pressed="false">小</button>
        <button data-size="1" aria-pressed="true">中</button>
        <button data-size="2" aria-pressed="false">大</button>
      </div>
    </div>
    <button class="close" data-close>閉じる</button>
  </div>
</div>

<script>
const DATA = {"title": "0センチメートル　北", "sub": "手と手のあいだ", "blocks": [{"t": "opener", "i": 0, "alt": "序章　二枚の紙"}, {"t": "p", "h": "坂の下である。"}, {"t": "p", "h": "からから、からから。"}, {"t": "p", "h": "車輪の音が、坂の上から下りてきた。"}, {"t": "p", "h": "安藤は、霜の上に座ったまま、顔を上げた。"}, {"t": "p", "h": "荷車が、坂の半ばで速さを落とした。乾電池の車輪が、霜に二本の筋を引いてくる。指でなでつけた細い筋を、まっすぐに横切っていく。"}, {"t": "p", "h": "ひょろりと背の高い男が、御者台から降りた。"}, {"t": "p", "h": "ラリオである。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ラリオは、安藤の前に立った。"}, {"t": "p", "h": "にこにこしていた。"}, {"t": "p", "h": "「……だれ?」"}, {"t": "p", "h": "安藤は、立ち上がった。背筋を伸ばした。"}, {"t": "p", "h": "「安藤直之」"}, {"t": "p", "h": "十二度目だった。"}, {"t": "p", "h": "「あー」"}, {"t": "p", "h": "ラリオは、うなずいた。それから、首をかしげた。"}, {"t": "p", "h": "去年と、同じ顔だった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "安藤は、腰の袋の口を開けた。"}, {"t": "p", "h": "紙が二枚、重なっていた。"}, {"t": "p", "h": "一枚は、帳面から破った紙だった。罫の上に、言葉のあいだを空けたひらがなが並んでいる。"}, {"t": "p", "h": "もう一枚は、小さく畳んであった。角が、丸くなっていた。"}, {"t": "p", "h": "二枚とも、出した。"}, {"t": "p", "h": "「届け物だ」"}, {"t": "p", "h": "「あー。荷物」ラリオは、両手を出した。「運ぶよ」"}, {"t": "p", "h": "安藤は、二枚をその手に載せた。"}, {"t": "p", "h": "「どこ?」"}, {"t": "p", "h": "安藤は、少し黙った。"}, {"t": "p", "h": "「……届け先は、おまえが知っている、と聞いた」"}, {"t": "p", "h": "ラリオは、紙を見た。裏返して、また表に戻した。それから、空を見た。"}, {"t": "p", "h": "「あー」ラリオは言った。「足が、知ってる」"}, {"t": "p", "h": "紙を、上着の内側に入れた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "荷車が、坂を上っていった。"}, {"t": "p", "h": "からから、からから。"}, {"t": "p", "h": "音が、角を曲がって、聞こえなくなった。"}, {"t": "p", "h": "安藤は、袋の口を閉じた。袋は、軽くなっていた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "安藤は、坂の上へは行かなかった。"}, {"t": "p", "h": "裏口の脇から、細い道に入った。人間の家の壁と、溝のあいだの道である。"}, {"t": "p", "h": "排水口を、一つ過ぎた。"}, {"t": "p", "h": "二つ過ぎた。"}, {"t": "p", "h": "三つ目の手前に、靴が一つ、落ちていた。"}, {"t": "p", "h": "右の靴だった。"}, {"t": "p", "h": "靴の上に、霜が降りていた。爪先にも、かかとにも、白く。"}, {"t": "p", "h": "安藤は、しゃがんだ。"}, {"t": "p", "h": "指で、霜を払った。"}, {"t": "p", "h": "爪先から、かかとへ。もう一度、爪先から。"}, {"t": "p", "h": "一年、だれも払っていなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "坂の下に戻った。"}, {"t": "p", "h": "霜の上に、指でなでつけた筋がある。その上を、荷車の轍が二本、横切っている。"}, {"t": "p", "h": "安藤は、同じ場所に座った。"}, {"t": "p", "h": "足もとを見た。"}, {"t": "p", "h": "片方は靴の跡で、片方は素足の跡だった。"}, {"t": "p", "h": "<strong>安藤は、自分の跡を、消さなかった。</strong>"}, {"t": "opener", "i": 1, "alt": "第一章　罫の紙"}, {"t": "p", "h": "みちるの家の台所には、食器棚がある。"}, {"t": "p", "h": "その裏の、壁との隙間が、よしゆきとネネの住まいだった。"}, {"t": "p", "h": "うろこ堂を出て、一年になる。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "朝、床下で、かたん、と音がした。"}, {"t": "p", "h": "よしゆきは、寝台から起き上がった。"}, {"t": "p", "h": "人間のマッチ箱である。うろこ堂を出る前の日、みちるが自分の箱のいちばん上に置いていったものだ。中身を出して、布の切れはしを敷くと、うろこ堂の寝台と同じ大きさになった。"}, {"t": "p", "h": "床板の隙間から、細長い男が、上半身だけ出していた。"}, {"t": "p", "h": "「あー。いた」ラリオは言った。「……たぶん」"}, {"t": "p", "h": "「おはよう、ラリオ」"}, {"t": "p", "h": "「おはよう」ラリオは言った。「えっと。よしゆきって人、いる?」"}, {"t": "p", "h": "「おれだよ」"}, {"t": "p", "h": "「ほんとに?」"}, {"t": "p", "h": "「ほんとに」"}, {"t": "p", "h": "ラリオは、上着の内側から、紙を二枚出した。"}, {"t": "p", "h": "一枚を、よしゆきに渡した。"}, {"t": "p", "h": "もう一枚を持ったまま、首をかしげた。"}, {"t": "p", "h": "食器棚の奥を見た。ネネが、毛糸の切れはしにくるまって、まだ眠っていた。"}, {"t": "p", "h": "「こっちは、あっちの人、かな」ラリオは言った。「……たぶん」"}, {"t": "p", "h": "畳んだ紙を、ネネの枕もとに置いた。"}, {"t": "p", "h": "かたん、と音がして、床板の隙間は暗くなった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "よしゆきは、紙を開いた。"}, {"t": "p", "h": "帳面から破った紙だった。罫の上に、米粒ほどの字が、言葉のあいだを空けて並んでいた。"}, {"t": "quote", "h": "よしゆき　さんへ<br><br>てがみ　よみました。なんかいも。<br><br>もやすひとが　います。<br>でも　ぼくは　かきます。<br><br>ぼくも　まって　います。<br><br>ソラ"}, {"t": "p", "h": "一度、読んだ。"}, {"t": "p", "h": "もう一度、読んだ。"}, {"t": "p", "h": "二度目のほうが、長かった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "「なんかいも」のところで、指が止まった。"}, {"t": "p", "h": "ナオ吉に託した一枚は、届いたらしかった。"}, {"t": "p", "h": "指を、次の行へ動かした。"}, {"t": "p", "h": "<strong>もやすひとが　います。</strong>"}, {"t": "p", "h": "うろこ堂が閉まるまでに、よしゆきは七百五十枚を書いた。売られていく本の頁に、一枚ずつ挟んできた。"}, {"t": "p", "h": "ソラから返事が来たのは、これで二度目だった。"}, {"t": "p", "h": "よしゆきは、紙を膝に置いた。"}, {"t": "p", "h": "指先を見た。鉛筆の粉が、爪の際に残っていた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "「ソラかい」"}, {"t": "p", "h": "食器棚の奥で、ネネが毛糸の中から顔を出していた。"}, {"t": "p", "h": "「うん」"}, {"t": "p", "h": "「なんて」"}, {"t": "p", "h": "よしゆきは、少し黙った。"}, {"t": "p", "h": "「燃やす人が、いるって」"}, {"t": "p", "h": "ネネは、毛糸の中に、顔を戻した。"}, {"t": "p", "h": "枕もとの紙には、まだ気づいていなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "その夜、よしゆきは、マッチ箱の引き出しを開けた。"}, {"t": "p", "h": "ソラの手紙を、中に入れた。"}, {"t": "p", "h": "閉めた。"}, {"t": "p", "h": "また、開けた。"}, {"t": "p", "h": "もう一度、読んだ。"}, {"t": "p", "h": "マッチ箱の寝台に、横になった。"}, {"t": "p", "h": "目を閉じると、頭のてっぺんに、なにかが当たっていた。"}, {"t": "p", "h": "手のひらだった。大きくて、少し重かった。"}, {"t": "p", "h": "いつのことかは、わからなかった。だれの手かも。"}, {"t": "p", "h": "本で読んだことなのかもしれなかった。"}, {"t": "p", "h": "南の町のどこかで、だれかが、手紙を燃やしている。"}, {"t": "p", "h": "<strong>どこへ行けばいいのかは、まだわからなかった。</strong>"}, {"t": "opener", "i": 2, "alt": "第二章　枕もとの便り"}, {"t": "p", "h": "ネネが目を覚ますと、枕もとに紙があった。"}, {"t": "p", "h": "小さく畳んである。"}, {"t": "p", "h": "ネネは、しばらく、それを見ていた。"}, {"t": "p", "h": "それから、手を伸ばした。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "紙は、湿気を吸ったことがあるらしかった。広げようとすると、折り目のところで、すぐに丸まりかえった。"}, {"t": "p", "h": "ネネは、杖を取った。"}, {"t": "p", "h": "爪楊枝である。"}, {"t": "p", "h": "紙の上のはしに、杖を横にして置いた。下のはしを、手のひらで押さえた。"}, {"t": "p", "h": "紙は、ようやく平らになった。"}, {"t": "quote", "h": "村の皆へ<br><br>南に着いた。<br>十八人、皆、達者だ。<br>春になったら、また便りを出す。"}, {"t": "p", "h": "その下に、名前が並んでいた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ネネは、指を伸ばした。"}, {"t": "p", "h": "一つ目の名前の上に、置いた。"}, {"t": "p", "h": "知っている名前だった。"}, {"t": "p", "h": "二つ目。三つ目。"}, {"t": "p", "h": "指は、名前を一つずつ、ゆっくり下りていった。"}, {"t": "p", "h": "止まらなかった。どの名前も、知っていた。"}, {"t": "p", "h": "指が、紙の下のはしに着いた。"}, {"t": "p", "h": "十八。"}, {"t": "p", "h": "ネネは、指を、紙の上に戻した。"}, {"t": "p", "h": "もう一度、はじめから下りた。"}, {"t": "p", "h": "十八だった。"}, {"t": "p", "h": "出ていったのは、十九人だった。丘の上から、見送った。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "「ネネさん」"}, {"t": "p", "h": "食器棚の裏から、よしゆきが顔を出した。"}, {"t": "p", "h": "「起きてたの」"}, {"t": "p", "h": "「起きてるよ」"}, {"t": "p", "h": "「それ、ラリオが置いてった。きのうの朝」"}, {"t": "p", "h": "「そうかい」"}, {"t": "p", "h": "よしゆきは、紙をのぞきこまなかった。食器棚の裏で、膝を抱えて座った。"}, {"t": "p", "h": "ネネは、紙に目を戻した。"}, {"t": "p", "h": "「達者だ、だってさ」"}, {"t": "p", "h": "ネネは言った。"}, {"t": "p", "h": "「南に着いたら、皆、達者だったんだと」"}, {"t": "p", "h": "よしゆきは、膝を抱えなおした。"}, {"t": "p", "h": "ネネは、紙から目を上げなかった。"}, {"t": "p", "h": "「春になったら、便りを出すってさ」"}, {"t": "p", "h": "ネネは、杖を持ち上げた。"}, {"t": "p", "h": "杖の先が、床を突いた。"}, {"t": "p", "h": "杖が離れた紙は、くるりと丸まった。"}, {"t": "p", "h": "よしゆきが、膝を伸ばした。丸まった紙を拾って、両手のひらで、そっとのばした。"}, {"t": "p", "h": "それを、ネネの手に載せた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ネネは、のばされた紙を見ていた。"}, {"t": "p", "h": "「よしゆき」"}, {"t": "p", "h": "「うん」"}, {"t": "p", "h": "「春は、何べんも来たよ」"}, {"t": "p", "h": "よしゆきは、ネネの杖の先を見ていた。"}, {"t": "p", "h": "ネネは、のばされた紙を、杖で押さえた。"}, {"t": "p", "h": "指で、名前を、はじめからなぞった。"}, {"t": "p", "h": "声には出さなかった。唇だけが、一つずつ動いた。"}, {"t": "p", "h": "十八。"}, {"t": "p", "h": "指は、紙の下のはしを過ぎて、床の上で止まった。"}, {"t": "p", "h": "そこには、なにも書いていなかった。"}, {"t": "p", "h": "<strong>十九人目の名前を、ネネは口に出さなかった。</strong>"}, {"t": "opener", "i": 3, "alt": "第三章　角砂糖のかけら"}, {"t": "p", "h": "喫茶ひだまりの朝は、角砂糖が降る。"}, {"t": "p", "h": "人間の客が、砂糖壺から取りそこねるからである。"}, {"t": "p", "h": "ヒロは、カウンターの下で、落ちてくるのを待った。"}, {"t": "p", "h": "一つ、落ちた。"}, {"t": "p", "h": "角砂糖は、ヒロの背丈の半分ほどある。両腕で抱えて、客用の棚のうしろまで運ぶ。転がしたほうが早いが、転がすと角が欠ける。欠けた角は、あとで拾いに行くのが面倒だった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "棚のうしろに戻ると、客が来ていた。"}, {"t": "p", "h": "よしゆきと、ラリオだった。"}, {"t": "p", "h": "「早えな」"}, {"t": "p", "h": "「ラリオの荷車で来た」"}, {"t": "p", "h": "ラリオは、棚板の上の帳面をのぞきこんでいた。カク爺の帳面である。"}, {"t": "p", "h": "「さわるでない」とカク爺が言った。"}, {"t": "p", "h": "「さわってないよ」"}, {"t": "p", "h": "「見るのも、さわるのうちじゃ」"}, {"t": "p", "h": "「あー」ラリオは、帳面から目を離した。「じゃあ、見てない」"}, {"t": "p", "h": "ヒロは、角砂糖を床に置いた。"}, {"t": "p", "h": "「なんの用だ」"}, {"t": "p", "h": "よしゆきは、紙を出した。帳面から破った紙だった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ヒロは、手紙を読んだ。"}, {"t": "p", "h": "カク爺も、読んだ。"}, {"t": "p", "h": "読み終えて、ヒロは紙を返した。"}, {"t": "p", "h": "「どうせ」とヒロは言った。「南の話だろ。オレたちには、関係ねえ」"}, {"t": "p", "h": "よしゆきは、首を振った。"}, {"t": "p", "h": "「燃やす人は、手紙のあるところに来る」"}, {"t": "p", "h": "「……それで?」"}, {"t": "p", "h": "「北にも、おれの手紙がある」"}, {"t": "p", "h": "カク爺が、帳面を開いた。指を、一本ずつ折った。"}, {"t": "p", "h": "「六百三十一枚」カク爺は言った。「売れた本に挟まって、出ていった。どこにあるかは、もうわからん」"}, {"t": "p", "h": "「一枚だけ、わかってるのがある」とよしゆきが言った。「うろこ堂の、第三段」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "「それにしたってよ」ヒロは言った。「燃やすやつが北にいるって、どうしてわかる」"}, {"t": "p", "h": "よしゆきは、紙を畳んだ。"}, {"t": "p", "h": "そのとき、ラリオが顔を上げた。"}, {"t": "p", "h": "「あのさ」"}, {"t": "p", "h": "「なんだ」"}, {"t": "p", "h": "「うろこ堂の坂、毎朝通るんだけどさ」ラリオは言った。「なんか、いつも、ここで止まるんだよね」"}, {"t": "p", "h": "ラリオは、自分の足を指さした。"}, {"t": "p", "h": "「坂の下で。足が」"}, {"t": "p", "h": "「止まる?」"}, {"t": "p", "h": "「うん。なんでかは、わかんない」ラリオは、自分の足を見た。「でも、止まる」"}, {"t": "p", "h": "ラリオの頭は忘れても、足は覚えている。ヒロは、それを知っていた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "よしゆきが、立ち上がった。"}, {"t": "p", "h": "「行く」"}, {"t": "p", "h": "ヒロは、角砂糖を見た。"}, {"t": "p", "h": "「どうせ、止めても行くんだろ」"}, {"t": "p", "h": "「うん」"}, {"t": "p", "h": "「じゃあ、止めねえ」"}, {"t": "p", "h": "ヒロは、角砂糖の角を、一つ欠いた。それを、よしゆきの前に突き出した。"}, {"t": "p", "h": "「持ってけ。腹が減ると、頭が回らねえ」"}, {"t": "p", "h": "よしゆきは、かけらを受け取った。"}, {"t": "p", "h": "手が、震えていた。"}, {"t": "p", "h": "カク爺は、帳面を閉じた。"}, {"t": "p", "h": "ラリオが、荷車のほうへ歩きだした。"}, {"t": "p", "h": "「どこ行くの?」"}, {"t": "p", "h": "「うろこ堂」とよしゆきが言った。"}, {"t": "p", "h": "「あー」ラリオは、うなずいた。「足が、知ってる」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "二人が出ていったあと、ヒロは、欠けた角砂糖を抱えて、棚のうしろに座った。"}, {"t": "p", "h": "角の欠けたところが、白く光っていた。"}, {"t": "p", "h": "一口かじった。"}, {"t": "p", "h": "<strong>……どうせ、オレも行くことになる。</strong>"}, {"t": "opener", "i": 4, "alt": "第四章　荷車の綱"}, {"t": "p", "h": "朝だ。"}, {"t": "p", "h": "ラリオは、荷車を押して、坂を上る。"}, {"t": "p", "h": "からから、からから。"}, {"t": "p", "h": "荷台に、よしゆきが乗っている。膝を抱えて、前を見ている。"}, {"t": "p", "h": "荷車の車輪は、人間の乾電池だ。二つ、横に寝かせて、真ん中に串を通してある。坂でも、ちゃんと回る。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "坂の下で、足が止まる。"}, {"t": "p", "h": "ラリオは、止めたつもりはない。止まる。"}, {"t": "p", "h": "「ここ?」とよしゆきが言う。"}, {"t": "p", "h": "「うん。ここ」"}, {"t": "p", "h": "よしゆきが、荷台から降りる。しゃがんで、地面を見る。"}, {"t": "p", "h": "霜が降りている。その上に、細い筋が何本もある。"}, {"t": "p", "h": "よしゆきは、それを長いこと見ている。"}, {"t": "p", "h": "ラリオも、見る。"}, {"t": "p", "h": "なんの筋かは、わからない。"}, {"t": "p", "h": "足は、まだ動かない。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "しばらくして、足が動く。"}, {"t": "p", "h": "坂を上る。裏口の戸の下に、隙間がある。荷車ごとは入れないので、荷車は戸のわきに置く。"}, {"t": "p", "h": "二人で、隙間をくぐる。"}, {"t": "p", "h": "中は、暗い。"}, {"t": "p", "h": "それから、少しずつ見えてくる。"}, {"t": "p", "h": "空っぽだ。"}, {"t": "p", "h": "棚が並んでいる。どの段にも、なにもない。床に、白い埃が積もっている。"}, {"t": "p", "h": "人間の匂いが、しない。"}, {"t": "p", "h": "「一年ぶり」とよしゆきが言う。"}, {"t": "p", "h": "「そうなの?」"}, {"t": "p", "h": "「うん」"}, {"t": "p", "h": "ラリオは、うなずく。一年って、どのくらいだろう。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "床の埃に、足を下ろす。"}, {"t": "p", "h": "足跡がつく。ラリオのと、よしゆきのと。"}, {"t": "p", "h": "よしゆきは、まっすぐ奥へ歩く。迷わない。"}, {"t": "p", "h": "本棚の前で、止まる。"}, {"t": "p", "h": "第三段の真ん中に、本が一冊だけ、寝かせて置いてある。表紙を上にして、まっすぐに。"}, {"t": "p", "h": "よしゆきが、本棚をよじのぼる。二段目で、手が止まる。棚板が、高い。"}, {"t": "p", "h": "ラリオは、戸のわきの荷車まで戻って、綱をほどいてくる。先を、よしゆきに渡す。"}, {"t": "p", "h": "「これ、つかまって」"}, {"t": "p", "h": "よしゆきは、綱をつかむ。ラリオが、下から引く。"}, {"t": "p", "h": "それから、ラリオも、うしろからのぼる。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "本は、大きい。"}, {"t": "p", "h": "人間の本は、どれも大きい。表紙一枚が、二人で寝ころべるくらいある。"}, {"t": "p", "h": "よしゆきは、表紙を開けない。"}, {"t": "p", "h": "本の横に回る。頁の端が、何百枚も重なって、白い壁みたいになっているところだ。"}, {"t": "p", "h": "その壁の真ん中あたりに、なにか、はみ出している。"}, {"t": "p", "h": "小さい。白い。紙の角だ。"}, {"t": "p", "h": "よしゆきは、その角を、指でさわる。"}, {"t": "p", "h": "引き出さない。"}, {"t": "p", "h": "さわったまま、しばらく動かない。"}, {"t": "p", "h": "「それ、なに?」"}, {"t": "p", "h": "「手紙」"}, {"t": "p", "h": "「だれの?」"}, {"t": "p", "h": "よしゆきは、少し黙る。"}, {"t": "p", "h": "「……まだ、だれのでもない」"}, {"t": "p", "h": "ラリオは、うなずく。だれのでもない手紙なら、だれかが読む。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "本棚を降りる。"}, {"t": "p", "h": "奥の壁に、隙間がある。その奥に、柱がある。"}, {"t": "p", "h": "鉛筆の線が二本ある。そのあいだに、字が並んでいる。"}, {"t": "p", "h": "よしゆきは、柱の前で、少しだけ止まる。"}, {"t": "p", "h": "それから、手を伸ばす。字には、さわらない。柱の、なにも書いていないところに、手のひらを当てる。"}, {"t": "p", "h": "ラリオは、うしろで待つ。"}, {"t": "p", "h": "待つのは、得意だ。たぶん。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "外に出る。"}, {"t": "p", "h": "日が、高くなっている。坂の霜は、もう半分溶けている。"}, {"t": "p", "h": "荷車のところへ行く前に、ラリオは振り返る。"}, {"t": "p", "h": "隙間の奥の、床の埃。"}, {"t": "p", "h": "<strong>足跡が、二人ぶん、残っている。</strong>"}, {"t": "p", "h": "ラリオは、それを消さない。"}, {"t": "p", "h": "消すものだとは、思わない。"}, {"t": "opener", "i": 5, "alt": "第五章　布の切れはし"}, {"t": "p", "h": "北に着いて、八日目の朝だった。"}, {"t": "p", "h": "安藤は、坂の下にいた。"}, {"t": "p", "h": "坂の下の、人間の植木鉢の陰である。割れた鉢で、土だけが残っている。そこからなら、坂の上の裏口が見える。坂を上り下りする者からは、見えない。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "日が出る前に、荷車の音がした。"}, {"t": "p", "h": "からから、からから。"}, {"t": "p", "h": "荷車は、植木鉢の前を通りすぎた。ラリオは、前だけを見ていた。"}, {"t": "p", "h": "坂の下で、荷車が止まった。少しして、また動いた。"}, {"t": "p", "h": "坂の上で、音が角を曲がった。"}, {"t": "p", "h": "安藤は、植木鉢の陰から出なかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "きのうの朝、裏口の戸の下へ、二人が入っていった。ラリオと、もう一人だった。"}, {"t": "p", "h": "もう一人の背中は、知っていた。南の賭場で、札の前に立っていた若い男だった。"}, {"t": "p", "h": "二人は、日が高くなってから出てきた。ラリオが、振り返った。"}, {"t": "p", "h": "安藤は、それも見ていた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "空が、白くなりはじめた。"}, {"t": "p", "h": "坂の上で、戸の下の隙間が、かすかに鳴った。"}, {"t": "p", "h": "だれかが、外から、隙間の前に来ていた。"}, {"t": "p", "h": "小さき者だった。背は、安藤と同じくらいだった。"}, {"t": "p", "h": "その者は、隙間の前でしゃがんだ。中をのぞいた。"}, {"t": "p", "h": "それから、隙間の中へ入っていった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "安藤は、植木鉢の陰で、動かなかった。"}, {"t": "p", "h": "日が、坂の上から差してきた。"}, {"t": "p", "h": "戸の下の隙間が、また鳴った。"}, {"t": "p", "h": "その者が、出てきた。"}, {"t": "p", "h": "坂を下りはじめた。霜の上に、足跡がひとつずつ増えていった。"}, {"t": "p", "h": "坂の半ばで、止まった。"}, {"t": "p", "h": "振り返った。"}, {"t": "p", "h": "坂の上ではなく、自分の足もとを見ていた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "その者は、しゃがんだ。"}, {"t": "p", "h": "いま来た跡のほうへ、手を伸ばした。指をそろえて、霜をなでた。足跡のふちが崩れて、平らになった。"}, {"t": "p", "h": "ひとつ消すと、一歩、下がった。"}, {"t": "p", "h": "また、なでた。"}, {"t": "p", "h": "また、一歩、下がった。"}, {"t": "p", "h": "坂の下に着くまで、それを続けた。"}, {"t": "p", "h": "霜の上には、指の細い筋だけが残った。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "その者が、立ち上がった。"}, {"t": "p", "h": "男だった。背が、丸かった。懐のところが、少しふくらんでいた。"}, {"t": "p", "h": "男は、坂の下の霜を見た。"}, {"t": "p", "h": "植木鉢のそばに、跡があった。片方は靴の跡で、片方は素足の跡だった。"}, {"t": "p", "h": "男は、その跡をたどって、植木鉢の陰を見た。"}, {"t": "p", "h": "安藤と、目が合った。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "「……残すな」"}, {"t": "p", "h": "男は、それだけ言った。"}, {"t": "p", "h": "声は低かった。"}, {"t": "p", "h": "安藤は、立ち上がった。背筋を伸ばした。"}, {"t": "p", "h": "なにも言わなかった。"}, {"t": "p", "h": "腰の袋から、布の切れはしを出した。"}, {"t": "p", "h": "男の前に、差し出した。"}, {"t": "p", "h": "男は、自分の指を見た。霜をなでつけた指先が、赤くなっていた。"}, {"t": "p", "h": "少しのあいだ、動かなかった。"}, {"t": "p", "h": "それから、布を受け取った。"}, {"t": "p", "h": "安藤は、自分の足もとの跡を、消さなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "男は、安藤の前を通りすぎた。"}, {"t": "p", "h": "用水路のほうへ、歩いていった。"}, {"t": "p", "h": "角のところで、止まった。"}, {"t": "p", "h": "一度だけ、足もとを振り返った。"}, {"t": "p", "h": "それから、見えなくなった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "安藤は、植木鉢の陰に戻らなかった。"}, {"t": "p", "h": "坂の下の、霜の上に座りなおした。"}, {"t": "p", "h": "裏口の戸が、まっすぐ見えるところだった。"}, {"t": "p", "h": "<strong>坂を上り下りする者からも、見えるところだった。</strong>"}, {"t": "opener", "i": 6, "alt": "第六章　鉛筆の芯"}, {"t": "p", "h": "二十日目の朝、カク爺は、新聞の切れはしに線を一本足した。"}, {"t": "p", "h": "喫茶ひだまりの、客用の棚のうしろである。床に敷いた切れはしの、人間の字の上に、鉛筆の縦の線が並んでいる。"}, {"t": "p", "h": "十四本。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "線を足すのは、よしゆきが来たあとと決めている。"}, {"t": "p", "h": "よしゆきは、毎朝、ラリオの荷車でうろこ堂の坂へ行く。帰りに、ひだまりの床下へ寄る。"}, {"t": "p", "h": "その朝も、床板の隙間から顔を出した。"}, {"t": "p", "h": "「まだ、ある」"}, {"t": "p", "h": "「足跡は、また消されてた」"}, {"t": "p", "h": "「坂の下に、まだ座ってた」"}, {"t": "p", "h": "それだけ言って、すぐに引っこんだ。"}, {"t": "p", "h": "カク爺は、線を一本足した。"}, {"t": "p", "h": "第三段の本の手紙が、まだそこにある日の数である。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "もう一つ、別の切れはしに、線が並んでいる。"}, {"t": "p", "h": "十三本。"}, {"t": "p", "h": "こちらは、よしゆきの三つ目の言葉で足す線である。"}, {"t": "p", "h": "坂の下に座っている、片方だけ靴を履いた男のことだった。よしゆきは、名前を知らない。カク爺は、知っている。言わなかった。"}, {"t": "p", "h": "その男の冬の来訪を、カク爺は何年も数えてきた。北に着いて、坂の下に座っている日を数えるのは、今年がはじめてだった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "十日目の朝、カク爺は、一度だけ、ラリオの荷車に乗った。"}, {"t": "p", "h": "坂の下で、荷車が止まった。"}, {"t": "p", "h": "霜の上に、片方だけ靴を履いた男が座っていた。"}, {"t": "p", "h": "カク爺は、荷台から降りなかった。"}, {"t": "p", "h": "男も、顔を上げなかった。"}, {"t": "p", "h": "カク爺は、男の右の素足を見ていた。"}, {"t": "p", "h": "「……行くぞ」"}, {"t": "p", "h": "ラリオが、荷車を押した。"}, {"t": "p", "h": "帰りの荷台で、カク爺は、帳面を開かなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "昼すぎ、カウンターの下から、ヒロが角砂糖を抱えて戻ってきた。"}, {"t": "p", "h": "カク爺は、帳面を開いた。"}, {"t": "p", "h": "「よいか諸君」"}, {"t": "p", "h": "諸君は、ヒロひとりだった。"}, {"t": "p", "h": "「待つというのはの、相場でいえば、張ったまま動かんことじゃ。張ったまま動かん者は、二つに分かれる。勝ちを待つ者と、負けを認められん者じゃ。この二つは、外から見ると、まったく同じ顔をしとる」"}, {"t": "p", "h": "「じいさん」"}, {"t": "p", "h": "「なんじゃ」"}, {"t": "p", "h": "「腹が減った」"}, {"t": "p", "h": "ヒロは、角砂糖を抱えて、棚の奥へ入っていった。"}, {"t": "p", "h": "カク爺は、帳面から顔を上げなかった。"}, {"t": "p", "h": "「……じゃから、見分けるには、日数を数えるほかない。勝ちを待つ者は、日数とともに、張りを減らす。負けを認められん者は――」"}, {"t": "p", "h": "棚の奥から、角砂糖をかじる音がした。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "夕方、ラリオが床下から顔を出した。"}, {"t": "p", "h": "「あー。いた」"}, {"t": "p", "h": "ラリオは、鉛筆の芯を差し出した。"}, {"t": "p", "h": "「これ、落ちてた。だれの?」"}, {"t": "p", "h": "「わしのじゃ」"}, {"t": "p", "h": "カク爺は、受け取った。けさ、線を引いたあと、どこへやったかわからなくなっていた芯だった。"}, {"t": "p", "h": "帳面は、開いたままだった。"}, {"t": "p", "h": "「ちょうどよい。さっきの続きじゃが」"}, {"t": "p", "h": "「さっき?」"}, {"t": "p", "h": "「負けを認められん者はの、日数とともに、張りを増やす。取り返そうとするからじゃ。じゃから、十三日も坂の下に座っておる男は――」"}, {"t": "p", "h": "ラリオは、にこにこして聞いていた。"}, {"t": "p", "h": "それから、首をかしげた。"}, {"t": "p", "h": "「なんの話だっけ」"}, {"t": "p", "h": "「……坂の下の男の話じゃ」"}, {"t": "p", "h": "「坂の下?」ラリオは、自分の足を見た。「あー。うん」"}, {"t": "p", "h": "床板の隙間が、かたん、と鳴った。"}, {"t": "p", "h": "ラリオは、もういなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "夜になった。"}, {"t": "p", "h": "店主が、床を掃きはじめた。入口から窓ぎわへ。窓ぎわから、カウンターの下へ。"}, {"t": "p", "h": "掃く音が近づくと、カク爺は、棚のさらに奥へ移った。"}, {"t": "p", "h": "帳面は、膝の上に開いたままだった。"}, {"t": "p", "h": "「……そういう者はの、最後に、自分で張りを下ろすほかない。だれにも、下ろさせてはもらえん」"}, {"t": "p", "h": "言い終えた。"}, {"t": "p", "h": "棚の奥で、ヒロの寝息がしていた。"}, {"t": "p", "h": "カク爺は、顔を上げた。"}, {"t": "p", "h": "「聞いてるか」"}, {"t": "p", "h": "返事は、なかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "カク爺は、帳面を閉じた。"}, {"t": "p", "h": "新聞の切れはしを、もう一枚、引き寄せた。"}, {"t": "p", "h": "三つ目の切れはしだった。"}, {"t": "p", "h": "そこには、まだ一本も線がない。"}, {"t": "p", "h": "ひだまりに来てから、最後まで聞いた者の数である。"}, {"t": "p", "h": "<strong>今日も、一本も足さなかった。</strong>"}, {"t": "opener", "i": 7, "alt": "第七章　一粒"}, {"t": "p", "h": "綱を握った手の中で、左手の指が、また一本、伸びた。"}, {"t": "p", "h": "十八日目の朝だった。"}, {"t": "p", "h": "荷車は、北の町に入っていた。"}, {"t": "p", "h": "前で綱を引いているのは、ナオ吉だった。ソラは、その横で、もう一本の綱を肩にかけていた。うしろを、コウ吉とジュン吉が押していた。"}, {"t": "p", "h": "荷台には、スミが座っていた。腰の水筒は、軽そうだった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "人間の家の屋根が、南の町より低かった。霜が、厚かった。"}, {"t": "p", "h": "スミは、荷台の上から、町を見ていた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "線路の脇を離れると、ナオ吉は、迷わずに角を曲がった。"}, {"t": "p", "h": "「こっちだ」"}, {"t": "p", "h": "坂があった。"}, {"t": "p", "h": "坂の上に、人間の古い店があった。裏口の戸に、人間の紙が貼ってあった。大きな字が、雨で薄くなっていた。"}, {"t": "p", "h": "坂の下の霜の上に、だれかが座っていた。"}, {"t": "p", "h": "左の足に、靴を履いていた。右の足は、素足だった。"}, {"t": "p", "h": "片方だけ靴を履いた男だった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "男が、顔を上げた。"}, {"t": "p", "h": "ソラは、綱を離した。男の前まで行った。頭を下げた。"}, {"t": "p", "h": "「ソラです」"}, {"t": "p", "h": "男は、ソラを見た。"}, {"t": "p", "h": "「……渡した」"}, {"t": "p", "h": "それだけだった。"}, {"t": "p", "h": "ソラは、もう一度、頭を下げた。"}, {"t": "p", "h": "「ありがとうございました」"}, {"t": "p", "h": "男の目が、荷車のほうへ動いた。荷台のスミの上で、止まった。"}, {"t": "p", "h": "ナオ吉が、綱を下ろした。"}, {"t": "p", "h": "ナオ吉と男は、目を合わせなかった。"}, {"t": "p", "h": "「……戻らねえから、来た」"}, {"t": "p", "h": "ナオ吉が言った。男は、坂の上の戸を見ていた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ジュン吉が、ナオ吉の前に手を出した。"}, {"t": "p", "h": "「着きました! 着くほうです!」"}, {"t": "p", "h": "ナオ吉は、ジュン吉の手のひらを見た。"}, {"t": "p", "h": "それから、懐から粒を一つ出して、置いた。"}, {"t": "p", "h": "「……五十」"}, {"t": "p", "h": "「二粒です!」"}, {"t": "p", "h": "「一粒だ」"}, {"t": "p", "h": "コウ吉が、頭のうしろで手を組んだ。"}, {"t": "p", "h": "「……よかったら、もう一回」"}, {"t": "p", "h": "「張らねえ」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "からから、からから。"}, {"t": "p", "h": "坂の上から、車輪の音が下りてきた。"}, {"t": "p", "h": "ラリオの荷車だった。荷台に、よしゆきが乗っていた。"}, {"t": "p", "h": "ソラの指が、止まった。"}, {"t": "p", "h": "よしゆきが、荷台から降りた。"}, {"t": "p", "h": "坂を、下りてきた。霜の上に、足跡が一つずつ増えた。"}, {"t": "p", "h": "ソラの前で、止まった。"}, {"t": "p", "h": "あいだに、二歩あった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "「よしゆきさん」"}, {"t": "p", "h": "ソラは、頭を下げた。"}, {"t": "p", "h": "「来ました」"}, {"t": "p", "h": "「うん」"}, {"t": "p", "h": "「てがみ、届きましたか」"}, {"t": "p", "h": "「読んだ」よしゆきは言った。「何回も」"}, {"t": "p", "h": "ソラは、顔を上げた。"}, {"t": "p", "h": "両手を、前で組んだ。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ラリオが、ナオ吉を見ていた。"}, {"t": "p", "h": "にこにこしていた。"}, {"t": "p", "h": "「……だれ?」"}, {"t": "p", "h": "ナオ吉は、答えなかった。"}, {"t": "p", "h": "地面に下ろした綱を拾って、きつく締めた。"}, {"t": "p", "h": "ラリオは、首をかしげた。それから、コウ吉とジュン吉を見た。"}, {"t": "p", "h": "「なんか、いっぱいいる」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "荷台の上から、スミが、よしゆきを見ていた。"}, {"t": "p", "h": "よしゆきも、スミを見た。"}, {"t": "p", "h": "「スミさんです」とソラが言った。「ネネさんと、同じ村の方です」"}, {"t": "p", "h": "よしゆきは、少しのあいだ、動かなかった。"}, {"t": "p", "h": "スミが、口をひらいた。"}, {"t": "p", "h": "「ネネは」"}, {"t": "p", "h": "咳を、一つした。"}, {"t": "p", "h": "<strong>「達者か」</strong>"}, {"t": "p", "h": "よしゆきは、うなずいた。"}, {"t": "p", "h": "「はい」"}, {"t": "p", "h": "スミは、腰の水筒に、手を当てた。"}, {"t": "p", "h": "水筒は、軽かった。"}, {"t": "opener", "i": 8, "alt": "第八章　値札の裏"}, {"t": "p", "h": "みちるの家の食器棚のうしろは、暖かかった。"}, {"t": "p", "h": "ナオ吉は、入口のところに立っていた。奥まで入る気にならなかった。"}, {"t": "p", "h": "ネネは、毛糸の切れはしの上に座っていた。杖を、膝に置いていた。"}, {"t": "p", "h": "一年ぶりだった。痩せた、とナオ吉は思った。言わなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ラリオとよしゆきが、荷台からスミを下ろした。"}, {"t": "p", "h": "スミは、二歩目で、膝が折れかけた。よしゆきが、肩を貸した。"}, {"t": "p", "h": "ネネの前まで、来た。"}, {"t": "p", "h": "ネネは、スミの顔を見ていた。"}, {"t": "p", "h": "長いこと、見ていた。"}, {"t": "p", "h": "それから、言った。"}, {"t": "p", "h": "<strong>「……来たか」</strong>"}, {"t": "p", "h": "スミは、答えなかった。"}, {"t": "p", "h": "よしゆきの肩から、手を離した。"}, {"t": "p", "h": "ネネの隣に、腰を下ろした。"}, {"t": "p", "h": "肩と肩が、触れた。"}, {"t": "p", "h": "ネネの膝の上には、畳んだ紙があった。"}, {"t": "p", "h": "ネネは、それを、スミのほうへ少しだけ押した。"}, {"t": "p", "h": "「届いたよ」"}, {"t": "p", "h": "スミは、紙を見た。"}, {"t": "p", "h": "「……そうか」"}, {"t": "p", "h": "それだけだった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ソラが、胸のところから、もう一枚、紙を出した。"}, {"t": "p", "h": "値札の切れはしだった。裏に、細い線が並んでいる。"}, {"t": "p", "h": "「南の壁の線を、写しました」"}, {"t": "p", "h": "ソラは、それを、ネネの前に置いた。"}, {"t": "p", "h": "線は、十九本あった。十八本の下に、米粒ほどの字があった。"}, {"t": "p", "h": "いちばん端の一本の下は、空いていた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ネネの指が、値札の上を、端から動いた。"}, {"t": "p", "h": "ナオ吉は、入口から、その指を見ていた。南の壁の前で、ナオ吉も、同じ線を数えたことがある。数え間違えたことはない。十九本。名前は、十八。"}, {"t": "p", "h": "ネネの指が、十九本目で止まった。"}, {"t": "p", "h": "空いているところに、指の腹を置いた。"}, {"t": "p", "h": "奥で、ストーブの火が、小さく鳴った。"}, {"t": "p", "h": "「……ダン」"}, {"t": "p", "h": "ネネは、言った。"}, {"t": "p", "h": "一度だけだった。"}, {"t": "p", "h": "スミの左手が、膝の上で、少しだけ動いた。曲がった小指が、浮いていた。"}, {"t": "p", "h": "だれも、なにも言わなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "日が暮れかけていた。"}, {"t": "p", "h": "床下から、よしゆきが戻ってきた。うろこ堂の坂を、もう一度見てきたのだった。"}, {"t": "p", "h": "「坂に、足跡が増えてる」"}, {"t": "p", "h": "よしゆきは言った。"}, {"t": "p", "h": "「今朝の、おれたちのだ。南から来た荷車の轍も、ある」"}, {"t": "p", "h": "ナオ吉は、腕を組んだ。"}, {"t": "p", "h": "「それが、どうした」"}, {"t": "p", "h": "「消す人は、ずっと、おれたちの跡を消してた。でも、手紙は燃やさなかった」"}, {"t": "p", "h": "よしゆきは、少し黙った。"}, {"t": "p", "h": "「手紙が、人を呼んだ。……今夜、燃やしに来る」"}, {"t": "p", "h": "よしゆきの手が、震えていた。"}, {"t": "p", "h": "「行くしかないだろ」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ネネが、杖を取った。"}, {"t": "p", "h": "「あたしも行くよ」"}, {"t": "p", "h": "「ネネさん」"}, {"t": "p", "h": "「最初に名前を書いたのは、あたしだからね」"}, {"t": "p", "h": "スミが、腰の水筒に手を当てた。"}, {"t": "p", "h": "「……おれも」"}, {"t": "p", "h": "ナオ吉は、二人の年寄りを見た。"}, {"t": "p", "h": "それから、スミの腰の下げ紐を見た。十八日の道で、ほつれて、糸が一本、垂れていた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ナオ吉は、しゃがんだ。"}, {"t": "p", "h": "懐から、縫い針を出した。"}, {"t": "p", "h": "スミの腰に手を伸ばしかけて、止めた。"}, {"t": "p", "h": "「……貸せ」"}, {"t": "p", "h": "スミは、ナオ吉を見た。"}, {"t": "p", "h": "それから、黙って、下げ紐をほどいた。"}, {"t": "p", "h": "ナオ吉は、ほつれた端を、針で三度すくった。横に三本、まっすぐ。糸を、歯で切った。"}, {"t": "p", "h": "下げ紐を、返した。"}, {"t": "p", "h": "スミは、それを腰に回して、結んだ。結び目を、一度、手のひらでたたいた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ラリオが、荷車の向きを変えていた。"}, {"t": "p", "h": "「ひだまり、寄る?」"}, {"t": "p", "h": "「寄る」とよしゆきが言った。「じいさんと、ヒロを乗せる」"}, {"t": "p", "h": "ラリオは、うなずいた。"}, {"t": "p", "h": "「あー。うん」"}, {"t": "p", "h": "ラリオは、荷車を押しはじめた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ナオ吉は、最後に食器棚のうしろを出た。"}, {"t": "p", "h": "入口で、振り返った。"}, {"t": "p", "h": "ネネの膝の上に、便りと、値札の切れはしが、重ねて置いてあった。"}, {"t": "p", "h": "ナオ吉は、拳を握った。"}, {"t": "p", "h": "それから、ほどいた。"}, {"t": "p", "h": "<strong>……今夜は、どっちに張る。</strong>"}, {"t": "opener", "i": 9, "alt": "第九章　水筒"}, {"t": "p", "h": "荷車は、うろこ堂の坂を上った。"}, {"t": "p", "h": "荷台には、ネネとスミとカク爺と、ヒロが乗っていた。ラリオが押し、ナオ吉が綱を引いた。よしゆきとソラと、コウ吉とジュン吉は、うしろを歩いた。"}, {"t": "p", "h": "坂の下で、片方だけ靴を履いた男が、立ち上がった。"}, {"t": "p", "h": "なにも言わずに、荷車のうしろについてきた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "裏口の戸の下の隙間から、匂いがした。"}, {"t": "p", "h": "紙の焦げる匂いだった。"}, {"t": "p", "h": "ヒロは、荷台から飛び降りた。隙間に顔をつけた。"}, {"t": "p", "h": "奥が、ちらちら明るかった。"}, {"t": "p", "h": "「……どうせ、間に合わねえ」"}, {"t": "p", "h": "言いながら、ヒロは、隙間をくぐった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "空っぽの店の中に、埃が白く積もっていた。"}, {"t": "p", "h": "いちばん奥の本棚の、第三段に、小さな火があった。"}, {"t": "p", "h": "寝かせた本の横の、棚板の上だった。紙が一枚、燃えていた。"}, {"t": "p", "h": "その前に、だれかが立っていた。"}, {"t": "p", "h": "背の丸い男だった。"}, {"t": "p", "h": "男は、燃えていく紙を見ていた。それから、自分の足もとを振り返った。"}, {"t": "p", "h": "そのときだった。"}, {"t": "p", "h": "裏口の隙間から入った風が、店の中を通った。燃えている紙のはしが、ちぎれて、浮いた。"}, {"t": "p", "h": "赤い点が、棚から落ちた。"}, {"t": "p", "h": "床の隅に、人間の紙くずがあった。引っ越しのときに、だれも拾わなかったものだった。"}, {"t": "p", "h": "赤い点は、そこに落ちた。"}, {"t": "p", "h": "紙くずが、ふくらむように燃えた。"}, {"t": "p", "h": "火は、床を這った。本棚のうしろの、壁の隙間のほうへ。"}, {"t": "p", "h": "柱のほうへ。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "「下がってください!」"}, {"t": "p", "h": "ソラの声だった。よく通る声だった。"}, {"t": "p", "h": "「火の、こちら側へ! ネネさんとスミさんは、戸のそばに!」"}, {"t": "p", "h": "「風上じゃ」とカク爺が言った。「戸の隙間を、ふさげ」"}, {"t": "p", "h": "コウ吉とジュン吉が、隙間に、自分たちの上着を押しこんだ。"}, {"t": "p", "h": "風が、止まった。"}, {"t": "p", "h": "火は、止まらなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ヒロは、店の奥を見た。"}, {"t": "p", "h": "人間の流しがある。帳場のうしろの、小さな流しだ。うろこ堂にいたころ、毎晩、ここから水をもらった。"}, {"t": "p", "h": "蛇口の先が、光っていた。"}, {"t": "p", "h": "しずくが、まだ落ちていた。"}, {"t": "p", "h": "ヒロは、懐から、ボタンを出した。人間の服のボタンで、くぼみに水が溜まる。うろこ堂を出るとき、一つだけ持ってきたものだった。"}, {"t": "p", "h": "流しをよじのぼった。流しの上からは、店じゅうが見えた。"}, {"t": "p", "h": "蛇口の下に、ボタンを差し出した。"}, {"t": "p", "h": "ぽつ。"}, {"t": "p", "h": "一つ。"}, {"t": "p", "h": "ぽつ。"}, {"t": "p", "h": "二つ。"}, {"t": "p", "h": "「遅え」"}, {"t": "p", "h": "ヒロは言った。手は、動かさなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ボタンがいっぱいになると、ラリオが受け取りに来た。"}, {"t": "p", "h": "ラリオは、火の手前まで、まっすぐ走った。足は、一度も迷わなかった。"}, {"t": "p", "h": "ボタンの水が、火のはしに落ちた。じゅ、と鳴った。"}, {"t": "p", "h": "一か所だけ、黒くなった。"}, {"t": "p", "h": "火は、ほかのところで伸びた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ネネは、戸のそばにいなかった。"}, {"t": "p", "h": "杖をついて、本棚のうしろへ入っていった。"}, {"t": "p", "h": "柱の前で、座った。"}, {"t": "p", "h": "柱に、背中をつけた。"}, {"t": "p", "h": "「ネネさん!」とよしゆきが言った。"}, {"t": "p", "h": "「よしゆき」"}, {"t": "p", "h": "ネネは言った。"}, {"t": "p", "h": "「どかないよ」"}, {"t": "p", "h": "杖を、膝の上に横にして置いた。"}, {"t": "p", "h": "本棚の陰で、背の丸い男の顔が、こっちを向いた。"}, {"t": "p", "h": "火は、ネネの膝の手前まで来ていた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "スミが、腰の下げ紐をほどいた。"}, {"t": "p", "h": "水筒を、ヒロのほうへ突き出した。"}, {"t": "p", "h": "「満たせ」"}, {"t": "p", "h": "ヒロは、水筒を抱えて、流しに戻った。蛇口の下に、口を当てた。"}, {"t": "p", "h": "ぽつ。ぽつ。"}, {"t": "p", "h": "水筒は、ボタンより、ずっと大きかった。"}, {"t": "p", "h": "「……どうせ、間に合わねえ」"}, {"t": "p", "h": "ヒロは、もう一度、言った。"}, {"t": "p", "h": "しずくが、落ちつづけた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ジュン吉が、火のそばで、大きな声で言っていた。"}, {"t": "p", "h": "「張る! 燃えるほうに――いや、燃えないほうに! いや、どっちだろう!」"}, {"t": "p", "h": "ナオ吉が、懐から、粒を一つ出した。"}, {"t": "p", "h": "ジュン吉の前の床に、置いた。"}, {"t": "p", "h": "<strong>「燃えないほうだ」</strong>"}, {"t": "p", "h": "ジュン吉は、口を開けたまま、ナオ吉を見た。"}, {"t": "p", "h": "コウ吉が、手のひらの粒を、ジュン吉の手に押しつけた。"}, {"t": "p", "h": "「……よかったら、燃えるほうに」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "片方だけ靴を履いた男が、火とネネのあいだに入った。"}, {"t": "p", "h": "「……安藤」"}, {"t": "p", "h": "カク爺が言った。"}, {"t": "p", "h": "安藤は、振り返らなかった。"}, {"t": "p", "h": "左の靴を、脱いだ。"}, {"t": "p", "h": "靴を手に持って、火のはしをはたいた。"}, {"t": "p", "h": "一度。"}, {"t": "p", "h": "二度。"}, {"t": "p", "h": "火の粉が、靴の上で散った。縫い目が、焦げる匂いがした。"}, {"t": "p", "h": "安藤は、はたくのをやめなかった。"}, {"t": "p", "h": "ヒロは、水筒を抱えて、流しを降りた。重かった。"}, {"t": "p", "h": "スミが、それを受け取った。"}, {"t": "p", "h": "両手で持った。重さを、確かめるようだった。"}, {"t": "p", "h": "それから、火のほうへは行かずに、安藤に、差し出した。"}, {"t": "p", "h": "安藤は、焦げた靴を床に置いた。"}, {"t": "p", "h": "水筒を、両手で受け取った。"}, {"t": "p", "h": "背筋を、伸ばした。"}, {"t": "p", "h": "柱の根もとへ、水筒を傾けた。"}, {"t": "p", "h": "水が、細く落ちた。火のはしが、じゅ、と縮んだ。"}, {"t": "p", "h": "水が、途切れた。"}, {"t": "p", "h": "火は、まだ一つ、柱の根もとに残っていた。ネネの膝の、すぐ手前だった。"}, {"t": "p", "h": "安藤は、水筒を置いた。"}, {"t": "p", "h": "手のひらを、火の上にかぶせた。"}, {"t": "p", "h": "押さえたまま、動かなかった。"}, {"t": "p", "h": "長かった。"}, {"t": "p", "h": "手を上げたとき、火は消えていた。"}, {"t": "p", "h": "手のひらが、黒くなっていた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "煙が、天井まで上って、そこで広がった。"}, {"t": "p", "h": "床の紙くずは、黒い灰になっていた。本棚のうしろの壁の隙間に、焦げた筋が一本、這いこんでいた。"}, {"t": "p", "h": "その先に、柱があった。"}, {"t": "p", "h": "ネネは、まだ背中をつけていた。"}, {"t": "p", "h": "首だけを回して、柱を見上げた。"}, {"t": "p", "h": "柱の根もとが、少しだけ黒くなっていた。"}, {"t": "p", "h": "その上の、八センチと九センチの線は、そのままだった。二本の線のあいだの名前も、そのままだった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ジュン吉が、ナオ吉の前に、粒を一つ置いた。"}, {"t": "p", "h": "「……もう無理です」"}, {"t": "p", "h": "ナオ吉は、床の粒を見た。"}, {"t": "p", "h": "「……一」"}, {"t": "p", "h": "はじめて、張ったほうの粒を拾った。"}, {"t": "p", "h": "手のひらに、載せた。"}, {"t": "p", "h": "長いこと、それを見ていた。"}, {"t": "p", "h": "コウ吉が、ジュン吉の横で、自分の空になった手のひらを見ていた。"}, {"t": "p", "h": "ナオ吉の手のひらに、粒が一つあった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "煙の向こうの、本棚の陰に、背の丸い男が立っていた。"}, {"t": "p", "h": "まだ、そこにいた。"}, {"t": "opener", "i": 10, "alt": "第十章　焦げた紙"}, {"t": "p", "h": "煙が、少しずつ薄くなった。"}, {"t": "p", "h": "だれも、動かなかった。"}, {"t": "p", "h": "本棚の陰に、背の丸い男が立っていた。火の消えた床を、見ていた。"}, {"t": "p", "h": "ネネは、柱に背中をつけたままだった。安藤は、もう両足とも素足で、黒くなった手のひらを、膝の上に置いていた。"}, {"t": "p", "h": "よしゆきは、男を見ていた。"}, {"t": "p", "h": "男は、逃げなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "カク爺が、戸のそばを離れた。"}, {"t": "p", "h": "男の前まで、歩いた。"}, {"t": "p", "h": "「よいか諸――」"}, {"t": "p", "h": "カク爺は、言いかけて、やめた。"}, {"t": "p", "h": "諸君は、一人だった。"}, {"t": "p", "h": "カク爺は、男の前の床に、腰を下ろした。"}, {"t": "p", "h": "「……張ったまま動かん者は、二つに分かれる、という話をしておった」"}, {"t": "p", "h": "男は、動かなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "話は、長かった。"}, {"t": "p", "h": "勝ちを待つ者と、負けを認められん者の話だった。どちらも外から見ると同じ顔をしている、という話だった。日数を数えれば見分けがつく、という話だった。"}, {"t": "p", "h": "ヒロが、途中で棚の陰に座りこんだ。ジュン吉とコウ吉は、ナオ吉の手のひらの粒をのぞきこんでいた。ラリオは、首をかしげて、それから自分の足を見ていた。"}, {"t": "p", "h": "男だけが、カク爺の前に立っていた。"}, {"t": "p", "h": "「……そういう者はの」"}, {"t": "p", "h": "カク爺は言った。"}, {"t": "p", "h": "「最後に、自分で張りを下ろすほかない。だれにも、下ろさせてはもらえん」"}, {"t": "p", "h": "カク爺は、口を閉じた。"}, {"t": "p", "h": "話が、終わった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "カク爺は、顔を上げた。"}, {"t": "p", "h": "男が、まだそこにいた。"}, {"t": "p", "h": "カク爺の手が、髭に伸びた。撫でかけて、途中で止まった。"}, {"t": "p", "h": "「……聞いてるか」"}, {"t": "p", "h": "男は、少し黙った。"}, {"t": "p", "h": "「……聞いた」"}, {"t": "p", "h": "低い声だった。"}, {"t": "p", "h": "カク爺は、髭から手を下ろした。"}, {"t": "p", "h": "懐から、新聞の切れはしを出した。"}, {"t": "p", "h": "鉛筆で、線を一本、引いた。"}, {"t": "p", "h": "なにも言わなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "男は、店のいちばん奥の、板を打ちつけた壁を見ていた。"}, {"t": "p", "h": "「……十九年前だ」"}, {"t": "p", "h": "男は言った。"}, {"t": "p", "h": "「あの壁の、向こうにいた」"}, {"t": "p", "h": "だれも、動かなかった。"}, {"t": "p", "h": "「あの子の背丈を、柱に引いた。二つの年だった」"}, {"t": "p", "h": "「人間が、その線を見つけた。壁が、塞がれた。おれは、外にいた」"}, {"t": "p", "h": "男は、少し黙った。"}, {"t": "p", "h": "「……残すから、見つかる」"}, {"t": "p", "h": "男が、懐に手を入れた。"}, {"t": "p", "h": "紙を、一枚出した。"}, {"t": "p", "h": "端が茶色くなって、折り目のところが柔らかくなっていた。"}, {"t": "p", "h": "「南の本に、挟まっていた。……八センチ、と書いてあった」"}, {"t": "p", "h": "男は、よしゆきの前まで来た。"}, {"t": "p", "h": "紙を、差し出した。"}, {"t": "p", "h": "よしゆきは、受け取った。"}, {"t": "p", "h": "焦げた端の内側に、米粒ほどの字が、わずかに残っていた。"}, {"t": "p", "h": "自分の字だった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "よしゆきは、自分の頭のてっぺんに、手を当てた。"}, {"t": "p", "h": "あの夜の、手のひらの重さがあった。"}, {"t": "p", "h": "この壁の中で、生まれた。親は、覚えていない。"}, {"t": "p", "h": "もしかしたら、と思った。"}, {"t": "p", "h": "思っただけだった。"}, {"t": "p", "h": "よしゆきは、訊かなかった。"}, {"t": "p", "h": "男も、訊かなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "よしゆきは、紙を開かなかった。"}, {"t": "p", "h": "手が、震えていた。"}, {"t": "p", "h": "振り返った。"}, {"t": "p", "h": "ソラが、うしろに立っていた。両手を、前で組んでいた。"}, {"t": "p", "h": "よしゆきは、一歩、前に出た。"}, {"t": "p", "h": "もう一歩、出た。"}, {"t": "p", "h": "紙を、ソラの手のひらに載せた。"}, {"t": "p", "h": "指と指が、触れた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ソラは、紙を開いた。"}, {"t": "p", "h": "焦げていた。ほとんどの字が、黒い縁の中に消えていた。"}, {"t": "p", "h": "一行だけ、残っていた。"}, {"t": "quote", "h": "……います。"}, {"t": "p", "h": "ソラは、それを読んだ。"}, {"t": "p", "h": "それから、もう一度、読んだ。"}, {"t": "p", "h": "ソラの左手の指が、動きかけた。"}, {"t": "p", "h": "止まった。"}, {"t": "p", "h": "よしゆきの手は、もう震えていなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "男が、裏口のほうへ歩きだした。"}, {"t": "p", "h": "ラリオが、にこにこして、男の前に立った。"}, {"t": "p", "h": "「……だれ?」"}, {"t": "p", "h": "男は、止まった。"}, {"t": "p", "h": "少し、黙った。"}, {"t": "p", "h": "それから、男は、名乗った。"}, {"t": "p", "h": "ラリオは、うなずいた。"}, {"t": "p", "h": "「あー」"}, {"t": "p", "h": "もう、覚えていなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "戸の下の隙間の前に、安藤が立っていた。"}, {"t": "p", "h": "背筋を、伸ばしていた。"}, {"t": "p", "h": "背の丸い男は、その前で、止まった。"}, {"t": "p", "h": "二人とも、なにも言わなかった。"}, {"t": "p", "h": "背の丸い男は、隙間をくぐって、外へ出た。"}, {"t": "p", "h": "よしゆきは、隙間の前まで行った。"}, {"t": "p", "h": "月が出ていた。坂の霜が、白かった。"}, {"t": "p", "h": "男は、坂を下りていった。霜の上に、足跡がひとつずつ増えていった。"}, {"t": "p", "h": "坂の半ばで、止まった。"}, {"t": "p", "h": "振り返った。"}, {"t": "p", "h": "自分の足もとを、見ていた。"}, {"t": "p", "h": "しゃがまなかった。"}, {"t": "p", "h": "それから、また歩きだした。"}, {"t": "p", "h": "<strong>跡は、消されなかった。</strong>"}, {"t": "opener", "i": 11, "alt": "終章　畳んだ手紙"}, {"t": "p", "h": "火の夜から、三日たった。"}, {"t": "p", "h": "朝、よしゆきは、うろこ堂の柱の前にいた。"}, {"t": "p", "h": "柱の根もとが、少しだけ黒かった。その上に、八センチと九センチの線があった。二本のあいだに、六つの名前と、三つの行き先があった。"}, {"t": "p", "h": "隙間の入口で、足音がした。"}, {"t": "p", "h": "安藤だった。手に、左の靴を持っていた。甲の縫い目が、焦げていた。"}, {"t": "p", "h": "安藤は、柱の前で、しゃがんだ。"}, {"t": "p", "h": "靴を、柱の根もとに置いた。"}, {"t": "p", "h": "手を離した。"}, {"t": "p", "h": "手のひらは、まだ黒かった。"}, {"t": "p", "h": "安藤は、靴を見ていた。"}, {"t": "p", "h": "ずらさなかった。"}, {"t": "p", "h": "安藤は、立ち上がった。よしゆきのほうは、見なかった。隙間の入口へ、歩いていった。"}, {"t": "p", "h": "素足の跡が、床の埃に、一つずつ残った。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "坂の下に、荷車が待っていた。"}, {"t": "p", "h": "ナオ吉が綱を持ち、コウ吉とジュン吉がうしろについていた。荷台は、空だった。スミは、北に残る。"}, {"t": "p", "h": "見送りに、みんな来ていた。"}, {"t": "p", "h": "ラリオの荷車の荷台に、ネネとスミが並んで座っていた。肩と肩が、触れていた。カク爺は、帳面を抱えていた。ヒロは、角砂糖を抱えていた。"}, {"t": "p", "h": "ヒロが、ソラの前に、角砂糖のかけらを突き出した。"}, {"t": "p", "h": "「持ってけ。腹が減ると、頭が回らねえ」"}, {"t": "p", "h": "ソラは、両手で受け取った。"}, {"t": "p", "h": "「ありがとうございます」"}, {"t": "p", "h": "ネネが、荷台の上から言った。"}, {"t": "p", "h": "「春になったら、便りを出しな」"}, {"t": "p", "h": "「はい」"}, {"t": "p", "h": "ラリオが、ソラの前に立った。にこにこしていた。"}, {"t": "p", "h": "「……だれ?」"}, {"t": "p", "h": "「ソラです」"}, {"t": "p", "h": "「あー」ラリオは、うなずいた。「また来る人?」"}, {"t": "p", "h": "ソラは、少し黙った。"}, {"t": "p", "h": "「はい」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "安藤が、坂を下りてきた。両足とも、素足だった。"}, {"t": "p", "h": "カク爺は、帳面から目を上げなかった。"}, {"t": "p", "h": "安藤が前を通りすぎるとき、カク爺は言った。"}, {"t": "p", "h": "「……来年も、数えとる」"}, {"t": "p", "h": "安藤は、止まらなかった。"}, {"t": "p", "h": "背筋が、少しだけ伸びた。"}, {"t": "p", "h": "ジュン吉が、手を挙げた。"}, {"t": "p", "h": "「張る! 春に、また来るほうに!」"}, {"t": "p", "h": "ナオ吉が、懐から粒を一つ出した。"}, {"t": "p", "h": "「……来るほうだ」"}, {"t": "p", "h": "ジュン吉は、口を開けたまま、ナオ吉を見た。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ソラが、よしゆきの前に来た。"}, {"t": "p", "h": "「約束の日に、間に合いません」"}, {"t": "p", "h": "ソラは、左手を出した。指を、二本、折った。"}, {"t": "p", "h": "「二日、遅れます」"}, {"t": "p", "h": "「……ヤマに、怒られる?」"}, {"t": "p", "h": "「怒られません」ソラは言った。「止めませんでしたから」"}, {"t": "p", "h": "それから、ソラは振り返った。"}, {"t": "p", "h": "坂の下にいる者を、指で数えはじめた。ネネ。スミ。カク爺。ヒロ。ラリオ。ナオ吉。コウ吉。ジュン吉。"}, {"t": "p", "h": "指が、止まった。"}, {"t": "p", "h": "南で待っているヤマのところで、もう一度動いた。坂を下りていった安藤のところで、また止まった。"}, {"t": "p", "h": "便りの十八人のところで、指が、足りなくなった。"}, {"t": "p", "h": "「……数えられません」"}, {"t": "p", "h": "ソラは、指を下ろした。"}, {"t": "p", "h": "よしゆきは、少し黙った。"}, {"t": "p", "h": "「春になったら」"}, {"t": "p", "h": "よしゆきは言った。"}, {"t": "p", "h": "「行く」"}, {"t": "p", "h": "ソラは、頭を下げた。"}, {"t": "p", "h": "それから、顔を上げた。"}, {"t": "p", "h": "「春まで、数えます」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "荷車が、南へ動きだした。"}, {"t": "p", "h": "坂の霜の上に、見送りに来た者たちの足跡が、いくつも並んでいた。"}, {"t": "p", "h": "荷車の音が、角を曲がって、聞こえなくなった。"}, {"t": "p", "h": "見送った者たちは、しばらく、そこにいた。"}, {"t": "p", "h": "ヒロが、角砂糖をかじった。"}, {"t": "p", "h": "「……どうせ、すぐ春だ」"}, {"t": "p", "h": "だれも、帰ろうとは言わなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "その夜、よしゆきは、みちるの家の食器棚のうしろで、手紙を書いていた。"}, {"t": "p", "h": "ソラへ、と書いた。"}, {"t": "p", "h": "書き終えて、畳んだ。"}, {"t": "p", "h": "本には、挟まなかった。"}, {"t": "p", "h": "春になったら、自分で持っていく。手から、手へ。"}, {"t": "p", "h": "渡す手と、受け取る手。"}, {"t": "p", "h": "<strong>そのあいだの、<span class=\"tcy\">0</span>センチメートル。</strong>"}, {"t": "p", "h": "人間の目には、見えないだろう。定規の目盛りの、いちばん端。まだなにも数えていない場所。"}, {"t": "p", "h": "けれども、そこには、霜の坂がひとつと、荷車が二台と、焦げた靴が一つと、燃えなかった紙が一枚と――そして、数えられない仲間が入っていた。"}, {"t": "end", "h": "了"}], "chapters": [{"title": "序章　二枚の紙", "b": 0}, {"title": "第一章　罫の紙", "b": 57}, {"title": "第二章　枕もとの便り", "b": 117}, {"title": "第三章　角砂糖のかけら", "b": 176}, {"title": "第四章　荷車の綱", "b": 240}, {"title": "第五章　布の切れはし", "b": 313}, {"title": "第六章　鉛筆の芯", "b": 383}, {"title": "第七章　一粒", "b": 462}, {"title": "第八章　値札の裏", "b": 543}, {"title": "第九章　水筒", "b": 630}, {"title": "第十章　焦げた紙", "b": 765}, {"title": "終章　畳んだ手紙", "b": 874}]};

const MOTIF = 'countdown';
(function drawRuler(){
  const svg = document.getElementById('rulerSvg');
  let s='';
  for(let i=0;i<=14;i++){
    const x = 8 + i*(284/14);
    s += `<line class="tick kt" data-cm="${i}" x1="${x}" y1="${i%5===0?5:10}" x2="${x}" y2="17"/>`;
    if(i%5===0 || i===14) s += `<text class="num${i===0?' kz':''}" x="${x}" y="25.5" text-anchor="middle">${i}</text>`;

  svg.innerHTML = s;
})();


/* ---------- しおり ---------- */
const BM_KEY = 'shiori:' + DATA.title;
DATA.blocks.forEach((b,i)=>{ b.src=i; });
let bm = null;
try{ const v = localStorage.getItem(BM_KEY); bm = v ? JSON.parse(v) : null; }catch(e){ bm = null; }
function saveBm(){ try{ if(bm) localStorage.setItem(BM_KEY, JSON.stringify(bm)); else localStorage.removeItem(BM_KEY); }catch(e){} }
function anchorOf(p){
  const pg = pages[p]; if(!pg) return null;
  for(const b of pg){ if(b && b.src!=null) return {s:b.src, p:b.part||0}; }
  if(pg[0] && pg[0].t==='toc') return {toc:true};
  return null;
}
function pageOfAnchor(a){
  if(!a) return -1;
  if(a.toc) return pages.findIndex(pg=>pg[0] && pg[0].t==='toc');
  for(let p=1;p<pages.length;p++) for(const b of pages[p]) if(b && b.src===a.s && (b.part||0)>=a.p) return p;
  for(let p=1;p<pages.length;p++) for(const b of pages[p]) if(b && b.src!=null && b.src>=a.s) return p;
  return -1;
}
function visiblePages(){ return (spread && idx>0) ? [idx, idx+1] : [idx]; }
function toggleBm(){
  const bp = pageOfAnchor(bm), vis = visiblePages();
  if(bm && vis.indexOf(bp)>=0){ bm = null; }
  else { const a = anchorOf(idx); if(!a) return; bm = a; }
  saveBm(); update(0);
}
function goBm(){ const p = pageOfAnchor(bm); if(p<0) return; idx = p; closeSheets(); update(1); }
function renderToc(host){
  const w = document.createElement('div'); w.className='tocpage';
  w.innerHTML = '<h2>目次</h2>';
  DATA.chapters.forEach((c,i)=>{
    const parts = c.title.split('\u3000');
    const row = document.createElement('div'); row.className='ti';
    const b = document.createElement('button'); b.className='tb'; b.type='button';
    b.setAttribute('aria-label', c.title.replace('\u3000',' ')+'へ移動');
    b.innerHTML = '<span class="n">'+parts[0]+'</span><span class="t">'+(parts[1]||'')+'</span>';
    b.onclick = (e)=>{ e.stopPropagation(); idx = chapPage[i]||1; update(1); };
    row.appendChild(b);
    row.insertAdjacentHTML('beforeend','<span class="d" aria-hidden="true"></span><span class="p" aria-hidden="true">'+(chapPage[i]||'')+'</span>');
    w.appendChild(row);
  });
  host.appendChild(w);
  let fs = 1;
  w.style.fontSize = fs+'em';
  const page = host.closest('.page');
  const fits = ()=>{ const r=w.getBoundingClientRect(), pr=page.getBoundingClientRect(); return vertical ? r.left >= pr.left+8 && w.scrollHeight<=w.clientHeight+2 : r.bottom <= pr.bottom-8; };
  let guard=0;
  while(!fits() && fs>0.5 && guard++<20){ fs -= 0.05; w.style.fontSize = fs.toFixed(2)+'em'; }
}

/* ---------- blocks -> DOM ---------- */
function makeEl(b){
  let el;
  if(b.t==='h2'){ el=document.createElement('h2'); el.innerHTML=b.h; }
  else if(b.t==='quote'){ el=document.createElement('blockquote'); el.innerHTML=b.h; }
  else if(b.t==='sep'){ el=document.createElement('div'); el.className='sep'; el.innerHTML=SEPSVG; }
  else if(b.t==='opener'){ el=document.createElement('div'); el.className='opener'; const im=document.createElement('img'); im.src=IMGS[b.i]; im.alt=b.alt.replace('\u3000',' '); el.appendChild(im); }
  else if(b.t==='end'){ el=document.createElement('p'); el.className='endmark'; el.textContent=b.h; }
  else if(b.t==='next'){ el=document.createElement('div'); el.className='nextnav'; el.innerHTML=b.h; }
  else { el=document.createElement('p'); el.innerHTML=b.h; }
  return el;
}
function contentBox(el){
  const r = el.getBoundingClientRect(), cs = getComputedStyle(el);
  return {
    left:   r.left   + parseFloat(cs.paddingLeft   || 0),
    right:  r.right  - parseFloat(cs.paddingRight  || 0),
    top:    r.top    + parseFloat(cs.paddingTop    || 0),
    bottom: r.bottom - parseFloat(cs.paddingBottom || 0)
  };
}
/* scrollWidth is unreliable in vertical-rl (content overflows leftward),
   so compare the last child's far edge with the page's content box. */
function over(el){
  const kids = el.children;
  if(!kids.length) return false;
  const box = contentBox(el);
  const k = kids[kids.length-1], r = k.getBoundingClientRect(), ks = getComputedStyle(k);
  return vertical
    ? (r.left - parseFloat(ks.marginLeft || 0)) < box.left - 0.5
    : (r.bottom + parseFloat(ks.marginBottom || 0)) > box.bottom + 0.5;
}
function splitText(t){
  const out=[]; let cur='';
  for(let i=0;i<t.length;i++){
    cur+=t[i];
    if('。！？」'.indexOf(t[i])>=0 && cur.length>=40){ out.push(cur); cur=''; }
  }
  if(cur) out.push(cur);
  return out.length?out:[t];
}

/* ---------- pagination ---------- */
function paginate(){
  const m = document.getElementById('measure'), mc = document.getElementById('mcol');
  const ref = document.getElementById('pageA').getBoundingClientRect();
  m.className='page';
  m.style.width = ref.width+'px';
  m.style.height = ref.height+'px';
  mc.innerHTML='';

  pages = [[{t:'cover'}],[{t:'toc'}]];
  chapPage = [];
  let cur = [];
  const push = ()=>{ if(cur.length){ pages.push(cur); cur=[]; } mc.innerHTML=''; };

  const esc = t => t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const drop = el => { if(el && el.parentNode) el.parentNode.removeChild(el); };

  // 1ページに単独で収まらない塊を、収まる単位に割って順番どおり流しこむ
  const flowSplit = (b)=>{
    let part = 0;
    if(b.t==='quote'){                    // 手紙は行単位で分ける
      const trim = a=>{ const c=a.slice();
        while(c.length && c[0]==='') c.shift();
        while(c.length && c[c.length-1]==='') c.pop();
        return c; };
      const lines = b.h.split('<br>');
      let buf=[], node=null;
      for(const ln of lines){
        const trial = buf.concat([ln]);
        drop(node);
        node = makeEl({t:'quote', h: trim(trial).join('<br>')});
        mc.appendChild(node);
        if(over(mc) && trim(buf).length){
          drop(node);
          cur.push({t:'quote', h: trim(buf).join('<br>'), src:b.src, part:part++});
          push();
          buf = (ln==='') ? [] : [ln];
          node = buf.length ? makeEl({t:'quote', h: ln}) : null;
          if(node) mc.appendChild(node);
        } else {
          buf = trial;
        }
      }
      if(trim(buf).length) cur.push({t:'quote', h: trim(buf).join('<br>'), src:b.src, part:part++});
      return;
    }
    for(const c of splitText(makeEl(b).textContent)){   // 段落は文単位で分ける
      const blk = {t:'p', h: esc(c), src:b.src, part:part++};
      let node = makeEl(blk);
      mc.appendChild(node);
      if(over(mc) && cur.length){ drop(node); push(); node = makeEl(blk); mc.appendChild(node); }
      cur.push(blk);
    }
  };

  const feed = (b, chIndex)=>{
    if(b.t==='opener'){ push(); if(chIndex!=null) chapPage[chIndex]=pages.length; pages.push([b]); mc.innerHTML=''; return; }
    const el = makeEl(b);
    mc.appendChild(el);
    if(over(mc)){
      mc.removeChild(el);
      if(cur.length) push();
      mc.appendChild(el);
      if(over(mc)){                       // ページ丸ごと使っても収まらない
        mc.removeChild(el);
        if(chIndex!=null) chapPage[chIndex] = pages.length;
        flowSplit(b);
        return;
      }
    }
    if(chIndex!=null) chapPage[chIndex] = pages.length;
    cur.push(b);
  };

  const chStart = {};
  DATA.chapters.forEach((c,i)=>{ chStart[c.b]=i; });
  DATA.blocks.forEach((b,i)=> feed(b, chStart[i]!=null?chStart[i]:null));
  push();

  // verify: re-measure every page and move any spilled block to the next one
  for(let p=1;p<pages.length;p++){
    if(pages[p][0] && (pages[p][0].t==='toc' || pages[p][0].t==='opener')) continue;
    mc.innerHTML='';
    const keep=[]; const spill=[];
    for(const b of pages[p]){
      if(spill.length){ spill.push(b); continue; }
      const el=makeEl(b); mc.appendChild(el);
      if(over(mc) && keep.length){ mc.removeChild(el); spill.push(b); }
      else keep.push(b);
    }
    if(spill.length){
      pages[p]=keep;
      pages.splice(p+1,0,spill);
      for(let c=0;c<chapPage.length;c++) if(chapPage[c]>p) chapPage[c]++;
    }
  }
  mc.innerHTML='';
  if(pages.length%2===0 && spread) pages.push([{t:'blank'}]);
}

/* ---------- render ---------- */
function renderPage(hostPage, page){
  const host = hostPage.querySelector('.col');
  host.innerHTML='';
  hostPage.classList.remove('blank');
  if(!page){ hostPage.classList.add('blank'); return; }
  if(page[0] && page[0].t==='cover'){
    host.innerHTML = '<div class="opener cov" style="background:#dbe2e5"><div class="covbg t" style="background-image:url('+COVER+')"></div><div class="covbg b" style="background-image:url('+COVER+')"></div><img alt="'+DATA.title+'　'+DATA.sub+'" src="'+COVER+'"></div>';
    setTimeout(fitCov,0);
    return;
  }
  if(page[0] && page[0].t==='blank'){ hostPage.classList.add('blank'); return; }
  if(page[0] && page[0].t==='toc'){ renderToc(host); return; }
  page.forEach(b=> host.appendChild(makeEl(b)));
}

function update(dir){
  const A=document.getElementById('pageA'), B=document.getElementById('pageB');
  if(spread && idx>0 && idx%2===0) idx--;
  idx = Math.max(0, Math.min(pages.length-1, idx));

  if(spread && idx>0){ renderPage(A,pages[idx]); renderPage(B,pages[idx+1]); }
  else { renderPage(A,pages[idx]); renderPage(B,null); }

  if(dir){
    const dx = (dir>0 ? (vertical?-14:14) : (vertical?14:-14))+'px';
    [A,B].forEach(el=>{ el.style.setProperty('--dx',dx); el.classList.remove('flip'); void el.offsetWidth; el.classList.add('flip'); });
  }

  const bp = pageOfAnchor(bm), vis = visiblePages();
  A.classList.toggle('marked', bm!=null && bp===vis[0]);
  B.classList.toggle('marked', bm!=null && vis.length>1 && bp===vis[1]);
  const here = bm!=null && vis.indexOf(bp)>=0;
  const bb = document.getElementById('bmBtn');
  bb.setAttribute('aria-pressed', String(here));
  bb.disabled = (idx===0 && !spread) || (idx===0);
  bb.setAttribute('aria-label', here ? 'しおりを外す' : 'このページにしおりをはさむ');
  document.getElementById('bmJump').hidden = !(bm && bp>0 && !here);
  const bi = document.getElementById('bmItem');
  bi.hidden = !(bm && bp>0);
  if(bp>0) bi.textContent = 'しおりのページへ（' + bp + '）';
  const last = pages.length-1;
  try{ if(idx===last && last>0) localStorage.setItem('done:'+DATA.title,'1'); }catch(e){}
  const prog = last>0 ? idx/last : 0;
  (function(){
    var lastp = (idx===last);
    var cm = lastp ? 0 : 14*(1-prog);
    document.querySelectorAll('#rulerSvg .kt').forEach(function(t){
      t.classList.toggle('passed', Number(t.dataset.cm) >= cm - 0.0001);
    });
    var mk = document.getElementById('kmark');
    if(mk) mk.setAttribute('transform','translate('+(8 + cm*(284/14)).toFixed(2)+' 0.5)');
    var z = document.querySelector('#rulerSvg .kz'); if(z) z.classList.toggle('fin', lastp);
  })();

  let name='';
  for(let i=0;i<DATA.chapters.length;i++){ if(chapPage[i]!=null && chapPage[i]<=idx) name=DATA.chapters[i].title; }
  document.getElementById('chapNow').textContent = idx===0 ? '' : name;
  document.getElementById('pageNow').textContent = idx===0 ? '表紙' : (idx + ' / ' + last);
  document.querySelectorAll('.toc-item').forEach(el=>{
    el.setAttribute('aria-current', String(Number(el.dataset.p)<=idx && (Number(el.dataset.next)>idx || el.dataset.next==='')));
  });
}

function go(step){ const n=idx+step*(spread&&idx>0?2:1); if(n<0||n>pages.length-1) return; idx=n; update(step); }
function next(){ go(1); } function prev(){ go(-1); }

/* ---------- column fitting ---------- */
function fitColumn(){
  const pa = document.getElementById('pageA'), cs = getComputedStyle(pa);
  const avail = vertical
    ? pa.clientHeight - parseFloat(cs.paddingTop)  - parseFloat(cs.paddingBottom)
    : pa.clientWidth  - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const n = CHARS[sizeIdx];
  let fs = Math.min(SIZES[sizeIdx], avail / (n * KERN));
  fs = Math.max(12.5, fs);
  const colw = Math.min(avail, Math.floor(fs * n * KERN));
  document.documentElement.style.setProperty('--fs', fs.toFixed(2)+'px');
  document.documentElement.style.setProperty('--colw', colw+'px');
}

/* ---------- layout ---------- */
function layout(keepBlock){
  spread = window.innerWidth >= 940 && window.innerHeight >= 420;
  document.body.classList.toggle('spread', spread);
  document.body.classList.toggle('vert', vertical);
  document.documentElement.style.setProperty('--fs', SIZES[sizeIdx]+'px');
  document.documentElement.style.setProperty('--lh', vertical? '1.95' : '2.05');
  requestAnimationFrame(()=>{
    fitColumn();
    paginate();
    if(keepBlock!=null){
      let found=0;
      for(let p=1;p<pages.length;p++){ if(pages[p].some(b=>b===keepBlock)){ found=p; break; } }
      idx = found || Math.min(idx, pages.length-1);
    }
    buildToc();
    update(0);
  });
}
function currentBlock(){ const p=pages[idx]; return p && p[0] && p[0].t!=='cover' ? p[0] : null; }

/* ---------- toc ---------- */
function buildToc(){
  const list=document.getElementById('tocList');
  list.innerHTML='';
  DATA.chapters.forEach((c,i)=>{
    const b=document.createElement('button');
    b.className='toc-item'; b.dataset.p=chapPage[i]||1;
    b.dataset.next = (chapPage[i+1]!=null? chapPage[i+1] : '');
    b.innerHTML='<span>'+c.title+'</span><span class="pg">'+(chapPage[i]||1)+'</span>';
    b.onclick=()=>{ idx=chapPage[i]||1; closeSheets(); update(1); };
    list.appendChild(b);
  });
}

/* ---------- sheets ---------- */
function closeSheets(){ document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('open')); }
try{ if(!/claude\.ai$/i.test(location.hostname) && !/^blob:/.test(location.href)) document.getElementById('homeLink').hidden=false; }catch(e){}
document.getElementById('bmBtn').onclick=toggleBm;
document.getElementById('bmJump').onclick=goBm;
document.getElementById('bmItem').onclick=goBm;
document.getElementById('tocBtn').onclick=()=>document.getElementById('tocSheet').classList.add('open');
document.getElementById('setBtn').onclick=()=>document.getElementById('setSheet').classList.add('open');
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheets);
document.querySelectorAll('.sheet').forEach(s=>s.addEventListener('click',e=>{ if(e.target===s) closeSheets(); }));

document.getElementById('dirSeg').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  const keep=currentBlock();
  vertical = b.dataset.dir==='v';
  document.querySelectorAll('#dirSeg button').forEach(x=>x.setAttribute('aria-pressed', String(x===b)));
  layout(keep);
};
document.getElementById('sizeSeg').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  const keep=currentBlock();
  sizeIdx=Number(b.dataset.size);
  document.querySelectorAll('#sizeSeg button').forEach(x=>x.setAttribute('aria-pressed', String(x===b)));
  layout(keep);
};

/* ---------- input ---------- */
/* 目次ページの項目がページ送りの領域の下にあっても押せるようにする */
function tocHit(e){
  if(!e || (!e.clientX && !e.clientY)) return false;
  const zs=document.querySelectorAll('.zone'); zs.forEach(z=>z.style.pointerEvents='none');
  const el=document.elementFromPoint(e.clientX,e.clientY);
  zs.forEach(z=>z.style.pointerEvents='');
  const t=el && el.closest ? el.closest('.tocpage .tb') : null;
  if(t){ t.click(); return true; }
  return false;
}
document.getElementById('zoneL').onclick=e=>{ if(tocHit(e)) return; vertical? next() : prev(); };
document.getElementById('zoneR').onclick=e=>{ if(tocHit(e)) return; vertical? prev() : next(); };
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') vertical?prev():next();
  else if(e.key==='ArrowLeft') vertical?next():prev();
  else if(e.key===' '||e.key==='ArrowDown'){ e.preventDefault(); next(); }
  else if(e.key==='ArrowUp') prev();
  else if(e.key==='Escape') closeSheets();
});
let tx=0,ty=0;
const bookEl=document.getElementById('book');
bookEl.addEventListener('touchstart',e=>{ tx=e.changedTouches[0].clientX; ty=e.changedTouches[0].clientY; },{passive:true});
bookEl.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)<44 || Math.abs(dx)<Math.abs(dy)) return;
  if(dx<0) vertical?prev():next(); else vertical?next():prev();
},{passive:true});

let rt;
window.addEventListener('resize',()=>{ clearTimeout(rt); const keep=currentBlock(); rt=setTimeout(()=>layout(keep),180); });

if(document.fonts && document.fonts.ready){ document.fonts.ready.then(()=>layout(null)); }
layout(null);

/* 表紙の余白を、表紙の端の色でつなぐ（上下か左右かを画面の形で判定） */
function fitCov(){
  document.querySelectorAll('.opener.cov').forEach(function(op){
    var im=op.querySelector('img'); if(!im) return;
    var set=function(){
      var W=op.clientWidth, H=op.clientHeight; if(!W||!H) return;
      var r=(im.naturalWidth||600)/(im.naturalHeight||960);
      var lr = (W/H) > r;
      op.classList.toggle('lr', lr);
    };
    if(im.complete) set(); else im.addEventListener('load', set, {once:true});
  });
}
window.addEventListener('resize', function(){ setTimeout(fitCov, 250); });

/* shioriAuto: トップページからの「しおりの続きから」 */
if(/[?&]shiori=1/.test(location.search)){
  var _try=function(n){
    try{
      if(bm){ var p=pageOfAnchor(bm); if(p>0){ idx=p; update(0); return; } }
    }catch(e){}
    if(n>0) setTimeout(function(){ _try(n-1); }, 300);
  };
  setTimeout(function(){ _try(6); }, 300);
}
