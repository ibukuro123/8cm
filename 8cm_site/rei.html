<style>
  :root{

  .ruler{flex:1 1 auto;display:flex;align-items:flex-end;gap:6px;height:26px;}

  body.spread.vert #pageA{box-shadow:inset 14px 0 22px -16px rgba(90,72,40,.55);}

  .flip{animation:flip .26s ease;}
  @keyframes flip{from{opacity:.15;transform:translateX(var(--dx,10px));}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){
    .flip{animation:none;} #mark{transition:none;} #finalmark.show{animation:none;}
  }

  /* ---- text blocks ---- */

  /* ---- 目次ページ・しおり ---- */

  .ruler{min-width:0;} .ruler svg{min-width:0;}

  .tocpage .tb{pointer-events:auto;display:flex;align-items:center;gap:.5em;font:inherit;background:none;border:none;padding:.1em;margin:0;color:inherit;cursor:pointer;line-height:1.3;}
  .tocpage .tb:focus-visible{outline:1.5px solid var(--shu);outline-offset:2px;}
  .tocpage .tb:active .t{color:var(--shu);}
  .tocpage .ti .n{color:var(--ink-soft);font-size:.85em;letter-spacing:.2em;flex:0 0 auto;}
  .tocpage .ti .t{flex:0 1 auto;}
  .tocpage .ti .d{flex:1 1 auto;min-width:1em;min-height:1em;border:0 dotted rgba(90,80,60,.45);}
  body:not(.vert) .tocpage .ti .d{border-bottom-width:1px;}
  body.vert .tocpage .ti .d{border-left-width:1px;}
  .tocpage .ti .p{display:inline-block;writing-mode:horizontal-tb;font-size:.72em;color:var(--ink-soft);letter-spacing:.05em;flex:0 0 auto;}
  .page.marked::after{content:"";position:absolute;top:14px;right:22px;width:16px;height:23px;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2020%2028%22%3E%3Cpath%20d%3D%22M10%202%20C10%202%203%2012%203%2017.5%20A7%207%200%200%200%2017%2017.5%20C17%2012%2010%202%2010%202%20Z%22%20fill%3D%22%237fa9c2%22%2F%3E%3Cellipse%20cx%3D%227.6%22%20cy%3D%2217%22%20rx%3D%221.4%22%20ry%3D%222.4%22%20fill%3D%22%23ffffff%22%20opacity%3D%22.45%22%2F%3E%3C%2Fsvg%3E") no-repeat center/contain;z-index:4;pointer-events:none;opacity:.95;}
  body.spread.vert #pageB.marked::after, body.spread:not(.vert) #pageA.marked::after{right:auto;left:22px;}
  #bmBtn[aria-pressed="true"]{color:var(--shu);}
  .foot .bmjump{font:inherit;font-size:11px;letter-spacing:.14em;background:none;border:1px solid rgba(168,64,44,.55);color:var(--shu);padding:3px 10px;cursor:pointer;margin:0 8px;}
  .foot .bmjump[hidden]{display:none;}
  .sheet .bm-item{width:100%;text-align:left;font:inherit;font-size:13px;letter-spacing:.12em;background:none;border:1px solid rgba(168,64,44,.5);color:var(--shu);padding:10px 12px;margin:0 0 14px;cursor:pointer;}
  .sheet .bm-item[hidden]{display:none;}

  #homeLink{font:inherit;font-size:inherit;letter-spacing:.14em;color:var(--ink-soft);text-decoration:none;white-space:nowrap;flex:0 0 auto;}
  #homeLink:hover,#homeLink:focus-visible{color:var(--ink);}
  #homeLink[hidden]{display:none;}
  /* 数字の折れ線 */
  #rulerSvg .ghost{stroke:#5c5343;stroke-width:1.6;opacity:.18;stroke-linejoin:round;stroke-linecap:round;}
  #rulerSvg .ink{stroke:var(--pencil);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;transition:stroke .3s;}

</style>

<script>
const DATA = {"title": "零と一", "sub": "二人ぶんの水", "blocks": [{"t": "opener", "i": 0, "alt": "序章　人の行く裏に道あり"}, {"t": "p", "h": "二十一の秋、カクは紙の上で暮らしていた。"}, {"t": "p", "h": "北の町の、二丁目の坂の上。新聞をとる人間の家がある。"}, {"t": "p", "h": "人間は読み終えた新聞を、勝手口のわきに積んでおく。紐をかけて出すのは、月の終わりだ。"}, {"t": "p", "h": "それまでの三十日、紙の山はカクのものだった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "字は、その山で覚えた。"}, {"t": "p", "h": "だれにも教わっていない。"}, {"t": "p", "h": "大きな字から順に、形を覚えた。形が同じなら、同じ意味だろうと考えた。"}, {"t": "p", "h": "十年かけて、たいていの字が読めるようになった。"}, {"t": "p", "h": "いちばん先に読めるようになったのは、数字だった。"}, {"t": "p", "h": "数字は、形が十しかない。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "彼が読むのは、一面ではない。"}, {"t": "p", "h": "うしろのほうの、細かい数字がびっしり並んだ頁である。"}, {"t": "p", "h": "人間の会社の名前。その横に、数字。"}, {"t": "p", "h": "数字は毎日、少しずつ動く。上がって、下がって、また上がる。"}, {"t": "p", "h": "カクは、それを帳面に写した。"}, {"t": "p", "h": "値札の裏を糸で綴（と）じた帳面である。"}, {"t": "p", "h": "一日ぶんを一行に。十日ぶんで一枚。"}, {"t": "p", "h": "写しているうちに、分かってきた。"}, {"t": "p", "h": "数字には、動き方の癖がある。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "町の者は、だれもその頁を読まなかった。"}, {"t": "p", "h": "字が細かすぎる、と言った。読んでも食えない、と言った。"}, {"t": "p", "h": "カクは、読めば食えることを知っていた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "「明日、この数字は上がる。絶対だ」"}, {"t": "p", "h": "蔵元（くらもと）のじいさんの前で、カクはそう言った。"}, {"t": "p", "h": "蔵元は、町の砂糖粒を預かっている年寄りである。どんな賭けでも、向こう側に立った。"}, {"t": "p", "h": "「上がらなかったら」と蔵元は言った。"}, {"t": "p", "h": "「ぼくの粒は、あんたのものだ」"}, {"t": "p", "h": "「上がったら」"}, {"t": "p", "h": "「倍にして、もらう」"}, {"t": "p", "h": "蔵元は、目を細めた。"}, {"t": "p", "h": "「紙の数字に、粒を張るのか」"}, {"t": "p", "h": "「紙の数字は、人間の粒だ。人間も、張ってる」"}, {"t": "p", "h": "当たる日と、外れる日があった。"}, {"t": "p", "h": "当たる日のほうが、少しだけ多い。"}, {"t": "p", "h": "少し多ければ、それで足りた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "夜、カクは町の者を集めて、話をした。"}, {"t": "p", "h": "「数字には癖がある。三日上がれば、四日目は疲れる。みんなが買いに走ったときには、もう遅い」"}, {"t": "p", "h": "指で、紙の上の数字をたどる。"}, {"t": "p", "h": "「<strong>人の行く裏に、道がある</strong>」"}, {"t": "p", "h": "話の途中で、カクは、ときどき顔を上げた。"}, {"t": "p", "h": "「聞いてるか」"}, {"t": "p", "h": "返事は、なかった。"}, {"t": "p", "h": "話は、いつも途中で終わった。"}, {"t": "p", "h": "聞いていた者が、あくびをして帰るからだ。"}, {"t": "p", "h": "残った者も、数字の話が長くなると、自分の粒の話を始めた。"}, {"t": "p", "h": "最後まで聞いた者は、ひとりもいなかった。"}, {"t": "p", "h": "カクは、それを数えていなかった。"}, {"t": "p", "h": "ゼロは、数えなくていい数だった。"}, {"t": "opener", "i": 1, "alt": "第一章　麦わら帽子は冬に買え"}, {"t": "p", "h": "十日ほど前、北から若い一団が町を通っていった、という噂があった。"}, {"t": "p", "h": "荷を背負って、明け方に来て、日暮れには南へ抜けたという。"}, {"t": "p", "h": "カクは、見ていない。紙を読んでいた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "その一団のひとりを、カクは坂の下の用水路のわきで拾った。"}, {"t": "p", "h": "色の白い若者だった。手が大きい。"}, {"t": "p", "h": "顎の先に、生えかけの髭がある。"}, {"t": "p", "h": "細い横長の眼鏡をかけていたが、片方のつるが折れて、耳に引っかかっていなかった。"}, {"t": "p", "h": "若者は、用水路の縁に腰をおろして、折れたつるを手の中で合わせていた。"}, {"t": "p", "h": "合わせても、離すと、また外れる。"}, {"t": "p", "h": "「北から来たんだ」と若者は言った。「村の連中と、一緒に出た」"}, {"t": "p", "h": "「ほかの者は」"}, {"t": "p", "h": "「先へ行った」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "川を渡るとき、眼鏡を水に落とした。拾ったときには、つるが折れていた。"}, {"t": "p", "h": "見えないまま歩いて、道を外れた。三日探して、もとの道に戻ったら、もういなかった。"}, {"t": "p", "h": "「おれを待ってたら、みんなが冬に追いつかれる。だから、それでいいんだ」"}, {"t": "p", "h": "若者は、それだけ言った。"}, {"t": "p", "h": "恨む言い方ではなかった。道順を言うのと、同じ声だった。"}, {"t": "p", "h": "「なんで、村を出た」"}, {"t": "p", "h": "「冬が、年々きつくなって」若者は、北のほうを見た。「越せるうちに出ようって、みんなで決めた」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "カクは、紙の山を縛っていた人間の紐から、一本だけ糸をほぐして渡した。"}, {"t": "p", "h": "若者は、折れたつるを添え木のように合わせ、糸を巻いた。"}, {"t": "p", "h": "巻いて、結んで、引いて確かめる。"}, {"t": "p", "h": "もう一度結んで、また確かめる。"}, {"t": "p", "h": "三度目に確かめてから、眼鏡をかけた。"}, {"t": "p", "h": "「見える」"}, {"t": "p", "h": "そう言って、若者は短く頭を下げた。"}, {"t": "p", "h": "「ありがとう」"}, {"t": "p", "h": "一度だけだった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "「名前は」とカクは訊いた。"}, {"t": "p", "h": "「ダン」"}, {"t": "p", "h": "町の者は、その若者を「北の」と呼んだ。"}, {"t": "p", "h": "名前を訊いたのは、カクだけだった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "南の町までは、十八日かかると聞いた。"}, {"t": "p", "h": "ひとりで歩くには、糧（かて）が足りない。"}, {"t": "p", "h": "ダンは、糧が貯まるまで、この町に留まることになった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "その晩、カクは、とっておいた菓子のかけらを半分に割った。"}, {"t": "p", "h": "ダンは、受け取ったかけらを、さらに半分に割った。"}, {"t": "p", "h": "片方を食べ、片方を荷にしまった。"}, {"t": "p", "h": "「腹が減ってないのか」"}, {"t": "p", "h": "「減ってるよ」ダンは言った。「明日も減るから」"}, {"t": "p", "h": "水筒の水も、同じだった。"}, {"t": "p", "h": "ダンは、半分だけ飲んで、口を閉じた。"}, {"t": "p", "h": "カクの住処は、勝手口の石段の下にある。"}, {"t": "p", "h": "紙の山の隣で、ダンは寝た。"}, {"t": "p", "h": "昼のあいだ、ダンは町で荷運びをした。"}, {"t": "p", "h": "八百屋の裏から、こぼれた豆を運ぶ。一日運んで、砂糖粒が一つ。"}, {"t": "p", "h": "南への十八日には、とても届かない。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "その夜、カクは、いつもの話をした。"}, {"t": "p", "h": "聞いているのは、ダンだけだった。"}, {"t": "p", "h": "「夏の麦わら帽子は、夏には高い。冬に買えば安い。みんなが要らないときに買って、みんなが欲しがるときに売る」"}, {"t": "p", "h": "ダンは、膝の上で手を組んで聞いていた。"}, {"t": "p", "h": "ときどき、指先で顎の先を一度だけ撫でおろす。"}, {"t": "p", "h": "「<strong>麦わら帽子は、冬に買え</strong>」"}, {"t": "p", "h": "ダンの指が、止まった。"}, {"t": "p", "h": "カクは、そこで言葉を切った。"}, {"t": "p", "h": "いつもの癖だった。"}, {"t": "p", "h": "「……聞いてるか」"}, {"t": "p", "h": "「聞いてるよ」ダンは言った。「続き」"}, {"t": "p", "h": "カクは、口をあけたまま、ダンを見た。"}, {"t": "p", "h": "その問いに返事が来たのは、はじめてだった。"}, {"t": "p", "h": "「村でも、冬のうちに夏の水の心配してた」とダンは言った。「おんなじ話だ」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "カクは、続きを話した。"}, {"t": "p", "h": "数字の癖の話。三日と四日目の話。人の行く裏の話。"}, {"t": "p", "h": "ダンは、あくびをしなかった。自分の話も始めなかった。"}, {"t": "p", "h": "カクが「聞いてるか」と訊くたびに、「聞いてるよ」と返した。"}, {"t": "p", "h": "紙の山の上の窓が、白くなりはじめた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "その夜はじめて、カクは話の終わりまで、しゃべった。"}, {"t": "opener", "i": 2, "alt": "第二章　噂で買って事実で売る"}, {"t": "p", "h": "夕刊は、日暮れに届く。"}, {"t": "p", "h": "人間は、それを玄関の新聞受けに差したまま、夕飯を食べる。紙が家の中に入るのは、食べ終えてからだ。"}, {"t": "p", "h": "そのあいだだけ、今日の数字が、戸の外にある。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "「紙の山には、昨日の数字しかない」とカクは言った。「今日の数字が今日読めたら、一日ぶん、先に行ける」"}, {"t": "p", "h": "新聞受けは、戸の高いところにある。"}, {"t": "p", "h": "カクは、何度ものぼろうとした。"}, {"t": "p", "h": "蝶番（ちょうつがい）の途中で、いつも手が止まった。のぼりきる前に、人間が夕飯を終えた。"}, {"t": "p", "h": "「おれが行く」とダンは言った。"}, {"t": "p", "h": "ダンは、足が速かった。手が強かった。"}, {"t": "p", "h": "蝶番に手をかけ、戸の枠を伝って、新聞受けの口までのぼる。"}, {"t": "p", "h": "折りたたまれた紙のすき間に体を入れ、うしろのほうの頁をめくる。"}, {"t": "p", "h": "紙は、持ち出さない。"}, {"t": "p", "h": "人間に気づかれる。"}, {"t": "p", "h": "ダンは、値札の裏に、鉛筆の芯で数字を写した。"}, {"t": "p", "h": "一字ずつ、ていねいに。"}, {"t": "p", "h": "写し終えると、もう一度、紙と見比べた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "はじめての夕方、ダンは、写した値札の裏をカクに渡した。"}, {"t": "p", "h": "カクは、それを帳面の最後の行と並べた。"}, {"t": "p", "h": "昨日の数字と、今日の数字。"}, {"t": "p", "h": "紙の山の中にしかなかったものが、その日のうちに、手の中にあった。"}, {"t": "p", "h": "「これで、一日、先に行ける」"}, {"t": "p", "h": "「一日ぶんで、いいの?」"}, {"t": "p", "h": "「一日あれば、足りる」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "その夜、ダンは、紙の山のいちばん上に腰かけて、カクの帳面をめくっていた。"}, {"t": "p", "h": "数字が、一日一行、並んでいる。"}, {"t": "p", "h": "ずっと前の頁ほど、字が大きくて、形がいびつだった。"}, {"t": "p", "h": "「これ、いつから書いてるの」"}, {"t": "p", "h": "「字が読めるようになってから」"}, {"t": "p", "h": "「だれに見せるの」"}, {"t": "p", "h": "カクは、少し考えた。"}, {"t": "p", "h": "「だれにも」"}, {"t": "p", "h": "ダンは、帳面を閉じて、カクに返した。"}, {"t": "p", "h": "「村に、壁に線を引いてるばあちゃんがいたんだ。冬を越すたびに、一本」ダンは言った。「だれに見せるのって訊いたら、だれにもって」"}, {"t": "p", "h": "「それで、どうなった」"}, {"t": "p", "h": "「どうもならないよ。線が増えただけ」"}, {"t": "p", "h": "ダンは、指先で顎の先を撫でおろした。"}, {"t": "p", "h": "「おれ、ああいうの、いいと思う」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "カクの読みは、当たりはじめた。"}, {"t": "p", "h": "一日先の数字を読める者は、町にひとりしかいない。"}, {"t": "p", "h": "当たる日が、外れる日を、はっきり追い越した。"}, {"t": "p", "h": "噂が立った。"}, {"t": "p", "h": "紙を読む若いのが、蔵元から粒を取っている。"}, {"t": "p", "h": "町の者が、粒を持ってくるようになった。"}, {"t": "p", "h": "預けるから、増やしてくれ。"}, {"t": "p", "h": "カクは、それを帳面につけた。名前と、粒の数。"}, {"t": "p", "h": "「<strong>噂で買って、事実で売る</strong>」とカクは言った。「みんなが噂で動くころには、ぼくたちはもう、その先にいる」"}, {"t": "p", "h": "カクは、言葉を切った。"}, {"t": "p", "h": "「……聞いてるか」"}, {"t": "p", "h": "「聞いてるよ」"}, {"t": "p", "h": "カクは、少し笑った。"}, {"t": "p", "h": "「おまえ、毎回それだな」"}, {"t": "p", "h": "「カクが、毎回訊くから」ダンは言った。「訊かれたら、答える」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ダンも、自分の糧を預けた。"}, {"t": "p", "h": "三十粒。南への道を、歩ききれない数だった。"}, {"t": "p", "h": "「倍になれば、足りる」とカクは言った。"}, {"t": "p", "h": "「じゃあ、お願い」"}, {"t": "p", "h": "ダンは、それだけ言った。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "夕方、ダンが戸へ向かう前に、カクはいつも急かした。"}, {"t": "p", "h": "早く。人間が箸を置く前に。"}, {"t": "p", "h": "ダンは、水筒の水を二人ぶんに分けた。"}, {"t": "p", "h": "目で量って、同じ高さにそろえる。"}, {"t": "p", "h": "片方をカクに渡してから、言った。"}, {"t": "p", "h": "「<strong>ゆっくり歩け、たくさん水を飲め</strong>」"}, {"t": "p", "h": "「走るのは、おまえだろう」"}, {"t": "p", "h": "「おれは、いいんだよ。カクは、いつも急いでるから」"}, {"t": "p", "h": "ダンは、戸のほうへ歩いていった。"}, {"t": "p", "h": "走りだしたのは、角を曲がってからだった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "帳面の数字を見直しているとき、カクは歌を聞いた。"}, {"t": "p", "h": "ダンが、写した数字を確かめながら、口の中で節をなぞっていた。"}, {"t": "p", "h": "カクの知らない歌だった。"}, {"t": "p", "h": "「それは、なんの歌だ」"}, {"t": "p", "h": "ダンは、顔を上げた。"}, {"t": "p", "h": "「歌?」"}, {"t": "p", "h": "「いま、歌ってた」"}, {"t": "p", "h": "ダンは、少し考えてから、首をかしげた。"}, {"t": "p", "h": "「歌ってたか、おれ」"}, {"t": "opener", "i": 3, "alt": "第三章　頭と尻尾はくれてやれ"}, {"t": "p", "h": "ダンの糧は、ひと月で六十粒になった。"}, {"t": "p", "h": "南への十八日を、歩ききれる数だった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "「初霜の前に、発つよ」とダンは言った。"}, {"t": "p", "h": "カクは、帳面から顔を上げなかった。"}, {"t": "p", "h": "「いまが、いちばん当たってる。あとひと月いれば、百二十になる」"}, {"t": "p", "h": "「六十で、足りるよ」"}, {"t": "p", "h": "「足りるのと、増えるのとは、ちがう」"}, {"t": "p", "h": "ダンは、しばらく黙っていた。"}, {"t": "p", "h": "指先で、顎の先を撫でおろす。"}, {"t": "p", "h": "「前に、カクが言ったんだ」"}, {"t": "p", "h": "ダンは、目を閉じた。"}, {"t": "p", "h": "「<strong>頭と尻尾は、くれてやれ</strong>」"}, {"t": "p", "h": "カクの言ったとおりだった。"}, {"t": "p", "h": "一字も、ちがわなかった。"}, {"t": "p", "h": "「だから、おれ、ここで降りる」"}, {"t": "p", "h": "カクは、なにか言いかけた。"}, {"t": "p", "h": "自分の言葉だった。言い返す言葉が、見つからなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ダンは、荷を詰めはじめた。"}, {"t": "p", "h": "毎朝、ほどいて、詰め直す。"}, {"t": "p", "h": "糧の粒。糸の残り。水筒。"}, {"t": "p", "h": "同じ順番で、同じ場所に。"}, {"t": "p", "h": "「毎朝ほどいて、毎朝詰めてたら、南に着く前に荷がすり切れるぞ」とカクは言った。"}, {"t": "p", "h": "「詰めるたびに、足りないものがわかるんだ」"}, {"t": "p", "h": "そう答えてから、ダンは、一拍おいて、少し笑った。"}, {"t": "p", "h": "カクが冗談を言ったのだと、あとから気づいた顔だった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "南へ下る道の入り口まで、カクはダンを連れて歩いた。"}, {"t": "p", "h": "下見である。"}, {"t": "p", "h": "道は、町のはずれで用水路から離れ、枯れ草のあいだをまっすぐ南へ伸びていた。"}, {"t": "p", "h": "「みんな、ここを通ったんだ」とダンは言った。"}, {"t": "p", "h": "足跡は、もう残っていなかった。"}, {"t": "p", "h": "「追いつけるのか」"}, {"t": "p", "h": "「追いつけなくても、南にいるから。南に行けば、会える」"}, {"t": "p", "h": "ダンは、道の先を見ていた。"}, {"t": "p", "h": "その目は、帳面の数字を見るときと同じだった。"}, {"t": "p", "h": "確かめている目だった。"}, {"t": "p", "h": "「南へ着いたら、どうする」とカクは訊いた。"}, {"t": "p", "h": "「みんなを探す」"}, {"t": "p", "h": "「見つけたら」"}, {"t": "p", "h": "「名前を呼ぶんだ。ひとりずつ」"}, {"t": "p", "h": "ダンは、指を折って数えはじめた。"}, {"t": "p", "h": "村の者の名前を、口の中で言いながら。"}, {"t": "p", "h": "十本目で、指が足りなくなった。"}, {"t": "p", "h": "ダンは、手をひらいて、もう一度、最初から折った。"}, {"t": "p", "h": "八本目で、止まった。"}, {"t": "p", "h": "カクは、その名前をひとつも覚えなかった。"}, {"t": "p", "h": "覚えようとも、思わなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "帰り道、ダンは水筒の水を、また二人ぶんに分けた。"}, {"t": "p", "h": "カクは、一口で飲みほした。"}, {"t": "p", "h": "ダンは、半分だけ飲んで、口を閉じた。"}, {"t": "p", "h": "「ぜんぶ飲めばいいだろう」"}, {"t": "p", "h": "「南の十八日のあいだ、どこに水があるか知らないし」ダンは言った。「知らないうちは、半分とっとく」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "その夜、ダンが寝てから、カクは帳面をひらいた。"}, {"t": "p", "h": "最後の頁の余白に、六十と書いた。"}, {"t": "p", "h": "その横に、百二十と書いた。"}, {"t": "p", "h": "百二十の字を、指でなぞった。"}, {"t": "p", "h": "なぞって、消さずに、帳面を閉じた。"}, {"t": "p", "h": "石段の下は、いつもより広く見えた。"}, {"t": "p", "h": "ダンの荷が、隅に寄せてあったからだ。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "初霜まで、十日だった。"}, {"t": "opener", "i": 4, "alt": "第四章　天井三日、底百日"}, {"t": "p", "h": "その十日のあいだに、カクの読みは、いちばん当たった。"}, {"t": "p", "h": "三日続けて当てた。"}, {"t": "p", "h": "四日目も、当てた。"}, {"t": "p", "h": "蔵元の前に、人が集まるようになった。"}, {"t": "p", "h": "カクが数字を言うたびに、だれかが粒を置いた。"}, {"t": "p", "h": "預かった粒だけでは、張る数が足りなくなった。"}, {"t": "p", "h": "カクは、蔵元から粒を借りて、張る数を増やした。"}, {"t": "p", "h": "「紙食いが、また当てた」"}, {"t": "p", "h": "「北のが、今日も戸をのぼったそうだ」"}, {"t": "p", "h": "カクは、夜の話の場所を、石段の下から、蔵元の灯の前へ移した。"}, {"t": "p", "h": "人が、入りきらなかったからだ。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "それでも、話は、途中で終わった。"}, {"t": "p", "h": "人は集まった。"}, {"t": "p", "h": "集まった者は、明日の数字だけを聞いて、帰っていった。"}, {"t": "p", "h": "癖の話も、人の行く裏の話も、だれも聞かなかった。"}, {"t": "p", "h": "最後に残るのは、いつもダンだった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "灯の前の片づけを手伝いながら、カクは訊いた。"}, {"t": "p", "h": "「おまえは、なんで帰らない」"}, {"t": "p", "h": "ダンは、散らばった値札の裏を、角をそろえて重ねていた。"}, {"t": "p", "h": "「話、まだ終わってないから」"}, {"t": "p", "h": "「みんな、終わる前に帰る」"}, {"t": "p", "h": "「カクの話は、終わりのほうがいいんだ」ダンは言った。「はじめのほうは、どうやって粒を増やすかの話でさ。終わりのほうは、どうやって減らさないかの話になる」"}, {"t": "p", "h": "カクは、自分の話を思い返した。"}, {"t": "p", "h": "そんなふうに組み立てた覚えは、なかった。"}, {"t": "p", "h": "「終わりまで聞かないと、はじめのほうしか残らないだろ」"}, {"t": "p", "h": "ダンは、重ねた紙の角を、もう一度そろえた。"}, {"t": "p", "h": "「はじめのほうだけ持って帰ったら、たぶん、損する」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "五日目の夕方、ダンの戻りが遅れた。"}, {"t": "p", "h": "カクは、石段の下で待った。"}, {"t": "p", "h": "窓の灯が消える少し前に、ダンは戻ってきた。"}, {"t": "p", "h": "肩で息をしていた。"}, {"t": "p", "h": "「人間が、戸をあけたんだ」"}, {"t": "p", "h": "夕飯の途中で、人間が玄関に出てきた。"}, {"t": "p", "h": "ダンは、新聞受けの紙のすき間に、体を押しこんだ。"}, {"t": "p", "h": "人間の手が、すぐ上で、紙の端をつかんだ。"}, {"t": "p", "h": "つかんで、少し引いて、また離した。"}, {"t": "p", "h": "「気づかれたか」"}, {"t": "p", "h": "「気づかれてないよ。気づかれてたら、ここにいない」"}, {"t": "p", "h": "ダンは、上着の前をあけた。"}, {"t": "p", "h": "内側に、値札の裏が一枚、折りたたんであった。"}, {"t": "p", "h": "「紙は、懐に入れとく。濡れても、字が消えないように」"}, {"t": "p", "h": "数字は、一字も崩れていなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "蔵元が、灯の前を片づけながら、カクに言った。"}, {"t": "p", "h": "「当たりの続く読み手は、たいがい、降りられん」"}, {"t": "p", "h": "「降りる理由がない」"}, {"t": "p", "h": "「そうじゃ」老人は、帳面を閉じた。「降りる理由があるときには、もう降りられん」"}, {"t": "p", "h": "<strong>天井三日、底百日</strong>、と老人は言った。"}, {"t": "p", "h": "高いところにいるのは、三日だけ。"}, {"t": "p", "h": "低いところには、百日いる。"}, {"t": "p", "h": "カクは、それを帳面の余白に書いた。"}, {"t": "p", "h": "書いて、それきりにした。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "その夜、ダンは、カクの前に座って、目を閉じた。"}, {"t": "p", "h": "「麦わら帽子は、冬に買え。みんなが要らないときに買って、みんなが欲しがるときに売る」"}, {"t": "p", "h": "カクの言ったとおりだった。"}, {"t": "p", "h": "一字も、ちがわなかった。"}, {"t": "p", "h": "ダンは、指を一本折った。"}, {"t": "p", "h": "「人の行く裏に、道がある」"}, {"t": "p", "h": "二本目を折った。"}, {"t": "p", "h": "噂で買って、事実で売る。三本目。"}, {"t": "p", "h": "頭と尻尾は、くれてやれ。四本目。"}, {"t": "p", "h": "「見切り千両」ダンは、五本目を折った。"}, {"t": "p", "h": "「五つか」"}, {"t": "p", "h": "「いまのとこ」"}, {"t": "p", "h": "カクは、自分の手を見た。"}, {"t": "p", "h": "いつのまにか、ダンと同じ数だけ、指を折っていた。"}, {"t": "p", "h": "粒のほかに、なにかを数えたのは、はじめてだった。"}, {"t": "opener", "i": 5, "alt": "第五章　見切り千両"}, {"t": "p", "h": "数字が下がりはじめたのは、初霜の五日前だった。"}, {"t": "p", "h": "三日続けて下がり、四日目も下がった。"}, {"t": "p", "h": "「疲れたら、戻る」とカクは言った。"}, {"t": "p", "h": "「五日目は、戻る」"}, {"t": "p", "h": "五日目も、下がった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "紙の山の、いちばん新しい頁を、カクは何度も読み返した。"}, {"t": "p", "h": "人間の字で、見出しが大きく刷ってある。"}, {"t": "p", "h": "意味は、半分しか分からなかった。"}, {"t": "p", "h": "数字が崩れている、ということだけは分かった。"}, {"t": "p", "h": "損は、帳面の上で、一日ごとに増えた。"}, {"t": "p", "h": "町の者の粒。蔵元から借りた粒。"}, {"t": "p", "h": "そして、ダンの六十粒。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "<strong>見切り千両</strong>、という言葉を、カクは知っていた。"}, {"t": "p", "h": "人間の紙で読んだ。"}, {"t": "p", "h": "損が小さいうちに、見切って降りる。それには千両の値打ちがある。"}, {"t": "p", "h": "町の者に、何度も話した言葉だった。"}, {"t": "p", "h": "話しながら、分かっているつもりだった。"}, {"t": "p", "h": "ダンが折った指の、五本目だった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "その夜、カクは、帳面の数字ではなく、名前のほうを読んだ。"}, {"t": "p", "h": "粉屋の娘。糸巻きの兄弟。用水路の向こうの年寄り。"}, {"t": "p", "h": "預かったとき、カクは名前を訊かなかった。"}, {"t": "p", "h": "相手が名乗るのを、そのまま書いただけだった。"}, {"t": "p", "h": "名前の横に、粒の数がある。"}, {"t": "p", "h": "十粒。四粒。二十二粒。一粒。"}, {"t": "p", "h": "一粒の横の名前を、カクは長いこと見ていた。"}, {"t": "p", "h": "一粒を預けにきたのは、小さい子だった。"}, {"t": "p", "h": "増えたら、母親に菓子を買う、と言っていた。"}, {"t": "p", "h": "カクは、その名前を、はじめて声に出して読んだ。"}, {"t": "p", "h": "石段の下は、しんとしていた。"}, {"t": "p", "h": "ダンの寝息だけが、聞こえた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "蔵元が、カクを呼んだ。"}, {"t": "p", "h": "「いま清算するなら、預かり粒の半分は返せる」と老人は言った。「わしも、半分でよい」"}, {"t": "p", "h": "半分。"}, {"t": "p", "h": "町の者の粒が、半分戻る。"}, {"t": "p", "h": "ダンの粒も、半分戻る。"}, {"t": "p", "h": "三十粒。"}, {"t": "p", "h": "南の十八日は、歩ききれない。"}, {"t": "p", "h": "「待ってくれ」とカクは言った。「数字は、戻る」"}, {"t": "p", "h": "蔵元は、しばらくカクを見ていた。"}, {"t": "p", "h": "それから、帳面を閉じた。"}, {"t": "p", "h": "「待つのは、わしではない。数字じゃ」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "石段の下に戻ると、ダンが起きていた。"}, {"t": "p", "h": "「降りないのか」とダンが訊いた。"}, {"t": "p", "h": "カクは、帳面を閉じた。"}, {"t": "p", "h": "「ここで降りたら、負けが決まる。降りなければ、まだ決まってない」"}, {"t": "p", "h": "カクは、ダンの顔を見た。"}, {"t": "p", "h": "「……聞いてるか」"}, {"t": "p", "h": "ダンは、なにも言わなかった。"}, {"t": "p", "h": "はじめてだった。"}, {"t": "p", "h": "カクは、自分の言った言葉を、自分の耳で聞き直した。"}, {"t": "p", "h": "聞いてもらうほどの言葉には、聞こえなかった。"}, {"t": "p", "h": "ダンは、指先で顎の先を撫でおろした。"}, {"t": "p", "h": "その手が、途中で止まった。"}, {"t": "p", "h": "「おれの粒も、入ってるの?」"}, {"t": "p", "h": "「倍にして返す」とカクは言った。「<strong>絶対だ</strong>」"}, {"t": "p", "h": "ダンは、長いことカクを見ていた。"}, {"t": "p", "h": "それから、言った。"}, {"t": "p", "h": "「……わかった」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "初霜の朝、ダンは荷を詰め直した。"}, {"t": "p", "h": "詰め直して、背負わずに、石段の下に置いた。"}, {"t": "opener", "i": 6, "alt": "第六章　もうはまだなり"}, {"t": "p", "h": "十日が過ぎた。"}, {"t": "p", "h": "数字は、上がったり下がったりしながら、少しずつ沈んでいった。"}, {"t": "p", "h": "「あと一山」とカクは言った。「一山当てれば、戻る。そしたら、倍の糧で発てる」"}, {"t": "p", "h": "一山は、外れた。"}, {"t": "p", "h": "「あと一山」"}, {"t": "p", "h": "ダンは、なにも言わなかった。"}, {"t": "p", "h": "その日の夕方も、戸のほうへ歩いていった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ダンは、毎日の夕方、戸をのぼった。"}, {"t": "p", "h": "朝の霜が、昼まで溶けなくなった。"}, {"t": "p", "h": "蝶番は、冷たかった。"}, {"t": "p", "h": "戻ってくるダンの指は、値札の裏に数字を写すあいだ、何度か止まった。"}, {"t": "p", "h": "それでも、字は崩れなかった。"}, {"t": "p", "h": "一字ずつ、ていねいに。"}, {"t": "p", "h": "写し終えると、もう一度、見比べた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "町の者は、カクの前で足を止めなくなった。"}, {"t": "p", "h": "粒を返せと言う者がいた。"}, {"t": "p", "h": "なにも言わずに、帳面の自分の名前を指でたどって帰る者もいた。"}, {"t": "p", "h": "ダンは、あいかわらず「北の」と呼ばれた。"}, {"t": "p", "h": "紙食いの手下の北の、と呼ぶ者もいた。"}, {"t": "p", "h": "ダンは、言い返さなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ある夜、ダンが訊いた。"}, {"t": "p", "h": "「粒がなくても、南まで歩けるかな」"}, {"t": "p", "h": "カクは、帳面から顔を上げた。"}, {"t": "p", "h": "「十八日、なにも食わずにか」"}, {"t": "p", "h": "「途中で、荷運びとかすれば」"}, {"t": "p", "h": "「知らない町で、北のを雇う者がいるか」"}, {"t": "p", "h": "ダンは、黙った。"}, {"t": "p", "h": "指先で、顎の先を撫でおろした。"}, {"t": "p", "h": "「あと一山だ」とカクは言った。「一山で、ぜんぶ戻る」"}, {"t": "p", "h": "カクは、そう言いながら、ダンの荷のほうを見なかった。"}, {"t": "p", "h": "見れば、ダンは発つかもしれなかった。"}, {"t": "p", "h": "ダンは、荷の口をほどいて、また結び直した。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "蔵元が、またカクを呼んだ。"}, {"t": "p", "h": "「貸した粒が、預かった粒を越えた」と老人は言った。「次で、清算する」"}, {"t": "p", "h": "「次とは」"}, {"t": "p", "h": "「七日後の夕刊じゃ。その夜、わしの灯が消えるまでに、数字を持ってこい」"}, {"t": "p", "h": "「持ってこなければ」"}, {"t": "p", "h": "「読み手が数字を出せなかったら、読み手の負け。昔からの決まりじゃ」"}, {"t": "p", "h": "老人は、帳面の余白を指でたたいた。"}, {"t": "p", "h": "カクが書いた、底百日の字のところだった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "石段の下に戻ると、ダンが荷を詰め直していた。"}, {"t": "p", "h": "「それが、最後?」とダンは訊いた。"}, {"t": "p", "h": "「最後だ」"}, {"t": "p", "h": "「……わかった」"}, {"t": "p", "h": "ダンは、荷の口を結んだ。"}, {"t": "p", "h": "結んで、引いて、確かめた。"}, {"t": "p", "h": "その夜、ダンはまた、あの歌をなぞっていた。"}, {"t": "p", "h": "カクは、帳面の数字を見ながら、それを聞いていた。"}, {"t": "p", "h": "節は、もう覚えていた。"}, {"t": "p", "h": "文句は、ひとつも知らなかった。"}, {"t": "p", "h": "訊けば、ダンは、また首をかしげるだろう。"}, {"t": "p", "h": "<strong>もうはまだなり</strong>、という言葉がある。"}, {"t": "p", "h": "もう底だと思うときは、まだ底ではない。"}, {"t": "p", "h": "カクは、その言葉を、その夜だけ、思い出さなかった。"}, {"t": "opener", "i": 7, "alt": "第七章　まだはもうなり"}, {"t": "p", "h": "清算の日は、朝から空が低かった。"}, {"t": "p", "h": "昼すぎに、雨になった。"}, {"t": "p", "h": "日暮れには、雨に白いものがまじった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "カクは、蔵元の前に座っていなければならなかった。"}, {"t": "p", "h": "読み手が席を立てば、それで負けになる。"}, {"t": "p", "h": "出がけに、ダンが水筒の水を二人ぶんに分けた。"}, {"t": "p", "h": "目で量って、同じ高さにそろえる。"}, {"t": "p", "h": "カクは、受け取った水に口をつけなかった。"}, {"t": "p", "h": "「急いでくれ」とカクは言った。"}, {"t": "p", "h": "「人間が箸を置く前に」"}, {"t": "p", "h": "ダンは、口をひらいた。"}, {"t": "p", "h": "「ゆっくり――」"}, {"t": "p", "h": "そこで、言葉が止まった。"}, {"t": "p", "h": "ダンは、眼鏡を指の関節で押し上げた。"}, {"t": "p", "h": "糸で縛ったつるが、みぞれで光っていた。"}, {"t": "p", "h": "「……わかった」"}, {"t": "p", "h": "ダンは、走っていった。"}, {"t": "p", "h": "角を曲がる前から、走っていた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "蔵元の灯の前で、カクは待った。"}, {"t": "p", "h": "町の者が、何人か集まっていた。"}, {"t": "p", "h": "帳面に名前のある者たちである。"}, {"t": "p", "h": "だれも、口をきかなかった。"}, {"t": "p", "h": "みぞれが、軒を叩いていた。"}, {"t": "p", "h": "カクは、膝の上の帳面をひらいた。"}, {"t": "p", "h": "ひらいて、閉じた。"}, {"t": "p", "h": "また、ひらいた。"}, {"t": "p", "h": "帳面の最後の頁に、ダンの名前があった。"}, {"t": "p", "h": "町の者の名前のあとに、一行だけ。"}, {"t": "p", "h": "ダン、三十粒。その横に、倍と書いた字が、消さずに残っていた。"}, {"t": "p", "h": "「カクの話は、終わりのほうがいいんだ」"}, {"t": "p", "h": "その声を、カクは思い出していた。"}, {"t": "p", "h": "今夜の話には、まだ終わりが来ていなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "人間の家の窓の灯が、ひとつ、消えた。"}, {"t": "p", "h": "台所の灯だった。"}, {"t": "p", "h": "夕飯が、終わった。"}, {"t": "p", "h": "新聞は、もう戸の外にはない。"}, {"t": "p", "h": "それでも、カクは待った。"}, {"t": "p", "h": "ダンは、数字を写し終えている。"}, {"t": "p", "h": "いまごろ、蝶番を下りている。"}, {"t": "p", "h": "蔵元の灯は、まだ消えていなかった。"}, {"t": "p", "h": "まだ、とカクは思った。"}, {"t": "p", "h": "<strong>まだはもうなり</strong>、という言葉を、カクは知っていた。"}, {"t": "p", "h": "まだ間に合うと思うときは、もう間に合っていない。"}, {"t": "p", "h": "知っていて、カクは、まだ、と思った。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "蔵元の灯が消えるまで、ダンは戻らなかった。"}, {"t": "p", "h": "「読み手の負けじゃ」と蔵元は言った。"}, {"t": "p", "h": "帳面の粒は、すべて蔵元のものになった。"}, {"t": "p", "h": "町の者の粒も。"}, {"t": "p", "h": "ダンの六十粒も。"}, {"t": "p", "h": "町の者は、ひとりずつ、黙って帰っていった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "カクは、みぞれの中へ出た。"}, {"t": "p", "h": "坂の上の家の、玄関の前まで行った。"}, {"t": "p", "h": "戸は、暗かった。"}, {"t": "p", "h": "新聞受けの口が、高いところで、黒く見えた。"}, {"t": "p", "h": "「ダン」"}, {"t": "p", "h": "声は、みぞれにまぎれた。"}, {"t": "p", "h": "暗くて、足もとが見えなかった。"}, {"t": "p", "h": "カクは、戸のまわりを一度だけ回った。"}, {"t": "p", "h": "もう一度、呼んだ。"}, {"t": "p", "h": "返事はなかった。"}, {"t": "p", "h": "石段の下へ戻った。"}, {"t": "p", "h": "ダンの荷が、そこにあった。"}, {"t": "p", "h": "口を結んだまま、置いてあった。"}, {"t": "p", "h": "手をつけていない水筒の水が、二人ぶん、並んでいた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "その夜、カクは眠らなかった。"}, {"t": "opener", "i": 8, "alt": "終章　ゆっくり歩け"}, {"t": "p", "h": "夜が明けると、みぞれは雪に変わって、やんでいた。"}, {"t": "p", "h": "カクは、坂をのぼった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ダンは、玄関の軒下にいた。"}, {"t": "p", "h": "新聞受けの真下だった。"}, {"t": "p", "h": "戸に背を向けて、膝を抱えるように、丸くなっていた。"}, {"t": "p", "h": "蝶番の下の雪に、手をついた跡が、ひとつだけあった。"}, {"t": "p", "h": "眼鏡は、かけたままだった。"}, {"t": "p", "h": "糸は、ほどけていなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "上着は、みぞれを吸って、重かった。"}, {"t": "p", "h": "カクは、ダンの上着の前をあけた。"}, {"t": "p", "h": "内側に、値札の裏が一枚、折りたたんであった。"}, {"t": "p", "h": "濡れていなかった。"}, {"t": "p", "h": "上着の内側だけが、乾いていた。"}, {"t": "p", "h": "ひらいた。"}, {"t": "p", "h": "数字が、書いてあった。"}, {"t": "p", "h": "一字ずつ、ていねいに。"}, {"t": "p", "h": "写し終えてから、もう一度見比べたのだと分かる字だった。"}, {"t": "p", "h": "数字は、下がっていた。"}, {"t": "p", "h": "間に合っていても、カクの負けだった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ダンを、坂の下の用水路のわきに埋めた。"}, {"t": "p", "h": "拾った場所だった。"}, {"t": "p", "h": "土をかける前に、カクは自分の水筒をあけた。"}, {"t": "p", "h": "ゆうべ口をつけなかった水が、そのまま入っていた。"}, {"t": "p", "h": "半分を、ダンの上に注いだ。"}, {"t": "p", "h": "半分を、自分で飲んだ。"}, {"t": "p", "h": "眼鏡は、カクが持った。"}, {"t": "p", "h": "ダンの荷は、ほどかなかった。"}, {"t": "p", "h": "六十粒は、入っていなかった。"}, {"t": "p", "h": "糸の残りと、水筒と、半分に割った菓子のかけら。"}, {"t": "p", "h": "詰め直された順番のまま、埋めた土の上に置いた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "それから、カクは町の者の家を、一軒ずつ回った。"}, {"t": "p", "h": "帳面を持って行った。"}, {"t": "p", "h": "戸口で、相手の名前を言い、預かった粒の数を言った。"}, {"t": "p", "h": "それが、全部なくなったことを言った。"}, {"t": "p", "h": "なぜなくなったのかを話そうとすると、相手は戸を閉めた。"}, {"t": "p", "h": "最後まで聞いた者は、ひとりもいなかった。"}, {"t": "p", "h": "カクは、帳面に印をつけた。"}, {"t": "p", "h": "名前の横に、ひとつずつ。"}, {"t": "p", "h": "戸を閉められた数も、帳面の端に書いた。"}, {"t": "p", "h": "数え終えるのに、冬がひとつかかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "最後に、蔵元の戸口へ行った。"}, {"t": "p", "h": "蔵元は、カクの帳面をのぞきこんだ。"}, {"t": "p", "h": "名前が並び、その横に印が並んでいる。"}, {"t": "p", "h": "端のほうに、別の数が書いてある。"}, {"t": "p", "h": "「それは、なんの数じゃ」"}, {"t": "p", "h": "「戸を閉められた数」"}, {"t": "p", "h": "老人は、長いこと黙っていた。"}, {"t": "p", "h": "「そんなものを数えて、どうする」"}, {"t": "p", "h": "「分からない」とカクは言った。「分からないから、数える」"}, {"t": "p", "h": "「いつまで」"}, {"t": "p", "h": "カクは、帳面を閉じた。"}, {"t": "p", "h": "「ずっと」"}, {"t": "p", "h": "蔵元は、戸を閉めなかった。"}, {"t": "p", "h": "閉めずに、奥へ引っこんだ。"}, {"t": "p", "h": "カクは、戸口に立ったまま、帳面の端に、なにも書かなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "春の終わりに、町の若い者が、石段の下へ来た。"}, {"t": "p", "h": "紙を読めるんだろう、と言った。"}, {"t": "p", "h": "明日、あの数字は上がるのか、と訊いた。"}, {"t": "p", "h": "カクは、口をひらいた。"}, {"t": "p", "h": "ひらいた口が、一度、止まった。"}, {"t": "p", "h": "「上がるかもしれない」とカクは言った。「下がるかもしれない」"}, {"t": "p", "h": "若い者は、首をかしげて帰っていった。"}, {"t": "p", "h": "カクは、それから一度も、絶対とは言わなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ダンが指を折った言葉は、五つあった。"}, {"t": "p", "h": "カクは、石段の下で、指を折って数えた。"}, {"t": "p", "h": "一つ目から、五つ目まで、声に出して言った。"}, {"t": "p", "h": "「……聞いてるか」"}, {"t": "p", "h": "返事は、なかった。"}, {"t": "p", "h": "言い終えると、また一つ目から言った。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "南へ下る道の入り口に、カクは立った。"}, {"t": "p", "h": "枯れ草のあいだに、青いものがまじりはじめていた。"}, {"t": "p", "h": "道は、まっすぐ南へ伸びていた。"}, {"t": "p", "h": "村の者たちの足跡も、ダンの足跡も、そこにはなかった。"}, {"t": "p", "h": "懐の中で、眼鏡のつるに触れた。"}, {"t": "p", "h": "糸の結び目が、指に当たった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "口の中で、節をなぞった。"}, {"t": "p", "h": "文句は、知らない。"}, {"t": "p", "h": "ダンは、一度も、歌っていると気づかなかった。"}, {"t": "p", "h": "だから、文句を訊けなかった。"}, {"t": "p", "h": "節だけが、残っていた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "カクは、指先で、自分の顎の先を撫でおろした。"}, {"t": "p", "h": "カクは、髭を生やしていなかった。"}, {"t": "p", "h": "「<strong>ゆっくり歩け</strong>」"}, {"t": "p", "h": "だれもいない道に、そう言った。"}, {"t": "p", "h": "「<strong>たくさん、水を飲め</strong>」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "最後まで聞いた者は、ひとりだった。"}, {"t": "p", "h": "ひとりは、数えなければならない数だった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "カクは、指を一本立てた。"}, {"t": "p", "h": "だれのほうも、見なかった。"}, {"t": "end", "h": "了"}], "chapters": [{"title": "序章　人の行く裏に道あり", "b": 0}, {"title": "第一章　麦わら帽子は冬に買え", "b": 54}, {"title": "第二章　噂で買って事実で売る", "b": 131}, {"title": "第三章　頭と尻尾はくれてやれ", "b": 215}, {"title": "第四章　天井三日、底百日", "b": 281}, {"title": "第五章　見切り千両", "b": 353}, {"title": "第六章　もうはまだなり", "b": 420}, {"title": "第七章　まだはもうなり", "b": 480}, {"title": "終章　ゆっくり歩け", "b": 552}]};

(function drawRuler(){
  const svg = document.getElementById('rulerSvg');
  const VAL = [0.40,0.46,0.58,0.66,0.92,0.55,0.34,0.20,0.06];   /* 章ごとのカクの勝ち具合 */
  const ch = DATA.chapters, total = DATA.blocks.length;
  const pts = [];
  function y(v){ return 23 - v*18; }
  for(let i=0; i<ch.length; i++){
    const a = ch[i].b / total;
    const b = (i+1 < ch.length ? ch[i+1].b : total) / total;
    const v0 = VAL[i] !== undefined ? VAL[i] : 0.5;
    const v1 = (i+1 < ch.length && VAL[i+1] !== undefined) ? VAL[i+1] : v0;
    for(let k=0; k<5; k++){
      const t = k/5, f = a + (b-a)*t;
      const v = v0 + (v1-v0)*t + Math.sin((i*3+k)*1.7)*0.02;
      pts.push((10 + f*286).toFixed(1) + ',' + y(v).toFixed(1));
    }
  }
  pts.push((296).toFixed(1) + ',' + y(VAL[VAL.length-1]).toFixed(1));
  const d = pts.join(' ');
  svg.innerHTML =
    '<polyline class="ghost" points="'+d+'" fill="none"/>'
    + '<clipPath id="chartClip"><rect id="chartRect" x="0" y="0" width="0" height="26"/></clipPath>'
    + '<g clip-path="url(#chartClip)"><polyline class="ink" points="'+d+'" fill="none"/></g>';
})();

function anchorOf(p){
  const pg = pages[p]; if(!pg) return null;
  for(const b of pg){ if(b && b.src!=null) return {s:b.src, p:b.part||0}; }
  if(pg[0] && pg[0].t==='toc') return {toc:true};
  return null;
}
function pageOfAnchor(a){
  if(!a) return -1;
  if(a.toc) return pages.findIndex(pg=>pg[0] && pg[0].t==='toc');
  for(let p=1;p<pages.length;p++) for(const b of pages[p]) if(b && b.src===a.s && (b.part||0)>=a.p) return p;
  for(let p=1;p<pages.length;p++) for(const b of pages[p]) if(b && b.src!=null && b.src>=a.s) return p;
  return -1;
}

/* ---------- blocks -> DOM ---------- */
function makeEl(b){
  let el;
  if(b.t==='h2'){ el=document.createElement('h2'); el.innerHTML=b.h; }
  else if(b.t==='quote'){ el=document.createElement('blockquote'); el.innerHTML=b.h; }
  else if(b.t==='sep'){ el=document.createElement('div'); el.className='sep'; el.innerHTML=SEPSVG; }
  else if(b.t==='opener'){ el=document.createElement('div'); el.className='opener'; const im=document.createElement('img'); im.src=IMGS[b.i]; im.alt=b.alt.replace('\u3000',' '); el.appendChild(im); }
  else if(b.t==='end'){ el=document.createElement('p'); el.className='endmark'; el.textContent=b.h; }
  else { el=document.createElement('p'); el.innerHTML=b.h; }
  return el;
}
function contentBox(el){
  const r = el.getBoundingClientRect(), cs = getComputedStyle(el);
  return {
    left:   r.left   + parseFloat(cs.paddingLeft   || 0),
    right:  r.right  - parseFloat(cs.paddingRight  || 0),
    top:    r.top    + parseFloat(cs.paddingTop    || 0),
    bottom: r.bottom - parseFloat(cs.paddingBottom || 0)
  };
}
/* scrollWidth is unreliable in vertical-rl (content overflows leftward),
   so compare the last child's far edge with the page's content box. */
function over(el){
  const kids = el.children;
  if(!kids.length) return false;
  const box = contentBox(el);
  const k = kids[kids.length-1], r = k.getBoundingClientRect(), ks = getComputedStyle(k);
  return vertical
    ? (r.left - parseFloat(ks.marginLeft || 0)) < box.left - 0.5
    : (r.bottom + parseFloat(ks.marginBottom || 0)) > box.bottom + 0.5;
}
function splitText(t){
  const out=[]; let cur='';
  for(let i=0;i<t.length;i++){
    cur+=t[i];
    if('。！？」'.indexOf(t[i])>=0 && cur.length>=40){ out.push(cur); cur=''; }
  }
  if(cur) out.push(cur);
  return out.length?out:[t];
}

/* ---------- pagination ---------- */
function paginate(){
  const m = document.getElementById('measure'), mc = document.getElementById('mcol');
  const ref = document.getElementById('pageA').getBoundingClientRect();
  m.className='page';
  m.style.width = ref.width+'px';
  m.style.height = ref.height+'px';
  mc.innerHTML='';

  pages = [[{t:'cover'}],[{t:'toc'}]];
  chapPage = [];
  let cur = [];
  const push = ()=>{ if(cur.length){ pages.push(cur); cur=[]; } mc.innerHTML=''; };

  const esc = t => t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const drop = el => { if(el && el.parentNode) el.parentNode.removeChild(el); };

  // 1ページに単独で収まらない塊を、収まる単位に割って順番どおり流しこむ
  const flowSplit = (b)=>{
    let part = 0;
    if(b.t==='quote'){                    // 手紙は行単位で分ける
      const trim = a=>{ const c=a.slice();
        while(c.length && c[0]==='') c.shift();
        while(c.length && c[c.length-1]==='') c.pop();
        return c; };
      const lines = b.h.split('<br>');
      let buf=[], node=null;
      for(const ln of lines){
        const trial = buf.concat([ln]);
        drop(node);
        node = makeEl({t:'quote', h: trim(trial).join('<br>')});
        mc.appendChild(node);
        if(over(mc) && trim(buf).length){
          drop(node);
          cur.push({t:'quote', h: trim(buf).join('<br>'), src:b.src, part:part++});
          push();
          buf = (ln==='') ? [] : [ln];
          node = buf.length ? makeEl({t:'quote', h: ln}) : null;
          if(node) mc.appendChild(node);
        } else {
          buf = trial;
        }
      }
      if(trim(buf).length) cur.push({t:'quote', h: trim(buf).join('<br>'), src:b.src, part:part++});
      return;
    }
    for(const c of splitText(makeEl(b).textContent)){   // 段落は文単位で分ける
      const blk = {t:'p', h: esc(c), src:b.src, part:part++};
      let node = makeEl(blk);
      mc.appendChild(node);
      if(over(mc) && cur.length){ drop(node); push(); node = makeEl(blk); mc.appendChild(node); }
      cur.push(blk);
    }
  };

  const feed = (b, chIndex)=>{
    if(b.t==='opener'){ push(); if(chIndex!=null) chapPage[chIndex]=pages.length; pages.push([b]); mc.innerHTML=''; return; }
    const el = makeEl(b);
    mc.appendChild(el);
    if(over(mc)){
      mc.removeChild(el);
      if(cur.length) push();
      mc.appendChild(el);
      if(over(mc)){                       // ページ丸ごと使っても収まらない
        mc.removeChild(el);
        if(chIndex!=null) chapPage[chIndex] = pages.length;
        flowSplit(b);
        return;
      }
    }
    if(chIndex!=null) chapPage[chIndex] = pages.length;
    cur.push(b);
  };

  const chStart = {};
  DATA.chapters.forEach((c,i)=>{ chStart[c.b]=i; });
  DATA.blocks.forEach((b,i)=> feed(b, chStart[i]!=null?chStart[i]:null));
  push();

  // verify: re-measure every page and move any spilled block to the next one
  for(let p=1;p<pages.length;p++){
    if(pages[p][0] && (pages[p][0].t==='toc' || pages[p][0].t==='opener')) continue;
    mc.innerHTML='';
    const keep=[]; const spill=[];
    for(const b of pages[p]){
      if(spill.length){ spill.push(b); continue; }
      const el=makeEl(b); mc.appendChild(el);
      if(over(mc) && keep.length){ mc.removeChild(el); spill.push(b); }
      else keep.push(b);
    }
    if(spill.length){
      pages[p]=keep;
      pages.splice(p+1,0,spill);
      for(let c=0;c<chapPage.length;c++) if(chapPage[c]>p) chapPage[c]++;
    }
  }
  mc.innerHTML='';
  if(pages.length%2===0 && spread) pages.push([{t:'blank'}]);
}

  }
  if(page[0] && page[0].t==='blank'){ hostPage.classList.add('blank'); return; }
  if(page[0] && page[0].t==='toc'){ renderToc(host); return; }
  page.forEach(b=> host.appendChild(makeEl(b)));
}

function update(dir){
  const A=document.getElementById('pageA'), B=document.getElementById('pageB');
  if(spread && idx>0 && idx%2===0) idx--;
  idx = Math.max(0, Math.min(pages.length-1, idx));

  if(spread && idx>0){ renderPage(A,pages[idx]); renderPage(B,pages[idx+1]); }
  else { renderPage(A,pages[idx]); renderPage(B,null); }

  if(dir){
    const dx = (dir>0 ? (vertical?-14:14) : (vertical?14:-14))+'px';
    [A,B].forEach(el=>{ el.style.setProperty('--dx',dx); el.classList.remove('flip'); void el.offsetWidth; el.classList.add('flip'); });
  }

  const bp = pageOfAnchor(bm), vis = visiblePages();
  A.classList.toggle('marked', bm!=null && bp===vis[0]);
  B.classList.toggle('marked', bm!=null && vis.length>1 && bp===vis[1]);
  const here = bm!=null && vis.indexOf(bp)>=0;
  const bb = document.getElementById('bmBtn');
  bb.setAttribute('aria-pressed', String(here));
  bb.disabled = (idx===0 && !spread) || (idx===0);
  bb.setAttribute('aria-label', here ? 'しおりを外す' : 'このページにしおりをはさむ');
  document.getElementById('bmJump').hidden = !(bm && bp>0 && !here);
  const bi = document.getElementById('bmItem');
  bi.hidden = !(bm && bp>0);
  if(bp>0) bi.textContent = 'しおりのページへ（' + bp + '）';
  const last = pages.length-1;
  const prog = last>0 ? idx/last : 0;
  (function(){
    var r = document.getElementById('chartRect');
    if(r) r.setAttribute('width', (10 + prog*286).toFixed(1));
    var ink = document.querySelector('#rulerSvg .ink');
    if(ink) ink.classList.toggle('fin', idx===last);
  })();

  let name='';
  for(let i=0;i<DATA.chapters.length;i++){ if(chapPage[i]!=null && chapPage[i]<=idx) name=DATA.chapters[i].title; }
  document.getElementById('chapNow').textContent = idx===0 ? '' : name;
  document.getElementById('pageNow').textContent = idx===0 ? '表紙' : (idx + ' / ' + last);
  document.querySelectorAll('.toc-item').forEach(el=>{
    el.setAttribute('aria-current', String(Number(el.dataset.p)<=idx && (Number(el.dataset.next)>idx || el.dataset.next==='')));
  });
}

function go(step){ const n=idx+step*(spread&&idx>0?2:1); if(n<0||n>pages.length-1) return; idx=n; update(step); }
function next(){ go(1); } function prev(){ go(-1); }

/* ---------- column fitting ---------- */
function fitColumn(){
  const pa = document.getElementById('pageA'), cs = getComputedStyle(pa);
  const avail = vertical
    ? pa.clientHeight - parseFloat(cs.paddingTop)  - parseFloat(cs.paddingBottom)
    : pa.clientWidth  - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const n = CHARS[sizeIdx];
  let fs = Math.min(SIZES[sizeIdx], avail / (n * KERN));
  fs = Math.max(12.5, fs);
  const colw = Math.min(avail, Math.floor(fs * n * KERN));
  document.documentElement.style.setProperty('--fs', fs.toFixed(2)+'px');
  document.documentElement.style.setProperty('--colw', colw+'px');
}

/* ---------- layout ---------- */
function layout(keepBlock){
  spread = window.innerWidth >= 940 && window.innerHeight >= 420;
  document.body.classList.toggle('spread', spread);
  document.body.classList.toggle('vert', vertical);
  document.documentElement.style.setProperty('--fs', SIZES[sizeIdx]+'px');
  document.documentElement.style.setProperty('--lh', vertical? '1.95' : '2.05');
  requestAnimationFrame(()=>{
    fitColumn();
    paginate();
    if(keepBlock!=null){
      let found=0;
      for(let p=1;p<pages.length;p++){ if(pages[p].some(b=>b===keepBlock)){ found=p; break; } }
      idx = found || Math.min(idx, pages.length-1);
    }
    buildToc();
    update(0);
  });
}
function currentBlock(){ const p=pages[idx]; return p && p[0] && p[0].t!=='cover' ? p[0] : null; }

/* ---------- toc ---------- */
function buildToc(){
  const list=document.getElementById('tocList');
  list.innerHTML='';
  DATA.chapters.forEach((c,i)=>{
    const b=document.createElement('button');
    b.className='toc-item'; b.dataset.p=chapPage[i]||1;
    b.dataset.next = (chapPage[i+1]!=null? chapPage[i+1] : '');
    b.innerHTML='<span>'+c.title+'</span><span class="pg">'+(chapPage[i]||1)+'</span>';
    b.onclick=()=>{ idx=chapPage[i]||1; closeSheets(); update(1); };
    list.appendChild(b);
  });
}

/* ---------- sheets ---------- */
function closeSheets(){ document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('open')); }
try{ if(!/claude\.ai$/i.test(location.hostname) && !/^blob:/.test(location.href)) document.getElementById('homeLink').hidden=false; }catch(e){}
document.getElementById('bmBtn').onclick=toggleBm;
document.getElementById('bmJump').onclick=goBm;
document.getElementById('bmItem').onclick=goBm;
document.getElementById('tocBtn').onclick=()=>document.getElementById('tocSheet').classList.add('open');
document.getElementById('setBtn').onclick=()=>document.getElementById('setSheet').classList.add('open');
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheets);
document.querySelectorAll('.sheet').forEach(s=>s.addEventListener('click',e=>{ if(e.target===s) closeSheets(); }));

document.getElementById('dirSeg').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  const keep=currentBlock();
  vertical = b.dataset.dir==='v';
  document.querySelectorAll('#dirSeg button').forEach(x=>x.setAttribute('aria-pressed', String(x===b)));
  layout(keep);
};
document.getElementById('sizeSeg').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  const keep=currentBlock();
  sizeIdx=Number(b.dataset.size);
  document.querySelectorAll('#sizeSeg button').forEach(x=>x.setAttribute('aria-pressed', String(x===b)));
  layout(keep);
};

/* ---------- input ---------- */
/* 目次ページの項目がページ送りの領域の下にあっても押せるようにする */
function tocHit(e){
  if(!e || (!e.clientX && !e.clientY)) return false;
  const zs=document.querySelectorAll('.zone'); zs.forEach(z=>z.style.pointerEvents='none');
  const el=document.elementFromPoint(e.clientX,e.clientY);
  zs.forEach(z=>z.style.pointerEvents='');
  const t=el && el.closest ? el.closest('.tocpage .tb') : null;
  if(t){ t.click(); return true; }
  return false;
}
document.getElementById('zoneL').onclick=e=>{ if(tocHit(e)) return; vertical? next() : prev(); };
document.getElementById('zoneR').onclick=e=>{ if(tocHit(e)) return; vertical? prev() : next(); };
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') vertical?prev():next();
  else if(e.key==='ArrowLeft') vertical?next():prev();
  else if(e.key===' '||e.key==='ArrowDown'){ e.preventDefault(); next(); }
  else if(e.key==='ArrowUp') prev();
  else if(e.key==='Escape') closeSheets();
});
let tx=0,ty=0;
const bookEl=document.getElementById('book');
bookEl.addEventListener('touchstart',e=>{ tx=e.changedTouches[0].clientX; ty=e.changedTouches[0].clientY; },{passive:true});
bookEl.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)<44 || Math.abs(dx)<Math.abs(dy)) return;
  if(dx<0) vertical?prev():next(); else vertical?next():prev();
},{passive:true});

let rt;
window.addEventListener('resize',()=>{ clearTimeout(rt); const keep=currentBlock(); rt=setTimeout(()=>layout(keep),180); });

if(document.fonts && document.fonts.ready){ document.fonts.ready.then(()=>layout(null)); }
layout(null);

/* shioriAuto: トップページからの「しおりの続きから」 */
if(/[?&]shiori=1/.test(location.search)){
  var _try=function(n){
    try{
      if(bm){ var p=pageOfAnchor(bm); if(p>0){ idx=p; update(0); return; } }
    }catch(e){}
    if(n>0) setTimeout(function(){ _try(n-1); }, 300);
  };
  setTimeout(function(){ _try(6); }, 300);
}
</script>
