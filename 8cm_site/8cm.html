<!DOCTYPE html>
<html lang="ja">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">

<style>
  :root{
    --paper:#e3ddcb;
    --paper-deep:#d6cfba;
    --edge:#c2b9a0;
    --ink:#2b2722;
    --ink-soft:#6d6557;
    --pencil:#4d5157;
    --shu:#a8402c;
    --fs:17px;
    --lh:2.05;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    background:#b9b09a;
    background-image:
      radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.18), transparent 60%),
      repeating-linear-gradient(102deg, rgba(0,0,0,.025) 0 2px, transparent 2px 5px);
    color:var(--ink);
    font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP","Songti SC",serif;
    overflow:hidden;
    -webkit-text-size-adjust:100%;
  }
  #app{height:100dvh;display:flex;flex-direction:column;}

  /* ---- top bar ---- */
  .bar{
    flex:0 0 auto;display:flex;align-items:center;gap:14px;
    padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
  }
  .bar button{
    font:inherit;font-size:13px;letter-spacing:.14em;
    background:none;border:none;color:#4a4335;padding:6px 2px;cursor:pointer;
  }
  .bar button:focus-visible{outline:1.5px solid var(--shu);outline-offset:3px;}

  /* ---- ruler ---- */
  .ruler{flex:1 1 auto;display:flex;align-items:flex-end;gap:6px;height:26px;}
  .ruler .rn{font-size:11px;color:#5c5343;line-height:1;padding-bottom:3px;}
  .ruler svg{flex:1 1 auto;width:100%;height:100%;display:block;overflow:visible;}
  .rulerline{stroke:#5c5343;stroke-width:1;}
  .tick{stroke:#5c5343;stroke-width:1;}
  .tick.mm{stroke:#5c5343;opacity:.45;}
  .num{fill:#5c5343;font-size:9px;font-family:inherit;}
  #mark{transition:transform .35s cubic-bezier(.3,.7,.3,1);}
  #mark line{stroke:var(--pencil);stroke-width:2;stroke-linecap:round;}
  #mark text{fill:var(--pencil);font-size:8.5px;letter-spacing:.06em;}
  #finalmark{opacity:0;}
  #finalmark line{stroke:var(--shu);stroke-width:2.4;stroke-linecap:round;}
  #finalmark text{fill:var(--shu);font-size:9px;}
  #finalmark.show{opacity:1;animation:scratch .7s ease-out;}
  @keyframes scratch{from{clip-path:inset(0 0 100% 0);}to{clip-path:inset(0 0 0 0);}}

  /* ---- book ---- */
  #book{flex:1 1 auto;position:relative;padding:0 10px 4px;min-height:0;}
  .spread{
    height:100%;display:flex;gap:0;justify-content:center;
    filter:drop-shadow(0 10px 22px rgba(60,50,30,.32));
  }
  body.vert .spread{flex-direction:row-reverse;}
  .page{
    position:relative;flex:1 1 0;min-width:0;height:100%;max-width:640px;
    background:var(--paper);
    background-image:
      radial-gradient(ellipse at 20% 12%, rgba(255,255,255,.5), transparent 55%),
      radial-gradient(ellipse at 85% 90%, rgba(150,130,90,.18), transparent 60%);
    padding:26px 20px calc(22px + env(safe-area-inset-bottom));
    overflow:hidden;
    font-size:var(--fs);line-height:var(--lh);
    letter-spacing:.03em;
    text-align:justify;
  }
  body.vert .page{writing-mode:vertical-rl;text-orientation:mixed;text-align:start;}
  .col{inline-size:var(--colw,100%);block-size:100%;margin-inline:auto;}
  .page.blank{background:var(--paper-deep);}
  #pageB{display:none;}
  body.spread #pageB{display:block;}
  body.spread #pageA{box-shadow:inset -14px 0 22px -16px rgba(90,72,40,.55);}
  body.spread #pageB{box-shadow:inset 14px 0 22px -16px rgba(90,72,40,.55);}
  body.spread.vert #pageA{box-shadow:inset 14px 0 22px -16px rgba(90,72,40,.55);}
  body.spread.vert #pageB{box-shadow:inset -14px 0 22px -16px rgba(90,72,40,.55);}

  .flip{animation:flip .26s ease;}
  @keyframes flip{from{opacity:.15;transform:translateX(var(--dx,10px));}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){
    .flip{animation:none;} #mark{transition:none;} #finalmark.show{animation:none;}
  }

  /* ---- text blocks ---- */
  .page p{margin:0;text-indent:1em;}
  .page p + p{margin-top:0;}
  body.vert .page p{text-indent:1em;}
  .page h2{
    margin:0 0 1.6em;font-size:1.22em;font-weight:600;letter-spacing:.22em;
    line-height:1.7;text-indent:0;
  }
  body:not(.vert) .page h2{border-bottom:1px solid rgba(90,80,60,.28);padding-bottom:.5em;}
  body.vert .page h2{border-left:1px solid rgba(90,80,60,.28);padding-left:.5em;margin:0 0 1.6em 0;}
  .page blockquote{
    margin:1.2em .4em;padding:0 1em;color:#4b4335;font-size:.94em;
    border-left:2px solid rgba(120,100,60,.4);
  }
  body.vert .page blockquote{
    margin:.4em 1.2em;padding:1em 0;border-left:none;
    border-top:2px solid rgba(120,100,60,.4);
  }
  .sep{margin:1.5em auto;width:34%;height:0;border-top:1px solid rgba(90,80,60,.3);}
  body.vert .sep{margin:auto 1.5em;height:34%;width:0;border-top:none;border-left:1px solid rgba(90,80,60,.3);}
  .endmark{margin:2em 0 0;text-align:center;letter-spacing:.6em;color:var(--ink-soft);text-indent:0;}
  strong{font-weight:700;}
  body.vert strong{
    text-emphasis:filled dot var(--ink);-webkit-text-emphasis:filled dot var(--ink);
    font-weight:inherit;
  }
  em{font-style:normal;color:var(--ink-soft);}

  /* ---- cover ---- */
  .cover{display:flex;align-items:center;justify-content:center;height:100%;max-height:100%;}
  .cover-in{text-align:center;max-width:100%;}
  body.vert .cover-in{writing-mode:vertical-rl;height:100%;max-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;}
  .cover h1{
    margin:0;font-size:min(6.6vh,8.2vw,50px);font-weight:400;
    letter-spacing:.22em;line-height:1.45;text-indent:0;
  }
  body.vert .cover h1{max-height:100%;}
  .cover .sub{margin-top:1.4em;font-size:.86em;letter-spacing:.34em;color:var(--ink-soft);}
  body.vert .cover .sub{margin:1.4em 0 0;}
  .cover .pillar{margin-top:2.2em;}
  body.vert .cover .pillar{margin:2.2em 0 0;}
  .cover .pillar svg{max-height:22vh;}

  /* ---- tap zones + footer ---- */
  .zone{position:absolute;top:0;bottom:0;width:34%;border:none;background:none;cursor:pointer;padding:0;}
  .zone.l{left:0;} .zone.r{right:0;}
  .zone:focus-visible{outline:1.5px dashed var(--shu);outline-offset:-6px;}
  .foot{
    flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;
    padding:8px 18px calc(env(safe-area-inset-bottom) + 8px);
    font-size:11.5px;letter-spacing:.14em;color:#514936;
  }
  .foot span{opacity:.85;}

  /* ---- sheets ---- */
  .sheet{
    position:fixed;inset:0;z-index:20;display:none;
    background:rgba(40,34,24,.5);backdrop-filter:blur(2px);
  }
  .sheet.open{display:block;}
  .sheet-in{
    position:absolute;left:0;right:0;bottom:0;max-height:76%;overflow:auto;
    background:var(--paper);padding:22px 22px calc(env(safe-area-inset-bottom) + 26px);
    border-radius:2px 2px 0 0;
  }
  .sheet h3{margin:0 0 16px;font-size:14px;letter-spacing:.24em;font-weight:600;color:#4a4335;}
  .toc-item{
    display:flex;justify-content:space-between;gap:14px;width:100%;
    font:inherit;font-size:15px;text-align:left;background:none;border:none;
    padding:11px 0;border-bottom:1px solid rgba(90,80,60,.18);color:var(--ink);cursor:pointer;
  }
  .toc-item .pg{font-size:11px;color:var(--ink-soft);letter-spacing:.1em;flex:0 0 auto;}
  .toc-item[aria-current="true"]{color:var(--shu);}
  .row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid rgba(90,80,60,.18);}
  .row:last-child{border-bottom:none;}
  .row .lab{font-size:14px;letter-spacing:.1em;}
  .seg{display:flex;border:1px solid rgba(90,80,60,.4);}
  .seg button{
    font:inherit;font-size:13px;padding:7px 15px;background:none;border:none;cursor:pointer;color:#4a4335;
    border-left:1px solid rgba(90,80,60,.25);
  }
  .seg button:first-child{border-left:none;}
  .seg button[aria-pressed="true"]{background:#4a4335;color:var(--paper);}
  .close{margin-top:20px;width:100%;font:inherit;font-size:13px;letter-spacing:.2em;padding:12px;background:none;border:1px solid rgba(90,80,60,.4);cursor:pointer;color:#4a4335;}

  #measure{position:fixed;top:-99999px;left:0;visibility:hidden;pointer-events:none;}

  /* ---- 電子版デザイン ---- */
  .page .opener{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#f1ece0;writing-mode:horizontal-tb;}
  .page .opener img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;}
  .sep{display:flex;align-items:center;justify-content:center;border:none !important;margin:1.4em auto;width:auto;height:auto;}
  body.vert .sep{margin:auto 1.3em;width:auto;height:auto;}
  body:not(.vert) .sep svg{transform:rotate(-90deg);}
  body.vert .sep svg{transform:none;}

  /* ---- 目次ページ・しおり ---- */
  .bar button{white-space:nowrap;flex:0 0 auto;}
  .ruler .rn{white-space:nowrap;flex:0 0 auto;}
  .ruler{min-width:0;} .ruler svg{min-width:0;}
  .bar{gap:10px;}
  .tocpage{position:relative;z-index:3;pointer-events:none;display:flex;flex-direction:column;gap:.45em;height:100%;}
  body.vert .tocpage{padding-top:0;}
  .tocpage h2{margin:0 0 .5em;border:none !important;padding:0 !important;font-size:1.05em;letter-spacing:.5em;}
  .tocpage .ti{display:flex;align-items:center;gap:.5em;font:inherit;background:none;border:none;padding:0;margin:0;color:var(--ink);cursor:pointer;text-align:start;line-height:1.3;}
  .tocpage .tb{pointer-events:auto;display:flex;align-items:center;gap:.5em;font:inherit;background:none;border:none;padding:.1em;margin:0;color:inherit;cursor:pointer;line-height:1.3;}
  .tocpage .tb:focus-visible{outline:1.5px solid var(--shu);outline-offset:2px;}
  .tocpage .tb:active .t{color:var(--shu);}
  .tocpage .ti .n{color:var(--ink-soft);font-size:.85em;letter-spacing:.2em;flex:0 0 auto;}
  .tocpage .ti .t{flex:0 1 auto;}
  .tocpage .ti .d{flex:1 1 auto;min-width:1em;min-height:1em;border:0 dotted rgba(90,80,60,.45);}
  body:not(.vert) .tocpage .ti .d{border-bottom-width:1px;}
  body.vert .tocpage .ti .d{border-left-width:1px;}
  .tocpage .ti .p{display:inline-block;writing-mode:horizontal-tb;font-size:.72em;color:var(--ink-soft);letter-spacing:.05em;flex:0 0 auto;}
  .page.marked::after{content:"";position:absolute;top:0;right:22px;width:11px;height:48px;background:var(--shu);clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);z-index:4;pointer-events:none;}
  body.spread.vert #pageB.marked::after, body.spread:not(.vert) #pageA.marked::after{right:auto;left:22px;}
  #bmBtn[aria-pressed="true"]{color:var(--shu);}
  .foot .bmjump{font:inherit;font-size:11px;letter-spacing:.14em;background:none;border:1px solid rgba(168,64,44,.55);color:var(--shu);padding:3px 10px;cursor:pointer;margin:0 8px;}
  .foot .bmjump[hidden]{display:none;}
  .sheet .bm-item{width:100%;text-align:left;font:inherit;font-size:13px;letter-spacing:.12em;background:none;border:1px solid rgba(168,64,44,.5);color:var(--shu);padding:10px 12px;margin:0 0 14px;cursor:pointer;}
  .sheet .bm-item[hidden]{display:none;}
</style>
</head>
<body class="vert">
<div id="app">
  <div class="bar">
    <button id="tocBtn" aria-haspopup="dialog">目次</button>
    <div class="ruler" aria-hidden="true">
      <span class="rn">8</span>
      <svg id="rulerSvg" viewBox="0 0 300 26" preserveAspectRatio="none"></svg>
      <span class="rn">9</span>
    </div>
    <button id="bmBtn" aria-pressed="false" aria-label="このページにしおりをはさむ">しおり</button>
    <button id="setBtn" aria-haspopup="dialog">表示</button>
  </div>

  <div id="book">
    <div class="spread">
      <section class="page" id="pageA" aria-live="polite"><div class="col"></div></section>
      <section class="page" id="pageB"><div class="col"></div></section>
    </div>
    <button class="zone l" id="zoneL" aria-label="前後のページ"></button>
    <button class="zone r" id="zoneR" aria-label="前後のページ"></button>
  </div>

  <div class="foot">
    <span id="chapNow"></span>
    <button class="bmjump" id="bmJump" type="button" hidden>しおりへ</button>

  </div>
</div>

<div class="sheet" id="tocSheet" role="dialog" aria-label="目次">
  <div class="sheet-in">
    <h3>目次</h3>
    <button class="bm-item" id="bmItem" type="button" hidden>しおりのページへ</button>
    <div id="tocList"></div>

</div>

<div class="sheet" id="setSheet" role="dialog" aria-label="表示設定">

        <button data-dir="v" aria-pressed="true">縦書き</button>

    </div>
    <div class="row">
      <span class="lab">文字の大きさ</span>
      <div class="seg" id="sizeSeg">
        <button data-size="0" aria-pressed="false">小</button>
        <button data-size="1" aria-pressed="true">中</button>
        <button data-size="2" aria-pressed="false">大</button>
      </div>
    </div>
    <button class="close" data-close>閉じる</button>
  </div>
</div>

<div id="measure"><div class="col" id="mcol"></div></div>

<script>
const DATA = {"title": "8センチメートル", "sub": "待っています。何年でも", "blocks": [{"t": "opener", "i": 0, "alt": "序章　壁の隙間"}, {"t": "p", "h": "なぐらよしゆきは、身長八センチメートルの人間だった。"}, {"t": "p", "h": "小人でも妖精でもない。魔法にかかったわけでも、薬を飲みちがえたわけでもない。ただ生まれたときからその大きさで、八歳のときに八センチになって、それきり止まった。"}, {"t": "p", "h": "彼が暮らしているのは、駅裏の古本屋「うろこ堂」の、本棚のうしろの壁の隙間である。板と板のあいだの細長い空間が、彼の家だった。一階が台所、二階が寝室。マッチ箱の寝台に、ハンカチを畳んだ布団。窓のかわりに、板の節穴からひとすじ光が差しこんで、昼と夜を教えてくれる。"}, {"t": "p", "h": "その家の柱に、鉛筆で引いた線が一本ある。"}, {"t": "p", "h": "<strong>八センチ。</strong>"}, {"t": "p", "h": "十年前、彼が自分で引いた線だ。最初の一年は、毎月測った。二年目は半年に一度。三年目には、もう測らなくなった。線はずっとそこにあって、いつまでも一本きりだった。"}, {"t": "p", "h": "さびしくはなかった――と言えば嘘になる。"}, {"t": "p", "h": "けれども彼には本があった。夜、店が閉まると、よしゆきは本棚をよじのぼり、全身を使って帆を張るように表紙を持ち上げ、紙の平原を端から端まで歩きながら読んだ。北極の氷。アフリカの砂。帆船。気球。地図。"}, {"t": "p", "h": "「いつか行くんだ」と、彼は声に出して言うのが癖だった。"}, {"t": "p", "h": "聞いているのは、梁（はり）を横切るクモだけだった。"}, {"t": "opener", "i": 1, "alt": "第一章　本のあいだ"}, {"t": "p", "h": "その日、店にはおじいさんの孫娘のみちるが来ていて、いつものように本で城を建てていた。よしゆきは隙間の奥でじっとしていた。人間に見つかってはいけない。これが彼の唯一の掟だった。"}, {"t": "p", "h": "みちるの手から、湿気で膨らんだ分厚い本が落ちた。"}, {"t": "p", "h": "本は床でぱっくり口を開け、中から白いものが一枚、蝶のように舞い上がった。ひらひらと流れて、それは板の隙間――よしゆきの家の玄関先に、すとんと落ちた。"}, {"t": "p", "h": "黄ばんだ紙。震えた万年筆の字。"}, {"t": "quote", "h": "この本を読むだれかへ。<br><br>わたしはネネといいます。背丈は三寸に足りません。<br>わたしのような者が、この世にほかにもいるはずだと、ずっと思っています。<br>もしあなたが、わたしと同じ大きさの人であるなら。<br>北へおいでなさい。町を出て、川に沿って北へ。三つ目の橋を過ぎ、丘をのぼると、風車のある家があります。<br>そこに、わたしたちの村があります。<br><br>待っています。何年でも、待っています。<br><br>昭和三十六年　春　ネネ"}, {"t": "p", "h": "よしゆきは、最後の一行の上に立ちつくした。"}, {"t": "p", "h": "六十年以上前だ。この手紙は、六十年ものあいだ、本の中で読まれるのを待っていた。"}, {"t": "p", "h": "「――行くしかないだろ」"}, {"t": "p", "h": "心臓が痛いほど鳴っていた。それは、逃げ出したいときの鳴り方ではなかった。生まれてはじめて、彼の「いつか」に日付が入った音だった。"}, {"t": "p", "h": "三日かけて支度をした。縫い針の剣。木綿糸の縄。目薬の空き瓶の水筒。カステラのかけら三つ。砂糖粒五つ。マッチ棒一本。"}, {"t": "p", "h": "四日目の明け方、彼は戸の下の隙間から外へ出た。"}, {"t": "p", "h": "天井が、なかった。"}, {"t": "p", "h": "よしゆきは尻もちをついて空を見上げ、それから笑った。膝が震えているのに、笑いが止まらなかった。"}, {"t": "p", "h": "「大冒険だ」と彼は言った。「なぐらよしゆきの、大冒険だ」"}, {"t": "p", "h": "――このとき彼は、旅というものが、ひとりでは決して終わらないということを、まだ知らなかった。"}, {"t": "opener", "i": 2, "alt": "第二章　ラーメン屋の裏口"}, {"t": "p", "h": "町は、よしゆきにとって山脈だった。"}, {"t": "p", "h": "縁石ひとつ越えるのに、よじのぼり、腹ばいになり、滑りおりた。自転車が通るたびに、側溝の蓋の下へ飛びこんだ。半日かけて、彼は三ブロック進んだ。"}, {"t": "p", "h": "そして四ブロック目の、ラーメン屋「一二三」の裏口で、彼はそれを見た。"}, {"t": "p", "h": "<strong>山だ。</strong>"}, {"t": "p", "h": "いや、山ではない。だれかの背中だった。よしゆきと同じくらいの背丈の、しかし横幅が二倍ほどある男が、うつぶせに倒れていた。丸い眼鏡が片方の耳に引っかかっている。豊かな髭が、地面のスープの染みに浸かっていた。"}, {"t": "p", "h": "よしゆきは駆け寄った。"}, {"t": "p", "h": "「おい! 大丈夫か! おい!」"}, {"t": "p", "h": "男は、うっすら目を開けた。分厚いレンズの奥の、小さな目。"}, {"t": "p", "h": "「……もう、だめだ」"}, {"t": "p", "h": "「どこか痛いのか!」"}, {"t": "p", "h": "「腹が減った」"}, {"t": "p", "h": "「え」"}, {"t": "p", "h": "「三時間、なにも食ってない」男は言った。「オレはここで死ぬ。わかってた。前からわかってたんだ。オレの人生はこうなるって」"}, {"t": "p", "h": "よしゆきは黙って、背負い袋からカステラのかけらをひとつ出した。"}, {"t": "p", "h": "男は、それを見た。"}, {"t": "p", "h": "三秒後、カステラは消えていた。"}, {"t": "p", "h": "「――ぷはっ」"}, {"t": "p", "h": "男はむくりと起き上がった。さっきの死にかけはどこへ行ったのか、頬に血の気が戻り、眼鏡をかけ直し、髭を撫でつけた。"}, {"t": "p", "h": "「オレはヒロだ」と彼は言った。「あんた、いい人だな。でもたぶん、いいことないぞ。オレに親切にしたやつは、みんなろくな目に遭わない」"}, {"t": "p", "h": "「なんでだよ」"}, {"t": "p", "h": "「そういう星の下なんだ」ヒロは深くうなずいた。「オレは頭が悪い。これは自分でわかってる。わかってるってことは、そこそこ頭がいいってことじゃないかと思ってたんだが、この前もっと頭のいいやつに『わかってるだけの馬鹿がいちばんたちが悪い』って言われた。だからやっぱりオレは馬鹿だ」"}, {"t": "p", "h": "よしゆきは、声を出して笑った。ヒロは、なぜ笑われたのかわからない顔で、髭を撫でた。"}, {"t": "p", "h": "「なぐらよしゆきだ」と彼は名乗った。「北の丘へ行く。風車のある家に、おれたちみたいな小さい人間の村があるらしい」"}, {"t": "p", "h": "ヒロの眼鏡が、きらりと光った。"}, {"t": "p", "h": "「村」"}, {"t": "p", "h": "「ああ」"}, {"t": "p", "h": "「村ってことは……人がいるってことは……」ヒロの喉が、ごくりと鳴った。「<strong>台所があるってことだよな</strong>」"}, {"t": "p", "h": "「たぶん」"}, {"t": "p", "h": "「行く」"}, {"t": "p", "h": "「え、いいのか。遠いぞ。危ないぞ」"}, {"t": "p", "h": "「どうせ死ぬなら」とヒロは髭を撫でて言った。「腹いっぱいで死にたい」"}, {"t": "p", "h": "こうして、なぐらよしゆきの大冒険に、最初の仲間が加わった。"}, {"t": "p", "h": "体重は、よしゆきの二倍あった。"}, {"t": "opener", "i": 3, "alt": "第三章　用水路の縁"}, {"t": "p", "h": "ヒロには、ひとつだけ、驚くべき才能があった。"}, {"t": "p", "h": "町のどこに食べものがあるか、彼は完璧に把握していた。ラーメン屋の裏、パン屋の排気口の下、自販機の下に落ちた飴、公園のベンチの隙間。よしゆきが十日かけても見つけられなかった補給路を、ヒロは鼻歌まじりでつないでいった。"}, {"t": "p", "h": "「どうせ全部、先に虫に食われてるけどな」と彼は毎回言った。そして毎回、食われていなかった。"}, {"t": "p", "h": "五日目、二人が用水路の縁を歩いていると、背後から音がした。"}, {"t": "p", "h": "からから、からから、からから。"}, {"t": "p", "h": "振り返ると、乾電池の車輪をつけた木の荷車が、ものすごい速度でこちらに突っこんできた。"}, {"t": "p", "h": "「あぶな――」"}, {"t": "p", "h": "よしゆきはヒロを突き飛ばし、自分も飛びのいた。荷車は二人のあいだを走り抜け、二十歩ほど先で、ぐるりと横滑りして止まった。"}, {"t": "p", "h": "御者台から、ひょろりと背の高い男が降りてきた。"}, {"t": "p", "h": "とても細い。とても長い。そして、目の焦点が、どこにも合っていなかった。"}, {"t": "p", "h": "「……あー」と、その男は言った。「いま、なんか、あった?」"}, {"t": "p", "h": "「ひかれかけた」とよしゆきは言った。"}, {"t": "p", "h": "「あー。うん。オレの車輪ね、まっすぐいくんだよね。まっすぐって、すごくない? 世界って丸いのに」"}, {"t": "p", "h": "ヒロが小声で言った。「よしゆき。こいつ、なんかキマってるぞ」"}, {"t": "p", "h": "「オレはラリオ」と男は言った。ゆっくり手を挙げた。「配達員。荷物、運ぶ人。……なんか、運ぶものある?」"}, {"t": "p", "h": "「ない」"}, {"t": "p", "h": "「あー。じゃあ、なんか、運ばれる?」"}, {"t": "p", "h": "よしゆきとヒロは顔を見合わせた。"}, {"t": "p", "h": "ラリオは、荷車の荷台をぽんぽんと叩いた。"}, {"t": "p", "h": "「オレ、どこでも行くよ。オレ、道、ぜんぶ知ってるから。地図とか見ないの。見ると、わかんなくなるから。考えると、道って、消えるじゃん?」"}, {"t": "p", "h": "「消えないだろ」とヒロが言った。"}, {"t": "p", "h": "「消えるよ」ラリオはにこにこした。「オレ、考えないから、消えないの」"}, {"t": "p", "h": "そして彼は、まったくのでたらめのように――しかし恐ろしく正確に――町の地下の話をはじめた。排水管の第三分岐から北へ抜けると用水路の暗渠（あんきょ）に出ること。その暗渠は三つ目の橋の下で地上に出ること。雨の翌々日は水位が下がるので、その日なら人が歩けること。"}, {"t": "p", "h": "よしゆきは、口を開けて聞いていた。"}, {"t": "p", "h": "それは、彼が本を何冊読んでも手に入らなかった情報だった。"}, {"t": "p", "h": "「ラリオ」とよしゆきは言った。「おれたち、北の丘へ行く。風車のある家だ」"}, {"t": "p", "h": "ラリオは、しばらく空を見ていた。それから言った。"}, {"t": "p", "h": "「風車。……回るやつ?」"}, {"t": "p", "h": "「たぶん」"}, {"t": "p", "h": "「回るの、いいね」"}, {"t": "p", "h": "「行ってくれるか」"}, {"t": "p", "h": "「うん。オレ、行くとこ、べつにないから」"}, {"t": "p", "h": "こうして、なぐらよしゆきの大冒険に、車がついた。"}, {"t": "p", "h": "御者は、まったく信用ならなかった。"}, {"t": "opener", "i": 4, "alt": "第四章　自販機の下"}, {"t": "p", "h": "ラリオの荷車は、町の地下を走った。"}, {"t": "p", "h": "排水管の中は、彼らにとって巨大なトンネルだった。乾電池の車輪が金属を叩く音が反響し、水滴が、頭上から音を立てて落ちてくる。ラリオは操縦しながら、意味のわからない歌をうたっていた。ヒロは荷台で「どうせ落ちる」「どうせ溺れる」と言いながら、道中ずっと何かを食べていた。"}, {"t": "p", "h": "その第三分岐の手前で、荷車が止まった。"}, {"t": "p", "h": "ラリオが止めたのではなかった。車輪を蹴り出す足が、そこで勝手に止まったのだ。"}, {"t": "p", "h": "自販機の下である。"}, {"t": "p", "h": "そこは、小さき者たちの<strong>賭場</strong>だった。"}, {"t": "p", "h": "十数人の小さい人間が、ペットボトルのキャップを椅子にして車座になっていた。中央の盤には、賭け金が積まれている。砂糖粒。金色の紙片。錠剤。彼らにとっての、通貨。"}, {"t": "p", "h": "「あー」とラリオが言った。「オレ、ここ、入んないの」"}, {"t": "p", "h": "「なんで」とヒロが訊いた。"}, {"t": "p", "h": "「なんでだろ」ラリオは、自分の足を見た。「こいつが、止まるんだよね」"}, {"t": "p", "h": "彼は、明かりの輪の外に荷車を停めたまま、そこから一歩も動かなかった。"}, {"t": "p", "h": "そのとき、車座の中央から、声が上がった。"}, {"t": "p", "h": "「――<strong>うああああああ</strong>」"}, {"t": "p", "h": "痩せた男が、両手で頭を抱えていた。目の下に、真っ黒な隈（くま）がある。"}, {"t": "p", "h": "「なんで」と男は言った。「なんで、また」"}, {"t": "p", "h": "親らしき男が、盤の上の砂糖粒をぜんぶかき集めながら、うんざりした声で言った。"}, {"t": "p", "h": "「ナオ吉。お前、今日で四十七連敗だぞ」"}, {"t": "p", "h": "「次だ。次で戻す」"}, {"t": "p", "h": "「もう賭けるもんないだろ」"}, {"t": "p", "h": "「オレの上着を賭ける」"}, {"t": "p", "h": "「上着はさっき賭けて負けた」"}, {"t": "p", "h": "ナオ吉は、上半身裸だった。"}, {"t": "p", "h": "よしゆきは、そっとヒロにささやいた。「かわいそうに」"}, {"t": "p", "h": "「かわいそうじゃない」とヒロが言った。彼にしては珍しく、きっぱりした口調だった。「あれは、病気だ」"}, {"t": "p", "h": "よしゆきが盤を見ると、ナオ吉は今度は「明日の飯」を賭けようとしていた。"}, {"t": "p", "h": "「やめとけよ」とよしゆきは思わず声をかけた。"}, {"t": "p", "h": "ナオ吉が振り向いた。血走った目で。"}, {"t": "p", "h": "「なんだお前」"}, {"t": "p", "h": "「通りすがりだ」"}, {"t": "p", "h": "「じゃあ黙ってろ。オレの運は、そろそろ来る。四十七回も外れたんだ。確率的に、次は来る」"}, {"t": "p", "h": "そのとき、車座の外から、しわがれた声が飛んだ。"}, {"t": "p", "h": "「<strong>それは博打打ちの錯誤じゃ</strong>」"}, {"t": "opener", "i": 5, "alt": "第五章　車座の外"}, {"t": "p", "h": "声の主は、白い髭を胸まで垂らした老人だった。"}, {"t": "p", "h": "小脇に、切り取った新聞の切れはしを何十枚も抱えている。数字がびっしり並んだ、株式欄だった。"}, {"t": "p", "h": "車座の全員が、いっせいに顔をそむけた。"}, {"t": "p", "h": "「あ、カク爺だ」"}, {"t": "p", "h": "「逃げろ」"}, {"t": "p", "h": "「聞くなよ、目を合わせるな」"}, {"t": "p", "h": "「ナオ吉よ」老人は歩み寄った。「四十七回外れたからといって、四十八回目の確率は変わらん。サイコロには記憶がないんじゃ。これを『ギャンブラーの誤謬（ごびゅう）』という。これはの、二十世紀のはじめにモンテカルロの賭博場でな――」"}, {"t": "p", "h": "「うわ、はじまった」"}, {"t": "p", "h": "「解散! 解散!」"}, {"t": "p", "h": "車座が、くもの子を散らすように崩れた。砂糖粒をかき集める音。逃げ去る足音。三十秒後、自販機の下に残っていたのは、上半身裸のナオ吉と、老人と、よしゆきたち三人だけになった。"}, {"t": "p", "h": "ナオ吉の目が、明かりの外で止まった。荷車のわきに、ひょろ長い男がぼんやり立っていた。"}, {"t": "p", "h": "ナオ吉は、拳を握った。それから、目をそらした。"}, {"t": "p", "h": "老人は、髭を撫でた。"}, {"t": "p", "h": "「……また、逃げおったな」"}, {"t": "p", "h": "そう言ったあと、その手が止まった。老人も、明かりの外の荷車を見ていた。髭から手が離れるまで、しばらくかかった。"}, {"t": "p", "h": "よしゆきは、その背中を見ていた。"}, {"t": "p", "h": "見覚えがあったのだ。夜、だれもいない本棚の上で、ひとりで声に出して本を読んでいた自分の背中に、それはよく似ていた。"}, {"t": "p", "h": "「あの」とよしゆきは言った。「モンテカルロで、なにがあったんですか」"}, {"t": "p", "h": "老人が、ゆっくりと振り返った。"}, {"t": "p", "h": "その顔が、みるみる輝いた。"}, {"t": "p", "h": "「聞くか」"}, {"t": "p", "h": "「はい」"}, {"t": "p", "h": "「聞くのか! ほんとうに聞くのか! 途中で帰らんな!」"}, {"t": "p", "h": "「帰りません」"}, {"t": "p", "h": "老人は、新聞の切れはしを地面に広げ、その上に正座した。"}, {"t": "p", "h": "「わしはカクという。カク爺と呼ばれとる。……よいか、あれは一九一三年の夏じゃった。ルーレットの黒が、二十六回続けて出た。客は皆こう思った、次こそ赤だと。そして全財産を赤に賭けて、破産した。玉には記憶がない。じゃが人間には記憶がある。<strong>記憶が、判断を殺すのじゃ</strong>」"}, {"t": "p", "h": "ナオ吉が、ぽかんとしていた。"}, {"t": "p", "h": "「……じゃあ、オレの四十七連敗は」"}, {"t": "p", "h": "「ただの四十七連敗じゃ。次も外れる可能性は、まったく同じだけある」"}, {"t": "p", "h": "ナオ吉は、地面に膝をついた。"}, {"t": "p", "h": "「終わった」"}, {"t": "p", "h": "「終わっとらん」カク爺は言った。「損切りをせい。今日この場を降りることが、お前の今日いちばんの利益じゃ。<strong>降りるという判断は、勝つより難しい</strong>」"}, {"t": "p", "h": "長い、長い沈黙があった。"}, {"t": "p", "h": "ナオ吉は、震える手で、盤の上に残っていた最後の砂糖粒をひとつ拾った。それを賭けずに、握った。"}, {"t": "p", "h": "そして、泣いた。"}, {"t": "p", "h": "ヒロが、自分の食料袋からゴマを三粒出して、ナオ吉の前に置いた。"}, {"t": "p", "h": "「食え」と彼は言った。「腹が減ってると、ろくなこと考えねえ」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "その夜、五人は自販機の裏の暗がりで焚き火を囲んだ。賭場の明かりは、もう消えていた。マッチの燃えかすを削った、小さな小さな火だった。"}, {"t": "p", "h": "「北の丘」とナオ吉が言った。「その、村ってのは、ほんとにあるのか」"}, {"t": "p", "h": "「わからない」とよしゆきは言った。「六十年前の手紙だ」"}, {"t": "p", "h": "「オレも行く」"}, {"t": "p", "h": "「なんで」"}, {"t": "p", "h": "ナオ吉は、握った砂糖粒を見つめた。"}, {"t": "p", "h": "「オレはここにいると、また賭ける。明日には賭ける。オレのことは、オレがいちばんよく知ってる。……遠くへ行きたいんだ。賭場のない、遠くへ」"}, {"t": "p", "h": "カク爺が、ふぉっふぉ、と笑った。"}, {"t": "p", "h": "「よい判断じゃ。ポジションを閉じて、市場から離れる。それができる者は少ない」"}, {"t": "p", "h": "「じいさんも来るのか」とヒロが言った。"}, {"t": "p", "h": "「わしか」カク爺は、新聞の切れはしを丁寧に折りたたんだ。「わしはの、六十年、株の話をしてきた。最後まで聞いた者は、三人」"}, {"t": "p", "h": "老人は、指を一本立てた。だれのほうも見なかった。"}, {"t": "p", "h": "二本目を立てるとき、ナオ吉を見た。ナオ吉は、火のほうを向いたままだった。"}, {"t": "p", "h": "三本目を立てるとき、よしゆきを見た。"}, {"t": "p", "h": "「六十年で、三人じゃ」"}, {"t": "p", "h": "火が、ぱちりと鳴った。"}, {"t": "p", "h": "「わしを聞く者がおるところなら、地の果てでも行くわい」"}, {"t": "p", "h": "ラリオが、うっとりと火を見ながら言った。"}, {"t": "p", "h": "「……火って、上に行くよね。なんで下に行かないんだろ」"}, {"t": "p", "h": "だれも答えなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "この五人のうち三人は、十年前に同じ賭場にいた。"}, {"t": "p", "h": "そのことを、だれも言い出さなかった。"}, {"t": "p", "h": "<strong>一人は覚えておらず、一人は言えず、一人は黙っていた。</strong>"}, {"t": "sep", "h": ""}, {"t": "p", "h": "なぐらよしゆきの大冒険は、五人になった。"}, {"t": "opener", "i": 6, "alt": "第六章　公園の生垣"}, {"t": "p", "h": "翌朝、荷車の支度をしていると、ラリオがよしゆきの顔をのぞきこんだ。"}, {"t": "p", "h": "「……だれ?」"}, {"t": "p", "h": "ヒロが、口の中のゴマを吹きそうになった。"}, {"t": "p", "h": "よしゆきは、手を止めなかった。"}, {"t": "p", "h": "「なぐらよしゆき。北の丘へ行く」"}, {"t": "p", "h": "「あー。風車の」ラリオは、にこにこした。「回るやつね」"}, {"t": "p", "h": "ナオ吉は、なにも言わずに荷車の縄を締めていた。いつもより、きつく締めていた。"}, {"t": "p", "h": "その朝のうちに、彼らは地上に出た。排水管の第三分岐が、工事のブロックで塞がれていたのだ。"}, {"t": "p", "h": "「あー」とラリオが言った。「ふさがってる。……知ってた?」"}, {"t": "p", "h": "「知らんかったのか」"}, {"t": "p", "h": "「知らないほうが、道は消えないんだよ」"}, {"t": "p", "h": "やむなく、彼らは地上の公園を横断することになった。荷車を五人で押し、生垣の下の影を伝って進んだ。"}, {"t": "p", "h": "そして、生垣の切れ目で、それに出会った。"}, {"t": "p", "h": "最初は、灰色の岩が置いてあるのだと思った。次の瞬間、その岩がゆっくりと、こちらを向いた。"}, {"t": "p", "h": "<strong>猫だった。</strong>"}, {"t": "p", "h": "太った、片耳の欠けた、銀色のしま猫。首輪はない。このあたりの主だ。瞳孔が、すうっと細くなった。"}, {"t": "p", "h": "「ぎゃあああ!」ナオ吉が叫んだ。「オレのせいだ! オレがいると、こうなる!」"}, {"t": "p", "h": "「落ち着け」とよしゆきは針を抜いた。"}, {"t": "p", "h": "「どうせ食われる」とヒロが言った。「オレたち五人。あいつ一匹。数では勝ってる。でも質で負けてる」"}, {"t": "p", "h": "「引くぞ」とカク爺が言った。「損切りじゃ! 荷車を捨てい!」"}, {"t": "p", "h": "「荷車は捨てない」ラリオがはじめて、はっきりした声を出した。「あれは、オレの仕事」"}, {"t": "p", "h": "猫が、跳んだ。"}, {"t": "p", "h": "その瞬間、ナオ吉が動いた。"}, {"t": "p", "h": "彼は、猫の進行方向へ走り出した。"}, {"t": "p", "h": "「なにやってんだ!」"}, {"t": "p", "h": "「オレは運が悪いんだよ!」ナオ吉は走りながら叫んだ。「オレが逃げた先に、必ず不幸が来る! だったら――<strong>オレが行った先は、みんなが行っちゃいけない場所だ</strong>!」"}, {"t": "p", "h": "猫が、動くほうへ向きを変えた。ナオ吉を追った。"}, {"t": "p", "h": "「今だ! 荷車を反対へ!」"}, {"t": "p", "h": "四人は荷車を押した。ラリオが飛び乗って車輪を蹴り出す。乾電池が回転し、荷車は下り坂を加速し、生垣の切れ目を抜けた。"}, {"t": "p", "h": "ナオ吉は、公園の砂場へ逃げこんだ。猫が砂を掘る。掘る。掘る。"}, {"t": "p", "h": "そして――砂の中から、去年埋められた、干からびた魚の骨が出てきた。"}, {"t": "p", "h": "猫は、そちらに興味を移した。"}, {"t": "p", "h": "ナオ吉は、砂まみれではい出してきた。全身を震わせながら、しかし彼は、笑っていた。"}, {"t": "p", "h": "「……はじめてだ」と彼は言った。「はじめて、オレの運の悪さが、なんかの役に立った」"}, {"t": "p", "h": "カク爺が、彼の肩を叩いた。"}, {"t": "p", "h": "「ナオ吉。お前のそれは、<strong>指標</strong>じゃ」"}, {"t": "p", "h": "「しひょう?」"}, {"t": "p", "h": "「お前が賭ける方は、必ず外れる。ならばお前が賭けなかった方が当たる。お前は世界でいちばん正確な、逆さまの羅針盤じゃ」"}, {"t": "p", "h": "ナオ吉は、しばらくぽかんとしていた。"}, {"t": "p", "h": "それから、袖で顔を拭いた。拭いたあとの顔も、笑ったままだった。"}, {"t": "opener", "i": 7, "alt": "第七章　三つ目の橋"}, {"t": "p", "h": "三つ目の橋にたどりついたのは、旅を出て二十二日目だった。"}, {"t": "p", "h": "そして、その夜、嵐が来た。"}, {"t": "p", "h": "雨は、彼らにとって雨ではなかった。空から落ちてくる石つぶてだった。一粒が頭ほどもあり、当たれば脳が揺れ、二粒目で膝をつく。川原の砂利が、みるみる濁流に沈んでいく。"}, {"t": "p", "h": "五人は橋脚の裏のくぼみに逃げこんだ。"}, {"t": "p", "h": "「水位が上がってる」とよしゆきは叫んだ。「ここも沈む!」"}, {"t": "p", "h": "「上か下か」とカク爺が言った。「橋の上に出て人間の道を行くか、このまま暗渠へ潜るか」"}, {"t": "p", "h": "「上だろ」とヒロが言った。「どうせ暗渠は溺れる」"}, {"t": "p", "h": "「暗渠は近道」とラリオが言った。「オレ、水、好き」"}, {"t": "p", "h": "意見が割れた。時間はなかった。水はもう、彼らの膝まで来ていた。"}, {"t": "p", "h": "よしゆきは、ナオ吉を見た。"}, {"t": "p", "h": "ナオ吉は、その視線の意味を理解した。彼の顔から血の気が引いた。"}, {"t": "p", "h": "「……オレに、決めろってのか」"}, {"t": "p", "h": "「逆をやる」とよしゆきは言った。「お前が『こっちだ』と思ったほうの、逆へ行く」"}, {"t": "p", "h": "「そんな――そんなことで、みんなの命を」"}, {"t": "p", "h": "「ナオ吉」よしゆきは、彼の肩をつかんだ。「おれは十年、隙間で生きてきた。だれにも何も頼まれなかった。頼まれるってのは、悪くないぞ」"}, {"t": "p", "h": "ナオ吉は、目を閉じた。"}, {"t": "p", "h": "そして、しばらくして、言った。"}, {"t": "p", "h": "「……<strong>上だ</strong>。オレの勘は、上だと言ってる。上に行けば助かると、オレの全身が言ってる」"}, {"t": "p", "h": "「では下じゃ」とカク爺が言った。「暗渠へ!」"}, {"t": "p", "h": "五人は荷車を捨て、暗渠の入口へ滑りこんだ。ラリオが最後に振り返って、乾電池の車輪に手を置き、小さく「ありがと」と言った。"}, {"t": "p", "h": "彼らが暗渠の壁の棚にはい上がった三十秒後――"}, {"t": "p", "h": "橋の上を、増水で流された巨大な流木が、すさまじい音を立てて突き抜けていった。"}, {"t": "p", "h": "上にいれば、五人は消し飛んでいた。"}, {"t": "p", "h": "だれも、しばらく口をきかなかった。"}, {"t": "p", "h": "やがて、暗闇の中でヒロが言った。"}, {"t": "p", "h": "「ナオ吉」"}, {"t": "p", "h": "「……なんだよ」"}, {"t": "p", "h": "「お前、すげえよ」"}, {"t": "p", "h": "ナオ吉は、泥だらけの顔を両手でおおって、声を殺して泣いた。"}, {"t": "opener", "i": 8, "alt": "第八章　畑のうね"}, {"t": "p", "h": "丘は、もう目の前だった。"}, {"t": "p", "h": "嵐の翌々日、水位が下がった暗渠を歩いて抜けると、彼らは畑の広がる斜面の下に出た。木立のあいだに――"}, {"t": "p", "h": "風車が、あった。"}, {"t": "p", "h": "木でできた、古い、四枚羽根の風車。羽根は半分が折れて、かたむいたまま、風にきしきしと鳴っている。"}, {"t": "p", "h": "「回ってる」とラリオが言った。「回ってるの、いいね」"}, {"t": "p", "h": "よしゆきは走り出した。うねを越え、土くれをよじのぼり、転げ落ち、また走った。目の中に風車しかなかった。だから、彼は空を見ていなかった。"}, {"t": "p", "h": "影が、太陽を消した。"}, {"t": "p", "h": "トビだった。翼を広げれば、彼の身長の二十倍。黄色いかぎ爪が、まっすぐに降ってくる。"}, {"t": "p", "h": "「よしゆき!」"}, {"t": "p", "h": "四人が走った。だが間に合わない。"}, {"t": "p", "h": "そのとき、いちばん動きの遅いはずの男が、いちばん早く動いた。"}, {"t": "p", "h": "<strong>ヒロだった。</strong>"}, {"t": "p", "h": "彼はよしゆきに体当たりしてうねの陰へ突き飛ばし、自分はその場に残った。丸い眼鏡が飛んだ。"}, {"t": "p", "h": "かぎ爪が、ヒロの背中の服をつかんだ。"}, {"t": "p", "h": "「ヒロ!」"}, {"t": "p", "h": "太った体が、地面から浮き上がる。"}, {"t": "p", "h": "「――離せ!」"}, {"t": "p", "h": "叫んだのは、カク爺だった。"}, {"t": "p", "h": "「ヒロ! 服を脱げ! 上着を捨てい!」"}, {"t": "p", "h": "「え!?」"}, {"t": "p", "h": "「<strong>損切りじゃ!!</strong> すべてを守ろうとする者がすべてを失う! いちばん惜しくないものを、いちばん早く手放せ!!」"}, {"t": "p", "h": "ヒロは、両腕を後ろに突き出した。"}, {"t": "p", "h": "上着が、するりと脱げた。"}, {"t": "p", "h": "太った体は、五センチの高さから、どすんと畑に落ちた。トビは、中身のない上着だけをつかんで、空へ舞い上がっていった。"}, {"t": "p", "h": "土煙の中で、ヒロは仰向けに倒れていた。"}, {"t": "p", "h": "「……ヒロ!」"}, {"t": "p", "h": "「……腹が」"}, {"t": "p", "h": "「腹が!?」"}, {"t": "p", "h": "「腹が減った」"}, {"t": "p", "h": "よしゆきは、その場にへたりこんで笑った。笑いながら、涙が出た。"}, {"t": "p", "h": "カク爺が、髭を撫でながら近づいてきた。"}, {"t": "p", "h": "「よいか、ヒロよ。損切りとはの、負けを認めることではない。<strong>次に賭けるための資金を残すことじゃ</strong>。上着は買える。命は買えん」"}, {"t": "p", "h": "ヒロは、眼鏡を拾ってかけ直し、まじまじとカク爺を見た。"}, {"t": "p", "h": "「じいさん」"}, {"t": "p", "h": "「なんじゃ」"}, {"t": "p", "h": "「株の話、もっとしていいぞ」"}, {"t": "p", "h": "カク爺の目が、うるんだ。"}, {"t": "opener", "i": 9, "alt": "第九章　腰板の裏"}, {"t": "p", "h": "風車のある家は、廃屋だった。"}, {"t": "p", "h": "屋根が半分落ち、窓ガラスは割れ、床には落ち葉が積もっていた。壁の隙間から、陽がしま模様になって差しこんでいる。"}, {"t": "p", "h": "北側の壁の、腰板の裏。人間の目にはただの節穴にしか見えない場所。その奥に――村があった。"}, {"t": "p", "h": "くるみの殻の屋根。糸巻きの物見やぐら。マッチ箱の長屋。指ぬきの井戸。ビーズを埋めこんだ、小さな小さな石畳の道。"}, {"t": "p", "h": "だれも、いなかった。"}, {"t": "p", "h": "戸は開け放たれ、床にはほこりが指の厚みほど積もっていた。井戸は乾いていた。やぐらの上に、色の抜けた布きれが一枚、旗のように残って、風もないのに揺れた。"}, {"t": "p", "h": "よしゆきは、石畳の真ん中に立ちつくした。"}, {"t": "p", "h": "六十年。彼は、六十年ぶんの遅刻をしたのだ。"}, {"t": "p", "h": "背負い袋から手紙を出す。<strong>待っています。何年でも、待っています。</strong>その字の上に、水滴が落ちて、インクがにじんだ。"}, {"t": "p", "h": "ヒロが、彼の隣に来た。"}, {"t": "p", "h": "「……オレはさ」とヒロは言った。「ずっと『どうせだめだ』って言ってきた。言ってるうちは、外れても平気だからな。当たったときだけ、ちょっとえらそうにできる。ずるいんだよ、オレは」"}, {"t": "p", "h": "「ヒロ」"}, {"t": "p", "h": "「今回だけは、外れてほしかった」"}, {"t": "p", "h": "そのとき。"}, {"t": "p", "h": "かたん、と音がした。"}, {"t": "p", "h": "村のいちばん奥。木の実をふたつ並べたような家。その戸が、内側から、ゆっくりと開いた。"}, {"t": "p", "h": "「……どなた?」"}, {"t": "p", "h": "しわがれた、細い、けれどもたしかに人間の声だった。"}, {"t": "p", "h": "戸口に立っていたのは、ひとりの老婆だった。背丈は、よしゆきより指一本ぶん低い。腰が曲がり、髪は真っ白で、綿くずのような着物を着ている。手には、爪楊枝の杖。"}, {"t": "p", "h": "五人は、息を止めた。"}, {"t": "p", "h": "よしゆきは、声を出そうとして失敗した。二度目でやっと、出た。"}, {"t": "p", "h": "「……ネネさん、ですか」"}, {"t": "p", "h": "老婆の杖が、かたん、と床に落ちた。"}, {"t": "p", "h": "「手紙を」よしゆきは、震える手で油紙の包みを掲げた。「手紙を、読みました。町の、古本屋で。遅くなって、すみません。ほんとうに、遅くなって――」"}, {"t": "p", "h": "ネネは、口を開けたまま立っていた。"}, {"t": "p", "h": "やがて、そのしわだらけの顔が、ゆっくりと崩れた。"}, {"t": "p", "h": "「返事が」と、彼女は言った。「返事が、来た」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "その夜、ネネは五人に村の話をした。"}, {"t": "p", "h": "かつてここには、二十人あまりの小さき者が暮らしていた。人間の家の壁裏は、彼らにとって理想の土地だった。雨風がなく、暖かく、食べこぼしがある。"}, {"t": "p", "h": "だが、人間が引っ越した。"}, {"t": "p", "h": "「暖房も、こぼれものも、なくなった。冬が三回続けてひどくてね。年寄りから順に、逝った」"}, {"t": "p", "h": "「風車は」とよしゆきは言った。"}, {"t": "p", "h": "「あれかい」ネネは、天井のほうを見た。板の向こうで、羽根がきしきしと鳴っている。「あれはね、回ってるよ。六十年、ずっと」"}, {"t": "p", "h": "「…………」"}, {"t": "p", "h": "「<strong>風車だけが、なんにも変わらないんだ</strong>」"}, {"t": "p", "h": "若い者たちは、南へ行くと言った。町へ、人のいるところへ。ネネは反対した。町は危ない。ここで待つべきだ、いつかだれかが見つけてくれる、と。"}, {"t": "p", "h": "「若い連中は行った。あたしは残った。……どっちが正しかったんだろうねえ。もう、わからない」"}, {"t": "p", "h": "「六十年、待ったんですか」とよしゆきは言った。"}, {"t": "p", "h": "「待つのが仕事になっちまってねえ」"}, {"t": "p", "h": "彼女はくすりと笑った。歯のない、やわらかい笑い方だった。"}, {"t": "p", "h": "「あたしはね、ずっと、自分がここにいることを知ってる人がひとりもいないまま死ぬんだと思っていた。それだけが怖かった。もう怖くない」"}, {"t": "p", "h": "ナオ吉が、はなをすすった。ヒロは声を上げて泣いていた。ラリオは天井の梁をじっと見ていた。カク爺は、なにも言わずに髭を撫でていた。"}, {"t": "p", "h": "「ネネさん」とよしゆきは言った。「一緒に来てください。おれの家に。本が、天井まであるんです。何万冊も」"}, {"t": "p", "h": "ネネは、三日間、断りつづけた。ここで死ぬと決めている、この村の最後の火は自分が消すのだと。"}, {"t": "p", "h": "説得したのは、ラリオだった。"}, {"t": "p", "h": "四日目の朝、彼はネネの前にしゃがみこんで、ぽつりと言った。"}, {"t": "p", "h": "「ばあちゃん。オレ、配達員なんだ」"}, {"t": "p", "h": "「そうかい」"}, {"t": "p", "h": "「配達ってさ、<strong>届くまでが仕事</strong>なんだよ。荷物、置いてきたら、それ、仕事じゃないんだ」"}, {"t": "p", "h": "「あたしは荷物かい」"}, {"t": "p", "h": "「ばあちゃんの手紙、六十年、まだ配達の途中なんだよ」ラリオは、焦点の合わない目で、まっすぐ彼女を見た。「オレ、途中の荷物、置いてけない」"}, {"t": "p", "h": "ネネは、長いこと黙っていた。"}, {"t": "p", "h": "それから、杖をついて立ち上がった。"}, {"t": "p", "h": "「……じゃあ、行こうかね」"}, {"t": "opener", "i": 10, "alt": "第十章　帰り道"}, {"t": "p", "h": "帰り道は、来たときの倍かかった。"}, {"t": "p", "h": "四十日。"}, {"t": "p", "h": "腰の曲がった老婆と、太った男と、ラリってる配達員と、運の悪い男と、株の話しかしない老人と、八センチの男の行進である。日が暮れて振り返ると、朝に出た場所が、まだ見えた。"}, {"t": "p", "h": "ネネは歩けなくなり、よしゆきが背負った。"}, {"t": "p", "h": "「重かろう」とネネが言った。"}, {"t": "p", "h": "「軽いですよ」"}, {"t": "p", "h": "「嘘をおつき」"}, {"t": "p", "h": "嘘だった。ネネは指一本ぶん小さいだけで、体重はよしゆきの七割ほどあった。丘の下りで、彼は三度転んだ。畑のうねをひとつ越えるのに、半日かかった。"}, {"t": "p", "h": "代わろうか、とヒロが言った。よしゆきは首を振った。"}, {"t": "p", "h": "うまく説明できなかった。ただ、これは自分が背負うべきものだという気が、骨のあたりでしていた。"}, {"t": "p", "h": "道々、ネネは村の歌をうたった。よしゆきの知らない、六十年前の歌だった。"}, {"t": "p", "h": "そしてある夜、焚き火のそばで、彼女はこんな話をした。"}, {"t": "p", "h": "「小さき者にはね、言い伝えがあるんだよ」"}, {"t": "p", "h": "「なんですか」"}, {"t": "p", "h": "「あたしらは、生まれて八年で背が止まる。それきり、死ぬまで伸びない。……でもね、<strong>生涯にいちどだけ、一分（いちぶ）だけ伸びることがある</strong>そうだ」"}, {"t": "p", "h": "「一分?」"}, {"t": "p", "h": "「一センチ、と今は言うのかね」"}, {"t": "p", "h": "よしゆきの足が、止まりかけた。"}, {"t": "p", "h": "「どういうときに」"}, {"t": "p", "h": "「だれかを背負って、坂を、自分の足で、のぼりきったときに」ネネはくすくす笑った。「まあ、言い伝えだよ。あたしは見たことがない。あたしの祖父も見たことがないと言っていた」"}, {"t": "p", "h": "「じゃあ、嘘かも」"}, {"t": "p", "h": "「そうだねえ」ネネは言った。「だけどね、そういう言い伝えを作った人がいたってことは、覚えておおき。だれかが、そう信じたかったんだよ」"}, {"t": "p", "h": "焚き火の向こうで、ナオ吉がぼそりと言った。"}, {"t": "p", "h": "「オレ、賭けてもいいぜ。伸びないほうに」"}, {"t": "p", "h": "全員が、ぱっと顔を上げた。"}, {"t": "p", "h": "「――<strong>それは、伸びるってことじゃないか!</strong>」"}, {"t": "p", "h": "「あ」"}, {"t": "p", "h": "ナオ吉が自分の口を押さえた。"}, {"t": "p", "h": "ヒロが叫んだ。「言うなよ! お前が言うと、そうなるだろ!」"}, {"t": "p", "h": "「ならねえよ! ならねえって! オレの負けは、そんな都合よくねえ!」"}, {"t": "p", "h": "カク爺が、うれしそうに髭を撫でた。"}, {"t": "p", "h": "「よいか諸君。これを逆張りという。市場の総意と反対に張ることじゃ。じゃがな、逆張りには、ひとつだけ条件がある。<strong>自分がなぜ張るのかを、自分の言葉で説明できること</strong>じゃ。……ナオ吉、お前はなぜ伸びないほうに張った?」"}, {"t": "p", "h": "ナオ吉は、長いこと黙っていた。"}, {"t": "p", "h": "そして言った。"}, {"t": "p", "h": "「……こいつが伸びたら、うれしいからだよ。オレが負けるのは、慣れてる」"}, {"t": "p", "h": "火が、ぱちりと鳴った。"}, {"t": "opener", "i": 11, "alt": "第十一章　裏口の坂"}, {"t": "p", "h": "四十日目、彼らは町に入った。"}, {"t": "p", "h": "そして、公園の生垣の前で、あの猫に出会った。"}, {"t": "p", "h": "銀色のしま猫は、道の真ん中に座っていた。金色の目が、六人を順に見た。"}, {"t": "p", "h": "ナオ吉が、震えながら前に出た。"}, {"t": "p", "h": "「オレがおとりに――」"}, {"t": "p", "h": "「待て」とよしゆきが止めた。"}, {"t": "p", "h": "彼は、ネネを背負ったまま、猫の前に歩み出た。針は抜かなかった。"}, {"t": "p", "h": "「銀次」と、よしゆきは言った。名前を知っているわけではなかった。ただ、そう呼びたかった。「通してくれ。背中に、六十年待った人がいるんだ」"}, {"t": "p", "h": "猫は、動かなかった。"}, {"t": "p", "h": "長い、長い十秒間だった。"}, {"t": "p", "h": "やがて銀次は、大きくあくびをして、立ち上がった。そして、道を空けた。"}, {"t": "p", "h": "彼らが通り過ぎるあいだ、猫はただ座って、見ていた。"}, {"t": "p", "h": "なぜそうしたのか、よしゆきには生涯わからなかった。恩か、興味か、それとも単に腹が減っていなかっただけか。"}, {"t": "p", "h": "ただ彼は、通り過ぎながら、一度だけ頭を下げた。"}, {"t": "p", "h": "猫は、ゆっくりと瞬きをした。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "そして、うろこ堂の裏に、最後の坂があった。"}, {"t": "p", "h": "店の裏口へ続く、コンクリートの傾斜。人間には、ただのスロープである。よしゆきたちにとっては、標高一メートルの峠だった。"}, {"t": "p", "h": "「代わるぞ」とヒロが言った。"}, {"t": "p", "h": "「代わってやる」とナオ吉が言った。"}, {"t": "p", "h": "「二人でやれば効率的じゃ」とカク爺が言った。"}, {"t": "p", "h": "「オレ、押す」とラリオが言った。"}, {"t": "p", "h": "よしゆきは、六人の顔を順に見た。"}, {"t": "p", "h": "そして、首を振った。"}, {"t": "p", "h": "「ここは、おれが」"}, {"t": "p", "h": "「なんでだよ」"}, {"t": "p", "h": "「なんでだろう」とよしゆきは言った。「わからない。でも、ここは、おれの家に続く坂だから」"}, {"t": "p", "h": "彼は、ネネを背負い直した。"}, {"t": "p", "h": "そして、のぼった。"}, {"t": "p", "h": "十歩で、膝が笑った。二十歩で、視界が白くなった。三十歩で、彼は一度、膝をついた。背中でネネが「もういいよ」と言った。よしゆきは聞こえないふりをした。"}, {"t": "p", "h": "四十歩。"}, {"t": "p", "h": "五十歩。"}, {"t": "p", "h": "「よしゆき!」ヒロの声がした。「あと少しだ! どうせもうすぐ着く!」"}, {"t": "p", "h": "――<strong>どうせ</strong>、が、はじめて希望の言葉になった。"}, {"t": "p", "h": "六十歩。"}, {"t": "p", "h": "なぐらよしゆきは、坂をのぼりきった。"}, {"t": "opener", "i": 12, "alt": "終章　壁の隙間"}, {"t": "p", "h": "うろこ堂の隙間の家は、ほこりをかぶっていたが、なにも変わっていなかった。"}, {"t": "p", "h": "ネネには一階を譲った。ヒロは台所を占領した。ナオ吉は物置に住みついた。カク爺は本棚の第三段に書斎を作った。ラリオは屋根裏を「配達拠点」と呼んで、乾電池の車輪をどこかから調達してきた。"}, {"t": "p", "h": "窮屈だった。"}, {"t": "p", "h": "にぎやかだった。"}, {"t": "p", "h": "二日目の朝、節穴の光が、本棚の第三段まで届いた。"}, {"t": "p", "h": "カク爺の書斎の、新聞の切れはしを積んだいちばん上に、小さなものがひとつ置いてあった。光がそれを通り抜けて、壁に、青い点をひとつ落とした。"}, {"t": "p", "h": "ラリオが屋根裏から降りてきて、その点の前にしゃがんだ。"}, {"t": "p", "h": "「きれいだね」"}, {"t": "p", "h": "カク爺の、髭を撫でる手が止まった。"}, {"t": "p", "h": "ラリオは、しばらく青い点を見ていた。それから、屋根裏へ戻っていった。だれの、とは訊かなかった。"}, {"t": "p", "h": "三日目の夜、ヒロが言った。"}, {"t": "p", "h": "「なあ。測ろうぜ」"}, {"t": "p", "h": "「なにを」"}, {"t": "p", "h": "「決まってんだろ」"}, {"t": "p", "h": "全員が、柱の前に集まった。"}, {"t": "p", "h": "十年前に引かれた、鉛筆の線。八センチ。"}, {"t": "p", "h": "ナオ吉が、震える手を挙げた。"}, {"t": "p", "h": "「賭ける。オレは……伸びてないほうに、賭ける」"}, {"t": "p", "h": "「対抗じゃ」カク爺が新聞の切れはしを一枚置いた。「わしは伸びたほうに、全額」"}, {"t": "p", "h": "「オレも伸びたほう」とヒロが言った。「どうせ伸びてる」"}, {"t": "p", "h": "「オレ、よくわかんないけど、伸びたほう」とラリオが言った。"}, {"t": "p", "h": "ネネが、爪楊枝の杖をこつんと鳴らして笑った。"}, {"t": "p", "h": "「じゃあ、あたしも伸びたほうだね」"}, {"t": "p", "h": "ナオ吉は、四対一で、たったひとり反対側に立っていた。"}, {"t": "p", "h": "彼の顔は、いままで見たことがないほど、穏やかだった。"}, {"t": "p", "h": "「よしゆき」と彼は言った。「立て」"}, {"t": "p", "h": "なぐらよしゆきは、柱を背にして立った。"}, {"t": "p", "h": "かかとをつけ、背筋を伸ばした。ヒロが眼鏡を押し上げ、頭のてっぺんに定規がわりの爪楊枝を当てた。カク爺が鉛筆を構えた。"}, {"t": "p", "h": "しん、とした。"}, {"t": "p", "h": "節穴から、光が一本、差しこんでいた。"}, {"t": "p", "h": "かり、と鉛筆が動いた。"}, {"t": "p", "h": "そして、線が引かれた。"}, {"t": "p", "h": "――<strong>古い線より、上に</strong>。"}, {"t": "p", "h": "「……」"}, {"t": "p", "h": "だれも、しばらく声を出さなかった。"}, {"t": "p", "h": "最初に叫んだのは、ヒロだった。"}, {"t": "p", "h": "「伸びてる!!」"}, {"t": "p", "h": "「うおおおおお!」"}, {"t": "p", "h": "「一分じゃ! ちょうど一分!」"}, {"t": "p", "h": "「回ってる……いや、伸びてる」"}, {"t": "p", "h": "「九センチだ! 九センチだよ、よしゆき!」"}, {"t": "p", "h": "隙間の家が、揺れた。ネネが泣きながら笑っていた。カク爺が新聞を宙に投げた。ラリオが逆立ちをしようとして失敗した。"}, {"t": "p", "h": "そして、その騒ぎの真ん中で。"}, {"t": "p", "h": "ナオ吉が、両手を挙げて、天井を仰いでいた。"}, {"t": "p", "h": "「<strong>負けた</strong>」"}, {"t": "p", "h": "彼は、笑っていた。四十七回負けた、どの夜にも見せたことのない顔で。"}, {"t": "p", "h": "「オレの、人生でいちばん気持ちのいい、負けだ」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "よしゆきは、柱の二本の線を、ずっと見ていた。"}, {"t": "p", "h": "八センチの線と、九センチの線。"}, {"t": "p", "h": "そのあいだの、たった一センチ。"}, {"t": "p", "h": "人間の目には、見えないだろう。定規の目盛りひとつ。爪の幅ほど。"}, {"t": "p", "h": "けれども、そのあいだには、町がひとつと、川がひとつと、橋が三つと、嵐がひとつと、猫が一匹と、トビが一羽と、六十年の手紙が一通と――そして、五人の仲間が入っていた。"}, {"t": "p", "h": "「よしゆき」とネネが言った。「泣いてるのかい」"}, {"t": "p", "h": "「腹が減っただけです」"}, {"t": "p", "h": "「オレのセリフだぞ」とヒロが言った。"}, {"t": "p", "h": "その夜、六人は本を読んだ。よしゆきが声に出して読み、ネネが聞き、ヒロが食べながら聞き、ナオ吉が寝ころんで聞き、ラリオが天井を見ながら聞いた。"}, {"t": "p", "h": "カク爺だけが、最後に小さくつぶやいた。"}, {"t": "p", "h": "「……ところで諸君。複利の話をしてもよいかの」"}, {"t": "p", "h": "「「「うわ、はじまった」」」"}, {"t": "p", "h": "全員が笑った。カク爺も笑った。"}, {"t": "p", "h": "そして、その週から、うろこ堂で売られる古い本のあいだに、ときどき、小さな紙きれがはさまるようになった。"}, {"t": "p", "h": "米粒ほどの、細かな字で、こう書いてある。"}, {"t": "quote", "h": "この本を読むだれかへ。<br><br>ぼくはなぐらよしゆきといいます。<br>背丈は八センチ――いや、<strong>九センチ</strong>です。<br><br>あなたが、もしぼくと同じ大きさの人なら。<br>駅裏の古本屋「うろこ堂」へおいでなさい。<br>本棚のうしろの、壁の隙間です。<br><br>待っています。何年でも、待っています。<br>そして、もしあなたが動けないなら、居場所を書いて、どこかの本にはさんでください。<br><br><strong>ぼくが、迎えに行きます。</strong><br><strong>こんどは、五人で行きます。</strong>"}, {"t": "end", "h": "了"}], "chapters": [{"title": "序章　壁の隙間", "b": 0}, {"title": "第一章　本のあいだ", "b": 11}, {"title": "第二章　ラーメン屋の裏口", "b": 27}, {"title": "第三章　用水路の縁", "b": 61}, {"title": "第四章　自販機の下", "b": 96}, {"title": "第五章　車座の外", "b": 129}, {"title": "第六章　公園の生垣", "b": 194}, {"title": "第七章　三つ目の橋", "b": 235}, {"title": "第八章　畑のうね", "b": 265}, {"title": "第九章　腰板の裏", "b": 303}, {"title": "第十章　帰り道", "b": 359}, {"title": "第十一章　裏口の坂", "b": 396}, {"title": "終章　壁の隙間", "b": 433}]};

/* ---------- ruler ---------- */
const MOTIF = 'ruler';
(function drawRuler(){
  const svg = document.getElementById('rulerSvg');
  let s = '';
  if(MOTIF==='route'){
    s += '<line class="rulerline" x1="8" y1="20" x2="292" y2="20" stroke-dasharray="5 5"/>';
    for(let i=0;i<=5;i++){
      const x = 8 + (284*i/5);
      s += `<circle cx="${x}" cy="20" r="2.2" fill="none" stroke="#5c5343" stroke-width="1"/>`;
    }
    s += '<g id="finalmark"><circle cx="292" cy="20" r="4.4" fill="#a8402c"/></g>';
    s += '<g id="mark" transform="translate(8,0)"><circle cx="0" cy="20" r="3.4" fill="#4d5157"/></g>';
  } else {
    s += '<line class="rulerline" x1="8" y1="20" x2="292" y2="20"/>';
    for(let i=0;i<=10;i++){
      const x = 8 + (284*i/10), big = (i===0||i===10);
      s += `<line class="tick${big?'':' mm'}" x1="${x}" y1="${big?9:14}" x2="${x}" y2="20"/>`;
    }
    s += '<g id="finalmark"><line x1="292" y1="4" x2="292" y2="24"/></g>';
    s += '<g id="mark" transform="translate(8,0)"><line x1="0" y1="6" x2="0" y2="24"/></g>';
  }
  svg.innerHTML = s;
})();


/* ---------- しおり ---------- */
const BM_KEY = 'shiori:' + DATA.title;
DATA.blocks.forEach((b,i)=>{ b.src=i; });
let bm = null;
try{ const v = localStorage.getItem(BM_KEY); bm = v ? JSON.parse(v) : null; }catch(e){ bm = null; }
function saveBm(){ try{ if(bm) localStorage.setItem(BM_KEY, JSON.stringify(bm)); else localStorage.removeItem(BM_KEY); }catch(e){} }
function anchorOf(p){
  const pg = pages[p]; if(!pg) return null;
  for(const b of pg){ if(b && b.src!=null) return {s:b.src, p:b.part||0}; }
  if(pg[0] && pg[0].t==='toc') return {toc:true};
  return null;
}
function pageOfAnchor(a){
  if(!a) return -1;
  if(a.toc) return pages.findIndex(pg=>pg[0] && pg[0].t==='toc');
  for(let p=1;p<pages.length;p++) for(const b of pages[p]) if(b && b.src===a.s && (b.part||0)>=a.p) return p;
  for(let p=1;p<pages.length;p++) for(const b of pages[p]) if(b && b.src!=null && b.src>=a.s) return p;
  return -1;
}
function visiblePages(){ return (spread && idx>0) ? [idx, idx+1] : [idx]; }
function toggleBm(){
  const bp = pageOfAnchor(bm), vis = visiblePages();
  if(bm && vis.indexOf(bp)>=0){ bm = null; }
  else { const a = anchorOf(idx); if(!a) return; bm = a; }
  saveBm(); update(0);
}
function goBm(){ const p = pageOfAnchor(bm); if(p<0) return; idx = p; closeSheets(); update(1); }
function renderToc(host){
  const w = document.createElement('div'); w.className='tocpage';
  w.innerHTML = '<h2>目次</h2>';
  DATA.chapters.forEach((c,i)=>{
    const parts = c.title.split('\u3000');
    const row = document.createElement('div'); row.className='ti';
    const b = document.createElement('button'); b.className='tb'; b.type='button';
    b.setAttribute('aria-label', c.title.replace('\u3000',' ')+'へ移動');
    b.innerHTML = '<span class="n">'+parts[0]+'</span><span class="t">'+(parts[1]||'')+'</span>';
    b.onclick = (e)=>{ e.stopPropagation(); idx = chapPage[i]||1; update(1); };
    row.appendChild(b);
    row.insertAdjacentHTML('beforeend','<span class="d" aria-hidden="true"></span><span class="p" aria-hidden="true">'+(chapPage[i]||'')+'</span>');
    w.appendChild(row);
  });
  host.appendChild(w);
  let fs = 1;
  w.style.fontSize = fs+'em';
  const page = host.closest('.page');
  const fits = ()=>{ const r=w.getBoundingClientRect(), pr=page.getBoundingClientRect(); return vertical ? r.left >= pr.left+8 && w.scrollHeight<=w.clientHeight+2 : r.bottom <= pr.bottom-8; };
  let guard=0;
  while(!fits() && fs>0.5 && guard++<20){ fs -= 0.05; w.style.fontSize = fs.toFixed(2)+'em'; }
}

/* ---------- blocks -> DOM ---------- */
function makeEl(b){
  let el;
  if(b.t==='h2'){ el=document.createElement('h2'); el.innerHTML=b.h; }
  else if(b.t==='quote'){ el=document.createElement('blockquote'); el.innerHTML=b.h; }
  else if(b.t==='sep'){ el=document.createElement('div'); el.className='sep'; el.innerHTML=SEPSVG; }
  else if(b.t==='opener'){ el=document.createElement('div'); el.className='opener'; const im=document.createElement('img'); im.src=IMGS[b.i]; im.alt=b.alt.replace('\u3000',' '); el.appendChild(im); }
  else if(b.t==='end'){ el=document.createElement('p'); el.className='endmark'; el.textContent=b.h; }
  else { el=document.createElement('p'); el.innerHTML=b.h; }
  return el;
}
function contentBox(el){
  const r = el.getBoundingClientRect(), cs = getComputedStyle(el);
  return {
    left:   r.left   + parseFloat(cs.paddingLeft   || 0),
    right:  r.right  - parseFloat(cs.paddingRight  || 0),
    top:    r.top    + parseFloat(cs.paddingTop    || 0),
    bottom: r.bottom - parseFloat(cs.paddingBottom || 0)
  };
}
/* scrollWidth is unreliable in vertical-rl (content overflows leftward),
   so compare the last child's far edge with the page's content box. */
function over(el){
  const kids = el.children;
  if(!kids.length) return false;
  const box = contentBox(el);
  const k = kids[kids.length-1], r = k.getBoundingClientRect(), ks = getComputedStyle(k);
  return vertical
    ? (r.left - parseFloat(ks.marginLeft || 0)) < box.left - 0.5
    : (r.bottom + parseFloat(ks.marginBottom || 0)) > box.bottom + 0.5;
}
function splitText(t){
  const out=[]; let cur='';
  for(let i=0;i<t.length;i++){
    cur+=t[i];
    if('。！？」'.indexOf(t[i])>=0 && cur.length>=40){ out.push(cur); cur=''; }
  }
  if(cur) out.push(cur);
  return out.length?out:[t];
}

/* ---------- pagination ---------- */
function paginate(){
  const m = document.getElementById('measure'), mc = document.getElementById('mcol');
  const ref = document.getElementById('pageA').getBoundingClientRect();
  m.className='page';
  m.style.width = ref.width+'px';
  m.style.height = ref.height+'px';
  mc.innerHTML='';

  pages = [[{t:'cover'}],[{t:'toc'}]];
  chapPage = [];
  let cur = [];
  const push = ()=>{ if(cur.length){ pages.push(cur); cur=[]; } mc.innerHTML=''; };

  const esc = t => t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const drop = el => { if(el && el.parentNode) el.parentNode.removeChild(el); };

  // 1ページに単独で収まらない塊を、収まる単位に割って順番どおり流しこむ
  const flowSplit = (b)=>{
    let part = 0;
    if(b.t==='quote'){                    // 手紙は行単位で分ける
      const trim = a=>{ const c=a.slice();
        while(c.length && c[0]==='') c.shift();
        while(c.length && c[c.length-1]==='') c.pop();
        return c; };
      const lines = b.h.split('<br>');
      let buf=[], node=null;
      for(const ln of lines){
        const trial = buf.concat([ln]);
        drop(node);
        node = makeEl({t:'quote', h: trim(trial).join('<br>')});
        mc.appendChild(node);
        if(over(mc) && trim(buf).length){
          drop(node);
          cur.push({t:'quote', h: trim(buf).join('<br>'), src:b.src, part:part++});
          push();
          buf = (ln==='') ? [] : [ln];
          node = buf.length ? makeEl({t:'quote', h: ln}) : null;
          if(node) mc.appendChild(node);
        } else {
          buf = trial;
        }
      }
      if(trim(buf).length) cur.push({t:'quote', h: trim(buf).join('<br>'), src:b.src, part:part++});
      return;
    }
    for(const c of splitText(makeEl(b).textContent)){   // 段落は文単位で分ける
      const blk = {t:'p', h: esc(c), src:b.src, part:part++};
      let node = makeEl(blk);
      mc.appendChild(node);
      if(over(mc) && cur.length){ drop(node); push(); node = makeEl(blk); mc.appendChild(node); }
      cur.push(blk);
    }
  };

  const feed = (b, chIndex)=>{
    if(b.t==='opener'){ push(); if(chIndex!=null) chapPage[chIndex]=pages.length; pages.push([b]); mc.innerHTML=''; return; }
    const el = makeEl(b);
    mc.appendChild(el);
    if(over(mc)){
      mc.removeChild(el);
      if(cur.length) push();
      mc.appendChild(el);
      if(over(mc)){                       // ページ丸ごと使っても収まらない
        mc.removeChild(el);
        if(chIndex!=null) chapPage[chIndex] = pages.length;
        flowSplit(b);
        return;
      }
    }
    if(chIndex!=null) chapPage[chIndex] = pages.length;
    cur.push(b);
  };

  const chStart = {};
  DATA.chapters.forEach((c,i)=>{ chStart[c.b]=i; });
  DATA.blocks.forEach((b,i)=> feed(b, chStart[i]!=null?chStart[i]:null));
  push();

  // verify: re-measure every page and move any spilled block to the next one
  for(let p=1;p<pages.length;p++){
    if(pages[p][0] && (pages[p][0].t==='toc' || pages[p][0].t==='opener')) continue;
    mc.innerHTML='';
    const keep=[]; const spill=[];
    for(const b of pages[p]){
      if(spill.length){ spill.push(b); continue; }
      const el=makeEl(b); mc.appendChild(el);
      if(over(mc) && keep.length){ mc.removeChild(el); spill.push(b); }
      else keep.push(b);
    }
    if(spill.length){
      pages[p]=keep;
      pages.splice(p+1,0,spill);
      for(let c=0;c<chapPage.length;c++) if(chapPage[c]>p) chapPage[c]++;
    }
  }
  mc.innerHTML='';
  if(pages.length%2===0 && spread) pages.push([{t:'blank'}]);
}

/* ---------- render ---------- */
function renderPage(hostPage, page){
  const host = hostPage.querySelector('.col');
  host.innerHTML='';
  hostPage.classList.remove('blank');
  if(!page){ hostPage.classList.add('blank'); return; }
  if(page[0] && page[0].t==='cover'){
    host.innerHTML = '<div class="opener" style="background:#e3ddcb"><img alt="'+DATA.title+'　'+DATA.sub+'" src="'+COVER+'"></div>';
    return;
  }
  if(page[0] && page[0].t==='blank'){ hostPage.classList.add('blank'); return; }
  if(page[0] && page[0].t==='toc'){ renderToc(host); return; }
  page.forEach(b=> host.appendChild(makeEl(b)));
}

function update(dir){
  const A=document.getElementById('pageA'), B=document.getElementById('pageB');
  if(spread && idx>0 && idx%2===0) idx--;
  idx = Math.max(0, Math.min(pages.length-1, idx));

  if(spread && idx>0){ renderPage(A,pages[idx]); renderPage(B,pages[idx+1]); }
  else { renderPage(A,pages[idx]); renderPage(B,null); }

  if(dir){
    const dx = (dir>0 ? (vertical?-14:14) : (vertical?14:-14))+'px';
    [A,B].forEach(el=>{ el.style.setProperty('--dx',dx); el.classList.remove('flip'); void el.offsetWidth; el.classList.add('flip'); });
  }

  const bp = pageOfAnchor(bm), vis = visiblePages();
  A.classList.toggle('marked', bm!=null && bp===vis[0]);
  B.classList.toggle('marked', bm!=null && vis.length>1 && bp===vis[1]);
  const here = bm!=null && vis.indexOf(bp)>=0;
  const bb = document.getElementById('bmBtn');
  bb.setAttribute('aria-pressed', String(here));
  bb.disabled = (idx===0 && !spread) || (idx===0);
  bb.setAttribute('aria-label', here ? 'しおりを外す' : 'このページにしおりをはさむ');
  document.getElementById('bmJump').hidden = !(bm && bp>0 && !here);
  const bi = document.getElementById('bmItem');
  bi.hidden = !(bm && bp>0);
  if(bp>0) bi.textContent = 'しおりのページへ（' + bp + '）';
  const last = pages.length-1;
  const prog = last>0 ? idx/last : 0;
  document.getElementById('mark').setAttribute('transform','translate('+(8+284*prog)+',0)');
  document.getElementById('finalmark').classList.toggle('show', idx===last);

  let name='';
  for(let i=0;i<DATA.chapters.length;i++){ if(chapPage[i]!=null && chapPage[i]<=idx) name=DATA.chapters[i].title; }
  document.getElementById('chapNow').textContent = idx===0 ? '' : name;
  document.getElementById('pageNow').textContent = idx===0 ? '表紙' : (idx + ' / ' + last);
  document.querySelectorAll('.toc-item').forEach(el=>{
    el.setAttribute('aria-current', String(Number(el.dataset.p)<=idx && (Number(el.dataset.next)>idx || el.dataset.next==='')));
  });
}

function go(step){ const n=idx+step*(spread&&idx>0?2:1); if(n<0||n>pages.length-1) return; idx=n; update(step); }
function next(){ go(1); } function prev(){ go(-1); }

/* ---------- column fitting ---------- */
function fitColumn(){
  const pa = document.getElementById('pageA'), cs = getComputedStyle(pa);
  const avail = vertical
    ? pa.clientHeight - parseFloat(cs.paddingTop)  - parseFloat(cs.paddingBottom)
    : pa.clientWidth  - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const n = CHARS[sizeIdx];
  let fs = Math.min(SIZES[sizeIdx], avail / (n * KERN));
  fs = Math.max(12.5, fs);
  const colw = Math.min(avail, Math.floor(fs * n * KERN));
  document.documentElement.style.setProperty('--fs', fs.toFixed(2)+'px');
  document.documentElement.style.setProperty('--colw', colw+'px');
}

/* ---------- layout ---------- */
function layout(keepBlock){
  spread = window.innerWidth >= 940 && window.innerHeight >= 420;
  document.body.classList.toggle('spread', spread);
  document.body.classList.toggle('vert', vertical);
  document.documentElement.style.setProperty('--fs', SIZES[sizeIdx]+'px');
  document.documentElement.style.setProperty('--lh', vertical? '1.95' : '2.05');
  requestAnimationFrame(()=>{
    fitColumn();
    paginate();
    if(keepBlock!=null){
      let found=0;
      for(let p=1;p<pages.length;p++){ if(pages[p].some(b=>b===keepBlock)){ found=p; break; } }
      idx = found || Math.min(idx, pages.length-1);
    }
    buildToc();
    update(0);
  });
}
function currentBlock(){ const p=pages[idx]; return p && p[0] && p[0].t!=='cover' ? p[0] : null; }

/* ---------- toc ---------- */
function buildToc(){
  const list=document.getElementById('tocList');
  list.innerHTML='';
  DATA.chapters.forEach((c,i)=>{
    const b=document.createElement('button');
    b.className='toc-item'; b.dataset.p=chapPage[i]||1;
    b.dataset.next = (chapPage[i+1]!=null? chapPage[i+1] : '');
    b.innerHTML='<span>'+c.title+'</span><span class="pg">'+(chapPage[i]||1)+'</span>';
    b.onclick=()=>{ idx=chapPage[i]||1; closeSheets(); update(1); };
    list.appendChild(b);
  });
}

/* ---------- sheets ---------- */
function closeSheets(){ document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('open')); }
document.getElementById('bmBtn').onclick=toggleBm;
document.getElementById('bmJump').onclick=goBm;
document.getElementById('bmItem').onclick=goBm;
document.getElementById('tocBtn').onclick=()=>document.getElementById('tocSheet').classList.add('open');
document.getElementById('setBtn').onclick=()=>document.getElementById('setSheet').classList.add('open');
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheets);
document.querySelectorAll('.sheet').forEach(s=>s.addEventListener('click',e=>{ if(e.target===s) closeSheets(); }));

document.getElementById('dirSeg').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  const keep=currentBlock();
  vertical = b.dataset.dir==='v';
  document.querySelectorAll('#dirSeg button').forEach(x=>x.setAttribute('aria-pressed', String(x===b)));
  layout(keep);
};
document.getElementById('sizeSeg').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  const keep=currentBlock();
  sizeIdx=Number(b.dataset.size);
  document.querySelectorAll('#sizeSeg button').forEach(x=>x.setAttribute('aria-pressed', String(x===b)));
  layout(keep);
};

/* ---------- input ---------- */
/* 目次ページの項目がページ送りの領域の下にあっても押せるようにする */
function tocHit(e){
  if(!e || (!e.clientX && !e.clientY)) return false;
  const zs=document.querySelectorAll('.zone'); zs.forEach(z=>z.style.pointerEvents='none');
  const el=document.elementFromPoint(e.clientX,e.clientY);
  zs.forEach(z=>z.style.pointerEvents='');
  const t=el && el.closest ? el.closest('.tocpage .tb') : null;
  if(t){ t.click(); return true; }
  return false;
}
document.getElementById('zoneL').onclick=e=>{ if(tocHit(e)) return; vertical? next() : prev(); };
document.getElementById('zoneR').onclick=e=>{ if(tocHit(e)) return; vertical? prev() : next(); };
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') vertical?prev():next();
  else if(e.key==='ArrowLeft') vertical?next():prev();
  else if(e.key===' '||e.key==='ArrowDown'){ e.preventDefault(); next(); }
  else if(e.key==='ArrowUp') prev();
  else if(e.key==='Escape') closeSheets();
});
let tx=0,ty=0;
const bookEl=document.getElementById('book');
bookEl.addEventListener('touchstart',e=>{ tx=e.changedTouches[0].clientX; ty=e.changedTouches[0].clientY; },{passive:true});
bookEl.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)<44 || Math.abs(dx)<Math.abs(dy)) return;
  if(dx<0) vertical?prev():next(); else vertical?next():prev();
},{passive:true});

let rt;
window.addEventListener('resize',()=>{ clearTimeout(rt); const keep=currentBlock(); rt=setTimeout(()=>layout(keep),180); });

if(document.fonts && document.fonts.ready){ document.fonts.ready.then(()=>layout(null)); }
layout(null);
</script>
