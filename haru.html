<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">

<style>
  :root{
    --paper:#e3ddcb;
    --paper-deep:#d6cfba;
    --edge:#c2b9a0;
    --ink:#2b2722;
    --ink-soft:#6d6557;
    --pencil:#4d5157;
    --shu:#a8402c;
    --fs:17px;
    --lh:2.05;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    background:#b9b09a;
    background-image:
      radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.18), transparent 60%),
      repeating-linear-gradient(102deg, rgba(0,0,0,.025) 0 2px, transparent 2px 5px);
    color:var(--ink);
    font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP","Songti SC",serif;
    overflow:hidden;
    -webkit-text-size-adjust:100%;
  }
  #app{height:100dvh;display:flex;flex-direction:column;}

  /* ---- top bar ---- */
  .bar{
    flex:0 0 auto;display:flex;align-items:center;gap:14px;
    padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
  }
  .bar button{
    font:inherit;font-size:13px;letter-spacing:.14em;
    background:none;border:none;color:#4a4335;padding:6px 2px;cursor:pointer;
  }
  .bar button:focus-visible{outline:1.5px solid var(--shu);outline-offset:3px;}

  /* ---- ruler ---- */
  .ruler{flex:1 1 auto;display:flex;align-items:flex-end;gap:6px;height:26px;}
  .ruler .rn{font-size:11px;color:#5c5343;line-height:1;padding-bottom:3px;}
  .ruler svg{flex:1 1 auto;width:100%;height:100%;display:block;overflow:visible;}
  .rulerline{stroke:#5c5343;stroke-width:1;}
  .tick{stroke:#5c5343;stroke-width:1;}
  .tick.mm{stroke:#5c5343;opacity:.45;}
  .num{fill:#5c5343;font-size:9px;font-family:inherit;}
  #fpLayer{position:absolute;top:0;height:26px;pointer-events:none;overflow:hidden;}
  .ruler #fpLayer svg.fp{position:absolute;overflow:visible;flex:none;width:15px;height:9px;display:block;}
  .fp ellipse{fill:none;stroke:#a89d88;stroke-width:.7;stroke-dasharray:1.1 1.3;transition:fill .45s ease,stroke .45s ease,opacity .45s ease;}
  .fp.on ellipse{fill:#3e3c3a;stroke:none;opacity:.85;}
  #fpWall{position:absolute;right:0;top:1px;width:0;height:22px;border-right:1.6px solid #3e3c3a;}
  .ruler .rn:first-child{font-size:10.5px;letter-spacing:.06em;color:#5c5343;}
  .ct{stroke:#b3a893;stroke-width:1;}
  .ct.past{stroke:#3e3c3a;stroke-width:1.6;}
  @media (prefers-reduced-motion:reduce){ .fp ellipse{transition:none;} }
  #mark{transition:transform .35s cubic-bezier(.3,.7,.3,1);}
  #mark line{stroke:var(--pencil);stroke-width:2;stroke-linecap:round;}
  #mark text{fill:var(--pencil);font-size:8.5px;letter-spacing:.06em;}
  #finalmark{opacity:0;}
  #finalmark line{stroke:var(--shu);stroke-width:2.4;stroke-linecap:round;}
  #finalmark text{fill:var(--shu);font-size:9px;}
  #finalmark.show{opacity:1;animation:scratch .7s ease-out;}
  @keyframes scratch{from{clip-path:inset(0 0 100% 0);}to{clip-path:inset(0 0 0 0);}}

  /* ---- book ---- */
  #book{flex:1 1 auto;position:relative;padding:0 10px 4px;min-height:0;}
  .spread{
    height:100%;display:flex;gap:0;justify-content:center;
    filter:drop-shadow(0 10px 22px rgba(60,50,30,.32));
  }
  body.vert .spread{flex-direction:row-reverse;}
  .page{
    position:relative;flex:1 1 0;min-width:0;height:100%;max-width:640px;
    background:var(--paper);
    background-image:
      radial-gradient(ellipse at 20% 12%, rgba(255,255,255,.5), transparent 55%),
      radial-gradient(ellipse at 85% 90%, rgba(150,130,90,.18), transparent 60%);
    padding:26px 20px calc(22px + env(safe-area-inset-bottom));
    overflow:hidden;
    font-size:var(--fs);line-height:var(--lh);
    letter-spacing:.03em;
    text-align:justify;
  }
  body.vert .page{writing-mode:vertical-rl;text-orientation:mixed;text-align:start;}
  .col{inline-size:var(--colw,100%);block-size:100%;margin-inline:auto;}
  .page.blank{background:var(--paper-deep);}
  #pageB{display:none;}
  body.spread #pageB{display:block;}
  body.spread #pageA{box-shadow:inset -14px 0 22px -16px rgba(90,72,40,.55);}
  body.spread #pageB{box-shadow:inset 14px 0 22px -16px rgba(90,72,40,.55);}
  body.spread.vert #pageA{box-shadow:inset 14px 0 22px -16px rgba(90,72,40,.55);}
  body.spread.vert #pageB{box-shadow:inset -14px 0 22px -16px rgba(90,72,40,.55);}

  .flip{animation:flip .26s ease;}
  @keyframes flip{from{opacity:.15;transform:translateX(var(--dx,10px));}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){
    .flip{animation:none;} #mark{transition:none;} #finalmark.show{animation:none;}
  }

  /* ---- text blocks ---- */
  .page p{margin:0;text-indent:1em;}
  .page p + p{margin-top:0;}
  body.vert .page p{text-indent:1em;}
  .page h2{
    margin:0 0 1.6em;font-size:1.22em;font-weight:600;letter-spacing:.22em;
    line-height:1.7;text-indent:0;
  }
  body:not(.vert) .page h2{border-bottom:1px solid rgba(90,80,60,.28);padding-bottom:.5em;}
  body.vert .page h2{border-left:1px solid rgba(90,80,60,.28);padding-left:.5em;margin:0 0 1.6em 0;}
  .page blockquote{
    margin:1.2em .4em;padding:0 1em;color:#4b4335;font-size:.94em;
    border-left:2px solid rgba(120,100,60,.4);
  }
  body.vert .page blockquote{
    margin:.4em 1.2em;padding:1em 0;border-left:none;
    border-top:2px solid rgba(120,100,60,.4);
  }
  .sep{margin:1.5em auto;width:34%;height:0;border-top:1px solid rgba(90,80,60,.3);}
  body.vert .sep{margin:auto 1.5em;height:34%;width:0;border-top:none;border-left:1px solid rgba(90,80,60,.3);}
  .endmark{margin:2em 0 0;text-align:center;letter-spacing:.6em;color:var(--ink-soft);text-indent:0;}
  strong{font-weight:700;}
  body.vert strong{
    text-emphasis:filled dot var(--ink);-webkit-text-emphasis:filled dot var(--ink);
    font-weight:inherit;
  }
  em{font-style:normal;color:var(--ink-soft);}

  /* ---- cover ---- */
  .cover{display:flex;align-items:center;justify-content:center;height:100%;max-height:100%;}
  .cover-in{text-align:center;max-width:100%;}
  body.vert .cover-in{writing-mode:vertical-rl;height:100%;max-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;}
  .cover h1{
    margin:0;font-size:min(6.6vh,8.2vw,50px);font-weight:400;
    letter-spacing:.22em;line-height:1.45;text-indent:0;
  }
  body.vert .cover h1{max-height:100%;}
  .cover .sub{margin-top:1.4em;font-size:.86em;letter-spacing:.34em;color:var(--ink-soft);}
  body.vert .cover .sub{margin:1.4em 0 0;}
  .cover .pillar{margin-top:2.2em;}
  body.vert .cover .pillar{margin:2.2em 0 0;}
  .cover .pillar svg{max-height:22vh;}

  /* ---- tap zones + footer ---- */
  .zone{position:absolute;top:0;bottom:0;width:34%;border:none;background:none;cursor:pointer;padding:0;}
  .zone.l{left:0;} .zone.r{right:0;}
  .zone:focus-visible{outline:1.5px dashed var(--shu);outline-offset:-6px;}
  .foot{
    flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;
    padding:8px 18px calc(env(safe-area-inset-bottom) + 8px);
    font-size:11.5px;letter-spacing:.14em;color:#514936;
  }
  .foot span{opacity:.85;}

  /* ---- sheets ---- */
  .sheet{
    position:fixed;inset:0;z-index:20;display:none;
    background:rgba(40,34,24,.5);backdrop-filter:blur(2px);
  }
  .sheet.open{display:block;}
  .sheet-in{
    position:absolute;left:0;right:0;bottom:0;max-height:76%;overflow:auto;
    background:var(--paper);padding:22px 22px calc(env(safe-area-inset-bottom) + 26px);
    border-radius:2px 2px 0 0;
  }
  .sheet h3{margin:0 0 16px;font-size:14px;letter-spacing:.24em;font-weight:600;color:#4a4335;}
  .toc-item{
    display:flex;justify-content:space-between;gap:14px;width:100%;
    font:inherit;font-size:15px;text-align:left;background:none;border:none;
    padding:11px 0;border-bottom:1px solid rgba(90,80,60,.18);color:var(--ink);cursor:pointer;
  }
  .toc-item .pg{font-size:11px;color:var(--ink-soft);letter-spacing:.1em;flex:0 0 auto;}
  .toc-item[aria-current="true"]{color:var(--shu);}
  .row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid rgba(90,80,60,.18);}
  .row:last-child{border-bottom:none;}
  .row .lab{font-size:14px;letter-spacing:.1em;}
  .seg{display:flex;border:1px solid rgba(90,80,60,.4);}
  .seg button{
    font:inherit;font-size:13px;padding:7px 15px;background:none;border:none;cursor:pointer;color:#4a4335;
    border-left:1px solid rgba(90,80,60,.25);
  }
  .seg button:first-child{border-left:none;}
  .seg button[aria-pressed="true"]{background:#4a4335;color:var(--paper);}
  .close{margin-top:20px;width:100%;font:inherit;font-size:13px;letter-spacing:.2em;padding:12px;background:none;border:1px solid rgba(90,80,60,.4);cursor:pointer;color:#4a4335;}

  #measure{position:fixed;top:-99999px;left:0;visibility:hidden;pointer-events:none;}

  /* ---- 電子版デザイン ---- */
  .page .opener{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#e9e1cf;writing-mode:horizontal-tb;}
  .page .opener img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;}
  .sep{display:flex;align-items:center;justify-content:center;border:none !important;margin:1.4em auto;width:auto;height:auto;}
  body.vert .sep{margin:auto 1.3em;width:auto;height:auto;}
  body:not(.vert) .sep svg{transform:rotate(-90deg);}
  body.vert .sep svg{transform:none;}

  /* ---- 目次ページ・しおり ---- */
  .bar button{white-space:nowrap;flex:0 0 auto;}
  .ruler .rn{white-space:nowrap;flex:0 0 auto;}
  .ruler{min-width:0;} .ruler svg{min-width:0;}
  .bar{gap:10px;}
  .tocpage{position:relative;z-index:3;pointer-events:none;display:flex;flex-direction:column;gap:.45em;height:100%;}
  body.vert .tocpage{padding-top:0;}
  .tocpage h2{margin:0 0 .5em;border:none !important;padding:0 !important;font-size:1.05em;letter-spacing:.5em;}
  .tocpage .ti{display:flex;align-items:center;gap:.5em;font:inherit;background:none;border:none;padding:0;margin:0;color:var(--ink);cursor:pointer;text-align:start;line-height:1.3;}
  .tocpage .tb{pointer-events:auto;display:flex;align-items:center;gap:.5em;font:inherit;background:none;border:none;padding:.1em;margin:0;color:inherit;cursor:pointer;line-height:1.3;}
  .tocpage .tb:focus-visible{outline:1.5px solid var(--shu);outline-offset:2px;}
  .tocpage .tb:active .t{color:var(--shu);}
  .tocpage .ti .n{color:var(--ink-soft);font-size:.85em;letter-spacing:.2em;flex:0 0 auto;}
  .tocpage .ti .t{flex:0 1 auto;}
  .tocpage .ti .d{flex:1 1 auto;min-width:1em;min-height:1em;border:0 dotted rgba(90,80,60,.45);}
  body:not(.vert) .tocpage .ti .d{border-bottom-width:1px;}
  body.vert .tocpage .ti .d{border-left-width:1px;}
  .tocpage .ti .p{display:inline-block;writing-mode:horizontal-tb;font-size:.72em;color:var(--ink-soft);letter-spacing:.05em;flex:0 0 auto;}
  .page.marked::after{content:"";position:absolute;top:14px;right:18px;width:40px;height:20px;background:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 20%22%3E%3Cg transform=%22rotate%28-9 20 10%29%22%3E%3Cpath d=%22M10 4.5 L30 3.5 L31 15.5 L11 16.5 Z%22 fill=%22%23f1ebdc%22 stroke=%22%236d6557%22 stroke-width=%221%22/%3E%3Cpath d=%22M20.5 4 L21 16%22 stroke=%22%238f8674%22 stroke-width=%22.8%22/%3E%3Cpath d=%22M13.5 8 L18 7.8 M13.6 10.5 L18.2 10.3 M13.7 13 L17 12.9%22 stroke=%22%238f8674%22 stroke-width=%22.7%22 stroke-linecap=%22round%22/%3E%3C/g%3E%3C/svg%3E") no-repeat center/contain;z-index:4;pointer-events:none;opacity:.95;}
  body.spread.vert #pageB.marked::after, body.spread:not(.vert) #pageA.marked::after{right:auto;left:22px;}
  #bmBtn[aria-pressed="true"]{color:var(--shu);}
  .foot .bmjump{font:inherit;font-size:11px;letter-spacing:.14em;background:none;border:1px solid rgba(168,64,44,.55);color:var(--shu);padding:3px 10px;cursor:pointer;margin:0 8px;}
  .foot .bmjump[hidden]{display:none;}
  .sheet .bm-item{width:100%;text-align:left;font:inherit;font-size:13px;letter-spacing:.12em;background:none;border:1px solid rgba(168,64,44,.5);color:var(--shu);padding:10px 12px;margin:0 0 14px;cursor:pointer;}
  .sheet .bm-item[hidden]{display:none;}
  .chend{display:block;text-indent:0;text-align:end;font-size:.82em;color:var(--ink-soft);letter-spacing:.2em;margin-top:.6em;}
  .win{fill:#f2d79c;stroke:#b08a45;stroke-width:1;transition:fill .5s ease,stroke .5s ease;}
  .win.now{fill:#f6c46a;stroke:#8a5f1e;stroke-width:1.6;}
  .win.off{fill:none;stroke:#9a917c;}
  @media (prefers-reduced-motion: reduce){.win{transition:none;}}

  #homeLink{font:inherit;font-size:inherit;letter-spacing:.14em;color:var(--ink-soft);text-decoration:none;white-space:nowrap;flex:0 0 auto;}
  #homeLink:hover,#homeLink:focus-visible{color:var(--ink);}
  #homeLink[hidden]{display:none;}
  .nextnav{margin:2.4em 0 0;text-align:center;text-indent:0;line-height:2;}
  .nextnav .lead{display:block;font-size:.8em;letter-spacing:.3em;color:var(--ink-soft);}
  .nextnav a{display:inline-block;margin-top:.4em;padding:.35em 1.1em;border:1px solid rgba(168,64,44,.55);color:var(--shu);
    text-decoration:none;letter-spacing:.12em;font-size:.95em;}
  .nextnav a + a{margin-left:.8em;}
  .page .opener.cov{overflow:hidden;}
  .page .opener.cov .covbg{position:absolute;left:-12px;right:-12px;height:52%;background-repeat:no-repeat;background-size:100% 4000%;filter:blur(6px);}
  .page .opener.cov .covbg.t{top:-12px;background-position:center top;}
  .page .opener.cov .covbg.b{bottom:-12px;background-position:center bottom;}
  .page .opener.cov img{position:relative;
    -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 4%,#000 96%,transparent 100%);
            mask-image:linear-gradient(180deg,transparent 0,#000 4%,#000 96%,transparent 100%);}
  .page .opener.cov.lr .covbg{top:-12px;bottom:-12px;height:auto;width:52%;background-size:4000% 100%;}
  .page .opener.cov.lr .covbg.t{left:-12px;right:auto;background-position:left center;}
  .page .opener.cov.lr .covbg.b{right:-12px;left:auto;bottom:-12px;background-position:right center;}
  .page .opener.cov.lr img{
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 3%,#000 97%,transparent 100%);
            mask-image:linear-gradient(90deg,transparent 0,#000 3%,#000 97%,transparent 100%);}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#cbc3ad">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<body class="vert">
<div id="app">
  <div class="bar">
    <a id="homeLink" href="index.html" hidden>ほかの本</a>
    <button id="tocBtn" aria-haspopup="dialog">目次</button>
    <div class="ruler" aria-hidden="true">
      <span class="rn"></span>
      <svg id="rulerSvg" viewBox="0 0 300 26" preserveAspectRatio="none"></svg>
      <span class="rn"></span>
    </div>
    <button id="bmBtn" aria-pressed="false" aria-label="このページにしおりをはさむ">しおり</button>
    <button id="setBtn" aria-haspopup="dialog">表示</button>
  </div>

  <div id="book">
    <div class="spread">
      <section class="page" id="pageA" aria-live="polite"><div class="col"></div></section>
      <section class="page" id="pageB"><div class="col"></div></section>
    </div>
    <button class="zone l" id="zoneL" aria-label="前後のページ"></button>
    <button class="zone r" id="zoneR" aria-label="前後のページ"></button>
  </div>

  <div class="foot">
    <span id="chapNow"></span>
    <button class="bmjump" id="bmJump" type="button" hidden>しおりへ</button>
    <span id="pageNow"></span>
  </div>
</div>

<div class="sheet" id="tocSheet" role="dialog" aria-label="目次">
  <div class="sheet-in">
    <h3>目次</h3>
    <button class="bm-item" id="bmItem" type="button" hidden>しおりのページへ</button>
    <div id="tocList"></div>
    <button class="close" data-close>閉じる</button>
  </div>
</div>

<div class="sheet" id="setSheet" role="dialog" aria-label="表示設定">
  <div class="sheet-in">
    <h3>表示</h3>
    <div class="row">
      <span class="lab">組み方</span>
      <div class="seg" id="dirSeg">
        <button data-dir="v" aria-pressed="true">縦書き</button>
        <button data-dir="h" aria-pressed="false">横書き</button>
      </div>
    </div>
    <div class="row">
      <span class="lab">文字の大きさ</span>
      <div class="seg" id="sizeSeg">
        <button data-size="0" aria-pressed="false">小</button>
        <button data-size="1" aria-pressed="true">中</button>
        <button data-size="2" aria-pressed="false">大</button>
      </div>
    </div>
    <button class="close" data-close>閉じる</button>
  </div>
</div>

中と、見比べる。"}, {"t": "p", "h": "少し低かった。"}, {"t": "p", "h": "そのまま、ふたを閉めた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "暗がりで、だれかの唇が動いていた。"}, {"t": "p", "h": "声は、聞こえなかった。"}, {"t": "p", "h": "なにを言っているのかは、もう知っていた。"}, {"t": "p", "h": "クスは、目を閉じた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "四日目の晩、虫が鳴いていた。"}, {"t": "p", "h": "草のあいだの、あちこちだった。"}, {"t": "p", "h": "十九人は、その音の中で眠った。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "六日目の晩、虫の声は、三つになった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "八日目の晩、二つ。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "九日目の昼、前の背中が、横へよけた。"}, {"t": "p", "h": "<strong>前に、だれもいなかった。</strong>"}, {"t": "p", "h": "草が、顔の前にあった。"}, {"t": "p", "h": "クスは、それを分けた。"}, {"t": "p", "h": "思っていたより、重かった。"}, {"t": "p", "h": "うしろで、足音がついてきた。"}, {"t": "p", "h": "クスが止まると、足音も止まった。"}, {"t": "p", "h": "鼻をぶつける者は、いなかった。"}, {"t": "p", "h": "夕方、クスは、一度だけ振り返った。"}, {"t": "p", "h": "列の頭が、ぜんぶ見えた。"}, {"t": "p", "h": "一つ、二つと、目で数えはじめた。"}, {"t": "p", "h": "十一で、草が足にからんだ。"}, {"t": "p", "h": "クスは、前を向いた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "十日目の昼、クスは、列のわきへよけた。"}, {"t": "p", "h": "次の者が、前へ出た。"}, {"t": "p", "h": "列が、横を過ぎていった。"}, {"t": "p", "h": "クスは、最後の者のうしろについた。"}, {"t": "p", "h": "いちばんうしろの草は、もう踏まれていた。"}, {"t": "p", "h": "軽かった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "その晩も、年上の者が、肩に手を置いていった。"}, {"t": "p", "h": "最後の肩は、クスだった。"}, {"t": "p", "h": "手が、少しのあいだ、そこにあった。"}, {"t": "p", "h": "「そろってる」"}, {"t": "p", "h": "虫が、一つだけ鳴いていた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "十一日目の夕方、川の音が、近くなった。"}, {"t": "p", "h": "土手の下からでは、なかった。"}, {"t": "p", "h": "道の先から、聞こえた。"}, {"t": "p", "h": "その晩、虫は、鳴かなかった。"}, {"t": "p", "h": "ゆうべは、一つ、鳴いていた。"}, {"t": "p", "h": "クスは、横になった。"}, {"t": "p", "h": "<strong>川の音だけが、していた。</strong>"}, {"t": "opener", "i": 2, "alt": "第二章　浅瀬"}, {"t": "p", "h": "十二日目、道が、川へ下りていた。"}, {"t": "p", "h": "明け方の草は、露で重かった。"}, {"t": "p", "h": "昼前、川の音が、足もとまで来た。"}, {"t": "p", "h": "川は、広かった。"}, {"t": "p", "h": "まんなかのあたりだけ、水の色が薄い。"}, {"t": "p", "h": "石の背が、点々と出ていた。"}, {"t": "p", "h": "浅瀬である。"}, {"t": "p", "h": "向こう岸は、葦だった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "その日、クスは列の終わり近くにいた。"}, {"t": "p", "h": "うしろには、二人しかいなかった。"}, {"t": "p", "h": "先頭が、荷を頭の上に載せた。"}, {"t": "p", "h": "糧の袋。糸の残り。替えの靴。"}, {"t": "p", "h": "水筒だけは、腰に下げたままにした。"}, {"t": "p", "h": "うしろの者も、載せた。"}, {"t": "p", "h": "クスも、載せた。"}, {"t": "p", "h": "先頭が、水に入った。"}, {"t": "p", "h": "一人ずつ、間をあけて続いた。"}, {"t": "p", "h": "列は、川の上に長くのびた。"}, {"t": "p", "h": "クスの番が来るまで、長くかかった。"}, {"t": "p", "h": "水は、冷たかった。"}, {"t": "p", "h": "背の高い者は、まだ膝だと言った。"}, {"t": "p", "h": "低い者は、もう胸だと言った。"}, {"t": "p", "h": "クスは、腰だった。"}, {"t": "p", "h": "「冷てえ」と、うしろのだれかが言った。"}, {"t": "p", "h": "「川だからな」"}, {"t": "p", "h": "前の者が踏んだ石を、踏んだ。"}, {"t": "p", "h": "次の石も、踏んだ。"}, {"t": "p", "h": "三つ目の石で、足が流れかけた。"}, {"t": "p", "h": "前の者は、振り返らなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "川のなかほどで、クスは顔を上げた。"}, {"t": "p", "h": "前を行く者たちは、腰まで水に沈んでいた。"}, {"t": "p", "h": "頭の上の荷だけが、点々と、向こう岸まで続いていた。"}, {"t": "p", "h": "先頭に近いあたりで、水が光った。"}, {"t": "p", "h": "だれかが、かがんでいた。"}, {"t": "p", "h": "眼鏡をかけた者らしかった。"}, {"t": "p", "h": "両手を、水に入れている。"}, {"t": "p", "h": "しばらくして、立った。"}, {"t": "p", "h": "手に、なにか持っていた。"}, {"t": "p", "h": "<strong>列は、止まらなかった。</strong>"}, {"t": "sep", "h": ""}, {"t": "p", "h": "向こう岸に着いたのは、日が傾いてからだった。"}, {"t": "p", "h": "葦は、頭に載せた荷よりも高かった。"}, {"t": "p", "h": "列は、葦のなかでほどけた。"}, {"t": "p", "h": "ひとりずつ、葦を分けて、土手へ上がった。"}, {"t": "p", "h": "前の者の背中は、すぐに見えなくなった。"}, {"t": "p", "h": "葦の向こうで、足音だけがしていた。"}, {"t": "p", "h": "土手の上で、また寄り集まった。"}, {"t": "p", "h": "濡れた荷を、ひろげた。"}, {"t": "p", "h": "クスの荷は、片側だけ濡れていた。"}, {"t": "p", "h": "日が、落ちた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "その夜も、年上の者が、ひとりずつ肩に手を置いていった。"}, {"t": "p", "h": "十本折って、手をひらいた。また折りはじめて、八本目で止まった。"}, {"t": "p", "h": "次の肩が、なかった。"}, {"t": "p", "h": "「……そろってる?」とクスは言った。"}, {"t": "p", "h": "年上の者は、答えなかった。"}, {"t": "p", "h": "最初の肩に戻って、もう一度、数えた。"}, {"t": "p", "h": "十と、八だった。"}, {"t": "p", "h": "三度目は、数えなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "すぐに、何人かが葦のなかへ下りていった。"}, {"t": "p", "h": "クスも、下りた。"}, {"t": "p", "h": "暗かった。"}, {"t": "p", "h": "足もとで、水が鳴った。"}, {"t": "p", "h": "前を行く者の声だけが、聞こえた。"}, {"t": "p", "h": "ひとつの名前を、いくつもの声が呼んだ。"}, {"t": "p", "h": "すぐ前で、だれかが、水筒の水を少しだけ川に注いだ。"}, {"t": "p", "h": "川の音のほうが、大きかった。"}, {"t": "p", "h": "返事は、なかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "夜が更けてから、待つか発つかを話した。"}, {"t": "p", "h": "「待とう」と、だれかが言った。"}, {"t": "p", "h": "「いつまで」"}, {"t": "p", "h": "「戻ってくるまで」"}, {"t": "p", "h": "「戻ってこなかったら」"}, {"t": "p", "h": "だれも、すぐには答えなかった。"}, {"t": "p", "h": "年上の者が、糧の袋をひらいた。"}, {"t": "p", "h": "中を、指でならした。"}, {"t": "p", "h": "袋を、閉じた。"}, {"t": "p", "h": "「朝に、発とう」と、別の者が言った。"}, {"t": "p", "h": "「もう一日だけ」と、だれかが言った。"}, {"t": "p", "h": "年上の者が、みんなを見た。"}, {"t": "p", "h": "「朝に発つ者は」"}, {"t": "p", "h": "手が、挙がった。"}, {"t": "p", "h": "半分より、多かった。"}, {"t": "p", "h": "クスは、まわりの手を見た。"}, {"t": "p", "h": "それから、挙げた。"}, {"t": "p", "h": "挙げなかった者は、なにも言わなかった。"}, {"t": "p", "h": "挙げた者も、なにも言わなかった。"}, {"t": "p", "h": "「朝までは、待つ」と年上の者は言った。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "夜のあいだ、葦が何度か鳴った。"}, {"t": "p", "h": "一度目は、何人もが体を起こした。"}, {"t": "p", "h": "二度目は、三人だった。"}, {"t": "p", "h": "三度目に起きたのは、手を挙げなかった者のひとりだけだった。"}, {"t": "p", "h": "どれも、風だった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "朝、川の上に霧が出ていた。"}, {"t": "p", "h": "戻ってきた者は、いなかった。"}, {"t": "p", "h": "川べりで、それぞれが水筒を満たした。"}, {"t": "p", "h": "いっぱいまで、満たした。"}, {"t": "p", "h": "年上の者が、荷を背負った。"}, {"t": "p", "h": "手を挙げた者たちが、続いた。"}, {"t": "p", "h": "クスも、背負った。まわりより、少し遅れた。"}, {"t": "p", "h": "手を挙げなかった者たちも、背負った。"}, {"t": "p", "h": "最後のひとりは、しばらく葦のほうを見ていた。"}, {"t": "p", "h": "それから、背負った。"}, {"t": "p", "h": "列を組んだ。"}, {"t": "p", "h": "先頭が、草を分けた。"}, {"t": "p", "h": "土手を少し行ったところで、だれかが振り返った。"}, {"t": "p", "h": "何人かが、振り返った。"}, {"t": "p", "h": "クスも、振り返った。"}, {"t": "p", "h": "<strong>葦が、揺れていた。</strong>"}, {"t": "opener", "i": 3, "alt": "第三章　天水桶"}, {"t": "p", "h": "昼になった。"}, {"t": "p", "h": "先頭の者が、列のわきへよけた。"}, {"t": "p", "h": "次の者が、前へ出て、草を分けた。"}, {"t": "p", "h": "よけた者は、列の横を過ぎて、いちばんうしろについた。"}, {"t": "p", "h": "クスのうしろは、三人になった。"}, {"t": "p", "h": "川を離れても、列は、昼ごとに回った。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "その夜、年上の者が、ひとりずつ肩に手を置いていった。"}, {"t": "p", "h": "指は、折らなかった。"}, {"t": "p", "h": "置いて、離す。"}, {"t": "p", "h": "次の肩に、置く。"}, {"t": "p", "h": "最後の肩から手を離すと、そのまま横になった。"}, {"t": "p", "h": "だれも、なにも訊かなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "道は、川に沿って、下流へ続いた。"}, {"t": "p", "h": "草が、低くなった。"}, {"t": "p", "h": "人間の荷車のわだちが、二筋、先へ続いていた。"}, {"t": "p", "h": "列は、その片方の底を歩いた。"}, {"t": "p", "h": "水は、昼と夕方に飲んだ。"}, {"t": "p", "h": "昼ごとに、先頭が替わった。"}, {"t": "p", "h": "クスは、一つずつ前へ出た。"}, {"t": "p", "h": "前の者の背中は、替わらなかった。"}, {"t": "p", "h": "村を出た朝から、同じ背中だった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ある昼、列の先で、先頭がよけた。"}, {"t": "p", "h": "次の背中は、前へ出なかった。"}, {"t": "p", "h": "前の、なにもないところを、見ていた。"}, {"t": "p", "h": "<strong>列が、止まった。</strong>"}, {"t": "p", "h": "クスの鼻が、前の者の荷に当たった。"}, {"t": "p", "h": "前の者は、振り返らなかった。"}, {"t": "p", "h": "列の先を、見ていた。"}, {"t": "p", "h": "止まっていた背中が、草へ向きなおった。"}, {"t": "p", "h": "草が、分かれた。"}, {"t": "p", "h": "列が、また動きだした。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "人間の町に着いたのは、明け方だった。"}, {"t": "p", "h": "石の道。石の塀。塀の下の、細い溝。"}, {"t": "p", "h": "十八人は、溝のふちを一列で歩いた。"}, {"t": "p", "h": "頭の上を、人間の下駄の音が過ぎていった。"}, {"t": "p", "h": "からん、ころん、と鳴った。"}, {"t": "p", "h": "音が来るたびに、塀に背をつけて、待った。"}, {"t": "p", "h": "溝の上に、板が渡してあるところがあった。"}, {"t": "p", "h": "板のすきまが、ふっと暗くなった。"}, {"t": "p", "h": "人間の子が、しゃがんでいた。"}, {"t": "p", "h": "片目を、つぶっている。"}, {"t": "p", "h": "あいたほうの目が、すきまに寄ってきた。"}, {"t": "p", "h": "十八人は、塀の根に体をつけた。"}, {"t": "p", "h": "息を、止めた。"}, {"t": "p", "h": "前の者の荷が、少しも揺れなかった。"}, {"t": "p", "h": "遠くで、人間の大人の声がした。"}, {"t": "p", "h": "子が、振り返った。"}, {"t": "p", "h": "「なんにもいないよ」と子は言った。"}, {"t": "p", "h": "すきまが、明るくなった。"}, {"t": "p", "h": "下駄の音が、駆けていった。"}, {"t": "p", "h": "先頭が、また歩きだした。"}, {"t": "p", "h": "町は、端から端まで、一日かかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "昼すぎ、人間の家の軒下に、大きな桶があった。"}, {"t": "p", "h": "天水桶（てんすいおけ）である。"}, {"t": "p", "h": "たがの継ぎ目から、水がにじんでいた。"}, {"t": "p", "h": "下の石が、黒く濡れていた。"}, {"t": "p", "h": "先頭の者が、足を止めた。"}, {"t": "p", "h": "「だれか、見張りに」と年上の者が言った。"}, {"t": "p", "h": "だれも、動かなかった。"}, {"t": "p", "h": "クスは、まわりを見た。まわりも、クスを見ていた。"}, {"t": "p", "h": "年上の者が、立った。"}, {"t": "p", "h": "残りの者は、継ぎ目の下に並んだ。"}, {"t": "p", "h": "一人ずつ、水筒を当てた。"}, {"t": "p", "h": "クスの番が来た。"}, {"t": "p", "h": "水は、湧き水よりも早く入った。"}, {"t": "p", "h": "古い木のにおいがした。"}, {"t": "p", "h": "ふたを閉めると、うしろの者が、もう水筒を当てていた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "日暮れに、町の南の端に出た。"}, {"t": "p", "h": "年上の者が、溝のわきで、町の年寄りと話していた。"}, {"t": "p", "h": "戻ってきて、言った。"}, {"t": "p", "h": "「南の町まで、十八日だそうだ」"}, {"t": "p", "h": "「十八日?」とクスは言った。"}, {"t": "p", "h": "「十八日」"}, {"t": "p", "h": "うしろで、町の灯が、ともりはじめていた。"}, {"t": "p", "h": "十八人は、灯に背を向けて、歩きだした。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "南への道は、低い丘を、いくつも越えた。"}, {"t": "p", "h": "丘の上から、次の丘が見えた。"}, {"t": "p", "h": "その向こうにも、丘があった。"}, {"t": "p", "h": "先頭は、昼ごとに替わる。"}, {"t": "p", "h": "十八日あれば、十八人が、ちょうど一度ずつ先頭に立つことになる。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "明け方の草は、露で重かった。"}, {"t": "p", "h": "霜は、まだ見なかった。"}, {"t": "p", "h": "水は、人間の畑の溝で満たした。"}, {"t": "p", "h": "三日もすると、天水桶の水は、ほかの水と混ざって、わからなくなった。"}, {"t": "p", "h": "夜は、刈り株の陰や、人間の石垣の下で眠った。"}, {"t": "p", "h": "年上の者は、毎晩、肩に手を置いていった。"}, {"t": "p", "h": "指は、やはり折らなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ある晩、風が、急に冷たくなった。"}, {"t": "p", "h": "道のわきに、人間の豚小屋があった。"}, {"t": "p", "h": "板壁の下に、穴があいていた。"}, {"t": "p", "h": "中には、わらが厚く敷いてあった。"}, {"t": "p", "h": "奥で、豚が寝息を立てていた。"}, {"t": "p", "h": "わらは、温かかった。"}, {"t": "p", "h": "餌の桶のまわりに、麦のこぼれが、いくらでも落ちていた。"}, {"t": "p", "h": "十八人は、わらにもぐって眠った。"}, {"t": "p", "h": "朝、年上の者が、荷を背負った。"}, {"t": "p", "h": "何人かは、わらから出てこなかった。"}, {"t": "p", "h": "「もう一晩」と、わらのなかで、だれかが言った。"}, {"t": "p", "h": "年上の者は、答えなかった。"}, {"t": "p", "h": "板壁の穴から、外へ出た。"}, {"t": "p", "h": "ほかの者が、続いた。"}, {"t": "p", "h": "クスも、続いた。少し遅れた。"}, {"t": "p", "h": "わらのなかの者たちは、いちばんあとから出てきた。"}, {"t": "p", "h": "袖に、麦のかすがついていた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "何日目かの昼、前の者が、列のわきへよけた。"}, {"t": "p", "h": "クスは、すぐには出なかった。"}, {"t": "p", "h": "うしろの者の鼻が、クスの荷に当たった。"}, {"t": "p", "h": "「おい」と、うしろの者が言った。"}, {"t": "p", "h": "クスは、前へ出た。"}, {"t": "p", "h": "草は、乾いていた。"}, {"t": "p", "h": "分けると、かさかさ、と鳴った。"}, {"t": "p", "h": "その日は、夕方まで、一度も振り返らなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "南へ十七日目の夕方、道の先に、低い屋根が見えた。"}, {"t": "p", "h": "人間の屋根だった。"}, {"t": "p", "h": "いくつも、重なっていた。"}, {"t": "p", "h": "煙が、何本か、まっすぐ上がっていた。"}, {"t": "p", "h": "列が、少しずつ詰まって、止まった。"}, {"t": "p", "h": "クスも、止まった。"}, {"t": "p", "h": "前の荷に、鼻は当たらなかった。"}, {"t": "p", "h": "<strong>前の者が、振り返った。</strong>"}, {"t": "opener", "i": 4, "alt": "第四章　水甕"}, {"t": "p", "h": "屋根は、まだ遠かった。"}, {"t": "p", "h": "前の者は、クスの顔を見ていなかった。"}, {"t": "p", "h": "肩の向こうを、見ていた。"}, {"t": "p", "h": "列の、うしろのほうだった。"}, {"t": "p", "h": "「うしろは」と前の者は言った。"}, {"t": "p", "h": "「うしろ?」"}, {"t": "p", "h": "クスも、振り返った。"}, {"t": "p", "h": "夕日のなかに、列の頭が並んでいた。"}, {"t": "p", "h": "数えなかった。"}, {"t": "p", "h": "「いる」"}, {"t": "p", "h": "「そうか」"}, {"t": "p", "h": "前の者は、向きなおった。"}, {"t": "p", "h": "列が、また動きだした。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "十八日目の昼、人間の町に入った。"}, {"t": "p", "h": "溝のふちを、一列で歩いた。"}, {"t": "p", "h": "人間の下駄の音が来るたびに、塀に背をつけた。"}, {"t": "p", "h": "一軒の窓が、少しあいていた。"}, {"t": "p", "h": "人間のラジオが、鳴っていた。"}, {"t": "p", "h": "人間の女の声が、歌っていた。"}, {"t": "p", "h": "列のまんなかで、ひとりが足を止めた。"}, {"t": "p", "h": "顔が、窓のほうを向いていた。"}, {"t": "p", "h": "列から、一歩、外へ出た。"}, {"t": "p", "h": "前とうしろの者が、その腕を、片方ずつつかんだ。"}, {"t": "p", "h": "そのまま、歩かせた。"}, {"t": "p", "h": "列は、止まらなかった。"}, {"t": "p", "h": "クスは、窓を一度だけ見た。"}, {"t": "p", "h": "足は、前の者に合わせたままだった。"}, {"t": "p", "h": "塀の角を曲がると、歌は、下駄の音にまぎれた。"}, {"t": "p", "h": "日が傾くころ、先頭の者が、一軒の戸の前で止まった。"}, {"t": "p", "h": "戸の下に、すきまがあった。"}, {"t": "p", "h": "乾いた紙のにおいが、そこから出ていた。"}, {"t": "p", "h": "一人ずつ、すきまをくぐった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "人間の古本屋である。"}, {"t": "p", "h": "棚が、天井まで続いていた。"}, {"t": "p", "h": "どの段にも、人間の本が詰まっていた。"}, {"t": "p", "h": "床にも、積んであった。"}, {"t": "p", "h": "年上の者が、棚のあいだを奥へ歩いた。"}, {"t": "p", "h": "うしろの者が、続いた。"}, {"t": "p", "h": "いちばん奥の棚のうしろで、足が止まった。"}, {"t": "p", "h": "棚と壁のあいだが、少しだけ空いていた。"}, {"t": "p", "h": "ほこりが、平らに積もっていた。"}, {"t": "p", "h": "だれかが通ったようすは、なかった。"}, {"t": "p", "h": "年上の者が、荷を下ろした。"}, {"t": "p", "h": "うしろの者たちも、下ろした。"}, {"t": "p", "h": "クスも、下ろした。少し遅れた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "日が落ちてから、店の奥の土間へ下りた。"}, {"t": "p", "h": "隅に、人間の水甕（みずがめ）があった。"}, {"t": "p", "h": "甕の肌が、濡れていた。"}, {"t": "p", "h": "底のまわりの土に、水がたまっていた。"}, {"t": "p", "h": "十八人は、甕の下に並んだ。"}, {"t": "p", "h": "一人ずつ、水筒を沈めた。"}, {"t": "p", "h": "クスの番が来た。"}, {"t": "p", "h": "泡が、上がってきた。"}, {"t": "p", "h": "一口、飲んだ。"}, {"t": "p", "h": "土のにおいがした。"}, {"t": "p", "h": "棚の奥に戻って、水筒を、荷のわきに置いた。"}, {"t": "p", "h": "腰には、下げなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "あくる日の夕方、年上の者が、棚の下のほこりから、なにか拾った。"}, {"t": "p", "h": "人間の釘だった。"}, {"t": "p", "h": "古くて、ざらざらしていた。"}, {"t": "p", "h": "年上の者は、しばらく、壁を見ていた。"}, {"t": "p", "h": "それから、釘の先を、壁に当てた。"}, {"t": "p", "h": "横に、一本。"}, {"t": "p", "h": "壁は、古い土だった。かり、かり、と鳴って、白い粉が落ちた。"}, {"t": "p", "h": "線の下に、米粒ほどの字を書いた。"}, {"t": "p", "h": "自分の名前だった。"}, {"t": "p", "h": "書きおえると、釘を、となりの者に差し出した。"}, {"t": "p", "h": "となりの者は、前の線と同じ高さに、一本引いた。"}, {"t": "p", "h": "その下に、自分の名前を書いた。"}, {"t": "p", "h": "次の者に、差し出した。"}, {"t": "p", "h": "釘の先で、一本。"}, {"t": "p", "h": "ひとりに、一本。"}, {"t": "p", "h": "途中で、釘の先が丸くなった。"}, {"t": "p", "h": "そこからは、荷の小刀の先で引いた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "クスの番が来た。"}, {"t": "p", "h": "前の線は、少し高かった。その前は、少し低かった。"}, {"t": "p", "h": "小刀の先を、そのまんなかに当てた。"}, {"t": "p", "h": "横に、引いた。"}, {"t": "p", "h": "線の下に、自分の名前を書いた。"}, {"t": "p", "h": "書きおえて振り返ると、うしろの者が、もう手を出していた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "最後の者が書きおえると、年上の者が、壁の前に立った。"}, {"t": "p", "h": "一本目の線に、指でふれた。"}, {"t": "p", "h": "となりの線に、ふれた。"}, {"t": "p", "h": "その次に、ふれた。"}, {"t": "p", "h": "指は、端の線で止まった。"}, {"t": "p", "h": "「十八」と年上の者は言った。"}, {"t": "p", "h": "釘は、一本目の線の下に置かれた。"}, {"t": "p", "h": "それで、みんな横になった。"}, {"t": "p", "h": "それぞれ、自分の線の下だった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "その夜、クスは、目を覚ました。"}, {"t": "p", "h": "表の戸のすきまから、外の明かりが、細く入っていた。"}, {"t": "p", "h": "壁の線が、うすく見えた。"}, {"t": "p", "h": "線の下で、みんな眠っていた。"}, {"t": "p", "h": "体を起こした。"}, {"t": "p", "h": "一本目の線の下の頭から、目で数えはじめた。"}, {"t": "p", "h": "一つ。二つ。三つ。"}, {"t": "p", "h": "五つ目で、やめなかった。"}, {"t": "p", "h": "十一も、過ぎた。"}, {"t": "p", "h": "自分のところで、自分の膝を見た。"}, {"t": "p", "h": "十五。"}, {"t": "p", "h": "十八。"}, {"t": "p", "h": "十八の先に、頭は、なかった。"}, {"t": "p", "h": "床が、あった。"}, {"t": "p", "h": "その上の壁には、なにも引いてなかった。"}, {"t": "p", "h": "そこに、目を置いた。"}, {"t": "p", "h": "<strong>十九。</strong>"}, {"t": "p", "h": "立ち上がって、一本目の線の下から、釘を拾った。"}, {"t": "p", "h": "眠っている者たちの足もとを、端まで歩いた。"}, {"t": "p", "h": "十八本目の線の隣に、釘の先を当てた。"}, {"t": "p", "h": "床からの高さを、となりの線に合わせた。"}, {"t": "p", "h": "横に、引いた。"}, {"t": "p", "h": "釘の先は、丸かった。"}, {"t": "p", "h": "線は、浅かった。"}, {"t": "p", "h": "同じところを、ていねいになぞった。"}, {"t": "p", "h": "何度も、なぞった。"}, {"t": "p", "h": "線の下に、釘の先を当てた。"}, {"t": "p", "h": "動かさなかった。"}, {"t": "p", "h": "釘を、一本目の線の下に戻した。"}, {"t": "p", "h": "自分の線の下に戻って、横になった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "朝、年上の者が、壁の前に立っていた。"}, {"t": "p", "h": "指が、一本目の線から、順にふれていった。"}, {"t": "p", "h": "十八本目を、過ぎた。"}, {"t": "p", "h": "十九本目で、止まった。"}, {"t": "p", "h": "年上の者は、線の下を、しばらく見ていた。"}, {"t": "p", "h": "指を、離した。"}, {"t": "p", "h": "何人かが、うしろから壁を見ていた。"}, {"t": "p", "h": "だれも、なにも訊かなかった。"}, {"t": "p", "h": "前の者が、クスを見た。"}, {"t": "p", "h": "少しのあいだ、見ていた。"}, {"t": "p", "h": "それから、水筒を持って、土間へ下りていった。"}, {"t": "p", "h": "ほかの者も、続いた。"}, {"t": "p", "h": "クスも、水筒を持った。"}, {"t": "p", "h": "土間へ下りる前に、一度だけ、振り返った。"}, {"t": "p", "h": "<strong>線の下は、空いていた。</strong>"}, {"t": "opener", "i": 5, "alt": "第五章　硯"}, {"t": "p", "h": "雨が、降っていた。"}, {"t": "p", "h": "表の戸のすきまから、しめった風が入ってきた。"}, {"t": "p", "h": "荷は、まだ半分も解いていなかった。"}, {"t": "p", "h": "水筒は、荷のわきに並べたままだった。"}, {"t": "p", "h": "壁の線は、まだ白い粉をかぶっていた。"}, {"t": "p", "h": "日が落ちてから、年上の者が、壁の前に立った。"}, {"t": "p", "h": "「村に、便りを出す」"}, {"t": "p", "h": "何人かが、うなずいた。"}, {"t": "p", "h": "クスも、うなずいた。少し遅れた。"}, {"t": "p", "h": "「紙が要る」と年上の者は言った。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "紙は、人間の本のあいだにあった。"}, {"t": "p", "h": "棚の段に上がって、本の背を押す。"}, {"t": "p", "h": "頁のあいだから、白いものがはみ出している。"}, {"t": "p", "h": "引くと、紙きれが出てきた。"}, {"t": "p", "h": "十八人は、棚のあちこちへ散った。"}, {"t": "p", "h": "人間の本が、ところどころで、少しだけ傾いた。"}, {"t": "p", "h": "戻ってきた者から、紙を床に置いていった。"}, {"t": "p", "h": "字の刷ってある紙。黄ばんだ紙。端の破れた紙。"}, {"t": "p", "h": "指の先ほどしかない紙もあった。"}, {"t": "p", "h": "二人がかりで引きずってきた紙もあった。"}, {"t": "p", "h": "クスは、いちばんあとに戻ってきた。"}, {"t": "p", "h": "抱えた紙は、大きくも、小さくもなかった。"}, {"t": "p", "h": "年上の者が、床の紙を見比べた。"}, {"t": "p", "h": "クスの紙を、取った。"}, {"t": "p", "h": "しわを、手のひらでのばした。"}, {"t": "p", "h": "「遅かったな」と、前の者が言った。"}, {"t": "p", "h": "「みんなのを、見てた」"}, {"t": "p", "h": "「見てから?」"}, {"t": "p", "h": "「見てから、取りに行った」"}, {"t": "p", "h": "二人がかりの紙を引きずってきた者たちが、顔を見合わせた。"}, {"t": "p", "h": "それから、自分たちの紙を、棚の下へ押しこんだ。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "土間から一段高いところに、人間の机があった。"}, {"t": "p", "h": "人間の硯（すずり）が、置いてあった。"}, {"t": "p", "h": "墨をためるくぼみは、乾いていた。"}, {"t": "p", "h": "ふちに、墨が黒くこびりついていた。"}, {"t": "p", "h": "年上の者が、水筒のふたをあけた。"}, {"t": "p", "h": "くぼみに、水を少しだけ落とした。"}, {"t": "p", "h": "指で、ふちの墨をこすった。"}, {"t": "p", "h": "水が、黒くなった。"}, {"t": "p", "h": "墨のにおいがした。古い紙のにおいと、少しちがった。"}, {"t": "p", "h": "だれかが、小刀で木のかけらの先を細くして、差し出した。"}, {"t": "p", "h": "紙は、硯のわきに広げた。"}, {"t": "p", "h": "十八人が、まわりに座った。"}, {"t": "p", "h": "年上の者は、木のかけらの先を墨にひたした。"}, {"t": "p", "h": "紙の上で、手が止まった。"}, {"t": "p", "h": "しばらく、そのままだった。"}, {"t": "p", "h": "「村は、どっちだ」と年上の者は言った。"}, {"t": "p", "h": "何本かの指が、表の戸のほうを指した。"}, {"t": "p", "h": "来た道は、そっちだった。"}, {"t": "p", "h": "年上の者が、表の戸のほうへ向きなおった。"}, {"t": "p", "h": "ほかの者も、向きなおった。"}, {"t": "p", "h": "クスも、向きなおった。"}, {"t": "p", "h": "机の上から、表の戸が見えた。"}, {"t": "p", "h": "その向こうは、暗かった。"}, {"t": "p", "h": "戸のすきまから、雨の音が細く聞こえていた。"}, {"t": "p", "h": "だれも、なにも言わなかった。"}, {"t": "p", "h": "年上の者は、紙に目を戻した。"}, {"t": "p", "h": "木のかけらの先が、動いた。"}, {"t": "p", "h": "一字書くたびに、硯へ戻った。"}, {"t": "p", "h": "年上の者は、途中で一度、手を止めた。"}, {"t": "p", "h": "表の戸のほうを、見た。"}, {"t": "p", "h": "木のかけらの先が、また動いた。"}, {"t": "p", "h": "書きおえると、年上の者は、紙をみんなのほうへ向けた。"}, {"t": "quote", "h": "村の皆へ<br><br>南に着いた。<br>十八人、皆、達者だ。<br>春になったら、また便りを出す。"}, {"t": "p", "h": "何人かが、身を乗り出した。"}, {"t": "p", "h": "クスも、首をのばした。"}, {"t": "p", "h": "クスは、「十八人」の字を、しばらく見ていた。"}, {"t": "p", "h": "年上の者が、文面の下に、自分の名前を書いた。"}, {"t": "p", "h": "木のかけらを、となりの者に差し出した。"}, {"t": "p", "h": "となりの者は、その下に、自分の名前を書いた。"}, {"t": "p", "h": "次の者に、差し出した。"}, {"t": "p", "h": "クスの番が来た。"}, {"t": "p", "h": "前の名前の下に、自分の名前を書いた。"}, {"t": "p", "h": "それだけだった。"}, {"t": "p", "h": "木のかけらを、うしろの者に渡した。"}, {"t": "p", "h": "最後の者が、書きおえた。"}, {"t": "p", "h": "文面の下に、名前が並んだ。"}, {"t": "p", "h": "名前の大きさは、ばらばらだった。"}, {"t": "p", "h": "墨が乾くまで、だれも紙にさわらなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "墨が乾くと、年上の者が、紙を持ち上げた。"}, {"t": "p", "h": "「だれが、持っていく」"}, {"t": "p", "h": "だれも、動かなかった。"}, {"t": "p", "h": "クスは、まわりを見た。"}, {"t": "p", "h": "まわりも、クスを見ていた。"}, {"t": "p", "h": "雨の音が、していた。"}, {"t": "p", "h": "前の者が、自分の足もとを見た。"}, {"t": "p", "h": "<strong>年上の者は、立たなかった。</strong>"}, {"t": "p", "h": "紙を、膝にのせて、見ていた。"}, {"t": "p", "h": "それから、小さく畳んだ。"}, {"t": "p", "h": "紙は、手のひらに隠れるほどになった。"}, {"t": "p", "h": "年上の者は、それを、自分の荷の奥にしまった。"}, {"t": "opener", "i": 6, "alt": "終章　雪解け"}, {"t": "p", "h": "冬は、棚の奥にも来た。"}, {"t": "p", "h": "明け方、戸のすきまの下に、霜が降りていた。"}, {"t": "p", "h": "人間の本の背が、冷たくなった。"}, {"t": "p", "h": "土間の水甕は、ふちのほうから凍った。"}, {"t": "p", "h": "だれかが、小刀の先で、氷を割った。"}, {"t": "p", "h": "かつ、かつ、と鳴った。"}, {"t": "p", "h": "割れたかけらを、水筒に入れた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ある朝、年上の者が、みんなを見回した。"}, {"t": "p", "h": "「ゆうべ、寒かった者は」"}, {"t": "p", "h": "手が、挙がった。"}, {"t": "p", "h": "半分くらいだった。"}, {"t": "p", "h": "クスは、手を、肩の高さまで挙げた。"}, {"t": "p", "h": "そこで、止めた。"}, {"t": "p", "h": "年上の者が、その手を見た。"}, {"t": "p", "h": "「どっちだ」"}, {"t": "p", "h": "「まんなかくらい」"}, {"t": "p", "h": "前の者が、自分の挙げた手を見上げた。"}, {"t": "p", "h": "少し考えて、肩の高さまで下ろした。"}, {"t": "p", "h": "年上の者は、なにも言わなかった。"}, {"t": "p", "h": "その晩、戸のすきまに、紙が詰めてあった。"}, {"t": "p", "h": "棚の下に押しこんであった、二人がかりの紙だった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "雪が、降った。"}, {"t": "p", "h": "紙のふちから、雪の明かりがもれていた。"}, {"t": "p", "h": "表で、人間の下駄が、きゅっ、きゅっ、と鳴った。"}, {"t": "p", "h": "十八人は、それぞれ自分の線の下で、荷をかぶって眠った。"}, {"t": "p", "h": "年上の者の荷は、いつも、線の下の同じところにあった。"}, {"t": "p", "h": "荷の奥のものを、だれも話さなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "冬のあいだに、線のまわりの白い粉は、落ちた。"}, {"t": "p", "h": "溝だけが、残った。"}, {"t": "p", "h": "釘は、一本目の線の下に置いたままだった。"}, {"t": "p", "h": "年上の者が、ときどき、それを見ていた。"}, {"t": "p", "h": "拾わなかった。"}, {"t": "p", "h": "クスは、村の寝間の壁を思い出した。"}, {"t": "p", "h": "釘の先で、一本。冬を越すたびに、一本。"}, {"t": "p", "h": "あの壁に、線が何本あったか。"}, {"t": "p", "h": "知らなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "屋根の雪が、解けはじめた。"}, {"t": "p", "h": "軒から、水が落ちた。"}, {"t": "p", "h": "ぽた、ぽた、と鳴った。"}, {"t": "p", "h": "表の溝に、水の音が戻った。"}, {"t": "p", "h": "その夜、十八人は、戸の下をくぐって、溝のふちに並んだ。"}, {"t": "p", "h": "一人ずつ、水筒を沈めた。"}, {"t": "p", "h": "クスの番が来た。"}, {"t": "p", "h": "いっぱいまで、満たした。"}, {"t": "p", "h": "雪解けの水は、冷たかった。"}, {"t": "p", "h": "ふたを閉めた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "棚の奥に戻って、水筒を、荷のわきに並べた。"}, {"t": "p", "h": "何人かが、表の戸のほうを見た。"}, {"t": "p", "h": "それから、となりの者を見た。"}, {"t": "p", "h": "となりの者も、戸のほうを見ていた。"}, {"t": "p", "h": "年上の者は、自分の荷のひもに、手をかけた。"}, {"t": "p", "h": "ほどかなかった。"}, {"t": "p", "h": "<strong>だれも、水筒を腰に下げなかった。</strong>"}, {"t": "sep", "h": ""}, {"t": "p", "h": "何日かして、戸のすきまから、草のにおいが入ってきた。"}, {"t": "p", "h": "「道は、乾いたな」と、前の者が言った。"}, {"t": "p", "h": "「乾いた」"}, {"t": "p", "h": "「北も、乾いたかな」"}, {"t": "p", "h": "「乾いたろう」と、だれかが言った。"}, {"t": "p", "h": "それきり、だれも続けなかった。"}, {"t": "p", "h": "次の晩も、水筒は、荷のわきにあった。"}, {"t": "p", "h": "ある朝、戸のすきまの紙が、なくなっていた。"}, {"t": "p", "h": "表の土は、乾いていた。"}, {"t": "p", "h": "明け方の草は、露で重いままだった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "春の、ある夜だった。"}, {"t": "p", "h": "年上の者が、立った。"}, {"t": "p", "h": "荷の奥から、小さく畳んだ紙を出した。"}, {"t": "p", "h": "壁の線にそって、歩いた。"}, {"t": "p", "h": "十八本目の線を、過ぎた。"}, {"t": "p", "h": "いちばん端の線の下で、しゃがんだ。"}, {"t": "p", "h": "壁に、細い割れ目があった。"}, {"t": "p", "h": "畳んだ紙を、割れ目に入れた。"}, {"t": "p", "h": "指の先で、奥へ押した。"}, {"t": "p", "h": "少しのあいだ、指を離さなかった。"}, {"t": "p", "h": "それから、自分の線の下へ戻って、横になった。"}, {"t": "p", "h": "見ていた者たちも、それぞれ自分の線の下へ戻った。"}, {"t": "p", "h": "クスも、戻った。"}, {"t": "p", "h": "いちばん端の線の下には、だれも横にならなかった。"}, {"t": "p", "h": "表の戸が、風で、きしきしと鳴った。"}, {"t": "p", "h": "すきまから入る風は、もう冷たくなかった。"}, {"t": "p", "h": "外の明かりが、細く、壁まで届いていた。"}, {"t": "p", "h": "クスは、横になったまま、壁のほうを見た。"}, {"t": "p", "h": "<strong>割れ目の奥に、白いものが見えた。</strong>"}, {"t": "end", "h": "了"}], "chapters": [{"title": "序章　水筒", "b": 0}, {"title": "第一章　湧き水", "b": 62}, {"title": "第二章　浅瀬", "b": 219}, {"title": "第三章　天水桶", "b": 335}, {"title": "第四章　水甕", "b": 467}, {"title": "第五章　硯", "b": 610}, {"title": "終章　雪解け", "b": 705}]};

(function drawRuler(){

  let s = '';

    const n = DATA.chapters.length, gap = 4, w = (284 - gap*(n-1))/n;
    for(let i=0;i<n;i++){
      const x = 8 + i*(w+gap);
      s += `<rect class="win" id="win${i}" x="${x.toFixed(1)}" y="7" width="${w.toFixed(1)}" height="13" rx="1.5"/>`;
    }
    s += '<g id="finalmark" style="display:none"></g><g id="mark" style="display:none"></g>';

    for(let i=0;i<DATA.chapters.length;i++){

    }
    s += '<g id="finalmark" style="display:none"></g><g id="mark" style="display:none"></g>';
  } else if(MOTIF==='route'){
    s += '<line class="rulerline" x1="8" y1="20" x2="292" y2="20" stroke-dasharray="5 5"/>';
    for(let i=0;i<=5;i++){
      const x = 8 + (284*i/5);

/* ---------- しおり ---------- */
const BM_KEY = 'shiori:' + DATA.title;
DATA.blocks.forEach((b,i)=>{ b.src=i; });
let bm = null;
try{ const v = localStorage.getItem(BM_KEY); bm = v ? JSON.parse(v) : null; }catch(e){ bm = null; }
function saveBm(){ try{ if(bm) localStorage.setItem(BM_KEY, JSON.stringify(bm)); else localStorage.removeItem(BM_KEY); }catch(e){} }
function anchorOf(p){
  const pg = pages[p]; if(!pg) return null;
  for(const b of pg){ if(b && b.src!=null) return {s:b.src, p:b.part||0}; }
  if(pg[0] && pg[0].t==='toc') return {toc:true};
  return null;
}
function pageOfAnchor(a){
  if(!a) return -1;
  if(a.toc) return pages.findIndex(pg=>pg[0] && pg[0].t==='toc');
  for(let p=1;p<pages.length;p++) for(const b of pages[p]) if(b && b.src===a.s && (b.part||0)>=a.p) return p;
  for(let p=1;p<pages.length;p++) for(const b of pages[p]) if(b && b.src!=null && b.src>=a.s) return p;
  return -1;
}
function visiblePages(){ return (spread && idx>0) ? [idx, idx+1] : [idx]; }
function toggleBm(){
  const bp = pageOfAnchor(bm), vis = visiblePages();
  if(bm && vis.indexOf(bp)>=0){ bm = null; }
  else { const a = anchorOf(idx); if(!a) return; bm = a; }
  saveBm(); update(0);
}
function goBm(){ const p = pageOfAnchor(bm); if(p<0) return; idx = p; closeSheets(); update(1); }
function renderToc(host){
  const w = document.createElement('div'); w.className='tocpage';
  w.innerHTML = '<h2>目次</h2>';
  DATA.chapters.forEach((c,i)=>{
    const parts = c.title.split('\u3000');
    const row = document.createElement('div'); row.className='ti';
    const b = document.createElement('button'); b.className='tb'; b.type='button';
    b.setAttribute('aria-label', c.title.replace('\u3000',' ')+'へ移動');
    b.innerHTML = '<span class="n">'+parts[0]+'</span><span class="t">'+(parts[1]||'')+'</span>';
    b.onclick = (e)=>{ e.stopPropagation(); idx = chapPage[i]||1; update(1); };
    row.appendChild(b);
    row.insertAdjacentHTML('beforeend','<span class="d" aria-hidden="true"></span><span class="p" aria-hidden="true">'+(chapPage[i]||'')+'</span>');
    w.appendChild(row);
  });
  host.appendChild(w);
  let fs = 1;
  w.style.fontSize = fs+'em';
  const page = host.closest('.page');
  const fits = ()=>{ const r=w.getBoundingClientRect(), pr=page.getBoundingClientRect(); return vertical ? r.left >= pr.left+8 && w.scrollHeight<=w.clientHeight+2 : r.bottom <= pr.bottom-8; };
  let guard=0;
  while(!fits() && fs>0.5 && guard++<20){ fs -= 0.05; w.style.fontSize = fs.toFixed(2)+'em'; }
}

/* ---------- blocks -> DOM ---------- */
function makeEl(b){
  let el;
  if(b.t==='h2'){ el=document.createElement('h2'); el.innerHTML=b.h; }
  else if(b.t==='quote'){ el=document.createElement('blockquote'); el.innerHTML=b.h; }
  else if(b.t==='sep'){ el=document.createElement('div'); el.className='sep'; el.innerHTML=SEPSVG; }
  else if(b.t==='opener'){ el=document.createElement('div'); el.className='opener'; const im=document.createElement('img'); im.src=IMGS[b.i]; im.alt=b.alt.replace('\u3000',' '); el.appendChild(im); }
  else if(b.t==='end'){ el=document.createElement('p'); el.className='endmark'; el.textContent=b.h; }
  else if(b.t==='next'){ el=document.createElement('div'); el.className='nextnav'; el.innerHTML=b.h; }
  else { el=document.createElement('p'); el.innerHTML=b.h; }
  return el;
}
function contentBox(el){
  const r = el.getBoundingClientRect(), cs = getComputedStyle(el);
  return {
    left:   r.left   + parseFloat(cs.paddingLeft   || 0),
    right:  r.right  - parseFloat(cs.paddingRight  || 0),
    top:    r.top    + parseFloat(cs.paddingTop    || 0),
    bottom: r.bottom - parseFloat(cs.paddingBottom || 0)
  };
}
/* scrollWidth is unreliable in vertical-rl (content overflows leftward),
   so compare the last child's far edge with the page's content box. */
function over(el){
  const kids = el.children;
  if(!kids.length) return false;
  const box = contentBox(el);
  const k = kids[kids.length-1], r = k.getBoundingClientRect(), ks = getComputedStyle(k);
  return vertical
    ? (r.left - parseFloat(ks.marginLeft || 0)) < box.left - 0.5
    : (r.bottom + parseFloat(ks.marginBottom || 0)) > box.bottom + 0.5;
}
function splitText(t){
  const out=[]; let cur='';
  for(let i=0;i<t.length;i++){
    cur+=t[i];
    if('。！？」'.indexOf(t[i])>=0 && cur.length>=40){ out.push(cur); cur=''; }
  }
  if(cur) out.push(cur);
  return out.length?out:[t];
}

/* ---------- pagination ---------- */
function paginate(){
  const m = document.getElementById('measure'), mc = document.getElementById('mcol');
  const ref = document.getElementById('pageA').getBoundingClientRect();
  m.className='page';
  m.style.width = ref.width+'px';
  m.style.height = ref.height+'px';
  mc.innerHTML='';

  pages = [[{t:'cover'}],[{t:'toc'}]];
  chapPage = [];
  let cur = [];
  const push = ()=>{ if(cur.length){ pages.push(cur); cur=[]; } mc.innerHTML=''; };

  const esc = t => t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const drop = el => { if(el && el.parentNode) el.parentNode.removeChild(el); };

  // 1ページに単独で収まらない塊を、収まる単位に割って順番どおり流しこむ
  const flowSplit = (b)=>{
    let part = 0;
    if(b.t==='quote'){                    // 手紙は行単位で分ける
      const trim = a=>{ const c=a.slice();
        while(c.length && c[0]==='') c.shift();
        while(c.length && c[c.length-1]==='') c.pop();
        return c; };
      const lines = b.h.split('<br>');
      let buf=[], node=null;
      for(const ln of lines){
        const trial = buf.concat([ln]);
        drop(node);
        node = makeEl({t:'quote', h: trim(trial).join('<br>')});
        mc.appendChild(node);
        if(over(mc) && trim(buf).length){
          drop(node);
          cur.push({t:'quote', h: trim(buf).join('<br>'), src:b.src, part:part++});
          push();
          buf = (ln==='') ? [] : [ln];
          node = buf.length ? makeEl({t:'quote', h: ln}) : null;
          if(node) mc.appendChild(node);
        } else {
          buf = trial;
        }
      }
      if(trim(buf).length) cur.push({t:'quote', h: trim(buf).join('<br>'), src:b.src, part:part++});
      return;
    }
    for(const c of splitText(makeEl(b).textContent)){   // 段落は文単位で分ける
      const blk = {t:'p', h: esc(c), src:b.src, part:part++};
      let node = makeEl(blk);
      mc.appendChild(node);
      if(over(mc) && cur.length){ drop(node); push(); node = makeEl(blk); mc.appendChild(node); }
      cur.push(blk);
    }
  };

  const feed = (b, chIndex)=>{
    if(b.t==='opener'){ push(); if(chIndex!=null) chapPage[chIndex]=pages.length; pages.push([b]); mc.innerHTML=''; return; }
    const el = makeEl(b);
    mc.appendChild(el);
    if(over(mc)){
      mc.removeChild(el);
      if(cur.length) push();
      mc.appendChild(el);
      if(over(mc)){                       // ページ丸ごと使っても収まらない
        mc.removeChild(el);
        if(chIndex!=null) chapPage[chIndex] = pages.length;
        flowSplit(b);
        return;
      }
    }
    if(chIndex!=null) chapPage[chIndex] = pages.length;
    cur.push(b);
  };

  const chStart = {};
  DATA.chapters.forEach((c,i)=>{ chStart[c.b]=i; });
  DATA.blocks.forEach((b,i)=> feed(b, chStart[i]!=null?chStart[i]:null));
  push();

  // verify: re-measure every page and move any spilled block to the next one
  for(let p=1;p<pages.length;p++){
    if(pages[p][0] && (pages[p][0].t==='toc' || pages[p][0].t==='opener')) continue;
    mc.innerHTML='';
    const keep=[]; const spill=[];
    for(const b of pages[p]){
      if(spill.length){ spill.push(b); continue; }
      const el=makeEl(b); mc.appendChild(el);
      if(over(mc) && keep.length){ mc.removeChild(el); spill.push(b); }
      else keep.push(b);
    }
    if(spill.length){
      pages[p]=keep;
      pages.splice(p+1,0,spill);
      for(let c=0;c<chapPage.length;c++) if(chapPage[c]>p) chapPage[c]++;
    }
  }
  mc.innerHTML='';
  if(pages.length%2===0 && spread) pages.push([{t:'blank'}]);
}

/* ---------- render ---------- */
function renderPage(hostPage, page){
  const host = hostPage.querySelector('.col');
  host.innerHTML='';
  hostPage.classList.remove('blank');
  if(!page){ hostPage.classList.add('blank'); return; }
  if(page[0] && page[0].t==='cover'){
    host.innerHTML = '<div class="opener cov" style="background:#e0d8c4"><div class="covbg t" style="background-image:url('+COVER+')"></div><div class="covbg b" style="background-image:url('+COVER+')"></div><img alt="'+DATA.title+'　'+DATA.sub+'" src="'+COVER+'"></div>';
    setTimeout(fitCov,0);
    return;
  }
  if(page[0] && page[0].t==='blank'){ hostPage.classList.add('blank'); return; }
  if(page[0] && page[0].t==='toc'){ renderToc(host); return; }
  page.forEach(b=> host.appendChild(makeEl(b)));
}

function update(dir){
  const A=document.getElementById('pageA'), B=document.getElementById('pageB');
  if(spread && idx>0 && idx%2===0) idx--;
  idx = Math.max(0, Math.min(pages.length-1, idx));

  if(spread && idx>0){ renderPage(A,pages[idx]); renderPage(B,pages[idx+1]); }
  else { renderPage(A,pages[idx]); renderPage(B,null); }

  if(dir){
    const dx = (dir>0 ? (vertical?-14:14) : (vertical?14:-14))+'px';
    [A,B].forEach(el=>{ el.style.setProperty('--dx',dx); el.classList.remove('flip'); void el.offsetWidth; el.classList.add('flip'); });
  }

  const bp = pageOfAnchor(bm), vis = visiblePages();
  A.classList.toggle('marked', bm!=null && bp===vis[0]);
  B.classList.toggle('marked', bm!=null && vis.length>1 && bp===vis[1]);
  const here = bm!=null && vis.indexOf(bp)>=0;
  const bb = document.getElementById('bmBtn');
  bb.setAttribute('aria-pressed', String(here));
  bb.disabled = (idx===0 && !spread) || (idx===0);
  bb.setAttribute('aria-label', here ? 'しおりを外す' : 'このページにしおりをはさむ');
  document.getElementById('bmJump').hidden = !(bm && bp>0 && !here);
  const bi = document.getElementById('bmItem');
  bi.hidden = !(bm && bp>0);
  if(bp>0) bi.textContent = 'しおりのページへ（' + bp + '）';
  const last = pages.length-1;
  try{ if(idx===last && last>0) localStorage.setItem('done:'+DATA.title,'1'); }catch(e){}
  const prog = last>0 ? idx/last : 0;
  document.getElementById('mark').setAttribute('transform','translate('+(8+284*prog)+',0)');
  document.getElementById('finalmark').classList.toggle('show', idx===last);
  if(MOTIF==='foot'){
    const svgEl = document.getElementById('rulerSvg');
    const ruler = svgEl.parentNode;
    let layer = document.getElementById('fpLayer');
    if(!layer){
      layer = document.createElement('div'); layer.id = 'fpLayer';
      ruler.style.position = 'relative'; ruler.appendChild(layer);
    }
    const rb = ruler.getBoundingClientRect(), sb = svgEl.getBoundingClientRect();
    const W = Math.round(sb.width), L = Math.round(sb.left - rb.left);
    layer.style.left = L+'px'; layer.style.width = W+'px';
    const FW = 15, N = Math.max(8, Math.min(40, Math.floor(W/24)));
    if(layer.dataset.n != String(N) || layer.dataset.w != String(W)){
      let h = '';
      for(let i=0;i<N;i++){
        const x = (W-FW)*i/(N-1), y = (i%2) ? 12 : 3;
        h += `<svg class="fp" id="fp${i}" style="left:${x.toFixed(1)}px;top:${y}px" width="15" height="9" viewBox="0 0 15 9"><ellipse cx="9.6" cy="4.5" rx="4.3" ry="3.2"/><ellipse cx="2.7" cy="4.5" rx="2.3" ry="2.2"/></svg>`;
      }
      layer.innerHTML = h; layer.dataset.n = String(N); layer.dataset.w = String(W);
    }
    const shown = Math.max(1, Math.round(prog*(N-1))+1);
    for(let i=0;i<N;i++){
      const el = document.getElementById('fp'+i); if(!el) continue;
      el.classList.toggle('on', i < shown);
    }
    const rn = ruler.querySelector('.rn');
    if(rn) rn.textContent = idx===0 ? '' : ((chapPage[3]!=null && idx>=chapPage[3]) ? '十八' : '十九');
    let wall = document.getElementById('fpWall');
    if(!wall){ wall = document.createElement('div'); wall.id = 'fpWall'; layer.appendChild(wall); }
    wall.style.display = (chapPage[4]!=null && idx>=chapPage[4]) ? '' : 'none';
    DATA.chapters.forEach((c,i)=>{
      const t = document.getElementById('ct'+i); if(!t) return;
      if(chapPage[i]==null || last<=0 || i===0){ t.style.display='none'; return; }
      const x = (8 + 284*(chapPage[i]/last)).toFixed(1);
      t.setAttribute('x1',x); t.setAttribute('x2',x); t.style.display='';
      t.classList.toggle('past', chapPage[i] <= idx);
    });
  }
  if(MOTIF==='rooms'){
    let cur = 0;
    DATA.chapters.forEach((c,i)=>{ if(chapPage[i]!=null && chapPage[i] <= idx) cur = i; });
    DATA.chapters.forEach((c,i)=>{
      const el = document.getElementById('win'+i); if(!el) return;
      const off = (idx===last) || i < cur;
      el.classList.toggle('off', off);
      el.classList.toggle('now', !off && i===cur && idx>0);
    });
  }

  let name='';
  for(let i=0;i<DATA.chapters.length;i++){ if(chapPage[i]!=null && chapPage[i]<=idx) name=DATA.chapters[i].title; }
  document.getElementById('chapNow').textContent = idx===0 ? '' : name;
  document.getElementById('pageNow').textContent = idx===0 ? '表紙' : (idx + ' / ' + last);
  document.querySelectorAll('.toc-item').forEach(el=>{
    el.setAttribute('aria-current', String(Number(el.dataset.p)<=idx && (Number(el.dataset.next)>idx || el.dataset.next==='')));
  });
}

function go(step){ const n=idx+step*(spread&&idx>0?2:1); if(n<0||n>pages.length-1) return; idx=n; update(step); }
function next(){ go(1); } function prev(){ go(-1); }

/* ---------- column fitting ---------- */
function fitColumn(){
  const pa = document.getElementById('pageA'), cs = getComputedStyle(pa);
  const avail = vertical
    ? pa.clientHeight - parseFloat(cs.paddingTop)  - parseFloat(cs.paddingBottom)
    : pa.clientWidth  - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const n = CHARS[sizeIdx];
  let fs = Math.min(SIZES[sizeIdx], avail / (n * KERN));
  fs = Math.max(12.5, fs);
  const colw = Math.min(avail, Math.floor(fs * n * KERN));
  document.documentElement.style.setProperty('--fs', fs.toFixed(2)+'px');
  document.documentElement.style.setProperty('--colw', colw+'px');
}

/* ---------- layout ---------- */
function layout(keepBlock){
  spread = window.innerWidth >= 940 && window.innerHeight >= 420;
  document.body.classList.toggle('spread', spread);
  document.body.classList.toggle('vert', vertical);
  document.documentElement.style.setProperty('--fs', SIZES[sizeIdx]+'px');
  document.documentElement.style.setProperty('--lh', vertical? '1.95' : '2.05');
  requestAnimationFrame(()=>{
    fitColumn();
    paginate();
    if(keepBlock!=null){
      let found=0;
      for(let p=1;p<pages.length;p++){ if(pages[p].some(b=>b===keepBlock)){ found=p; break; } }
      idx = found || Math.min(idx, pages.length-1);
    }
    buildToc();
    update(0);
  });
}
function currentBlock(){ const p=pages[idx]; return p && p[0] && p[0].t!=='cover' ? p[0] : null; }

/* ---------- toc ---------- */
function buildToc(){
  const list=document.getElementById('tocList');
  list.innerHTML='';
  DATA.chapters.forEach((c,i)=>{
    const b=document.createElement('button');
    b.className='toc-item'; b.dataset.p=chapPage[i]||1;
    b.dataset.next = (chapPage[i+1]!=null? chapPage[i+1] : '');
    b.innerHTML='<span>'+c.title+'</span><span class="pg">'+(chapPage[i]||1)+'</span>';
    b.onclick=()=>{ idx=chapPage[i]||1; closeSheets(); update(1); };
    list.appendChild(b);
  });
}

/* ---------- sheets ---------- */
function closeSheets(){ document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('open')); }
try{ if(!/claude\.ai$/i.test(location.hostname) && !/^blob:/.test(location.href)) document.getElementById('homeLink').hidden=false; }catch(e){}
document.getElementById('bmBtn').onclick=toggleBm;
document.getElementById('bmJump').onclick=goBm;
document.getElementById('bmItem').onclick=goBm;
document.getElementById('tocBtn').onclick=()=>document.getElementById('tocSheet').classList.add('open');
document.getElementById('setBtn').onclick=()=>document.getElementById('setSheet').classList.add('open');
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheets);
document.querySelectorAll('.sheet').forEach(s=>s.addEventListener('click',e=>{ if(e.target===s) closeSheets(); }));

document.getElementById('dirSeg').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  const keep=currentBlock();
  vertical = b.dataset.dir==='v';
  document.querySelectorAll('#dirSeg button').forEach(x=>x.setAttribute('aria-pressed', String(x===b)));
  layout(keep);
};
document.getElementById('sizeSeg').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  const keep=currentBlock();
  sizeIdx=Number(b.dataset.size);
  document.querySelectorAll('#sizeSeg button').forEach(x=>x.setAttribute('aria-pressed', String(x===b)));
  layout(keep);
};

/* ---------- input ---------- */
/* 目次ページの項目がページ送りの領域の下にあっても押せるようにする */
function tocHit(e){
  if(!e || (!e.clientX && !e.clientY)) return false;
  const zs=document.querySelectorAll('.zone'); zs.forEach(z=>z.style.pointerEvents='none');
  const el=document.elementFromPoint(e.clientX,e.clientY);
  zs.forEach(z=>z.style.pointerEvents='');
  const t=el && el.closest ? el.closest('.tocpage .tb') : null;
  if(t){ t.click(); return true; }
  return false;
}
document.getElementById('zoneL').onclick=e=>{ if(tocHit(e)) return; vertical? next() : prev(); };
document.getElementById('zoneR').onclick=e=>{ if(tocHit(e)) return; vertical? prev() : next(); };
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') vertical?prev():next();
  else if(e.key==='ArrowLeft') vertical?next():prev();
  else if(e.key===' '||e.key==='ArrowDown'){ e.preventDefault(); next(); }
  else if(e.key==='ArrowUp') prev();
  else if(e.key==='Escape') closeSheets();
});
let tx=0,ty=0;
const bookEl=document.getElementById('book');
bookEl.addEventListener('touchstart',e=>{ tx=e.changedTouches[0].clientX; ty=e.changedTouches[0].clientY; },{passive:true});
bookEl.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)<44 || Math.abs(dx)<Math.abs(dy)) return;
  if(dx<0) vertical?prev():next(); else vertical?next():prev();
},{passive:true});

let rt;
window.addEventListener('resize',()=>{ clearTimeout(rt); const keep=currentBlock(); rt=setTimeout(()=>layout(keep),180); });

if(document.fonts && document.fonts.ready){ document.fonts.ready.then(()=>layout(null)); }
layout(null);

/* 表紙の余白を、表紙の端の色でつなぐ（上下か左右かを画面の形で判定） */
function fitCov(){
  document.querySelectorAll('.opener.cov').forEach(function(op){
    var im=op.querySelector('img'); if(!im) return;
    var set=function(){
      var W=op.clientWidth, H=op.clientHeight; if(!W||!H) return;
      var r=(im.naturalWidth||600)/(im.naturalHeight||960);
      var lr = (W/H) > r;
      op.classList.toggle('lr', lr);
    };
    if(im.complete) set(); else im.addEventListener('load', set, {once:true});
  });
}
window.addEventListener('resize', function(){ setTimeout(fitCov, 250); });

/* shioriAuto: トップページからの「しおりの続きから」 */
if(/[?&]shiori=1/.test(location.search)){
  var _try=function(n){
    try{
      if(bm){ var p=pageOfAnchor(bm); if(p>0){ idx=p; update(0); return; } }
    }catch(e){}
    if(n>0) setTimeout(function(){ _try(n-1); }, 300);
  };
  setTimeout(function(){ _try(6); }, 300);
}
