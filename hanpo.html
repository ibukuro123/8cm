<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>半歩</title>
<meta name="description" content="年に一度、北の町の角に立つ男がいる。自分を忘れた相手に、名乗るために。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="『8センチメートル』シリーズ">
<meta property="og:title" content="半歩｜片方の靴">
<meta property="og:description" content="年に一度、北の町の角に立つ男がいる。自分を忘れた相手に、名乗るために。">
<meta property="og:url" content="https://ibukuro123.github.io/8cm/hanpo.html">

<style>
  :root{
    --paper:#e3ddcb;
    --paper-deep:#d6cfba;
    --edge:#c2b9a0;
    --ink:#2b2722;
    --ink-soft:#6d6557;
    --pencil:#4d5157;
    --shu:#a8402c;
    --fs:17px;
    --lh:2.05;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    background:#b9b09a;
    background-image:
      radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.18), transparent 60%),
      repeating-linear-gradient(102deg, rgba(0,0,0,.025) 0 2px, transparent 2px 5px);
    color:var(--ink);
    font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP","Songti SC",serif;
    overflow:hidden;
    -webkit-text-size-adjust:100%;
  }
  #app{height:100dvh;display:flex;flex-direction:column;}

  /* ---- top bar ---- */
  .bar{
    flex:0 0 auto;display:flex;align-items:center;gap:14px;
    padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
  }
  .bar button{
    font:inherit;font-size:13px;letter-spacing:.14em;
    background:none;border:none;color:#4a4335;padding:6px 2px;cursor:pointer;
  }
  .bar button:focus-visible{outline:1.5px solid var(--shu);outline-offset:3px;}

  /* ---- ruler ---- */
  .ruler{flex:1 1 auto;display:flex;align-items:flex-end;gap:6px;height:26px;}
  .ruler .rn{font-size:11px;color:#5c5343;line-height:1;padding-bottom:3px;}
  .ruler svg{flex:1 1 auto;width:100%;height:100%;display:block;overflow:visible;}
  .rulerline{stroke:#5c5343;stroke-width:1;}
  .tick{stroke:#5c5343;stroke-width:1;}
  .tick.mm{stroke:#5c5343;opacity:.45;}
  .num{fill:#5c5343;font-size:9px;font-family:inherit;}
  #mark{transition:transform .35s cubic-bezier(.3,.7,.3,1);}
  #mark line{stroke:var(--pencil);stroke-width:2;stroke-linecap:round;}
  #mark text{fill:var(--pencil);font-size:8.5px;letter-spacing:.06em;}
  #finalmark{opacity:0;}
  #finalmark line{stroke:var(--shu);stroke-width:2.4;stroke-linecap:round;}
  #finalmark text{fill:var(--shu);font-size:9px;}
  #finalmark.show{opacity:1;animation:scratch .7s ease-out;}
  @keyframes scratch{from{clip-path:inset(0 0 100% 0);}to{clip-path:inset(0 0 0 0);}}

  /* ---- book ---- */
  #book{flex:1 1 auto;position:relative;padding:0 10px 4px;min-height:0;}
  .spread{
    height:100%;display:flex;gap:0;justify-content:center;
    filter:drop-shadow(0 10px 22px rgba(60,50,30,.32));
  }
  body.vert .spread{flex-direction:row-reverse;}
  .page{
    position:relative;flex:1 1 0;min-width:0;height:100%;max-width:640px;
    background:var(--paper);
    background-image:
      radial-gradient(ellipse at 20% 12%, rgba(255,255,255,.5), transparent 55%),
      radial-gradient(ellipse at 85% 90%, rgba(150,130,90,.18), transparent 60%);
    padding:26px 20px calc(22px + env(safe-area-inset-bottom));
    overflow:hidden;
    font-size:var(--fs);line-height:var(--lh);
    letter-spacing:.03em;
    text-align:justify;
  }
  body.vert .page{writing-mode:vertical-rl;text-orientation:mixed;text-align:start;}
  .col{inline-size:var(--colw,100%);block-size:100%;margin-inline:auto;}
  .page.blank{background:var(--paper-deep);}
  #pageB{display:none;}
  body.spread #pageB{display:block;}
  body.spread #pageA{box-shadow:inset -14px 0 22px -16px rgba(90,72,40,.55);}
  body.spread #pageB{box-shadow:inset 14px 0 22px -16px rgba(90,72,40,.55);}
  body.spread.vert #pageA{box-shadow:inset 14px 0 22px -16px rgba(90,72,40,.55);}
  body.spread.vert #pageB{box-shadow:inset -14px 0 22px -16px rgba(90,72,40,.55);}

  .flip{animation:flip .26s ease;}
  @keyframes flip{from{opacity:.15;transform:translateX(var(--dx,10px));}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){
    .flip{animation:none;} #mark{transition:none;} #finalmark.show{animation:none;}
  }

  /* ---- text blocks ---- */
  .page p{margin:0;text-indent:1em;}
  .page p + p{margin-top:0;}
  body.vert .page p{text-indent:1em;}
  .page h2{
    margin:0 0 1.6em;font-size:1.22em;font-weight:600;letter-spacing:.22em;
    line-height:1.7;text-indent:0;
  }
  body:not(.vert) .page h2{border-bottom:1px solid rgba(90,80,60,.28);padding-bottom:.5em;}
  body.vert .page h2{border-left:1px solid rgba(90,80,60,.28);padding-left:.5em;margin:0 0 1.6em 0;}
  .page blockquote{
    margin:1.2em .4em;padding:0 1em;color:#4b4335;font-size:.94em;
    border-left:2px solid rgba(120,100,60,.4);
  }
  body.vert .page blockquote{
    margin:.4em 1.2em;padding:1em 0;border-left:none;
    border-top:2px solid rgba(120,100,60,.4);
  }
  .sep{margin:1.5em auto;width:34%;height:0;border-top:1px solid rgba(90,80,60,.3);}
  body.vert .sep{margin:auto 1.5em;height:34%;width:0;border-top:none;border-left:1px solid rgba(90,80,60,.3);}
  .endmark{margin:2em 0 0;text-align:center;letter-spacing:.6em;color:var(--ink-soft);text-indent:0;}
  strong{font-weight:700;}
  body.vert strong{
    text-emphasis:filled dot var(--ink);-webkit-text-emphasis:filled dot var(--ink);
    font-weight:inherit;
  }
  em{font-style:normal;color:var(--ink-soft);}

  /* ---- cover ---- */
  .cover{display:flex;align-items:center;justify-content:center;height:100%;max-height:100%;}
  .cover-in{text-align:center;max-width:100%;}
  body.vert .cover-in{writing-mode:vertical-rl;height:100%;max-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;}
  .cover h1{
    margin:0;font-size:min(6.6vh,8.2vw,50px);font-weight:400;
    letter-spacing:.22em;line-height:1.45;text-indent:0;
  }
  body.vert .cover h1{max-height:100%;}
  .cover .sub{margin-top:1.4em;font-size:.86em;letter-spacing:.34em;color:var(--ink-soft);}
  body.vert .cover .sub{margin:1.4em 0 0;}
  .cover .pillar{margin-top:2.2em;}
  body.vert .cover .pillar{margin:2.2em 0 0;}
  .cover .pillar svg{max-height:22vh;}

  /* ---- tap zones + footer ---- */
  .zone{position:absolute;top:0;bottom:0;width:34%;border:none;background:none;cursor:pointer;padding:0;}
  .zone.l{left:0;} .zone.r{right:0;}
  .zone:focus-visible{outline:1.5px dashed var(--shu);outline-offset:-6px;}
  .foot{
    flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;
    padding:8px 18px calc(env(safe-area-inset-bottom) + 8px);
    font-size:11.5px;letter-spacing:.14em;color:#514936;
  }
  .foot span{opacity:.85;}

  /* ---- sheets ---- */
  .sheet{
    position:fixed;inset:0;z-index:20;display:none;
    background:rgba(40,34,24,.5);backdrop-filter:blur(2px);
  }
  .sheet.open{display:block;}
  .sheet-in{
    position:absolute;left:0;right:0;bottom:0;max-height:76%;overflow:auto;
    background:var(--paper);padding:22px 22px calc(env(safe-area-inset-bottom) + 26px);
    border-radius:2px 2px 0 0;
  }
  .sheet h3{margin:0 0 16px;font-size:14px;letter-spacing:.24em;font-weight:600;color:#4a4335;}
  .toc-item{
    display:flex;justify-content:space-between;gap:14px;width:100%;
    font:inherit;font-size:15px;text-align:left;background:none;border:none;
    padding:11px 0;border-bottom:1px solid rgba(90,80,60,.18);color:var(--ink);cursor:pointer;
  }
  .toc-item .pg{font-size:11px;color:var(--ink-soft);letter-spacing:.1em;flex:0 0 auto;}
  .toc-item[aria-current="true"]{color:var(--shu);}
  .row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid rgba(90,80,60,.18);}
  .row:last-child{border-bottom:none;}
  .row .lab{font-size:14px;letter-spacing:.1em;}
  .seg{display:flex;border:1px solid rgba(90,80,60,.4);}
  .seg button{
    font:inherit;font-size:13px;padding:7px 15px;background:none;border:none;cursor:pointer;color:#4a4335;
    border-left:1px solid rgba(90,80,60,.25);
  }
  .seg button:first-child{border-left:none;}
  .seg button[aria-pressed="true"]{background:#4a4335;color:var(--paper);}
  .close{margin-top:20px;width:100%;font:inherit;font-size:13px;letter-spacing:.2em;padding:12px;background:none;border:1px solid rgba(90,80,60,.4);cursor:pointer;color:#4a4335;}

  #measure{position:fixed;top:-99999px;left:0;visibility:hidden;pointer-events:none;}

  /* ---- 電子版デザイン ---- */
  .page .opener{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#f1ece0;writing-mode:horizontal-tb;}
  .page .opener img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;}
  .sep{display:flex;align-items:center;justify-content:center;border:none !important;margin:1.4em auto;width:auto;height:auto;}
  body.vert .sep{margin:auto 1.3em;width:auto;height:auto;}
  body:not(.vert) .sep svg{transform:rotate(-90deg);}
  body.vert .sep svg{transform:none;}

  /* ---- 目次ページ・しおり ---- */
  .bar button{white-space:nowrap;flex:0 0 auto;}
  .ruler .rn{white-space:nowrap;flex:0 0 auto;}
  .ruler{min-width:0;} .ruler svg{min-width:0;}
  .bar{gap:10px;}
  .tocpage{position:relative;z-index:3;pointer-events:none;display:flex;flex-direction:column;gap:.45em;height:100%;}
  body.vert .tocpage{padding-top:0;}
  .tocpage h2{margin:0 0 .5em;border:none !important;padding:0 !important;font-size:1.05em;letter-spacing:.5em;}
  .tocpage .ti{display:flex;align-items:center;gap:.5em;font:inherit;background:none;border:none;padding:0;margin:0;color:var(--ink);cursor:pointer;text-align:start;line-height:1.3;}
  .tocpage .tb{pointer-events:auto;display:flex;align-items:center;gap:.5em;font:inherit;background:none;border:none;padding:.1em;margin:0;color:inherit;cursor:pointer;line-height:1.3;}
  .tocpage .tb:focus-visible{outline:1.5px solid var(--shu);outline-offset:2px;}
  .tocpage .tb:active .t{color:var(--shu);}
  .tocpage .ti .n{color:var(--ink-soft);font-size:.85em;letter-spacing:.2em;flex:0 0 auto;}
  .tocpage .ti .t{flex:0 1 auto;}
  .tocpage .ti .d{flex:1 1 auto;min-width:1em;min-height:1em;border:0 dotted rgba(90,80,60,.45);}
  body:not(.vert) .tocpage .ti .d{border-bottom-width:1px;}
  body.vert .tocpage .ti .d{border-left-width:1px;}
  .tocpage .ti .p{display:inline-block;writing-mode:horizontal-tb;font-size:.72em;color:var(--ink-soft);letter-spacing:.05em;flex:0 0 auto;}
  .page.marked::after{content:"";position:absolute;top:0;right:22px;width:11px;height:48px;background:var(--shu);clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);z-index:4;pointer-events:none;}
  body.spread.vert #pageB.marked::after, body.spread:not(.vert) #pageA.marked::after{right:auto;left:22px;}
  #bmBtn[aria-pressed="true"]{color:var(--shu);}
  .foot .bmjump{font:inherit;font-size:11px;letter-spacing:.14em;background:none;border:1px solid rgba(168,64,44,.55);color:var(--shu);padding:3px 10px;cursor:pointer;margin:0 8px;}
  .foot .bmjump[hidden]{display:none;}
  .sheet .bm-item{width:100%;text-align:left;font:inherit;font-size:13px;letter-spacing:.12em;background:none;border:1px solid rgba(168,64,44,.5);color:var(--shu);padding:10px 12px;margin:0 0 14px;cursor:pointer;}
  .sheet .bm-item[hidden]{display:none;}

  #homeLink{font:inherit;font-size:inherit;letter-spacing:.14em;color:var(--ink-soft);text-decoration:none;white-space:nowrap;flex:0 0 auto;}
  #homeLink:hover,#homeLink:focus-visible{color:var(--ink);}
  #homeLink[hidden]{display:none;}
</style>
</head>
<body class="vert">
<div id="app">
  <div class="bar">
    <a id="homeLink" href="index.html" hidden>ほかの本</a>
    <button id="tocBtn" aria-haspopup="dialog">目次</button>
    <div class="ruler" aria-hidden="true">
      <span class="rn">一日目</span>
      <svg id="rulerSvg" viewBox="0 0 300 26" preserveAspectRatio="none"></svg>
      <span class="rn">十八日目</span>
    </div>
    <button id="bmBtn" aria-pressed="false" aria-label="このページにしおりをはさむ">しおり</button>
    <button id="setBtn" aria-haspopup="dialog">表示</button>
  </div>

  <div id="book">
    <div class="spread">
      <section class="page" id="pageA" aria-live="polite"><div class="col"></div></section>
      <section class="page" id="pageB"><div class="col"></div></section>
    </div>
    <button class="zone l" id="zoneL" aria-label="前後のページ"></button>
    <button class="zone r" id="zoneR" aria-label="前後のページ"></button>
  </div>

  <div class="foot">
    <span id="chapNow"></span>
    <button class="bmjump" id="bmJump" type="button" hidden>しおりへ</button>
    <span id="pageNow"></span>
  </div>
</div>

<div class="sheet" id="tocSheet" role="dialog" aria-label="目次">
  <div class="sheet-in">
    <h3>目次</h3>
    <button class="bm-item" id="bmItem" type="button" hidden>しおりのページへ</button>
    <div id="tocList"></div>
    <button class="close" data-close>閉じる</button>
  </div>
</div>

<div class="sheet" id="setSheet" role="dialog" aria-label="表示設定">
  <div class="sheet-in">
    <h3>表示</h3>
    <div class="row">
      <span class="lab">組み方</span>
      <div class="seg" id="dirSeg">
        <button data-dir="v" aria-pressed="true">縦書き</button>
        <button data-dir="h" aria-pressed="false">横書き</button>
      </div>
    </div>
    <div class="row">
      <span class="lab">文字の大きさ</span>
      <div class="seg" id="sizeSeg">
        <button data-size="0" aria-pressed="false">小</button>
        <button data-size="1" aria-pressed="true">中</button>
        <button data-size="2" aria-pressed="false">大</button>
      </div>
    </div>
    <button class="close" data-close>閉じる</button>
  </div>
</div>

<div id="measure"><div class="col" id="mcol"></div></div>

<script>
const DATA = {"title": "半歩", "sub": "片方の靴", "blocks": [{"t": "opener", "i": 0, "alt": "序章　轍"}, {"t": "p", "h": "北の町の者は、その男をアンドゥと呼んだ。"}, {"t": "p", "h": "呼ばれて、振り向く。それだけだった。本当の名を、町の者に名乗ったことはない。"}, {"t": "p", "h": "安藤直之。"}, {"t": "p", "h": "それが男の名前だった。"}, {"t": "p", "h": "知っている者は、北にも南にも、ほとんどいない。"}, {"t": "p", "h": "九年前、男は北の町の賭場の証文を握っていた。"}, {"t": "p", "h": "いまは南の町の、看板のない賭場の床に座っている。"}, {"t": "p", "h": "北の町では、男は靴の片方を売ったことになっている。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "冬の朝。"}, {"t": "p", "h": "安藤は、北の町の角に立っていた。"}, {"t": "p", "h": "南から、十八日歩いてきた。"}, {"t": "p", "h": "年に一度、夜明けの前に来て、この角に立つ。"}, {"t": "p", "h": "右の足は、裸足だった。"}, {"t": "p", "h": "道の冷たさが、足の裏からじかに上がってくる。"}, {"t": "p", "h": "車輪の音がした。"}, {"t": "p", "h": "からから、からから。軽い。一定だ。"}, {"t": "p", "h": "ラリオが角を曲がってくる。"}, {"t": "p", "h": "荷車を止める。"}, {"t": "p", "h": "安藤の前で、にこにこしている。"}, {"t": "p", "h": "一度目の冬は、アンドゥと名乗った。"}, {"t": "p", "h": "二度目の冬からは、毎年、本名を名乗った。"}, {"t": "p", "h": "返ってくる言葉は、いつも同じだった。"}, {"t": "p", "h": "<strong>「……だれ?」</strong>"}, {"t": "p", "h": "九度目だった。"}, {"t": "p", "h": "帳簿を読んで育った男は、数えるのをやめられなかった。"}, {"t": "p", "h": "ラリオは首をかしげ、また荷車を押して走りだす。"}, {"t": "p", "h": "車輪の音が遠ざかる。"}, {"t": "p", "h": "安藤は、角に残った轍を見ていた。"}, {"t": "p", "h": "それから、南へ歩きだした。"}, {"t": "opener", "i": 1, "alt": "第一章　紙の跡"}, {"t": "p", "h": "人間の二駅ぶん。"}, {"t": "p", "h": "小さき者の足で、十八日。"}, {"t": "p", "h": "安藤は、線路の脇の砂利を歩いた。"}, {"t": "p", "h": "左の足は、靴の底で石を踏む。右の足は、石の角をじかに踏む。"}, {"t": "p", "h": "八年歩いて、右の足の裏は、左の靴底と同じくらい硬くなった。"}, {"t": "p", "h": "背中の袋は軽い。"}, {"t": "p", "h": "砂糖粒が二十と少し。すり切れた毛布。"}, {"t": "p", "h": "それから袋の底に、布でくるんだものがひとつ。"}, {"t": "p", "h": "安藤は、それを道中で一度も出さなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "南の町の賭場には、看板がない。"}, {"t": "p", "h": "人間の酒屋の裏、空き瓶の箱の隙間の奥にある。"}, {"t": "p", "h": "空き缶の底を伏せた台が一つ。客は多くて五人。"}, {"t": "p", "h": "十八日ぶりに座っても、胴元は顔を上げなかった。"}, {"t": "p", "h": "安藤は、そういう客だった。"}, {"t": "p", "h": "札が配られる。"}, {"t": "p", "h": "安藤は砂糖粒を三つ置く。"}, {"t": "p", "h": "札をめくる。はずれ。"}, {"t": "p", "h": "三つの粒が、胴元の箱に落ちる。"}, {"t": "p", "h": "隣に、若い客が座っていた。"}, {"t": "p", "h": "指先で札の端をいじっている。まばたきが多い。"}, {"t": "p", "h": "砂糖粒を置いた手が、置いたあとで一度、戻りかける。"}, {"t": "p", "h": "安藤には分かった。"}, {"t": "p", "h": "この客は今夜、持っているものを全部置いていく。"}, {"t": "p", "h": "見抜いたわけではない。"}, {"t": "p", "h": "九年、同じ側に座ってきた。それだけだ。"}, {"t": "p", "h": "安藤は湯のみを持ち上げる。"}, {"t": "p", "h": "水面に、自分の顔が映る。"}, {"t": "p", "h": "同じ顔だった。"}, {"t": "p", "h": "<strong>負ける側の顔は、どれも同じだった。</strong>"}, {"t": "p", "h": "若い客のほうへ、口を開きかける。"}, {"t": "p", "h": "閉じる。"}, {"t": "p", "h": "渡せる言葉を、安藤は持っていなかった。"}, {"t": "p", "h": "夜が更けた。"}, {"t": "p", "h": "若い客の前から、粒が一つずつ消えていく。"}, {"t": "p", "h": "最後の一粒を置くとき、客は笑っていた。"}, {"t": "p", "h": "「次は来る。流れが来てる」"}, {"t": "p", "h": "来なかった。"}, {"t": "p", "h": "客は立ち上がり、箱の隙間から出ていった。"}, {"t": "p", "h": "安藤は、その背中を見ていた。"}, {"t": "p", "h": "胴元の席にいたころは、背中を見なかった。"}, {"t": "p", "h": "見ていたのは、帳簿の数字だけだった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "夜。"}, {"t": "p", "h": "空き瓶の箱の陰に、新聞紙を敷いて横になる。"}, {"t": "p", "h": "目を閉じると、十八日前の車輪の音が戻ってくる。"}, {"t": "p", "h": "ラリオは、角で速さを落とさない。"}, {"t": "p", "h": "右の足から曲がる。"}, {"t": "p", "h": "排水口の格子をまたぐときだけ、歩幅が一つ短くなる。"}, {"t": "p", "h": "地図は、頭から消えた。"}, {"t": "p", "h": "それでも足は、一度も曲がり角を間違えない。"}, {"t": "p", "h": "書いた字を消しても、紙に跡が残る。"}, {"t": "p", "h": "安藤は、それを知っていた。"}, {"t": "p", "h": "頭には、残らなかった。"}, {"t": "p", "h": "本名で名乗っても、残らなかった。"}, {"t": "p", "h": "でも、足には。"}, {"t": "p", "h": "安藤は起き上がった。"}, {"t": "p", "h": "袋の底から、布でくるんだものを取り出す。"}, {"t": "p", "h": "ほどく。"}, {"t": "p", "h": "右の靴だった。"}, {"t": "p", "h": "八年前、売ったことになっている靴だった。"}, {"t": "opener", "i": 2, "alt": "第二章　縫い目"}, {"t": "p", "h": "靴は、人間の革手袋の指先から作った。"}, {"t": "p", "h": "九年前、北の町を追われた夜に持ち出したのは、三つだけだった。"}, {"t": "p", "h": "上着。指の輪。革手袋の切れはし。"}, {"t": "p", "h": "上着は南で売った。指の輪も売った。"}, {"t": "p", "h": "革手袋だけは、売らなかった。"}, {"t": "p", "h": "売っても、たいした粒にならない。安藤は、そう自分に言った。"}, {"t": "p", "h": "南の賭場の隅で、切れはしを縫った。"}, {"t": "p", "h": "針は、人間の裁縫箱から落ちたものを拾った。"}, {"t": "p", "h": "糸の端を舐めて、穴に通すのに、半日かかった。"}, {"t": "p", "h": "指が震えた。"}, {"t": "p", "h": "帳簿を繰る指だった。契約書に判を押させる指だった。"}, {"t": "p", "h": "その指が、糸一本を穴に通せなかった。"}, {"t": "p", "h": "<strong>紙しか触ってこなかった男の、はじめての手仕事だった。</strong>"}, {"t": "p", "h": "縫い上がるまでに、冬がひとつ過ぎた。"}, {"t": "p", "h": "できたのは、不格好な靴が一足。"}, {"t": "p", "h": "右の甲のところに、縫い直した跡が三本、横に走っていた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "八年前の冬。"}, {"t": "p", "h": "安藤は、その靴を履いて、北へ歩いた。"}, {"t": "p", "h": "十八日かけて、ラリオの前に立った。"}, {"t": "p", "h": "名乗った。"}, {"t": "p", "h": "「……だれ?」と返された。"}, {"t": "p", "h": "帰り道の九日目、安藤は右の靴を脱いだ。"}, {"t": "p", "h": "理由は、自分でも分からなかった。"}, {"t": "p", "h": "ただ、履いたまま南へ帰るのが、できなかった。"}, {"t": "p", "h": "片方だけ袋に入れて、片足裸足で残りの九日を歩いた。"}, {"t": "p", "h": "南の賭場に戻ると、誰かが言った。"}, {"t": "p", "h": "「靴、売ったのか」"}, {"t": "p", "h": "安藤は、答えなかった。"}, {"t": "p", "h": "<strong>弁解を、この男はしない。</strong>"}, {"t": "p", "h": "噂は北へも流れた。"}, {"t": "p", "h": "北の町では、アンドゥは落ちぶれて靴を売った男になった。"}, {"t": "p", "h": "安藤は、それも正さなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "そして八年。"}, {"t": "p", "h": "靴は、袋の底にあり続けた。"}, {"t": "p", "h": "安藤は、布をほどいた手を止めた。"}, {"t": "p", "h": "縫い直した跡が三本。"}, {"t": "p", "h": "この縫い方を知っている者は、北の町に一人だけいる。"}, {"t": "p", "h": "賭場の走り屋だったころ、荷の破れを縫っていた男だ。"}, {"t": "p", "h": "あの男は、胴元の靴を三度直した。"}, {"t": "p", "h": "安藤は、その手元を、三度とも見ていた。"}, {"t": "p", "h": "安藤は、そこまで考えて、目を閉じた。"}, {"t": "p", "h": "知られてもかまわない。"}, {"t": "p", "h": "知られたところで、伝わる相手がいない。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "夜が明ける前に、安藤は立ち上がった。"}, {"t": "p", "h": "胴元のところへ行き、砂糖粒を二十置いた。"}, {"t": "p", "h": "「しばらく来ない」"}, {"t": "p", "h": "胴元は、はじめて顔を上げた。"}, {"t": "p", "h": "「十八日か」"}, {"t": "p", "h": "「三十六日だ」"}, {"t": "p", "h": "行って、置いて、帰る。"}, {"t": "p", "h": "それだけのために、三十六日歩く。"}, {"t": "p", "h": "制度を作った男が、勘定の合わないことをしようとしていた。"}, {"t": "p", "h": "安藤は、袋に靴を入れた。"}, {"t": "p", "h": "左の靴は、履いたままだった。"}, {"t": "p", "h": "北へ向かって、歩きだす。"}, {"t": "p", "h": "頭がだめなら。"}, {"t": "p", "h": "<strong>足に、頼む。</strong>"}, {"t": "opener", "i": 3, "alt": "第三章　つま先の向き"}, {"t": "p", "h": "十八日。"}, {"t": "p", "h": "安藤は、道を急がなかった。"}, {"t": "p", "h": "急いでも、置くのは夜明け前と決めていた。"}, {"t": "p", "h": "人間に見つかってはいけない。それは、どの町にいても変わらない。"}, {"t": "p", "h": "十八日目の夜、北の町の外れに着いた。"}, {"t": "p", "h": "空は、まだ黒い。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ラリオの道は、うろこ堂の裏手から始まる。"}, {"t": "p", "h": "そこから先は、排水口を三つまたいで、角を曲がる。"}, {"t": "p", "h": "安藤はその道を、八年かけて覚えた。"}, {"t": "p", "h": "覚える必要はなかった。"}, {"t": "p", "h": "年に一度、角に立つだけなら、道順など要らない。"}, {"t": "p", "h": "それでも、覚えた。"}, {"t": "p", "h": "三つ目の排水口の手前で、安藤は足を止めた。"}, {"t": "p", "h": "格子の目が、ほかの二つより粗い。"}, {"t": "p", "h": "ここでだけ、ラリオの歩幅が一つ短くなる。"}, {"t": "p", "h": "安藤は袋をおろし、布をほどいた。"}, {"t": "p", "h": "右の靴を、道の上に置く。"}, {"t": "p", "h": "つま先を、ラリオの進む向きにそろえた。"}, {"t": "p", "h": "置いてから、少し離れて見た。"}, {"t": "p", "h": "それから戻って、半歩ぶん、道の内側へ寄せた。"}, {"t": "p", "h": "また離れて見た。"}, {"t": "p", "h": "また戻って、つま先の向きを直した。"}, {"t": "p", "h": "三度やり直した。"}, {"t": "p", "h": "制度を作った男が、革の靴一つを、三度置き直した。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "空が白みはじめた。"}, {"t": "p", "h": "安藤は、道から離れた。"}, {"t": "p", "h": "瓦の割れ目の陰に入り、体を伏せる。"}, {"t": "p", "h": "やがて、車輪の音がした。"}, {"t": "p", "h": "からから、からから。"}, {"t": "p", "h": "ラリオが来る。"}, {"t": "p", "h": "荷車を押して、いつもの速さで。"}, {"t": "p", "h": "排水口。"}, {"t": "p", "h": "一つ目。二つ目。"}, {"t": "p", "h": "三つ目。"}, {"t": "p", "h": "歩幅が、一つ短くなる。"}, {"t": "p", "h": "その先に、靴がある。"}, {"t": "p", "h": "ラリオは、靴のわきを走り抜けた。"}, {"t": "p", "h": "顔を向けなかった。"}, {"t": "p", "h": "速さも変わらなかった。"}, {"t": "p", "h": "にこにこしたまま、角を曲がって、消えた。"}, {"t": "p", "h": "車輪の音が遠ざかる。"}, {"t": "p", "h": "安藤は、瓦の陰から出なかった。"}, {"t": "p", "h": "<strong>予想どおりだった。</strong>"}, {"t": "sep", "h": ""}, {"t": "p", "h": "日が高くなった。"}, {"t": "p", "h": "町が動きだす。小さき者たちが、路地を行き来しはじめる。"}, {"t": "p", "h": "安藤は、瓦の陰でじっとしていた。"}, {"t": "p", "h": "昼、荷車の音がもう一度通った。"}, {"t": "p", "h": "ラリオは、靴のわきを走り抜けた。"}, {"t": "p", "h": "夕、また通った。"}, {"t": "p", "h": "同じだった。"}, {"t": "p", "h": "安藤は、体を起こした。"}, {"t": "p", "h": "片足だけの足跡が、瓦の裏の土に残っていた。"}, {"t": "p", "h": "南へ帰る。"}, {"t": "p", "h": "十八日。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "歩きだして、三歩で止まった。"}, {"t": "p", "h": "戻って、もう一度、靴を見た。"}, {"t": "p", "h": "つま先の向きは、朝のままだった。"}, {"t": "p", "h": "安藤は、それ以上は直さなかった。"}, {"t": "p", "h": "背を向けて、南へ歩きだす。"}, {"t": "p", "h": "右の足が、地面をつかむ。"}, {"t": "p", "h": "<strong>置かれた札は、戻らない。</strong>"}, {"t": "opener", "i": 4, "alt": "第四章　土"}, {"t": "p", "h": "靴は、三日、誰にも触られなかった。"}, {"t": "p", "h": "北の町の朝は、誰も足元を見ない。"}, {"t": "p", "h": "みな、自分の行き先だけを見て歩く。"}, {"t": "p", "h": "四日目、はじめて立ち止まる者が出た。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "菓子屋の裏で拾い屋をしている男だった。"}, {"t": "p", "h": "人間の落としたものを集めて、賭場の隅で売る。"}, {"t": "p", "h": "男は靴を持ち上げ、日にかざした。"}, {"t": "p", "h": "革だ。"}, {"t": "p", "h": "縫い目は粗いが、底はまだ厚い。"}, {"t": "p", "h": "売れば、砂糖粒で十は固い。"}, {"t": "p", "h": "男は靴を袋に入れた。"}, {"t": "p", "h": "そして、道を三歩行った。"}, {"t": "p", "h": "止まった。"}, {"t": "p", "h": "つま先が、きちんと道の向きにそろえて置いてあった。"}, {"t": "p", "h": "落とし物は、ああいう置き方をしない。"}, {"t": "p", "h": "男は袋から靴を出した。"}, {"t": "p", "h": "もとの場所に戻し、つま先の向きも合わせた。"}, {"t": "p", "h": "「……落としもんじゃねえな、こりゃ」"}, {"t": "p", "h": "誰にともなく言って、歩いていった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "六日目、蹴る者が出た。"}, {"t": "p", "h": "若い走り屋だった。荷を担いで急いでいて、靴につまずいた。"}, {"t": "p", "h": "体勢を崩し、荷の縄がほどけかけた。"}, {"t": "p", "h": "「なんだこれ」"}, {"t": "p", "h": "男は靴を蹴った。"}, {"t": "p", "h": "靴は道の脇まで転がり、割れた瓦のふちに引っかかって止まった。"}, {"t": "p", "h": "男は振り返りもせず、走っていった。"}, {"t": "p", "h": "その日、荷車が二度、そこを通った。"}, {"t": "p", "h": "ラリオは、道の脇には目を向けなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "七日目の夜。"}, {"t": "p", "h": "靴は、瓦のふちで横倒しになっていた。"}, {"t": "p", "h": "土がついて、革の色が分からなくなっていた。"}, {"t": "p", "h": "風が吹いた。"}, {"t": "p", "h": "靴は、そのまま動かなかった。"}, {"t": "p", "h": "置いた男は、南へ向かって、十一日目の道を歩いていた。"}, {"t": "p", "h": "<strong>それを知る者は、北にも南にも、一人もいなかった。</strong>"}, {"t": "sep", "h": ""}, {"t": "p", "h": "八日目の朝。"}, {"t": "p", "h": "靴は、三つ目の排水口の手前に戻っていた。"}, {"t": "p", "h": "つま先は、ラリオの進む向きにそろえてある。"}, {"t": "p", "h": "土は払われていた。"}, {"t": "p", "h": "道の内側へ、半歩ぶん寄せてあった。"}, {"t": "p", "h": "置き方は、八日前とほとんど同じだった。"}, {"t": "p", "h": "戻した者は、その場にいなかった。"}, {"t": "opener", "i": 5, "alt": "第五章　横に三本"}, {"t": "p", "h": "男は、七日目の夜に、それを見つけた。"}, {"t": "p", "h": "賭場からの帰りだった。"}, {"t": "p", "h": "その夜も、張れなかった。賭ける粒が足りなくて、このごろは、負けることすらできない。"}, {"t": "p", "h": "連敗の数は、数えてある。増えないまま、数えてある。"}, {"t": "p", "h": "瓦のふちに、何かが引っかかっていた。"}, {"t": "p", "h": "拾い上げた。"}, {"t": "p", "h": "土を払った。"}, {"t": "p", "h": "手が、止まった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "甲のところに、縫い直した跡が三本。"}, {"t": "p", "h": "男は、その縫い方を知っていた。"}, {"t": "p", "h": "自分の縫い方だったからだ。"}, {"t": "p", "h": "走り屋だったころ、荷の破れを縫うのは彼の役だった。"}, {"t": "p", "h": "胴元の靴も、三度直した。"}, {"t": "p", "h": "革が薄くなった箇所に、横に三本。糸を渡して、上から押さえる。"}, {"t": "p", "h": "誰にも教えたことのない縫い方だった。"}, {"t": "p", "h": "この靴を縫ったのは、自分ではない。"}, {"t": "p", "h": "<strong>「……なんで、ここにあるんだよ」</strong>"}, {"t": "p", "h": "声に出していた。"}, {"t": "p", "h": "返す者はいなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "男は、拳を握った。"}, {"t": "p", "h": "あの男は、靴を売ったはずだった。"}, {"t": "p", "h": "南で落ちぶれて、上着も指の輪も靴も売ったと、そう聞いていた。"}, {"t": "p", "h": "八年前の話だ。"}, {"t": "p", "h": "売ったものが、なぜ北の道に落ちている。"}, {"t": "p", "h": "誰かが南で買って、北へ持ってきたのかもしれない。"}, {"t": "p", "h": "拾い屋が仕入れてきたのかもしれない。"}, {"t": "p", "h": "男は、そのどれも信じなかった。"}, {"t": "p", "h": "信じなかった理由を、彼は自分でも言えなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "靴を持ったまま、彼は道に立っていた。"}, {"t": "p", "h": "三つ目の排水口。"}, {"t": "p", "h": "毎朝、ラリオが通る道だ。"}, {"t": "p", "h": "男は、そこで長いこと動かなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "あの夜のことを、彼は毎日思い出す。"}, {"t": "p", "h": "忘れないように、毎日思い出している。"}, {"t": "p", "h": "賭場の奥。"}, {"t": "p", "h": "粉の包み。"}, {"t": "p", "h": "胴元の指が、それをラリオのほうへ滑らせた。"}, {"t": "p", "h": "男は、その場にいた。"}, {"t": "p", "h": "見ていた。"}, {"t": "p", "h": "止められた。"}, {"t": "p", "h": "腕をつかむだけでよかった。"}, {"t": "p", "h": "声を出すだけでもよかった。"}, {"t": "p", "h": "<strong>何もしなかった。</strong>"}, {"t": "p", "h": "翌朝、友達は用水路の縁に座っていた。"}, {"t": "p", "h": "そして、にこ、と笑った。"}, {"t": "p", "h": "「……だれ?」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "男は、天井を見上げようとした。"}, {"t": "p", "h": "空しかなかった。"}, {"t": "p", "h": "袖で、顔を拭いた。"}, {"t": "p", "h": "それから、靴をもとの場所に戻した。"}, {"t": "p", "h": "つま先を、ラリオの進む向きにそろえる。"}, {"t": "p", "h": "土を払う。"}, {"t": "p", "h": "道の内側へ、半歩ぶん寄せた。"}, {"t": "p", "h": "置き方は、拾ったときと、ほとんど同じにした。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "翌朝、男は道の陰から見ていた。"}, {"t": "p", "h": "からから、からから。"}, {"t": "p", "h": "ラリオが来る。"}, {"t": "p", "h": "排水口を三つまたぐ。"}, {"t": "p", "h": "歩幅が一つ短くなる。"}, {"t": "p", "h": "靴のわきを、走り抜けた。"}, {"t": "p", "h": "顔を向けなかった。"}, {"t": "p", "h": "にこにこしたまま、角を曲がって、消えた。"}, {"t": "p", "h": "男は、その場に座りこんだ。"}, {"t": "p", "h": "誰にも言わなかった。"}, {"t": "p", "h": "賭場の連中にも、あの老人にも、言わなかった。"}, {"t": "p", "h": "言えば、誰かが靴をどけてしまう気がした。"}, {"t": "p", "h": "<strong>賭場へ行かない日はあっても、道へ行かない日はなかった。</strong>"}, {"t": "opener", "i": 6, "alt": "第六章　天井の染み"}, {"t": "p", "h": "南へ十八日。"}, {"t": "p", "h": "安藤は、来たときと同じ道を歩いた。"}, {"t": "p", "h": "右の足が、石の角をじかに踏む。"}, {"t": "p", "h": "足の裏は硬い。八年、こうして歩いてきた。"}, {"t": "p", "h": "袋は軽くなった。"}, {"t": "p", "h": "入っていたものを、北に置いてきた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "南の町の賭場は、変わっていなかった。"}, {"t": "p", "h": "空き瓶の箱の隙間。"}, {"t": "p", "h": "空き缶の底を伏せた台が一つ。"}, {"t": "p", "h": "胴元は、顔を上げなかった。"}, {"t": "p", "h": "安藤は、いつもの場所に座った。"}, {"t": "p", "h": "「三十六日だったな」"}, {"t": "p", "h": "「ああ」"}, {"t": "p", "h": "「置いてきたのか」"}, {"t": "p", "h": "「ああ」"}, {"t": "p", "h": "胴元は、それ以上聞かなかった。"}, {"t": "p", "h": "この賭場では、誰も人の事情を聞かない。"}, {"t": "p", "h": "聞いたところで、粒にならない。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "片方だけの靴を、この町の者は八年見ている。"}, {"t": "p", "h": "はじめの年は、笑った者がいた。"}, {"t": "p", "h": "売ったんだろう、次は上着か、と言った者がいた。"}, {"t": "p", "h": "安藤は答えなかった。"}, {"t": "p", "h": "三年目には、誰も言わなくなった。"}, {"t": "p", "h": "五年目には、誰も見なくなった。"}, {"t": "p", "h": "<strong>笑われなくなるのに、三年かかった。忘れられるのに、五年かかった。</strong>"}, {"t": "p", "h": "いま、安藤の裸足は、この賭場の景色の一部だった。"}, {"t": "p", "h": "欠けた台の角や、天井の染みと同じだった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "札が配られる。"}, {"t": "p", "h": "安藤は砂糖粒を二つ置く。"}, {"t": "p", "h": "めくる。はずれ。"}, {"t": "p", "h": "もう一度。"}, {"t": "p", "h": "はずれ。"}, {"t": "p", "h": "粒が減っていく。"}, {"t": "p", "h": "十八日の往復で、稼ぎはない。持っていた粒は、もう底が見えていた。"}, {"t": "p", "h": "胴元が言った。"}, {"t": "p", "h": "「今日はこのへんにしとけ」"}, {"t": "p", "h": "「まだある」"}, {"t": "p", "h": "「三粒だろ」"}, {"t": "p", "h": "安藤は、台の上に三粒を並べた。"}, {"t": "p", "h": "並べてから、動かさなかった。"}, {"t": "p", "h": "九年前なら、この三粒がどう増えるかを、先に計算していた。"}, {"t": "p", "h": "帳簿の男だった。数えることで生きてきた。"}, {"t": "p", "h": "いまは、数えなかった。"}, {"t": "p", "h": "三粒を置いたまま、安藤は北の道のことを考えていた。"}, {"t": "p", "h": "靴は、まだそこにあるだろうか。"}, {"t": "p", "h": "拾われたか。蹴られたか。土に埋もれたか。"}, {"t": "p", "h": "<strong>分からないものに、三粒を張っている。</strong>"}, {"t": "sep", "h": ""}, {"t": "p", "h": "「おい」"}, {"t": "p", "h": "胴元が、台を指で叩いた。"}, {"t": "p", "h": "「張るのか、張らないのか」"}, {"t": "p", "h": "安藤は、三粒を手のひらに戻した。"}, {"t": "p", "h": "「今日は、やめておく」"}, {"t": "p", "h": "胴元が、はじめて顔を上げた。"}, {"t": "p", "h": "この客が、粒を残して立つのを見たことがなかった。"}, {"t": "p", "h": "安藤は立ち上がった。"}, {"t": "p", "h": "片方だけの靴で、箱の隙間へ歩いていく。"}, {"t": "p", "h": "背中に、誰かの声がした。"}, {"t": "p", "h": "「あの人、はじめて降りたな」"}, {"t": "p", "h": "安藤には、聞こえなかった。"}, {"t": "opener", "i": 7, "alt": "第七章　手の覚え"}, {"t": "p", "h": "十日目。"}, {"t": "p", "h": "靴は、三つ目の排水口の手前にある。"}, {"t": "p", "h": "朝、荷車が通る。"}, {"t": "p", "h": "昼、荷車が通る。"}, {"t": "p", "h": "夕、荷車が通る。"}, {"t": "p", "h": "ラリオは、靴のわきを走り抜ける。"}, {"t": "p", "h": "顔を向けない。"}, {"t": "p", "h": "男は、道の陰から見ている。"}, {"t": "p", "h": "見て、帰る。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "十五日目。"}, {"t": "p", "h": "雨が降った。"}, {"t": "p", "h": "革が水を吸って、色が濃くなった。"}, {"t": "p", "h": "底に泥が入った。"}, {"t": "p", "h": "男は、靴を瓦の下へ運んだ。"}, {"t": "p", "h": "半日そこに置いて、水が切れてから、もとの場所に戻した。"}, {"t": "p", "h": "つま先の向きを合わせる。"}, {"t": "p", "h": "道の内側へ、半歩。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "二十日目。"}, {"t": "p", "h": "男が賭場に行かない日が、三日続いた。"}, {"t": "p", "h": "賭けなかったのではない。"}, {"t": "p", "h": "賭ける粒が、なかった。"}, {"t": "p", "h": "朝と夕に道へ行き、靴を見て、帰る。"}, {"t": "p", "h": "それだけで一日が終わる日が、はじめてあった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "二十六日目。"}, {"t": "p", "h": "賭場の顔見知りが、路地で声をかけてきた。"}, {"t": "p", "h": "「最近、来ねえな」"}, {"t": "p", "h": "「粒がねえ」"}, {"t": "p", "h": "「粒がなくても来るのが、お前だろ」"}, {"t": "p", "h": "返事はしなかった。"}, {"t": "p", "h": "男は、そのまま道のほうへ歩いていった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "三十日目。"}, {"t": "p", "h": "白い髭の老人が、道の端に立っていた。"}, {"t": "p", "h": "新聞の切れはしを抱えたまま、排水口の手前を見ていた。"}, {"t": "p", "h": "靴を見ていたのか、道を見ていたのかは、分からない。"}, {"t": "p", "h": "男は、瓦の陰から動かなかった。"}, {"t": "p", "h": "出ていけば、聞かれる。"}, {"t": "p", "h": "聞かれれば、答えることになる。"}, {"t": "p", "h": "老人は、しばらく立って、それから帰った。"}, {"t": "p", "h": "靴には、触らなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "三十四日目。"}, {"t": "p", "h": "若い走り屋が、また通りかかった。"}, {"t": "p", "h": "六日目に蹴った男である。"}, {"t": "p", "h": "今度は、蹴らなかった。"}, {"t": "p", "h": "よけて、走っていった。"}, {"t": "p", "h": "三度目からは、よけるのが癖になっていた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "三十八日目。"}, {"t": "p", "h": "風が強い日だった。"}, {"t": "p", "h": "靴が、また転がった。"}, {"t": "p", "h": "男が戻した。"}, {"t": "p", "h": "その手つきは、はじめの日より早くなっていた。"}, {"t": "p", "h": "つま先の向き。土を払う。半歩。"}, {"t": "p", "h": "<strong>手が、覚えていた。</strong>"}, {"t": "sep", "h": ""}, {"t": "p", "h": "四十日目。"}, {"t": "p", "h": "朝。"}, {"t": "p", "h": "からから、からから。"}, {"t": "p", "h": "ラリオが来る。"}, {"t": "p", "h": "排水口を三つまたぐ。"}, {"t": "p", "h": "歩幅が一つ短くなる。"}, {"t": "p", "h": "靴のわきを、走り抜けた。"}, {"t": "p", "h": "顔を向けなかった。"}, {"t": "p", "h": "にこにこしたまま、角を曲がって、消えた。"}, {"t": "p", "h": "男は、瓦の陰に座った。"}, {"t": "p", "h": "四十日。"}, {"t": "p", "h": "百二十回、その道を通った。"}, {"t": "p", "h": "一度も、向かなかった。"}, {"t": "p", "h": "<strong>それでも彼は、明日も来る。</strong>"}, {"t": "p", "h": "同じ朝、南の賭場で、男が三粒を手に戻していた。"}, {"t": "opener", "i": 8, "alt": "第八章　雪の下"}, {"t": "p", "h": "四十九日目の夜に、雪が降った。"}, {"t": "p", "h": "北の町の冬は、年に二度か三度、雪になる。"}, {"t": "p", "h": "人間の足跡が、道を大きく踏み荒らす。"}, {"t": "p", "h": "小さき者は、その日は動かない。"}, {"t": "p", "h": "男は、壁裏の窓から外を見ていた。"}, {"t": "p", "h": "板の隙間から、白いものが流れていく。"}, {"t": "p", "h": "朝までに、道は埋まる。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "夜明け前に、彼は外へ出た。"}, {"t": "p", "h": "雪は、まだ降っていた。"}, {"t": "p", "h": "彼の膝まである。一歩進むのに、両手を使った。"}, {"t": "p", "h": "三つ目の排水口の手前。"}, {"t": "p", "h": "靴は、見えなかった。"}, {"t": "p", "h": "雪の下に、ゆるい盛り上がりが一つ。"}, {"t": "p", "h": "そこに手を入れれば、革に触れるはずだった。"}, {"t": "p", "h": "男は、しゃがんだ。"}, {"t": "p", "h": "手を伸ばして、止めた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "掘れば、靴は出る。"}, {"t": "p", "h": "出せば、いつもの場所に戻せる。"}, {"t": "p", "h": "つま先の向きを合わせて、半歩寄せて、それで終わりだ。"}, {"t": "p", "h": "四十九日、そうしてきた。"}, {"t": "p", "h": "男は、自分の手を見た。"}, {"t": "p", "h": "――<strong>オレがやってきたのは、なんだ。</strong>"}, {"t": "p", "h": "靴を見えるようにすることだ。"}, {"t": "p", "h": "ラリオが、いつか気づくように。"}, {"t": "p", "h": "だが、四十九日、気づかなかった。"}, {"t": "p", "h": "百四十七回、通って、一度も向かなかった。"}, {"t": "p", "h": "見えるようにしていたのは、誰のためだったのか。"}, {"t": "p", "h": "<strong>オレは、あいつに気づいてほしいんじゃない。オレが、許されたいだけじゃないのか。</strong>"}, {"t": "sep", "h": ""}, {"t": "p", "h": "男は、拳を握った。"}, {"t": "p", "h": "雪が、その上に積もっていく。"}, {"t": "p", "h": "彼は、手を引いた。"}, {"t": "p", "h": "掘らなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "立ち上がって、彼は道を離れた。"}, {"t": "p", "h": "瓦の陰に入り、そこに座った。"}, {"t": "p", "h": "雪が首から入った。彼は、動かなかった。"}, {"t": "p", "h": "空が、白みはじめた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "からから、からから。"}, {"t": "p", "h": "車輪の音がした。"}, {"t": "p", "h": "雪の朝でも、ラリオは来る。"}, {"t": "p", "h": "荷車の車輪が、雪をかき分けて回る。"}, {"t": "p", "h": "排水口。"}, {"t": "p", "h": "一つ目。二つ目。"}, {"t": "p", "h": "三つ目。"}, {"t": "p", "h": "歩幅が、一つ短くなる。"}, {"t": "p", "h": "その先に、盛り上がりが一つ。"}, {"t": "p", "h": "革の色は、見えない。"}, {"t": "p", "h": "ラリオは、来る。"}, {"t": "opener", "i": 9, "alt": "第九章　雪の上"}, {"t": "p", "h": "車輪が、雪を噛む音がする。"}, {"t": "p", "h": "からから、からから。"}, {"t": "p", "h": "いつもより重い。"}, {"t": "p", "h": "ラリオは、荷車を押していた。"}, {"t": "p", "h": "雪の朝は、荷が滑る。荷台の縄を、両手で押さえている。"}, {"t": "p", "h": "三つ目の排水口。"}, {"t": "p", "h": "歩幅が、一つ短くなる。"}, {"t": "p", "h": "そして。"}, {"t": "p", "h": "<strong>足が、止まった。</strong>"}, {"t": "sep", "h": ""}, {"t": "p", "h": "荷車が、半歩ぶん、前に出て止まった。"}, {"t": "p", "h": "ラリオは、その場に立っていた。"}, {"t": "p", "h": "にこにこしていた顔が、ほんの少しだけ、止まっていた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "彼は、自分の足を見た。"}, {"t": "p", "h": "雪しかない。"}, {"t": "p", "h": "道も、盛り上がりも、白い。"}, {"t": "p", "h": "ラリオは、しばらくそうしていた。"}, {"t": "p", "h": "それから、しゃがんだ。"}, {"t": "p", "h": "手袋はない。素手で、雪をかいた。"}, {"t": "p", "h": "一度。二度。"}, {"t": "p", "h": "指先が、何かに当たった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "革が出てきた。"}, {"t": "p", "h": "ラリオは、それを引き出した。"}, {"t": "p", "h": "雪を払う。"}, {"t": "p", "h": "片方だけの靴だった。"}, {"t": "p", "h": "甲のところに、縫い直した跡が三本。"}, {"t": "p", "h": "彼は、それを見た。"}, {"t": "p", "h": "長いこと、見ていた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "「……あー」"}, {"t": "p", "h": "それだけだった。"}, {"t": "p", "h": "彼は靴を、道の脇に置いた。"}, {"t": "p", "h": "つま先の向きは、合わせなかった。"}, {"t": "p", "h": "荷車に戻り、縄を押さえ直した。"}, {"t": "p", "h": "からから、と車輪が鳴った。"}, {"t": "p", "h": "ラリオは、走っていった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "瓦の陰で、男は動けなかった。"}, {"t": "p", "h": "雪が、肩に積もっていた。"}, {"t": "p", "h": "彼は、四十九日ぶんの朝を思い出そうとして、うまくいかなかった。"}, {"t": "p", "h": "かわりに、九年前の用水路の縁が出てきた。"}, {"t": "p", "h": "「……だれ?」"}, {"t": "p", "h": "あの日から、この男は、一度も思い出していない。"}, {"t": "p", "h": "今日も、思い出していない。"}, {"t": "p", "h": "靴を見て、「あー」と言っただけだ。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "男は、雪をかき分けて道へ出た。"}, {"t": "p", "h": "靴は、道の脇にあった。"}, {"t": "p", "h": "向きは、めちゃくちゃだった。"}, {"t": "p", "h": "彼は、それを持ち上げた。"}, {"t": "p", "h": "そして、気づいた。"}, {"t": "p", "h": "<strong>雪の上に、足跡が一つ、外へふくらんでいた。</strong>"}, {"t": "p", "h": "まっすぐな足跡の列。"}, {"t": "p", "h": "そのうちの一つだけが、半歩ぶん、脇へ寄っている。"}, {"t": "p", "h": "何かを、よけた足だった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "男は、その足跡の前に、しゃがんだ。"}, {"t": "p", "h": "長いこと、そうしていた。"}, {"t": "p", "h": "袖で、顔を拭いた。"}, {"t": "p", "h": "それから、靴をもとの場所に戻した。"}, {"t": "p", "h": "つま先の向きを合わせる。"}, {"t": "p", "h": "雪を払う。"}, {"t": "p", "h": "道の内側へ、半歩。"}, {"t": "p", "h": "<strong>置いた者と、戻す者と、よけた足が、同じ場所にそろっていた。</strong>"}, {"t": "opener", "i": 10, "alt": "第十章　払われた雪"}, {"t": "p", "h": "一年が過ぎた。"}, {"t": "p", "h": "南の賭場で、安藤は座り、負け、また座った。"}, {"t": "p", "h": "粒が尽きると、人間の菓子の屑を拾って食べた。"}, {"t": "p", "h": "冬が来た。"}, {"t": "p", "h": "安藤は、胴元に言った。"}, {"t": "p", "h": "「三十六日だ」"}, {"t": "p", "h": "胴元は、顔も上げずに言った。"}, {"t": "p", "h": "「行ってこい」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "十八日。"}, {"t": "p", "h": "北の町に入ったのは、夜明けの前だった。"}, {"t": "p", "h": "雪が積もっていた。"}, {"t": "p", "h": "去年より深い。"}, {"t": "p", "h": "安藤は、うろこ堂の裏手から、ラリオの道に入った。"}, {"t": "p", "h": "排水口を、一つ。二つ。"}, {"t": "p", "h": "三つ目の手前で、足を止めた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "靴が、あった。"}, {"t": "p", "h": "一年前に置いたままの場所に。"}, {"t": "p", "h": "つま先は、ラリオの進む向き。"}, {"t": "p", "h": "道の内側へ、半歩。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "安藤は、その場に立っていた。"}, {"t": "p", "h": "革は、一年ぶんくたびれていた。"}, {"t": "p", "h": "だが、雪に埋もれていなかった。"}, {"t": "p", "h": "<strong>払った者が、いる。</strong>"}, {"t": "sep", "h": ""}, {"t": "p", "h": "足元の雪に、目を落とす。"}, {"t": "p", "h": "足跡があった。"}, {"t": "p", "h": "小さい。荷車の轍が二本、その両脇に足跡が並んで、道をまっすぐ伸びている。"}, {"t": "p", "h": "まっすぐだった。"}, {"t": "p", "h": "一か所を、のぞいて。"}, {"t": "p", "h": "靴の手前で、足跡が一つ、外へふくらんでいた。"}, {"t": "p", "h": "半歩ぶん。"}, {"t": "p", "h": "その先は、また、まっすぐだった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "安藤は、しゃがんだ。"}, {"t": "p", "h": "その足跡に、指を伸ばしかけて、止めた。"}, {"t": "p", "h": "触らなかった。"}, {"t": "p", "h": "<strong>置かれた札は、戻らない。</strong>"}, {"t": "p", "h": "十度、名乗った。"}, {"t": "p", "h": "一度も、残らなかった。"}, {"t": "p", "h": "頭には、届かなかった。"}, {"t": "p", "h": "足には、届いた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "空が、まだ暗い。"}, {"t": "p", "h": "安藤は、道から離れて、瓦の陰に入った。"}, {"t": "p", "h": "去年と同じ場所である。"}, {"t": "p", "h": "そこで、待った。"}, {"t": "p", "h": "夜が明ければ、車輪の音がする。"}, {"t": "p", "h": "角に立てば、「……だれ?」と言われる。"}, {"t": "p", "h": "十度目だ。"}, {"t": "p", "h": "それでよかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "雪を踏む音が、近づいてきた。"}, {"t": "p", "h": "車輪の音ではなかった。"}, {"t": "p", "h": "一人ぶんの、足音だった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "男が来た。"}, {"t": "p", "h": "痩せている。目の下に、隈がある。"}, {"t": "p", "h": "安藤は、その顔を知っていた。"}, {"t": "p", "h": "走り屋だったころ、荷の破れを縫っていた男だ。"}, {"t": "p", "h": "胴元の靴を、三度直した男だ。"}, {"t": "p", "h": "男は、靴の前にしゃがんだ。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "つま先の向きを直す。"}, {"t": "p", "h": "雪を払う。"}, {"t": "p", "h": "道の内側へ、半歩。"}, {"t": "p", "h": "手つきに、迷いがなかった。"}, {"t": "p", "h": "何百回とやってきた者の手だった。"}, {"t": "p", "h": "男は、立ち上がった。"}, {"t": "p", "h": "靴を見下ろして、少しのあいだ、動かなかった。"}, {"t": "p", "h": "それから、来た道を帰っていった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "安藤は、瓦の陰から出なかった。"}, {"t": "p", "h": "声をかけなかった。"}, {"t": "p", "h": "名乗らなかった。"}, {"t": "p", "h": "<strong>名乗れば、答えさせることになる。</strong>"}, {"t": "p", "h": "一年、この町で、靴は一人でそこにあったのではなかった。"}, {"t": "p", "h": "安藤は、そのことを、たったいま知った。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "空が白む。"}, {"t": "p", "h": "からから、からから。"}, {"t": "p", "h": "車輪の音が、近づいてくる。"}, {"t": "opener", "i": 11, "alt": "第十一章　証文の名"}, {"t": "p", "h": "安藤は、瓦の陰から出た。"}, {"t": "p", "h": "角へ回り、道の脇に立つ。"}, {"t": "p", "h": "十度目だった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ラリオが来る。"}, {"t": "p", "h": "雪をかき分けて、荷車が来る。"}, {"t": "p", "h": "安藤の前で、止まった。"}, {"t": "p", "h": "にこにこしている。"}, {"t": "p", "h": "「安藤直之という」"}, {"t": "p", "h": "「あー」"}, {"t": "p", "h": "「十年前、この町の賭場にいた」"}, {"t": "p", "h": "ラリオは、うなずいた。"}, {"t": "p", "h": "聞いている顔だった。覚えようとしている顔ではなかった。"}, {"t": "p", "h": "「……だれ?」"}, {"t": "p", "h": "十度目だった。"}, {"t": "p", "h": "ラリオは首をかしげ、また荷車を押していった。"}, {"t": "p", "h": "車輪の音が遠ざかる。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "安藤は、その場に立っていた。"}, {"t": "p", "h": "これで終わりだった。"}, {"t": "p", "h": "あとは十八日かけて、南へ帰る。"}, {"t": "p", "h": "来年また、同じ日に来る。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "「――安藤直之」"}, {"t": "p", "h": "背後から、声がした。"}, {"t": "p", "h": "安藤の足が、止まった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "白い髭の老人が、雪の上に立っていた。"}, {"t": "p", "h": "新聞の切れはしを、小脇に抱えている。"}, {"t": "p", "h": "十年ぶりだった。"}, {"t": "p", "h": "「……覚えていたのか」"}, {"t": "p", "h": "「わしは数えとる」と老人は言った。「証文の名義に、そう書いてあった。四十二人ぶん、全部読んだ。読んだものは忘れん」"}, {"t": "p", "h": "安藤は、なにも言わなかった。"}, {"t": "p", "h": "「アンドゥ、という名は、この町がつけた。お前さんが名乗ったものではない」"}, {"t": "p", "h": "老人は、髭を撫でた。"}, {"t": "p", "h": "「わしは、人につけられた名では呼ばん」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "「毎年、冬に来とるな」"}, {"t": "p", "h": "「…………」"}, {"t": "p", "h": "「十度じゃ」"}, {"t": "p", "h": "安藤は、老人を見た。"}, {"t": "p", "h": "「数えていたのか」"}, {"t": "p", "h": "「わしは数えとる」"}, {"t": "p", "h": "同じ言葉が、二度目だった。"}, {"t": "p", "h": "「夜明け前に入って、明るくなる前に出ていく。町の者は、だれも知らん。……わしは、朝が早いのでな」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "老人は、道の先を見た。"}, {"t": "p", "h": "車輪の轍が、雪に二本、残っている。"}, {"t": "p", "h": "「あの靴は、お前さんのじゃな」"}, {"t": "p", "h": "「…………」"}, {"t": "p", "h": "「触らんかったぞ。わしは、人の置いたものは動かさん」"}, {"t": "p", "h": "安藤は、目を伏せた。"}, {"t": "p", "h": "「……直していた者がいる」"}, {"t": "p", "h": "「おるな」"}, {"t": "p", "h": "「あれは」"}, {"t": "p", "h": "「言わん」老人は、きっぱりと言った。「あの男が言わんことを、わしが言うわけにはいかん」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "長い沈黙があった。"}, {"t": "p", "h": "雪が、二人の肩に積もった。"}, {"t": "p", "h": "やがて、老人が言った。"}, {"t": "p", "h": "「安藤。ひとつ聞く」"}, {"t": "p", "h": "「…………」"}, {"t": "p", "h": "「降りる気は、あるかの」"}, {"t": "p", "h": "安藤は、答えなかった。"}, {"t": "p", "h": "「お前さんの損は、もう戻らん。あの男の頭は、戻らん。九年前も、十年前も、戻らん。……ならば、これ以上張るのは、なんのためじゃ」"}, {"t": "p", "h": "「…………」"}, {"t": "p", "h": "「損切りという。惨めじゃが、いちばん安く済む」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "安藤は、雪の道を見ていた。"}, {"t": "p", "h": "「じいさん」"}, {"t": "p", "h": "「なんじゃ」"}, {"t": "p", "h": "「これは、賭けじゃない」"}, {"t": "p", "h": "老人の手が、髭の途中で止まった。"}, {"t": "p", "h": "「賭けでないなら、なんじゃ」"}, {"t": "p", "h": "安藤は、老人を見た。"}, {"t": "p", "h": "「賭けなら、勝ち負けがある」"}, {"t": "p", "h": "「あるの」"}, {"t": "p", "h": "「これには、ない」"}, {"t": "p", "h": "<strong>「だから、降りようがない」</strong>"}, {"t": "sep", "h": ""}, {"t": "p", "h": "老人は、しばらく黙っていた。"}, {"t": "p", "h": "それから、ふぉっふぉ、と笑った。"}, {"t": "p", "h": "「……そうか」"}, {"t": "p", "h": "「おかしいか」"}, {"t": "p", "h": "「おかしゅうない」老人は言った。「わしも六十年、それをやっとる」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "老人は、新聞の切れはしを抱え直して、背を向けた。"}, {"t": "p", "h": "三歩行って、止まった。"}, {"t": "p", "h": "「安藤」"}, {"t": "p", "h": "「……なんだ」"}, {"t": "p", "h": "「わしはの、お前さんを許しとらん」"}, {"t": "p", "h": "「知っている」"}, {"t": "p", "h": "「四十二人のうち、帰ってこなんだ者がおる。わしは、その名も数えとる」"}, {"t": "p", "h": "「……知っている」"}, {"t": "p", "h": "老人は、振り返らなかった。"}, {"t": "p", "h": "「じゃが、来年も、わしは数えとる」"}, {"t": "p", "h": "老人は、雪の中を帰っていった。"}, {"t": "opener", "i": 12, "alt": "終章　半歩ぶん"}, {"t": "p", "h": "老人が帰ったあと、安藤はしばらく道に立っていた。"}, {"t": "p", "h": "雪がやんだ。"}, {"t": "p", "h": "空が、薄く明るい。"}, {"t": "p", "h": "町が動きだす前に、出なければならない。"}, {"t": "p", "h": "夜明け前に入り、明るくなる前に出る。九年、そうしてきた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "安藤は、三つ目の排水口の手前へ戻った。"}, {"t": "p", "h": "靴は、そこにあった。"}, {"t": "p", "h": "つま先は、ラリオの進む向き。"}, {"t": "p", "h": "道の内側へ、半歩。"}, {"t": "p", "h": "雪は、払ってある。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "持って帰ることもできた。"}, {"t": "p", "h": "一年、この靴は道にあった。"}, {"t": "p", "h": "革は硬くなり、縫い目のひとつがほつれていた。"}, {"t": "p", "h": "南へ持ち帰って縫い直せば、また履ける。"}, {"t": "p", "h": "<strong>それでも、置かれた札は戻らない。</strong>"}, {"t": "p", "h": "安藤は、しゃがんで、つま先の雪を払った。"}, {"t": "p", "h": "払う必要は、なかった。"}, {"t": "p", "h": "もう払われていた。"}, {"t": "p", "h": "それでも、払った。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "立ち上がる。"}, {"t": "p", "h": "左の足には、靴がある。"}, {"t": "p", "h": "右の足は、裸足だった。"}, {"t": "p", "h": "九年、この形で歩いてきた。"}, {"t": "p", "h": "南では、売った男ということになっている。"}, {"t": "p", "h": "安藤は、それを正さなかった。"}, {"t": "p", "h": "これからも、正さない。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "歩きだす。"}, {"t": "p", "h": "十八日。"}, {"t": "p", "h": "南の賭場に戻れば、胴元が顔を上げずに札を配る。"}, {"t": "p", "h": "座って、張って、負ける。"}, {"t": "p", "h": "粒が尽きれば、屑を拾う。"}, {"t": "p", "h": "そして、来年の冬に、また十八日を歩く。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "角を曲がるとき、一度だけ振り返った。"}, {"t": "p", "h": "道が、まっすぐ伸びている。"}, {"t": "p", "h": "轍が二本。"}, {"t": "p", "h": "その脇に、足跡の列。"}, {"t": "p", "h": "一つだけ、外へ寄っている。"}, {"t": "p", "h": "半歩ぶん。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "安藤は、南へ歩きだした。"}, {"t": "p", "h": "右の足が、雪を踏む。"}, {"t": "p", "h": "冷たさが、足の裏から上がってきた。"}, {"t": "p", "h": "十度、歩いた。"}, {"t": "p", "h": "十度、名乗った。"}, {"t": "p", "h": "<strong>頭には、残らなかった。</strong>"}, {"t": "p", "h": "<strong>残ったのは、雪の上の半歩だった。</strong>"}, {"t": "end", "h": "了"}], "chapters": [{"title": "序章　轍", "b": 0}, {"title": "第一章　紙の跡", "b": 31}, {"title": "第二章　縫い目", "b": 93}, {"title": "第三章　つま先の向き", "b": 154}, {"title": "第四章　土", "b": 220}, {"title": "第五章　横に三本", "b": 267}, {"title": "第六章　天井の染み", "b": 341}, {"title": "第七章　手の覚え", "b": 405}, {"title": "第八章　雪の下", "b": 480}, {"title": "第九章　雪の上", "b": 533}, {"title": "第十章　払われた雪", "b": 600}, {"title": "第十一章　証文の名", "b": 685}, {"title": "終章　半歩ぶん", "b": 783}]};

const BM_KEY = 'shiori:' + DATA.title;
DATA.blocks.forEach((b,i)=>{ b.src=i; });
let bm = null;
try{ const v = localStorage.getItem(BM_KEY); bm = v ? JSON.parse(v) : null; }catch(e){ bm = null; }
function saveBm(){ try{ if(bm) localStorage.setItem(BM_KEY, JSON.stringify(bm)); else localStorage.removeItem(BM_KEY); }catch(e){} }
function anchorOf(p){
  const pg = pages[p]; if(!pg) return null;
  for(const b of pg){ if(b && b.src!=null) return {s:b.src, p:b.part||0}; }
  if(pg[0] && pg[0].t==='toc') return {toc:true};
  return null;
}
function pageOfAnchor(a){
  if(!a) return -1;
  if(a.toc) return pages.findIndex(pg=>pg[0] && pg[0].t==='toc');
  for(let p=1;p<pages.length;p++) for(const b of pages[p]) if(b && b.src===a.s && (b.part||0)>=a.p) return p;
  for(let p=1;p<pages.length;p++) for(const b of pages[p]) if(b && b.src!=null && b.src>=a.s) return p;
  return -1;
}
function visiblePages(){ return (spread && idx>0) ? [idx, idx+1] : [idx]; }
function toggleBm(){
  const bp = pageOfAnchor(bm), vis = visiblePages();
  if(bm && vis.indexOf(bp)>=0){ bm = null; }
  else { const a = anchorOf(idx); if(!a) return; bm = a; }
  saveBm(); update(0);
}
function goBm(){ const p = pageOfAnchor(bm); if(p<0) return; idx = p; closeSheets(); update(1); }

}

/* ---------- blocks -> DOM ---------- */
function makeEl(b){
  let el;
  if(b.t==='h2'){ el=document.createElement('h2'); el.innerHTML=b.h; }
  else if(b.t==='quote'){ el=document.createElement('blockquote'); el.innerHTML=b.h; }
  else if(b.t==='sep'){ el=document.createElement('div'); el.className='sep'; el.innerHTML=SEPSVG; }
  else if(b.t==='opener'){ el=document.createElement('div'); el.className='opener'; const im=document.createElement('img'); im.src=IMGS[b.i]; im.alt=b.alt.replace('\u3000',' '); el.appendChild(im); }
  else if(b.t==='end'){ el=document.createElement('p'); el.className='endmark'; el.textContent=b.h; }
  else { el=document.createElement('p'); el.innerHTML=b.h; }
  return el;
}
function contentBox(el){
  const r = el.getBoundingClientRect(), cs = getComputedStyle(el);
  return {
    left:   r.left   + parseFloat(cs.paddingLeft   || 0),
    right:  r.right  - parseFloat(cs.paddingRight  || 0),
    top:    r.top    + parseFloat(cs.paddingTop    || 0),
    bottom: r.bottom - parseFloat(cs.paddingBottom || 0)
  };
}
/* scrollWidth is unreliable in vertical-rl (content overflows leftward),
   so compare the last child's far edge with the page's content box. */
function over(el){
  const kids = el.children;
  if(!kids.length) return false;
  const box = contentBox(el);
  const k = kids[kids.length-1], r = k.getBoundingClientRect(), ks = getComputedStyle(k);
  return vertical
    ? (r.left - parseFloat(ks.marginLeft || 0)) < box.left - 0.5
    : (r.bottom + parseFloat(ks.marginBottom || 0)) > box.bottom + 0.5;
}
function splitText(t){
  const out=[]; let cur='';
  for(let i=0;i<t.length;i++){
    cur+=t[i];
    if('。！？」'.indexOf(t[i])>=0 && cur.length>=40){ out.push(cur); cur=''; }
  }
  if(cur) out.push(cur);
  return out.length?out:[t];
}

/* ---------- pagination ---------- */
function paginate(){
  const m = document.getElementById('measure'), mc = document.getElementById('mcol');
  const ref = document.getElementById('pageA').getBoundingClientRect();
  m.className='page';
  m.style.width = ref.width+'px';
  m.style.height = ref.height+'px';
  mc.innerHTML='';

  pages = [[{t:'cover'}],[{t:'toc'}]];
  chapPage = [];
  let cur = [];
  const push = ()=>{ if(cur.length){ pages.push(cur); cur=[]; } mc.innerHTML=''; };

  const esc = t => t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const drop = el => { if(el && el.parentNode) el.parentNode.removeChild(el); };

  // 1ページに単独で収まらない塊を、収まる単位に割って順番どおり流しこむ
  const flowSplit = (b)=>{
    let part = 0;
    if(b.t==='quote'){                    // 手紙は行単位で分ける
      const trim = a=>{ const c=a.slice();
        while(c.length && c[0]==='') c.shift();
        while(c.length && c[c.length-1]==='') c.pop();
        return c; };
      const lines = b.h.split('<br>');
      let buf=[], node=null;
      for(const ln of lines){
        const trial = buf.concat([ln]);
        drop(node);
        node = makeEl({t:'quote', h: trim(trial).join('<br>')});
        mc.appendChild(node);
        if(over(mc) && trim(buf).length){
          drop(node);
          cur.push({t:'quote', h: trim(buf).join('<br>'), src:b.src, part:part++});
          push();
          buf = (ln==='') ? [] : [ln];
          node = buf.length ? makeEl({t:'quote', h: ln}) : null;
          if(node) mc.appendChild(node);
        } else {
          buf = trial;
        }
      }
      if(trim(buf).length) cur.push({t:'quote', h: trim(buf).join('<br>'), src:b.src, part:part++});
      return;
    }
    for(const c of splitText(makeEl(b).textContent)){   // 段落は文単位で分ける
      const blk = {t:'p', h: esc(c), src:b.src, part:part++};
      let node = makeEl(blk);
      mc.appendChild(node);
      if(over(mc) && cur.length){ drop(node); push(); node = makeEl(blk); mc.appendChild(node); }
      cur.push(blk);
    }
  };

  const feed = (b, chIndex)=>{
    if(b.t==='opener'){ push(); if(chIndex!=null) chapPage[chIndex]=pages.length; pages.push([b]); mc.innerHTML=''; return; }
    const el = makeEl(b);
    mc.appendChild(el);
    if(over(mc)){
      mc.removeChild(el);
      if(cur.length) push();
      mc.appendChild(el);
      if(over(mc)){                       // ページ丸ごと使っても収まらない
        mc.removeChild(el);
        if(chIndex!=null) chapPage[chIndex] = pages.length;
        flowSplit(b);
        return;
      }
    }
    if(chIndex!=null) chapPage[chIndex] = pages.length;
    cur.push(b);
  };

  const chStart = {};
  DATA.chapters.forEach((c,i)=>{ chStart[c.b]=i; });
  DATA.blocks.forEach((b,i)=> feed(b, chStart[i]!=null?chStart[i]:null));
  push();

  // verify: re-measure every page and move any spilled block to the next one
  for(let p=1;p<pages.length;p++){
    if(pages[p][0] && (pages[p][0].t==='toc' || pages[p][0].t==='opener')) continue;
    mc.innerHTML='';
    const keep=[]; const spill=[];
    for(const b of pages[p]){
      if(spill.length){ spill.push(b); continue; }
      const el=makeEl(b); mc.appendChild(el);
      if(over(mc) && keep.length){ mc.removeChild(el); spill.push(b); }
      else keep.push(b);
    }
    if(spill.length){
      pages[p]=keep;
      pages.splice(p+1,0,spill);
      for(let c=0;c<chapPage.length;c++) if(chapPage[c]>p) chapPage[c]++;
    }
  }
  mc.innerHTML='';
  if(pages.length%2===0 && spread) pages.push([{t:'blank'}]);
}

    host.innerHTML = '<div class="opener" style="background:#eceeec"><img alt="'+DATA.title+'　'+DATA.sub+'" src="'+COVER+'"></div>';
    return;
  }
  if(page[0] && page[0].t==='blank'){ hostPage.classList.add('blank'); return; }
  if(page[0] && page[0].t==='toc'){ renderToc(host); return; }
  page.forEach(b=> host.appendChild(makeEl(b)));
}

function update(dir){
  const A=document.getElementById('pageA'), B=document.getElementById('pageB');
  if(spread && idx>0 && idx%2===0) idx--;
  idx = Math.max(0, Math.min(pages.length-1, idx));

  if(spread && idx>0){ renderPage(A,pages[idx]); renderPage(B,pages[idx+1]); }
  else { renderPage(A,pages[idx]); renderPage(B,null); }

  if(dir){
    const dx = (dir>0 ? (vertical?-14:14) : (vertical?14:-14))+'px';
    [A,B].forEach(el=>{ el.style.setProperty('--dx',dx); el.classList.remove('flip'); void el.offsetWidth; el.classList.add('flip'); });
  }

  const bp = pageOfAnchor(bm), vis = visiblePages();
  A.classList.toggle('marked', bm!=null && bp===vis[0]);
  B.classList.toggle('marked', bm!=null && vis.length>1 && bp===vis[1]);
  const here = bm!=null && vis.indexOf(bp)>=0;
  const bb = document.getElementById('bmBtn');
  bb.setAttribute('aria-pressed', String(here));
  bb.disabled = (idx===0 && !spread) || (idx===0);
  bb.setAttribute('aria-label', here ? 'しおりを外す' : 'このページにしおりをはさむ');
  document.getElementById('bmJump').hidden = !(bm && bp>0 && !here);
  const bi = document.getElementById('bmItem');
  bi.hidden = !(bm && bp>0);
  if(bp>0) bi.textContent = 'しおりのページへ（' + bp + '）';
  const last = pages.length-1;
  const prog = last>0 ? idx/last : 0;
  document.getElementById('mark').setAttribute('transform','translate('+(8+284*prog)+',0)');
  document.getElementById('finalmark').classList.toggle('show', idx===last);

  let name='';
  for(let i=0;i<DATA.chapters.length;i++){ if(chapPage[i]!=null && chapPage[i]<=idx) name=DATA.chapters[i].title; }
  document.getElementById('chapNow').textContent = idx===0 ? '' : name;
  document.getElementById('pageNow').textContent = idx===0 ? '表紙' : (idx + ' / ' + last);
  document.querySelectorAll('.toc-item').forEach(el=>{
    el.setAttribute('aria-current', String(Number(el.dataset.p)<=idx && (Number(el.dataset.next)>idx || el.dataset.next==='')));
  });
}

function go(step){ const n=idx+step*(spread&&idx>0?2:1); if(n<0||n>pages.length-1) return; idx=n; update(step); }
function next(){ go(1); } function prev(){ go(-1); }

/* ---------- column fitting ---------- */
function fitColumn(){
  const pa = document.getElementById('pageA'), cs = getComputedStyle(pa);
  const avail = vertical
    ? pa.clientHeight - parseFloat(cs.paddingTop)  - parseFloat(cs.paddingBottom)
    : pa.clientWidth  - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const n = CHARS[sizeIdx];
  let fs = Math.min(SIZES[sizeIdx], avail / (n * KERN));
  fs = Math.max(12.5, fs);
  const colw = Math.min(avail, Math.floor(fs * n * KERN));
  document.documentElement.style.setProperty('--fs', fs.toFixed(2)+'px');
  document.documentElement.style.setProperty('--colw', colw+'px');
}

/* ---------- layout ---------- */
function layout(keepBlock){
  spread = window.innerWidth >= 940 && window.innerHeight >= 420;
  document.body.classList.toggle('spread', spread);
  document.body.classList.toggle('vert', vertical);
  document.documentElement.style.setProperty('--fs', SIZES[sizeIdx]+'px');
  document.documentElement.style.setProperty('--lh', vertical? '1.95' : '2.05');
  requestAnimationFrame(()=>{
    fitColumn();
    paginate();
    if(keepBlock!=null){
      let found=0;
      for(let p=1;p<pages.length;p++){ if(pages[p].some(b=>b===keepBlock)){ found=p; break; } }
      idx = found || Math.min(idx, pages.length-1);
    }
    buildToc();
    update(0);
  });
}
function currentBlock(){ const p=pages[idx]; return p && p[0] && p[0].t!=='cover' ? p[0] : null; }

/* ---------- toc ---------- */
function buildToc(){
  const list=document.getElementById('tocList');
  list.innerHTML='';
  DATA.chapters.forEach((c,i)=>{
    const b=document.createElement('button');
    b.className='toc-item'; b.dataset.p=chapPage[i]||1;
    b.dataset.next = (chapPage[i+1]!=null? chapPage[i+1] : '');
    b.innerHTML='<span>'+c.title+'</span><span class="pg">'+(chapPage[i]||1)+'</span>';
    b.onclick=()=>{ idx=chapPage[i]||1; closeSheets(); update(1); };
    list.appendChild(b);
  });
}

/* ---------- sheets ---------- */
function closeSheets(){ document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('open')); }
try{ if(!/claude\.ai$/i.test(location.hostname) && !/^blob:/.test(location.href)) document.getElementById('homeLink').hidden=false; }catch(e){}
document.getElementById('bmBtn').onclick=toggleBm;
document.getElementById('bmJump').onclick=goBm;
document.getElementById('bmItem').onclick=goBm;
document.getElementById('tocBtn').onclick=()=>document.getElementById('tocSheet').classList.add('open');
document.getElementById('setBtn').onclick=()=>document.getElementById('setSheet').classList.add('open');
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheets);
document.querySelectorAll('.sheet').forEach(s=>s.addEventListener('click',e=>{ if(e.target===s) closeSheets(); }));

document.getElementById('dirSeg').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  const keep=currentBlock();
  vertical = b.dataset.dir==='v';
  document.querySelectorAll('#dirSeg button').forEach(x=>x.setAttribute('aria-pressed', String(x===b)));
  layout(keep);
};
document.getElementById('sizeSeg').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  const keep=currentBlock();
  sizeIdx=Number(b.dataset.size);
  document.querySelectorAll('#sizeSeg button').forEach(x=>x.setAttribute('aria-pressed', String(x===b)));
  layout(keep);
};

/* ---------- input ---------- */
/* 目次ページの項目がページ送りの領域の下にあっても押せるようにする */
function tocHit(e){
  if(!e || (!e.clientX && !e.clientY)) return false;
  const zs=document.querySelectorAll('.zone'); zs.forEach(z=>z.style.pointerEvents='none');
  const el=document.elementFromPoint(e.clientX,e.clientY);
  zs.forEach(z=>z.style.pointerEvents='');
  const t=el && el.closest ? el.closest('.tocpage .tb') : null;
  if(t){ t.click(); return true; }
  return false;
}
document.getElementById('zoneL').onclick=e=>{ if(tocHit(e)) return; vertical? next() : prev(); };
document.getElementById('zoneR').onclick=e=>{ if(tocHit(e)) return; vertical? prev() : next(); };
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') vertical?prev():next();
  else if(e.key==='ArrowLeft') vertical?next():prev();
  else if(e.key===' '||e.key==='ArrowDown'){ e.preventDefault(); next(); }
  else if(e.key==='ArrowUp') prev();
  else if(e.key==='Escape') closeSheets();
});
let tx=0,ty=0;
const bookEl=document.getElementById('book');
bookEl.addEventListener('touchstart',e=>{ tx=e.changedTouches[0].clientX; ty=e.changedTouches[0].clientY; },{passive:true});
bookEl.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)<44 || Math.abs(dx)<Math.abs(dy)) return;
  if(dx<0) vertical?prev():next(); else vertical?next():prev();
},{passive:true});

let rt;
window.addEventListener('resize',()=>{ clearTimeout(rt); const keep=currentBlock(); rt=setTimeout(()=>layout(keep),180); });

if(document.fonts && document.fonts.ready){ document.fonts.ready.then(()=>layout(null)); }
layout(null);

/* shioriAuto: トップページからの「しおりの続きから」 */
if(/[?&]shiori=1/.test(location.search)){
  var _try=function(n){
    try{
      if(bm){ var p=pageOfAnchor(bm); if(p>0){ idx=p; update(0); return; } }
    }catch(e){}
    if(n>0) setTimeout(function(){ _try(n-1); }, 300);
  };
  setTimeout(function(){ _try(6); }, 300);
}
</script>
