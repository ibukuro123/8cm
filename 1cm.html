<style>
  :root{
    --paper:#e3ddcb;
    --paper-deep:#d6cfba;
    --edge:#c2b9a0;
    --ink:#2b2722;
    --ink-soft:#6d6557;
    --pencil:#4d5157;
    --shu:#a8402c;
    --fs:17px;
    --lh:2.05;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    background:#b9b09a;
    background-image:
      radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.18), transparent 60%),
      repeating-linear-gradient(102deg, rgba(0,0,0,.025) 0 2px, transparent 2px 5px);
    color:var(--ink);
    font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP","Songti SC",serif;
    overflow:hidden;
    -webkit-text-size-adjust:100%;
  }
  #app{height:100dvh;display:flex;flex-direction:column;}

  /* ---- top bar ---- */
  .bar{
    flex:0 0 auto;display:flex;align-items:center;gap:14px;
    padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
  }
  .bar button{
    font:inherit;font-size:13px;letter-spacing:.14em;
    background:none;border:none;color:#4a4335;padding:6px 2px;cursor:pointer;
  }
  .bar button:focus-visible{outline:1.5px solid var(--shu);outline-offset:3px;}

  /* ---- ruler ---- */
  .ruler{flex:1 1 auto;display:flex;align-items:flex-end;gap:6px;height:26px;}
  .ruler .rn{font-size:11px;color:#5c5343;line-height:1;padding-bottom:3px;}
  .ruler svg{flex:1 1 auto;width:100%;height:100%;display:block;overflow:visible;}
  .rulerline{stroke:#5c5343;stroke-width:1;}
  .tick{stroke:#5c5343;stroke-width:1;}
  .tick.mm{stroke:#5c5343;opacity:.45;}
  .num{fill:#5c5343;font-size:9px;font-family:inherit;}
  #mark{transition:transform .35s cubic-bezier(.3,.7,.3,1);}
  #mark line{stroke:var(--pencil);stroke-width:2;stroke-linecap:round;}
  #mark text{fill:var(--pencil);font-size:8.5px;letter-spacing:.06em;}
  #finalmark{opacity:0;}
  #finalmark line{stroke:var(--shu);stroke-width:2.4;stroke-linecap:round;}
  #finalmark text{fill:var(--shu);font-size:9px;}
  #finalmark.show{opacity:1;animation:scratch .7s ease-out;}
  @keyframes scratch{from{clip-path:inset(0 0 100% 0);}to{clip-path:inset(0 0 0 0);}}

  /* ---- book ---- */
  #book{flex:1 1 auto;position:relative;padding:0 10px 4px;min-height:0;}
  .spread{
    height:100%;display:flex;gap:0;justify-content:center;
    filter:drop-shadow(0 10px 22px rgba(60,50,30,.32));
  }
  body.vert .spread{flex-direction:row-reverse;}
  .page{
    position:relative;flex:1 1 0;min-width:0;height:100%;max-width:640px;
    background:var(--paper);
    background-image:
      radial-gradient(ellipse at 20% 12%, rgba(255,255,255,.5), transparent 55%),
      radial-gradient(ellipse at 85% 90%, rgba(150,130,90,.18), transparent 60%);
    padding:26px 20px calc(22px + env(safe-area-inset-bottom));
    overflow:hidden;
    font-size:var(--fs);line-height:var(--lh);
    letter-spacing:.03em;
    text-align:justify;
  }
  body.vert .page{writing-mode:vertical-rl;text-orientation:mixed;text-align:start;}
  .col{inline-size:var(--colw,100%);block-size:100%;margin-inline:auto;}
  .page.blank{background:var(--paper-deep);}
  #pageB{display:none;}
  body.spread #pageB{display:block;}
  body.spread #pageA{box-shadow:inset -14px 0 22px -16px rgba(90,72,40,.55);}
  body.spread #pageB{box-shadow:inset 14px 0 22px -16px rgba(90,72,40,.55);}
  body.spread.vert #pageA{box-shadow:inset 14px 0 22px -16px rgba(90,72,40,.55);}
  body.spread.vert #pageB{box-shadow:inset -14px 0 22px -16px rgba(90,72,40,.55);}

  .flip{animation:flip .26s ease;}
  @keyframes flip{from{opacity:.15;transform:translateX(var(--dx,10px));}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){
    .flip{animation:none;} #mark{transition:none;} #finalmark.show{animation:none;}
  }

  /* ---- text blocks ---- */
  .page p{margin:0;text-indent:1em;}
  .page p + p{margin-top:0;}
  body.vert .page p{text-indent:1em;}
  .page h2{
    margin:0 0 1.6em;font-size:1.22em;font-weight:600;letter-spacing:.22em;
    line-height:1.7;text-indent:0;
  }
  body:not(.vert) .page h2{border-bottom:1px solid rgba(90,80,60,.28);padding-bottom:.5em;}
  body.vert .page h2{border-left:1px solid rgba(90,80,60,.28);padding-left:.5em;margin:0 0 1.6em 0;}
  .page blockquote{
    margin:1.2em .4em;padding:0 1em;color:#4b4335;font-size:.94em;
    border-left:2px solid rgba(120,100,60,.4);
  }
  body.vert .page blockquote{
    margin:.4em 1.2em;padding:1em 0;border-left:none;
    border-top:2px solid rgba(120,100,60,.4);
  }
  .sep{margin:1.5em auto;width:34%;height:0;border-top:1px solid rgba(90,80,60,.3);}
  body.vert .sep{margin:auto 1.5em;height:34%;width:0;border-top:none;border-left:1px solid rgba(90,80,60,.3);}
  .endmark{margin:2em 0 0;text-align:center;letter-spacing:.6em;color:var(--ink-soft);text-indent:0;}
  strong{font-weight:700;}
  body.vert strong{
    text-emphasis:filled dot var(--ink);-webkit-text-emphasis:filled dot var(--ink);
    font-weight:inherit;
  }
  em{font-style:normal;color:var(--ink-soft);}

  /* ---- cover ---- */
  .cover{display:flex;align-items:center;justify-content:center;height:100%;max-height:100%;}
  .cover-in{text-align:center;max-width:100%;}
  body.vert .cover-in{writing-mode:vertical-rl;height:100%;max-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;}
  .cover h1{
    margin:0;font-size:min(6.6vh,8.2vw,50px);font-weight:400;
    letter-spacing:.22em;line-height:1.45;text-indent:0;
  }
  body.vert .cover h1{max-height:100%;}
  .cover .sub{margin-top:1.4em;font-size:.86em;letter-spacing:.34em;color:var(--ink-soft);}
  body.vert .cover .sub{margin:1.4em 0 0;}
  .cover .pillar{margin-top:2.2em;}
  body.vert .cover .pillar{margin:2.2em 0 0;}
  .cover .pillar svg{max-height:22vh;}

  /* ---- tap zones + footer ---- */
  .zone{position:absolute;top:0;bottom:0;width:34%;border:none;background:none;cursor:pointer;padding:0;}
  .zone.l{left:0;} .zone.r{right:0;}
  .zone:focus-visible{outline:1.5px dashed var(--shu);outline-offset:-6px;}
  .foot{
    flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;
    padding:8px 18px calc(env(safe-area-inset-bottom) + 8px);
    font-size:11.5px;letter-spacing:.14em;color:#514936;
  }
  .foot span{opacity:.85;}

  /* ---- sheets ---- */
  .sheet{
    position:fixed;inset:0;z-index:20;display:none;
    background:rgba(40,34,24,.5);backdrop-filter:blur(2px);
  }
  .sheet.open{display:block;}
  .sheet-in{
    position:absolute;left:0;right:0;bottom:0;max-height:76%;overflow:auto;
    background:var(--paper);padding:22px 22px calc(env(safe-area-inset-bottom) + 26px);
    border-radius:2px 2px 0 0;
  }
  .sheet h3{margin:0 0 16px;font-size:14px;letter-spacing:.24em;font-weight:600;color:#4a4335;}
  .toc-item{
    display:flex;justify-content:space-between;gap:14px;width:100%;
    font:inherit;font-size:15px;text-align:left;background:none;border:none;
    padding:11px 0;border-bottom:1px solid rgba(90,80,60,.18);color:var(--ink);cursor:pointer;
  }
  .toc-item .pg{font-size:11px;color:var(--ink-soft);letter-spacing:.1em;flex:0 0 auto;}
  .toc-item[aria-current="true"]{color:var(--shu);}
  .row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid rgba(90,80,60,.18);}
  .row:last-child{border-bottom:none;}
  .row .lab{font-size:14px;letter-spacing:.1em;}
  .seg{display:flex;border:1px solid rgba(90,80,60,.4);}
  .seg button{
    font:inherit;font-size:13px;padding:7px 15px;background:none;border:none;cursor:pointer;color:#4a4335;
    border-left:1px solid rgba(90,80,60,.25);
  }
  .seg button:first-child{border-left:none;}
  .seg button[aria-pressed="true"]{background:#4a4335;color:var(--paper);}
  .close{margin-top:20px;width:100%;font:inherit;font-size:13px;letter-spacing:.2em;padding:12px;background:none;border:1px solid rgba(90,80,60,.4);cursor:pointer;color:#4a4335;}

  #measure{position:fixed;top:-99999px;left:0;visibility:hidden;pointer-events:none;}

  /* ---- 電子版デザイン ---- */
  .page .opener{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#f1ece0;writing-mode:horizontal-tb;}
  .page .opener img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;}
  .sep{display:flex;align-items:center;justify-content:center;border:none !important;margin:1.4em auto;width:auto;height:auto;}
  body.vert .sep{margin:auto 1.3em;width:auto;height:auto;}
  body:not(.vert) .sep svg{transform:rotate(-90deg);}
  body.vert .sep svg{transform:none;}

  /* ---- 目次ページ・しおり ---- */
  .bar button{white-space:nowrap;flex:0 0 auto;}
  .ruler .rn{white-space:nowrap;flex:0 0 auto;}
  .ruler{min-width:0;} .ruler svg{min-width:0;}
  .bar{gap:10px;}
  .tocpage{position:relative;z-index:3;pointer-events:none;display:flex;flex-direction:column;gap:.45em;height:100%;}
  body.vert .tocpage{padding-top:0;}
  .tocpage h2{margin:0 0 .5em;border:none !important;padding:0 !important;font-size:1.05em;letter-spacing:.5em;}
  .tocpage .ti{display:flex;align-items:center;gap:.5em;font:inherit;background:none;border:none;padding:0;margin:0;color:var(--ink);cursor:pointer;text-align:start;line-height:1.3;}
  .tocpage .tb{pointer-events:auto;display:flex;align-items:center;gap:.5em;font:inherit;background:none;border:none;padding:.1em;margin:0;color:inherit;cursor:pointer;line-height:1.3;}
  .tocpage .tb:focus-visible{outline:1.5px solid var(--shu);outline-offset:2px;}
  .tocpage .tb:active .t{color:var(--shu);}
  .tocpage .ti .n{color:var(--ink-soft);font-size:.85em;letter-spacing:.2em;flex:0 0 auto;}
  .tocpage .ti .t{flex:0 1 auto;}
  .tocpage .ti .d{flex:1 1 auto;min-width:1em;min-height:1em;border:0 dotted rgba(90,80,60,.45);}
  body:not(.vert) .tocpage .ti .d{border-bottom-width:1px;}
  body.vert .tocpage .ti .d{border-left-width:1px;}
  .tocpage .ti .p{display:inline-block;writing-mode:horizontal-tb;font-size:.72em;color:var(--ink-soft);letter-spacing:.05em;flex:0 0 auto;}
  .page.marked::after{content:"";position:absolute;top:14px;right:18px;width:40px;height:20px;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2040%2020%22%3E%3Cpolyline%20points%3D%222%2C5%2011%2C4%2020%2C5.6%2029%2C4.4%2038%2C5%22%20fill%3D%22none%22%20stroke%3D%22%23a8402c%22%20stroke-width%3D%222.6%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpolyline%20points%3D%222%2C15%2011%2C14%2020%2C15.6%2029%2C14.4%2038%2C15%22%20fill%3D%22none%22%20stroke%3D%22%234d5157%22%20stroke-width%3D%222.6%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E") no-repeat center/contain;z-index:4;pointer-events:none;opacity:.95;}
  body.spread.vert #pageB.marked::after, body.spread:not(.vert) #pageA.marked::after{right:auto;left:22px;}
  #bmBtn[aria-pressed="true"]{color:var(--shu);}
  .foot .bmjump{font:inherit;font-size:11px;letter-spacing:.14em;background:none;border:1px solid rgba(168,64,44,.55);color:var(--shu);padding:3px 10px;cursor:pointer;margin:0 8px;}
  .foot .bmjump[hidden]{display:none;}
  .sheet .bm-item{width:100%;text-align:left;font:inherit;font-size:13px;letter-spacing:.12em;background:none;border:1px solid rgba(168,64,44,.5);color:var(--shu);padding:10px 12px;margin:0 0 14px;cursor:pointer;}
  .sheet .bm-item[hidden]{display:none;}
  .chend{display:block;text-indent:0;text-align:end;font-size:.82em;color:var(--ink-soft);letter-spacing:.2em;margin-top:.6em;}
  .win{fill:#f2d79c;stroke:#b08a45;stroke-width:1;transition:fill .5s ease,stroke .5s ease;}
  .win.now{fill:#f6c46a;stroke:#8a5f1e;stroke-width:1.6;}
  .win.off{fill:none;stroke:#9a917c;}
  @media (prefers-reduced-motion: reduce){.win{transition:none;}}

  #homeLink{font:inherit;font-size:inherit;letter-spacing:.14em;color:var(--ink-soft);text-decoration:none;white-space:nowrap;flex:0 0 auto;}
  #homeLink:hover,#homeLink:focus-visible{color:var(--ink);}
  #homeLink[hidden]{display:none;}
  .nextnav{margin:2.4em 0 0;text-align:center;text-indent:0;line-height:2;}
  .nextnav .lead{display:block;font-size:.8em;letter-spacing:.3em;color:var(--ink-soft);}
  .nextnav a{display:inline-block;margin-top:.4em;padding:.35em 1.1em;border:1px solid rgba(168,64,44,.55);color:var(--shu);
    text-decoration:none;letter-spacing:.12em;font-size:.95em;}
  .nextnav a + a{margin-left:.8em;}
</style>

<script>
const DATA = {"title": "1センチメートル", "sub": "二本の線のあいだ", "blocks": [{"t": "opener", "i": 0, "alt": "序章　貼り紙"}, {"t": "p", "h": "その家の柱に、鉛筆で引いた線が二本ある。"}, {"t": "p", "h": "<strong>八センチ。</strong>"}, {"t": "p", "h": "十二年前、よしゆきが自分で引いた線だ。八歳でその背丈になって、それきり伸びなかった。"}, {"t": "p", "h": "<strong>九センチ。</strong>"}, {"t": "p", "h": "二年前、北の丘から帰った夜に引いた線だ。そのときは、六人で柱を囲んだ。"}, {"t": "p", "h": "そのあいだは、わずかしか空いていない。"}, {"t": "p", "h": "けれども、そこには、町がひとつと、川がひとつと、橋が三つと、嵐がひとつと、猫が一匹と、トビが一羽と、六十年のあいだ本の中で待っていた手紙が一通と――そして、仲間が入っている。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "夜、店が閉まってから、よしゆきは手紙を書く。"}, {"t": "p", "h": "書き終えると、売れそうな本の頁のあいだに挟む。売れたら、もう戻ってこない。"}, {"t": "p", "h": "それでいい。戻ってこないから、南まで行くのだ。"}, {"t": "p", "h": "「まだ書いてんのか」"}, {"t": "p", "h": "丸眼鏡の奥から、ヒロが言った。"}, {"t": "p", "h": "「書いてる」"}, {"t": "p", "h": "「どうせ、向こうも同じこと書いてんだろ。元気ですか、こっちは元気です」"}, {"t": "p", "h": "「うん」"}, {"t": "p", "h": "「それで、いいのか」"}, {"t": "p", "h": "「いい」"}, {"t": "p", "h": "ヒロは、それ以上なにも言わなかった。"}, {"t": "p", "h": "本棚の第三段から、カク爺が顔を上げた。"}, {"t": "p", "h": "「七百十一枚じゃ」"}, {"t": "p", "h": "「数えてなくていいよ」"}, {"t": "p", "h": "「数えるのは、わしの仕事じゃ」"}, {"t": "p", "h": "物置の隅で、ナオ吉が笑った。声には出さなかった。一階では、ネネが杖を膝に置いていた。屋根裏からは、ときどき、かたん、と音がした。ラリオが車軸に油を差している音だった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "翌朝、人間の足音が、いつもより多かった。"}, {"t": "p", "h": "靴が三足。おじいさんのほかに、大人がふたり。"}, {"t": "p", "h": "昼を過ぎて、足音がやんだ。"}, {"t": "p", "h": "「表に、なにか貼った」とヒロが言った。「戸のところ」"}, {"t": "p", "h": "「裏口にもじゃ」とカク爺が言った。"}, {"t": "p", "h": "六人は、節穴のそばに集まった。"}, {"t": "p", "h": "白い紙が、戸の内側にも貼られていた。人間の大きな字は、小さき者の目には壁のようだった。"}, {"t": "p", "h": "カク爺が、いちばん上の行に目を当てた。"}, {"t": "p", "h": "「長らくのご愛顧、まことにありがとうございました」"}, {"t": "p", "h": "そこで、少し間があった。"}, {"t": "p", "h": "「うろこ堂は、閉店いたします」"}, {"t": "p", "h": "だれも、なにも言わなかった。"}, {"t": "p", "h": "「下に、まだ何行かある」とカク爺は言った。「夜に、明るいところで読む」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "よしゆきは、柱の前に立った。"}, {"t": "p", "h": "線が二本。そのあいだに、あの旅がまるごと入っている。"}, {"t": "p", "h": "本は運べる。マッチ箱の寝台も、カク爺の帳面も、ラリオの荷車も、運べる。"}, {"t": "p", "h": "柱は、運べない。"}, {"t": "p", "h": "節穴から、光がひとすじ差しこんでいた。この光を、この家で、あと何度見られるのか。柱の線は、それを教えてくれない。"}, {"t": "opener", "i": 1, "alt": "第一章　土間"}, {"t": "p", "h": "ネネは、夜になるまで動かなかった。"}, {"t": "p", "h": "昼のうち、ネネは椅子に座って、若い者たちが騒ぐ音を下から聞いていた。"}, {"t": "p", "h": "店が閉まり、人間の足音が消えてから、ネネは立ち上がった。"}, {"t": "p", "h": "杖を突いて、うろこ堂の土間へ出る。"}, {"t": "p", "h": "先に来ていた五人が、裏口の戸を見上げていた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "よしゆきが、いちばん前に立っていた。"}, {"t": "p", "h": "この家の主である。"}, {"t": "p", "h": "その斜めうしろで、丸眼鏡のヒロが指をなめていた。"}, {"t": "p", "h": "「どうせ、決まったことだろ」とヒロは言った。「人間は、決めてから貼るんだ」"}, {"t": "p", "h": "「そうじゃ」"}, {"t": "p", "h": "答えたのは、カク爺だった。"}, {"t": "p", "h": "「よいか諸君。こういうときに大事なのは、日数じゃ。日数と、頭数と、食い物の量」"}, {"t": "p", "h": "「じいさん」ヒロが言った。「その顔、うれしそうだぞ」"}, {"t": "p", "h": "「うれしくはない」カク爺は、髭を撫でた。「だが、数えることはできる」"}, {"t": "p", "h": "物置の入口に、ナオ吉が立っていた。梁の上には、ラリオが座っていた。"}, {"t": "p", "h": "「なんか、みんな、集まってる」とラリオは言った。「なんかあった?」"}, {"t": "p", "h": "「家がなくなるって話だ」とヒロが言った。"}, {"t": "p", "h": "「あー」"}, {"t": "p", "h": "ラリオはうなずいた。同じことを訊いたのは、今日これで三度目だった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "カク爺が、紙の下のほうを読みはじめた。"}, {"t": "p", "h": "「閉店日。日付が書いてある」老人は、髭に手をやった。「今日から、六十日じゃ」"}, {"t": "p", "h": "「六十日」とよしゆきが言った。"}, {"t": "p", "h": "「最後の一行が、まだあるの」カク爺は、少し目を細めた。「在庫の一部は、南町、古書つばめ堂にて販売いたします」"}, {"t": "p", "h": "台所のほうで、ヒロが鼻を鳴らした。"}, {"t": "p", "h": "「南か」"}, {"t": "p", "h": "「南じゃ」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "「ネネさん」"}, {"t": "p", "h": "よしゆきが、ふりかえった。"}, {"t": "p", "h": "「なんだい」"}, {"t": "p", "h": "「なにか、言うことある?」"}, {"t": "p", "h": "ネネは、しばらく紙を見上げていた。"}, {"t": "p", "h": "人間の字は読めない。読めなくても、意味はわかる。人間が戸に紙を貼るのは、たいてい、その家での暮らしが終わるときだ。"}, {"t": "p", "h": "「ないよ」とネネは言った。"}, {"t": "p", "h": "「ほんとに?」"}, {"t": "p", "h": "「ないねえ」"}, {"t": "p", "h": "よしゆきは、それ以上聞かなかった。聞かないでいてくれるのが、この子のいいところだった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "壁裏の一階に戻って、ネネは椅子に座った。"}, {"t": "p", "h": "六十年、丘の上の空き家にいた。あの家がどんなふうに静かになっていったかは、よく覚えている。人間がいなくなった家は、はじめに音が消えて、次に湿りが消えて、最後に、においが消える。"}, {"t": "p", "h": "そこまで思い出して、ネネは、それ以上思い出さないことにした。"}, {"t": "p", "h": "まだ、六十日ある。"}, {"t": "p", "h": "天井の上で、ことん、と音がした。よしゆきが寝台に入った音だった。"}, {"t": "p", "h": "明日、若い者たちは動きはじめる。動きはじめたら、だれかが決めなければならない。"}, {"t": "p", "h": "ネネは、自分が何を言うかを、まだ決めていなかった。"}, {"t": "opener", "i": 2, "alt": "第二章　本棚の第三段"}, {"t": "p", "h": "カク爺の家は、本棚の第三段の奥にある。"}, {"t": "p", "h": "人間の背表紙が並んだうしろの、指三本ぶんの空間だ。床には新聞の切れはしを敷き、壁には帳面を積み、隅には、青いビーズをひとつ置いてある。あずかりものである。持ち主は、あずけたことを覚えていない。"}, {"t": "p", "h": "昼のあいだ、節穴からの光がそこまで届く日がある。すると、ビーズを通った光が、壁に小さな青い点を落とす。"}, {"t": "p", "h": "その日も、点は落ちていた。"}, {"t": "p", "h": "カク爺は、それには目もくれず、帳面を開いた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "数えることは、この老人の仕事である。新しい頁に、三つ書いた。"}, {"t": "p", "h": "<strong>日数。頭数。食い物。</strong>"}, {"t": "p", "h": "閉店まで、五十九日と半分。冬は、それより先に来る。この町の冬は、三月ほど続く。雪は年に二度か三度しか降らんが、降らんからといって、寒くないということにはならん。"}, {"t": "p", "h": "頭数は、六。"}, {"t": "p", "h": "最後に、食い物。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "六人は、人間のこぼれもので生きてきた。人間が去れば、それは止まる。"}, {"t": "p", "h": "残るのは、棚の奥の埃と、紙と、乾いた木だけになる。紙は燃えるが、食えん。"}, {"t": "p", "h": "カク爺は、数字を並べた。蓄えを砂糖の粒に直す。六人が一日に食う量で割る。割ったあと、冬の寒さのぶんを足す。丘で死んだ年寄りたちは、たいてい、食う量が足りなかったのではなく、寒さのぶんが足りなかった。"}, {"t": "p", "h": "出た数は、四十四だった。"}, {"t": "p", "h": "四十四日。"}, {"t": "p", "h": "冬は、九十日ある。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "カク爺は、その数字を見ていた。"}, {"t": "p", "h": "それから、線を一本引いて、別の計算を始めた。"}, {"t": "p", "h": "人間の住んでおる家に、六人そろって入りこむとする。こぼれものだけで、冬を越せるか。"}, {"t": "p", "h": "粒に直す。冬のぶんを足す。見つからずに動ける回数で割る。"}, {"t": "p", "h": "鉛筆の先が、割り算の途中で止まった。"}, {"t": "p", "h": "床の下から、音がしたからである。"}, {"t": "p", "h": "こつん。"}, {"t": "p", "h": "ネネの杖だった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "カク爺は、鉛筆を置いた。"}, {"t": "p", "h": "あの老女は、六十年、空き家にいた。空き家の冬が何をするかを、この家で知っているのは、彼女ひとりである。知っている者は、たいてい、さきに黙る。"}, {"t": "p", "h": "割り算の続きは、明日でもできる。"}, {"t": "p", "h": "カク爺は、帳面を閉じた。"}, {"t": "p", "h": "四十四という数字は、まだだれにも言っていない。"}, {"t": "p", "h": "言うべき日がある、と思った。今日ではない気がした。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "帳面の上に、青い点が落ちていた。"}, {"t": "p", "h": "日が傾いて、光の位置が変わったのだ。"}, {"t": "p", "h": "カク爺は、ビーズを少し動かして、点を帳面の外へどけた。"}, {"t": "p", "h": "数字の上に、色がつくのは好かん。"}, {"t": "opener", "i": 3, "alt": "第三章　台所"}, {"t": "p", "h": "貼り紙から十日で、台所が変わった。"}, {"t": "p", "h": "ヒロが最初に気づいたのは、寒さではない。こぼし方である。"}, {"t": "p", "h": "うろこ堂のおじいさんは、ヒロがこの家に来てからずっと、同じこぼし方をしてきた。朝の茶が二滴、昼の菓子の粉がひとつまみ、夜の飯粒がひとつかふたつ。判で押したようなものだった。"}, {"t": "p", "h": "それが、減った。"}, {"t": "p", "h": "茶はこぼさなくなった。菓子は、そもそも出さなくなった。夜の飯は、どこか別のところで食っているらしい。"}, {"t": "p", "h": "ヒロは、それを三日ぶんためして、四日目に確信した。"}, {"t": "p", "h": "「終わるな」"}, {"t": "p", "h": "壁のしみに向かって、そう言った。しみは、なにも言い返さなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "帳場の上の棚のすきまで、ヒロは三日かけて、本の行き先を三つ聞き取った。"}, {"t": "p", "h": "ひとつ、売れ残りの一部は、南町のつばめ堂という古本屋が引き取る。年寄りの親父がひとりでやっている店らしい。"}, {"t": "p", "h": "ふたつ、おじいさんの気に入りは、孫娘のみちるの家へ。おじいさん自身も、そちらへ引き取られる。"}, {"t": "p", "h": "みっつ、常連だという喫茶店の男が、客用の棚に何十冊か置きたいと言った。"}, {"t": "p", "h": "本の行き先は、そのまま、こちらの行き先になる。荷物は、箱に乗せれば運ばれる。"}, {"t": "p", "h": "問題は、どの箱の行き先なら、全員で暮らせるか、である。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ヒロは、下見に出た。行き先は三つ。歩いて行けるのは、そのうち二つだった。"}, {"t": "p", "h": "みちるの家は、ストーブが入っていて、棚の奥が深い。だが、みちるという子どもがいた。大人は目の高さより下を見ないが、子どもは床を見る。台所に落ちた砂糖のかたまりを、あの子は指でつまんで、窓の桟の上にとっておいた。こぼれものが急に減れば、あの子は気づく。"}, {"t": "p", "h": "喫茶店は、客が朝から晩まで菓子を食べる。粉が落ち、角砂糖が転がる。こぼすのは客だから、食い物には、まず困らない。だが店主は、毎晩、床を掃き、棚の本を全部抜いて拭き、同じ順番で戻した。隠れる場所が、毎晩なくなる。"}, {"t": "p", "h": "南町のつばめ堂は、小さき者の足で十八日。見に行くことさえ、できなかった。だが、年寄りがひとりでやっている店なら、こぼれものは、うろこ堂と変わらない。"}, {"t": "p", "h": "帰り着いたのは、貼り紙から二十日目の夜だった。"}, {"t": "p", "h": "台所は、さらに冷えていた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "壁裏の上のほうから、よしゆきが降りてきた。"}, {"t": "p", "h": "「おかえり。どうだった」"}, {"t": "p", "h": "ヒロは、丸眼鏡を外して、袖で拭いてから、かけ直した。"}, {"t": "p", "h": "「出よう」"}, {"t": "p", "h": "「……うん」"}, {"t": "p", "h": "「どうせ、ここはだめだ」ヒロは言った。「四十日待っても、あったかくならねえ」"}, {"t": "p", "h": "どこへ、とは、ヒロは言わなかった。"}, {"t": "p", "h": "言えるほど、いい場所は、ひとつもなかった。"}, {"t": "opener", "i": 4, "alt": "第四章　物置"}, {"t": "p", "h": "物置は、店の奥にある。"}, {"t": "p", "h": "ナオ吉は、その隅の、倒した空き缶の中に寝ている。"}, {"t": "p", "h": "昼のあいだ、人間が土間で段ボールを組み立てていた。"}, {"t": "p", "h": "夜、ナオ吉は見に行った。"}, {"t": "p", "h": "箱は、三か所に分けて積んであった。ひと山目は帳場の横、ふた山目は土間の奥、み山目は裏口のそば。"}, {"t": "p", "h": "山ごとに、行き先がちがう。"}, {"t": "p", "h": "――どれだ。"}, {"t": "p", "h": "そう思った瞬間に、頭の中で、盤が立った。"}, {"t": "p", "h": "三つの山のうち、いちばん安全なのはどれか。一つ選んで、貯めた粒を置く。外れれば、二度と拾わない。"}, {"t": "p", "h": "相手も胴元もいない。それでも、置いたものが戻らないなら、それは賭けだ。"}, {"t": "p", "h": "手が、勝手に動いていた。缶の蓋を開けていた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "「よいか」"}, {"t": "p", "h": "本棚の第三段から、声がした。カク爺だった。"}, {"t": "p", "h": "ナオ吉は、缶に手を入れたまま動きを止めた。"}, {"t": "p", "h": "「……止めねえのか」"}, {"t": "p", "h": "「止めん」"}, {"t": "p", "h": "カク爺は、髭を撫でた。"}, {"t": "p", "h": "「わしは、止めようとしたことが一度ある」老人は言った。「十一年前じゃ。止めて、それから、あの男は――いや、その話は、いまはよい」"}, {"t": "p", "h": "ナオ吉は、なにも言わなかった。"}, {"t": "p", "h": "「ひとつだけ、訊くがの」カク爺は言った。「お前が勝ったら、なにが手に入る」"}, {"t": "p", "h": "ナオ吉は、缶の中の粒を見た。"}, {"t": "p", "h": "勝ったら。自分の粒が、自分のところに戻ってくる。それだけだった。"}, {"t": "p", "h": "どの山が安全かが、それでわかるわけでもない。粒は、箱の行き先を知らない。"}, {"t": "p", "h": "「……なんも、手に入らねえな」"}, {"t": "p", "h": "「そうじゃな」とカク爺は言った。「負ければ、なくなるだけじゃ」"}, {"t": "p", "h": "老人は、顔を引っこめた。"}, {"t": "p", "h": "ナオ吉は、缶の蓋を閉めた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "かわりに、足で確かめることにした。"}, {"t": "p", "h": "三晩かけた。"}, {"t": "p", "h": "ひと山目。帳場の横。箱の側面に、太い墨の字がある。"}, {"t": "p", "h": "<strong>みちる</strong>"}, {"t": "p", "h": "ふた山目。土間の奥。"}, {"t": "p", "h": "<strong>喫茶 ひだまり</strong>"}, {"t": "p", "h": "み山目。裏口のそば。いちばん大きな山だった。"}, {"t": "p", "h": "ナオ吉は、いちばん上の箱によじのぼった。"}, {"t": "p", "h": "字は、二行あった。"}, {"t": "p", "h": "<strong>南町三丁目</strong>"}, {"t": "p", "h": "<strong>古書つばめ堂　様</strong>"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ナオ吉は、そこで動かなくなった。"}, {"t": "p", "h": "箱の蓋に手をついたまま、指の先だけが、段ボールの表面を少し掻いた。"}, {"t": "p", "h": "遠くで、車輪の音がした。からから、からから。その音で、我に返った。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "物置に戻って、空き缶の中に座った。"}, {"t": "p", "h": "言わない。"}, {"t": "p", "h": "そう決めた。なにを言わないのかを、はっきり言葉にしたわけではない。ただ、言わないと決めた。"}, {"t": "p", "h": "言えば、だれかが訊く。訊かれれば、答えることになる。答えたら、もう、なかったことにはできない。"}, {"t": "p", "h": "賭場で覚えたことが、ひとつだけある。"}, {"t": "p", "h": "<strong>手の内は、最後まで見せない。</strong>"}, {"t": "p", "h": "見せた者から、なくなっていく。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "夜明け前、いつもの時刻に、ナオ吉はラリオの道へ出た。三つ目の排水口の手前に、片方の靴がある。"}, {"t": "p", "h": "つま先の向きを直した。埃を払った。ほつれかけた縫い目を、指で押さえた。"}, {"t": "p", "h": "これをやるようになって、何年になるかは、数えていない。"}, {"t": "p", "h": "数えるのは、じいさんの役目だ。"}, {"t": "p", "h": "それから、物置に帰った。"}, {"t": "opener", "i": 5, "alt": "第五章　屋根裏"}, {"t": "p", "h": "朝だ。"}, {"t": "p", "h": "ラリオは、屋根裏で目を覚ます。"}, {"t": "p", "h": "荷車が、そばにある。車軸に指を当てる。すこし渋い。油を差す。指の腹で、こする。"}, {"t": "p", "h": "車輪が、くるん、と回る。"}, {"t": "p", "h": "いい音だ。"}, {"t": "p", "h": "荷台を見る。"}, {"t": "p", "h": "からっぽだ。"}, {"t": "p", "h": "昨日も、からっぽだった。たぶん、その前も。"}, {"t": "p", "h": "それでも、行く。"}, {"t": "p", "h": "荷物がなくても、道はある。道があるなら、走る。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "裏口のすきまから、外へ出る。"}, {"t": "p", "h": "坂を下りる。荷車の車輪が、からから鳴る。"}, {"t": "p", "h": "ラリオの足は、この道を知っている。頭は知らない。足が知っているので、頭はべつに知らなくていい。"}, {"t": "p", "h": "まっすぐ行く。用水路の縁を行く。パン屋の裏を通る。"}, {"t": "p", "h": "三つ目の排水口の手前で、足が、外へふくらむ。"}, {"t": "p", "h": "半歩ぶん。"}, {"t": "p", "h": "ラリオは、下を見る。"}, {"t": "p", "h": "靴が片方、道の上に置いてある。片方だけだ。つま先が、オレと同じほうを向いている。"}, {"t": "p", "h": "「あー」"}, {"t": "p", "h": "なんで、よけたんだろう。"}, {"t": "p", "h": "わからない。"}, {"t": "p", "h": "でも、よけた。よけたから、ぶつからなかった。ぶつからないほうが、いい。"}, {"t": "p", "h": "ラリオは、また走りだす。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "帰ると、土間に、箱がある。"}, {"t": "p", "h": "箱は、荷物だ。荷物は、運ぶ。ラリオは、箱の角に手をかけて、引いてみる。"}, {"t": "p", "h": "動かない。"}, {"t": "p", "h": "「あー」"}, {"t": "p", "h": "ラリオの背の、何十倍もある箱だった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "夜になる。"}, {"t": "p", "h": "壁裏のみんなが、下に集まって、低い声で話している。"}, {"t": "p", "h": "太った男が、なにか言って、痩せた男が、黙る。おばあさんが、杖で床を突く。"}, {"t": "p", "h": "「なんかあった?」"}, {"t": "p", "h": "ラリオは、下に声をかける。"}, {"t": "p", "h": "丸い眼鏡の男が、見上げる。"}, {"t": "p", "h": "「家がなくなるんだよ」"}, {"t": "p", "h": "「あー」"}, {"t": "p", "h": "ラリオは、うなずく。"}, {"t": "p", "h": "「そっかあ」"}, {"t": "p", "h": "それから、屋根裏へ戻る。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "荷車の横に座る。"}, {"t": "p", "h": "車軸に、もういちど油を差す。差したばかりのような気もする。気のせいかもしれない。"}, {"t": "p", "h": "くるん。"}, {"t": "p", "h": "いい音だ。"}, {"t": "p", "h": "明日も、走る。"}, {"t": "p", "h": "足が、道を知っている。"}, {"t": "opener", "i": 6, "alt": "第六章　節穴"}, {"t": "p", "h": "壁裏の一階には、節穴がひとつある。そこから入る光の位置で、ネネは季節を知る。いま、光は床の板を二枚ぶん、夏より奥へ入っていた。"}, {"t": "p", "h": "丘の上の家にも、節穴があった。"}, {"t": "p", "h": "あの村がどうなったかを、ネネは順番に思い出すことができる。順番に思い出せるのは、ゆっくり起きたからだ。"}, {"t": "p", "h": "はじめに、人間がいなくなった。"}, {"t": "p", "h": "風車のある家に住んでいた一家が、荷物を積んで出ていった。冬のはじめだった。"}, {"t": "p", "h": "その日から、火が消えた。次に、こぼれものが消えた。二か月目から、しのげなくなった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "村の若い者たちが、集まって話をした。"}, {"t": "p", "h": "南へ行く、と彼らは言った。"}, {"t": "p", "h": "ネネは、反対した。冬のはじめに、年寄りを連れて出るのは無理だった。"}, {"t": "p", "h": "「春まで待てば、こっちが死ぬ」と、若い者のひとりが言った。"}, {"t": "p", "h": "それも、そのとおりだった。"}, {"t": "p", "h": "話し合いの四晩目に、若い者たちは出ていった。全部で、十九人だった。荷を背負って、明け方に、同じ道から下りていった。"}, {"t": "p", "h": "ネネは、丘の上から見送った。"}, {"t": "p", "h": "<strong>便りは、一度も来なかった。</strong>"}, {"t": "p", "h": "着いたのか、着かなかったのか、いまでもわからない。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "残ったのは、年寄りばかりだった。"}, {"t": "p", "h": "冬が、三回続けてひどかった。"}, {"t": "p", "h": "最後のひとりが逝ったのは、三度目の冬の終わりで、ネネは、その人の手を握っていた。"}, {"t": "p", "h": "握っている手が、だんだん冷たくなっていく。それを、最後まで知っているのは、握っているほうだけである。"}, {"t": "p", "h": "ネネは、そのあと、ひとりになった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ひとりでいることは、平気だった。食べるものは、なんとかなった。"}, {"t": "p", "h": "平気でなかったことが、ひとつだけある。"}, {"t": "p", "h": "<strong>だれも、ここに人がいることを知らない。</strong>"}, {"t": "p", "h": "助けなど要らない。ただ、ここに人がいたという、それだけを、だれかが知っていてくれればよかった。"}, {"t": "p", "h": "それで、手紙を書いた。"}, {"t": "p", "h": "人間の万年筆から垂れたインクを、鳥の羽の先につけて書いた。羽は細くて滑り、指に力を入れるほど、線は揺れた。"}, {"t": "p", "h": "その紙を、人間の本に挟んだ。"}, {"t": "p", "h": "開くのが六十年後だとは、思っていなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "光が、椅子の足元まで来ていた。夕方である。"}, {"t": "p", "h": "上の階で、足音がした。ヒロが台所から物置へ歩いていく音だった。その上で、カク爺が帳面を閉じる音がした。屋根裏で、車輪が、くるん、と回った。"}, {"t": "p", "h": "音が、いくつもある。"}, {"t": "p", "h": "丘には、なかったものである。"}, {"t": "p", "h": "ネネは、光の位置を目で測った。"}, {"t": "p", "h": "冬まで、あと二十日ほど。店が閉まるまで、三十日と少し。"}, {"t": "p", "h": "数えられることは、数えておく。"}, {"t": "p", "h": "数えられないことを数えようとすると、人は、おかしくなる。"}, {"t": "p", "h": "ネネは、まだ、なにを言うかを決めていなかった。"}, {"t": "p", "h": "床から、光が消えた。"}, {"t": "opener", "i": 7, "alt": "第七章　裏手"}, {"t": "p", "h": "貼り紙から四十日目の朝、霜が降りた。"}, {"t": "p", "h": "ナオ吉は、いつもの時刻に起きた。空はまだ暗い。物置の隅から出て、土間を横切り、裏口のすきまへ向かう。"}, {"t": "p", "h": "坂は、一面に霜だった。踏むと、じゃり、と音がする。"}, {"t": "p", "h": "ナオ吉は、坂を下りかけて、止まった。"}, {"t": "p", "h": "裏口の戸の前に、男が立っていた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "背は高くない。姿勢だけが、異様によかった。"}, {"t": "p", "h": "左の足には、靴を履いている。"}, {"t": "p", "h": "右の足は、裸足だった。"}, {"t": "p", "h": "霜の上に、足跡が続いていた。片方は靴の跡で、もう片方は、素足の跡である。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ナオ吉は、そこに立ったまま動かなかった。"}, {"t": "p", "h": "胸のあたりが、熱くなった。冷たい空気を吸っているのに、内側だけが熱い。"}, {"t": "p", "h": "南の町で、この男の胸ぐらを掴んだことが、一度ある。男は、ひとことも返さなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "男は、首を動かさず、目だけで貼り紙を読んでいた。"}, {"t": "p", "h": "最後のほうで、その目が止まった。"}, {"t": "p", "h": "<strong>在庫の一部は、南町三丁目、古書つばめ堂にて販売いたします。</strong>"}, {"t": "p", "h": "その一行のところで、止まっていた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "男が、振り返った。"}, {"t": "p", "h": "目が合った。"}, {"t": "p", "h": "男の目は、静かだった。驚いた顔も、気まずい顔もしなかった。ただ、こちらを見ていた。"}, {"t": "p", "h": "ナオ吉は、なにも言わなかった。言うことを思いつかなかったのではない。思いついたものが、全部、言いたくないものだった。"}, {"t": "p", "h": "男が、口を開いた。声は低かった。ひとことだけだった。"}, {"t": "p", "h": "「つばめ堂の親父は、棚の奥までは掃除しない」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ナオ吉は、拳を握った。"}, {"t": "p", "h": "握ったことに、自分で気づいた。"}, {"t": "p", "h": "男は、それ以上なにも言わなかった。問いもしなかった。答えを待つそぶりも、見せなかった。"}, {"t": "p", "h": "こちらへ小さく頭を下げて――下げたのかどうかも、はっきりしない角度だった――男は、坂を下りていった。"}, {"t": "p", "h": "霜の上に、足跡が二種類、並んで続いていく。"}, {"t": "p", "h": "その足跡は、途中で曲がって、用水路の縁のほうへ入っていった。ラリオの道である。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "空が、少し明るくなった。"}, {"t": "p", "h": "遠くで、車輪の音がした。"}, {"t": "p", "h": "からから、からから。"}, {"t": "p", "h": "音が止まった。"}, {"t": "p", "h": "そのあと、声が聞こえた。小さかったが、聞こえた。"}, {"t": "p", "h": "「……だれ?」"}, {"t": "p", "h": "ナオ吉は、目を閉じた。"}, {"t": "p", "h": "車輪の音が、また動きだして、遠ざかっていった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ナオ吉は、坂を下りた。"}, {"t": "p", "h": "ラリオの道へ出て、三つ目の排水口の手前まで来る。"}, {"t": "p", "h": "片方の靴が、そこにある。霜が、薄くかぶっていた。"}, {"t": "p", "h": "ナオ吉はしゃがんで、つま先の霜を払った。甲のところを指でなぞる。縫い直した跡が三本、横に走っている。ほつれは増えていない。"}, {"t": "p", "h": "つま先の向きを直した。道の内側へ、半歩。"}, {"t": "p", "h": "それだけやって、立ち上がった。"}, {"t": "p", "h": "物置に戻った。"}, {"t": "p", "h": "だれにも、なにも言わなかった。"}, {"t": "opener", "i": 8, "alt": "第八章　本のあいだ"}, {"t": "p", "h": "棚が、軽くなっていく。"}, {"t": "p", "h": "本が減ると、店の音が変わる。人間の声がよく響き、床のきしみが遠くまで届く。よしゆきは、それが嫌だった。"}, {"t": "p", "h": "貼り紙から四十五日目の夜、店が静かになってから、よしゆきは棚をのぼった。"}, {"t": "p", "h": "減っている。"}, {"t": "p", "h": "昼のあいだ、あの子が来ていた。おじいさんの孫娘である。大人にまじって本を運び、そのうち飽きて、床にしゃがんで、抜かれたばかりの棚の奥をのぞきこんでいた。"}, {"t": "p", "h": "よしゆきは、隙間の奥で息を止めていた。あの子は、こちらに気づかずに立ち上がった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "北の丘から帰ってきてから、よしゆきは毎日、同じことを書いてきた。宛名は書かなかった。四百十二枚を書いたころ、そのうちの一枚に返事が来た。"}, {"t": "p", "h": "返事が来ても、やめなかった。どこかの壁の裏に、まだだれかいる。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "「じいさん」"}, {"t": "p", "h": "本棚の第三段に声をかけると、すぐに返事があった。"}, {"t": "p", "h": "「なんじゃ」"}, {"t": "p", "h": "「手紙、何枚出ていった?」"}, {"t": "p", "h": "「六百三十一枚じゃ」"}, {"t": "p", "h": "即答だった。"}, {"t": "p", "h": "「残りは」"}, {"t": "p", "h": "「百十九枚。まだこの店の本の中じゃ」"}, {"t": "p", "h": "「そのうち、ソラのは」"}, {"t": "p", "h": "「三十一枚じゃ」"}, {"t": "p", "h": "よしゆきは、うなずいた。"}, {"t": "p", "h": "出ていったぶんは、町のどこかにある。開かれる日は、明日かもしれないし、六十年後かもしれない。"}, {"t": "p", "h": "店に残っているのは、百十九枚。それを挟んだ本が、これから箱に入る。"}, {"t": "p", "h": "つばめ堂へ行くか、喫茶ひだまりへ行くか、みちるという子の家へ行くか。"}, {"t": "p", "h": "返事をくれたのは、南のソラだけだった。"}, {"t": "p", "h": "ソラ宛ての三十一枚は、南へ行く箱に入れば、いつか届くかもしれない。喫茶店やみちるの家へ入れば、南へは二度と向かわない。"}, {"t": "p", "h": "宛名のないほうは、どこへ行ってもかまわない。どこへ行っても、本は開かれる。開けば、紙が出てくる。"}, {"t": "p", "h": "紙には、こう書いてある。"}, {"t": "p", "h": "<strong>うろこ堂へおいでなさい。</strong>"}, {"t": "sep", "h": ""}, {"t": "p", "h": "待っていた側の話は、聞いたことがある。迎えに行った側の話も、自分で知っている。"}, {"t": "p", "h": "だが、<strong>来たのに、だれもいなかった</strong>側の話は、聞いたことがない。"}, {"t": "p", "h": "聞いたことがないのは、そういう者が、だれにも会わずに帰ったからだ。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "寝床へ戻って、一枚書いた。"}, {"t": "p", "h": "頁のあいだに挟もうとして、手が止まった。売れる本は、もう、この店にない。"}, {"t": "p", "h": "書いたのに、出せない手紙は、これがはじめてだった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "柱の前に立った。"}, {"t": "p", "h": "線が二本。"}, {"t": "p", "h": "二年前、この柱の前に六人で立って、ヒロが爪楊枝を持ち、カク爺が鉛筆を構えた。九センチの線が引かれたとき、ひとりだけ反対に賭けていたナオ吉は、負けたのに笑っていた。"}, {"t": "p", "h": "よしゆきは、線に指を当てた。"}, {"t": "p", "h": "八センチのところと、九センチのところ。そのあいだを、指でなぞってみた。"}, {"t": "p", "h": "なにも書いていない。当たり前である。"}, {"t": "opener", "i": 9, "alt": "第九章　裏口の坂"}, {"t": "p", "h": "五十日目の夜、六人は裏口の坂に集まった。"}, {"t": "p", "h": "だれが呼んだわけでもなかった。"}, {"t": "p", "h": "坂の上からは、店の裏窓が見える。中はもう、ほとんど空だった。"}, {"t": "p", "h": "「じいさん」よしゆきが言った。「なにか、数え終わってるんでしょ」"}, {"t": "p", "h": "「数え終わっておらん」"}, {"t": "p", "h": "「途中まででいい」"}, {"t": "p", "h": "カク爺は、帳面を開いた。開く必要はなかった。数字は覚えておる。ただ、開いたほうが、口に出しやすい。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "「空き家で、四十四日じゃ」"}, {"t": "p", "h": "だれも、なにも言わなかった。"}, {"t": "p", "h": "「冬は九十日ある。四十四では、届かん」"}, {"t": "p", "h": "「半分もないな」とヒロが言った。"}, {"t": "p", "h": "「半分もない」"}, {"t": "p", "h": "カク爺は、次の頁をめくった。"}, {"t": "p", "h": "「人間の住んでおる家に、六人そろって入りこむとする。こぼれものだけで、冬を越せるか」"}, {"t": "p", "h": "「越せるのかよ」"}, {"t": "p", "h": "「<strong>越せん</strong>」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "坂の上が、静かになった。"}, {"t": "p", "h": "「……」"}, {"t": "p", "h": "よしゆきは、なにか言いかけて、やめた。"}, {"t": "p", "h": "「じいさん、そりゃ、どこの家でもか」とヒロが言った。"}, {"t": "p", "h": "「どこの家でも、とは言わん。わしが見た範囲での、平均じゃ。じゃが――」"}, {"t": "p", "h": "「三つとも、無理だ」"}, {"t": "p", "h": "ヒロが、そう引き取った。"}, {"t": "p", "h": "丸眼鏡を外して、袖で拭いてから、かけ直した。それから、見てきた行き先の話をした。みちるの家の子ども。喫茶ひだまりの、毎晩の掃除。南のつばめ堂は、見てもいないが、年寄りひとりの店だ。こぼれものは、ここと変わらない。"}, {"t": "p", "h": "「全員で行ける場所は、ない」とヒロは言った。「見てきたけど、ない」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "よしゆきが、坂の土を見ていた。"}, {"t": "p", "h": "「待ってるって、書いたんだ」"}, {"t": "p", "h": "低い声だった。"}, {"t": "p", "h": "「七百五十枚、書いた。うろこ堂へおいでなさいって。本棚のうしろの、壁の隙間ですって」"}, {"t": "p", "h": "「うむ」"}, {"t": "p", "h": "「百十九枚が、まだこの店の本の中にある。どこへ散っても、読んだやつは、ここへ来る」"}, {"t": "p", "h": "「来るじゃろうな」"}, {"t": "p", "h": "「来たら、空き家だ」"}, {"t": "p", "h": "カク爺は、なにも言わなかった。"}, {"t": "p", "h": "言うべきことが、思いつかなかったのではない。思いついたものが、どれも、この子が自分で考えるべきことだったからである。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "十一年前、この老人は一度だけ、人を止めようとしたことがある。賭場の盤の前で、袖をつかんで、やめよ、と言った。"}, {"t": "p", "h": "止められんかった。"}, {"t": "p", "h": "あの夜から、わしは、人に「こうしろ」とは言わんことにしておる。数えて、並べて、そこまでで手を止める。決めるのは、決める者じゃ。"}, {"t": "p", "h": "今夜も、そうするつもりでおった。"}, {"t": "p", "h": "じゃが、この子は行き詰まっておる。数字は出した。出した数字が、この子を追い詰めておる。"}, {"t": "p", "h": "言葉が、ひとつ、喉のところまで来ていた。二年前から、帳面の隅に書いてある言葉である。"}, {"t": "p", "h": "――決めるのは、わしではない。"}, {"t": "p", "h": "そう思いながら、口を開きかけた、そのときだった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "こつん。"}, {"t": "p", "h": "坂の途中で、杖の音がした。"}, {"t": "opener", "i": 10, "alt": "第十章　坂の途中"}, {"t": "p", "h": "杖の先で、土を一度突いた。"}, {"t": "p", "h": "上のほうで、五人が黙った。"}, {"t": "p", "h": "ネネは、坂の途中の平らなところに座っている。ここまでは、よしゆきが背負って上げてくれた。"}, {"t": "p", "h": "「じいさん」"}, {"t": "p", "h": "ネネは言った。"}, {"t": "p", "h": "「冬を越せないってのは、六人いっしょならの話かい」"}, {"t": "p", "h": "老人の手が、髭の途中で止まった。"}, {"t": "p", "h": "「そうかい」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "言うか、言わないか。貼り紙が出た夜から、考えてきた。答えは出なかった。"}, {"t": "p", "h": "「うちの村はね」"}, {"t": "p", "h": "だれも、口を挟まなかった。"}, {"t": "p", "h": "「若い衆が十九人、出ていった。全員、おんなじ道からね。南だよ。便りは、一度も来なかった」"}, {"t": "p", "h": "坂の下のほうで、だれかが身じろぎした。ナオ吉だったかもしれない。"}, {"t": "p", "h": "「残ったのは、年寄りばっかりだ。だれも動かなかった。動けなかったんじゃないよ。動かないことにしたんだ。三度の冬でね、全部逝った」"}, {"t": "p", "h": "最後のひとりの手を握っていたのが、自分だった。その話は、しなかった。"}, {"t": "p", "h": "杖の先で、もう一度、土を突いた。"}, {"t": "p", "h": "「あたしゃ、どっちが正しかったかは、いまでもわからない」"}, {"t": "p", "h": "言ってしまうと、思ったより軽かった。"}, {"t": "p", "h": "「でもね。<strong>片っぽに全部置いたから、片っぽごと、なくなったんだ</strong>。出ていったほうも、残ったほうもね」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "しばらく、だれもなにも言わなかった。"}, {"t": "p", "h": "それから、白い髭の老人が、坂の上で背筋を伸ばした。"}, {"t": "p", "h": "「よいか諸君」"}, {"t": "p", "h": "いつもの声で、いつもと違った。"}, {"t": "p", "h": "「――これを、<strong>分散</strong>という」"}, {"t": "p", "h": "だれも笑わなかった。"}, {"t": "p", "h": "今夜は、だれも逃げなかった。"}, {"t": "p", "h": "「ひとつに置けば、ひとつの目で全部が決まる。三つに分ければ、三つの目のうち、どれかが残る」"}, {"t": "p", "h": "「残らんかもしれんぞ」"}, {"t": "p", "h": "ナオ吉の声だった。"}, {"t": "p", "h": "「残らんかもしれん。三つとも外れることは、ある。わしは、そうならんとは言わん」"}, {"t": "p", "h": "「じゃあ、どうすりゃいい」"}, {"t": "p", "h": "「<strong>選ぶのは、数字ではない</strong>」"}, {"t": "p", "h": "帳面を閉じる音がした。"}, {"t": "p", "h": "「わしは、勘定をしただけじゃ。仲間を分ける勘定は、はじめてやった。……やってみて、わかったことがある。これは、勘定の外じゃ」"}, {"t": "p", "h": "ネネは、その言葉を、しばらく口の中で転がしていた。"}, {"t": "p", "h": "<strong>勘定の外。</strong>"}, {"t": "p", "h": "丘で待っていた六十年も、たぶん、そこにあった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "「三つ、あるんだよね」"}, {"t": "p", "h": "よしゆきだった。声がちがった。顔を上げている声である。"}, {"t": "p", "h": "「おれたちが行った先が、うろこ堂になる。三つとも」"}, {"t": "p", "h": "「なんだそりゃ」とヒロが言った。"}, {"t": "p", "h": "「待つ場所が、三つになる」"}, {"t": "p", "h": "ヒロが、口を開けて、閉じる気配がした。"}, {"t": "p", "h": "「……どうせ、ばらばらになったら、終わりだろ」"}, {"t": "p", "h": "だれも、なにも言わなかった。"}, {"t": "p", "h": "からから、と坂の下で音がした。車輪を、一度だけ回した音だった。"}, {"t": "p", "h": "「オレ、運ぶよ」"}, {"t": "p", "h": "ラリオだった。"}, {"t": "p", "h": "「なんの話か、わかってねえだろ」"}, {"t": "p", "h": "「わかんない」ラリオは言った。「でも、荷物、あるんでしょ。運ぶよ。配達ってさ、届くまでが仕事なんだよ」"}, {"t": "p", "h": "ネネは、顔を上げた。"}, {"t": "p", "h": "同じことを、前にも言われた。丘の上で、この男に。本人は、それを覚えていない。"}, {"t": "p", "h": "「三か所だぞ」とヒロが言った。"}, {"t": "p", "h": "「三か所」少し間があった。「うん。行けるよ、たぶん」"}, {"t": "p", "h": "ネネは、暗がりの中で、少し笑った。"}, {"t": "p", "h": "この男は、なにも覚えていない。覚えていないのに、いちばん覚えている。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "そこから先は、早かった。"}, {"t": "p", "h": "「ネネさんは、いちばんあったかいとこ」とヒロが言った。「みちるの家だな」"}, {"t": "p", "h": "「あたしは、どこでもいいよ」"}, {"t": "p", "h": "「よくねえだろ」"}, {"t": "p", "h": "「……よくないね」"}, {"t": "p", "h": "ネネは、そう言い直した。"}, {"t": "p", "h": "「じゃあ、おれが行く」とよしゆきが言った。「背負うから。人間がいちばん多いとこだし、おれが行くのがいい」"}, {"t": "p", "h": "ネネは、それ以上なにも言わなかった。"}, {"t": "p", "h": "「喫茶は、オレとじいさんだな」とヒロが言った。「食い物は天国だ。隠れるほうは地獄だけどな」"}, {"t": "p", "h": "「毎晩、同じ順番で掃除するんじゃろう」カク爺は、髭を撫でた。「同じ順番なら、数えられる」"}, {"t": "p", "h": "残ったのは、南だった。"}, {"t": "p", "h": "十八日の道である。だれも、すぐには言わなかった。"}, {"t": "p", "h": "坂の下で、ナオ吉が立ち上がる気配がした。"}, {"t": "p", "h": "「オレは、南」"}, {"t": "p", "h": "短かった。"}, {"t": "p", "h": "だれも、理由を訊かなかった。ネネも、訊かなかった。"}, {"t": "p", "h": "この男が、毎朝どこかへ出かけていることを、ネネは知っている。一階にいると、いちばん早く出ていく足音が聞こえるからだ。どこへ行っているのかは、知らない。"}, {"t": "p", "h": "知らないままでいることは、できる。"}, {"t": "p", "h": "「……手紙、頼んでいい?」"}, {"t": "p", "h": "よしゆきの声だった。"}, {"t": "p", "h": "「ソラに」"}, {"t": "p", "h": "「わかってる」"}, {"t": "p", "h": "それきりだった。"}, {"t": "p", "h": "「なあ。南の店が、捨てる店だったらどうする」とヒロが言った。"}, {"t": "p", "h": "「つばめ堂は、棚の奥を掃除しねえ」"}, {"t": "p", "h": "「なんでわかる」"}, {"t": "p", "h": "「わかるんだよ」"}, {"t": "p", "h": "ヒロは、それ以上訊かなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "解散したのは、夜中だった。"}, {"t": "p", "h": "よしゆきが背負いに来るまで、ネネは坂の途中に座っていた。"}, {"t": "p", "h": "三つに分かれる。"}, {"t": "p", "h": "言ったのは自分ではない。けれども、あの言葉を言わせたのは、自分の昔話だった。"}, {"t": "p", "h": "六十年、動かずにいた。そのおかげで、この子は丘まで来られた。今度は、自分も動く。"}, {"t": "p", "h": "<strong>動いても、ここにいたことは、残るだろうか。</strong>"}, {"t": "p", "h": "答えは、出なかった。"}, {"t": "p", "h": "坂の下から、足音が近づいてきた。"}, {"t": "p", "h": "「ネネさん。行くよ」"}, {"t": "p", "h": "「そうかい」"}, {"t": "p", "h": "ネネは、両手を差し出した。"}, {"t": "opener", "i": 11, "alt": "第十一章　本の城"}, {"t": "p", "h": "五十九日目。引っ越しの前日である。"}, {"t": "p", "h": "よしゆきは、朝から壁の隙間の奥にいた。"}, {"t": "p", "h": "この日は、人間が四人いた。おじいさんと、大人がふたりと、みちる。"}, {"t": "p", "h": "大人たちは、箱に本を詰めていく。みちるは、手伝っているのは最初の半刻だけで、あとは床に座りこんで、本で城を建てていた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "夕方になった。本棚の第三段も、空になった。カク爺は前の晩に荷物を移してある。"}, {"t": "p", "h": "「みちるー。そっちの、上のほう取って」"}, {"t": "p", "h": "みちるが立ち上がって、棚に手を伸ばした。背伸びをして、指の先が、湿気で膨らんだ分厚い本にかかった。"}, {"t": "p", "h": "引き出す。"}, {"t": "p", "h": "重さで、手からすべった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "本は、床でぱっくり口を開いた。"}, {"t": "p", "h": "中から、白いものが一枚、舞い上がった。"}, {"t": "p", "h": "蝶のように、ひらひらと流れる。"}, {"t": "p", "h": "<strong>二年前と、同じだった。</strong>"}, {"t": "p", "h": "ちがっていたのは、向きである。"}, {"t": "p", "h": "あのとき、紙はよしゆきの家の玄関先へ落ちた。今度は、床をすべって、みちるの膝の前で止まった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "みちるが、それを拾った。"}, {"t": "p", "h": "よしゆきは、動かなかった。隙間の奥で、息だけをしていた。"}, {"t": "p", "h": "捨てる、とよしゆきは思った。紙くずだと思って、捨てる。そのほうがいい。"}, {"t": "p", "h": "みちるは、立ち上がった。帳場へ行った。引き出しを開けて、なにかを取り出した。"}, {"t": "p", "h": "<strong>ルーペだった。</strong>"}, {"t": "p", "h": "みちるは、窓のそばへ行った。紙を、窓枠の上に置いた。ルーペを構えた。顔を近づけた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "長かった。"}, {"t": "p", "h": "みちるは、一度、顔を上げた。それから、もう一度、のぞきこんだ。"}, {"t": "p", "h": "二度目のほうが、長かった。"}, {"t": "p", "h": "読んでいるのだ、とよしゆきは思った。"}, {"t": "p", "h": "一度目は字を見て、二度目は意味を読んでいる。自分が本を読むときと、同じ順番だった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "みちるは、ルーペを置いた。"}, {"t": "p", "h": "しばらく、窓の外を見ていた。"}, {"t": "p", "h": "それから、振り返って、店の中をゆっくり見まわした。天井のあたりから、棚、床、帳場の下、奥の壁――"}, {"t": "p", "h": "よしゆきは、息を止めた。"}, {"t": "p", "h": "みちるの目が、壁の隙間の前で、止まった。"}, {"t": "p", "h": "隙間の奥は暗い。外からは、なにも見えないはずだった。見えないはずだと、二十年、思ってきた。"}, {"t": "p", "h": "やがて、目をそらした。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "みちるは、三つのことをした。"}, {"t": "p", "h": "ひとつ。拾った紙を、落ちていた本の、もとの頁のあいだに戻した。折り目をつけないように、そっと挟んだ。"}, {"t": "p", "h": "ふたつ。その本を、箱に入れなかった。空になった本棚の、第三段の真ん中に、一冊だけ置いた。表紙を上にして、まっすぐに。"}, {"t": "p", "h": "みっつ。帳場へ行って、引き出しから、マッチ箱をひとつ取った。それから、ポケットから焼き菓子のかけらを出した。"}, {"t": "p", "h": "みちるは、「みちる」と書いてある箱のところへ行った。"}, {"t": "p", "h": "いちばん上に、マッチ箱を置いた。その横に、菓子のかけらを置いた。"}, {"t": "p", "h": "蓋を閉めた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "「みちるー。帰るよー」"}, {"t": "p", "h": "「はーい」"}, {"t": "p", "h": "みちるは、立ち上がった。"}, {"t": "p", "h": "一度だけ、空の棚のほうを見た。一冊だけ置いた本を見たのか、その奥を見たのかは、わからなかった。"}, {"t": "p", "h": "それから、走っていった。"}, {"t": "p", "h": "戸が閉まった。鍵の音がした。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "よしゆきは、しばらく動けなかった。"}, {"t": "p", "h": "動けるようになってから、土間へ行った。"}, {"t": "p", "h": "「みちる」と書かれた箱の、いちばん上。蓋のすぐ内側に、マッチ箱がある。"}, {"t": "p", "h": "よしゆきの寝台と、同じ大きさのものだった。"}, {"t": "p", "h": "その横に、焼き菓子のかけら。"}, {"t": "p", "h": "ネズミに、と思って置いたのかもしれない。"}, {"t": "p", "h": "そうでないのかもしれない。"}, {"t": "p", "h": "よしゆきは、その二つを、長いこと見ていた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "よしゆきは、箱から離れた。"}, {"t": "p", "h": "離れぎわに、もう一度だけ振り返った。"}, {"t": "p", "h": "<strong>あの子には、見えていたのだろうか。</strong>"}, {"t": "p", "h": "わからないまま、明日になる。"}, {"t": "opener", "i": 12, "alt": "第十二章　柱"}, {"t": "p", "h": "最後の夜になった。"}, {"t": "p", "h": "荷造りは、とっくに終わっていた。"}, {"t": "p", "h": "六人は、壁裏の一階に集まっていた。"}, {"t": "p", "h": "だれも、口をきかなかった。"}, {"t": "p", "h": "ヒロは、それが嫌だった。黙っているのは、腹が減るのと同じくらい、体に悪い。"}, {"t": "p", "h": "「なあ」"}, {"t": "p", "h": "ヒロは言った。"}, {"t": "p", "h": "「測ろうぜ」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "「なにを」"}, {"t": "p", "h": "よしゆきが、そう言った。"}, {"t": "p", "h": "「決まってんだろ」"}, {"t": "p", "h": "二年前と、同じやりとりだった。"}, {"t": "p", "h": "ヒロは、爪楊枝を持ってきた。カク爺が、鉛筆を構えた。ナオ吉が、柱の前を指さした。"}, {"t": "p", "h": "「立て」"}, {"t": "p", "h": "よしゆきは、柱を背にして立った。かかとをつけて、背筋を伸ばす。"}, {"t": "p", "h": "ヒロは、頭のてっぺんに、爪楊枝を水平に当てる。手が少し震えた。震えたのは、寒いからである。ヒロは、そういうことにした。"}, {"t": "p", "h": "カク爺が、鉛筆の先を当てた。"}, {"t": "p", "h": "「九センチじゃな」"}, {"t": "p", "h": "線は、二本のままだった。"}, {"t": "p", "h": "ヒロは、みんなの顔を見た。"}, {"t": "p", "h": "だれも、がっかりしていなかった。"}, {"t": "p", "h": "伸びていないほうが、いい夜もある。"}, {"t": "p", "h": "――そう思ってから、ヒロは、自分の考えを打ち消した。柄でもない。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "よしゆきは、自分の墨とペンを取ってきた。"}, {"t": "p", "h": "柱の前にしゃがんだ。"}, {"t": "p", "h": "「ここに、書こう」"}, {"t": "p", "h": "「どこだよ」"}, {"t": "p", "h": "「ここ」"}, {"t": "p", "h": "よしゆきは、二本の線のあいだを指さした。"}, {"t": "p", "h": "「名前」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "しばらく、だれも動かなかった。"}, {"t": "p", "h": "最初に手を出したのは、ネネだった。"}, {"t": "p", "h": "「あたしからでいいかい」"}, {"t": "p", "h": "老女は、杖を床に置いて、柱の前に座った。ペンを両手で持つ。"}, {"t": "p", "h": "九センチの線のすぐ下から、下へ向かって縦に書く。"}, {"t": "p", "h": "ネネの手は、ゆっくり動いた。一画ごとに、いったん止まる。止まってから、次を引く。線は、まっすぐにならなかった。"}, {"t": "p", "h": "いちばん時間がかかった。"}, {"t": "p", "h": "書き終えて、ネネはペンを置いた。"}, {"t": "p", "h": "「ふう」"}, {"t": "p", "h": "それだけ言った。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "カク爺の字は、小さく、角が揃っていた。"}, {"t": "p", "h": "ナオ吉は、一文字書いては止まった。指の関節が、白くなっていた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "「オレな」ヒロは、ペンを受け取ってから言った。「字、でかいんだよ」"}, {"t": "p", "h": "「知ってる」とよしゆきが言った。"}, {"t": "p", "h": "「はみ出すぞ」"}, {"t": "p", "h": "「はみ出していいよ」"}, {"t": "p", "h": "ヒロは、書いた。"}, {"t": "p", "h": "思ったとおり、でかかった。一文字目で、もう半分まで使っていた。二文字目は、線の手前でむりやり曲げて止めた。"}, {"t": "p", "h": "ラリオが、うしろからのぞきこんだ。"}, {"t": "p", "h": "「オレも書く?」"}, {"t": "p", "h": "「書け」"}, {"t": "p", "h": "ラリオは、ペンを受け取った。"}, {"t": "p", "h": "そして、するすると書いた。止まらなかった。迷わなかった。手が、勝手に動いていた。"}, {"t": "p", "h": "書き終えて、ラリオは、自分の書いた字を見た。"}, {"t": "p", "h": "首をかしげた。"}, {"t": "p", "h": "「これ、だれ?」"}, {"t": "p", "h": "だれも、笑わなかった。"}, {"t": "p", "h": "「お前だよ」とヒロが言った。"}, {"t": "p", "h": "「あー」ラリオは、うなずいた。「そっか」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "最後が、よしゆきだった。"}, {"t": "p", "h": "自分の名前を書いた。細かい、いつもの字である。"}, {"t": "p", "h": "それから、名前の下に、三行書いた。"}, {"t": "p", "h": "みちるの家。"}, {"t": "p", "h": "喫茶ひだまり。"}, {"t": "p", "h": "南町三丁目　古書つばめ堂。"}, {"t": "p", "h": "六人ぶんの名前と、三つの行き先が、二本の線のあいだに入っていた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "それから、だれも、明日の話をしなかった。よしゆきが本を読み、ネネが途中で眠り、カク爺が複利の話をしかけて、やめた。"}, {"t": "p", "h": "ヒロは、そのとき、ひとつ思った。"}, {"t": "p", "h": "<strong>どうせ、また会う。</strong>"}, {"t": "p", "h": "いつもの「どうせ」のつもりだった。"}, {"t": "p", "h": "けれども、口の中で転がしてみると、その言葉は、いつもとちがう味がした。"}, {"t": "p", "h": "ヒロは、それを飲みこんだ。言わなかった。言えば、安っぽくなる。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "みんなが寝てから、ヒロは腹が減って目を覚ました。"}, {"t": "p", "h": "カク爺が、屋根裏へ上がっていくところだった。手に、なにか持っていた。"}, {"t": "p", "h": "<strong>青いビーズだった。</strong>"}, {"t": "p", "h": "戻ってきたとき、老人の手には、なにもなかった。"}, {"t": "p", "h": "本棚の第三段に、二年間ずっと置いてあったものである。"}, {"t": "p", "h": "ヒロは、なにも言わなかった。"}, {"t": "p", "h": "言わないほうがいい種類のことだと、これでも、わかる。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "朝まで、あと少しだった。"}, {"t": "p", "h": "ヒロは、暗がりの中で、柱のほうを見た。"}, {"t": "p", "h": "線が二本ある。"}, {"t": "p", "h": "そのあいだに、いまは、名前がある。"}, {"t": "p", "h": "<strong>二本の線のあいだが、少しだけ埋まった。</strong>"}, {"t": "opener", "i": 13, "alt": "終章　壁の隙間"}, {"t": "p", "h": "朝だ。"}, {"t": "p", "h": "人間が来る。四人。靴の音が四つ。"}, {"t": "p", "h": "箱が運ばれていく。三つの方向へ。"}, {"t": "p", "h": "ラリオは、屋根裏の穴から、それを見ている。"}, {"t": "p", "h": "だれの荷物が、どの箱に入ったのか。"}, {"t": "p", "h": "ラリオは、覚えていない。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "店の中で、よしゆきがなにかしている。"}, {"t": "p", "h": "棚だ。空っぽの棚に、一冊だけ本が置いてある。その頁に、紙を一枚はさんでいる。"}, {"t": "p", "h": "ラリオは、近づいて、のぞきこむ。"}, {"t": "p", "h": "米粒ほどの字が、びっしり書いてある。"}, {"t": "quote", "h": "この本を読むだれかへ。<br><br>うろこ堂は、閉まりました。<br><br>本棚のうしろの、壁の隙間の、柱を見てください。<br>八センチと九センチのあいだに、ぼくたちの名前と、行き先が書いてあります。<br><br>迷ったら、裏口の坂の下で待っていてください。<br>荷車を押した配達屋が通ります。<br>「だれ?」と訊かれても、あきらめないで、もう一度名乗ってください。<br><br>待っています。三か所で、何年でも。"}, {"t": "p", "h": "「なに、これ」"}, {"t": "p", "h": "「手紙」"}, {"t": "p", "h": "「だれの?」"}, {"t": "p", "h": "「まだ、だれのでもない」"}, {"t": "p", "h": "よしゆきは、本を閉じる。表紙を上にして、まっすぐに置き直す。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "坂の下のほうで、声がする。"}, {"t": "p", "h": "「ラリオ」"}, {"t": "p", "h": "見ると、よしゆきがいる。背中に、おばあさんを背負っている。杖が、背中から突き出している。"}, {"t": "p", "h": "「頼むな」"}, {"t": "p", "h": "「あー」"}, {"t": "p", "h": "「三か所。ぜんぶ、回れる?」"}, {"t": "p", "h": "「回れるよ」ラリオは言う。「足が、覚えるから」"}, {"t": "p", "h": "よしゆきが、笑う。それから、紙を一枚くれる。"}, {"t": "p", "h": "<strong>届けて</strong>"}, {"t": "p", "h": "と書いてある。"}, {"t": "p", "h": "「うん」"}, {"t": "p", "h": "ラリオは、それを、上着の内側に入れる。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "丸い眼鏡の男が、手を上げる。"}, {"t": "p", "h": "「じゃあな」"}, {"t": "p", "h": "「あー。うん」"}, {"t": "p", "h": "白い髭の年寄りが、こっちを見て、うなずく。なにも言わない。"}, {"t": "p", "h": "痩せた男が、坂の下に立っている。背中に、薄い束を背負っている。紙の束だ。"}, {"t": "p", "h": "その男は、こっちを見なかった。"}, {"t": "p", "h": "見ないまま、南のほうへ歩きだす。"}, {"t": "p", "h": "歩き方が、少し速い。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "だれもいなくなる。"}, {"t": "p", "h": "店の戸が閉まる。鍵の音がする。"}, {"t": "p", "h": "静かだ。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ラリオは、屋根裏から降りて、荷車のところへ行く。"}, {"t": "p", "h": "荷台に、なにか載っている。"}, {"t": "p", "h": "小さい。丸い。青い。"}, {"t": "p", "h": "ラリオは、それをつまみ上げる。"}, {"t": "p", "h": "宛名は、ない。"}, {"t": "p", "h": "だれの荷物だろう。"}, {"t": "p", "h": "節穴から、光が入っている。ラリオは、その光に、青いものをかざす。"}, {"t": "p", "h": "壁に、点が落ちる。青い点だ。"}, {"t": "p", "h": "「きれいだね」"}, {"t": "p", "h": "ラリオは、しばらく、それを見ている。"}, {"t": "p", "h": "だれの、とは訊かない。"}, {"t": "p", "h": "荷物なら、運ぶ。"}, {"t": "p", "h": "届くまでが、仕事だから。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "荷車を押して、壁の隙間を出る。"}, {"t": "p", "h": "出ようとして、足が止まる。"}, {"t": "p", "h": "柱がある。線が二本ある。"}, {"t": "p", "h": "そのあいだに、なにか書いてある。"}, {"t": "p", "h": "ラリオは、近づいて、読む。"}, {"t": "p", "h": "名前だ。六つある。"}, {"t": "p", "h": "知らない名前が六つ、縦に並んでいる。大きいのもあるし、小さいのもある。ふるえているのもある。"}, {"t": "p", "h": "そのうちのひとつを、ラリオは、しばらく見ている。"}, {"t": "p", "h": "それから、言う。"}, {"t": "p", "h": "「……オレだ」"}, {"t": "p", "h": "なんで自分の名前が、こんなところに書いてあるのか。"}, {"t": "p", "h": "わからない。"}, {"t": "p", "h": "わからないけど、ここにある。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "坂を下りる。"}, {"t": "p", "h": "からから、からから。"}, {"t": "p", "h": "坂の下に、だれかいる。"}, {"t": "p", "h": "小さい。ラリオと同じくらいの背丈だ。"}, {"t": "p", "h": "立っている。動かない。手に、なにか持っている。"}, {"t": "p", "h": "紙だ。古い紙だ。端が茶色くなって、折り目のところが柔らかくなっている。"}, {"t": "p", "h": "米粒ほどの字が書いてある。"}, {"t": "p", "h": "ラリオは、荷車を止める。"}, {"t": "p", "h": "その者の前に立つ。"}, {"t": "p", "h": "にこにこする。"}, {"t": "p", "h": "「……だれ?」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "その日の夜、はじめて雪が降った。"}, {"t": "p", "h": "その家は、空き家になった。"}, {"t": "p", "h": "第三段の真ん中に、本が一冊だけ残っている。"}, {"t": "p", "h": "その奥の、壁の隙間。"}, {"t": "p", "h": "その家の柱に、鉛筆で引いた線が二本ある。"}, {"t": "p", "h": "八センチと、九センチ。"}, {"t": "p", "h": "そのあいだの、たった一センチ。"}, {"t": "p", "h": "そこには、町がひとつと、川がひとつと、橋が三つと、嵐がひとつと、猫が一匹と、トビが一羽と、六十年のあいだ本の中で待っていた手紙が一通と――そして、六つの名前と、三つの行き先が入っている。"}, {"t": "p", "h": "深く沈んだ足跡も、並んで歩いた足跡も、南へ急いだ足跡も、荷車のわだちも、その夜の雪が埋めた。"}, {"t": "p", "h": "名前だけが、同じ一センチに並んでいる。"}, {"t": "end", "h": "了"}, {"t": "next", "h": "<span class=\"lead\">つぎの一冊</span><a href=\"kiku.html\">『聞いてるか』へ</a>"}], "chapters": [{"title": "序章　貼り紙", "b": 0}, {"title": "第一章　土間", "b": 45}, {"title": "第二章　本棚の第三段", "b": 93}, {"title": "第三章　台所", "b": 133}, {"title": "第四章　物置", "b": 165}, {"title": "第五章　屋根裏", "b": 224}, {"title": "第六章　節穴", "b": 274}, {"title": "第七章　裏手", "b": 317}, {"title": "第八章　本のあいだ", "b": 369}, {"title": "第九章　裏口の坂", "b": 414}, {"title": "第十章　坂の途中", "b": 465}, {"title": "第十一章　本の城", "b": 566}, {"title": "第十二章　柱", "b": 634}, {"title": "終章　壁の隙間", "b": 728}]};

/* ---------- ruler ---------- */
const MOTIF = 'rooms';
(function drawRuler(){
  const svg = document.getElementById('rulerSvg');
  let s = '';
  if(MOTIF==='rooms'){
    const n = DATA.chapters.length, gap = 4, w = (284 - gap*(n-1))/n;
    for(let i=0;i<n;i++){
      const x = 8 + i*(w+gap);
      s += `<rect class="win" id="win${i}" x="${x.toFixed(1)}" y="7" width="${w.toFixed(1)}" height="13" rx="1.5"/>`;
    }
    s += '<g id="finalmark" style="display:none"></g><g id="mark" style="display:none"></g>';
  } else if(MOTIF==='route'){
    s += '<line class="rulerline" x1="8" y1="20" x2="292" y2="20" stroke-dasharray="5 5"/>';
    for(let i=0;i<=5;i++){
      const x = 8 + (284*i/5);
      s += `<circle cx="${x}" cy="20" r="2.2" fill="none" stroke="#5c5343" stroke-width="1"/>`;
    }
    s += '<g id="finalmark"><circle cx="292" cy="20" r="4.4" fill="#a8402c"/></g>';
    s += '<g id="mark" transform="translate(8,0)"><circle cx="0" cy="20" r="3.4" fill="#4d5157"/></g>';
  } else {
    s += '<line class="rulerline" x1="8" y1="20" x2="292" y2="20"/>';
    for(let i=0;i<=10;i++){
      const x = 8 + (284*i/10), big = (i===0||i===10);
      s += `<line class="tick${big?'':' mm'}" x1="${x}" y1="${big?9:14}" x2="${x}" y2="20"/>`;
    }
    s += '<g id="finalmark"><line x1="292" y1="4" x2="292" y2="24"/></g>';
    s += '<g id="mark" transform="translate(8,0)"><line x1="0" y1="6" x2="0" y2="24"/></g>';
  }
  svg.innerHTML = s;
})();

const BM_KEY = 'shiori:' + DATA.title;
DATA.blocks.forEach((b,i)=>{ b.src=i; });
let bm = null;
try{ const v = localStorage.getItem(BM_KEY); bm = v ? JSON.parse(v) : null; }catch(e){ bm = null; }
function saveBm(){ try{ if(bm) localStorage.setItem(BM_KEY, JSON.stringify(bm)); else localStorage.removeItem(BM_KEY); }catch(e){} }
function anchorOf(p){
  const pg = pages[p]; if(!pg) return null;
  for(const b of pg){ if(b && b.src!=null) return {s:b.src, p:b.part||0}; }
  if(pg[0] && pg[0].t==='toc') return {toc:true};
  return null;
}
function pageOfAnchor(a){
  if(!a) return -1;
  if(a.toc) return pages.findIndex(pg=>pg[0] && pg[0].t==='toc');
  for(let p=1;p<pages.length;p++) for(const b of pages[p]) if(b && b.src===a.s && (b.part||0)>=a.p) return p;
  for(let p=1;p<pages.length;p++) for(const b of pages[p]) if(b && b.src!=null && b.src>=a.s) return p;
  return -1;
}
function visiblePages(){ return (spread && idx>0) ? [idx, idx+1] : [idx]; }
function toggleBm(){
  const bp = pageOfAnchor(bm), vis = visiblePages();
  if(bm && vis.indexOf(bp)>=0){ bm = null; }
  else { const a = anchorOf(idx); if(!a) return; bm = a; }
  saveBm(); update(0);
}
function goBm(){ const p = pageOfAnchor(bm); if(p<0) return; idx = p; closeSheets(); update(1); }
function renderToc(host){
  const w = document.createElement('div'); w.className='tocpage';
  w.innerHTML = '<h2>目次</h2>';
  DATA.chapters.forEach((c,i)=>{
    const parts = c.title.split('\u3000');
    const row = document.createElement('div'); row.className='ti';
    const b = document.createElement('button'); b.className='tb'; b.type='button';
    b.setAttribute('aria-label', c.title.replace('\u3000',' ')+'へ移動');
    b.innerHTML = '<span class="n">'+parts[0]+'</span><span class="t">'+(parts[1]||'')+'</span>';
    b.onclick = (e)=>{ e.stopPropagation(); idx = chapPage[i]||1; update(1); };
    row.appendChild(b);
    row.insertAdjacentHTML('beforeend','<span class="d" aria-hidden="true"></span><span class="p" aria-hidden="true">'+(chapPage[i]||'')+'</span>');
    w.appendChild(row);
  });
  host.appendChild(w);
  let fs = 1;
  w.style.fontSize = fs+'em';
  const page = host.closest('.page');
  const fits = ()=>{ const r=w.getBoundingClientRect(), pr=page.getBoundingClientRect(); return vertical ? r.left >= pr.left+8 && w.scrollHeight<=w.clientHeight+2 : r.bottom <= pr.bottom-8; };
  let guard=0;
  while(!fits() && fs>0.5 && guard++<20){ fs -= 0.05; w.style.fontSize = fs.toFixed(2)+'em'; }
}

/* ---------- blocks -> DOM ---------- */
function makeEl(b){
  let el;
  if(b.t==='h2'){ el=document.createElement('h2'); el.innerHTML=b.h; }
  else if(b.t==='quote'){ el=document.createElement('blockquote'); el.innerHTML=b.h; }
  else if(b.t==='sep'){ el=document.createElement('div'); el.className='sep'; el.innerHTML=SEPSVG; }
  else if(b.t==='opener'){ el=document.createElement('div'); el.className='opener'; const im=document.createElement('img'); im.src=IMGS[b.i]; im.alt=b.alt.replace('\u3000',' '); el.appendChild(im); }
  else if(b.t==='end'){ el=document.createElement('p'); el.className='endmark'; el.textContent=b.h; }
  else if(b.t==='next'){ el=document.createElement('div'); el.className='nextnav'; el.innerHTML=b.h; }
  else { el=document.createElement('p'); el.innerHTML=b.h; }
  return el;
}
function contentBox(el){
  const r = el.getBoundingClientRect(), cs = getComputedStyle(el);
  return {
    left:   r.left   + parseFloat(cs.paddingLeft   || 0),
    right:  r.right  - parseFloat(cs.paddingRight  || 0),
    top:    r.top    + parseFloat(cs.paddingTop    || 0),
    bottom: r.bottom - parseFloat(cs.paddingBottom || 0)
  };
}
/* scrollWidth is unreliable in vertical-rl (content overflows leftward),
   so compare the last child's far edge with the page's content box. */
function over(el){
  const kids = el.children;
  if(!kids.length) return false;
  const box = contentBox(el);
  const k = kids[kids.length-1], r = k.getBoundingClientRect(), ks = getComputedStyle(k);
  return vertical
    ? (r.left - parseFloat(ks.marginLeft || 0)) < box.left - 0.5
    : (r.bottom + parseFloat(ks.marginBottom || 0)) > box.bottom + 0.5;
}
function splitText(t){
  const out=[]; let cur='';
  for(let i=0;i<t.length;i++){
    cur+=t[i];
    if('。！？」'.indexOf(t[i])>=0 && cur.length>=40){ out.push(cur); cur=''; }
  }
  if(cur) out.push(cur);
  return out.length?out:[t];
}

/* ---------- pagination ---------- */
function paginate(){
  const m = document.getElementById('measure'), mc = document.getElementById('mcol');
  const ref = document.getElementById('pageA').getBoundingClientRect();
  m.className='page';
  m.style.width = ref.width+'px';
  m.style.height = ref.height+'px';
  mc.innerHTML='';

  pages = [[{t:'cover'}],[{t:'toc'}]];
  chapPage = [];
  let cur = [];
  const push = ()=>{ if(cur.length){ pages.push(cur); cur=[]; } mc.innerHTML=''; };

  const esc = t => t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const drop = el => { if(el && el.parentNode) el.parentNode.removeChild(el); };

  // 1ページに単独で収まらない塊を、収まる単位に割って順番どおり流しこむ
  const flowSplit = (b)=>{
    let part = 0;
    if(b.t==='quote'){                    // 手紙は行単位で分ける
      const trim = a=>{ const c=a.slice();
        while(c.length && c[0]==='') c.shift();
        while(c.length && c[c.length-1]==='') c.pop();
        return c; };
      const lines = b.h.split('<br>');
      let buf=[], node=null;
      for(const ln of lines){
        const trial = buf.concat([ln]);
        drop(node);
        node = makeEl({t:'quote', h: trim(trial).join('<br>')});
        mc.appendChild(node);
        if(over(mc) && trim(buf).length){
          drop(node);
          cur.push({t:'quote', h: trim(buf).join('<br>'), src:b.src, part:part++});
          push();
          buf = (ln==='') ? [] : [ln];
          node = buf.length ? makeEl({t:'quote', h: ln}) : null;
          if(node) mc.appendChild(node);
        } else {
          buf = trial;
        }
      }
      if(trim(buf).length) cur.push({t:'quote', h: trim(buf).join('<br>'), src:b.src, part:part++});
      return;
    }
    for(const c of splitText(makeEl(b).textContent)){   // 段落は文単位で分ける
      const blk = {t:'p', h: esc(c), src:b.src, part:part++};
      let node = makeEl(blk);
      mc.appendChild(node);
      if(over(mc) && cur.length){ drop(node); push(); node = makeEl(blk); mc.appendChild(node); }
      cur.push(blk);
    }
  };

  const feed = (b, chIndex)=>{
    if(b.t==='opener'){ push(); if(chIndex!=null) chapPage[chIndex]=pages.length; pages.push([b]); mc.innerHTML=''; return; }
    const el = makeEl(b);
    mc.appendChild(el);
    if(over(mc)){
      mc.removeChild(el);
      if(cur.length) push();
      mc.appendChild(el);
      if(over(mc)){                       // ページ丸ごと使っても収まらない
        mc.removeChild(el);
        if(chIndex!=null) chapPage[chIndex] = pages.length;
        flowSplit(b);
        return;
      }
    }
    if(chIndex!=null) chapPage[chIndex] = pages.length;
    cur.push(b);
  };

  const chStart = {};
  DATA.chapters.forEach((c,i)=>{ chStart[c.b]=i; });
  DATA.blocks.forEach((b,i)=> feed(b, chStart[i]!=null?chStart[i]:null));
  push();

  // verify: re-measure every page and move any spilled block to the next one
  for(let p=1;p<pages.length;p++){
    if(pages[p][0] && (pages[p][0].t==='toc' || pages[p][0].t==='opener')) continue;
    mc.innerHTML='';
    const keep=[]; const spill=[];
    for(const b of pages[p]){
      if(spill.length){ spill.push(b); continue; }
      const el=makeEl(b); mc.appendChild(el);
      if(over(mc) && keep.length){ mc.removeChild(el); spill.push(b); }
      else keep.push(b);
    }
    if(spill.length){
      pages[p]=keep;
      pages.splice(p+1,0,spill);
      for(let c=0;c<chapPage.length;c++) if(chapPage[c]>p) chapPage[c]++;
    }
  }
  mc.innerHTML='';
  if(pages.length%2===0 && spread) pages.push([{t:'blank'}]);
}

/* ---------- render ---------- */
function renderPage(hostPage, page){
  const host = hostPage.querySelector('.col');
  host.innerHTML='';
  hostPage.classList.remove('blank');
  if(!page){ hostPage.classList.add('blank'); return; }
  if(page[0] && page[0].t==='cover'){
    host.innerHTML = '<div class="opener" style="background:#e0d8c4"><img alt="'+DATA.title+'　'+DATA.sub+'" src="'+COVER+'"></div>';
    return;
  }
  if(page[0] && page[0].t==='blank'){ hostPage.classList.add('blank'); return; }
  if(page[0] && page[0].t==='toc'){ renderToc(host); return; }
  page.forEach(b=> host.appendChild(makeEl(b)));
}

function update(dir){
  const A=document.getElementById('pageA'), B=document.getElementById('pageB');
  if(spread && idx>0 && idx%2===0) idx--;
  idx = Math.max(0, Math.min(pages.length-1, idx));

  if(spread && idx>0){ renderPage(A,pages[idx]); renderPage(B,pages[idx+1]); }
  else { renderPage(A,pages[idx]); renderPage(B,null); }

  if(dir){
    const dx = (dir>0 ? (vertical?-14:14) : (vertical?14:-14))+'px';
    [A,B].forEach(el=>{ el.style.setProperty('--dx',dx); el.classList.remove('flip'); void el.offsetWidth; el.classList.add('flip'); });
  }

  const bp = pageOfAnchor(bm), vis = visiblePages();
  A.classList.toggle('marked', bm!=null && bp===vis[0]);
  B.classList.toggle('marked', bm!=null && vis.length>1 && bp===vis[1]);
  const here = bm!=null && vis.indexOf(bp)>=0;
  const bb = document.getElementById('bmBtn');
  bb.setAttribute('aria-pressed', String(here));
  bb.disabled = (idx===0 && !spread) || (idx===0);
  bb.setAttribute('aria-label', here ? 'しおりを外す' : 'このページにしおりをはさむ');
  document.getElementById('bmJump').hidden = !(bm && bp>0 && !here);
  const bi = document.getElementById('bmItem');
  bi.hidden = !(bm && bp>0);
  if(bp>0) bi.textContent = 'しおりのページへ（' + bp + '）';
  const last = pages.length-1;
  try{ if(idx===last && last>0) localStorage.setItem('done:'+DATA.title,'1'); }catch(e){}
  const prog = last>0 ? idx/last : 0;
  document.getElementById('mark').setAttribute('transform','translate('+(8+284*prog)+',0)');
  document.getElementById('finalmark').classList.toggle('show', idx===last);
  if(MOTIF==='rooms'){
    let cur = 0;
    DATA.chapters.forEach((c,i)=>{ if(chapPage[i]!=null && chapPage[i] <= idx) cur = i; });
    DATA.chapters.forEach((c,i)=>{
      const el = document.getElementById('win'+i); if(!el) return;
      const off = (idx===last) || i < cur;
      el.classList.toggle('off', off);
      el.classList.toggle('now', !off && i===cur && idx>0);
    });
  }

  let name='';
  for(let i=0;i<DATA.chapters.length;i++){ if(chapPage[i]!=null && chapPage[i]<=idx) name=DATA.chapters[i].title; }
  document.getElementById('chapNow').textContent = idx===0 ? '' : name;
  document.getElementById('pageNow').textContent = idx===0 ? '表紙' : (idx + ' / ' + last);
  document.querySelectorAll('.toc-item').forEach(el=>{
    el.setAttribute('aria-current', String(Number(el.dataset.p)<=idx && (Number(el.dataset.next)>idx || el.dataset.next==='')));
  });
}

function go(step){ const n=idx+step*(spread&&idx>0?2:1); if(n<0||n>pages.length-1) return; idx=n; update(step); }
function next(){ go(1); } function prev(){ go(-1); }

/* ---------- column fitting ---------- */
function fitColumn(){
  const pa = document.getElementById('pageA'), cs = getComputedStyle(pa);
  const avail = vertical
    ? pa.clientHeight - parseFloat(cs.paddingTop)  - parseFloat(cs.paddingBottom)
    : pa.clientWidth  - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const n = CHARS[sizeIdx];
  let fs = Math.min(SIZES[sizeIdx], avail / (n * KERN));
  fs = Math.max(12.5, fs);
  const colw = Math.min(avail, Math.floor(fs * n * KERN));
  document.documentElement.style.setProperty('--fs', fs.toFixed(2)+'px');
  document.documentElement.style.setProperty('--colw', colw+'px');
}

/* ---------- layout ---------- */
function layout(keepBlock){
  spread = window.innerWidth >= 940 && window.innerHeight >= 420;
  document.body.classList.toggle('spread', spread);
  document.body.classList.toggle('vert', vertical);
  document.documentElement.style.setProperty('--fs', SIZES[sizeIdx]+'px');
  document.documentElement.style.setProperty('--lh', vertical? '1.95' : '2.05');
  requestAnimationFrame(()=>{
    fitColumn();
    paginate();
    if(keepBlock!=null){
      let found=0;
      for(let p=1;p<pages.length;p++){ if(pages[p].some(b=>b===keepBlock)){ found=p; break; } }
      idx = found || Math.min(idx, pages.length-1);
    }
    buildToc();
    update(0);
  });
}
function currentBlock(){ const p=pages[idx]; return p && p[0] && p[0].t!=='cover' ? p[0] : null; }

/* ---------- toc ---------- */
function buildToc(){
  const list=document.getElementById('tocList');
  list.innerHTML='';
  DATA.chapters.forEach((c,i)=>{
    const b=document.createElement('button');
    b.className='toc-item'; b.dataset.p=chapPage[i]||1;
    b.dataset.next = (chapPage[i+1]!=null? chapPage[i+1] : '');
    b.innerHTML='<span>'+c.title+'</span><span class="pg">'+(chapPage[i]||1)+'</span>';
    b.onclick=()=>{ idx=chapPage[i]||1; closeSheets(); update(1); };
    list.appendChild(b);
  });
}

/* ---------- sheets ---------- */
function closeSheets(){ document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('open')); }
try{ if(!/claude\.ai$/i.test(location.hostname) && !/^blob:/.test(location.href)) document.getElementById('homeLink').hidden=false; }catch(e){}
document.getElementById('bmBtn').onclick=toggleBm;
document.getElementById('bmJump').onclick=goBm;
document.getElementById('bmItem').onclick=goBm;
document.getElementById('tocBtn').onclick=()=>document.getElementById('tocSheet').classList.add('open');
document.getElementById('setBtn').onclick=()=>document.getElementById('setSheet').classList.add('open');
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheets);
document.querySelectorAll('.sheet').forEach(s=>s.addEventListener('click',e=>{ if(e.target===s) closeSheets(); }));

document.getElementById('dirSeg').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  const keep=currentBlock();
  vertical = b.dataset.dir==='v';
  document.querySelectorAll('#dirSeg button').forEach(x=>x.setAttribute('aria-pressed', String(x===b)));
  layout(keep);
};
document.getElementById('sizeSeg').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  const keep=currentBlock();
  sizeIdx=Number(b.dataset.size);
  document.querySelectorAll('#sizeSeg button').forEach(x=>x.setAttribute('aria-pressed', String(x===b)));
  layout(keep);
};

/* ---------- input ---------- */
/* 目次ページの項目がページ送りの領域の下にあっても押せるようにする */
function tocHit(e){
  if(!e || (!e.clientX && !e.clientY)) return false;
  const zs=document.querySelectorAll('.zone'); zs.forEach(z=>z.style.pointerEvents='none');
  const el=document.elementFromPoint(e.clientX,e.clientY);
  zs.forEach(z=>z.style.pointerEvents='');
  const t=el && el.closest ? el.closest('.tocpage .tb') : null;
  if(t){ t.click(); return true; }
  return false;
}
document.getElementById('zoneL').onclick=e=>{ if(tocHit(e)) return; vertical? next() : prev(); };
document.getElementById('zoneR').onclick=e=>{ if(tocHit(e)) return; vertical? prev() : next(); };
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') vertical?prev():next();
  else if(e.key==='ArrowLeft') vertical?next():prev();
  else if(e.key===' '||e.key==='ArrowDown'){ e.preventDefault(); next(); }
  else if(e.key==='ArrowUp') prev();
  else if(e.key==='Escape') closeSheets();
});
let tx=0,ty=0;
const bookEl=document.getElementById('book');
bookEl.addEventListener('touchstart',e=>{ tx=e.changedTouches[0].clientX; ty=e.changedTouches[0].clientY; },{passive:true});
bookEl.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)<44 || Math.abs(dx)<Math.abs(dy)) return;
  if(dx<0) vertical?prev():next(); else vertical?next():prev();
},{passive:true});

let rt;
window.addEventListener('resize',()=>{ clearTimeout(rt); const keep=currentBlock(); rt=setTimeout(()=>layout(keep),180); });

if(document.fonts && document.fonts.ready){ document.fonts.ready.then(()=>layout(null)); }
layout(null);

/* shioriAuto: トップページからの「しおりの続きから」 */
if(/[?&]shiori=1/.test(location.search)){
  var _try=function(n){
    try{
      if(bm){ var p=pageOfAnchor(bm); if(p>0){ idx=p; update(0); return; } }
    }catch(e){}
    if(n>0) setTimeout(function(){ _try(n-1); }, 300);
  };
  setTimeout(function(){ _try(6); }, 300);
}
