<!DOCTYPE html>
<html lang="ja">
<head>

<style>
  :root{
    --paper:#e3ddcb;
    --paper-deep:#d6cfba;
    --edge:#c2b9a0;
    --ink:#2b2722;
    --ink-soft:#6d6557;
    --pencil:#4d5157;
    --shu:#a8402c;
    --fs:17px;
    --lh:2.05;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    background:#b9b09a;
    background-image:
      radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.18), transparent 60%),
      repeating-linear-gradient(102deg, rgba(0,0,0,.025) 0 2px, transparent 2px 5px);
    color:var(--ink);
    font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP","Songti SC",serif;
    overflow:hidden;
    -webkit-text-size-adjust:100%;
  }
  #app{height:100dvh;display:flex;flex-direction:column;}

  /* ---- top bar ---- */
  .bar{
    flex:0 0 auto;display:flex;align-items:center;gap:14px;
    padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
  }
  .bar button{
    font:inherit;font-size:13px;letter-spacing:.14em;
    background:none;border:none;color:#4a4335;padding:6px 2px;cursor:pointer;
  }
  .bar button:focus-visible{outline:1.5px solid var(--shu);outline-offset:3px;}

  /* ---- ruler ---- */
  .ruler{flex:1 1 auto;display:flex;align-items:flex-end;gap:6px;height:26px;}
  .ruler .rn{font-size:11px;color:#5c5343;line-height:1;padding-bottom:3px;}
  .ruler svg{flex:1 1 auto;width:100%;height:100%;display:block;overflow:visible;}
  .rulerline{stroke:#5c5343;stroke-width:1;}
  .tick{stroke:#5c5343;stroke-width:1;}
  .tick.mm{stroke:#5c5343;opacity:.45;}
  .num{fill:#5c5343;font-size:9px;font-family:inherit;}
  #mark{transition:transform .35s cubic-bezier(.3,.7,.3,1);}
  #mark line{stroke:var(--pencil);stroke-width:2;stroke-linecap:round;}
  #mark text{fill:var(--pencil);font-size:8.5px;letter-spacing:.06em;}
  #finalmark{opacity:0;}
  #finalmark line{stroke:var(--shu);stroke-width:2.4;stroke-linecap:round;}
  #finalmark text{fill:var(--shu);font-size:9px;}
  #finalmark.show{opacity:1;animation:scratch .7s ease-out;}
  @keyframes scratch{from{clip-path:inset(0 0 100% 0);}to{clip-path:inset(0 0 0 0);}}

  /* ---- book ---- */
  #book{flex:1 1 auto;position:relative;padding:0 10px 4px;min-height:0;}
  .spread{
    height:100%;display:flex;gap:0;justify-content:center;
    filter:drop-shadow(0 10px 22px rgba(60,50,30,.32));
  }
  body.vert .spread{flex-direction:row-reverse;}
  .page{
    position:relative;flex:1 1 0;min-width:0;height:100%;max-width:640px;
    background:var(--paper);
    background-image:
      radial-gradient(ellipse at 20% 12%, rgba(255,255,255,.5), transparent 55%),
      radial-gradient(ellipse at 85% 90%, rgba(150,130,90,.18), transparent 60%);
    padding:26px 20px calc(22px + env(safe-area-inset-bottom));
    overflow:hidden;
    font-size:var(--fs);line-height:var(--lh);
    letter-spacing:.03em;
    text-align:justify;
  }
  body.vert .page{writing-mode:vertical-rl;text-orientation:mixed;text-align:start;}
  .col{inline-size:var(--colw,100%);block-size:100%;margin-inline:auto;}
  .page.blank{background:var(--paper-deep);}
  #pageB{display:none;}
  body.spread #pageB{display:block;}
  body.spread #pageA{box-shadow:inset -14px 0 22px -16px rgba(90,72,40,.55);}
  body.spread #pageB{box-shadow:inset 14px 0 22px -16px rgba(90,72,40,.55);}
  body.spread.vert #pageA{box-shadow:inset 14px 0 22px -16px rgba(90,72,40,.55);}
  body.spread.vert #pageB{box-shadow:inset -14px 0 22px -16px rgba(90,72,40,.55);}

  .flip{animation:flip .26s ease;}
  @keyframes flip{from{opacity:.15;transform:translateX(var(--dx,10px));}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){
    .flip{animation:none;} #mark{transition:none;} #finalmark.show{animation:none;}
  }

  /* ---- text blocks ---- */
  .page p{margin:0;text-indent:1em;}
  .page p + p{margin-top:0;}
  body.vert .page p{text-indent:1em;}
  .page h2{
    margin:0 0 1.6em;font-size:1.22em;font-weight:600;letter-spacing:.22em;
    line-height:1.7;text-indent:0;
  }
  body:not(.vert) .page h2{border-bottom:1px solid rgba(90,80,60,.28);padding-bottom:.5em;}
  body.vert .page h2{border-left:1px solid rgba(90,80,60,.28);padding-left:.5em;margin:0 0 1.6em 0;}
  .page blockquote{
    margin:1.2em .4em;padding:0 1em;color:#4b4335;font-size:.94em;
    border-left:2px solid rgba(120,100,60,.4);
  }
  body.vert .page blockquote{
    margin:.4em 1.2em;padding:1em 0;border-left:none;
    border-top:2px solid rgba(120,100,60,.4);
  }
  .sep{margin:1.5em auto;width:34%;height:0;border-top:1px solid rgba(90,80,60,.3);}
  body.vert .sep{margin:auto 1.5em;height:34%;width:0;border-top:none;border-left:1px solid rgba(90,80,60,.3);}
  .endmark{margin:2em 0 0;text-align:center;letter-spacing:.6em;color:var(--ink-soft);text-indent:0;}
  strong{font-weight:700;}
  body.vert strong{
    text-emphasis:filled dot var(--ink);-webkit-text-emphasis:filled dot var(--ink);
    font-weight:inherit;
  }
  em{font-style:normal;color:var(--ink-soft);}

  /* ---- cover ---- */
  .cover{display:flex;align-items:center;justify-content:center;height:100%;max-height:100%;}
  .cover-in{text-align:center;max-width:100%;}
  body.vert .cover-in{writing-mode:vertical-rl;height:100%;max-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;}
  .cover h1{
    margin:0;font-size:min(6.6vh,8.2vw,50px);font-weight:400;
    letter-spacing:.22em;line-height:1.45;text-indent:0;
  }
  body.vert .cover h1{max-height:100%;}
  .cover .sub{margin-top:1.4em;font-size:.86em;letter-spacing:.34em;color:var(--ink-soft);}
  body.vert .cover .sub{margin:1.4em 0 0;}
  .cover .pillar{margin-top:2.2em;}
  body.vert .cover .pillar{margin:2.2em 0 0;}
  .cover .pillar svg{max-height:22vh;}

  /* ---- tap zones + footer ---- */
  .zone{position:absolute;top:0;bottom:0;width:34%;border:none;background:none;cursor:pointer;padding:0;}
  .zone.l{left:0;} .zone.r{right:0;}
  .zone:focus-visible{outline:1.5px dashed var(--shu);outline-offset:-6px;}
  .foot{
    flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;
    padding:8px 18px calc(env(safe-area-inset-bottom) + 8px);
    font-size:11.5px;letter-spacing:.14em;color:#514936;
  }
  .foot span{opacity:.85;}

  /* ---- sheets ---- */
  .sheet{
    position:fixed;inset:0;z-index:20;display:none;
    background:rgba(40,34,24,.5);backdrop-filter:blur(2px);
  }
  .sheet.open{display:block;}
  .sheet-in{
    position:absolute;left:0;right:0;bottom:0;max-height:76%;overflow:auto;
    background:var(--paper);padding:22px 22px calc(env(safe-area-inset-bottom) + 26px);
    border-radius:2px 2px 0 0;
  }
  .sheet h3{margin:0 0 16px;font-size:14px;letter-spacing:.24em;font-weight:600;color:#4a4335;}
  .toc-item{
    display:flex;justify-content:space-between;gap:14px;width:100%;
    font:inherit;font-size:15px;text-align:left;background:none;border:none;
    padding:11px 0;border-bottom:1px solid rgba(90,80,60,.18);color:var(--ink);cursor:pointer;
  }
  .toc-item .pg{font-size:11px;color:var(--ink-soft);letter-spacing:.1em;flex:0 0 auto;}
  .toc-item[aria-current="true"]{color:var(--shu);}
  .row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid rgba(90,80,60,.18);}
  .row:last-child{border-bottom:none;}
  .row .lab{font-size:14px;letter-spacing:.1em;}
  .seg{display:flex;border:1px solid rgba(90,80,60,.4);}
  .seg button{
    font:inherit;font-size:13px;padding:7px 15px;background:none;border:none;cursor:pointer;color:#4a4335;
    border-left:1px solid rgba(90,80,60,.25);
  }
  .seg button:first-child{border-left:none;}
  .seg button[aria-pressed="true"]{background:#4a4335;color:var(--paper);}
  .close{margin-top:20px;width:100%;font:inherit;font-size:13px;letter-spacing:.2em;padding:12px;background:none;border:1px solid rgba(90,80,60,.4);cursor:pointer;color:#4a4335;}

  #measure{position:fixed;top:-99999px;left:0;visibility:hidden;pointer-events:none;}

  /* ---- 電子版デザイン ---- */
  .page .opener{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#f1ece0;writing-mode:horizontal-tb;}
  .page .opener img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;}
  .sep{display:flex;align-items:center;justify-content:center;border:none !important;margin:1.4em auto;width:auto;height:auto;}
  body.vert .sep{margin:auto 1.3em;width:auto;height:auto;}
  body:not(.vert) .sep svg{transform:rotate(-90deg);}
  body.vert .sep svg{transform:none;}

  /* ---- 目次ページ・しおり ---- */
  .bar button{white-space:nowrap;flex:0 0 auto;}
  .ruler .rn{white-space:nowrap;flex:0 0 auto;}
  .ruler{min-width:0;} .ruler svg{min-width:0;}
  .bar{gap:10px;}
  .tocpage{position:relative;z-index:3;pointer-events:none;display:flex;flex-direction:column;gap:.45em;height:100%;}
  body.vert .tocpage{padding-top:0;}
  .tocpage h2{margin:0 0 .5em;border:none !important;padding:0 !important;font-size:1.05em;letter-spacing:.5em;}
  .tocpage .ti{display:flex;align-items:center;gap:.5em;font:inherit;background:none;border:none;padding:0;margin:0;color:var(--ink);cursor:pointer;text-align:start;line-height:1.3;}
  .tocpage .tb{pointer-events:auto;display:flex;align-items:center;gap:.5em;font:inherit;background:none;border:none;padding:.1em;margin:0;color:inherit;cursor:pointer;line-height:1.3;}
  .tocpage .tb:focus-visible{outline:1.5px solid var(--shu);outline-offset:2px;}
  .tocpage .tb:active .t{color:var(--shu);}
  .tocpage .ti .n{color:var(--ink-soft);font-size:.85em;letter-spacing:.2em;flex:0 0 auto;}
  .tocpage .ti .t{flex:0 1 auto;}
  .tocpage .ti .d{flex:1 1 auto;min-width:1em;min-height:1em;border:0 dotted rgba(90,80,60,.45);}
  body:not(.vert) .tocpage .ti .d{border-bottom-width:1px;}
  body.vert .tocpage .ti .d{border-left-width:1px;}
  .tocpage .ti .p{display:inline-block;writing-mode:horizontal-tb;font-size:.72em;color:var(--ink-soft);letter-spacing:.05em;flex:0 0 auto;}
  .page.marked::after{content:"";position:absolute;top:14px;right:18px;width:40px;height:14px;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2040%2014%22%3E%3Cpolyline%20points%3D%222%2C8%2011%2C6.8%2020%2C8.6%2029%2C7%2038%2C8%22%20fill%3D%22none%22%20stroke%3D%22%23a8402c%22%20stroke-width%3D%222.8%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E") no-repeat center/contain;z-index:4;pointer-events:none;opacity:.95;}
  body.spread.vert #pageB.marked::after, body.spread:not(.vert) #pageA.marked::after{right:auto;left:22px;}
  #bmBtn[aria-pressed="true"]{color:var(--shu);}
  .foot .bmjump{font:inherit;font-size:11px;letter-spacing:.14em;background:none;border:1px solid rgba(168,64,44,.55);color:var(--shu);padding:3px 10px;cursor:pointer;margin:0 8px;}
  .foot .bmjump[hidden]{display:none;}
  .sheet .bm-item{width:100%;text-align:left;font:inherit;font-size:13px;letter-spacing:.12em;background:none;border:1px solid rgba(168,64,44,.5);color:var(--shu);padding:10px 12px;margin:0 0 14px;cursor:pointer;}
  .sheet .bm-item[hidden]{display:none;}

  /* 札が五枚めくれる */
  #rulerSvg .back{fill:none;stroke:#5c5343;stroke-width:1;opacity:.5;}
  #rulerSvg .backline{stroke:#5c5343;stroke-width:1;opacity:.35;}
  #rulerSvg .face,#rulerSvg .pip{opacity:0;}
  #rulerSvg .card.on .back,#rulerSvg .card.on .backline{opacity:0;}
  #rulerSvg .card.on .face{opacity:1;fill:#efeade;stroke:var(--pencil);stroke-width:1.1;}
  #rulerSvg .card.on .pip{opacity:1;fill:var(--pencil);}
  #rulerSvg .card.on.fin .pip{fill:var(--shu);}
  #rulerSvg .card.on.fin .face{stroke:var(--shu);}
  #rulerSvg .card.flip{animation:cardflip .46s ease-in-out;}
  @keyframes cardflip{0%{transform:scaleX(1);}50%{transform:scaleX(.06);}100%{transform:scaleX(1);}}
  @media (prefers-reduced-motion:reduce){#rulerSvg .card.flip{animation:none;}}
  #homeLink{font:inherit;font-size:inherit;letter-spacing:.14em;color:var(--ink-soft);text-decoration:none;white-space:nowrap;flex:0 0 auto;}
  #homeLink:hover,#homeLink:focus-visible{color:var(--ink);}
  #homeLink[hidden]{display:none;}
</style>
</head>
<body class="vert">
<div id="app">
  <div class="bar">
    <a id="homeLink" href="index.html" hidden>ほかの本</a>

    <div class="ruler" aria-hidden="true">
            <svg id="rulerSvg" viewBox="0 0 300 26" preserveAspectRatio="xMidYMid meet"></svg>
          </div>

</div>

    </div>
    <button class="close" data-close>閉じる</button>
  </div>
</div>

<script>
const DATA = {"title": "9センチメートル", "sub": "数えられないもの", "blocks": [{"t": "opener", "i": 0, "alt": "序章　四百十三日目"}, {"t": "p", "h": "四百十二枚目の手紙を書き終えて、よしゆきは鉛筆の粉を指で払った。"}, {"t": "p", "h": "米粒ほどの紙である。爪の先で削った黒鉛を、唾で練って墨にする。一枚書くのに、半刻かかった。"}, {"t": "p", "h": "返事は、まだ一通も来ていない。"}, {"t": "p", "h": "「そろそろ、やめたらどうだ」"}, {"t": "p", "h": "ヒロが、丸眼鏡の奥から言った。壁裏の床に寝そべったまま、天井の梁を見ている。"}, {"t": "p", "h": "「やめない」"}, {"t": "p", "h": "「一年以上だぞ」"}, {"t": "p", "h": "「知ってる」"}, {"t": "p", "h": "よしゆきは、書いたばかりの紙を、本の頁のあいだに挟んだ。折り目をつけないよう、そっと。"}, {"t": "p", "h": "明日には、この本は売れているかもしれない。"}, {"t": "p", "h": "売れたら、もう戻ってこない。"}, {"t": "p", "h": "それでも、書く。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "「四百十二枚じゃ」"}, {"t": "p", "h": "カク爺が、帳面から顔を上げた。四百十二の日付が、そこに並んでいる。"}, {"t": "p", "h": "「よいか諸君。確率というのはの、待った時間には比例せん。じゃが、枚数には比例する」"}, {"t": "p", "h": "「じいさん、その話、何回目だ」"}, {"t": "p", "h": "「二十七回目じゃ」"}, {"t": "p", "h": "「数えてんのかよ」"}, {"t": "p", "h": "「数えとる」"}, {"t": "p", "h": "ナオ吉が、物置の隅で笑った。声には出さなかった。目の下の隈が、灯りの加減で濃く見えた。"}, {"t": "p", "h": "ネネは、一階で杖を膝に置いたまま、なにも言わなかった。六十年、北の丘でひとり待っていた老女である。待つ者の話になると、彼女はたいてい黙る。"}, {"t": "p", "h": "屋根裏では、ラリオが荷車の車軸に油を差していた。"}, {"t": "p", "h": "「なあ」ヒロが、天井を見上げながら言った。「もし返事が来たら、どうするんだ」"}, {"t": "p", "h": "よしゆきは、少し考えて、答えた。"}, {"t": "p", "h": "「迎えに行く」"}, {"t": "p", "h": "その夜、四百十三枚目は、書かなかった。"}, {"t": "p", "h": "まだ、だれを迎えに行くのかも、知らないまま。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "翌朝、うろこ堂の土間に、段ボールがひとつ届いた。"}, {"t": "p", "h": "南のほうの店じまいで、おじいさんが古本をまとめて買い取ってきたのである。六人で表紙を持ち上げて中を確かめるのは、この家の決まりごとだった。"}, {"t": "p", "h": "その一冊が、よしゆきの覚えている本だった。"}, {"t": "p", "h": "背表紙の下に、値札を剥がした跡がある。二年前に売れた本である。"}, {"t": "p", "h": "夜、店が閉まってから、六人がかりで表紙を持ち上げた。頁をめくる。真ん中あたり。"}, {"t": "p", "h": "手紙は、なかった。"}, {"t": "p", "h": "かわりに、灰色の紙が一枚、はさまっていた。"}, {"t": "p", "h": "米粒ほどの、たどたどしい字が書いてある。"}, {"t": "quote", "h": "よしゆきさんへ<br><br>てがみ、よみました。<br><br>あいたいです。<br><br>ぼくは ソラ といいます。みなみの、まちに います。<br><br>ソラ"}, {"t": "p", "h": "それだけだった。日付も、番地も、理由も、なにもない。"}, {"t": "p", "h": "「……これだけか」とヒロが言った。"}, {"t": "p", "h": "「これだけだ」"}, {"t": "p", "h": "「困ってるとか、助けてくれとか、書いてねえな」"}, {"t": "p", "h": "「うん」"}, {"t": "p", "h": "ヒロは、丸眼鏡を押し上げた。それから、髭を撫でた。"}, {"t": "p", "h": "「……来たのか」"}, {"t": "p", "h": "よしゆきは、その紙を、しばらく見ていた。"}, {"t": "p", "h": "「行く」"}, {"t": "opener", "i": 1, "alt": "第一章　十八日"}, {"t": "p", "h": "南へ十八日。"}, {"t": "p", "h": "ラリオが先を行き、五人で荷車を押した。彼は道を書けない。書こうとすると消える、と言う。それでも毎日、日暮れまでには決めた場所に着いた。"}, {"t": "p", "h": "四日目に雨が降った。用水路の水が上がって、半日、土管の中で足止めになった。"}, {"t": "p", "h": "「順調すぎるんだよ」とヒロが言った。土管の天井から落ちる雫を、指で受けながら言った。"}, {"t": "p", "h": "「足止めされてるぞ」"}, {"t": "p", "h": "「半日だろ。この程度で済んでる」彼は、指の雫を払った。「<strong>着いたところで、なんかあるぞ</strong>」"}, {"t": "p", "h": "だれも、答えなかった。"}, {"t": "p", "h": "八日目、猫に出くわした。ネネを荷車に乗せ、ラリオが引き、五人で側溝の蓋の下へ逃げこんだ。猫は格子の上を三度往復して、それから飽きて行った。"}, {"t": "p", "h": "十二日目の夜、カク爺が焚き火の前で言った。"}, {"t": "p", "h": "「よしゆきよ。この手紙には、なにも書いておらん」"}, {"t": "p", "h": "「うん」"}, {"t": "p", "h": "「困っておるとも、助けてくれとも、書いておらん。……そういう手紙を書く者はの、たいてい、書けんことがあるんじゃ」"}, {"t": "p", "h": "よしゆきは、火を見ていた。"}, {"t": "p", "h": "「じいさん」"}, {"t": "p", "h": "「なんじゃ」"}, {"t": "p", "h": "「おれの手紙にも、何も書いてない」"}, {"t": "p", "h": "「そうじゃな」"}, {"t": "p", "h": "「待ってます、としか書いてない」"}, {"t": "p", "h": "カク爺は、髭を撫でた。それ以上は、なにも言わなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "十八日目の夕方、彼らは大きな建物の前に着いた。"}, {"t": "p", "h": "かつて遊技場だったらしい。人間の看板が外されて、ねじの跡だけが残っている。その裏手に、人間の捨てた木箱が幾重にも積まれていた。"}, {"t": "p", "h": "木箱の隙間から、灯りが漏れていた。"}, {"t": "p", "h": "そして、声がした。"}, {"t": "p", "h": "「いらっしゃい! いらっしゃい!」"}, {"t": "p", "h": "小さかった。よしゆきより、いくらか背が低い。頬に土埃がついていて、声はもうかすれかけている。"}, {"t": "p", "h": "それでも、通りかかる小さき者の一人ひとりに、笑顔を向けていた。"}, {"t": "p", "h": "「今夜は盛況ですよ! さあさあ!」"}, {"t": "p", "h": "よしゆきは、しばらくその姿を見ていた。"}, {"t": "p", "h": "その子は、客に声をかけながら、指で何かを数えていた。声を張っている口とは別に、左手の指だけが、一定のはやさで折れたり伸びたりしていた。本人は気づいていないらしかった。"}, {"t": "p", "h": "「なあ」とヒロが小声で言った。「あれ、なに数えてんだ」"}, {"t": "p", "h": "「客の頭数じゃろう」とカク爺が言った。「……体が覚えとるんじゃ。ああいうのは、やらされて覚えるもんじゃ」"}, {"t": "p", "h": "木箱の別の隙間にも、同じ格好の子どもがいた。もう一人、その奥にもいた。三人とも、同じように声を張っていた。"}, {"t": "p", "h": "「あの」"}, {"t": "p", "h": "よしゆきが声をかけると、その子は振り向いた。"}, {"t": "p", "h": "「はい、いらっしゃ――」"}, {"t": "p", "h": "言いかけて、止まった。"}, {"t": "p", "h": "目が、よしゆきの顔から離れなくなった。口が半分開いたまま、指も止まった。"}, {"t": "p", "h": "「……よしゆき、さん?」"}, {"t": "p", "h": "「うん」"}, {"t": "p", "h": "「ほんとに」"}, {"t": "p", "h": "「うん」"}, {"t": "p", "h": "「ほんとに、来た……」"}, {"t": "p", "h": "その子の顔が、ぱっと明るくなった。土埃も、かすれた声も、一瞬でどこかへ行った。"}, {"t": "p", "h": "「ソラです! ぼく、ソラです!」"}, {"t": "p", "h": "彼は、よしゆきの手を両手で握った。手のひらが、乾いてざらついていた。"}, {"t": "p", "h": "「あの、あの、手紙、読みました。何回も読みました。折れちゃったから、二回貼り直して」"}, {"t": "p", "h": "「うん」"}, {"t": "p", "h": "「来ないと思ってました」"}, {"t": "p", "h": "ソラは、そう言って笑った。"}, {"t": "p", "h": "「ずっと、来ないって言われてたので」"}, {"t": "opener", "i": 2, "alt": "第二章　六年"}, {"t": "p", "h": "「お客さんですか」"}, {"t": "p", "h": "明るい声だった。"}, {"t": "p", "h": "中背の男が、木箱の隙間から出てきた。"}, {"t": "p", "h": "髪が乱れていた。何日も洗っていない髪が、額に貼りついている。襟はよれて、袖口が黒ずんでいた。近づくと、酸っぱい匂いがした。"}, {"t": "p", "h": "そして、目だけが、やたらに開いていた。"}, {"t": "p", "h": "まばたきの回数が、人より少ない。瞳がいつも真ん中にあって、笑うときも目は笑わなかった。見られていると、こちらの目のほうが先に乾いた。"}, {"t": "p", "h": "「ヤマといいます。ここの、まあ、世話役みたいなもので」"}, {"t": "p", "h": "「あんた、ここの――」"}, {"t": "p", "h": "「元締めなんて偉いもんじゃないですよ」ヤマは笑った。「ソラのことなら、俺がいちばんよく知ってますよ」"}, {"t": "p", "h": "彼は、ソラの頭に手を置いた。"}, {"t": "p", "h": "ソラの肩が、わずかに上がった。自分でも気づかない動きだった。"}, {"t": "p", "h": "「この子、ずっとあなたの名前を言ってたんです。手紙をくれた人がいるって。何度も何度も」"}, {"t": "p", "h": "「…………」"}, {"t": "p", "h": "「よかったですねえ、ソラ。ほんとに来てくれて」"}, {"t": "p", "h": "「はい」"}, {"t": "p", "h": "ヤマは、六人の顔を、ひとりずつ順に見た。時間をかけて、丁寧に見た。人の顔を見ることが、この男の仕事らしかった。"}, {"t": "p", "h": "「行き場のなかった子でしてね」"}, {"t": "p", "h": "彼は言った。ソラの頭に手を置いたまま、その頭越しに言った。"}, {"t": "p", "h": "「六年前です。冬でした。そこの路地の隅で、ひとりで震えてました。親も、家も、名前もなかった」"}, {"t": "p", "h": "「…………」"}, {"t": "p", "h": "「俺が拾いました。ごはんも、寝床も、俺が用意しました。名前も、俺がつけたんです」"}, {"t": "p", "h": "ヤマは、ソラの頭を、もう一度撫でた。"}, {"t": "p", "h": "「この子、いま、あんなに元気に働いてるでしょう。俺が育てたようなもんですよ」"}, {"t": "p", "h": "よしゆきは、そこで気づいた。"}, {"t": "p", "h": "ヤマは、ソラの頭に手を置いたまま、ソラのことを話している。<strong>本人が、すぐそこにいるのに。</strong>"}, {"t": "p", "h": "よしゆきは、なにも言わなかった。"}, {"t": "p", "h": "ヤマは、にっこりして、続けた。"}, {"t": "p", "h": "「ただね」"}, {"t": "p", "h": "「なんだ」"}, {"t": "p", "h": "「恩は、ちゃんと返してもらってるんです。当然のことでしょう?」"}, {"t": "p", "h": "彼は、懐から帳面を取り出した。人間の値札の裏を綴じたものだった。紐は、その値札についていた紐をほどいて使ってある。"}, {"t": "p", "h": "「この子、借金があるんですよ。俺に」"}, {"t": "p", "h": "だれも、すぐには言葉が出なかった。"}, {"t": "p", "h": "ソラは、うつむいていた。両手を、前で組んでいた。"}, {"t": "p", "h": "ヤマは、よしゆきの顔をのぞきこんだ。距離が近かった。まばたきが、やはり少なかった。"}, {"t": "p", "h": "「ねえ」"}, {"t": "p", "h": "「…………」"}, {"t": "p", "h": "「<strong>どんな気持ち?</strong>」"}, {"t": "opener", "i": 3, "alt": "第三章　二十七人"}, {"t": "p", "h": "「見せてもらえるか」"}, {"t": "p", "h": "言ったのは、カク爺だった。"}, {"t": "p", "h": "ヤマは、あっさり帳面を差し出した。隠す気配は、まったくなかった。"}, {"t": "p", "h": "老人は、鼻がつくほど紙に顔を近づけた。"}, {"t": "p", "h": "長かった。"}, {"t": "p", "h": "数字が並んでいた。日付。稼ぎ。食費。寝床の代。そして、利子。"}, {"t": "p", "h": "一日ごとに、几帳面に書きこまれている。字は読みやすく、計算に間違いはなかった。"}, {"t": "p", "h": "「……この、いちばん右の欄は」"}, {"t": "p", "h": "「利子です」"}, {"t": "p", "h": "「利率は」"}, {"t": "p", "h": "ヤマは、数字を言った。"}, {"t": "p", "h": "カク爺の指が、止まった。"}, {"t": "p", "h": "「もう一度言え」"}, {"t": "p", "h": "ヤマは、同じ数字を、同じ調子で繰り返した。"}, {"t": "p", "h": "老人は、帳面の頁を前へ戻した。半年ぶん、一年ぶん、遡っていく。指が震えていた。"}, {"t": "p", "h": "「……よいか」"}, {"t": "p", "h": "彼は、顔を上げなかった。"}, {"t": "p", "h": "「この子が一日に稼ぐ額は、ここに書いてある。そして、一日に増える利子も、ここに書いてある」"}, {"t": "p", "h": "「はい」"}, {"t": "p", "h": "「<strong>稼ぎのほうが、少ない</strong>」"}, {"t": "p", "h": "しん、とした。"}, {"t": "p", "h": "「働いても、利子に追いつかん。追いつかんから、元本は一粒も減らん。それどころか――」"}, {"t": "p", "h": "カク爺は、帳面を閉じた。"}, {"t": "p", "h": "「<strong>働けば働くほど、借金は増えていく</strong>」"}, {"t": "p", "h": "ヒロが、口を開けて、それから閉じた。"}, {"t": "p", "h": "「おい。それ、どういうことだ」"}, {"t": "p", "h": "「そのままの意味じゃ」"}, {"t": "p", "h": "「六年働いて、増えてんのか」"}, {"t": "p", "h": "「増えとる」"}, {"t": "p", "h": "だれも、なにも言えなかった。"}, {"t": "p", "h": "ソラだけが、少し離れたところで、きょとんとしていた。"}, {"t": "p", "h": "「え。ぼく、ちゃんと働いてますよ」"}, {"t": "p", "h": "「……知っとる」"}, {"t": "p", "h": "「毎日、数えて報告してます。今日は二十七人、呼びました」"}, {"t": "p", "h": "「報告?」"}, {"t": "p", "h": "「はい。毎晩、ヤマさんに。今日は何人呼んだか、いくらになったか」"}, {"t": "p", "h": "ソラは、左手を持ち上げた。指が、ひとりでに動いていた。"}, {"t": "p", "h": "「数えてないと、怒られるので。……いまも、勝手に動くんです。止めようと思っても、止まらなくて」"}, {"t": "p", "h": "カク爺は、その手を見た。"}, {"t": "p", "h": "それから、その子の顔を、見られなくなった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ヤマは、悪びれなかった。"}, {"t": "p", "h": "「それは、俺のせいじゃないでしょう」"}, {"t": "p", "h": "彼は、帳面を受け取って、埃を払った。"}, {"t": "p", "h": "「利率は最初に決めました。この子も、承知してます。俺が助けてやった分の礼儀です。恩を、金に換算してるだけですよ」"}, {"t": "p", "h": "「恩は、金に換算できるもんか」"}, {"t": "p", "h": "「換算しなきゃ、なんにも返ってこないでしょう」ヤマは肩をすくめた。「口で『ありがとう』って言われても、俺、生きていけないんで」"}, {"t": "p", "h": "「……お前さん」"}, {"t": "p", "h": "カク爺の声が、低くなった。"}, {"t": "p", "h": "「数字は嘘をつかん。じゃが、嘘のような数字を作ることはできる」"}, {"t": "p", "h": "「うまいこと言いますね」"}, {"t": "p", "h": "ヤマは、そう言って笑った。目は、やはり笑っていなかった。"}, {"t": "p", "h": "「でも、おじいさん。ひとつ聞かせてください」"}, {"t": "p", "h": "「なんじゃ」"}, {"t": "p", "h": "「じゃあ、いくらなら正しいんです?」"}, {"t": "p", "h": "「…………」"}, {"t": "p", "h": "「恩に、いくらの値をつけたら、あなたは納得するんですか」"}, {"t": "p", "h": "カク爺は、答えられなかった。"}, {"t": "p", "h": "ヤマは、帳面を懐に戻した。"}, {"t": "p", "h": "「答えられないでしょう。<strong>数えられないものに値をつけたのは、俺です</strong>。誰かがやらなきゃ、話が始まらないんですよ」"}, {"t": "opener", "i": 4, "alt": "第四章　五回に四回"}, {"t": "p", "h": "「話し合っても、埒が明かないでしょう」"}, {"t": "p", "h": "ヤマは、六人を広間へ案内した。"}, {"t": "p", "h": "木箱の内側だった。天井は彼らの背丈の十倍あり、人間の懐中電灯の残光が、壁の隙間から差しこんでいる。中央に、平たい盤が置いてあった。人間の碁石入れの蓋である。"}, {"t": "p", "h": "二十人ほどの小さき者が、その周りに座っていた。だれも顔を上げなかった。"}, {"t": "p", "h": "「借金の話は、水掛け論になります。でも――」"}, {"t": "p", "h": "ヤマは、盤の上に、五枚の札を並べた。"}, {"t": "p", "h": "人間のトランプの端を切り出したものである。彼らの背丈ほどの大きさがあった。"}, {"t": "p", "h": "裏は無地。表には、もとの絵柄の切れはしが残っていた。<strong>花</strong>が一枚。<strong>線</strong>が一枚。<strong>輪</strong>が一枚。<strong>星</strong>が一枚。どれも意味のない断片で、数も文字も書かれていない。"}, {"t": "p", "h": "そして、五枚目。表の真ん中に、<strong>朱</strong>の印が捺してある。"}, {"t": "p", "h": "「賭けで決めましょう。話し合いより、早いでしょう」"}, {"t": "p", "h": "「なにをする」"}, {"t": "p", "h": "「この五枚のうち、一枚だけ、朱の印が入っています。あなたがたと、俺とで、交互に一枚ずつ引く。<strong>印を引いたほうが、その回の負け</strong>です」"}, {"t": "p", "h": "「順番は」"}, {"t": "p", "h": "「そちらが先手。俺が後手です」"}, {"t": "p", "h": "「なぜ」"}, {"t": "p", "h": "ヤマは、少しだけ首をかしげた。"}, {"t": "p", "h": "「<strong>お客さんを立てるのが、うちの流儀でして</strong>」"}, {"t": "p", "h": "彼は、指を三本立てた。"}, {"t": "p", "h": "「三回、挑戦させてあげます。そのうち一回でも勝てば、あの子の借金は、その場で消します」"}, {"t": "p", "h": "「三回とも負けたら」"}, {"t": "p", "h": "「あなたがた全員に、うちで働いてもらいます」"}, {"t": "p", "h": "広間の空気が、一段下がった。"}, {"t": "p", "h": "「六人ともか」"}, {"t": "p", "h": "「六人ともです」"}, {"t": "p", "h": "「一人二人じゃ、足りないってことか」"}, {"t": "p", "h": "「そうですね」ヤマは、にっこりした。「三回もあげるんです。それで文句ないでしょう?」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "「じいさん」とよしゆきは言った。「勝ち目は」"}, {"t": "p", "h": "カク爺は、五枚の札を見つめていた。"}, {"t": "p", "h": "「五枚のうち、一枚がはずれ。交互に引く。こちらが一手目、三手目、五手目。あちらが二手目、四手目じゃ」"}, {"t": "p", "h": "「うん」"}, {"t": "p", "h": "「はずれが何手目に出るかは、五分の一ずつで均等に散る。こちらが引く番は三回、あちらは二回」"}, {"t": "p", "h": "老人は、指を折った。"}, {"t": "p", "h": "「<strong>こちらが負ける目が五分の三。勝つ目が五分の二</strong>」"}, {"t": "p", "h": "「四割か」"}, {"t": "p", "h": "「一回ならの。じゃが三回あるなら、話は別じゃ」"}, {"t": "p", "h": "カク爺は、少しだけ背筋を伸ばした。"}, {"t": "p", "h": "「三回とも負ける目は、五分の三を三度かける。……およそ、五回に一回じゃ」"}, {"t": "p", "h": "「つまり」"}, {"t": "p", "h": "「<strong>五回に四回は、どこかで勝てる</strong>」"}, {"t": "p", "h": "ヒロが、息を吐いた。"}, {"t": "p", "h": "「悪くねえじゃねえか」"}, {"t": "p", "h": "「悪くない」老人は言った。「<strong>正しく配られれば、の話じゃ</strong>」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "よしゆきは、ソラを見た。"}, {"t": "p", "h": "その子は、広間の隅に立っていた。こちらを見ていなかった。見ないようにしている顔だった。"}, {"t": "p", "h": "六年間、毎晩この場所で働いてきた子である。今日はじめて来た人間に、期待をかけないようにしている。"}, {"t": "p", "h": "よしゆきは、盤の前に進み出た。"}, {"t": "p", "h": "「受ける」"}, {"t": "p", "h": "ヤマは、うれしそうに手を叩いた。"}, {"t": "p", "h": "「話が早くて助かります」"}, {"t": "opener", "i": 5, "alt": "第五章　五枚"}, {"t": "p", "h": "盤の前に、若い男がひとり座った。"}, {"t": "p", "h": "「親です」とヤマが言った。「ただ配るだけの役目ですよ。ご心配なく」"}, {"t": "p", "h": "その男は、無口だった。挨拶もせず、目も合わせなかった。五枚の札を手に取り、裏を上にして、盤の上に横一列に並べた。"}, {"t": "p", "h": "手つきは、丁寧でも雑でもなかった。何千回とやってきた者の手だった。"}, {"t": "p", "h": "「この者は、なにも知りません」とヤマは言った。「どれがはずれかも、知らない。並べるだけです」"}, {"t": "p", "h": "「信じろと」"}, {"t": "p", "h": "「信じなくてもいいですよ。ただ、見ていればわかります」"}, {"t": "p", "h": "たしかに、親の手には、よどみがなかった。迷いも、ためらいも、ひっかかりもない。<strong>どれがはずれか知っている者の手つきではなかった。</strong>"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ヤマは、盤から一歩下がったところに立っていた。"}, {"t": "p", "h": "見ているだけだった。"}, {"t": "p", "h": "彼の目が、並んだ五枚の上を、ゆっくりと一往復した。左から右へ、そして右から左へ。急いでもいないし、隠してもいない。ただ、眺めていた。"}, {"t": "p", "h": "カク爺の耳が、ぴくりと動いた。"}, {"t": "p", "h": "「……あの目じゃ」"}, {"t": "p", "h": "「なんじゃ」とナオ吉が言った。"}, {"t": "p", "h": "「<strong>あの男、いま、札を読んどったぞ</strong>」"}, {"t": "p", "h": "「見てただけだろ」"}, {"t": "p", "h": "「そうじゃ。見ておっただけじゃ」"}, {"t": "p", "h": "老人は、しばらくヤマを見ていた。"}, {"t": "p", "h": "「じゃが、あれは<strong>字を追うときの目じゃ</strong>。左から右へ、一枚ずつ、順に」"}, {"t": "p", "h": "「札に、字は書いてねえぞ」"}, {"t": "p", "h": "「そうじゃな」"}, {"t": "p", "h": "カク爺は、それきり黙った。"}, {"t": "p", "h": "「気のせいかもしれん」"}, {"t": "p", "h": "ナオ吉は、それ以上聞かなかった。カク爺も、それ以上は言わなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "盤の上に、五枚の札が並んでいる。"}, {"t": "p", "h": "裏を上にして、灯りの下で、どれも同じに見えた。同じ大きさで、同じ色で、同じ角度で置かれていた。"}, {"t": "p", "h": "よしゆきは、その五枚を見た。"}, {"t": "p", "h": "なにも、わからなかった。"}, {"t": "p", "h": "「では」とヤマが言った。"}, {"t": "p", "h": "「はじめましょう」"}, {"t": "opener", "i": 6, "alt": "第六章　一回目"}, {"t": "p", "h": "「オレが行く」"}, {"t": "p", "h": "ヒロが、盤の前に進み出た。"}, {"t": "p", "h": "「ヒロ」"}, {"t": "p", "h": "「一人目がいちばん軽いんだよ」彼は、丸眼鏡を押し上げた。「三回あるうちの一回目だ。外しても、まだ二回残ってる。……こういうのは、いちばん先に怖くなるやつが行くのがいい」"}, {"t": "p", "h": "「怖くねえだろ、お前」とナオ吉が言った。"}, {"t": "p", "h": "「怖えよ」"}, {"t": "p", "h": "ヒロは、盤の前に座った。太った体が、木箱の板を軋ませた。"}, {"t": "p", "h": "「オレが先手か」"}, {"t": "p", "h": "「そうです」とヤマが言った。「どうぞ、お好きな一枚を」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "<strong>一手目。</strong>"}, {"t": "p", "h": "ヒロは、五枚を長いこと見ていた。"}, {"t": "p", "h": "左端を見て、右端を見て、眼鏡を外して拭いて、かけ直して、また左端を見た。広間のどこかから「早くしろ」と声が飛んだ。ヒロは聞こえないふりをした。"}, {"t": "p", "h": "「……なあ、よしゆき」"}, {"t": "p", "h": "「うん」"}, {"t": "p", "h": "「オレさ、いま、手汗がすごい」"}, {"t": "p", "h": "「うん」"}, {"t": "p", "h": "「拭いていいか」"}, {"t": "p", "h": "「いいよ」"}, {"t": "p", "h": "ヒロは、膝で手のひらを拭いた。それから、右から二番目の札に手を伸ばした。"}, {"t": "p", "h": "めくる。"}, {"t": "p", "h": "<strong>花</strong>。印はなかった。"}, {"t": "p", "h": "彼の口から、息が漏れた。"}, {"t": "p", "h": "「では」とヤマが言った。「俺の番ですね」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "<strong>二手目。</strong>"}, {"t": "p", "h": "ヤマは、残った四枚を眺めた。"}, {"t": "p", "h": "目が、左から右へ動いた。それだけだった。手を伸ばすまでに、二拍ほどの間があった。"}, {"t": "p", "h": "指が、左端の一枚に触れた。持ち上げる直前、指の腹が、札の端をひとなでした。"}, {"t": "p", "h": "めくる。"}, {"t": "p", "h": "<strong>線</strong>。印はなかった。"}, {"t": "p", "h": "「安全ですね」"}, {"t": "p", "h": "ヤマは、そう言った。声に、余裕も緊張もなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "<strong>三手目。</strong>"}, {"t": "p", "h": "残り三枚。"}, {"t": "p", "h": "ヒロは、真ん中の札に手を伸ばしかけて、止めた。"}, {"t": "p", "h": "「……なあ」"}, {"t": "p", "h": "「なんです」"}, {"t": "p", "h": "「あんた、なんにも言わねえんだな」"}, {"t": "p", "h": "「なにをです」"}, {"t": "p", "h": "「早くしろとか、そっちじゃないとか。そういうの」"}, {"t": "p", "h": "ヤマは、少しだけ首をかしげた。"}, {"t": "p", "h": "「言う理由がないので」"}, {"t": "p", "h": "ヒロは、しばらく黙っていた。"}, {"t": "p", "h": "それから、真ん中の一枚をめくった。"}, {"t": "p", "h": "<strong>輪</strong>。印はなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "<strong>四手目。</strong>"}, {"t": "p", "h": "ヤマの番。残り二枚。"}, {"t": "p", "h": "彼は、また眺めた。二枚しかないのに、時間をかけた。目が左へ行き、右へ行き、また左へ戻った。"}, {"t": "p", "h": "指が、右の一枚に触れた。端を、ひとなでした。"}, {"t": "p", "h": "めくる。"}, {"t": "p", "h": "<strong>星</strong>。印はなかった。"}, {"t": "p", "h": "「安全です」"}, {"t": "p", "h": "残るのは、一枚だけになった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "<strong>五手目。</strong>"}, {"t": "p", "h": "ヒロは、盤の上に残った最後の一枚を見た。"}, {"t": "p", "h": "それを引くのは、彼の番だった。"}, {"t": "p", "h": "「……おい」"}, {"t": "p", "h": "「どうぞ」とヤマが言った。"}, {"t": "p", "h": "「引くしかねえのか」"}, {"t": "p", "h": "「引かなくても、結果は同じですよ」"}, {"t": "p", "h": "ヒロは、手を伸ばした。"}, {"t": "p", "h": "めくる。"}, {"t": "p", "h": "<strong>真ん中に、朱の印があった。</strong>"}, {"t": "p", "h": "はずれだった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "だれも、なにも言わなかった。"}, {"t": "p", "h": "「一回戦は、俺の勝ちですね」"}, {"t": "p", "h": "ヤマは、にっこりした。"}, {"t": "p", "h": "「大丈夫ですよ。まだなにも起きません。あと二回あります」"}, {"t": "p", "h": "ヒロは、めくった札を見下ろしたまま、動かなかった。"}, {"t": "p", "h": "ヤマが、その顔をのぞきこんだ。"}, {"t": "p", "h": "「あなた、さっき言いましたよね。<strong>いちばん先に怖くなるやつが行くのがいい</strong>って」"}, {"t": "p", "h": "「…………」"}, {"t": "p", "h": "「立派だと思いますよ。ほんとに。……で、いま」"}, {"t": "p", "h": "彼は、少しだけ首をかしげた。"}, {"t": "p", "h": "「<strong>どんな気持ち?</strong>」"}, {"t": "p", "h": "ヒロは、答えなかった。"}, {"t": "p", "h": "それから、丸眼鏡を外した。拭かずに、手に持ったままだった。"}, {"t": "p", "h": "「……な。言っただろ」"}, {"t": "p", "h": "彼は、そう言った。"}, {"t": "p", "h": "そして、盤の前から立ち上がったが、広間からは出て行かなかった。だれも彼を連れて行かなかった。なにも起きなかった。"}, {"t": "p", "h": "<strong>なにも起きないことが、いちばん重かった。</strong>"}, {"t": "p", "h": "あと二回。その数だけが、六人の頭の中に残った。"}, {"t": "opener", "i": 7, "alt": "第七章　四十九"}, {"t": "p", "h": "「次はオレだ」"}, {"t": "p", "h": "ナオ吉が、盤の前に座った。"}, {"t": "p", "h": "「ナオ吉」"}, {"t": "p", "h": "「順番だろ」"}, {"t": "p", "h": "彼は、笑おうとした。うまくいかなかった。"}, {"t": "p", "h": "「言っとくけどな。<strong>オレが引くと、外れる</strong>」"}, {"t": "p", "h": "「そんなことは」"}, {"t": "p", "h": "「四十七回だ」ナオ吉は言った。「連続で負けた回数だよ。町じゃ、みんな知ってる」"}, {"t": "p", "h": "広間の何人かが、顔を上げた。その数字を知っている者が、この町にもいるらしかった。"}, {"t": "p", "h": "「だから、座るのはオレでいい。<strong>外していい回に、外す本職が座る</strong>。それだけの話だ」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "<strong>一手目。</strong>"}, {"t": "p", "h": "ナオ吉は、迷わなかった。"}, {"t": "p", "h": "十年、この動作をしてきた男である。左端の札に手を伸ばし、めくった。"}, {"t": "p", "h": "<strong>星</strong>。印はなかった。"}, {"t": "p", "h": "「意外だな」とヒロが言った。"}, {"t": "p", "h": "「まだ一手目だ」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "<strong>二手目。</strong>"}, {"t": "p", "h": "ヤマが、残り四枚を眺めた。"}, {"t": "p", "h": "左から右へ。二拍。指が、真ん中の一枚に触れる。端を、ひとなでする。"}, {"t": "p", "h": "めくる。"}, {"t": "p", "h": "<strong>輪</strong>。印はなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "<strong>三手目。</strong>"}, {"t": "p", "h": "残り三枚。"}, {"t": "p", "h": "ナオ吉は、その三枚を見なかった。"}, {"t": "p", "h": "彼は、自分の手を見ていた。"}, {"t": "p", "h": "「おい」とヒロが言った。「見ろよ、札を」"}, {"t": "p", "h": "「見ても同じだ」"}, {"t": "p", "h": "「なんでだよ」"}, {"t": "p", "h": "「<strong>見てわかるなら、こんな商売は成り立ってねえ</strong>」"}, {"t": "p", "h": "彼は、手を伸ばした。右端の一枚だった。"}, {"t": "p", "h": "めくる。"}, {"t": "p", "h": "<strong>真ん中に、朱の印があった。</strong>"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ナオ吉は、天井を見上げた。"}, {"t": "p", "h": "長いこと、そうしていた。"}, {"t": "p", "h": "「……四十九」"}, {"t": "p", "h": "彼は、そうつぶやいた。"}, {"t": "p", "h": "数えていたのだ。この男は、十年、自分の負けを一度も数え間違えたことがない。"}, {"t": "p", "h": "「四十七までは、町のやつらも知ってる」"}, {"t": "p", "h": "彼は、天井を見たまま続けた。"}, {"t": "p", "h": "「四十八は、去年の柱の前だ。うろこ堂の、あの柱の前で、オレは『伸びてないほう』に賭けた」"}, {"t": "p", "h": "だれも、口を挟まなかった。"}, {"t": "p", "h": "「負けた。……<strong>あれだけは、負けてよかった</strong>」"}, {"t": "p", "h": "「二回戦も、俺の勝ちです」"}, {"t": "p", "h": "ヤマは、そう言った。声の調子は、いつもとまったく変わらなかった。"}, {"t": "p", "h": "それから、ナオ吉のほうへ、一歩近づいた。"}, {"t": "p", "h": "「四十九回」"}, {"t": "p", "h": "「…………」"}, {"t": "p", "h": "「そんなに負けてる人、はじめて見ました。よく続けられますね、そんなに外して」彼は、感心したように言った。「ねえ。<strong>いつも、どんな気持ち?</strong>」"}, {"t": "p", "h": "ナオ吉は、天井を見たまま、答えなかった。"}, {"t": "p", "h": "「答えないんですか」"}, {"t": "p", "h": "「……答えたら、あんた、うれしいのか」"}, {"t": "p", "h": "ヤマは、少しだけ黙った。"}, {"t": "p", "h": "それから、いつもの顔に戻った。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "残る挑戦は、あと一回。"}, {"t": "p", "h": "外せば、六人全員がこの賭場に残ることになる。"}, {"t": "p", "h": "ヒロが、口を開いた。"}, {"t": "p", "h": "「……なあ、じいさん」"}, {"t": "p", "h": "「なんじゃ」"}, {"t": "p", "h": "「五回に四回は勝てるんじゃなかったのか」"}, {"t": "p", "h": "カク爺は、答えなかった。"}, {"t": "p", "h": "「じいさん」"}, {"t": "p", "h": "「……<strong>偶然にしては、行儀がよすぎる</strong>」"}, {"t": "p", "h": "「なに」"}, {"t": "p", "h": "「二回とも、こちらの番ではずれが出た」カク爺は言った。「一回ならある。二回続くのも、ないとは言えん。じゃが――」"}, {"t": "p", "h": "老人は、ヤマの手元を見ていた。"}, {"t": "p", "h": "一回戦で二度、二回戦で一度。ヤマが札を引いたのは、三度である。"}, {"t": "p", "h": "その三度とも、彼は同じ動きをしていた。"}, {"t": "p", "h": "「<strong>あの男は、引く前に必ず端をなでとる</strong>」"}, {"t": "p", "h": "ヤマは、盤の向こうで、静かに立っていた。まばたきが、少なかった。"}, {"t": "opener", "i": 8, "alt": "第八章　一瞬"}, {"t": "p", "h": "二連敗を見届けたあと、ヤマは、しばらく盤の前に立っていた。"}, {"t": "p", "h": "広間の客が、ざわめきはじめていた。"}, {"t": "p", "h": "彼は、その音を聞いていなかった。"}, {"t": "p", "h": "彼の目が、広間の隅へ動いた。"}, {"t": "p", "h": "そこに、ソラが立っていた。客引きの仕事から呼び戻されて、ずっとこの様子を見ていた。両手を前で組んだまま、身じろぎもしていなかった。"}, {"t": "p", "h": "ヤマの目は、その子を、一瞬だけ見た。"}, {"t": "p", "h": "それから、すぐに逸れた。"}, {"t": "p", "h": "<strong>その目が、なにを見ていたのか、だれも聞かなかった。</strong>"}, {"t": "p", "h": "ソラ自身も、気づいていなかった。"}, {"t": "p", "h": "ヤマは、いつもの顔に戻って、六人のほうを向いた。"}, {"t": "p", "h": "「三回目、どうします?」"}, {"t": "opener", "i": 9, "alt": "第九章　五つの傷"}, {"t": "p", "h": "よしゆきの袖が、後ろから引かれた。"}, {"t": "p", "h": "ふりむくと、痩せた男が立っていた。"}, {"t": "p", "h": "年のころは、わからない。上着はすり切れて、袖口がほつれている。靴は、片方しか履いていなかった。"}, {"t": "p", "h": "ただ、姿勢だけが、異様によかった。"}, {"t": "p", "h": "「あの札には、印がある」"}, {"t": "p", "h": "「……あんた、だれだ」"}, {"t": "p", "h": "「はずれの札の端に、浅い折り目がついている」"}, {"t": "p", "h": "男の声は低く、ひどく疲れていた。"}, {"t": "p", "h": "「あの男は、自分の番のとき、指の腹でそれを確かめている。見ていただろう。札を持ち上げる直前に、必ず端をなでる」"}, {"t": "p", "h": "よしゆきは、思い返した。"}, {"t": "p", "h": "一回戦の二手目。四手目。二回戦の二手目。"}, {"t": "p", "h": "<strong>三度とも、ヤマは同じ動きをしていた。</strong>"}, {"t": "p", "h": "「じゃあ、あいつは」"}, {"t": "p", "h": "「<strong>あの男は、選んでるんだよ。引いてるんじゃない</strong>」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "「暴きます」"}, {"t": "p", "h": "「やめておけ」"}, {"t": "p", "h": "「なんで」"}, {"t": "p", "h": "「暴けば、札を替えられる」男は言った。「新しい札に、新しい印がつくだけだ。次はもっと浅くなる。二度と見つからん」"}, {"t": "p", "h": "「じゃあ、どうすれば」"}, {"t": "p", "h": "男は、しばらく黙っていた。"}, {"t": "p", "h": "そして、言った。"}, {"t": "p", "h": "「<strong>跡は、消せない。だが、増やせる</strong>」"}, {"t": "p", "h": "「……え」"}, {"t": "p", "h": "「はずれ以外の四枚にも、同じ跡をつけろ」"}, {"t": "p", "h": "よしゆきの呼吸が、止まった。"}, {"t": "p", "h": "「五枚とも印がついていれば、あの男は、どれが本物か分からなくなる」"}, {"t": "p", "h": "「…………」"}, {"t": "p", "h": "「<strong>一つだから目印なんだ。五つあれば、ただの傷だ</strong>」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "「なんで、教えてくれるんですか」"}, {"t": "p", "h": "男は、答えるかわりに、広間の隅を見た。"}, {"t": "p", "h": "ラリオが、荷車の車輪をぼんやり眺めていた。誰が勝っているのかも、たぶん分かっていない顔だった。"}, {"t": "p", "h": "「そこの、車輪の男に」と、男は言った。「会ったことがある」"}, {"t": "p", "h": "「…………」"}, {"t": "p", "h": "「<strong>あれには、まだ借りがある</strong>」"}, {"t": "p", "h": "そのとき、よしゆきの後ろで、だれかが息を呑んだ。"}, {"t": "p", "h": "ナオ吉だった。"}, {"t": "p", "h": "彼は、男の横顔を見て、白い顔で立ちつくしていた。口が、なにか言おうとして、開いて、閉じた。"}, {"t": "p", "h": "男は、ナオ吉のほうを見なかった。"}, {"t": "p", "h": "見られなかった、という言い方のほうが、近かった。"}, {"t": "opener", "i": 10, "alt": "第十章　四歩"}, {"t": "p", "h": "男は、言うだけ言って、背を向けた。"}, {"t": "p", "h": "片方だけの靴が、木箱の隙間のほうへ向かう。"}, {"t": "p", "h": "ナオ吉は、動かなかった。十年、そうしてきた。飲みこむのは、この男の癖だった。"}, {"t": "p", "h": "三歩。"}, {"t": "p", "h": "四歩。"}, {"t": "p", "h": "「――<strong>あんた</strong>」"}, {"t": "p", "h": "声が、勝手に出た。"}, {"t": "p", "h": "ナオ吉は、自分でも驚いた顔をしていた。"}, {"t": "p", "h": "男が、足を止めた。振り返らなかった。"}, {"t": "p", "h": "「なんで、ここにいるんだよ」"}, {"t": "p", "h": "男は、答えなかった。"}, {"t": "p", "h": "「オレはな」ナオ吉の声は、震えていた。「十年かけて、あんたを許さないようにしてきたんだ。毎日だぞ。忘れないように、毎日思い出してたんだ」"}, {"t": "p", "h": "「…………」"}, {"t": "p", "h": "「なのに、なんで――<strong>なんで助けるんだよ</strong>」"}, {"t": "p", "h": "男は、なにも言わなかった。"}, {"t": "p", "h": "弁解も、名乗りもしなかった。ただ、その場に立っていた。"}, {"t": "p", "h": "<strong>それが、いちばん応えた。</strong>"}, {"t": "p", "h": "ナオ吉が、掴みかかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "もみ合いになった。"}, {"t": "p", "h": "よしゆきが止めようとしたが、間に合わなかった。ナオ吉の手が男の襟をつかみ、二人はもつれるように、盤のほうへ倒れこんだ。"}, {"t": "p", "h": "盤の上の五枚が、ばらまかれた。"}, {"t": "p", "h": "広間がざわめいた。何人かが立ち上がった。親が慌てて札を拾おうとした。"}, {"t": "p", "h": "その一瞬だった。"}, {"t": "p", "h": "よしゆきは、床に膝をついた。"}, {"t": "p", "h": "散らばった札を、拾い集める。それだけの動作だった。混乱の中で、手伝う者がいるのは、むしろ自然なことだった。"}, {"t": "p", "h": "一枚。二枚。三枚。四枚。"}, {"t": "p", "h": "拾い上げるたび、親指の爪が、端をほんの浅くなぞった。"}, {"t": "p", "h": "だれも、見ていなかった。みなが、ナオ吉と男のほうを見ていた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "「――やめんか!」"}, {"t": "p", "h": "カク爺の声で、二人は引き離された。"}, {"t": "p", "h": "ナオ吉は、肩で息をしていた。男は、なにも言わずに襟を直した。"}, {"t": "p", "h": "「……悪かった」"}, {"t": "p", "h": "ナオ吉が、そう言った。"}, {"t": "p", "h": "だれに向けた言葉かは、分からなかった。"}, {"t": "p", "h": "男は、答えなかった。かわりに、片方だけの靴で、ゆっくりと広間の隅へ下がっていった。"}, {"t": "p", "h": "よしゆきは、自分の手を見た。"}, {"t": "p", "h": "爪の先が、白くなっていた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ヤマは、盤に散った札を拾い集めさせた。"}, {"t": "p", "h": "「もう一度並べます」"}, {"t": "p", "h": "彼は、親のほうを見た。"}, {"t": "p", "h": "普段なら、そこで声が飛ぶはずだった。"}, {"t": "p", "h": "<strong>遅い。手が震えてるぞ。見られてるのがわかるか。</strong>"}, {"t": "p", "h": "六年間、毎晩、ヤマは親にそう言ってきた。細工とは関係のない口出しである。ただ、場が緩むのが許せない男だった。客に見せる芝居の一部でもあった。"}, {"t": "p", "h": "この日、彼はこう言った。"}, {"t": "p", "h": "「もう好きにしろ」"}, {"t": "p", "h": "親の手が、一瞬止まった。"}, {"t": "p", "h": "「……はい」"}, {"t": "p", "h": "「好きに並べろって言ってんだよ。<strong>聞こえなかったか</strong>」"}, {"t": "p", "h": "声に、いつもの張りがなかった。煽っているつもりの言葉が、途中で力を失っていた。"}, {"t": "p", "h": "親は、言われたとおりにした。"}, {"t": "p", "h": "五枚を、ただ並べた。"}, {"t": "p", "h": "ヤマは、それを見なかった。"}, {"t": "opener", "i": 11, "alt": "第十一章　四手目"}, {"t": "p", "h": "「おれが行く」"}, {"t": "p", "h": "よしゆきが、盤の前に座った。"}, {"t": "p", "h": "「これで最後です」とヤマが言った。「外せば、あなたがた全員」"}, {"t": "p", "h": "「知ってる」"}, {"t": "p", "h": "五枚の札が、灯りの下に並んでいた。"}, {"t": "p", "h": "どれも同じに見えた。<strong>いまは、本当に同じだった。</strong>"}, {"t": "p", "h": "よしゆきは、自分の手が震えているのに気づいた。止めようとしたが、止まらなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "<strong>一手目。</strong>"}, {"t": "p", "h": "よしゆきは、右端の一枚に手を伸ばした。"}, {"t": "p", "h": "めくる。"}, {"t": "p", "h": "<strong>線</strong>。印はなかった。"}, {"t": "p", "h": "「では」とヤマが言った。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "<strong>二手目。</strong>"}, {"t": "p", "h": "ヤマの番だった。"}, {"t": "p", "h": "彼は、残った四枚を見た。"}, {"t": "p", "h": "いつもなら、ここで目が動くはずだった。左から右へ、右から左へ。二拍の間があって、それから指が伸びる。"}, {"t": "p", "h": "この回、それがなかった。"}, {"t": "p", "h": "彼は、ほとんど手元を見ずに、手前の一枚を取った。"}, {"t": "p", "h": "指が札の端に触れた。"}, {"t": "p", "h": "そこで、動きが<strong>一瞬、止まった</strong>。"}, {"t": "p", "h": "止まったのは、まばたき一つぶんの時間だった。"}, {"t": "p", "h": "めくる。"}, {"t": "p", "h": "<strong>花</strong>。印はなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "<strong>三手目。</strong>"}, {"t": "p", "h": "残り三枚。"}, {"t": "p", "h": "よしゆきは、その三枚を見た。"}, {"t": "p", "h": "なにも、わからなかった。"}, {"t": "p", "h": "手がかりはない。印は全部同じにした。あとは、選ぶだけだった。"}, {"t": "p", "h": "よしゆきは、真ん中の一枚を取った。"}, {"t": "p", "h": "めくる。"}, {"t": "p", "h": "<strong>星</strong>。印はなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "<strong>四手目。</strong>"}, {"t": "p", "h": "ヤマの番。残り二枚。"}, {"t": "p", "h": "広間が、静まり返っていた。"}, {"t": "p", "h": "二十人の客が、だれも盤から目を離さなかった。"}, {"t": "p", "h": "ヤマは、二枚を見た。"}, {"t": "p", "h": "<strong>やはり、確かめなかった。</strong>"}, {"t": "p", "h": "指が、右の一枚に伸びた。触れた。そして、持ち上げた。端をなでる動作は、なかった。"}, {"t": "p", "h": "めくる。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "<strong>真ん中に、朱の印があった。</strong>"}, {"t": "sep", "h": ""}, {"t": "p", "h": "広間が、音を失った。"}, {"t": "p", "h": "ヤマは、その札を見ていた。"}, {"t": "p", "h": "長いこと、見ていた。"}, {"t": "p", "h": "「……ああ」"}, {"t": "p", "h": "彼の口から、それだけ漏れた。"}, {"t": "p", "h": "「俺の負けです」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "だれも、すぐには動けなかった。"}, {"t": "p", "h": "最初に声を出したのは、ヒロだった。"}, {"t": "p", "h": "「勝った、のか」"}, {"t": "p", "h": "「勝った」とカク爺が言った。「勝った。四手目じゃ。あの男が引いた」"}, {"t": "p", "h": "ヒロが、よしゆきの肩を叩いた。何度も叩いた。ナオ吉が両手で顔を覆った。ネネが杖を取り落とした。ラリオが「なんかあった?」と言った。"}, {"t": "p", "h": "よしゆきは、盤を見つめたまま、動けなかった。"}, {"t": "p", "h": "自分の手が、まだ震えていた。"}, {"t": "p", "h": "「……勝った」"}, {"t": "p", "h": "そう言うのが、やっとだった。"}, {"t": "opener", "i": 12, "alt": "第十二章　二十年"}, {"t": "p", "h": "ヤマは、盤の前に座ったまま、動かなかった。"}, {"t": "p", "h": "「この子の借金は、これで消します」"}, {"t": "p", "h": "事務的な声だった。"}, {"t": "p", "h": "彼は、懐から帳面を出した。ソラの頁を開き、上から下まで、まっすぐ一本、線を引いた。"}, {"t": "p", "h": "それだけの動作だった。六年が、一本の線で消えた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "「なんで」"}, {"t": "p", "h": "よしゆきが言った。"}, {"t": "p", "h": "「なんで、三手目も四手目も、確かめなかったんだ」"}, {"t": "p", "h": "ヤマは、答えなかった。"}, {"t": "p", "h": "「あんた、いつもやってただろう。並べる前に目で追って、引く前に端をなでてた。オレたちが見てたのに、隠しもしなかった」"}, {"t": "p", "h": "「…………」"}, {"t": "p", "h": "「なんで、この回だけしなかった」"}, {"t": "p", "h": "長い沈黙のあと、ヤマは、静かに口を開いた。"}, {"t": "p", "h": "「――昔の話をしても、いいですか」"}, {"t": "p", "h": "だれも、止めなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "「俺も、拾われたんですよ。二十年前です」"}, {"t": "p", "h": "彼は、自分の手を見ていた。"}, {"t": "p", "h": "「冬でした。行き場がなくて、路地の隅で震えてました。親も、家も、名前もなかった」"}, {"t": "p", "h": "「…………」"}, {"t": "p", "h": "「先代の胴元が、俺を拾いました。ごはんも、寝床も、名前も、あの人がくれました」"}, {"t": "p", "h": "ヤマは、そこで少し黙った。"}, {"t": "p", "h": "「そして、借金を背負わされました。利子だけの契約です。働いても、追いつかない」"}, {"t": "p", "h": "「……あんたも」"}, {"t": "p", "h": "「はい」"}, {"t": "p", "h": "「返し終わったのか」"}, {"t": "p", "h": "「終わりませんよ」ヤマは、力なく笑った。「あの人が死んで、賭場が俺のものになっただけです。借金は、消えたんじゃなくて、<strong>取り立てる相手がいなくなっただけ</strong>でした」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "「じゃあ、あんたは」"}, {"t": "p", "h": "「俺は、俺にされたことを、そのままやっただけです」"}, {"t": "p", "h": "ヤマは、顔を上げた。"}, {"t": "p", "h": "「自覚は、ありました。ずっと」"}, {"t": "p", "h": "「…………」"}, {"t": "p", "h": "「六年前、この子を拾った日。路地で震えてるのを見つけて、抱えて帰る途中で、思ったんです。<strong>ああ、あの人もこうやって俺を運んだんだな</strong>って」"}, {"t": "p", "h": "八つで拾われて、いまは二十八である。人生の七割を、この賭場で過ごした男だった。"}, {"t": "p", "h": "彼は、ソラのほうを見なかった。"}, {"t": "p", "h": "「そのときに、やめられたはずなんです。名前をつけて、飯を食わせて、それで終わりにできたはずなんです」"}, {"t": "p", "h": "「なんで、しなかった」"}, {"t": "p", "h": "「わかりません」"}, {"t": "p", "h": "ヤマは、そう言った。"}, {"t": "p", "h": "「……いや。わかります。<strong>そうしたら、この子が、いつか出ていくからです</strong>」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "しん、とした。"}, {"t": "p", "h": "「借金があるうちは、この子は俺のところにいます」"}, {"t": "p", "h": "彼は言った。"}, {"t": "p", "h": "「返し終わったら、いなくなる。だから、返し終わらない額にしました。……それだけの話です」"}, {"t": "p", "h": "「それだけって」"}, {"t": "p", "h": "「それだけですよ。劇的な話じゃない」"}, {"t": "p", "h": "ヤマは、帳面を閉じた。線を引いた頁が、その中にあった。"}, {"t": "p", "h": "「この子を見るたびに、昔の自分を見てるみたいで。だから、離せなかった」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "彼は、それ以上、なにも言わなかった。"}, {"t": "p", "h": "謝罪はしなかった。言い訳もしなかった。ただ、事実として話しただけだった。"}, {"t": "p", "h": "カク爺が、老人らしくない静かな声で言った。"}, {"t": "p", "h": "「お前さん、さっき、わしに聞いたな」"}, {"t": "p", "h": "「なにをです」"}, {"t": "p", "h": "「恩に、いくらの値をつけたら納得するか、と」"}, {"t": "p", "h": "「言いました」"}, {"t": "p", "h": "「いま、答えがわかった」"}, {"t": "p", "h": "カク爺は、ヤマを見た。"}, {"t": "p", "h": "「<strong>ゼロじゃ</strong>」"}, {"t": "p", "h": "「…………」"}, {"t": "p", "h": "「値をつけるな、という意味じゃ。……六十年数えてきた爺が言うんじゃから、間違いない」"}, {"t": "p", "h": "ヤマは、なにも言わなかった。"}, {"t": "opener", "i": 13, "alt": "第十三章　一日目"}, {"t": "p", "h": "夜が明けた。"}, {"t": "p", "h": "賭場の外、木箱の隙間から、朝日が細く差しこんでいた。"}, {"t": "p", "h": "よしゆきは、ソラの前に立った。"}, {"t": "p", "h": "「ソラ」"}, {"t": "p", "h": "「はい」"}, {"t": "p", "h": "「一緒に来るか」"}, {"t": "p", "h": "ソラは、目を丸くした。"}, {"t": "p", "h": "「……いいんですか」"}, {"t": "p", "h": "「借金はなくなった。もう、ここにいる理由はない」"}, {"t": "p", "h": "ソラは、しばらく黙っていた。"}, {"t": "p", "h": "指が、動いていた。左手の指が、いつもの癖で、折れたり伸びたりしていた。"}, {"t": "p", "h": "それから、彼は、その手を止めた。"}, {"t": "p", "h": "「……行きません」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "「ソラ」"}, {"t": "p", "h": "「行きたいです。すごく行きたいです」"}, {"t": "p", "h": "彼は、正直にそう言った。"}, {"t": "p", "h": "「でも、行きません」"}, {"t": "p", "h": "「なんで」"}, {"t": "p", "h": "ソラは、振り返った。"}, {"t": "p", "h": "木箱の別の隙間で、まだ二人の子どもが立っていた。夜が明けても、まだ客引きの持ち場にいた。"}, {"t": "p", "h": "「あの子たちが、いるので」"}, {"t": "p", "h": "「…………」"}, {"t": "p", "h": "「ぼくが行ったら、たぶん、誰も来ないと思うんです。あの子たちのところには」"}, {"t": "p", "h": "よしゆきは、なにも言えなかった。"}, {"t": "p", "h": "「ぼく、手紙をもらいました」ソラは言った。「だから、ぼくが書きます。今度は、ぼくが」"}, {"t": "p", "h": "「……うん」"}, {"t": "p", "h": "「それと」"}, {"t": "p", "h": "ソラは、左手を上げた。指が、また動きかけていた。彼は、それを見た。"}, {"t": "p", "h": "そして、はじめて、自分からその手を握った。"}, {"t": "p", "h": "「<strong>ぼく、数えます</strong>」"}, {"t": "p", "h": "「なにを」"}, {"t": "p", "h": "「今日から、何日目か」"}, {"t": "p", "h": "よしゆきは、言葉が出なかった。"}, {"t": "p", "h": "「ぼく、それしかできないので」ソラは、笑った。「でも、それだけは、だれよりちゃんとできます。六年やってるので」"}, {"t": "p", "h": "「……ソラ」"}, {"t": "p", "h": "「よしゆきさんは、書いてたんですよね。四百十二枚」"}, {"t": "p", "h": "「うん」"}, {"t": "p", "h": "「ぼくは、数えます。よしゆきさんの手紙が来るまで、何日目か」"}, {"t": "p", "h": "彼は、そう言って、指を一本立てた。"}, {"t": "p", "h": "「今日が、一日目です」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ネネが、杖をついて前に出た。"}, {"t": "p", "h": "「あんた」"}, {"t": "p", "h": "「はい」"}, {"t": "p", "h": "老女は、その子の顔を見た。"}, {"t": "p", "h": "「待つのは、悪いことじゃないよ」"}, {"t": "p", "h": "「…………」"}, {"t": "p", "h": "「あたしは六十年、丘の上にいた。だれも来なかった。来ないもんだと思ってた」"}, {"t": "p", "h": "彼女は、杖の先で、地面を軽く突いた。"}, {"t": "p", "h": "「でもね。<strong>あたしが、いなくならなかったから、この子は来られたんだ</strong>」"}, {"t": "p", "h": "彼女は、よしゆきのほうを見なかった。"}, {"t": "p", "h": "「あんたが、いなくならなければ、それでいい」"}, {"t": "p", "h": "ソラは、うなずいた。"}, {"t": "p", "h": "深く、何度もうなずいた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "出発の前に、よしゆきは、ヤマを見た。"}, {"t": "p", "h": "ヤマは、木箱の入口に立っていた。もう笑っていなかった。"}, {"t": "p", "h": "「あんた」"}, {"t": "p", "h": "「はい」"}, {"t": "p", "h": "「あの子が手紙を書くのを、止めるか」"}, {"t": "p", "h": "ヤマは、しばらく黙っていた。"}, {"t": "p", "h": "「……止めません」"}, {"t": "p", "h": "「ほんとうか」"}, {"t": "p", "h": "「わかりません」"}, {"t": "p", "h": "彼は、正直にそう答えた。"}, {"t": "p", "h": "「でも、今日は、止めません」"}, {"t": "p", "h": "よしゆきは、それ以上聞かなかった。"}, {"t": "opener", "i": 14, "alt": "終章　数えられないもの"}, {"t": "p", "h": "帰り道は、二十日かかった。"}, {"t": "p", "h": "十七日目の夜、焚き火の前で、カク爺がぽつりと言った。"}, {"t": "p", "h": "「あの三回戦じゃがの」"}, {"t": "p", "h": "「うん」"}, {"t": "p", "h": "「ヤマは、最後まで、あの目をせんかった」"}, {"t": "p", "h": "だれも、答えなかった。"}, {"t": "p", "h": "「一回戦も二回戦も、並べたあとに、必ず五枚を一枚ずつ見とった。字を読むような目じゃ。……三回戦だけ、一度もせんかった」"}, {"t": "p", "h": "「札を見なくても、端をなでりゃ分かるからだろ」とヒロが言った。"}, {"t": "p", "h": "「その端の印は、こちらが潰した」"}, {"t": "p", "h": "「じゃあ、なんで見なかったんだ」"}, {"t": "p", "h": "「わからん」"}, {"t": "p", "h": "カク爺は、火を見ていた。"}, {"t": "p", "h": "「じゃがの。<strong>あの男は、六年も毎晩あの札を見とった</strong>」"}, {"t": "p", "h": "「だから?」"}, {"t": "p", "h": "「印がなくとも、わかったはずじゃ。紙の古び方も、角の丸まり方も、色の褪せ方も。……毎晩見とる者には、五枚の違いくらい、見える」"}, {"t": "p", "h": "ヒロが、口を開けて、閉じた。"}, {"t": "p", "h": "「じゃあ、あいつは」"}, {"t": "p", "h": "「わからん」老人は言った。「わしにはわからん。……ただ、あの男には、まだ手が残っとった。それだけじゃ」"}, {"t": "p", "h": "だれも、なにも言わなかった。"}, {"t": "p", "h": "焚き火が、一度だけ爆ぜた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "うろこ堂に帰り着いたのは、それから三日後の夜だった。"}, {"t": "p", "h": "壁裏の隙間は、出たときのままだった。埃が積もっていた。ネネの椅子も、カク爺の帳面も、ラリオの車輪の予備も、置いた場所にあった。"}, {"t": "p", "h": "よしゆきは、柱の前に立った。"}, {"t": "p", "h": "鉛筆の線が二本。下が八センチ、上が九センチ。"}, {"t": "p", "h": "一本増やす理由は、なにもなかった。だれも伸びていない。ソラも連れて帰らなかった。"}, {"t": "p", "h": "線は、二本のままだった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "「じいさん」"}, {"t": "p", "h": "カク爺が、隣に来た。"}, {"t": "p", "h": "「なんじゃ」"}, {"t": "p", "h": "「数えられないものは、どうすればいいですか」"}, {"t": "p", "h": "老人は、しばらく黙っていた。"}, {"t": "p", "h": "「わしは六十年、数を数えて生きてきた。粒も、日数も、人の背丈もじゃ」"}, {"t": "p", "h": "「うん」"}, {"t": "p", "h": "「数えられるものは、数えれば答えが出る。……<strong>数えられんもんは、答えが出んまま持っとくしかない</strong>」"}, {"t": "p", "h": "「重くないですか」"}, {"t": "p", "h": "「重い」"}, {"t": "p", "h": "カク爺は、そう言って、少し笑った。"}, {"t": "p", "h": "「じゃが、放すよりは軽いわい」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "その夜、よしゆきは手紙を書いた。"}, {"t": "p", "h": "四百十三枚目である。"}, {"t": "p", "h": "書いて、うろこ堂の本棚をよじのぼり、その日売れそうな本の、真ん中あたりの頁に挟んだ。"}, {"t": "p", "h": "返事が来るかどうかは、わからない。"}, {"t": "p", "h": "一年かもしれない。三年かもしれない。届かないかもしれない。"}, {"t": "p", "h": "ただ、南の町で、ひとりの子どもが数えている。"}, {"t": "p", "h": "今日が何日目かを、毎晩、指で。"}, {"t": "p", "h": "<strong>それが何日目になるのかは、こちらには数えられない。</strong>"}, {"t": "p", "h": "柱には、線が二本ある。"}, {"t": "p", "h": "<strong>数えられないものが、また一つ増えた。</strong>"}, {"t": "end", "h": "了"}], "chapters": [{"title": "序章　四百十三日目", "b": 0}, {"title": "第一章　十八日", "b": 48}, {"title": "第二章　六年", "b": 100}, {"title": "第三章　二十七人", "b": 139}, {"title": "第四章　五回に四回", "b": 200}, {"title": "第五章　五枚", "b": 252}, {"title": "第六章　一回目", "b": 285}, {"title": "第七章　四十九", "b": 373}, {"title": "第八章　一瞬", "b": 448}, {"title": "第九章　五つの傷", "b": 460}, {"title": "第十章　四歩", "b": 502}, (function drawRuler(){
  const svg = document.getElementById('rulerSvg');
  let s='';

    const cx = 28 + g*61, w = 22, h = 15, x = cx - w/2, y = 5;

      +  '</g>';
  }
  svg.innerHTML = s;
})();


/* ---------- しおり ---------- */
const BM_KEY = 'shiori:' + DATA.title;
DATA.blocks.forEach((b,i)=>{ b.src=i; });
let bm = null;
try{ const v = localStorage.getItem(BM_KEY); bm = v ? JSON.parse(v) : null; }catch(e){ bm = null; }
function saveBm(){ try{ if(bm) localStorage.setItem(BM_KEY, JSON.stringify(bm)); else localStorage.removeItem(BM_KEY); }catch(e){} }
function anchorOf(p){
  const pg = pages[p]; if(!pg) return null;
  for(const b of pg){ if(b && b.src!=null) return {s:b.src, p:b.part||0}; }
  if(pg[0] && pg[0].t==='toc') return {toc:true};
  return null;
}
function pageOfAnchor(a){
  if(!a) return -1;
  if(a.toc) return pages.findIndex(pg=>pg[0] && pg[0].t==='toc');
  for(let p=1;p<pages.length;p++) for(const b of pages[p]) if(b && b.src===a.s && (b.part||0)>=a.p) return p;
  for(let p=1;p<pages.length;p++) for(const b of pages[p]) if(b && b.src!=null && b.src>=a.s) return p;
  return -1;
}
function visiblePages(){ return (spread && idx>0) ? [idx, idx+1] : [idx]; }
function toggleBm(){
  const bp = pageOfAnchor(bm), vis = visiblePages();
  if(bm && vis.indexOf(bp)>=0){ bm = null; }
  else { const a = anchorOf(idx); if(!a) return; bm = a; }
  saveBm(); update(0);
}
function goBm(){ const p = pageOfAnchor(bm); if(p<0) return; idx = p; closeSheets(); update(1); }
function renderToc(host){
  const w = document.createElement('div'); w.className='tocpage';
  w.innerHTML = '<h2>目次</h2>';
  DATA.chapters.forEach((c,i)=>{
    const parts = c.title.split('\u3000');
    const row = document.createElement('div'); row.className='ti';
    const b = document.createElement('button'); b.className='tb'; b.type='button';
    b.setAttribute('aria-label', c.title.replace('\u3000',' ')+'へ移動');
    b.innerHTML = '<span class="n">'+parts[0]+'</span><span class="t">'+(parts[1]||'')+'</span>';
    b.onclick = (e)=>{ e.stopPropagation(); idx = chapPage[i]||1; update(1); };
    row.appendChild(b);
    row.insertAdjacentHTML('beforeend','<span class="d" aria-hidden="true"></span><span class="p" aria-hidden="true">'+(chapPage[i]||'')+'</span>');
    w.appendChild(row);
  });
  host.appendChild(w);
  let fs = 1;
  w.style.fontSize = fs+'em';
  const page = host.closest('.page');
  const fits = ()=>{ const r=w.getBoundingClientRect(), pr=page.getBoundingClientRect(); return vertical ? r.left >= pr.left+8 && w.scrollHeight<=w.clientHeight+2 : r.bottom <= pr.bottom-8; };
  let guard=0;
  while(!fits() && fs>0.5 && guard++<20){ fs -= 0.05; w.style.fontSize = fs.toFixed(2)+'em'; }
}

/* ---------- blocks -> DOM ---------- */
function makeEl(b){
  let el;
  if(b.t==='h2'){ el=document.createElement('h2'); el.innerHTML=b.h; }
  else if(b.t==='quote'){ el=document.createElement('blockquote'); el.innerHTML=b.h; }
  else if(b.t==='sep'){ el=document.createElement('div'); el.className='sep'; el.innerHTML=SEPSVG; }
  else if(b.t==='opener'){ el=document.createElement('div'); el.className='opener'; const im=document.createElement('img'); im.src=IMGS[b.i]; im.alt=b.alt.replace('\u3000',' '); el.appendChild(im); }
  else if(b.t==='end'){ el=document.createElement('p'); el.className='endmark'; el.textContent=b.h; }
  else { el=document.createElement('p'); el.innerHTML=b.h; }
  return el;
}
function contentBox(el){
  const r = el.getBoundingClientRect(), cs = getComputedStyle(el);
  return {
    left:   r.left   + parseFloat(cs.paddingLeft   || 0),
    right:  r.right  - parseFloat(cs.paddingRight  || 0),
    top:    r.top    + parseFloat(cs.paddingTop    || 0),
    bottom: r.bottom - parseFloat(cs.paddingBottom || 0)
  };
}
/* scrollWidth is unreliable in vertical-rl (content overflows leftward),
   so compare the last child's far edge with the page's content box. */
function over(el){
  const kids = el.children;
  if(!kids.length) return false;
  const box = contentBox(el);
  const k = kids[kids.length-1], r = k.getBoundingClientRect(), ks = getComputedStyle(k);
  return vertical
    ? (r.left - parseFloat(ks.marginLeft || 0)) < box.left - 0.5
    : (r.bottom + parseFloat(ks.marginBottom || 0)) > box.bottom + 0.5;
}
function splitText(t){
  const out=[]; let cur='';
  for(let i=0;i<t.length;i++){
    cur+=t[i];
    if('。！？」'.indexOf(t[i])>=0 && cur.length>=40){ out.push(cur); cur=''; }
  }
  if(cur) out.push(cur);
  return out.length?out:[t];
}

/* ---------- pagination ---------- */
function paginate(){
  const m = document.getElementById('measure'), mc = document.getElementById('mcol');
  const ref = document.getElementById('pageA').getBoundingClientRect();
  m.className='page';
  m.style.width = ref.width+'px';
  m.style.height = ref.height+'px';
  mc.innerHTML='';

  pages = [[{t:'cover'}],[{t:'toc'}]];
  chapPage = [];
  let cur = [];
  const push = ()=>{ if(cur.length){ pages.push(cur); cur=[]; } mc.innerHTML=''; };

  const esc = t => t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const drop = el => { if(el && el.parentNode) el.parentNode.removeChild(el); };

  // 1ページに単独で収まらない塊を、収まる単位に割って順番どおり流しこむ
  const flowSplit = (b)=>{
    let part = 0;
    if(b.t==='quote'){                    // 手紙は行単位で分ける
      const trim = a=>{ const c=a.slice();
        while(c.length && c[0]==='') c.shift();
        while(c.length && c[c.length-1]==='') c.pop();
        return c; };
      const lines = b.h.split('<br>');
      let buf=[], node=null;
      for(const ln of lines){
        const trial = buf.concat([ln]);
        drop(node);
        node = makeEl({t:'quote', h: trim(trial).join('<br>')});
        mc.appendChild(node);
        if(over(mc) && trim(buf).length){
          drop(node);
          cur.push({t:'quote', h: trim(buf).join('<br>'), src:b.src, part:part++});
          push();
          buf = (ln==='') ? [] : [ln];
          node = buf.length ? makeEl({t:'quote', h: ln}) : null;
          if(node) mc.appendChild(node);
        } else {
          buf = trial;
        }
      }
      if(trim(buf).length) cur.push({t:'quote', h: trim(buf).join('<br>'), src:b.src, part:part++});
      return;
    }
    for(const c of splitText(makeEl(b).textContent)){   // 段落は文単位で分ける
      const blk = {t:'p', h: esc(c), src:b.src, part:part++};
      let node = makeEl(blk);
      mc.appendChild(node);
      if(over(mc) && cur.length){ drop(node); push(); node = makeEl(blk); mc.appendChild(node); }
      cur.push(blk);
    }
  };

  const feed = (b, chIndex)=>{
    if(b.t==='opener'){ push(); if(chIndex!=null) chapPage[chIndex]=pages.length; pages.push([b]); mc.innerHTML=''; return; }
    const el = makeEl(b);
    mc.appendChild(el);
    if(over(mc)){
      mc.removeChild(el);
      if(cur.length) push();
      mc.appendChild(el);
      if(over(mc)){                       // ページ丸ごと使っても収まらない
        mc.removeChild(el);
        if(chIndex!=null) chapPage[chIndex] = pages.length;
        flowSplit(b);
        return;
      }
    }
    if(chIndex!=null) chapPage[chIndex] = pages.length;
    cur.push(b);
  };

  const chStart = {};
  DATA.chapters.forEach((c,i)=>{ chStart[c.b]=i; });
  DATA.blocks.forEach((b,i)=> feed(b, chStart[i]!=null?chStart[i]:null));
  push();

  // verify: re-measure every page and move any spilled block to the next one
  for(let p=1;p<pages.length;p++){
    if(pages[p][0] && (pages[p][0].t==='toc' || pages[p][0].t==='opener')) continue;
    mc.innerHTML='';
    const keep=[]; const spill=[];
    for(const b of pages[p]){
      if(spill.length){ spill.push(b); continue; }
      const el=makeEl(b); mc.appendChild(el);
      if(over(mc) && keep.length){ mc.removeChild(el); spill.push(b); }
      else keep.push(b);
    }
    if(spill.length){
      pages[p]=keep;
      pages.splice(p+1,0,spill);
      for(let c=0;c<chapPage.length;c++) if(chapPage[c]>p) chapPage[c]++;
    }
  }
  mc.innerHTML='';
  if(pages.length%2===0 && spread) pages.push([{t:'blank'}]);
}

/* ---------- render ---------- */
function renderPage(hostPage, page){
  const host = hostPage.querySelector('.col');
  host.innerHTML='';
  hostPage.classList.remove('blank');
  if(!page){ hostPage.classList.add('blank'); return; }
  if(page[0] && page[0].t==='cover'){
    host.innerHTML = '<div class="opener" style="background:#e3ddcb"><img alt="'+DATA.title+'　'+DATA.sub+'" src="'+COVER+'"></div>';
    return;
  }
  if(page[0] && page[0].t==='blank'){ hostPage.classList.add('blank'); return; }
  if(page[0] && page[0].t==='toc'){ renderToc(host); return; }
  page.forEach(b=> host.appendChild(makeEl(b)));
}

function update(dir){
  const A=document.getElementById('pageA'), B=document.getElementById('pageB');
  if(spread && idx>0 && idx%2===0) idx--;
  idx = Math.max(0, Math.min(pages.length-1, idx));

  if(spread && idx>0){ renderPage(A,pages[idx]); renderPage(B,pages[idx+1]); }
  else { renderPage(A,pages[idx]); renderPage(B,null); }

  if(dir){
    const dx = (dir>0 ? (vertical?-14:14) : (vertical?14:-14))+'px';
    [A,B].forEach(el=>{ el.style.setProperty('--dx',dx); el.classList.remove('flip'); void el.offsetWidth; el.classList.add('flip'); });
  }

  const bp = pageOfAnchor(bm), vis = visiblePages();
  A.classList.toggle('marked', bm!=null && bp===vis[0]);
  B.classList.toggle('marked', bm!=null && vis.length>1 && bp===vis[1]);
  const here = bm!=null && vis.indexOf(bp)>=0;
  const bb = document.getElementById('bmBtn');
  bb.setAttribute('aria-pressed', String(here));
  bb.disabled = (idx===0 && !spread) || (idx===0);
  bb.setAttribute('aria-label', here ? 'しおりを外す' : 'このページにしおりをはさむ');
  document.getElementById('bmJump').hidden = !(bm && bp>0 && !here);
  const bi = document.getElementById('bmItem');
  bi.hidden = !(bm && bp>0);
  if(bp>0) bi.textContent = 'しおりのページへ（' + bp + '）';
  const last = pages.length-1;
  const prog = last>0 ? idx/last : 0;
  (function(){
    var open = Math.floor(prog*5 + 0.0001), lastp = (idx===last);
    if(lastp) open = 5;
    document.querySelectorAll('#rulerSvg .card').forEach(function(c,g){
      var on = g < open, was = c.classList.contains('on');
      if(on !== was){
        c.classList.toggle('on', on);
        c.classList.add('flip');
        setTimeout(function(){ c.classList.remove('flip'); }, 460);
      }
      c.classList.toggle('fin', lastp);
    });
  })();

  let name='';
  for(let i=0;i<DATA.chapters.length;i++){ if(chapPage[i]!=null && chapPage[i]<=idx) name=DATA.chapters[i].title; }
  document.getElementById('chapNow').textContent = idx===0 ? '' : name;
  document.getElementById('pageNow').textContent = idx===0 ? '表紙' : (idx + ' / ' + last);
  document.querySelectorAll('.toc-item').forEach(el=>{
    el.setAttribute('aria-current', String(Number(el.dataset.p)<=idx && (Number(el.dataset.next)>idx || el.dataset.next==='')));
  });
}

function go(step){ const n=idx+step*(spread&&idx>0?2:1); if(n<0||n>pages.length-1) return; idx=n; update(step); }
function next(){ go(1); } function prev(){ go(-1); }

/* ---------- column fitting ---------- */
function fitColumn(){
  const pa = document.getElementById('pageA'), cs = getComputedStyle(pa);
  const avail = vertical
    ? pa.clientHeight - parseFloat(cs.paddingTop)  - parseFloat(cs.paddingBottom)
    : pa.clientWidth  - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const n = CHARS[sizeIdx];
  let fs = Math.min(SIZES[sizeIdx], avail / (n * KERN));
  fs = Math.max(12.5, fs);
  const colw = Math.min(avail, Math.floor(fs * n * KERN));
  document.documentElement.style.setProperty('--fs', fs.toFixed(2)+'px');
  document.documentElement.style.setProperty('--colw', colw+'px');
}

/* ---------- layout ---------- */
function layout(keepBlock){
  spread = window.innerWidth >= 940 && window.innerHeight >= 420;
  document.body.classList.toggle('spread', spread);
  document.body.classList.toggle('vert', vertical);
  document.documentElement.style.setProperty('--fs', SIZES[sizeIdx]+'px');
  document.documentElement.style.setProperty('--lh', vertical? '1.95' : '2.05');
  requestAnimationFrame(()=>{
    fitColumn();
    paginate();
    if(keepBlock!=null){
      let found=0;
      for(let p=1;p<pages.length;p++){ if(pages[p].some(b=>b===keepBlock)){ found=p; break; } }
      idx = found || Math.min(idx, pages.length-1);
    }
    buildToc();
    update(0);
  });
}
function currentBlock(){ const p=pages[idx]; return p && p[0] && p[0].t!=='cover' ? p[0] : null; }

/* ---------- toc ---------- */
function buildToc(){
  const list=document.getElementById('tocList');
  list.innerHTML='';
  DATA.chapters.forEach((c,i)=>{
    const b=document.createElement('button');
    b.className='toc-item'; b.dataset.p=chapPage[i]||1;
    b.dataset.next = (chapPage[i+1]!=null? chapPage[i+1] : '');
    b.innerHTML='<span>'+c.title+'</span><span class="pg">'+(chapPage[i]||1)+'</span>';
    b.onclick=()=>{ idx=chapPage[i]||1; closeSheets(); update(1); };
    list.appendChild(b);
  });
}

/* ---------- sheets ---------- */
function closeSheets(){ document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('open')); }
try{ if(!/claude\.ai$/i.test(location.hostname) && !/^blob:/.test(location.href)) document.getElementById('homeLink').hidden=false; }catch(e){}
document.getElementById('bmBtn').onclick=toggleBm;
document.getElementById('bmJump').onclick=goBm;
document.getElementById('bmItem').onclick=goBm;
document.getElementById('tocBtn').onclick=()=>document.getElementById('tocSheet').classList.add('open');
document.getElementById('setBtn').onclick=()=>document.getElementById('setSheet').classList.add('open');
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheets);
document.querySelectorAll('.sheet').forEach(s=>s.addEventListener('click',e=>{ if(e.target===s) closeSheets(); }));

document.getElementById('dirSeg').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  const keep=currentBlock();
  vertical = b.dataset.dir==='v';
  document.querySelectorAll('#dirSeg button').forEach(x=>x.setAttribute('aria-pressed', String(x===b)));
  layout(keep);
};
document.getElementById('sizeSeg').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  const keep=currentBlock();
  sizeIdx=Number(b.dataset.size);
  document.querySelectorAll('#sizeSeg button').forEach(x=>x.setAttribute('aria-pressed', String(x===b)));
  layout(keep);
};

/* ---------- input ---------- */
/* 目次ページの項目がページ送りの領域の下にあっても押せるようにする */
function tocHit(e){
  if(!e || (!e.clientX && !e.clientY)) return false;
  const zs=document.querySelectorAll('.zone'); zs.forEach(z=>z.style.pointerEvents='none');
  const el=document.elementFromPoint(e.clientX,e.clientY);
  zs.forEach(z=>z.style.pointerEvents='');
  const t=el && el.closest ? el.closest('.tocpage .tb') : null;
  if(t){ t.click(); return true; }
  return false;
}
document.getElementById('zoneL').onclick=e=>{ if(tocHit(e)) return; vertical? next() : prev(); };
document.getElementById('zoneR').onclick=e=>{ if(tocHit(e)) return; vertical? prev() : next(); };
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') vertical?prev():next();
  else if(e.key==='ArrowLeft') vertical?next():prev();
  else if(e.key===' '||e.key==='ArrowDown'){ e.preventDefault(); next(); }
  else if(e.key==='ArrowUp') prev();
  else if(e.key==='Escape') closeSheets();
});
let tx=0,ty=0;
const bookEl=document.getElementById('book');
bookEl.addEventListener('touchstart',e=>{ tx=e.changedTouches[0].clientX; ty=e.changedTouches[0].clientY; },{passive:true});
bookEl.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)<44 || Math.abs(dx)<Math.abs(dy)) return;
  if(dx<0) vertical?prev():next(); else vertical?next():prev();
},{passive:true});

let rt;
window.addEventListener('resize',()=>{ clearTimeout(rt); const keep=currentBlock(); rt=setTimeout(()=>layout(keep),180); });

if(document.fonts && document.fonts.ready){ document.fonts.ready.then(()=>layout(null)); }
layout(null);

/* shioriAuto: トップページからの「しおりの続きから」 */
if(/[?&]shiori=1/.test(location.search)){
  var _try=function(n){
    try{
      if(bm){ var p=pageOfAnchor(bm); if(p>0){ idx=p; update(0); return; } }
    }catch(e){}
    if(n>0) setTimeout(function(){ _try(n-1); }, 300);
  };
  setTimeout(function(){ _try(6); }, 300);
}
</script>
