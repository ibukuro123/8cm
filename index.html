<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>『8センチメートル』シリーズ｜胃袋一二三</title>
<meta name="description" content="身長八センチメートルの小さき者たちの物語。五作を、そのまま読めます。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="『8センチメートル』シリーズ">
<meta property="og:title" content="『8センチメートル』シリーズ">
<meta property="og:description" content="身長八センチメートルの小さき者たちの物語。五作を、そのまま読めます。">
<meta property="og:url" content="https://ibukuro123.github.io/8cm/">
<meta property="og:image" content="https://ibukuro123.github.io/8cm/og/og_series.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://ibukuro123.github.io/8cm/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📏</text></svg>">
<style>
  :root{--bg:#cbc3ad;--paper:#e3ddcb;--ink:#2b2722;--soft:#5f584b;--shu:#a8402c;--rule:#8b8069;}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);}
  body{font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","Noto Serif CJK JP",serif;
       padding:env(safe-area-inset-top,0) 16px env(safe-area-inset-bottom,0);}
  .wrap{max-width:900px;margin:0 auto;position:relative;padding-left:52px;}
  .ruler{position:absolute;inset-block:0;left:0;width:40px;pointer-events:none;}
  .ruler .bar{position:absolute;inset-block:0;left:20px;width:1.5px;background:var(--rule);opacity:.7;}
  .ruler .tick{position:absolute;left:20px;height:1.5px;background:var(--rule);opacity:.6;}
  .ruler .num{position:absolute;left:0;width:16px;text-align:right;font-size:11px;color:var(--soft);transform:translateY(-50%);}
  header{padding:52px 0 20px;}
  h1{margin:0;font-size:clamp(23px,5.2vw,36px);letter-spacing:.08em;}
  .by{margin-top:9px;color:var(--soft);letter-spacing:.3em;font-size:14px;}
  .lead{margin-top:18px;line-height:1.95;font-size:15px;max-width:34em;}
  .orderbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:20px 0 4px;font-size:13px;color:var(--soft);}
  .orderbar .seg{display:flex;border:1px solid rgba(90,80,60,.45);}
  .orderbar button{font:inherit;font-size:13px;background:none;border:none;padding:7px 14px;color:var(--soft);cursor:pointer;letter-spacing:.08em;}
  .orderbar button[aria-pressed="true"]{background:var(--paper);color:var(--ink);}
  section.group{margin:26px 0 0;}
  .ghead{display:flex;align-items:center;gap:10px;width:100%;font:inherit;font-size:14px;letter-spacing:.18em;color:var(--ink);
         background:none;border:none;border-bottom:1px solid rgba(90,80,60,.35);padding:0 0 8px;cursor:pointer;text-align:start;}
  .ghead .cnt{font-size:12px;color:var(--soft);letter-spacing:.06em;}
  .ghead .arw{margin-inline-start:auto;font-size:11px;color:var(--soft);transition:transform .2s;}
  .ghead[aria-expanded="false"] .arw{transform:rotate(-90deg);}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:18px 14px;margin:18px 0 0;}
  .ghead[aria-expanded="false"] + .grid{display:none;}
  .tile{font:inherit;background:none;border:none;padding:0;cursor:pointer;text-align:center;color:inherit;}
  .tile img{width:100%;height:auto;display:block;box-shadow:0 6px 16px rgba(40,30,15,.28);transition:transform .18s;}
  .tile[aria-expanded="true"] img,.tile:hover img,.tile:focus-visible img{transform:translateY(-4px);}
  .tile .tt{display:block;margin-top:8px;font-size:12.5px;letter-spacing:.04em;line-height:1.5;}
  .tile .badge{display:block;font-size:11px;color:var(--shu);margin-top:3px;}
  .panel{margin:18px 0 0;background:var(--paper);border:1px solid rgba(90,80,60,.28);padding:18px 18px 16px;position:relative;}
  .panel[hidden]{display:none;}
  .panel .pmark{position:absolute;top:12px;inset-inline-end:14px;width:34px;height:34px;opacity:.85;}
  .panel .pmark svg{width:34px;height:34px;display:block;}
  .panel h2{margin:0;font-size:19px;letter-spacing:.06em;padding-inline-end:44px;}
  .panel .sub{margin:5px 0 0;font-size:13px;color:var(--soft);}
  .panel .desc{margin:12px 0 0;font-size:14px;line-height:1.85;}
  .panel .meta{margin:10px 0 0;font-size:12px;color:var(--soft);}
  .actions{margin:14px 0 0;display:flex;gap:10px;flex-wrap:wrap;}
  .btn{font:inherit;font-size:13px;letter-spacing:.1em;padding:8px 14px;border:1px solid rgba(90,80,60,.5);background:#efeade;color:var(--ink);text-decoration:none;cursor:pointer;}
  .btn.cont{border-color:rgba(168,64,44,.6);color:var(--shu);}
  .btn.cart{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;}
  .cartico{width:26px;height:17px;display:block;overflow:visible;}
  .cartico .w{transform-origin:center;transform-box:fill-box;}
  .btn.cart.spin .cartico .w{animation:roll .7s ease-out;}
  @keyframes roll{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion:reduce){.btn.cart.spin .cartico .w{animation:none;}}
  .btn:focus-visible,.tile:focus-visible,.ghead:focus-visible{outline:2px solid var(--shu);outline-offset:3px;}
  footer{padding:30px 0 44px;font-size:12px;color:var(--soft);letter-spacing:.1em;}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--paper);
         font-size:13px;letter-spacing:.08em;padding:10px 18px;opacity:0;transition:opacity .25s;pointer-events:none;}
  .toast.on{opacity:1;}
  @media (max-width:560px){
    .wrap{padding-left:40px;} .ruler{width:30px;} .ruler .bar,.ruler .tick{left:14px;} .ruler .num{width:11px;font-size:10px;}
    .grid{grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:16px 12px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="ruler" id="ruler" aria-hidden="true"><div class="bar"></div></div>
  <header>
    <h1>『8センチメートル』シリーズ</h1>
    <div class="by">胃袋一二三</div>
    <p class="lead">身長八センチメートルの、小さき者たちの物語です。五作とも、この場で最後まで読めます。表紙を選ぶと、あらすじが開きます。</p>
    <div class="orderbar">
      <span>並び順</span>
      <span class="seg">
        <button type="button" id="ordPub" aria-pressed="true">発表順</button>
        <button type="button" id="ordChrono" aria-pressed="false">時系列順</button>
      </span>
      <span id="ordNote"></span>
    </div>
  </header>
  <div id="groups"></div>
  <footer>© 2026 胃袋一二三</footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
  var BOOKS=[{"slug": "8cm", "t": "8センチメートル", "sub": "待っています。何年でも", "d": "身長八センチメートルの青年よしゆきは、六十年前の手紙を頼りに、仲間と北の丘をめざす。", "pub": 1, "chrono": 2, "min": 35, "group": "main"}, {"slug": "lario", "t": "ラリオ前史", "sub": "考えると、道って、消えるじゃん?", "d": "道しか覚えていない配達員ラリオ。十年前、賭場の町で彼に何が起きたのか。", "pub": 2, "chrono": 1, "min": 27, "group": "side"}, {"slug": "9cm", "t": "9センチメートル", "sub": "数えられないもの", "d": "四百十二枚の手紙に、一度だけ返事が来た。よしゆきたちは南の町へ向かう。", "pub": 3, "chrono": 4, "min": 38, "group": "main"}, {"slug": "hanpo", "t": "半歩", "sub": "片方の靴", "d": "年に一度、北の町の角に立つ男がいる。自分を忘れた相手に、名乗るために。", "pub": 4, "chrono": 3, "min": 27, "group": "side"}, {"slug": "1cm", "t": "1センチメートル", "sub": "二本の線のあいだ", "d": "駅裏の古本屋うろこ堂が、店を閉めることになった。壁の隙間の六人に残された日数は、六十日。", "pub": 5, "chrono": 5, "min": 41, "group": "main"}];
  var MARKS={"8cm": "<svg viewBox=\"0 0 40 40\" aria-hidden=\"true\"><polyline points=\"4,20 12,19 20,20.6 28,19.4 36,20\" fill=\"none\" stroke=\"#4d5157\" stroke-width=\"2.6\" stroke-linecap=\"round\"/></svg>", "lario": "<svg viewBox=\"0 0 40 40\" aria-hidden=\"true\"><g opacity=\".85\"><ellipse cx=\"14\" cy=\"26\" rx=\"3.2\" ry=\"5.2\" fill=\"#4d5157\"/><ellipse cx=\"14\" cy=\"33.5\" rx=\"2.4\" ry=\"2.5\" fill=\"#4d5157\"/></g><g opacity=\".35\"><ellipse cx=\"24\" cy=\"12\" rx=\"3.2\" ry=\"5.2\" fill=\"#4d5157\"/><ellipse cx=\"24\" cy=\"19.5\" rx=\"2.4\" ry=\"2.5\" fill=\"#4d5157\"/></g></svg>", "9cm": "<svg viewBox=\"0 0 40 40\" aria-hidden=\"true\"><polyline points=\"4,26 20,25.4 32,26\" fill=\"none\" stroke=\"#4d5157\" stroke-width=\"1.8\" stroke-linecap=\"round\" opacity=\".4\"/><polyline points=\"4,15 12,14 20,15.6 28,14.4 36,15\" fill=\"none\" stroke=\"#a8402c\" stroke-width=\"2.8\" stroke-linecap=\"round\"/></svg>", "hanpo": "<svg viewBox=\"0 0 40 40\" aria-hidden=\"true\"><g opacity=\".8\"><ellipse cx=\"13\" cy=\"28\" rx=\"3.2\" ry=\"5.2\" fill=\"#4d5157\"/><ellipse cx=\"13\" cy=\"35\" rx=\"2.4\" ry=\"2.5\" fill=\"#4d5157\"/></g><line x1=\"17\" y1=\"14\" x2=\"25\" y2=\"14\" stroke=\"#4d5157\" stroke-width=\"1.1\" stroke-dasharray=\"2 2\" opacity=\".6\"/><g><ellipse cx=\"28\" cy=\"11\" rx=\"3.2\" ry=\"5.2\" fill=\"#a8402c\"/><ellipse cx=\"28\" cy=\"18\" rx=\"2.4\" ry=\"2.5\" fill=\"#a8402c\"/></g></svg>", "1cm": "<svg viewBox=\"0 0 40 40\" aria-hidden=\"true\"><polyline points=\"4,12 20,11.4 36,12\" fill=\"none\" stroke=\"#a8402c\" stroke-width=\"2.6\" stroke-linecap=\"round\"/><polyline points=\"10,20 14,18.6 18,21.4 22,18.6 26,21.4 30,20\" fill=\"none\" stroke=\"#4d5157\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\".7\"/><polyline points=\"4,29 20,28.4 36,29\" fill=\"none\" stroke=\"#4d5157\" stroke-width=\"2.6\" stroke-linecap=\"round\"/></svg>"};
  var CART='<svg class="cartico" viewBox="0 0 30 20" aria-hidden="true"><rect x="6" y="3" width="15" height="9" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6 12 H24" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M24 12 L27 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><g class="w"><circle cx="10" cy="16" r="2.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10 13.4 V18.6" stroke="currentColor" stroke-width="1"/></g><g class="w"><circle cx="20" cy="16" r="2.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M20 13.4 V18.6" stroke="currentColor" stroke-width="1"/></g></svg>';
  var groupsEl=document.getElementById('groups');
  var order='pub', openSlug=null, openState={};
  try{ var o=localStorage.getItem('8cm:order'); if(o==='chrono') order='chrono'; }catch(e){}
  try{ var g=JSON.parse(localStorage.getItem('8cm:groups')||'{}'); openState=g||{}; }catch(e){}

  function bookmarked(b){ try{ return !!localStorage.getItem('shiori:'+b.t); }catch(e){ return false; } }
  function esc(x){ return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }

  function tile(b,firstMark){
    return '<button class="tile" type="button" data-slug="'+b.slug+'" aria-expanded="false">'
      + '<img src="covers/'+b.slug+'.jpg" alt="'+esc(b.t)+'　表紙" width="600" height="960" loading="lazy">'
      + '<span class="tt">'+esc(b.t)+'</span>'
      + (firstMark ? '<span class="badge">ここから</span>' : (bookmarked(b) ? '<span class="badge">しおり</span>' : ''))
      + '</button>';
  }
  function section(id,title,list,firstSlug){
    var open = openState[id]!==false;
    return '<section class="group" data-group="'+id+'">'
      + '<button class="ghead" type="button" aria-expanded="'+open+'" data-g="'+id+'">'
      + '<span>'+title+'</span><span class="cnt">'+list.length+'作</span><span class="arw">▼</span></button>'
      + '<div class="grid">'+list.map(function(b){ return tile(b, b.slug===firstSlug); }).join('')+'</div>'
      + '<div class="panel" hidden></div></section>';
  }
  function render(){
    var sorted=BOOKS.slice().sort(function(a,b){ return a[order]-b[order]; });
    var firstSlug=sorted[0].slug, h='';
    if(order==='chrono'){
      h=section('all','時系列順',sorted,firstSlug);
    } else {
      h=section('main','本編',sorted.filter(function(b){return b.group==='main';}),firstSlug)
       +section('side','外伝',sorted.filter(function(b){return b.group==='side';}),null);
    }
    groupsEl.innerHTML=h;
    document.getElementById('ordPub').setAttribute('aria-pressed',String(order==='pub'));
    document.getElementById('ordChrono').setAttribute('aria-pressed',String(order==='chrono'));
    document.getElementById('ordNote').textContent = (order==='pub')
      ? 'はじめての方は、本編の『8センチメートル』からどうぞ。'
      : '出来事が起きた順です。『8センチメートル』を読んでからをおすすめします。';
    if(openSlug) openPanel(openSlug,false);
    drawTicks();
  }
  function openPanel(slug,scroll){
    var b=null; BOOKS.forEach(function(x){ if(x.slug===slug) b=x; });
    if(!b) return;
    var tileEl=groupsEl.querySelector('.tile[data-slug="'+slug+'"]');
    if(!tileEl) return;
    var sec=tileEl.closest('.group'), panel=sec.querySelector('.panel');
    groupsEl.querySelectorAll('.tile').forEach(function(t){ t.setAttribute('aria-expanded', String(t===tileEl)); });
    groupsEl.querySelectorAll('.panel').forEach(function(p){ if(p!==panel){ p.hidden=true; p.innerHTML=''; } });
    panel.innerHTML='<div class="pmark">'+MARKS[b.slug]+'</div>'
      + '<h2>'+esc(b.t)+'</h2><p class="sub">'+esc(b.sub)+'</p><p class="desc">'+esc(b.d)+'</p>'
      + '<p class="meta">読むのに約'+b.min+'分</p>'
      + '<p class="actions"><a class="btn read" href="'+b.slug+'.html">'+(bookmarked(b)?'最初から':'最初から読む')+'</a>'
      + (bookmarked(b)?'<a class="btn cont" href="'+b.slug+'.html?shiori=1">しおりの続きから</a>':'')
      + '<button class="btn cart share" type="button" data-share="'+b.slug+'" aria-label="この作品を共有する">'+CART+'<span>運ぶ</span></button></p>';
    panel.hidden=false; openSlug=slug;
    if(scroll){ panel.scrollIntoView({block:'nearest',behavior:'smooth'}); }
    drawTicks();
  }
  groupsEl.addEventListener('click', function(e){
    var gh=e.target.closest('.ghead');
    if(gh){ var op=gh.getAttribute('aria-expanded')!=='true'; gh.setAttribute('aria-expanded',String(op));
      openState[gh.dataset.g]=op; try{ localStorage.setItem('8cm:groups',JSON.stringify(openState)); }catch(err){} drawTicks(); return; }
    var t=e.target.closest('.tile');
    if(t){
      if(t.getAttribute('aria-expanded')==='true'){
        t.setAttribute('aria-expanded','false');
        var p=t.closest('.group').querySelector('.panel'); p.hidden=true; p.innerHTML=''; openSlug=null; drawTicks(); return;
      }
      openPanel(t.dataset.slug,true); return;
    }
    var btn=e.target.closest('.share');
    if(btn){
      btn.classList.add('spin'); setTimeout(function(){ btn.classList.remove('spin'); },750);
      var b=null; BOOKS.forEach(function(x){ if(x.slug===btn.dataset.share) b=x; });
      var url=location.href.replace(/index\.html.*$/,'').replace(/[?#].*$/,'')+b.slug+'.html';
      var title='『'+b.t+'』胃袋一二三';
      if(navigator.share){ navigator.share({title:title,text:title,url:url}).catch(function(){}); return; }
      if(navigator.clipboard){ navigator.clipboard.writeText(title+' '+url).then(function(){ say('リンクをコピーしました'); },function(){ prompt('リンク',url); }); }
      else { prompt('リンク',url); }
    }
  });
  document.getElementById('ordPub').onclick=function(){ order='pub'; save(); render(); };
  document.getElementById('ordChrono').onclick=function(){ order='chrono'; save(); render(); };
  function save(){ try{ localStorage.setItem('8cm:order',order); }catch(e){} }

  var toast=document.getElementById('toast'), tid=null;
  function say(m){ toast.textContent=m; toast.classList.add('on'); clearTimeout(tid); tid=setTimeout(function(){toast.classList.remove('on');},2200); }

  var ruler=document.getElementById('ruler');
  function drawTicks(){
    [].slice.call(ruler.querySelectorAll('.tick,.num')).forEach(function(el){ el.remove(); });
    var h=document.querySelector('.wrap').offsetHeight, step=22, n=Math.floor(h/step), cm=0;
    for(var i=0;i<=n;i++){
      var t=document.createElement('div'); t.className='tick'; var big=(i%5===0);
      t.style.top=(i*step)+'px'; t.style.width=(big?13:8)+'px'; ruler.appendChild(t);
      if(big){ cm++; var d=document.createElement('div'); d.className='num'; d.style.top=(i*step)+'px'; d.textContent=cm; ruler.appendChild(d); }
    }
  }
  window.addEventListener('resize',drawTicks);
  window.addEventListener('load',drawTicks);
  render();
})();
</script>
</body>
</html>
