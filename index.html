<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>『8センチメートル』シリーズ｜胃袋一二三</title>
<meta name="description" content="身長八センチメートルの小さき者たちの物語。五作を、そのまま読めます。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="『8センチメートル』シリーズ">
<meta property="og:title" content="『8センチメートル』シリーズ">
<meta property="og:description" content="身長八センチメートルの小さき者たちの物語。五作を、そのまま読めます。">
<meta property="og:url" content="https://ibukuro123.github.io/8cm/">
<meta property="og:image" content="https://ibukuro123.github.io/8cm/og/og_series.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://ibukuro123.github.io/8cm/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📏</text></svg>">
<style>
  :root{--board:#3b342b;--board2:#2e2820;--paper:#e3ddcb;--ink:#2b2722;--soft:#5f584b;--shu:#a8402c;--gap:#d8d1bb;}
  *{box-sizing:border-box}
  html{background:var(--board);}
  body{margin:0;color:var(--ink);min-height:100vh;
    background-color:var(--board);
    background-image:
      repeating-linear-gradient(90deg, rgba(0,0,0,.22) 0 2px, transparent 2px 7px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 1px, transparent 1px 23px),
      linear-gradient(90deg, var(--board2), var(--board) 22%, var(--board) 78%, var(--board2));
    font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","Noto Serif CJK JP",serif;
    padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);}
  /* 壁の隙間 */
  .gap{position:relative;max-width:660px;margin:0 auto;min-height:100vh;padding:44px 22px 40px;
    background:linear-gradient(180deg,#ded7c2,var(--gap) 30%,#d3ccb6);
    box-shadow:0 0 0 1px rgba(20,14,6,.5), 26px 0 34px -26px rgba(0,0,0,.75) inset, -26px 0 34px -26px rgba(0,0,0,.75) inset;}
  /* 節穴の光 */
  .beam{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
  .beam .hole{position:absolute;top:26px;right:28px;width:13px;height:9px;border-radius:50%;
    background:radial-gradient(ellipse at 50% 50%, #fff6d9, #c9b98b 70%, rgba(0,0,0,.35));box-shadow:0 0 10px rgba(255,240,200,.75);}
  .beam .ray{position:absolute;top:30px;right:20px;width:150px;height:130vh;transform-origin:top right;transform:rotate(19deg);
    background:linear-gradient(180deg, rgba(255,246,214,.5), rgba(255,246,214,.12) 42%, rgba(255,246,214,0) 78%);filter:blur(7px);}
  header{position:relative;}
  h1{margin:0;white-space:nowrap;letter-spacing:.04em;font-size:30px;}
  .by{margin-top:9px;color:var(--soft);letter-spacing:.3em;font-size:13px;}
  .lead{margin-top:16px;line-height:1.95;font-size:15px;max-width:32em;}
  main{position:relative;margin-top:26px;display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:20px 14px;}
  .tile{font:inherit;background:none;border:none;padding:0;cursor:pointer;color:inherit;text-align:center;}
  .tile img{width:100%;height:auto;display:block;box-shadow:0 7px 18px rgba(25,18,8,.4);transition:transform .18s;}
  .tile:hover img,.tile:focus-visible img,.tile[aria-expanded="true"] img{transform:translateY(-5px);}
  .tile .tt{display:block;margin-top:8px;font-size:12.5px;line-height:1.5;letter-spacing:.04em;}
  .tile .badge{display:block;margin-top:3px;font-size:11px;color:var(--shu);}
  .panel{position:relative;margin-top:22px;background:var(--paper);border:1px solid rgba(60,45,20,.35);padding:16px;
    box-shadow:0 8px 20px rgba(25,18,8,.28);}
  .panel[hidden]{display:none;}
  .panel h2{margin:0;font-size:18px;letter-spacing:.05em;}
  .panel .sub{margin:4px 0 0;font-size:12.5px;color:var(--soft);}
  .panel .desc{margin:10px 0 0;font-size:14px;line-height:1.85;}
  .panel .meta{margin:8px 0 0;font-size:12px;color:var(--soft);}
  .actions{margin:12px 0 0;display:flex;gap:9px;flex-wrap:wrap;}
  .btn{font:inherit;font-size:13px;letter-spacing:.1em;padding:8px 13px;border:1px solid rgba(90,80,60,.5);background:#efeade;color:var(--ink);text-decoration:none;cursor:pointer;}
  .btn.cont{border-color:rgba(168,64,44,.6);color:var(--shu);}
  .btn.cart{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;}
  .cartico{width:26px;height:17px;display:block;overflow:visible;}
  .cartico .w{transform-origin:center;transform-box:fill-box;}
  .btn.cart.spin .cartico .w{animation:roll .7s ease-out;}
  @keyframes roll{to{transform:rotate(360deg);}}
  main.deliver .tile{opacity:0;transform:translateX(-16px);animation:deliver .5s ease-out forwards;}
  @keyframes deliver{to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){main.deliver .tile{opacity:1;transform:none;animation:none;} .btn.cart.spin .cartico .w{animation:none;}}
  .btn:focus-visible,.tile:focus-visible{outline:2px solid var(--shu);outline-offset:3px;}
  footer{position:relative;margin-top:34px;font-size:12px;color:var(--soft);letter-spacing:.1em;}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--paper);
    font-size:13px;letter-spacing:.08em;padding:10px 18px;opacity:0;transition:opacity .25s;pointer-events:none;}
  .toast.on{opacity:1;}
  @media (max-width:560px){
    .gap{padding:38px 16px 34px;}
    main{grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:18px 12px;}
  }
</style>
</head>
<body>
<div class="gap">
  <div class="beam" aria-hidden="true"><div class="ray"></div><div class="hole"></div></div>
  <header>
    <h1 id="ttl">『8センチメートル』シリーズ</h1>
    <div class="by">胃袋一二三</div>
    <p class="lead">身長八センチメートルの、小さき者たちの物語です。発表順に五作、この場で最後まで読めます。表紙を選ぶと、あらすじが開きます。</p>
  </header>
  <main id="list"></main>
  <div class="panel" id="panel" hidden></div>
  <footer>© 2026 胃袋一二三</footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
  var BOOKS=[{"slug": "8cm", "t": "8センチメートル", "sub": "待っています。何年でも", "d": "身長八センチメートルの青年よしゆきは、六十年前の手紙を頼りに、仲間と北の丘をめざす。", "min": 35}, {"slug": "lario", "t": "ラリオ前史", "sub": "考えると、道って、消えるじゃん?", "d": "道しか覚えていない配達員ラリオ。十年前、賭場の町で彼に何が起きたのか。", "min": 27}, {"slug": "9cm", "t": "9センチメートル", "sub": "数えられないもの", "d": "四百十二枚の手紙に、一度だけ返事が来た。よしゆきたちは南の町へ向かう。", "min": 38}, {"slug": "hanpo", "t": "半歩", "sub": "片方の靴", "d": "年に一度、北の町の角に立つ男がいる。自分を忘れた相手に、名乗るために。", "min": 27}, {"slug": "1cm", "t": "1センチメートル", "sub": "二本の線のあいだ", "d": "駅裏の古本屋うろこ堂が、店を閉めることになった。壁の隙間の六人に残された日数は、六十日。", "min": 41}], CART='<svg class="cartico" viewBox="0 0 30 20" aria-hidden="true"><rect x="6" y="3" width="15" height="9" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6 12 H24" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M24 12 L27 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><g class="w"><circle cx="10" cy="16" r="2.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10 13.4 V18.6" stroke="currentColor" stroke-width="1"/></g><g class="w"><circle cx="20" cy="16" r="2.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M20 13.4 V18.6" stroke="currentColor" stroke-width="1"/></g></svg>';
  var list=document.getElementById('list'), panel=document.getElementById('panel'), openSlug=null;
  function esc(x){ return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
  function bookmarked(b){ try{ return !!localStorage.getItem('shiori:'+b.t); }catch(e){ return false; } }
  function fitTitle(){
    var el=document.getElementById('ttl'), max=el.parentNode.clientWidth, fs=34;
    el.style.fontSize=fs+'px';
    while(fs>13 && el.scrollWidth>max){ fs-=0.5; el.style.fontSize=fs+'px'; }
  }
  list.innerHTML=BOOKS.map(function(b,i){
    return '<button class="tile" type="button" data-slug="'+b.slug+'" aria-expanded="false">'
      + '<img src="covers/'+b.slug+'.jpg" alt="'+esc(b.t)+'　表紙" width="600" height="960" loading="lazy">'
      + '<span class="tt">'+esc(b.t)+'</span>'
      + (i===0 ? '<span class="badge">ここから</span>' : (bookmarked(b)?'<span class="badge">しおり</span>':''))
      + '</button>';
  }).join('');
  var firstVisit=false;
  try{ firstVisit=!localStorage.getItem('8cm:seen'); localStorage.setItem('8cm:seen','1'); }catch(e){}
  if(firstVisit){
    list.classList.add('deliver');
    [].slice.call(list.querySelectorAll('.tile')).forEach(function(t,i){ t.style.animationDelay=(i*150)+'ms'; });
  }
  function open(slug,scroll){
    var b=null; BOOKS.forEach(function(x){ if(x.slug===slug) b=x; });
    var tile=list.querySelector('.tile[data-slug="'+slug+'"]'); if(!b||!tile) return;
    list.querySelectorAll('.tile').forEach(function(t){ t.setAttribute('aria-expanded', String(t===tile)); });
    panel.innerHTML='<h2>'+esc(b.t)+'</h2><p class="sub">'+esc(b.sub)+'</p><p class="desc">'+esc(b.d)+'</p>'
      + '<p class="meta">読むのに約'+b.min+'分</p><p class="actions">'
      + '<a class="btn" href="'+b.slug+'.html">'+(bookmarked(b)?'最初から':'最初から読む')+'</a>'
      + (bookmarked(b)?'<a class="btn cont" href="'+b.slug+'.html?shiori=1">しおりの続きから</a>':'')
      + '<button class="btn cart share" type="button" data-share="'+b.slug+'" aria-label="この作品を共有する">'+CART+'<span>運ぶ</span></button></p>';
    panel.hidden=false; openSlug=slug;
    if(scroll) panel.scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  document.addEventListener('click', function(e){
    var t=e.target.closest('.tile');
    if(t){
      if(t.getAttribute('aria-expanded')==='true'){ t.setAttribute('aria-expanded','false'); panel.hidden=true; panel.innerHTML=''; openSlug=null; return; }
      open(t.dataset.slug,true); return;
    }
    var btn=e.target.closest('.share');
    if(btn){
      btn.classList.add('spin'); setTimeout(function(){ btn.classList.remove('spin'); },750);
      var b=null; BOOKS.forEach(function(x){ if(x.slug===btn.dataset.share) b=x; });
      var url=location.href.replace(/index\.html.*$/,'').replace(/[?#].*$/,'')+b.slug+'.html';
      var title='『'+b.t+'』胃袋一二三';
      if(navigator.share){ navigator.share({title:title,text:title,url:url}).catch(function(){}); return; }
      if(navigator.clipboard){ navigator.clipboard.writeText(title+' '+url).then(function(){ say('リンクをコピーしました'); },function(){ prompt('リンク',url); }); }
      else prompt('リンク',url);
    }
  });
  var toast=document.getElementById('toast'), tid=null;
  function say(m){ toast.textContent=m; toast.classList.add('on'); clearTimeout(tid); tid=setTimeout(function(){toast.classList.remove('on');},2200); }
  window.addEventListener('resize',fitTitle); window.addEventListener('load',fitTitle); fitTitle();
})();
</script>
</body>
</html>
