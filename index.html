<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>『8センチメートル』シリーズ｜胃袋一二三</title>
<meta name="description" content="身長八センチメートルの小さき者たちの物語。五作を、そのまま読めます。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="『8センチメートル』シリーズ">
<meta property="og:title" content="『8センチメートル』シリーズ">
<meta property="og:description" content="身長八センチメートルの小さき者たちの物語。五作を、そのまま読めます。">
<meta property="og:url" content="https://ibukuro123.github.io/8cm/">
<meta property="og:image" content="https://ibukuro123.github.io/8cm/og/og_series.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://ibukuro123.github.io/8cm/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📏</text></svg>">
<style>
  :root{--wall:#c7bfa8;--paper:#e3ddcb;--ink:#2b2722;--soft:#5f584b;--shu:#a8402c;--wood:#8b7a5c;--wood2:#6f6046;}
  *{box-sizing:border-box}
  html,body{margin:0;color:var(--ink);background:var(--wall);}
  body{font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","Noto Serif CJK JP",serif;
    background-image:repeating-linear-gradient(90deg,rgba(90,72,40,.05) 0 1px,transparent 1px 9px);
    padding:env(safe-area-inset-top,0) 16px env(safe-area-inset-bottom,0);}
  .wrap{max-width:860px;margin:0 auto;}
  header{padding:46px 0 10px;}
  h1{margin:0;white-space:nowrap;letter-spacing:.04em;font-size:30px;}
  .by{margin-top:9px;color:var(--soft);letter-spacing:.3em;font-size:13px;}
  .lead{margin-top:16px;line-height:1.95;font-size:15px;max-width:34em;}
  .orderbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0 0;font-size:13px;color:var(--soft);}
  .orderbar .seg{display:flex;border:1px solid rgba(90,80,60,.45);}
  .orderbar button{font:inherit;font-size:13px;background:none;border:none;padding:7px 14px;color:var(--soft);cursor:pointer;letter-spacing:.08em;}
  .orderbar button[aria-pressed="true"]{background:var(--paper);color:var(--ink);}
  .shelf{margin:30px 0 0;}
  .shelf h2{margin:0 0 10px;font-size:13px;letter-spacing:.24em;color:var(--soft);font-weight:400;}
  .row{position:relative;display:flex;align-items:flex-end;gap:7px;padding:0 10px;min-height:250px;}
  .board{height:14px;background:linear-gradient(180deg,var(--wood),var(--wood2));box-shadow:0 8px 18px rgba(60,45,20,.35);border-radius:1px;}
  .spine{position:relative;flex:0 0 auto;width:46px;height:232px;border:none;padding:0;cursor:pointer;
    box-shadow:inset -7px 0 12px -7px rgba(0,0,0,.45),inset 5px 0 8px -5px rgba(255,255,255,.3),0 5px 12px rgba(50,38,18,.3);
    transition:transform .22s ease;transform-origin:bottom center;font:inherit;}
  .spine:hover,.spine:focus-visible{transform:translateY(-12px);}
  .spine[aria-expanded="true"]{transform:translateY(-18px);}
  .spine .stitle{position:absolute;top:16px;left:0;right:0;display:flex;justify-content:center;}
  .spine .stitle span{writing-mode:vertical-rl;font-size:15px;letter-spacing:.1em;line-height:1;}
  .spine .sauthor{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;}
  .spine .sauthor span{writing-mode:vertical-rl;font-size:9.5px;letter-spacing:.28em;opacity:.75;}
  .spine .tick{position:absolute;left:4px;width:16px;height:2px;border-radius:1px;}
  .spine .badge{position:absolute;top:-17px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10.5px;color:var(--shu);letter-spacing:.04em;}
  .spine .foot{position:absolute;left:0;right:0;display:flex;justify-content:center;}
  .panel{margin:22px 0 0;background:var(--paper);border:1px solid rgba(90,80,60,.28);padding:16px;display:grid;
    grid-template-columns:88px 1fr;gap:16px;align-items:start;}
  .panel[hidden]{display:none;}
  .panel img{width:100%;height:auto;display:block;box-shadow:0 5px 14px rgba(40,30,15,.3);}
  .panel h3{margin:0;font-size:18px;letter-spacing:.05em;}
  .panel .sub{margin:4px 0 0;font-size:12.5px;color:var(--soft);}
  .panel .desc{margin:10px 0 0;font-size:14px;line-height:1.85;}
  .panel .meta{margin:8px 0 0;font-size:12px;color:var(--soft);}
  .actions{margin:12px 0 0;display:flex;gap:9px;flex-wrap:wrap;}
  .btn{font:inherit;font-size:13px;letter-spacing:.1em;padding:8px 13px;border:1px solid rgba(90,80,60,.5);background:#efeade;color:var(--ink);text-decoration:none;cursor:pointer;}
  .btn.cont{border-color:rgba(168,64,44,.6);color:var(--shu);}
  .btn.cart{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;}
  .cartico{width:26px;height:17px;display:block;overflow:visible;}
  .cartico .w{transform-origin:center;transform-box:fill-box;}
  .btn.cart.spin .cartico .w{animation:roll .7s ease-out;}
  @keyframes roll{to{transform:rotate(360deg);}}
  .deliver .spine{opacity:0;transform:translateX(-22px);animation:deliver .5s ease-out forwards;}
  @keyframes deliver{to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){.deliver .spine{opacity:1;transform:none;animation:none;} .btn.cart.spin .cartico .w{animation:none;}}
  .btn:focus-visible,.spine:focus-visible,.orderbar button:focus-visible{outline:2px solid var(--shu);outline-offset:3px;}
  footer{padding:34px 0 44px;font-size:12px;color:var(--soft);letter-spacing:.1em;}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--paper);
    font-size:13px;letter-spacing:.08em;padding:10px 18px;opacity:0;transition:opacity .25s;pointer-events:none;}
  .toast.on{opacity:1;}
  @media (max-width:560px){
    .row{gap:5px;padding:0 6px;min-height:212px;}
    .spine{width:40px;height:196px;} .spine .stitle span{font-size:13px;}
    .panel{grid-template-columns:72px 1fr;gap:12px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="ttl">『8センチメートル』シリーズ</h1>
    <div class="by">胃袋一二三</div>
    <p class="lead">身長八センチメートルの、小さき者たちの物語です。五作とも、この場で最後まで読めます。背表紙を選ぶと、あらすじが開きます。</p>
    <div class="orderbar">
      <span>並び順</span>
      <span class="seg">
        <button type="button" id="ordPub" aria-pressed="true">発表順</button>
        <button type="button" id="ordChrono" aria-pressed="false">時系列順</button>
      </span>
      <span id="ordNote"></span>
    </div>
  </header>
  <div id="shelves"></div>
  <footer>© 2026 胃袋一二三</footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
  var BOOKS=[{"slug": "8cm", "t": "8センチメートル", "sub": "待っています。何年でも", "d": "身長八センチメートルの青年よしゆきは、六十年前の手紙を頼りに、仲間と北の丘をめざす。", "pub": 1, "chrono": 2, "min": 35, "group": "main", "bg": "#e3ddcb", "fg": "#2b2722", "mark": "p8"}, {"slug": "lario", "t": "ラリオ前史", "sub": "考えると、道って、消えるじゃん?", "d": "道しか覚えていない配達員ラリオ。十年前、賭場の町で彼に何が起きたのか。", "pub": 2, "chrono": 1, "min": 27, "group": "side", "bg": "#34302a", "fg": "#e3ddcb", "mark": "foot"}, {"slug": "9cm", "t": "9センチメートル", "sub": "数えられないもの", "d": "四百十二枚の手紙に、一度だけ返事が来た。よしゆきたちは南の町へ向かう。", "pub": 3, "chrono": 4, "min": 38, "group": "main", "bg": "#e3ddcb", "fg": "#2b2722", "mark": "s9"}, {"slug": "hanpo", "t": "半歩", "sub": "片方の靴", "d": "年に一度、北の町の角に立つ男がいる。自分を忘れた相手に、名乗るために。", "pub": 4, "chrono": 3, "min": 27, "group": "side", "bg": "#eceeec", "fg": "#2b2722", "mark": "half"}, {"slug": "1cm", "t": "1センチメートル", "sub": "二本の線のあいだ", "d": "駅裏の古本屋うろこ堂が、店を閉めることになった。壁の隙間の六人に残された日数は、六十日。", "pub": 5, "chrono": 5, "min": 41, "group": "main", "bg": "#e0d8c4", "fg": "#2b2722", "mark": "both"}], CART='<svg class="cartico" viewBox="0 0 30 20" aria-hidden="true"><rect x="6" y="3" width="15" height="9" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6 12 H24" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M24 12 L27 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><g class="w"><circle cx="10" cy="16" r="2.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10 13.4 V18.6" stroke="currentColor" stroke-width="1"/></g><g class="w"><circle cx="20" cy="16" r="2.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M20 13.4 V18.6" stroke="currentColor" stroke-width="1"/></g></svg>';
  var shelves=document.getElementById('shelves'), order='pub', openSlug=null;
  try{ if(localStorage.getItem('8cm:order')==='chrono') order='chrono'; }catch(e){}
  function esc(x){ return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
  function bookmarked(b){ try{ return !!localStorage.getItem('shiori:'+b.t); }catch(e){ return false; } }

  /* 見出しを一行に収める */
  function fitTitle(){
    var el=document.getElementById('ttl'), max=el.parentNode.clientWidth, fs=34;
    el.style.fontSize=fs+'px';
    while(fs>13 && el.scrollWidth>max){ fs-=0.5; el.style.fontSize=fs+'px'; }
  }

  function tick(b){
    var P='#4d5157', S='#a8402c', h=196, s='';
    function line(cm,color,op){ return '<div class="tick" style="bottom:'+(cm/14.8*100)+'%;background:'+color+';opacity:'+op+'"></div>'; }
    if(b.mark==='p8') s=line(8,P,.85);
    else if(b.mark==='s9') s=line(8,P,.3)+line(9,S,.95);
    else if(b.mark==='both') s=line(8,P,.8)+line(9,S,.9);
    else if(b.mark==='half') s='<div class="foot" style="bottom:42%"><svg width="14" height="26" viewBox="0 0 14 26" aria-hidden="true"><ellipse cx="4" cy="17" rx="2.6" ry="4.4" fill="#4d5157" opacity=".8"/><ellipse cx="4" cy="23" rx="1.9" ry="2" fill="#4d5157" opacity=".8"/><ellipse cx="10" cy="5" rx="2.6" ry="4.4" fill="#a8402c"/><ellipse cx="10" cy="11" rx="1.9" ry="2" fill="#a8402c"/></svg></div>';
    else if(b.mark==='foot') s='<div class="foot" style="bottom:30%"><svg width="14" height="30" viewBox="0 0 14 30" aria-hidden="true"><ellipse cx="4" cy="22" rx="2.6" ry="4.4" fill="#e3ddcb" opacity=".8"/><ellipse cx="4" cy="28" rx="1.9" ry="2" fill="#e3ddcb" opacity=".8"/><ellipse cx="10" cy="7" rx="2.6" ry="4.4" fill="#e3ddcb" opacity=".35"/><ellipse cx="10" cy="13" rx="1.9" ry="2" fill="#e3ddcb" opacity=".35"/></svg></div>';
    return s;
  }
  function spine(b,first){
    return '<button class="spine" type="button" data-slug="'+b.slug+'" aria-expanded="false" aria-label="'+esc(b.t)+'"'
      + ' style="background:'+b.bg+';color:'+b.fg+'">'
      + (first?'<span class="badge">ここから</span>':(bookmarked(b)?'<span class="badge">しおり</span>':''))
      + tick(b)
      + '<span class="stitle"><span>'+esc(b.t)+'</span></span>'
      + '<span class="sauthor"><span>胃袋一二三</span></span>'
      + '</button>';
  }
  function shelf(title,list,firstSlug){
    return '<section class="shelf">'+(title?'<h2>'+title+'</h2>':'')
      + '<div class="row">'+list.map(function(b){ return spine(b, b.slug===firstSlug); }).join('')+'</div>'
      + '<div class="board"></div><div class="panel" hidden></div></section>';
  }
  function render(){
    var sorted=BOOKS.slice().sort(function(a,b){ return a[order]-b[order]; }), first=sorted[0].slug, h='';
    if(order==='chrono') h=shelf('',sorted,first);
    else h=shelf('本編',sorted.filter(function(b){return b.group==='main';}),first)
          +shelf('外伝',sorted.filter(function(b){return b.group==='side';}),null);
    shelves.innerHTML=h;
    document.getElementById('ordPub').setAttribute('aria-pressed',String(order==='pub'));
    document.getElementById('ordChrono').setAttribute('aria-pressed',String(order==='chrono'));
    document.getElementById('ordNote').textContent=(order==='pub')
      ? 'はじめての方は、本編のいちばん左からどうぞ。'
      : '出来事が起きた順です。『8センチメートル』を読んでからをおすすめします。';
    var firstVisit=false;
    try{ firstVisit=!localStorage.getItem('8cm:seen'); localStorage.setItem('8cm:seen','1'); }catch(e){}
    if(firstVisit && !window.__delivered){
      window.__delivered=true;
      shelves.querySelectorAll('.row').forEach(function(r){ r.classList.add('deliver'); });
      var i=0; shelves.querySelectorAll('.spine').forEach(function(s){ s.style.animationDelay=(i*150)+'ms'; i++; });
    }
    if(openSlug) open(openSlug,false);
  }
  function open(slug,scroll){
    var b=null; BOOKS.forEach(function(x){ if(x.slug===slug) b=x; });
    var sp=shelves.querySelector('.spine[data-slug="'+slug+'"]'); if(!b||!sp) return;
    var sec=sp.closest('.shelf'), panel=sec.querySelector('.panel');
    shelves.querySelectorAll('.spine').forEach(function(s){ s.setAttribute('aria-expanded',String(s===sp)); });
    shelves.querySelectorAll('.panel').forEach(function(p){ if(p!==panel){ p.hidden=true; p.innerHTML=''; } });
    panel.innerHTML='<a href="'+b.slug+'.html"><img src="covers/'+b.slug+'.jpg" alt="'+esc(b.t)+'　表紙" width="600" height="960" loading="lazy"></a>'
      + '<div><h3>'+esc(b.t)+'</h3><p class="sub">'+esc(b.sub)+'</p><p class="desc">'+esc(b.d)+'</p>'
      + '<p class="meta">読むのに約'+b.min+'分</p><p class="actions">'
      + '<a class="btn" href="'+b.slug+'.html">'+(bookmarked(b)?'最初から':'最初から読む')+'</a>'
      + (bookmarked(b)?'<a class="btn cont" href="'+b.slug+'.html?shiori=1">しおりの続きから</a>':'')
      + '<button class="btn cart share" type="button" data-share="'+b.slug+'" aria-label="この作品を共有する">'+CART+'<span>運ぶ</span></button></p></div>';
    panel.hidden=false; openSlug=slug;
    if(scroll) panel.scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  shelves.addEventListener('click', function(e){
    var sp=e.target.closest('.spine');
    if(sp){
      if(sp.getAttribute('aria-expanded')==='true'){
        sp.setAttribute('aria-expanded','false');
        var p=sp.closest('.shelf').querySelector('.panel'); p.hidden=true; p.innerHTML=''; openSlug=null; return;
      }
      open(sp.dataset.slug,true); return;
    }
    var btn=e.target.closest('.share');
    if(btn){
      btn.classList.add('spin'); setTimeout(function(){ btn.classList.remove('spin'); },750);
      var b=null; BOOKS.forEach(function(x){ if(x.slug===btn.dataset.share) b=x; });
      var url=location.href.replace(/index\.html.*$/,'').replace(/[?#].*$/,'')+b.slug+'.html';
      var title='『'+b.t+'』胃袋一二三';
      if(navigator.share){ navigator.share({title:title,text:title,url:url}).catch(function(){}); return; }
      if(navigator.clipboard){ navigator.clipboard.writeText(title+' '+url).then(function(){ say('リンクをコピーしました'); },function(){ prompt('リンク',url); }); }
      else prompt('リンク',url);
    }
  });
  document.getElementById('ordPub').onclick=function(){ order='pub'; try{localStorage.setItem('8cm:order',order);}catch(e){} render(); };
  document.getElementById('ordChrono').onclick=function(){ order='chrono'; try{localStorage.setItem('8cm:order',order);}catch(e){} render(); };
  var toast=document.getElementById('toast'), tid=null;
  function say(m){ toast.textContent=m; toast.classList.add('on'); clearTimeout(tid); tid=setTimeout(function(){toast.classList.remove('on');},2200); }
  window.addEventListener('resize',fitTitle);
  window.addEventListener('load',fitTitle);
  fitTitle(); render();
})();
</script>
</body>
</html>
