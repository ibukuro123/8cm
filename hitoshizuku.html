<style>
  :root{
    --paper:#e3ddcb;
    --paper-deep:#d6cfba;
    --edge:#c2b9a0;
    --ink:#2b2722;
    --ink-soft:#6d6557;
    --pencil:#4d5157;
    --shu:#a8402c;
    --fs:17px;
    --lh:2.05;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    background:#b9b09a;
    background-image:
      radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.18), transparent 60%),
      repeating-linear-gradient(102deg, rgba(0,0,0,.025) 0 2px, transparent 2px 5px);
    color:var(--ink);
    font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP","Songti SC",serif;
    overflow:hidden;
    -webkit-text-size-adjust:100%;
  }
  #app{height:100dvh;display:flex;flex-direction:column;}

  /* ---- top bar ---- */
  .bar{
    flex:0 0 auto;display:flex;align-items:center;gap:14px;
    padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
  }
  .bar button{
    font:inherit;font-size:13px;letter-spacing:.14em;
    background:none;border:none;color:#4a4335;padding:6px 2px;cursor:pointer;
  }
  .bar button:focus-visible{outline:1.5px solid var(--shu);outline-offset:3px;}

  /* ---- ruler ---- */
  .ruler{flex:1 1 auto;display:flex;align-items:flex-end;gap:6px;height:26px;}
  .ruler .rn{font-size:11px;color:#5c5343;line-height:1;padding-bottom:3px;}
  .ruler svg{flex:1 1 auto;width:100%;height:100%;display:block;overflow:visible;}
  .rulerline{stroke:#5c5343;stroke-width:1;}
  .tick{stroke:#5c5343;stroke-width:1;}
  .tick.mm{stroke:#5c5343;opacity:.45;}
  .num{fill:#5c5343;font-size:9px;font-family:inherit;}
  #fpLayer{position:absolute;top:0;height:26px;pointer-events:none;overflow:hidden;}
  .ruler #fpLayer svg.fp{position:absolute;overflow:visible;flex:none;width:15px;height:9px;display:block;}
  .fp ellipse{fill:none;stroke:#a89d88;stroke-width:.7;stroke-dasharray:1.1 1.3;transition:fill .45s ease,stroke .45s ease,opacity .45s ease;}
  .fp.on ellipse{fill:#3e3c3a;stroke:none;opacity:.85;}
  .fp.on.gone ellipse{opacity:0;transition:opacity 1.4s ease .5s;}
  #dpLayer{position:absolute;top:0;height:26px;pointer-events:none;overflow:hidden;}
  #dpLayer .base{position:absolute;left:0;right:0;top:20px;height:1px;background:#b3a893;opacity:.7;}
  #dpLayer .dk{position:absolute;bottom:6px;width:1.5px;height:8px;margin-left:-.75px;background:#b3a893;transition:background .45s ease,height .45s ease;}
  #dpLayer .dk.ch{height:13px;}
  #dpLayer .dk.on{background:#4d5157;}
  #dpLayer .dk.now{background:var(--shu);width:2px;margin-left:-1px;}
  @media (prefers-reduced-motion:reduce){ #dpLayer .dk{transition:none;} }
  .ct{stroke:#b3a893;stroke-width:1;}
  .ct.past{stroke:#3e3c3a;stroke-width:1.6;}
  @media (prefers-reduced-motion:reduce){ .fp ellipse,.fp.on.gone ellipse{transition:none;} }
  #mark{transition:transform .35s cubic-bezier(.3,.7,.3,1);}
  #mark line{stroke:var(--pencil);stroke-width:2;stroke-linecap:round;}
  #mark text{fill:var(--pencil);font-size:8.5px;letter-spacing:.06em;}
  #finalmark{opacity:0;}
  #finalmark line{stroke:var(--shu);stroke-width:2.4;stroke-linecap:round;}
  #finalmark text{fill:var(--shu);font-size:9px;}
  #finalmark.show{opacity:1;animation:scratch .7s ease-out;}
  @keyframes scratch{from{clip-path:inset(0 0 100% 0);}to{clip-path:inset(0 0 0 0);}}

  /* ---- book ---- */
  #book{flex:1 1 auto;position:relative;padding:0 10px 4px;min-height:0;}
  .spread{
    height:100%;display:flex;gap:0;justify-content:center;
    filter:drop-shadow(0 10px 22px rgba(60,50,30,.32));
  }
  body.vert .spread{flex-direction:row-reverse;}
  .page{
    position:relative;flex:1 1 0;min-width:0;height:100%;max-width:640px;
    background:var(--paper);
    background-image:
      radial-gradient(ellipse at 20% 12%, rgba(255,255,255,.5), transparent 55%),
      radial-gradient(ellipse at 85% 90%, rgba(150,130,90,.18), transparent 60%);
    padding:26px 20px calc(22px + env(safe-area-inset-bottom));
    overflow:hidden;
    font-size:var(--fs);line-height:var(--lh);
    letter-spacing:.03em;
    text-align:justify;
  }
  body.vert .page{writing-mode:vertical-rl;text-orientation:mixed;text-align:start;}
  .col{inline-size:var(--colw,100%);block-size:100%;margin-inline:auto;}
  .page.blank{background:var(--paper-deep);}
  #pageB{display:none;}
  body.spread #pageB{display:block;}
  body.spread #pageA{box-shadow:inset -14px 0 22px -16px rgba(90,72,40,.55);}
  body.spread #pageB{box-shadow:inset 14px 0 22px -16px rgba(90,72,40,.55);}
  body.spread.vert #pageA{box-shadow:inset 14px 0 22px -16px rgba(90,72,40,.55);}
  body.spread.vert #pageB{box-shadow:inset -14px 0 22px -16px rgba(90,72,40,.55);}

  .flip{animation:flip .26s ease;}
  @keyframes flip{from{opacity:.15;transform:translateX(var(--dx,10px));}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){
    .flip{animation:none;} #mark{transition:none;} #finalmark.show{animation:none;}
  }

  /* ---- text blocks ---- */
  .page p{margin:0;text-indent:1em;}
  .page p + p{margin-top:0;}
  .page p.pb{margin-block-start:var(--pgap,.55em);}
  body.vert .page p.pb{margin-block-start:var(--pgap,.9em);}
  .page .col > p.pb:first-child{margin-block-start:0;}
  body.vert .page p{text-indent:1em;}
  .page h2{
    margin:0 0 1.6em;font-size:1.22em;font-weight:600;letter-spacing:.22em;
    line-height:1.7;text-indent:0;
  }
  body:not(.vert) .page h2{border-bottom:1px solid rgba(90,80,60,.28);padding-bottom:.5em;}
  body.vert .page h2{border-left:1px solid rgba(90,80,60,.28);padding-left:.5em;margin:0 0 1.6em 0;}
  .page blockquote{
    margin:1.2em .4em;padding:0 1em;color:#4b4335;font-size:.94em;
    border-left:2px solid rgba(120,100,60,.4);
  }
  body.vert .page blockquote{
    margin:.4em 1.2em;padding:1em 0;border-left:none;
    border-top:2px solid rgba(120,100,60,.4);
  }
  .sep{margin:1.5em auto;width:34%;height:0;border-top:1px solid rgba(90,80,60,.3);}
  body.vert .sep{margin:auto 1.5em;height:34%;width:0;border-top:none;border-left:1px solid rgba(90,80,60,.3);}
  .endmark{margin:2em 0 0;text-align:center;letter-spacing:.6em;color:var(--ink-soft);text-indent:0;}
  strong{font-weight:700;}
  body.vert strong{
    text-emphasis:filled dot var(--ink);-webkit-text-emphasis:filled dot var(--ink);
    font-weight:inherit;
  }
  em{font-style:normal;color:var(--ink-soft);}

  /* ---- cover ---- */
  .cover{display:flex;align-items:center;justify-content:center;height:100%;max-height:100%;}
  .cover-in{text-align:center;max-width:100%;}
  body.vert .cover-in{writing-mode:vertical-rl;height:100%;max-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;}
  .cover h1{
    margin:0;font-size:min(6.6vh,8.2vw,50px);font-weight:400;
    letter-spacing:.22em;line-height:1.45;text-indent:0;
  }
  body.vert .cover h1{max-height:100%;}
  .cover .sub{margin-top:1.4em;font-size:.86em;letter-spacing:.34em;color:var(--ink-soft);}
  body.vert .cover .sub{margin:1.4em 0 0;}
  .cover .pillar{margin-top:2.2em;}
  body.vert .cover .pillar{margin:2.2em 0 0;}
  .cover .pillar svg{max-height:22vh;}

  /* ---- tap zones + footer ---- */
  .zone{position:absolute;top:0;bottom:0;width:34%;border:none;background:none;cursor:pointer;padding:0;}
  .zone.l{left:0;} .zone.r{right:0;}
  .zone:focus-visible{outline:1.5px dashed var(--shu);outline-offset:-6px;}
  .foot{
    flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;
    padding:8px 18px calc(env(safe-area-inset-bottom) + 8px);
    font-size:11.5px;letter-spacing:.14em;color:#514936;
  }
  .foot span{opacity:.85;}

  /* ---- sheets ---- */
  .sheet{
    position:fixed;inset:0;z-index:20;display:none;
    background:rgba(40,34,24,.5);backdrop-filter:blur(2px);
  }
  .sheet.open{display:block;}
  .sheet-in{
    position:absolute;left:0;right:0;bottom:0;max-height:76%;overflow:auto;
    background:var(--paper);padding:22px 22px calc(env(safe-area-inset-bottom) + 26px);
    border-radius:2px 2px 0 0;
  }
  .sheet h3{margin:0 0 16px;font-size:14px;letter-spacing:.24em;font-weight:600;color:#4a4335;}
  .toc-item{
    display:flex;justify-content:space-between;gap:14px;width:100%;
    font:inherit;font-size:15px;text-align:left;background:none;border:none;
    padding:11px 0;border-bottom:1px solid rgba(90,80,60,.18);color:var(--ink);cursor:pointer;
  }
  .toc-item .pg{font-size:11px;color:var(--ink-soft);letter-spacing:.1em;flex:0 0 auto;}
  .toc-item[aria-current="true"]{color:var(--shu);}
  .row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid rgba(90,80,60,.18);}
  .row:last-child{border-bottom:none;}
  .row .lab{font-size:14px;letter-spacing:.1em;}
  .seg{display:flex;border:1px solid rgba(90,80,60,.4);}
  .seg button{
    font:inherit;font-size:13px;padding:7px 15px;background:none;border:none;cursor:pointer;color:#4a4335;
    border-left:1px solid rgba(90,80,60,.25);
  }
  .seg button:first-child{border-left:none;}
  .seg button[aria-pressed="true"]{background:#4a4335;color:var(--paper);}
  .close{margin-top:20px;width:100%;font:inherit;font-size:13px;letter-spacing:.2em;padding:12px;background:none;border:1px solid rgba(90,80,60,.4);cursor:pointer;color:#4a4335;}

  #measure{position:fixed;top:-99999px;left:0;visibility:hidden;pointer-events:none;}

  /* ---- 電子版デザイン ---- */
  .page .opener{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#f1ece0;writing-mode:horizontal-tb;}
  .page .opener img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;}
  .sep{display:flex;align-items:center;justify-content:center;border:none !important;margin:1.4em auto;width:auto;height:auto;}
  body.vert .sep{margin:auto 1.3em;width:auto;height:auto;}
  body:not(.vert) .sep svg{transform:none;}
  body.vert .sep svg{transform:none;}

  /* ---- 目次ページ・しおり ---- */
  .bar button{white-space:nowrap;flex:0 0 auto;}
  .ruler .rn{white-space:nowrap;flex:0 0 auto;}
  .ruler{min-width:0;} .ruler svg{min-width:0;}
  .bar{gap:10px;}
  .tocpage{position:relative;z-index:3;pointer-events:none;display:flex;flex-direction:column;gap:.45em;height:100%;}
  body.vert .tocpage{padding-top:0;}
  .tocpage h2{margin:0 0 .5em;border:none !important;padding:0 !important;font-size:1.05em;letter-spacing:.5em;}
  .tocpage .ti{display:flex;align-items:center;gap:.5em;font:inherit;background:none;border:none;padding:0;margin:0;color:var(--ink);cursor:pointer;text-align:start;line-height:1.3;}
  .tocpage .tb{pointer-events:auto;display:flex;align-items:center;gap:.5em;font:inherit;background:none;border:none;padding:.1em;margin:0;color:inherit;cursor:pointer;line-height:1.3;}
  .tocpage .tb:focus-visible{outline:1.5px solid var(--shu);outline-offset:2px;}
  .tocpage .tb:active .t{color:var(--shu);}
  .tocpage .ti .n{color:var(--ink-soft);font-size:.85em;letter-spacing:.2em;flex:0 0 auto;}
  .tocpage .ti .t{flex:0 1 auto;}
  .tocpage .ti .d{flex:1 1 auto;min-width:1em;min-height:1em;border:0 dotted rgba(90,80,60,.45);}
  body:not(.vert) .tocpage .ti .d{border-bottom-width:1px;}
  body.vert .tocpage .ti .d{border-left-width:1px;}
  .tocpage .ti .p{display:inline-block;writing-mode:horizontal-tb;font-size:.72em;color:var(--ink-soft);letter-spacing:.05em;flex:0 0 auto;}
  .page.marked::after{content:"";position:absolute;top:14px;right:18px;width:40px;height:20px;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2040%2020%22%3E%3Ccircle%20cx%3D%2230%22%20cy%3D%2210%22%20r%3D%224.6%22%20fill%3D%22%23cf5b3f%22%2F%3E%3C%2Fsvg%3E") no-repeat center/contain;z-index:4;pointer-events:none;opacity:.95;}
  body.spread.vert #pageB.marked::after, body.spread:not(.vert) #pageA.marked::after{right:auto;left:22px;}
  #bmBtn[aria-pressed="true"]{color:var(--shu);}
  .foot .bmjump{font:inherit;font-size:11px;letter-spacing:.14em;background:none;border:1px solid rgba(168,64,44,.55);color:var(--shu);padding:3px 10px;cursor:pointer;margin:0 8px;}
  .foot .bmjump[hidden]{display:none;}
  .sheet .bm-item{width:100%;text-align:left;font:inherit;font-size:13px;letter-spacing:.12em;background:none;border:1px solid rgba(168,64,44,.5);color:var(--shu);padding:10px 12px;margin:0 0 14px;cursor:pointer;}
  .sheet .bm-item[hidden]{display:none;}
  .chend{display:block;text-indent:0;text-align:end;font-size:.82em;color:var(--ink-soft);letter-spacing:.2em;margin-top:.6em;}
  .win{fill:#f2d79c;stroke:#b08a45;stroke-width:1;transition:fill .5s ease,stroke .5s ease;}
  .win.now{fill:#f6c46a;stroke:#8a5f1e;stroke-width:1.6;}
  .win.off{fill:none;stroke:#9a917c;}
  @media (prefers-reduced-motion: reduce){.win{transition:none;}}

  #homeLink{font:inherit;font-size:inherit;letter-spacing:.14em;color:var(--ink-soft);text-decoration:none;white-space:nowrap;flex:0 0 auto;}
  #homeLink:hover,#homeLink:focus-visible{color:var(--ink);}
  #homeLink[hidden]{display:none;}
  .nextnav{margin:2.4em 0 0;text-align:center;text-indent:0;line-height:2;}
  .nextnav .lead{display:block;font-size:.8em;letter-spacing:.3em;color:var(--ink-soft);}
  .nextnav a{display:inline-block;margin-top:.4em;padding:.35em 1.1em;border:1px solid rgba(168,64,44,.55);color:var(--shu);
    text-decoration:none;letter-spacing:.12em;font-size:.95em;}
  .nextnav a + a{margin-left:.8em;}
  .page .opener.cov{overflow:hidden;}
  .page .opener.cov .covbg{position:absolute;left:-12px;right:-12px;height:52%;background-repeat:no-repeat;background-size:100% 4000%;filter:blur(6px);}
  .page .opener.cov .covbg.t{top:-12px;background-position:center top;}
  .page .opener.cov .covbg.b{bottom:-12px;background-position:center bottom;}
  .page .opener.cov img{position:relative;
    -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 4%,#000 96%,transparent 100%);
            mask-image:linear-gradient(180deg,transparent 0,#000 4%,#000 96%,transparent 100%);}
  .page .opener.cov.lr .covbg{top:-12px;bottom:-12px;height:auto;width:52%;background-size:4000% 100%;}
  .page .opener.cov.lr .covbg.t{left:-12px;right:auto;background-position:left center;}
  .page .opener.cov.lr .covbg.b{right:-12px;left:auto;bottom:-12px;background-position:right center;}
  .page .opener.cov.lr img{
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 3%,#000 97%,transparent 100%);
            mask-image:linear-gradient(90deg,transparent 0,#000 3%,#000 97%,transparent 100%);}
</style>

<body class="vert">
<div id="app">
  <div class="bar">
    <a id="homeLink" href="index.html" hidden>ほかの本</a>
    <button id="tocBtn" aria-haspopup="dialog">目次</button>
    <div class="ruler" aria-hidden="true">
      <span class="rn"></span>
      <svg id="rulerSvg" viewBox="0 0 300 26" preserveAspectRatio="none"></svg>
      <span class="rn"></span>
    </div>
    <button id="bmBtn" aria-pressed="false" aria-label="このページにしおりをはさむ">しおり</button>
    <button id="setBtn" aria-haspopup="dialog">表示</button>
  </div>

  <div id="book">
    <div class="spread">
      <section class="page" id="pageA" aria-live="polite"><div class="col"></div></section>
      <section class="page" id="pageB"><div class="col"></div></section>
    </div>
    <button class="zone l" id="zoneL" aria-label="前後のページ"></button>
    <button class="zone r" id="zoneR" aria-label="前後のページ"></button>
  </div>

  <div class="foot">
    <span id="chapNow"></span>
    <button class="bmjump" id="bmJump" type="button" hidden>しおりへ</button>
    <span id="pageNow"></span>
  </div>
</div>

<div class="sheet" id="tocSheet" role="dialog" aria-label="目次">
  <div class="sheet-in">
    <h3>目次</h3>
    <button class="bm-item" id="bmItem" type="button" hidden>しおりのページへ</button>
    <div id="tocList"></div>
    <button class="close" data-close>閉じる</button>
  </div>
</div>

<div class="sheet" id="setSheet" role="dialog" aria-label="表示設定">
  <div class="sheet-in">
    <h3>表示</h3>
    <div class="row">
      <span class="lab">組み方</span>
      <div class="seg" id="dirSeg">
        <button data-dir="v" aria-pressed="true">縦書き</button>
        <button data-dir="h" aria-pressed="false">横書き</button>
      </div>
    </div>
    <div class="row">
      <span class="lab">文字の大きさ</span>
      <div class="seg" id="sizeSeg">
        <button data-size="0" aria-pressed="false">小</button>
        <button data-size="1" aria-pressed="true">中</button>
        <button data-size="2" aria-pressed="false">大</button>
      </div>
    </div>
    <button class="close" data-close>閉じる</button>
  </div>
</div>

<script>
const DATA = {"title": "ひとしずく", "sub": "春になったら", "blocks": [{"t": "opener", "i": 0, "alt": "序章　霜"}, {"t": "p", "h": "霜の降りた朝、酒屋の角は白かった。"}, {"t": "p", "h": "ソラは、霜の上にしゃがんで、人間の値札の切れはしを一枚拾った。裏が白い。"}, {"t": "p", "h": "鉛筆の芯のかけらといっしょに、胸のところにしまった。"}, {"t": "p", "h": "片方だけ靴を履いた男が発って、十九日目だった。"}, {"t": "p", "h": "古本屋の戸の下をくぐった。"}, {"t": "p", "h": "「おじゃまします」"}, {"t": "p", "h": "低い冬の日が差しこんでいた。棚板のあいだを抜けて、細い筋になって、奥まで伸びている。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "棚のうしろのすきまは、まだ暗かった。"}, {"t": "p", "h": "ナオ吉が、毛布にくるまって、壁ぎわに座っていた。"}, {"t": "p", "h": "「ナオ吉さん。おはようございます」"}, {"t": "p", "h": "「……なんだ」"}, {"t": "p", "h": "「壁の線を、見せていただけますか」"}, {"t": "p", "h": "ナオ吉は、なにも言わずに、壁の前から体をずらした。"}, {"t": "p", "h": "壁に、細い線が並んでいた。"}, {"t": "p", "h": "ソラは、手紙を渡しに来た夜には、数えなかった。"}, {"t": "p", "h": "床から、同じくらいの高さに、横に一本ずつ。日の筋が、ちょうどその高さを横切っていた。"}, {"t": "p", "h": "ソラは、壁の前にしゃがんだ。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "左手の指が、先に動いた。"}, {"t": "p", "h": "目が、線を端からたどる。指が、それについて折れたり伸びたりした。"}, {"t": "p", "h": "線が尽きても、指は止まらなかった。目は、もう棚の向こうの、人間の本の背へ移っていた。"}, {"t": "p", "h": "「……何本だった」"}, {"t": "p", "h": "「二十三です」"}, {"t": "p", "h": "「本も、入ってるだろ」"}, {"t": "p", "h": "「……どこからが本だったか、わかりません」"}, {"t": "p", "h": "ナオ吉は、毛布を、頭までかぶった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "日の筋が、少し下がったころ、ソラは壁の端に戻った。"}, {"t": "p", "h": "右手の人差し指で、一本目の線の下をさした。左手は、膝の上に置いた。"}, {"t": "p", "h": "線の下に、米粒ほどの字があった。"}, {"t": "p", "h": "名前だった。"}, {"t": "p", "h": "右の指を、次の線へずらした。そこにも、名前があった。"}, {"t": "p", "h": "膝の上で、左手の指が一本、折れた。"}, {"t": "p", "h": "字の形が、一つずつちがった。"}, {"t": "p", "h": "十で、指が一巡した。"}, {"t": "p", "h": "十八番目の名前を、読んだ。"}, {"t": "p", "h": "右の指が、その隣の線の下へ動いた。"}, {"t": "p", "h": "なにも、なかった。"}, {"t": "p", "h": "<strong>膝の上で、左手の指が、止まった。</strong>"}, {"t": "p", "h": "人差し指が、半分だけ伸びていた。"}, {"t": "p", "h": "字を消した跡は、なかった。削った跡も、なかった。線だけが、ほかと同じ深さで、ていねいに引いてあった。"}, {"t": "p", "h": "線の下の壁に、細い割れ目があった。"}, {"t": "p", "h": "奥は、暗かった。"}, {"t": "p", "h": "「この線は、どなたが引いたんですか」"}, {"t": "p", "h": "「だれが、かは知らねえ。オレが来たときには、もうあった」"}, {"t": "p", "h": "「名前は、十八です」"}, {"t": "p", "h": "「……ああ」"}, {"t": "p", "h": "「線は、十九本です」"}, {"t": "p", "h": "ナオ吉は、答えなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "日の筋が、床まで下りてきたころ、ソラは胸のところから値札の切れはしを出した。鉛筆の芯のかけらも出した。"}, {"t": "p", "h": "まず、線を引いた。"}, {"t": "p", "h": "十九本、引いた。"}, {"t": "p", "h": "それから、名前を写した。一本ごとに、その下へ。米粒ほどの字で。"}, {"t": "p", "h": "読めない字が、一つあった。壁に顔を近づけて、形のまま写した。"}, {"t": "p", "h": "十九本目の下には、なにも書かなかった。"}, {"t": "p", "h": "「失礼しました」"}, {"t": "p", "h": "ナオ吉は、毛布をかぶったまま、片手だけ上げた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "その夜、寝床で、ソラは値札の切れはしを広げた。"}, {"t": "p", "h": "暗くて、字は見えなかった。"}, {"t": "p", "h": "指で、線をなぞった。"}, {"t": "p", "h": "左手の指が、ひとりでに動いた。"}, {"t": "p", "h": "<strong>指は、朝と同じところで止まった。</strong>"}, {"t": "opener", "i": 1, "alt": "第一章　木枯らし"}, {"t": "p", "h": "翌朝、酒屋の角に、木枯らしが吹いた。"}, {"t": "p", "h": "片方だけ靴を履いた男が発って、二十日目だった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "寝床の奥から、小さな包みを出した。"}, {"t": "p", "h": "人間の飴の包み紙を、ねじったものである。ほどくと、砂糖粒が出てきた。"}, {"t": "p", "h": "コウ吉とジュン吉にもらった分だった。"}, {"t": "p", "h": "胸のところにしまった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "四つ角を曲がった。"}, {"t": "p", "h": "うしろで、足音がした。"}, {"t": "p", "h": "ソラが十歩歩くあいだに、うしろの足音は、二十三あった。"}, {"t": "p", "h": "振り返ると、人間の空き缶が一つ、道ばたに転がっていた。缶の陰から、肘が二つはみ出していた。"}, {"t": "p", "h": "「コウ吉さん。ジュン吉さん。おはようございます」"}, {"t": "p", "h": "「つけてねえよ」"}, {"t": "p", "h": "コウ吉は、頭のうしろで手を組んだ。"}, {"t": "p", "h": "「はい」"}, {"t": "p", "h": "「……よかったら」"}, {"t": "p", "h": "コウ吉が、砂糖粒を一つ差し出した。"}, {"t": "p", "h": "ジュン吉が、小さな声で言った。"}, {"t": "p", "h": "「あの粒で、紙、買うんだろ。見に来た」"}, {"t": "p", "h": "「まだ、買いません」"}, {"t": "p", "h": "ソラは、胸のところから値札の切れはしを出した。"}, {"t": "p", "h": "「年寄りの方に、見ていただきます。ご存じの方が、いるかもしれません」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "人間の米屋の軒下に、年寄りが四人、風をよけて固まっていた。"}, {"t": "p", "h": "紙は、手から手へ回った。だれも、長くは持っていなかった。"}, {"t": "p", "h": "「残しちゃいけないよ」"}, {"t": "p", "h": "「残すな。人間に見つかる」"}, {"t": "p", "h": "「書いたら、燃やしな」"}, {"t": "p", "h": "「そういう決まりだ」"}, {"t": "p", "h": "最後の一人が、紙をソラに返した。"}, {"t": "p", "h": "左手の指が、四本、続けて折れた。"}, {"t": "p", "h": "だれも、名前を声に出して読まなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "その夜、ヤマへの報告をすませてから、ソラは酒屋の裏へ向かった。"}, {"t": "p", "h": "うしろで、ジュン吉の声がした。急に、大きかった。"}, {"t": "p", "h": "「張る! 次も、残すな、に一粒!」"}, {"t": "p", "h": "「じゃあオレ、言わないほう」とコウ吉が言った。"}, {"t": "p", "h": "瓶と瓶のあいだの奥の賭場から、札をすべらせる音がした。"}, {"t": "p", "h": "いちばん手前の空き瓶の陰に、じいさんが一人、座っていた。"}, {"t": "p", "h": "背が、まっすぐだった。"}, {"t": "p", "h": "膝の横に、白い紙が重ねてある。"}, {"t": "p", "h": "じいさんは、人間の酒瓶を傾けた。底に残った酒を、瓶のふたで受けた。"}, {"t": "p", "h": "一口だけ、飲んだ。"}, {"t": "p", "h": "「こんばんは。紙を、売っていただけると、うかがいました」"}, {"t": "p", "h": "上着の肘に、色のちがう布が当ててあった。裾にも、肩にも。"}, {"t": "p", "h": "ソラは、胸のところから値札の切れはしを出した。"}, {"t": "p", "h": "「これを、大きく写しなおします。小さすぎて、読めなくなりました」"}, {"t": "p", "h": "じいさんは、受け取らなかった。"}, {"t": "p", "h": "空き瓶のふちに手をかけて、体を前へ寄せた。足は、動かさなかった。"}, {"t": "p", "h": "ソラの手の上の紙を、のぞきこんだ。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "線を、見ていた。"}, {"t": "p", "h": "端から端まで、見ていた。"}, {"t": "p", "h": "じいさんの左手が、紙の上に伸びてきた。"}, {"t": "p", "h": "人差し指が、名前の一つを押さえた。"}, {"t": "p", "h": "小指だけが、曲がったまま、紙から浮いていた。"}, {"t": "p", "h": "ソラが、形のまま写した名前だった。"}, {"t": "p", "h": "<strong>「それは、おれだ」</strong>"}, {"t": "p", "h": "残すな、とは、言わなかった。"}, {"t": "p", "h": "ソラは、両手で紙を持ったまま、動かなかった。"}, {"t": "p", "h": "木枯らしが、空き瓶のあいだを抜けていった。"}, {"t": "p", "h": "紙の端が、めくれかけた。"}, {"t": "p", "h": "親指で、押さえた。"}, {"t": "p", "h": "その名前は、まだ、読めなかった。"}, {"t": "opener", "i": 2, "alt": "第二章　霜柱"}, {"t": "p", "h": "霜柱が、立った。"}, {"t": "p", "h": "片方だけ靴を履いた男が発って、二十一日目の朝だった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "その夜、ソラは、また酒屋の裏へ行った。"}, {"t": "p", "h": "「こんばんは。今日は、紙を買いに来ました」"}, {"t": "p", "h": "胸のところから、飴の包み紙を出した。ねじりをほどくと、砂糖粒が手のひらに転がった。"}, {"t": "p", "h": "じいさんは、右手で、一つだけつまんだ。"}, {"t": "p", "h": "紙の束を半分ほど取って、ソラの膝にのせた。"}, {"t": "p", "h": "「お名前を、うかがってもいいですか」"}, {"t": "p", "h": "じいさんは、空き瓶のふちを、指でなぞった。"}, {"t": "p", "h": "「春になったらな」"}, {"t": "p", "h": "ソラは、少し考えた。"}, {"t": "p", "h": "「春は、何日後ですか」"}, {"t": "p", "h": "「知らん」"}, {"t": "p", "h": "膝の上で、左手の親指が折れかけた。"}, {"t": "p", "h": "親指は、もとに戻った。"}, {"t": "p", "h": "「紙は、寺で切ってる」"}, {"t": "p", "h": "「寺、ですか」"}, {"t": "p", "h": "「町のはずれの、人間の寺だ。縁の下にいる」"}, {"t": "p", "h": "それきり、目を閉じた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "翌朝、ソラは、町のはずれまで歩いた。"}, {"t": "p", "h": "人間の寺の、縁の下である。"}, {"t": "p", "h": "縁の際に、人間の手を洗う石の鉢が据えてあった。ふちから、しずくが垂れていた。"}, {"t": "p", "h": "じいさんは、鉢の下の石に腰をおろして、古い水筒を両手で差し出していた。ふたは、外してあった。"}, {"t": "p", "h": "ぽつ、ぽつ、と、水筒の中で鳴る音が、少しずつ高くなった。"}, {"t": "p", "h": "水が、ふちまで来た。"}, {"t": "p", "h": "じいさんは、ふたを閉めた。下げ紐を、水筒に巻きつけた。腰には、回さなかった。"}, {"t": "p", "h": "咳を、一つした。"}, {"t": "p", "h": "ソラの左手の指が、一本、折れた。"}, {"t": "p", "h": "じいさんは、鉢のふちに手をかけて、立ち上がった。足が、遅れてついてきた。"}, {"t": "p", "h": "奥の寝床まで、ずいぶんかかった。枕もとに、水筒を立てて置いた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "じいさんは、人間の帳面の頁を、刃物のかけらで切った。"}, {"t": "p", "h": "ソラは、その横にしゃがんで、名前を写しなおした。今度は、大きく書いた。一枚に、一つずつ。"}, {"t": "p", "h": "読めない名前の紙は、白いまま脇によけた。"}, {"t": "p", "h": "刃の音が、止まった。"}, {"t": "p", "h": "じいさんは、刃の先で、枕もとの水筒をさした。"}, {"t": "p", "h": "「北の村を出る朝、年寄りが、これをいっぱいにした」"}, {"t": "opener", "i": 3, "alt": "第三章　霜晴れ"}, {"t": "p", "h": "秋のはじめに、人間が出ていった。"}, {"t": "p", "h": "こぼれものが、落ちてこなくなった。"}, {"t": "p", "h": "明け方だった。", "g": 1}, {"t": "p", "h": "十九人が、壁の裏の穴の前に並んだ。"}, {"t": "p", "h": "いちばん年上は、タカだった。"}, {"t": "p", "h": "穴の脇に、年寄りの女が三人、座っていた。", "g": 1}, {"t": "p", "h": "一人ずつ、水筒を差し出した。"}, {"t": "p", "h": "年寄りは、それを受け取った。"}, {"t": "p", "h": "いっぱいまで満たして、ふたを閉めて、返した。"}, {"t": "p", "h": "<strong>「ゆっくり歩け、たくさん水を飲め」</strong>", "g": 1}, {"t": "p", "h": "それだけか、と、だれかが訊いた。", "g": 1}, {"t": "p", "h": "長い話は、道で忘れるから、と、年寄りの一人が言った。"}, {"t": "p", "h": "この水筒を満たしたのは、壁に線を引く年寄りだった。", "g": 1}, {"t": "p", "h": "村の壁に、冬を越すたびに、線を一本ずつ引いてきた。"}, {"t": "p", "h": "それから、下げ紐を、腰に回して結んでくれた。"}, {"t": "p", "h": "結び目を、一度、手のひらでたたいた。"}, {"t": "p", "h": "列のうしろのほうに、眼鏡をかけたやつがいた。", "g": 1}, {"t": "p", "h": "ずり落ちるのを指の関節で押し上げて、年寄りの言葉を、小さな声でくり返していた。"}, {"t": "p", "h": "タカが、列の頭から、一人ずつ肩に手を置いていった。", "g": 1}, {"t": "p", "h": "十九人目まで行って、手を下ろした。"}, {"t": "p", "h": "ノブが、すぐ前に立った。", "g": 1}, {"t": "p", "h": "村で、いちばん長くいっしょにいたやつだった。"}, {"t": "p", "h": "「行くぞ」"}, {"t": "p", "h": "振り返らなかった。"}, {"t": "p", "h": "穴を出た。", "g": 1}, {"t": "p", "h": "坂を下りた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "坂の途中で、一度だけ振り返った。"}, {"t": "p", "h": "丘の上で、風車が回っていた。", "g": 1}, {"t": "p", "h": "きし、きし、と鳴っていた。"}, {"t": "p", "h": "その根もとに、ネネが立っていた。", "g": 1}, {"t": "p", "h": "自分と、同い年だった。"}, {"t": "p", "h": "「あたしは、ここで待つ」"}, {"t": "p", "h": "四晩目に、そう言ったやつだった。"}, {"t": "p", "h": "どちらも、手は振らなかった。"}, {"t": "p", "h": "前を向いた。"}, {"t": "p", "h": "ノブの背中が、あった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ソラの左手の指が、止まっていた。"}, {"t": "p", "h": "この町に、杖をついた年寄りの女が来たことがあった。"}, {"t": "p", "h": "「あたしは六十年、丘の上にいた」と、その人は言った。"}, {"t": "p", "h": "じいさんは、縁の外を見ていた。"}, {"t": "p", "h": "「ネネは、丘から動かんやつだった」"}, {"t": "p", "h": "「…………」"}, {"t": "p", "h": "「出る前に、四晩、言い合った。春まで待てば死ぬ、と言ったのは、おれだ」"}, {"t": "p", "h": "縁の際で、霜柱が一本、日に溶けて倒れた。"}, {"t": "p", "h": "「あそこで、死んだろう」"}, {"t": "p", "h": "ソラは、両手を前で組んだ。"}, {"t": "p", "h": "あの年寄りの女が、いまどこにいるのかは、知らなかった。"}, {"t": "p", "h": "なにも、言わなかった。"}, {"t": "p", "h": "「あれきり、丘は見てない」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "日が、寺の屋根の向こうへ落ちた。"}, {"t": "p", "h": "縁の際の霜柱は、昼のうちに、ぜんぶ倒れていた。"}, {"t": "p", "h": "ソラは、紙の束を胸のところに入れて、立ち上がった。"}, {"t": "p", "h": "枕もとの水筒が、目に入った。朝から、だれも触っていなかった。"}, {"t": "p", "h": "「その水筒は、飲まないんですか」"}, {"t": "p", "h": "じいさんは、寝床に横になっていた。目を、開けた。"}, {"t": "p", "h": "答えなかった。"}, {"t": "p", "h": "「朝、いっぱいにする」"}, {"t": "p", "h": "「はい」"}, {"t": "p", "h": "「夜まで、いっぱいのままだ」"}, {"t": "p", "h": "「……はい」"}, {"t": "p", "h": "「飲んだら、歩かにゃならん」"}, {"t": "p", "h": "じいさんは、目を閉じた。"}, {"t": "p", "h": "<strong>水筒は、いっぱいのまま、枕もとにあった。</strong>"}, {"t": "opener", "i": 4, "alt": "第四章　しぐれ"}, {"t": "p", "h": "しぐれが、来た。"}, {"t": "p", "h": "片方だけ靴を履いた男が発って、二十四日目の夕方だった。"}, {"t": "p", "h": "降ったと思うと、やんだ。また、降った。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "その夜、ソラは、酒屋の裏へ行った。"}, {"t": "p", "h": "じいさんは、酒瓶の底に残った酒を、ふたで受けて、一口だけ飲んだ。"}, {"t": "p", "h": "咳が、出た。"}, {"t": "p", "h": "ソラの左手の親指が、折れた。"}, {"t": "p", "h": "「数えるな」"}, {"t": "p", "h": "「数えてません」"}, {"t": "p", "h": "人差し指が、折れたところだった。"}, {"t": "p", "h": "箱の角から、雨だれが落ちていた。ソラの指は、それに合わせて、折れたり伸びたりしていた。"}, {"t": "p", "h": "「……いくつだ」"}, {"t": "p", "h": "「二十六です」"}, {"t": "p", "h": "もう一口は、飲まなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "翌朝も、しぐれだった。"}, {"t": "p", "h": "人間の寺の縁の下で、じいさんは、紙を切っていた。枕もとに、水筒が立っていた。もう、いっぱいらしかった。"}, {"t": "p", "h": "ソラは、横にしゃがんだ。紙の束を、膝の上で一枚ずつめくった。名前を書いた紙。白いままの紙が、一枚。"}, {"t": "p", "h": "縁の外を、しぐれの水が、筋になって流れていった。"}, {"t": "p", "h": "刃が、止まった。"}, {"t": "p", "h": "「十二日目に、川があった」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "川は、広かった。"}, {"t": "p", "h": "タカが、先に入った。", "g": 1}, {"t": "p", "h": "水は、膝までだった。"}, {"t": "p", "h": "みんな、荷を下ろして、頭に載せた。"}, {"t": "p", "h": "一列になった。"}, {"t": "p", "h": "その日、あいつは、先頭に近いあたりにいた。", "g": 1}, {"t": "p", "h": "自分のすぐ前に、ノブがいた。"}, {"t": "p", "h": "ノブの踵を見て歩いた。"}, {"t": "p", "h": "川のなかほどで、列が少し詰まった。", "g": 1}, {"t": "p", "h": "あいつが、止まっていた。"}, {"t": "p", "h": "片手で、頭の荷を押さえていた。"}, {"t": "p", "h": "もう片方の手を、水に入れた。"}, {"t": "p", "h": "なにか、拾った。"}, {"t": "p", "h": "それから、眼鏡を押し上げた。", "g": 1}, {"t": "p", "h": "列が、また動いた。", "g": 1}, {"t": "sep", "h": ""}, {"t": "p", "h": "向こう岸は、葦だった。"}, {"t": "p", "h": "葦は、背の何倍もあった。"}, {"t": "p", "h": "前も、うしろも、葉しか見えなかった。"}, {"t": "p", "h": "葦を抜けたところは、乾いた土手だった。", "g": 1}, {"t": "p", "h": "一人ずつ、出てきた。"}, {"t": "p", "h": "タカが、列の頭から、一人ずつ肩に手を置いていった。", "g": 1}, {"t": "p", "h": "最後に、自分の肩に手を置いた。"}, {"t": "p", "h": "それから、指を折って、数えなおした。", "g": 1}, {"t": "p", "h": "十本で、指が足りなくなった。"}, {"t": "p", "h": "手をひらいて、また最初から折った。"}, {"t": "p", "h": "八本目で、止まった。"}, {"t": "p", "h": "葦のほうを、見た。", "g": 1}, {"t": "sep", "h": ""}, {"t": "p", "h": "何人かが、葦の中へ戻った。"}, {"t": "p", "h": "あいつの名を、呼んだ。"}, {"t": "p", "h": "返事は、なかった。"}, {"t": "p", "h": "川を見に行った者が、首を振った。", "g": 1}, {"t": "p", "h": "眼鏡を、また落としたのか。", "g": 1}, {"t": "p", "h": "探しに、川へ戻ったのか。"}, {"t": "p", "h": "だれも、見ていなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "その夜、火は焚かなかった。"}, {"t": "p", "h": "「待とう」", "g": 1}, {"t": "p", "h": "男の一人が言った。"}, {"t": "p", "h": "タカが、みんなの顔を見た。", "g": 1}, {"t": "p", "h": "「手で決める。発つと思う者は、挙げろ」"}, {"t": "p", "h": "いちばん先に、手が挙がった。", "g": 1}, {"t": "p", "h": "ノブの手も、挙がった。", "g": 1}, {"t": "p", "h": "挙がらない手も、あった。"}, {"t": "p", "h": "「もう一日だけ」", "g": 1}, {"t": "p", "h": "さっきの男が、言った。"}, {"t": "p", "h": "タカは、しばらく答えなかった。", "g": 1}, {"t": "p", "h": "「朝までだ」"}, {"t": "p", "h": "だれも、横にならなかった。", "g": 1}, {"t": "sep", "h": ""}, {"t": "p", "h": "朝になった。"}, {"t": "p", "h": "待とうと言った男は、土手を下りるまでに、何度も振り返った。"}, {"t": "p", "h": "自分は、一度も振り返らなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "北の町を出たところで、ノブが、一度だけ振り返った。"}, {"t": "p", "h": "「うしろは」"}, {"t": "p", "h": "だれも、答えなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ソラは、膝の上の左手を、右手で押さえていた。"}, {"t": "p", "h": "「……なんで、待たなかったんですか」"}, {"t": "p", "h": "じいさんは、刃を取り直した。紙には、当てなかった。"}, {"t": "p", "h": "「冬に、追いつかれる」"}, {"t": "p", "h": "ソラは、じいさんの顔を見た。"}, {"t": "p", "h": "「そう言って、手を挙げた」"}, {"t": "p", "h": "「…………」"}, {"t": "p", "h": "「おれが、いちばん先だった」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ソラは、胸のところから、まだなにも書いていない紙を一枚出した。鉛筆の芯も、出した。"}, {"t": "p", "h": "「その方の、お名前を、うかがってもいいですか」"}, {"t": "p", "h": "じいさんは、紙を見なかった。"}, {"t": "p", "h": "ソラは、芯を持ったまま、待った。"}, {"t": "p", "h": "じいさんは、答えなかった。"}, {"t": "p", "h": "春になったらな、とも、言わなかった。"}, {"t": "p", "h": "縁の際で、しぐれが強くなった。"}, {"t": "p", "h": "ソラは、芯を胸のところに戻した。白い紙を、名前を書いた束のいちばん下に重ねた。"}, {"t": "p", "h": "<strong>白い紙は、二枚になった。</strong>"}, {"t": "opener", "i": 5, "alt": "第五章　薄氷"}, {"t": "p", "h": "水たまりに、薄い氷が張った。"}, {"t": "p", "h": "片方だけ靴を履いた男が発って、二十七日目の朝だった。"}, {"t": "p", "h": "人間の寺の縁の下でも、石の鉢のふちが凍っていた。"}, {"t": "p", "h": "しずくは、落ちていなかった。"}, {"t": "p", "h": "じいさんは、鉢の下の石に腰をおろしていた。水筒を、両手で差し出していた。ふたは、外してあった。"}, {"t": "p", "h": "「おはようございます」"}, {"t": "p", "h": "「来たか」"}, {"t": "p", "h": "ソラは、横にしゃがんだ。"}, {"t": "p", "h": "日が、縁の際まで差してきた。ふちの氷が、少しずつ光った。"}, {"t": "p", "h": "じいさんの手は、動かなかった。"}, {"t": "p", "h": "「その水筒を、持たせていただいてもいいですか」"}, {"t": "p", "h": "「春になったらな」"}, {"t": "p", "h": "「はい」"}, {"t": "p", "h": "膝の上で、ソラの左手の指が、一本折れた。"}, {"t": "p", "h": "もう一本、折れた。"}, {"t": "p", "h": "「お名前と、水筒です」"}, {"t": "p", "h": "「…………」"}, {"t": "p", "h": "「春になったら、二つです」"}, {"t": "p", "h": "「数えるな」"}, {"t": "p", "h": "ぽつ、と鳴った。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "水が、ふちまで来た。"}, {"t": "p", "h": "じいさんは、ふたを閉めた。奥の寝床まで歩いて、枕もとに立てて置いた。"}, {"t": "p", "h": "それから、人間の帳面の頁を、刃物のかけらで切りはじめた。"}, {"t": "p", "h": "刃が、止まった。"}, {"t": "p", "h": "「さっきから、なにを数えてる」"}, {"t": "p", "h": "「日です。片方だけ靴を履いた方が、北へ発ってからの」"}, {"t": "p", "h": "「片方だけ靴の男か」"}, {"t": "p", "h": "「ご存じですか」"}, {"t": "p", "h": "「顔は、知ってる」"}, {"t": "p", "h": "じいさんは、切った紙を、膝の横に重ねた。"}, {"t": "p", "h": "「なんで、数える」"}, {"t": "p", "h": "「片方だけ靴を履いた方は、いつも三十六日で戻ってきます」"}, {"t": "p", "h": "ソラは、膝の上の指を見た。"}, {"t": "p", "h": "「北に、お手紙をくださった方がいます」"}, {"t": "p", "h": "「…………」"}, {"t": "p", "h": "「ぼくも、書きました」"}, {"t": "p", "h": "「本に挟んだ手紙は、燃やされていました。百三枚です。それからも、挟みました」"}, {"t": "p", "h": "ソラは、両手を前で組んだ。"}, {"t": "p", "h": "「一枚だけ、手で渡しました。片方だけ靴を履いた方に」"}, {"t": "p", "h": "「返事は」"}, {"t": "p", "h": "「まだです」"}, {"t": "p", "h": "縁の際で、鉢のふちから、しずくが一つ落ちた。"}, {"t": "p", "h": "「お返事を、待っています」"}, {"t": "p", "h": "じいさんは、答えなかった。"}, {"t": "p", "h": "「おれらも、書いた」"}, {"t": "p", "h": "ソラは、じいさんの顔を見た。"}, {"t": "p", "h": "「北の町から、十八日、歩いた。着いたのが、あの棚の奥だ」"}, {"t": "p", "h": "ソラの左手の指が、止まった。"}, {"t": "p", "h": "ソラは、胸のところから紙の束を出した。読めない名前の番で、白いままよけた一枚を、抜いた。"}, {"t": "p", "h": "芯といっしょに、両手で差し出した。"}, {"t": "p", "h": "じいさんは、紙を見た。"}, {"t": "p", "h": "それから、芯を取った。"}, {"t": "p", "h": "曲がった小指が、紙から浮いていた。一画ずつ、ゆっくり書いた。"}, {"t": "p", "h": "<strong>スミ</strong>"}, {"t": "p", "h": "ソラは、胸のところから値札の切れはしを出した。壁で、形のまま写した字と、並べた。"}, {"t": "p", "h": "同じ形だった。"}, {"t": "p", "h": "「……スミさん」"}, {"t": "p", "h": "スミは、芯を返した。"}, {"t": "p", "h": "「春は、まだです」とソラは言った。"}, {"t": "p", "h": "スミは、答えなかった。値札の切れはしの、いちばん端の線を、指で押さえた。"}, {"t": "p", "h": "「着いた晩、おれだけ、起きてた」"}, {"t": "opener", "i": 6, "alt": "第六章　霜夜"}, {"t": "p", "h": "その晩、タカが、人間の釘を一本拾ってきた。"}, {"t": "p", "h": "「一人、一本だ。村の壁と、同じ高さにしろ」"}, {"t": "p", "h": "線の下に、めいめい名前を彫った。"}, {"t": "p", "h": "自分の番で、釘が、二度、すべった。"}, {"t": "p", "h": "みんなが、眠ってからだった。", "g": 1}, {"t": "p", "h": "起きた。"}, {"t": "p", "h": "釘を、取った。"}, {"t": "p", "h": "いちばん端の線の隣に、一本、引いた。", "g": 1}, {"t": "p", "h": "床から、同じ高さに。"}, {"t": "p", "h": "ほかと、同じ深さに。"}, {"t": "p", "h": "下には、なにも彫らなかった。", "g": 1}, {"t": "p", "h": "釘を、置いた。", "g": 1}, {"t": "p", "h": "横になった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "「村に、便りを出そう」と、自分が言った。"}, {"t": "p", "h": "タカが、人間の帳面の切れはしを、どこからか持ってきた。", "g": 1}, {"t": "p", "h": "炭のかけらで、書いた。"}, {"t": "quote", "h": "村の皆へ<br><br>南に着いた。<br>十八人、皆、達者だ。<br>春になったら、また便りを出す。"}, {"t": "p", "h": "その下に、一人ずつ、自分の名前を書いた。", "g": 1}, {"t": "p", "h": "今度は、すべらなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "タカが、紙を持ち上げた。"}, {"t": "p", "h": "「だれが、持っていく」"}, {"t": "p", "h": "村までは、来ただけの道があった。", "g": 1}, {"t": "p", "h": "だれも、立たなかった。", "g": 1}, {"t": "p", "h": "ノブは、床を見ていた。", "g": 1}, {"t": "p", "h": "タカも、立たなかった。", "g": 1}, {"t": "p", "h": "<strong>言い出した者も、立たなかった。</strong>", "g": 1}, {"t": "sep", "h": ""}, {"t": "p", "h": "タカが、便りを小さく畳んだ。"}, {"t": "p", "h": "いちばん端の線の下に、細い割れ目があった。"}, {"t": "p", "h": "便りは、そこに入った。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "「その便りは、いまも、あそこにあるんですか」"}, {"t": "p", "h": "「ある」"}, {"t": "p", "h": "「棚の奥を出てから、行ってない」"}, {"t": "p", "h": "「割れ目は、見ました」"}, {"t": "p", "h": "「…………」"}, {"t": "p", "h": "「奥は、暗かったです」"}, {"t": "p", "h": "スミは、刃物のかけらを置いた。"}, {"t": "p", "h": "「おまえのは、行ったんだな」"}, {"t": "p", "h": "「はい」"}, {"t": "p", "h": "スミは、それきり、なにも言わなかった。"}, {"t": "p", "h": "<strong>枕もとの水筒を、しばらく見ていた。</strong>"}, {"t": "opener", "i": 7, "alt": "第七章　初氷"}, {"t": "p", "h": "初氷が、張った。"}, {"t": "p", "h": "片方だけ靴を履いた男が発って、三十日目の朝だった。"}, {"t": "p", "h": "人間の寺の、石の鉢である。しずくの通った筋が、白いまま、ふちで止まっていた。"}, {"t": "p", "h": "スミは、鉢の下の石に腰をおろしていた。水筒を、両手で差し出していた。ふたは、外してあった。"}, {"t": "p", "h": "息が、白かった。短く、切れて出た。"}, {"t": "p", "h": "ソラは、横にしゃがんだ。"}, {"t": "p", "h": "日が、縁の際まで差してきた。白い筋は、光っただけだった。"}, {"t": "p", "h": "ぽつ、とは、鳴らなかった。"}, {"t": "p", "h": "咳が、出た。"}, {"t": "p", "h": "膝の上で、ソラの左手の指が、二本、折れた。"}, {"t": "p", "h": "スミの腕が、少しずつ下がった。"}, {"t": "p", "h": "水筒を、膝の上に置いた。ふたを、閉めた。下げ紐を、巻きつけた。"}, {"t": "p", "h": "寝床のほうへは、行かなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "人間の寺の、太い柱の根もとである。"}, {"t": "p", "h": "小さな石が、六つ並んでいた。川原の石らしかった。"}, {"t": "p", "h": "字は、彫っていなかった。"}, {"t": "p", "h": "スミは、石の前に腰をおろした。水筒を、脇に置いた。"}, {"t": "p", "h": "「六人は、ここに埋めた。最初が、タカだった」"}, {"t": "p", "h": "「タカさんは、どの石ですか」"}, {"t": "p", "h": "スミは、左手を伸ばした。人差し指が、柱にいちばん近い石に触れた。小指だけが、曲がったまま浮いていた。"}, {"t": "p", "h": "「これだ」"}, {"t": "p", "h": "ソラは、浮いた小指を見た。"}, {"t": "p", "h": "「最初の冬に、凍えた」"}, {"t": "p", "h": "ソラは、石の前で、頭を下げた。"}, {"t": "p", "h": "「お名前は、彫らなかったんですか」"}, {"t": "p", "h": "「壁に、彫ってある」"}, {"t": "p", "h": "ソラは、胸のところの紙の束を、指で押さえた。"}, {"t": "p", "h": "「ほかの方は」"}, {"t": "p", "h": "「十一人は、出ていった。北へ行くと言ったやつは、いなかった。ノブは、行くぞ、とも言わなかった」"}, {"t": "p", "h": "「ノブさんは、どちらへ、いらしたんですか」"}, {"t": "p", "h": "「知らん」"}, {"t": "p", "h": "スミは、六つの石を見ていた。"}, {"t": "p", "h": "「探しにも、行かなかった」"}, {"t": "p", "h": "膝の上で、ソラの左手の指が、動いていた。"}, {"t": "p", "h": "スミは、その指を見た。"}, {"t": "p", "h": "数えるな、とは、言わなかった。"}, {"t": "p", "h": "「いくつだ」"}, {"t": "p", "h": "「十八です。六と、十一と、スミさんで」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "スミは、両手を膝の上に出した。"}, {"t": "p", "h": "石を一つ見るたびに、指が一本ずつ折れていった。六つ目で、左の親指が折れた。"}, {"t": "p", "h": "「六」"}, {"t": "p", "h": "それから、縁の外へ目をやった。"}, {"t": "p", "h": "指が、また折れはじめた。左の薬指まで折れると、両手が握りこぶしになった。左の小指は、はじめから曲がっていた。"}, {"t": "p", "h": "今度は、伸ばしていった。"}, {"t": "p", "h": "一本、伸ばすあいだに、一度だけ、声が出た。"}, {"t": "p", "h": "「ノブ」"}, {"t": "p", "h": "指は、止まらなかった。"}, {"t": "p", "h": "「十七」"}, {"t": "p", "h": "残った一本を、見た。自分の分だった。"}, {"t": "p", "h": "伸ばした。"}, {"t": "p", "h": "「十八」"}, {"t": "p", "h": "左の小指だけが、曲がったまま、手のひらのほうへ寄っていた。"}, {"t": "p", "h": "右手で、その小指をつまんだ。引いた。"}, {"t": "p", "h": "伸びなかった。"}, {"t": "p", "h": "もう一度、引いた。指の節が、白くなった。"}, {"t": "p", "h": "伸びなかった。"}, {"t": "p", "h": "右手を、離した。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ソラの左手は、膝の上で止まっていた。"}, {"t": "p", "h": "人差し指が、半分だけ伸びていた。"}, {"t": "p", "h": "ソラは、その手を、スミの左手の横に出した。曲がった小指の、すぐ隣だった。"}, {"t": "p", "h": "人差し指を、伸ばしきった。"}, {"t": "p", "h": "スミは、ソラの指を見た。"}, {"t": "p", "h": "長いあいだ、見ていた。"}, {"t": "p", "h": "「……十九」"}, {"t": "p", "h": "だれも、なにも言わなかった。"}, {"t": "p", "h": "スミは、両手を、ゆっくり膝に下ろした。"}, {"t": "p", "h": "脇の水筒を、見た。"}, {"t": "p", "h": "<strong>「春になったらな」</strong>"}, {"t": "p", "h": "ソラのほうは、見ていなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "日が、寺の屋根の向こうへ落ちるまで、ソラは縁の下にいた。しずくは、落ちなかった。"}, {"t": "p", "h": "スミは、水筒を枕もとに立てて置いた。ふたは、閉めたままだった。"}, {"t": "p", "h": "<strong>その日、水筒は、いっぱいにならなかった。</strong>"}, {"t": "opener", "i": 8, "alt": "第八章　冬の入り"}, {"t": "p", "h": "暦の上でも、冬に入った。"}, {"t": "p", "h": "片方だけ靴を履いた男が発って、三十三日目の朝だった。"}, {"t": "p", "h": "その朝、ソラは、寺へは行かなかった。"}, {"t": "p", "h": "古本屋の戸の下を、くぐった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "棚のうしろのすきまは、冷えていた。"}, {"t": "p", "h": "ナオ吉が、毛布にくるまって、壁ぎわに座っていた。"}, {"t": "p", "h": "「南の町に、杖をついた年寄りの方が、いらしたことがありました。ナオ吉さんたちと、ごいっしょに」"}, {"t": "p", "h": "「……ああ」"}, {"t": "p", "h": "「ネネさん、というお名前ですか」"}, {"t": "p", "h": "答えるまでに、少しかかった。"}, {"t": "p", "h": "「そうだ」"}, {"t": "p", "h": "「いまも、お元気ですか」"}, {"t": "p", "h": "ナオ吉は、天井を見上げた。"}, {"t": "p", "h": "「生きてる、と思う」"}, {"t": "p", "h": "「…………」"}, {"t": "p", "h": "「北の、みちるって子の家にいる」"}, {"t": "p", "h": "ソラは、手紙で読んだ名前を、小さな声でくり返した。"}, {"t": "p", "h": "ソラは、頭を下げた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "十九本目の下に、細い割れ目があった。"}, {"t": "p", "h": "「あの割れ目に、便りが入っている、とうかがいました」"}, {"t": "p", "h": "「だれに、聞いた」"}, {"t": "p", "h": "「スミさん、という方です。あの線を引いた、お一人です」"}, {"t": "p", "h": "ナオ吉は、壁を見た。端から、端まで見た。"}, {"t": "p", "h": "「便りは、北へ行った」"}, {"t": "p", "h": "膝の上で、ソラの左手の指が、止まった。"}, {"t": "p", "h": "立ち上がって、壁の前まで行った。割れ目に、指を入れた。"}, {"t": "p", "h": "なにも、なかった。"}, {"t": "p", "h": "「……いつ、ですか」"}, {"t": "p", "h": "「あいつが、発つ朝だ」"}, {"t": "p", "h": "「片方だけ靴を履いた方、ですか」"}, {"t": "p", "h": "「ああ。おまえのと、同じ袋に入れてった」"}, {"t": "p", "h": "十四日前、壁を数えた朝、ソラは、割れ目のことを訊かなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "昼すぎ、ソラは、町のはずれまで歩いた。"}, {"t": "p", "h": "人間の寺の縁の下で、スミは、寝床の上に座っていた。枕もとに、水筒が立っていた。"}, {"t": "p", "h": "「来たか」"}, {"t": "p", "h": "咳を、一つした。"}, {"t": "p", "h": "ソラは、寝床の横に、膝をついた。両手を、前で組んだ。"}, {"t": "p", "h": "「ネネさんは、生きてますよ。ここまで、来ましたよ」"}, {"t": "p", "h": "スミは、ソラを見た。"}, {"t": "p", "h": "「……ここまで」"}, {"t": "p", "h": "「この町に、です。あたしは六十年、丘の上にいた、とおっしゃいました」"}, {"t": "p", "h": "スミは、答えなかった。"}, {"t": "p", "h": "「いまは、北の町の、みちるさんという方の家に、いらっしゃるそうです」"}, {"t": "p", "h": "「…………」"}, {"t": "p", "h": "「割れ目の便りは、北へ行きました」"}, {"t": "p", "h": "スミの手が、膝の上で開いた。"}, {"t": "p", "h": "「片方だけ靴を履いた方が、持っていきました」"}, {"t": "p", "h": "「……あの男か」"}, {"t": "p", "h": "スミは、枕もとへ手を伸ばした。水筒を取って、膝の上に置いた。"}, {"t": "p", "h": "両手で、水筒を包んだ。曲がった小指だけが、浮いていた。"}, {"t": "p", "h": "「丘の上に、いたのか」"}, {"t": "p", "h": "「はい」"}, {"t": "p", "h": "「六十年」"}, {"t": "p", "h": "「はい」"}, {"t": "p", "h": "水筒から、目を上げなかった。"}, {"t": "p", "h": "<strong>「待ってたのか」</strong>"}, {"t": "p", "h": "ソラは、答えなかった。"}, {"t": "p", "h": "膝の上の左手は、動かなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "日が、傾いた。"}, {"t": "p", "h": "いつもなら、スミは、この時刻に酒屋の裏へ向かった。"}, {"t": "p", "h": "立たなかった。"}, {"t": "p", "h": "ソラも、立たなかった。"}, {"t": "p", "h": "<strong>水筒は、スミの膝の上にあった。</strong>"}, {"t": "opener", "i": 9, "alt": "終章　小春日和"}, {"t": "p", "h": "霜の降りない朝、酒屋の角は白くなかった。"}, {"t": "p", "h": "風が、なかった。日が、背中まで暖かかった。"}, {"t": "p", "h": "ソラは、木箱の陰にしゃがんだ。膝の上で、左手の指が動いた。"}, {"t": "p", "h": "指が、三度、一巡した。"}, {"t": "p", "h": "六本目で、止まった。"}, {"t": "p", "h": "片方だけ靴を履いた男が発って、三十六日目だった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "人間の寺の、縁の下である。"}, {"t": "p", "h": "石の鉢のふちに、白い筋が光っていた。"}, {"t": "p", "h": "スミは、鉢の下の石に腰をおろしていた。水筒は、膝の上にあった。ふたは、外してあった。"}, {"t": "p", "h": "息は、白くなかった。その朝は、咳が出なかった。"}, {"t": "p", "h": "「おはようございます」"}, {"t": "p", "h": "「来たか」"}, {"t": "p", "h": "ソラは、横にしゃがんだ。"}, {"t": "p", "h": "「今日、戻るはずの日です」"}, {"t": "p", "h": "「片方だけ靴の男か」"}, {"t": "p", "h": "「はい。まだ、戻っていらっしゃいません」"}, {"t": "p", "h": "スミは、答えなかった。"}, {"t": "p", "h": "日が、縁の際まで差してきた。白い筋の先が、少しずつ透けていった。"}, {"t": "p", "h": "先に、水が丸くたまった。"}, {"t": "p", "h": "スミが、水筒を持ち上げた。腕が、少しふるえた。"}, {"t": "p", "h": "ぽつ、と鳴った。"}, {"t": "p", "h": "ひとしずくだった。"}, {"t": "p", "h": "次は、落ちてこなかった。"}, {"t": "p", "h": "スミは、水筒の中をのぞいた。"}, {"t": "p", "h": "しばらく、そうしていた。"}, {"t": "p", "h": "それから、水筒を傾けた。"}, {"t": "p", "h": "一口、飲んだ。"}, {"t": "p", "h": "「ゆっくり歩け、たくさん水を飲め」"}, {"t": "p", "h": "スミは、小さな声で言った。"}, {"t": "p", "h": "「春になったらな」"}, {"t": "p", "h": "言ってから、鉢のふちを見た。"}, {"t": "p", "h": "下げ紐を、腰に回して、結んだ。"}, {"t": "p", "h": "結び目を、一度、手のひらでたたいた。"}, {"t": "p", "h": "<strong>「春は、待たん」</strong>"}, {"t": "p", "h": "ソラの左手の指が、止まった。"}, {"t": "p", "h": "スミは、鉢のふちに手をかけて、立ち上がった。"}, {"t": "p", "h": "一歩、出た。"}, {"t": "p", "h": "二歩目で、膝が折れた。"}, {"t": "p", "h": "ソラが、腕を取った。"}, {"t": "p", "h": "スミは、自分の足を見ていた。"}, {"t": "p", "h": "「……行かんか」"}, {"t": "p", "h": "「荷車を、作ります」"}, {"t": "p", "h": "「……乗るのか。おれが」"}, {"t": "p", "h": "「はい」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "昼前、人間の酒屋の裏で、ナオ吉が空き瓶の箱の底板を一枚、引きはがした。"}, {"t": "p", "h": "コウ吉とジュン吉が、人間の乾電池の輪切りを、四つ転がしてきた。ソラは、板に糸を巻いて、引き綱をつけた。"}, {"t": "p", "h": "「張る! 北に、着くほうに!」"}, {"t": "p", "h": "ジュン吉の声が、急に大きかった。"}, {"t": "p", "h": "「オレも、着くほう」とコウ吉が言った。"}, {"t": "p", "h": "ジュン吉は、手のひらの砂糖粒を転がした。反対に張る者が、いなかった。"}, {"t": "p", "h": "ナオ吉が、粒を一つ、板の上に置いた。"}, {"t": "p", "h": "「着かないほうだ」"}, {"t": "p", "h": "「……いいの?」とコウ吉が訊いた。"}, {"t": "p", "h": "ナオ吉は、車輪を指で回した。からから、と鳴った。"}, {"t": "p", "h": "答えなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "昼すぎ、ソラは賭場の奥へ行った。"}, {"t": "p", "h": "ヤマは、木箱に腰かけて、背表紙だけになった帳面を膝にのせていた。"}, {"t": "p", "h": "「北へ、行ってまいります」"}, {"t": "p", "h": "「へえ。持ち場、空っぽになるよね? 何日?」"}, {"t": "p", "h": "「三十六日です」"}, {"t": "p", "h": "「それ、片方だけ靴の人の勘定じゃない? その人、まだ戻ってないんだよね?」"}, {"t": "p", "h": "ソラは、両手を前で組んだ。"}, {"t": "p", "h": "「北で、ぼくを待っている方が、います」"}, {"t": "p", "h": "「帰ってきます」"}, {"t": "p", "h": "ヤマは、ソラの顔を見た。まばたきを、しなかった。"}, {"t": "p", "h": "<strong>「今日も、止めません」</strong>"}, {"t": "p", "h": "ヤマの手が、ソラの頭に乗った。"}, {"t": "p", "h": "ソラの肩が、少し上がった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "日が傾くまえに、荷車は寺の縁の下に着いた。"}, {"t": "p", "h": "スミの腰の水筒は、軽そうだった。"}, {"t": "p", "h": "スミは、柱の根もとの六つの石を見た。それから、荷車の板に腰をおろした。"}, {"t": "p", "h": "ナオ吉とコウ吉とジュン吉が、引き綱を肩にかけた。ソラも、綱を取った。"}, {"t": "p", "h": "車輪が、からから、と鳴った。"}, {"t": "p", "h": "ソラは、胸のところの値札の切れはしを、指で押さえた。"}, {"t": "p", "h": "縁の外へ出た。"}, {"t": "p", "h": "コウ吉とジュン吉も、綱を離さなかった。"}, {"t": "p", "h": "寺の角で、スミが一度だけ振り返った。"}, {"t": "p", "h": "鉢のふちから、しずくが続けて落ちていた。ぽつ、ぽつ、と、石の上で鳴った。"}, {"t": "p", "h": "荷車は、北を向いた。"}, {"t": "p", "h": "膝の上ではなく、綱を握った手の中で、左手の指が一本、折れた。"}, {"t": "p", "h": "<strong>春は、待たなかった。</strong>"}, {"t": "end", "h": "了"}], "chapters": [{"title": "序章　霜", "b": 0}, {"title": "第一章　木枯らし", "b": 66}, {"title": "第二章　霜柱", "b": 132}, {"title": "第三章　霜晴れ", "b": 172}, {"title": "第四章　しぐれ", "b": 239}, {"title": "第五章　薄氷", "b": 340}, {"title": "第六章　霜夜", "b": 403}, {"title": "第七章　初氷", "b": 448}, {"title": "第八章　冬の入り", "b": 525}, {"title": "終章　小春日和", "b": 593}]};

(function drawRuler(){

    const n = DATA.chapters.length, gap = 4, w = (284 - gap*(n-1))/n;

function saveBm(){ try{ if(bm) localStorage.setItem(BM_KEY, JSON.stringify(bm)); else localStorage.removeItem(BM_KEY); }catch(e){} }
function anchorOf(p){
  const pg = pages[p]; if(!pg) return null;
  for(const b of pg){ if(b && b.src!=null) return {s:b.src, p:b.part||0}; }
  if(pg[0] && pg[0].t==='toc') return {toc:true};

function pageOfAnchor(a){
  if(!a) return -1;
  if(a.toc) return pages.findIndex(pg=>pg[0] && pg[0].t==='toc');
  for(let p=1;p<pages.length;p++) for(const b of pages[p]) if(b && b.src===a.s && (b.part||0)>=a.p) return p;
  for(let p=1;p<pages.length;p++) for(const b of pages[p]) if(b && b.src!=null && b.src>=a.s) return p;
  return -1;
}

/* ---------- blocks -> DOM ---------- */
function makeEl(b){
  let el;
  if(b.t==='h2'){ el=document.createElement('h2'); el.innerHTML=b.h; }
  else if(b.t==='quote'){ el=document.createElement('blockquote'); el.innerHTML=b.h; }
  else if(b.t==='sep'){ el=document.createElement('div'); el.className='sep'; el.innerHTML=SEPSVG; }
  else if(b.t==='opener'){ el=document.createElement('div'); el.className='opener'; const im=document.createElement('img'); im.src=IMGS[b.i]; im.alt=b.alt.replace('\u3000',' '); el.appendChild(im); }
  else if(b.t==='end'){ el=document.createElement('p'); el.className='endmark'; el.textContent=b.h; }
  else if(b.t==='next'){ el=document.createElement('div'); el.className='nextnav'; el.innerHTML=b.h; }
  else { el=document.createElement('p'); el.innerHTML=b.h; if(b.g) el.className='pb'; }
  return el;
}
function contentBox(el){
  const r = el.getBoundingClientRect(), cs = getComputedStyle(el);
  return {
    left:   r.left   + parseFloat(cs.paddingLeft   || 0),
    right:  r.right  - parseFloat(cs.paddingRight  || 0),
    top:    r.top    + parseFloat(cs.paddingTop    || 0),
    bottom: r.bottom - parseFloat(cs.paddingBottom || 0)
  };
}
/* scrollWidth is unreliable in vertical-rl (content overflows leftward),
   so compare the last child's far edge with the page's content box. */
function over(el){
  const kids = el.children;
  if(!kids.length) return false;
  const box = contentBox(el);
  const k = kids[kids.length-1], r = k.getBoundingClientRect(), ks = getComputedStyle(k);
  return vertical
    ? (r.left - parseFloat(ks.marginLeft || 0)) < box.left - 0.5
    : (r.bottom + parseFloat(ks.marginBottom || 0)) > box.bottom + 0.5;
}
function splitText(t){
  const out=[]; let cur='';
  for(let i=0;i<t.length;i++){
    cur+=t[i];
    if('。！？」'.indexOf(t[i])>=0 && cur.length>=40){ out.push(cur); cur=''; }
  }
  if(cur) out.push(cur);
  return out.length?out:[t];
}

/* ---------- pagination ---------- */
function paginate(){
  const m = document.getElementById('measure'), mc = document.getElementById('mcol');
  const ref = document.getElementById('pageA').getBoundingClientRect();
  m.className='page';
  m.style.width = ref.width+'px';
  m.style.height = ref.height+'px';
  mc.innerHTML='';

  pages = [[{t:'cover'}],[{t:'toc'}]];
  chapPage = [];
  let cur = [];
  const push = ()=>{ if(cur.length){ pages.push(cur); cur=[]; } mc.innerHTML=''; };

  const esc = t => t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const drop = el => { if(el && el.parentNode) el.parentNode.removeChild(el); };

  // 1ページに単独で収まらない塊を、収まる単位に割って順番どおり流しこむ
  const flowSplit = (b)=>{
    let part = 0;
    if(b.t==='quote'){                    // 手紙は行単位で分ける
      const trim = a=>{ const c=a.slice();
        while(c.length && c[0]==='') c.shift();
        while(c.length && c[c.length-1]==='') c.pop();
        return c; };
      const lines = b.h.split('<br>');
      let buf=[], node=null;
      for(const ln of lines){
        const trial = buf.concat([ln]);
        drop(node);
        node = makeEl({t:'quote', h: trim(trial).join('<br>')});
        mc.appendChild(node);
        if(over(mc) && trim(buf).length){
          drop(node);
          cur.push({t:'quote', h: trim(buf).join('<br>'), src:b.src, part:part++});
          push();
          buf = (ln==='') ? [] : [ln];
          node = buf.length ? makeEl({t:'quote', h: ln}) : null;
          if(node) mc.appendChild(node);
        } else {
          buf = trial;
        }
      }
      if(trim(buf).length) cur.push({t:'quote', h: trim(buf).join('<br>'), src:b.src, part:part++});
      return;
    }
    for(const c of splitText(makeEl(b).textContent)){   // 段落は文単位で分ける
      const blk = {t:'p', h: esc(c), src:b.src, g:(part===0?b.g:0), part:part++};
      let node = makeEl(blk);
      mc.appendChild(node);
      if(over(mc) && cur.length){ drop(node); push(); node = makeEl(blk); mc.appendChild(node); }
      cur.push(blk);
    }
  };

  const feed = (b, chIndex)=>{
    if(b.t==='opener'){ push(); if(chIndex!=null) chapPage[chIndex]=pages.length; pages.push([b]); mc.innerHTML=''; return; }
    const el = makeEl(b);
    mc.appendChild(el);
    if(over(mc)){
      mc.removeChild(el);
      if(cur.length) push();
      mc.appendChild(el);
      if(over(mc)){                       // ページ丸ごと使っても収まらない
        mc.removeChild(el);
        if(chIndex!=null) chapPage[chIndex] = pages.length;
        flowSplit(b);
        return;
      }
    }
    if(chIndex!=null) chapPage[chIndex] = pages.length;
    cur.push(b);
  };

  const chStart = {};
  DATA.chapters.forEach((c,i)=>{ chStart[c.b]=i; });
  DATA.blocks.forEach((b,i)=> feed(b, chStart[i]!=null?chStart[i]:null));
  push();

  // verify: re-measure every page and move any spilled block to the next one
  for(let p=1;p<pages.length;p++){
    if(pages[p][0] && (pages[p][0].t==='toc' || pages[p][0].t==='opener')) continue;
    mc.innerHTML='';
    const keep=[]; const spill=[];
    for(const b of pages[p]){
      if(spill.length){ spill.push(b); continue; }
      const el=makeEl(b); mc.appendChild(el);
      if(over(mc) && keep.length){ mc.removeChild(el); spill.push(b); }
      else keep.push(b);
    }
    if(spill.length){
      pages[p]=keep;
      pages.splice(p+1,0,spill);
      for(let c=0;c<chapPage.length;c++) if(chapPage[c]>p) chapPage[c]++;
    }
  }
  mc.innerHTML='';
  if(pages.length%2===0 && spread) pages.push([{t:'blank'}]);
}

function update(dir){
  const A=document.getElementById('pageA'), B=document.getElementById('pageB');
  if(spread && idx>0 && idx%2===0) idx--;

  const prog = last>0 ? idx/last : 0;
  document.getElementById('mark').setAttribute('transform','translate('+(8+284*prog)+',0)');
  document.getElementById('finalmark').classList.toggle('show', idx===last);
  if(MOTIF==='foot'){
    const svgEl = document.getElementById('rulerSvg');
    const ruler = svgEl.parentNode;
    let layer = document.getElementById('fpLayer');
    if(!layer){
      layer = document.createElement('div'); layer.id = 'fpLayer';

    }

    layer.style.left = L+'px'; layer.style.width = W+'px';
    const FW = 15, N = Math.max(8, Math.min(40, Math.floor(W/24)));
    if(layer.dataset.n != String(N) || layer.dataset.w != String(W)){

      for(let i=0;i<N;i++){
        const x = (W-FW)*i/(N-1), y = (i%2) ? 12 : 3;
        h += `<svg class="fp" id="fp${i}" style="left:${x.toFixed(1)}px;top:${y}px" width="15" height="9" viewBox="0 0 15 9"><ellipse cx="9.6" cy="4.5" rx="4.3" ry="3.2"/><ellipse cx="2.7" cy="4.5" rx="2.3" ry="2.2"/></svg>`;
      }
      layer.innerHTML = h; layer.dataset.n = String(N); layer.dataset.w = String(W);
    }
    const shown = Math.max(1, Math.round(prog*(N-1))+1);
    for(let i=0;i<N;i++){
      const el = document.getElementById('fp'+i); if(!el) continue;
      el.classList.toggle('on', i < shown);
      el.classList.toggle('gone', idx===last && last>0 && i >= shown-3);
    }
    DATA.chapters.forEach((c,i)=>{
      const t = document.getElementById('ct'+i); if(!t) return;
      if(chapPage[i]==null || last<=0 || i===0){ t.style.display='none'; return; }
      const x = (8 + 284*(chapPage[i]/last)).toFixed(1);
      t.setAttribute('x1',x); t.setAttribute('x2',x); t.style.display='';
      t.classList.toggle('past', chapPage[i] <= idx);
    });
  }
  if(MOTIF==='drop'){
    /* 日数の目盛り：片方だけ靴を履いた男が発って、十九日目から三十六日目まで。読んだぶん濃く、いまに近い一本だけ朱 */
    const DAYS = [19,20,21,22,24,27,27,30,33,36], D0 = 19, D1 = 36;
    const svgEl = document.getElementById('rulerSvg');
    const ruler = svgEl.parentNode;
    let layer = document.getElementById('dpLayer');
    if(!layer){
      layer = document.createElement('div'); layer.id = 'dpLayer';
      ruler.style.position = 'relative'; ruler.appendChild(layer);
    }
    const rb = ruler.getBoundingClientRect(), sb = svgEl.getBoundingClientRect();
    const W = Math.round(sb.width), L = Math.round(sb.left - rb.left);
    layer.style.left = L+'px'; layer.style.width = W+'px';
    if(layer.dataset.w != String(W)){
      let h = '<div class="base"></div>';
      for(let d=D0; d<=D1; d++){
        const x = 4 + (W-8)*(d-D0)/(D1-D0);
        h += `<div class="dk${DAYS.indexOf(d)>=0?' ch':''}" id="dk${d}" style="left:${x.toFixed(1)}px"></div>`;
      }
      layer.innerHTML = h; layer.dataset.w = String(W);
    }
    // いまの位置を日にちに直す（章の始まりのページ＝その章の日）
    let day = D0;
    if(idx > 0){
      for(let i=0;i<DAYS.length;i++){
        const p0 = chapPage[i]; if(p0==null || idx < p0) break;
        const p1 = (i+1<DAYS.length && chapPage[i+1]!=null) ? chapPage[i+1] : null;
        day = (p1!=null && p1>p0) ? DAYS[i] + (DAYS[i+1]-DAYS[i])*(idx-p0)/(p1-p0) : DAYS[i];
      }
    }
    const near = Math.min(D1, Math.max(D0, Math.round(day)));
    for(let d=D0; d<=D1; d++){

      el.classList.toggle('now', idx>0 && d === near);

}

/* ---------- column fitting ---------- */
function fitColumn(){
  const pa = document.getElementById('pageA'), cs = getComputedStyle(pa);
  const avail = vertical
    ? pa.clientHeight - parseFloat(cs.paddingTop)  - parseFloat(cs.paddingBottom)
    : pa.clientWidth  - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const n = CHARS[sizeIdx];
  let fs = Math.min(SIZES[sizeIdx], avail / (n * KERN));
  fs = Math.max(12.5, fs);
  const colw = Math.min(avail, Math.floor(fs * n * KERN));
  document.documentElement.style.setProperty('--fs', fs.toFixed(2)+'px');
  document.documentElement.style.setProperty('--colw', colw+'px');
}

/* ---------- layout ---------- */
function layout(keepBlock){
  spread = window.innerWidth >= 940 && window.innerHeight >= 420;
  document.body.classList.toggle('spread', spread);
  document.body.classList.toggle('vert', vertical);
  document.documentElement.style.setProperty('--fs', SIZES[sizeIdx]+'px');
  document.documentElement.style.setProperty('--lh', vertical? '1.95' : '2.05');
  requestAnimationFrame(()=>{
    fitColumn();
    paginate();
    if(keepBlock!=null){
      let found=0;
      for(let p=1;p<pages.length;p++){ if(pages[p].some(b=>b===keepBlock)){ found=p; break; } }
      idx = found || Math.min(idx, pages.length-1);
    }
    buildToc();
    update(0);
  });
}
