<style>
  :root{
    --paper:#e3ddcb;
    --paper-deep:#d6cfba;
    --edge:#c2b9a0;
    --ink:#2b2722;
    --ink-soft:#6d6557;
    --pencil:#4d5157;
    --shu:#a8402c;
    --fs:17px;
    --lh:2.05;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    background:#b9b09a;
    background-image:
      radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.18), transparent 60%),
      repeating-linear-gradient(102deg, rgba(0,0,0,.025) 0 2px, transparent 2px 5px);
    color:var(--ink);
    font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP","Songti SC",serif;
    overflow:hidden;
    -webkit-text-size-adjust:100%;
  }
  #app{height:100dvh;display:flex;flex-direction:column;}

  /* ---- top bar ---- */
  .bar{
    flex:0 0 auto;display:flex;align-items:center;gap:14px;
    padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
  }
  .bar button{
    font:inherit;font-size:13px;letter-spacing:.14em;
    background:none;border:none;color:#4a4335;padding:6px 2px;cursor:pointer;
  }
  .bar button:focus-visible{outline:1.5px solid var(--shu);outline-offset:3px;}

  /* ---- ruler ---- */
  .ruler{flex:1 1 auto;display:flex;align-items:flex-end;gap:6px;height:26px;}
  .ruler .rn{font-size:11px;color:#5c5343;line-height:1;padding-bottom:3px;}
  .ruler svg{flex:1 1 auto;width:100%;height:100%;display:block;overflow:visible;}
  .rulerline{stroke:#5c5343;stroke-width:1;}
  .tick{stroke:#5c5343;stroke-width:1;}
  .tick.mm{stroke:#5c5343;opacity:.45;}
  .num{fill:#5c5343;font-size:9px;font-family:inherit;}
  .fp{fill:#3e3c3a;opacity:0;transition:opacity .45s ease;}
  .fp.on{opacity:.82;}
  .ct{stroke:#9a907e;stroke-width:1;}
  .ct.now{stroke:#2b2722;stroke-width:2.4;}
  .fp.on.gone{opacity:0;transition:opacity 1.4s ease .5s;}
  @media (prefers-reduced-motion:reduce){ .fp,.fp.on.gone{transition:none;} }
  #mark{transition:transform .35s cubic-bezier(.3,.7,.3,1);}
  #mark line{stroke:var(--pencil);stroke-width:2;stroke-linecap:round;}
  #mark text{fill:var(--pencil);font-size:8.5px;letter-spacing:.06em;}
  #finalmark{opacity:0;}
  #finalmark line{stroke:var(--shu);stroke-width:2.4;stroke-linecap:round;}
  #finalmark text{fill:var(--shu);font-size:9px;}
  #finalmark.show{opacity:1;animation:scratch .7s ease-out;}
  @keyframes scratch{from{clip-path:inset(0 0 100% 0);}to{clip-path:inset(0 0 0 0);}}

  /* ---- book ---- */
  #book{flex:1 1 auto;position:relative;padding:0 10px 4px;min-height:0;}
  .spread{
    height:100%;display:flex;gap:0;justify-content:center;
    filter:drop-shadow(0 10px 22px rgba(60,50,30,.32));
  }
  body.vert .spread{flex-direction:row-reverse;}
  .page{
    position:relative;flex:1 1 0;min-width:0;height:100%;max-width:640px;
    background:var(--paper);
    background-image:
      radial-gradient(ellipse at 20% 12%, rgba(255,255,255,.5), transparent 55%),
      radial-gradient(ellipse at 85% 90%, rgba(150,130,90,.18), transparent 60%);
    padding:26px 20px calc(22px + env(safe-area-inset-bottom));
    overflow:hidden;
    font-size:var(--fs);line-height:var(--lh);
    letter-spacing:.03em;
    text-align:justify;
  }
  body.vert .page{writing-mode:vertical-rl;text-orientation:mixed;text-align:start;}
  .col{inline-size:var(--colw,100%);block-size:100%;margin-inline:auto;}
  .page.blank{background:var(--paper-deep);}
  #pageB{display:none;}
  body.spread #pageB{display:block;}
  body.spread #pageA{box-shadow:inset -14px 0 22px -16px rgba(90,72,40,.55);}
  body.spread #pageB{box-shadow:inset 14px 0 22px -16px rgba(90,72,40,.55);}
  body.spread.vert #pageA{box-shadow:inset 14px 0 22px -16px rgba(90,72,40,.55);}
  body.spread.vert #pageB{box-shadow:inset -14px 0 22px -16px rgba(90,72,40,.55);}

  .flip{animation:flip .26s ease;}
  @keyframes flip{from{opacity:.15;transform:translateX(var(--dx,10px));}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){
    .flip{animation:none;} #mark{transition:none;} #finalmark.show{animation:none;}
  }

  /* ---- text blocks ---- */
  .page p{margin:0;text-indent:1em;}
  .page p + p{margin-top:0;}
  body.vert .page p{text-indent:1em;}
  .page h2{
    margin:0 0 1.6em;font-size:1.22em;font-weight:600;letter-spacing:.22em;
    line-height:1.7;text-indent:0;
  }
  body:not(.vert) .page h2{border-bottom:1px solid rgba(90,80,60,.28);padding-bottom:.5em;}
  body.vert .page h2{border-left:1px solid rgba(90,80,60,.28);padding-left:.5em;margin:0 0 1.6em 0;}
  .page blockquote{
    margin:1.2em .4em;padding:0 1em;color:#4b4335;font-size:.94em;
    border-left:2px solid rgba(120,100,60,.4);
  }
  body.vert .page blockquote{
    margin:.4em 1.2em;padding:1em 0;border-left:none;
    border-top:2px solid rgba(120,100,60,.4);
  }
  .sep{margin:1.5em auto;width:34%;height:0;border-top:1px solid rgba(90,80,60,.3);}
  body.vert .sep{margin:auto 1.5em;height:34%;width:0;border-top:none;border-left:1px solid rgba(90,80,60,.3);}
  .endmark{margin:2em 0 0;text-align:center;letter-spacing:.6em;color:var(--ink-soft);text-indent:0;}
  strong{font-weight:700;}
  body.vert strong{
    text-emphasis:filled dot var(--ink);-webkit-text-emphasis:filled dot var(--ink);
    font-weight:inherit;
  }
  em{font-style:normal;color:var(--ink-soft);}

  /* ---- cover ---- */
  .cover{display:flex;align-items:center;justify-content:center;height:100%;max-height:100%;}
  .cover-in{text-align:center;max-width:100%;}
  body.vert .cover-in{writing-mode:vertical-rl;height:100%;max-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;}
  .cover h1{
    margin:0;font-size:min(6.6vh,8.2vw,50px);font-weight:400;
    letter-spacing:.22em;line-height:1.45;text-indent:0;
  }
  body.vert .cover h1{max-height:100%;}
  .cover .sub{margin-top:1.4em;font-size:.86em;letter-spacing:.34em;color:var(--ink-soft);}
  body.vert .cover .sub{margin:1.4em 0 0;}
  .cover .pillar{margin-top:2.2em;}
  body.vert .cover .pillar{margin:2.2em 0 0;}
  .cover .pillar svg{max-height:22vh;}

  /* ---- tap zones + footer ---- */
  .zone{position:absolute;top:0;bottom:0;width:34%;border:none;background:none;cursor:pointer;padding:0;}
  .zone.l{left:0;} .zone.r{right:0;}
  .zone:focus-visible{outline:1.5px dashed var(--shu);outline-offset:-6px;}
  .foot{
    flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;
    padding:8px 18px calc(env(safe-area-inset-bottom) + 8px);
    font-size:11.5px;letter-spacing:.14em;color:#514936;
  }
  .foot span{opacity:.85;}

  /* ---- sheets ---- */
  .sheet{
    position:fixed;inset:0;z-index:20;display:none;
    background:rgba(40,34,24,.5);backdrop-filter:blur(2px);
  }
  .sheet.open{display:block;}
  .sheet-in{
    position:absolute;left:0;right:0;bottom:0;max-height:76%;overflow:auto;
    background:var(--paper);padding:22px 22px calc(env(safe-area-inset-bottom) + 26px);
    border-radius:2px 2px 0 0;
  }
  .sheet h3{margin:0 0 16px;font-size:14px;letter-spacing:.24em;font-weight:600;color:#4a4335;}
  .toc-item{
    display:flex;justify-content:space-between;gap:14px;width:100%;
    font:inherit;font-size:15px;text-align:left;background:none;border:none;
    padding:11px 0;border-bottom:1px solid rgba(90,80,60,.18);color:var(--ink);cursor:pointer;
  }
  .toc-item .pg{font-size:11px;color:var(--ink-soft);letter-spacing:.1em;flex:0 0 auto;}
  .toc-item[aria-current="true"]{color:var(--shu);}
  .row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid rgba(90,80,60,.18);}
  .row:last-child{border-bottom:none;}
  .row .lab{font-size:14px;letter-spacing:.1em;}
  .seg{display:flex;border:1px solid rgba(90,80,60,.4);}
  .seg button{
    font:inherit;font-size:13px;padding:7px 15px;background:none;border:none;cursor:pointer;color:#4a4335;
    border-left:1px solid rgba(90,80,60,.25);
  }
  .seg button:first-child{border-left:none;}
  .seg button[aria-pressed="true"]{background:#4a4335;color:var(--paper);}
  .close{margin-top:20px;width:100%;font:inherit;font-size:13px;letter-spacing:.2em;padding:12px;background:none;border:1px solid rgba(90,80,60,.4);cursor:pointer;color:#4a4335;}

  #measure{position:fixed;top:-99999px;left:0;visibility:hidden;pointer-events:none;}

  /* ---- 電子版デザイン ---- */
  .page .opener{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#f1ece0;writing-mode:horizontal-tb;}
  .page .opener img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;}
  .sep{display:flex;align-items:center;justify-content:center;border:none !important;margin:1.4em auto;width:auto;height:auto;}
  body.vert .sep{margin:auto 1.3em;width:auto;height:auto;}
  body:not(.vert) .sep svg{transform:rotate(-90deg);}
  body.vert .sep svg{transform:none;}

  /* ---- 目次ページ・しおり ---- */
  .bar button{white-space:nowrap;flex:0 0 auto;}
  .ruler .rn{white-space:nowrap;flex:0 0 auto;}
  .ruler{min-width:0;} .ruler svg{min-width:0;}
  .bar{gap:10px;}
  .tocpage{position:relative;z-index:3;pointer-events:none;display:flex;flex-direction:column;gap:.45em;height:100%;}
  body.vert .tocpage{padding-top:0;}
  .tocpage h2{margin:0 0 .5em;border:none !important;padding:0 !important;font-size:1.05em;letter-spacing:.5em;}
  .tocpage .ti{display:flex;align-items:center;gap:.5em;font:inherit;background:none;border:none;padding:0;margin:0;color:var(--ink);cursor:pointer;text-align:start;line-height:1.3;}
  .tocpage .tb{pointer-events:auto;display:flex;align-items:center;gap:.5em;font:inherit;background:none;border:none;padding:.1em;margin:0;color:inherit;cursor:pointer;line-height:1.3;}
  .tocpage .tb:focus-visible{outline:1.5px solid var(--shu);outline-offset:2px;}
  .tocpage .tb:active .t{color:var(--shu);}
  .tocpage .ti .n{color:var(--ink-soft);font-size:.85em;letter-spacing:.2em;flex:0 0 auto;}
  .tocpage .ti .t{flex:0 1 auto;}
  .tocpage .ti .d{flex:1 1 auto;min-width:1em;min-height:1em;border:0 dotted rgba(90,80,60,.45);}
  body:not(.vert) .tocpage .ti .d{border-bottom-width:1px;}
  body.vert .tocpage .ti .d{border-left-width:1px;}
  .tocpage .ti .p{display:inline-block;writing-mode:horizontal-tb;font-size:.72em;color:var(--ink-soft);letter-spacing:.05em;flex:0 0 auto;}
  .page.marked::after{content:"";position:absolute;top:14px;right:18px;width:40px;height:20px;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2040%2020%22%3E%3Cg%20transform%3D%22rotate%28-12%2020%2010%29%22%3E%3Cellipse%20cx%3D%2220%22%20cy%3D%2211%22%20rx%3D%2213%22%20ry%3D%227%22%20fill%3D%22%236d6557%22/%3E%3Cellipse%20cx%3D%2215.5%22%20cy%3D%228.6%22%20rx%3D%224.6%22%20ry%3D%221.9%22%20fill%3D%22%238f8674%22/%3E%3C/g%3E%3C/svg%3E") no-repeat center/contain;z-index:4;pointer-events:none;opacity:.95;}
  body.spread.vert #pageB.marked::after, body.spread:not(.vert) #pageA.marked::after{right:auto;left:22px;}
  #bmBtn[aria-pressed="true"]{color:var(--shu);}
  .foot .bmjump{font:inherit;font-size:11px;letter-spacing:.14em;background:none;border:1px solid rgba(168,64,44,.55);color:var(--shu);padding:3px 10px;cursor:pointer;margin:0 8px;}
  .foot .bmjump[hidden]{display:none;}
  .sheet .bm-item{width:100%;text-align:left;font:inherit;font-size:13px;letter-spacing:.12em;background:none;border:1px solid rgba(168,64,44,.5);color:var(--shu);padding:10px 12px;margin:0 0 14px;cursor:pointer;}
  .sheet .bm-item[hidden]{display:none;}
  .chend{display:block;text-indent:0;text-align:end;font-size:.82em;color:var(--ink-soft);letter-spacing:.2em;margin-top:.6em;}
  .win{fill:#f2d79c;stroke:#b08a45;stroke-width:1;transition:fill .5s ease,stroke .5s ease;}
  .win.now{fill:#f6c46a;stroke:#8a5f1e;stroke-width:1.6;}
  .win.off{fill:none;stroke:#9a917c;}
  @media (prefers-reduced-motion: reduce){.win{transition:none;}}

  #homeLink{font:inherit;font-size:inherit;letter-spacing:.14em;color:var(--ink-soft);text-decoration:none;white-space:nowrap;flex:0 0 auto;}
  #homeLink:hover,#homeLink:focus-visible{color:var(--ink);}
  #homeLink[hidden]{display:none;}
  .nextnav{margin:2.4em 0 0;text-align:center;text-indent:0;line-height:2;}
  .nextnav .lead{display:block;font-size:.8em;letter-spacing:.3em;color:var(--ink-soft);}
  .nextnav a{display:inline-block;margin-top:.4em;padding:.35em 1.1em;border:1px solid rgba(168,64,44,.55);color:var(--shu);
    text-decoration:none;letter-spacing:.12em;font-size:.95em;}
  .nextnav a + a{margin-left:.8em;}
  .page .opener.cov{overflow:hidden;}
  .page .opener.cov .covbg{position:absolute;left:-12px;right:-12px;height:52%;background-repeat:no-repeat;background-size:100% 4000%;filter:blur(6px);}
  .page .opener.cov .covbg.t{top:-12px;background-position:center top;}
  .page .opener.cov .covbg.b{bottom:-12px;background-position:center bottom;}
  .page .opener.cov img{position:relative;
    -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 4%,#000 96%,transparent 100%);
            mask-image:linear-gradient(180deg,transparent 0,#000 4%,#000 96%,transparent 100%);}
  .page .opener.cov.lr .covbg{top:-12px;bottom:-12px;height:auto;width:52%;background-size:4000% 100%;}
  .page .opener.cov.lr .covbg.t{left:-12px;right:auto;background-position:left center;}
  .page .opener.cov.lr .covbg.b{right:-12px;left:auto;bottom:-12px;background-position:right center;}
  .page .opener.cov.lr img{
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 3%,#000 97%,transparent 100%);
            mask-image:linear-gradient(90deg,transparent 0,#000 3%,#000 97%,transparent 100%);}
</style>

<body class="vert">
<div id="app">
  <div class="bar">
    <a id="homeLink" href="index.html" hidden>ほかの本</a>
    <button id="tocBtn" aria-haspopup="dialog">目次</button>
    <div class="ruler" aria-hidden="true">
      <span class="rn"></span>
      <svg id="rulerSvg" viewBox="0 0 300 26" preserveAspectRatio="none"></svg>
      <span class="rn"></span>
    </div>
    <button id="bmBtn" aria-pressed="false" aria-label="このページにしおりをはさむ">しおり</button>
    <button id="setBtn" aria-haspopup="dialog">表示</button>
  </div>

  <div id="book">
    <div class="spread">
      <section class="page" id="pageA" aria-live="polite"><div class="col"></div></section>
      <section class="page" id="pageB"><div class="col"></div></section>

</div>

<div class="sheet" id="tocSheet" role="dialog" aria-label="目次">
  <div class="sheet-in">
    <h3>目次</h3>
    <button class="bm-item" id="bmItem" type="button" hidden>しおりのページへ</button>
    <div id="tocList"></div>
    <button class="close" data-close>閉じる</button>
  </div>
</div>

<div class="sheet" id="setSheet" role="dialog" aria-label="表示設定">
  <div class="sheet-in">
    <h3>表示</h3>
    <div class="row">
      <span class="lab">組み方</span>
      <div class="seg" id="dirSeg">
        <button data-dir="v" aria-pressed="true">縦書き</button>
        <button data-dir="h" aria-pressed="false">横書き</button>
      </div>
    </div>
    <div class="row">
      <span class="lab">文字の大きさ</span>
      <div class="seg" id="sizeSeg">
        <button data-size="0" aria-pressed="false">小</button>

        <button data-size="2" aria-pressed="false">大</button>
      </div>
    </div>
    <button class="close" data-close>閉じる</button>
  </div>
</div>

<script>
const DATA = {"title": "0センチメートル", "sub": "消された跡", "blocks": [{"t": "opener", "i": 0, "alt": "序章　凍った足跡"}, {"t": "p", "h": "夜明け前、ナオ吉は一度だけ、ラリオの道へ寄った。"}, {"t": "p", "h": "三つ目の排水口の手前に、片方の靴がある。"}, {"t": "p", "h": "つま先の向きを直した。埃を払った。道の内側へ、半歩。"}, {"t": "p", "h": "甲の縫い目に、指を当てる。横に三本。ほつれは、増えていない。"}, {"t": "p", "h": "ナオ吉は、つま先をもう一度だけ見て、立ち上がった。"}, {"t": "p", "h": "それから、裏口の坂へ戻った。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "南へ十八日。"}, {"t": "p", "h": "人間の二駅ぶんである。"}, {"t": "p", "h": "線路の脇の砂利を行く。石が、足の裏で転がる。一歩ごとに、体が少し沈む。"}, {"t": "p", "h": "枕木は、粗い縫い目のように、同じ幅で南へ続いていた。"}, {"t": "p", "h": "背中の荷は軽い。缶に貯めていた粒と、毛布と、針と糸。"}, {"t": "p", "h": "ナオ吉は、胸のところに手を当てた。"}, {"t": "p", "h": "紙の角が、指に当たった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "最初の夜、雪が降った。"}, {"t": "p", "h": "側溝の蓋の下で、毛布にくるまった。蓋の格子のあいだから、白いものが落ちてくる。"}, {"t": "p", "h": "「……オレが出た日に、降るんだよな」"}, {"t": "p", "h": "返事はなかった。"}, {"t": "p", "h": "うろこ堂なら、ヒロが「どうせな」と言うところだった。じいさんが、今年の初雪は平年より何日早い、と数えだすところだった。"}, {"t": "p", "h": "朝までに、道は埋まる。"}, {"t": "p", "h": "三つ目の排水口の手前も、埋まる。"}, {"t": "p", "h": "あの冬、オレは掘らなかった。"}, {"t": "p", "h": "<strong>これからは、掘る者もいない。</strong>"}, {"t": "p", "h": "ナオ吉は、拳を握った。"}, {"t": "p", "h": "それから、目を閉じた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "三日目から、日を数えることにした。"}, {"t": "p", "h": "日数を数えるのは、じいさんの役目だった。うろこ堂では、そうだった。"}, {"t": "p", "h": "ここには、じいさんがいない。"}, {"t": "p", "h": "日が暮れるたびに、その日の数を、口の中で一度だけ言った。"}, {"t": "p", "h": "負けの数なら、一度も数え間違えたことがない。日の数も、同じだった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "十一日目、砂利が切れた。"}, {"t": "p", "h": "線路は、鉄の橋で川を渡る。小さき者は、その下の土管をくぐる。"}, {"t": "p", "h": "土管の底は、泥だった。"}, {"t": "p", "h": "雪は、ここまで入っていない。泥は凍って、固くなっていた。"}, {"t": "p", "h": "そこに、足跡があった。"}, {"t": "p", "h": "霜が、跡のふちだけを白くしていた。"}, {"t": "p", "h": "ナオ吉は、しゃがんだ。"}, {"t": "p", "h": "片方は、靴の跡だった。"}, {"t": "p", "h": "もう片方は、素足の跡だった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "同じ跡を、見たことがある。"}, {"t": "p", "h": "うろこ堂の裏口の坂で、霜の上に、二種類並んで続いていた。"}, {"t": "p", "h": "泥がやわらかかったころに、だれかがここを通った。そのあとで冷えて、固まった。"}, {"t": "p", "h": "二十日前か。もっと前か。"}, {"t": "p", "h": "指を伸ばしかけて、止めた。"}, {"t": "p", "h": "触らなかった。"}, {"t": "p", "h": "<strong>跡は、南を向いていた。</strong>"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ナオ吉は、立ち上がった。"}, {"t": "p", "h": "土管の出口まで、跡は続いている。"}, {"t": "p", "h": "ナオ吉は、その横を歩いた。"}, {"t": "p", "h": "踏まないように、半歩ぶん、外を。"}, {"t": "opener", "i": 1, "alt": "第一章　引っかき傷"}, {"t": "p", "h": "十八日目の夕方、ナオ吉は南町三丁目に着いた。"}, {"t": "p", "h": "人間の酒屋があった。空き瓶の箱が、裏に高く積んである。その箱の隙間から、粒の転がる音がした。"}, {"t": "p", "h": "ナオ吉は、そちらを見なかった。"}, {"t": "p", "h": "酒屋の隣に、古本屋があった。表のガラス戸に、人間の字が書いてある。"}, {"t": "p", "h": "<strong>古書つばめ堂</strong>"}, {"t": "sep", "h": ""}, {"t": "p", "h": "戸の下のすきまから、中へ入った。"}, {"t": "p", "h": "本の匂いがした。うろこ堂と同じ匂いだった。少しだけ、ちがう匂いもまじっていた。"}, {"t": "p", "h": "帳場で、店主の、人間の年寄りが居眠りをしていた。"}, {"t": "p", "h": "ナオ吉は、床と棚のすきまを伝って、奥へ進んだ。棚はうろこ堂より背が低く、本は多かった。床にまで積んである。"}, {"t": "p", "h": "いちばん奥の棚のうしろに、すきまがあった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "暗かった。"}, {"t": "p", "h": "表の街灯の明かりが、棚板のあいだから、糸のように細く一筋だけ差しこんでいる。"}, {"t": "p", "h": "その明かりの中に、だれかいた。"}, {"t": "p", "h": "床に、人間の本が一冊、開いたまま置いてある。その頁の上に、男が座っていた。背は高くない。姿勢だけが、異様によかった。"}, {"t": "p", "h": "男は、両腕で頁の端を持ち上げて、めくった。紙が、ゆっくり向こうへ倒れた。"}, {"t": "p", "h": "それから、頁の隅に小石を置いた。紙が戻らないように、押さえておくためらしかった。"}, {"t": "p", "h": "置いてから、少しずらした。"}, {"t": "p", "h": "もう一度、ずらした。"}, {"t": "p", "h": "三度目で、手を離した。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "男の足もとを見た。"}, {"t": "p", "h": "左の足には、靴を履いている。右の足は、素足だった。"}, {"t": "p", "h": "ナオ吉は、拳を握った。"}, {"t": "p", "h": "男が、顔を上げた。驚いた顔は、しなかった。"}, {"t": "p", "h": "「……ここに、住んでんのか」"}, {"t": "p", "h": "男は、少しのあいだ黙っていた。"}, {"t": "p", "h": "「ここは読むところだ」"}, {"t": "p", "h": "それから、頁に目を戻した。"}, {"t": "p", "h": "めくる音がひとつして、また止まった。"}, {"t": "p", "h": "「……<strong>寝るなら、奥の半分を使え</strong>」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ナオ吉は、答えなかった。"}, {"t": "p", "h": "奥へ行った。棚のうしろのすきまは、思ったより深かった。"}, {"t": "p", "h": "壁に、引っかいたような傷が並んでいた。細い線が、何本も。"}, {"t": "p", "h": "ナオ吉は、それを数えなかった。"}, {"t": "p", "h": "暗がりのいちばん奥に、段ボールがひとつ置いてあった。側面の墨の字を、ナオ吉は知っていた。"}, {"t": "p", "h": "南町三丁目　古書つばめ堂　様"}, {"t": "p", "h": "蓋は開いていて、中はからだった。"}, {"t": "p", "h": "荷を下ろした。毛布を広げた。胸に手を当てて、紙の角を確かめた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "夜が更けて、男は立ち上がった。"}, {"t": "p", "h": "本はそのままにして、隣の酒屋のほうへ出ていった。片方だけの靴の音が、遠ざかった。"}, {"t": "p", "h": "ナオ吉は、毛布から出た。"}, {"t": "p", "h": "明かりの中の本を見た。"}, {"t": "p", "h": "頁の隅に、小石がある。"}, {"t": "p", "h": "少し、曲がっていた。"}, {"t": "p", "h": "ナオ吉は、小石を、頁の角にまっすぐそろえた。"}, {"t": "p", "h": "「……曲がってんだよ」"}, {"t": "p", "h": "それから、毛布に戻った。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "いつもの時刻に、目が覚めた。"}, {"t": "p", "h": "小石は、ゆうべの曲がった位置に戻っていた。"}, {"t": "p", "h": "「……曲がってねえってのか」"}, {"t": "opener", "i": 2, "alt": "第二章　なくなった欄"}, {"t": "p", "h": "三百七十二日目の朝、ソラは手紙を一枚持って、古本屋へ行った。"}, {"t": "p", "h": "紙は、ゆうべ酒屋の角で拾ったものだった。人間の値札の切れはしで、裏が白い。鉛筆の芯のかけらで、米粒ほどの字を書いた。"}, {"t": "p", "h": "書いたのは、いつもと同じことだった。"}, {"t": "p", "h": "九十三枚目である。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "古本屋の戸の下をくぐると、帳場で年寄りの店主が眠っていた。"}, {"t": "p", "h": "ソラは、店主に頭を下げた。"}, {"t": "p", "h": "「おじゃまします」"}, {"t": "p", "h": "店主には、聞こえない。聞こえても困る。それでも、ソラは、来るたびにそう言った。"}, {"t": "p", "h": "棚の本を、下の段から見ていく。挟むのは、売れそうな本だ。背表紙がきれいで、人間の手あかがついていないもの。売れれば、どこかへ運ばれる。遠くへ運ばれれば、北へ行くかもしれない。"}, {"t": "p", "h": "一冊、頁の端が茶色くなっている本があった。"}, {"t": "p", "h": "ソラは、その本には挟まなかった。古い本は、売れ残るので。"}, {"t": "p", "h": "背表紙のきれいな一冊を選んだ。頁の端のすきまに、紙を押しこむ。両手で、奥まで。紙の角が見えなくなるまで。"}, {"t": "p", "h": "「失礼しました」"}, {"t": "p", "h": "店主は、まだ眠っていた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "夕方、ソラは持ち場に立った。"}, {"t": "p", "h": "木箱の隙間の、いつもの場所である。隣の隙間には、ジュン吉とコウ吉がいる。二人とも、ソラより頭ひとつ小さい。"}, {"t": "p", "h": "「いらっしゃい! いらっしゃい!」"}, {"t": "p", "h": "ソラは、通りかかる者の一人ひとりに、同じ笑顔を向けた。左手の指が、ひとりでに折れたり伸びたりする。"}, {"t": "p", "h": "隣の隙間では、コウ吉が声を張っていた。"}, {"t": "p", "h": "「よかったら! よかったら!」"}, {"t": "p", "h": "なにがよかったらなのかは、だれにも分からなかった。"}, {"t": "p", "h": "「ジュン吉さん。いまの方、呼べました」"}, {"t": "p", "h": "「呼んだよ。行っちゃったけど」"}, {"t": "p", "h": "「声が、少し小さかったです」"}, {"t": "p", "h": "「もう無理です! これ以上、出ません!」"}, {"t": "p", "h": "コウ吉が、木箱の陰から顔を出した。"}, {"t": "p", "h": "「なあ、ソラ。なんでオレたちにまで『さん』なの」"}, {"t": "p", "h": "「みなさんに、そうしています」"}, {"t": "p", "h": "「猫にも?」"}, {"t": "p", "h": "ソラは、少し考えた。"}, {"t": "p", "h": "「猫さんには、まだ声をかけたことがありません」"}, {"t": "p", "h": "コウ吉が、腹を抱えて笑った。"}, {"t": "p", "h": "ジュン吉が、砂糖粒を握って隙間から飛び出してきた。"}, {"t": "p", "h": "「張る! ソラが猫に声かけるほうに、一粒!」"}, {"t": "p", "h": "ソラには、なにがおかしいのか、わからなかった。わからないまま、次の客に笑顔を向けた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "夜、ソラはヤマのところへ行った。"}, {"t": "p", "h": "賭場の奥の、ヤマの寝床である。ほかには、だれもいない。"}, {"t": "p", "h": "ヤマは、帳面を開いて待っていた。人間の値札の裏を綴じた帳面である。"}, {"t": "p", "h": "「今日は、二十三人、呼びました」"}, {"t": "p", "h": "「はいはい」"}, {"t": "p", "h": "「稼ぎは、四粒です。ジュン吉さんが一粒、コウ吉さんが一粒です」"}, {"t": "p", "h": "ヤマは、それを書いた。字は読みやすく、計算に間違いはなかった。"}, {"t": "p", "h": "帳面の頁には、欄が二つしかない。人数と、稼ぎ。いちばん右にあった欄は、もうない。"}, {"t": "p", "h": "「……もう書かなくていいんだよね、これ。律儀すぎない?」"}, {"t": "p", "h": "ヤマは、そう言いながら、書き終えた。"}, {"t": "p", "h": "「はい」"}, {"t": "p", "h": "ソラは、それでも毎晩、報告に来た。ヤマは、それでも毎晩、帳面を開いて待っていた。どちらも、やめようとは言わなかった。"}, {"t": "p", "h": "ヤマの手が、ソラの頭の上まで来て、止まった。"}, {"t": "p", "h": "ソラの肩が、少しだけ上がった。"}, {"t": "p", "h": "手は、そのまま戻っていった。"}, {"t": "p", "h": "「で、今日も手紙、挟んできたんだよね?」"}, {"t": "p", "h": "「はい。九十三枚目です」"}, {"t": "p", "h": "「……ふうん」"}, {"t": "p", "h": "ヤマは、まばたきをしなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "寝床に入って、ソラは左手を上げた。"}, {"t": "p", "h": "指を一本ずつ折る。"}, {"t": "p", "h": "三百七十二。"}, {"t": "p", "h": "指は、いつものはやさで折れた。"}, {"t": "p", "h": "<strong>返事は、まだ一通も来ていない。</strong>"}, {"t": "opener", "i": 3, "alt": "第三章　曲がった小石"}, {"t": "p", "h": "冬のさなかの夜だった。"}, {"t": "p", "h": "人間の酒屋の裏、空き瓶の箱の隙間の奥で、空き缶の底を伏せた台に、札が配られていく。"}, {"t": "p", "h": "客は四人。安藤は、いつもの隅に座っていた。"}, {"t": "p", "h": "胴元は、顔を上げなかった。少し長い髪が、うつむいた顔にまっすぐかかっている。見えるのは、札を配る手だけだった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "向かいの客が、隣の客に顔を寄せた。"}, {"t": "p", "h": "「門番は、今夜も顔を上げねえな」"}, {"t": "p", "h": "「上げるかよ。地獄の門番だぞ」"}, {"t": "p", "h": "「上げるときは、どんなときだ」"}, {"t": "p", "h": "「門の前で、足を止めるやつがいるときだけだ」"}, {"t": "p", "h": "二人は笑った。胴元は、札を配り続けた。"}, {"t": "p", "h": "「マヨ。こっちにも一枚」"}, {"t": "p", "h": "マヨは、顔を上げずに一枚すべらせた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "安藤は、砂糖粒を二つ置いた。"}, {"t": "p", "h": "札をめくる。はずれ。"}, {"t": "p", "h": "二つの粒が、マヨの箱に落ちた。"}, {"t": "p", "h": "もう二つ置いた。"}, {"t": "p", "h": "そのとき、箱の隙間の外で、足音が止まった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "明かりは、台のまわりを丸く照らしている。その輪の、いちばん外のふちに、男がひとり立っていた。"}, {"t": "p", "h": "痩せている。目の下に、隈がある。"}, {"t": "p", "h": "隣の古本屋の、棚の奥で寝ている男だった。"}, {"t": "p", "h": "男は、台を見ていた。台の上の札と、粒と、マヨの手を。"}, {"t": "p", "h": "<strong>明かりの輪に、入らなかった。</strong>"}, {"t": "p", "h": "右の手が、握られていた。指の関節が、白かった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "客のひとりが、振り返った。"}, {"t": "p", "h": "「入るのか、入らねえのか」"}, {"t": "p", "h": "男は、答えなかった。"}, {"t": "p", "h": "マヨの手が、止まった。"}, {"t": "p", "h": "マヨが、顔を上げた。髪のあいだから、目を細めて、明かりのふちを見た。頬の骨の形が、そのまま顔の形になっていた。"}, {"t": "p", "h": "それから、また顔を伏せた。"}, {"t": "p", "h": "札が、配られた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "男は、長いこと立っていた。"}, {"t": "p", "h": "それから、背を向けた。足音が、古本屋のほうへ遠ざかった。"}, {"t": "p", "h": "安藤は、台の上の二粒を見た。"}, {"t": "p", "h": "札は、まだめくっていなかった。"}, {"t": "p", "h": "安藤は、二粒を手のひらに戻して、立ち上がった。"}, {"t": "p", "h": "「今日は、早いな」"}, {"t": "p", "h": "マヨは、顔を上げずに言った。"}, {"t": "p", "h": "安藤は、答えなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "古本屋の棚の奥は、暗かった。"}, {"t": "p", "h": "表の街灯の明かりが、一筋だけ差しこんでいる。床の本は、ゆうべ読んだ頁のまま開いていた。"}, {"t": "p", "h": "頁の隅の小石が、角にまっすぐそろえてあった。"}, {"t": "p", "h": "奥の暗がりで、毛布がひとつ、壁のほうを向いて丸くなっていた。"}, {"t": "p", "h": "安藤は、小石をどけた。頁を両腕で持ち上げて、めくった。紙が、ゆっくり向こうへ倒れた。"}, {"t": "p", "h": "新しい頁の隅に、小石を置いた。"}, {"t": "p", "h": "少しずらした。"}, {"t": "p", "h": "もう一度、ずらした。"}, {"t": "p", "h": "三度目で、手を離した。"}, {"t": "p", "h": "暗がりから、声がした。"}, {"t": "p", "h": "「……曲がってるって」"}, {"t": "p", "h": "安藤は、答えなかった。"}, {"t": "p", "h": "小石は、曲がったままだった。"}, {"t": "opener", "i": 4, "alt": "第四章　丸くなった角"}, {"t": "p", "h": "着いてから、四十日が過ぎた。"}, {"t": "p", "h": "朝、いつもの時刻に目が覚める。行く道は、もうない。ナオ吉は、毛布の中でしばらく天井の棚板を見上げてから、起きる。"}, {"t": "p", "h": "胸に手を当てる。紙の角が、指に当たる。"}, {"t": "p", "h": "ときどき、店の表のほうで、小さな声がする。"}, {"t": "p", "h": "「おじゃまします」"}, {"t": "p", "h": "だれかが、店主の居眠りに頭を下げているらしい。足音は、棚の奥までは来ない。"}, {"t": "p", "h": "それから、床の本を見る。"}, {"t": "p", "h": "頁の隅の小石は、たいてい曲がっている。"}, {"t": "p", "h": "ナオ吉は、それをまっすぐにそろえる。夜になると、男が来て、曲げる。男が出ていくと、そろえる。夜中に戻ってきて、また曲げる。"}, {"t": "p", "h": "直した回数と、曲げられた回数は、数えてある。"}, {"t": "p", "h": "六十と、六十だった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "手紙は、まだ胸にあった。"}, {"t": "p", "h": "あの子の持ち場は、この町のどこかにある。一度、行ったことがある。"}, {"t": "p", "h": "よしゆきが、あの子を迎えに行った年だ。六人で荷車を押して、十八日かけて来た。"}, {"t": "p", "h": "けれども、あのとき道を知っていたのは、ナオ吉ではなかった。荷車の先を、ラリオが走っていた。"}, {"t": "p", "h": "<strong>道は、ラリオの足が覚えていた。</strong>"}, {"t": "p", "h": "オレの足は、覚えていない。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "十日目に、ひとりで探しに出た。"}, {"t": "p", "h": "酒屋の角まで来て、右へ行った。人間の自転車に追われて、側溝の蓋の下で半日を過ごした。"}, {"t": "p", "h": "二十日目にも出た。"}, {"t": "p", "h": "今度は、まっすぐ行った。三つ目の辻で、道がわからなくなった。"}, {"t": "p", "h": "どちらの日も、夜には棚の奥へ戻った。"}, {"t": "p", "h": "この町に十年いて、道を知っている者は、ひとりしかいない。"}, {"t": "p", "h": "その男に、訊けばいい。"}, {"t": "p", "h": "訊けなかった。"}, {"t": "p", "h": "口を開けば、あの夜の賭場の奥が、先に出てくる。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "冬が、終わりかけていた。"}, {"t": "p", "h": "霜は、朝のうちに消えるようになった。街灯の明かりが、棚板のあいだから差しこむ時刻が、少しずつ遅くなった。"}, {"t": "p", "h": "胸の紙の角が、少し丸くなっていた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "四十日目の夜、男は、いつものように頁をめくり、小石を置いた。"}, {"t": "p", "h": "少しずらした。"}, {"t": "p", "h": "もう一度、ずらした。"}, {"t": "p", "h": "三度目で、手を離した。"}, {"t": "p", "h": "ナオ吉は、毛布から出た。"}, {"t": "p", "h": "男の前まで行って、しゃがんだ。小石を、頁の角にまっすぐそろえた。"}, {"t": "p", "h": "男は、なにも言わなかった。"}, {"t": "p", "h": "ナオ吉は、小石から指を離さずに言った。"}, {"t": "p", "h": "「……あの子の持ち場は、どこだ」"}, {"t": "p", "h": "どの子か、とは訊かれなかった。"}, {"t": "p", "h": "男は、しばらく頁を見ていた。"}, {"t": "p", "h": "「酒屋の角を、左だ」"}, {"t": "p", "h": "ナオ吉の指の横から、男の手が伸びて、小石を曲げた。"}, {"t": "p", "h": "「朝は立っていない」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ナオ吉は、曲げられた小石を見た。"}, {"t": "p", "h": "直さなかった。"}, {"t": "p", "h": "毛布に戻った。"}, {"t": "p", "h": "六十一と、六十二になった。"}, {"t": "p", "h": "一つ、負け越した。"}, {"t": "opener", "i": 5, "alt": "第五章　空いた行"}, {"t": "p", "h": "四百十二日目の朝、ソラは百三枚目の手紙を、古本屋の本に挟んだ。"}, {"t": "p", "h": "「おじゃまします」"}, {"t": "p", "h": "店主は、帳場で居眠りをしていた。"}, {"t": "p", "h": "背表紙のきれいな一冊を選ぶ。頁の端のすきまに、両手で紙を押しこむ。紙の角が見えなくなるまで。"}, {"t": "p", "h": "「失礼しました」"}, {"t": "p", "h": "戸の下をくぐって外へ出ると、酒屋の角の霜は、もう消えていた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "夕方、ソラは持ち場に立った。"}, {"t": "p", "h": "「いらっしゃい! いらっしゃい!」"}, {"t": "p", "h": "隣の隙間で、コウ吉も声を張っている。"}, {"t": "p", "h": "「よかったら! よかったら!」"}, {"t": "p", "h": "「コウ吉さん。いまの方、二回目です。さっきも通りました」"}, {"t": "p", "h": "「覚えてねえよ、そんなの」"}, {"t": "p", "h": "「顔が、同じでした」"}, {"t": "p", "h": "「みんな同じ顔だろ」"}, {"t": "p", "h": "ソラは、そうは思わなかった。左手の指が、ひとりでに折れたり伸びたりしていた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "明かりの輪のふちに、だれかが立った。"}, {"t": "p", "h": "ソラは、笑顔を向けた。"}, {"t": "p", "h": "「いらっしゃ――」"}, {"t": "p", "h": "痩せた男だった。目の下に、隈がある。"}, {"t": "p", "h": "「客じゃねえ」"}, {"t": "p", "h": "男は、明かりの中へ入ってこなかった。ふちに立ったまま、ソラのほうを見ていた。"}, {"t": "p", "h": "ソラは、その顔を知っていた。前に、ヤマさんの賭場で、片方だけ靴を履いた人に掴みかかった人だった。よしゆきさんと一緒に来た、六人のひとりだった。"}, {"t": "p", "h": "ソラは、持ち場を出た。明かりの輪の外まで、歩いていった。"}, {"t": "p", "h": "「ナオ吉さん、ですよね」"}, {"t": "p", "h": "「……ああ」"}, {"t": "p", "h": "コウ吉が、木箱の陰から顔を出した。"}, {"t": "p", "h": "「ナオ吉? オレと、半分同じ名前だ」"}, {"t": "p", "h": "「半分じゃねえ」"}, {"t": "p", "h": "「じゃあ、三分の一?」"}, {"t": "p", "h": "ナオ吉は、なにか言いかけて、やめた。"}, {"t": "p", "h": "ジュン吉が、木箱の陰から身を乗り出した。"}, {"t": "p", "h": "「半分に一粒! 半分に一粒!」"}, {"t": "p", "h": "コウ吉が、腹を抱えて笑った。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ナオ吉は、胸のところに手を入れた。"}, {"t": "p", "h": "紙を一枚、取り出した。"}, {"t": "p", "h": "角が、少し丸くなっていた。"}, {"t": "p", "h": "「頼まれた」"}, {"t": "p", "h": "ソラは、両手でそれを受け取った。"}, {"t": "p", "h": "表に、米粒ほどの字で、名前が書いてあった。"}, {"t": "p", "h": "<strong>ソラへ</strong>"}, {"t": "p", "h": "ソラは、その字を知っていた。前にもらった手紙と、同じ字だった。何回も読んで、折れたところを二回貼り直した、あの手紙と。"}, {"t": "p", "h": "顔を上げると、ナオ吉は、もう背を向けていた。"}, {"t": "p", "h": "「あの」"}, {"t": "p", "h": "ナオ吉は、振り返らなかった。"}, {"t": "p", "h": "「ありがとうございます」"}, {"t": "p", "h": "歩き方が、少し速かった。"}, {"t": "p", "h": "足音が、古本屋のほうへ遠ざかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ソラは、木箱の陰に座った。明かりが、そこまでは届く。"}, {"t": "p", "h": "紙を開いた。"}, {"t": "quote", "h": "ソラへ<br><br>うろこ堂は、閉まりました。<br>ぼくたちは、三つに分かれました。<br><br>みちるの家。<br>喫茶ひだまり。<br>南町三丁目　古書つばめ堂。<br><br>ぼくは、みちるの家にいます。<br>ナオ吉が、つばめ堂にいます。<br><br>手紙を、待っています。<br><br>よしゆき"}, {"t": "sep", "h": ""}, {"t": "p", "h": "一度、読んだ。"}, {"t": "p", "h": "南町三丁目。古書つばめ堂。何度も、「おじゃまします」と言って入った店だった。"}, {"t": "p", "h": "もう一度、読んだ。"}, {"t": "p", "h": "最後の一行のところで、目が止まった。"}, {"t": "p", "h": "<strong>手紙を、待っています。</strong>"}, {"t": "p", "h": "左手の指が、止まった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "四百十二日、ソラは数えてきた。よしゆきさんの手紙が来るまで、何日目か。"}, {"t": "p", "h": "今日、来た。"}, {"t": "p", "h": "四百十二日目だった。"}, {"t": "p", "h": "よしゆきさんが書いた手紙と、同じ数だった。"}, {"t": "p", "h": "それなのに、手紙には、待っています、と書いてある。"}, {"t": "p", "h": "ソラの書いた手紙は、一枚ずつ、本に挟んできた。背表紙のきれいな、売れそうな本を選んで。売れて、運ばれて、北へ行くように。"}, {"t": "p", "h": "待っています、と書いてある。"}, {"t": "p", "h": "ソラは、紙を膝の上に置いた。"}, {"t": "p", "h": "両手を、前で組んだ。"}, {"t": "p", "h": "しばらく、そうしていた。"}, {"t": "p", "h": "それから、左手の指が、また動きだした。"}, {"t": "p", "h": "一本ずつ、ゆっくり折れていく。"}, {"t": "p", "h": "日の数では、なかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "「ソラ」"}, {"t": "p", "h": "ジュン吉が、隙間から顔を出した。"}, {"t": "p", "h": "「客、来てるよ」"}, {"t": "p", "h": "「はい」"}, {"t": "p", "h": "ソラは、紙を畳んだ。胸のところに入れた。"}, {"t": "p", "h": "立ち上がって、持ち場に戻った。"}, {"t": "p", "h": "「いらっしゃい! いらっしゃい!」"}, {"t": "p", "h": "声は、いつもと同じだった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "夜、ソラはヤマの寝床へ行った。"}, {"t": "p", "h": "ヤマは、帳面を開いて待っていた。"}, {"t": "p", "h": "「今日は」"}, {"t": "p", "h": "ソラは、そこで止まった。"}, {"t": "p", "h": "指を見た。指は、動いていなかった。"}, {"t": "p", "h": "「……何人呼んだか、わかりません」"}, {"t": "p", "h": "ヤマの手が、止まった。"}, {"t": "p", "h": "六年と、一年と少し。数を言えなかった夜は、一度もなかった。"}, {"t": "p", "h": "「へえ。数えてないんだ。めずらしくない?」"}, {"t": "p", "h": "「はい」"}, {"t": "p", "h": "ヤマは、ソラの顔を見た。まばたきを、しなかった。"}, {"t": "p", "h": "ソラの胸のところから、紙の角が少しのぞいていた。"}, {"t": "p", "h": "ヤマは、それについては、なにも訊かなかった。"}, {"t": "p", "h": "「……そうか」"}, {"t": "p", "h": "ヤマは、帳面に日付だけを書いた。人数の欄も、稼ぎの欄も、書かなかった。"}, {"t": "p", "h": "帳面を閉じた。"}, {"t": "p", "h": "「寝ろ」"}, {"t": "p", "h": "「はい」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "寝床に入って、ソラは左手を上げた。"}, {"t": "p", "h": "指を折ろうとした。"}, {"t": "p", "h": "四百十二。"}, {"t": "p", "h": "そのあとの数を、ソラは、まだ数えられなかった。"}, {"t": "p", "h": "帳面には、はじめて、空いた行ができた。"}, {"t": "opener", "i": 6, "alt": "第六章　焦げ跡"}, {"t": "p", "h": "春が来て、終わりかけていた。"}, {"t": "p", "h": "昼のあいだは、棚の奥にも少し暖かい風が入る。"}, {"t": "p", "h": "小石の勘定は、百八十と、百八十三になっていた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "昼すぎ、店主が棚の前に来た。"}, {"t": "p", "h": "ナオ吉は、棚のうしろのすきまから、それを見ていた。"}, {"t": "p", "h": "店主は、下の段から一冊を抜いた。頁の端が、茶色くなっている本だった。"}, {"t": "p", "h": "店主は、本を顔の前に持ち上げて、鼻を近づけた。"}, {"t": "p", "h": "眉が寄った。"}, {"t": "p", "h": "「……煙草か」"}, {"t": "p", "h": "店主は、自分の口の煙草を見た。"}, {"t": "p", "h": "それから、帳場の灰皿で、それを消した。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "店主は、本を抱えて、店の奥へ歩いてきた。傷んだ本は、いつも奥の隅に寄せておく。"}, {"t": "p", "h": "棚のはしを曲がるところで、手がすべった。"}, {"t": "p", "h": "本が、床に落ちて開いた。"}, {"t": "p", "h": "頁の端の茶色い焦げ跡が、並んで見えた。一枚だけではなかった。"}, {"t": "p", "h": "開いた頁のあいだから、小さなものが、ひとつ舞い上がった。"}, {"t": "p", "h": "枯れた葉のように、くるくる回りながら落ちてくる。"}, {"t": "p", "h": "ナオ吉のすぐ前の床に、それは落ちた。"}, {"t": "p", "h": "店主は、腰を押さえながら、本を拾った。"}, {"t": "p", "h": "「……腰が」"}, {"t": "p", "h": "それだけ言って、奥の隅に本を置き、帳場へ戻っていった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ナオ吉は、しばらく動かなかった。"}, {"t": "p", "h": "それから、床に落ちたものを拾った。"}, {"t": "p", "h": "紙の切れはしだった。指先ほどの大きさで、ふちが黒く焦げている。"}, {"t": "p", "h": "米粒ほどの字が、少しだけ残っていた。"}, {"t": "quote", "h": "……　ます。<br><br>ソラ"}, {"t": "p", "h": "その手前は、焦げて読めなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "夕方、ナオ吉は酒屋の角を左へ曲がった。"}, {"t": "p", "h": "明かりの輪のふちで、足を止めた。"}, {"t": "p", "h": "輪の中で声を張っていたソラが、こちらを見た。笑顔のまま、持ち場を出てきた。"}, {"t": "p", "h": "「ナオ吉さん」"}, {"t": "p", "h": "ナオ吉は、なにも言わなかった。"}, {"t": "p", "h": "手のひらを開いて、差し出した。"}, {"t": "p", "h": "ソラは、切れはしを見た。"}, {"t": "p", "h": "左手の指が、止まった。"}, {"t": "p", "h": "ソラは、両手でそれを受け取った。焦げたふちを、指でなぞった。"}, {"t": "p", "h": "「……<strong>ぼくの字です</strong>」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "明かりの輪の中から、だれかが出てきた。"}, {"t": "p", "h": "乱れた髪が、額に貼りついている。"}, {"t": "p", "h": "「おやおや」"}, {"t": "p", "h": "ヤマは、ナオ吉を見て、少し首をかしげた。"}, {"t": "p", "h": "「前に一度、お会いしましたねえ。うちの広間で。あのときは、ずいぶん元気でしたけど」"}, {"t": "p", "h": "ナオ吉は、答えなかった。"}, {"t": "p", "h": "ヤマの目が、ソラの手の中に落ちた。"}, {"t": "p", "h": "まばたきを、しなかった。"}, {"t": "p", "h": "「……ああ。それ、あれじゃない?」"}, {"t": "p", "h": "「ご存じなんですか」"}, {"t": "p", "h": "ソラが訊いた。"}, {"t": "p", "h": "「噂だよ、噂。本に挟まったもん抜いて回る男がいるって、聞いたことない?」"}, {"t": "p", "h": "「抜いて、どうするんですか」"}, {"t": "p", "h": "ヤマは、ソラの手の中の、焦げたふちを見た。"}, {"t": "p", "h": "「さあ。見たやつ、いないんだよね」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ソラは、切れはしを胸のところに入れた。"}, {"t": "p", "h": "両手を、前で組んだ。"}, {"t": "p", "h": "「ありがとうございました、ナオ吉さん」"}, {"t": "p", "h": "声は、いつもと同じだった。"}, {"t": "p", "h": "ソラは、持ち場へ戻っていった。"}, {"t": "p", "h": "「いらっしゃい! いらっしゃい!」"}, {"t": "p", "h": "ナオ吉は、右の手を握った。"}, {"t": "p", "h": "背を向けた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "棚の奥は、暗かった。"}, {"t": "p", "h": "街灯の明かりが、一筋差しこんでいる。"}, {"t": "p", "h": "ナオ吉は、毛布の上に座って、棚のほうを見た。"}, {"t": "p", "h": "この店に、本は何冊あるのだろう。"}, {"t": "p", "h": "どの本の、どの頁に、何枚。"}, {"t": "p", "h": "<strong>数えられる数では、なかった。</strong>"}, {"t": "opener", "i": 7, "alt": "第七章　黒いすじ"}, {"t": "p", "h": "夏になった。"}, {"t": "p", "h": "木箱の隙間の奥は、夜になっても、昼の熱が抜けなかった。"}, {"t": "p", "h": "「今日は、三十一人、呼びました」"}, {"t": "p", "h": "「はいはい」"}, {"t": "p", "h": "「稼ぎは、六粒です。ジュン吉さんが一粒、コウ吉さんが二粒です」"}, {"t": "p", "h": "ヤマは、それを帳面に書いた。"}, {"t": "p", "h": "ソラが数を言えなかった夜は、あの一晩だけだった。次の夜からは、また言えた。帳面には、空いた行が一つだけ残っている。"}, {"t": "p", "h": "ヤマは、帳面を閉じかけた。"}, {"t": "p", "h": "「ヤマさん」"}, {"t": "p", "h": "「なに?」"}, {"t": "p", "h": "「ぼく、百三枚、書きました」"}, {"t": "p", "h": "ヤマの手が、止まった。"}, {"t": "p", "h": "「……知ってるよ。ずっと聞いてたからね? 九十三、九十四、九十五って」"}, {"t": "p", "h": "「はい」"}, {"t": "p", "h": "「で、四百十二日目から、一枚も書いてないんだよね?」"}, {"t": "p", "h": "「紙が、ありません」"}, {"t": "p", "h": "「それ、嘘じゃない? 酒屋の角に、値札の切れはし、いくらでも落ちてるよね」"}, {"t": "p", "h": "ソラは、答えなかった。"}, {"t": "p", "h": "両手を、前で組んだ。"}, {"t": "p", "h": "「……書いても、燃やされます」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ヤマは、しばらく黙っていた。"}, {"t": "p", "h": "それから、帳面をもう一度開いた。いちばんうしろの、まだなにも書いていない頁を、指でつまんだ。"}, {"t": "p", "h": "破った。"}, {"t": "p", "h": "乾いた音がした。"}, {"t": "p", "h": "ヤマは、それをソラの前に置いた。"}, {"t": "p", "h": "「値札の裏より、ましじゃない?」"}, {"t": "p", "h": "ソラは、白い紙を見た。"}, {"t": "p", "h": "「これは、ヤマさんの帳面です」"}, {"t": "p", "h": "「知ってる」"}, {"t": "p", "h": "ヤマは、ソラの顔を見た。まばたきを、しなかった。"}, {"t": "p", "h": "「<strong>今日も、止めません</strong>」"}, {"t": "p", "h": "ソラは、顔を上げた。"}, {"t": "p", "h": "ヤマの言葉が、客の前に立つときの言葉になっていた。二人きりのときに、ヤマがその言葉を使うのを、ソラは聞いたことがなかった。"}, {"t": "p", "h": "「……はい」"}, {"t": "p", "h": "ヤマは、帳面を閉じた。"}, {"t": "p", "h": "「寝なよ。明日も早いんだよね?」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "その夜、ソラは白い紙に字を書いた。"}, {"t": "p", "h": "米粒ほどの字で、いつもと同じことを。"}, {"t": "p", "h": "百四枚目である。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "朝、ソラは古本屋の戸の下をくぐった。"}, {"t": "p", "h": "「おじゃまします」"}, {"t": "p", "h": "店主は、帳場で居眠りをしていた。"}, {"t": "p", "h": "棚の下の段の前に、だれかいた。"}, {"t": "p", "h": "小さき者だった。少し長い髪が、うつむいた顔にまっすぐかかっている。"}, {"t": "p", "h": "隣の賭場の胴元だった。客たちが、地獄の門番と呼んでいる男だ。"}, {"t": "p", "h": "男は、一冊の本の頁の端から、紙を一枚、抜き出したところだった。"}, {"t": "p", "h": "値札の切れはしだった。"}, {"t": "p", "h": "裏に、米粒ほどの字が見えた。"}, {"t": "p", "h": "ソラの左手の指が、止まった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "男は、紙を棚板の上に置いた。"}, {"t": "p", "h": "小さなマッチの軸を擦った。火が、紙の端に移った。"}, {"t": "p", "h": "紙は、すぐに縮んで、黒くなった。"}, {"t": "p", "h": "男は、それを見ていた。ひとつも、急がなかった。"}, {"t": "p", "h": "火が消えた。"}, {"t": "p", "h": "男は、灰を見下ろして、小さく言った。"}, {"t": "p", "h": "「……残すな」"}, {"t": "p", "h": "ソラは、男のそばまで歩いていった。"}, {"t": "p", "h": "頭を下げた。"}, {"t": "p", "h": "「おはようございます」"}, {"t": "p", "h": "男の手が、止まった。"}, {"t": "p", "h": "男が、顔を上げた。髪のあいだで、目が細くなった。"}, {"t": "p", "h": "しばらく、ソラを見ていた。"}, {"t": "p", "h": "「……おう」"}, {"t": "p", "h": "それだけ言って、また顔を伏せた。"}, {"t": "p", "h": "棚板の上の灰を、手のひらで払い落とした。"}, {"t": "p", "h": "男は、戸のほうへ歩いていった。一度も、振り返らなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "棚板の上に、黒いすじが残っていた。"}, {"t": "p", "h": "ソラは、それをしばらく見ていた。"}, {"t": "p", "h": "それから、胸のところから、白い紙を出した。"}, {"t": "p", "h": "同じ本の、同じ頁の端に、両手で押しこんだ。紙の角が見えなくなるまで。"}, {"t": "p", "h": "「失礼しました」"}, {"t": "p", "h": "店主は、まだ眠っていた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "その夜から、ソラは毎晩、書くようになった。"}, {"t": "p", "h": "紙が手に入った日だけ書いていたころより、ずっと多く。"}, {"t": "p", "h": "<strong>ヤマの帳面は、一枚ずつ、薄くなっていった。</strong>"}, {"t": "opener", "i": 8, "alt": "第八章　薄いかかと"}, {"t": "p", "h": "秋の終わりだった。"}, {"t": "p", "h": "酒屋の裏へ向かう道で、安藤は足を止めた。"}, {"t": "p", "h": "左の足の裏に、砂利の角が当たっていた。"}, {"t": "p", "h": "安藤は、しゃがんで、靴を脱いだ。"}, {"t": "p", "h": "底を、街灯の明かりにかざした。"}, {"t": "p", "h": "かかとの革が、薄くなっていた。明かりが、うっすら透けて見えた。"}, {"t": "p", "h": "安藤は、しばらく底を見ていた。"}, {"t": "p", "h": "それから、靴を履き直して、歩きだした。左の足を、少しだけ浮かせるようにして。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "賭場の客は、三人だった。"}, {"t": "p", "h": "安藤は、いつもの隅に座った。"}, {"t": "p", "h": "「おい、見ろよ」"}, {"t": "p", "h": "向かいの客が、安藤の足もとをあごで指した。"}, {"t": "p", "h": "「片方しかねえ靴が、そろそろ半分になるぞ」"}, {"t": "p", "h": "隣の客が笑った。"}, {"t": "p", "h": "「そしたら、両足とも素足だ。そろってて、いいじゃねえか」"}, {"t": "p", "h": "「そういや、聞いたか」"}, {"t": "p", "h": "向かいの客が、声を落とした。"}, {"t": "p", "h": "「本に挟まったもんを抜いて、燃やして回る男がいるって噂」"}, {"t": "p", "h": "「ヤマんとこの与太話だろ」"}, {"t": "p", "h": "「でもよ、残すな、って言うじゃねえか。この辺の年寄りは、みんな」"}, {"t": "p", "h": "「言うな。紙切れ一枚、跡一つ、残すな。人間に見つかる」"}, {"t": "p", "h": "マヨの手が、札の上で止まった。顔は、上げなかった。"}, {"t": "p", "h": "「……あれを言いだしたやつが、いた」"}, {"t": "p", "h": "客が、マヨを見た。"}, {"t": "p", "h": "「十年より前だ。名乗らねえ客だった」"}, {"t": "p", "h": "「どんなやつだ」"}, {"t": "p", "h": "「帰りぎわに、かならず一度、足もとを見た」"}, {"t": "p", "h": "「足もと?」"}, {"t": "p", "h": "マヨは、それには答えなかった。札を一枚、すべらせた。"}, {"t": "p", "h": "「口をきくのは、一つだけだった。残すな、だ」"}, {"t": "p", "h": "客たちは、顔を見合わせた。"}, {"t": "p", "h": "「……なんだ。年寄りの決まり文句かと思ってた」"}, {"t": "p", "h": "マヨは、もう一枚、すべらせた。"}, {"t": "p", "h": "「賭場には来なくなったが、町では、ときどき見た。最後に見たのは、去年の秋だ。線路のほうへ、北へ歩いていった」"}, {"t": "p", "h": "それきり、だれもその話をしなかった。"}, {"t": "p", "h": "安藤は、台の下の、自分の足もとを見た。"}, {"t": "p", "h": "片方は靴で、片方は素足だった。"}, {"t": "p", "h": "安藤は、砂糖粒を二つ置いた。"}, {"t": "p", "h": "札をめくる。はずれ。"}, {"t": "p", "h": "マヨは、顔を上げなかった。札を配りながら、言った。"}, {"t": "p", "h": "「今年も、三十六日か」"}, {"t": "p", "h": "安藤は、答えなかった。"}, {"t": "p", "h": "台の下で、左の足のつま先が、床を二度叩いた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "夜更けに、安藤は古本屋の棚の奥へ入った。"}, {"t": "p", "h": "街灯の明かりが、一筋差しこんでいる。床の本は、ゆうべの頁のまま開いていた。小石は、曲がっていなかった。角に、まっすぐそろえてある。"}, {"t": "p", "h": "奥の暗がりで、毛布がひとつ、壁のほうを向いて丸くなっていた。"}, {"t": "p", "h": "毛布の手前に、縫い物の道具が置いてあった。"}, {"t": "p", "h": "針が一本。糸が少し。布のはぎれが何枚か。子どもの上着のようなものが、半分縫いかけで畳んであった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "安藤は、左の靴を脱いだ。"}, {"t": "p", "h": "縫い物の道具の前に座った。"}, {"t": "p", "h": "針を取った。糸の端を、口にくわえて湿らせた。"}, {"t": "p", "h": "針の穴に、通そうとした。"}, {"t": "p", "h": "通らなかった。"}, {"t": "p", "h": "もう一度。"}, {"t": "p", "h": "通らなかった。"}, {"t": "p", "h": "街灯の明かりが、棚板のあいだを、ゆっくり動いていく。"}, {"t": "p", "h": "安藤は、針を持ったまま、手を下ろした。"}, {"t": "p", "h": "明かりは、一筋ぶん、横へ動いていた。"}, {"t": "p", "h": "糸は、まだ針の外にあった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "安藤は、針を元の場所に戻した。糸も戻した。置いてあったとおりの向きに。"}, {"t": "p", "h": "それから、左の靴を、縫い物の道具のわきに置いた。"}, {"t": "p", "h": "少しずらした。"}, {"t": "p", "h": "もう一度、ずらした。"}, {"t": "p", "h": "三度目で、手を離した。"}, {"t": "p", "h": "四度目に、手が伸びかけた。"}, {"t": "p", "h": "止まった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "安藤は、床の本の前に戻った。"}, {"t": "p", "h": "素足の左の足と、素足の右の足を、そろえて座った。"}, {"t": "p", "h": "頁を、両腕で持ち上げて、めくった。紙が、ゆっくり向こうへ倒れた。"}, {"t": "p", "h": "新しい頁の隅に、小石を置いた。"}, {"t": "p", "h": "角に、まっすぐ。"}, {"t": "p", "h": "<strong>ずらさなかった。</strong>"}, {"t": "opener", "i": 9, "alt": "第九章　粗い針目"}, {"t": "p", "h": "初冬の朝だった。"}, {"t": "p", "h": "いつもの時刻に、ナオ吉は目を覚ました。"}, {"t": "p", "h": "毛布から顔を出して、床の本を見た。"}, {"t": "p", "h": "頁の隅の小石は、角にまっすぐそろっていた。"}, {"t": "p", "h": "ナオ吉は、しばらくそれを見ていた。"}, {"t": "p", "h": "ゆうべ、男が来て、頁をめくった。いつもなら、小石は曲がっている。"}, {"t": "p", "h": "曲がっていなかった。"}, {"t": "p", "h": "勘定は、そこで止まった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "それから、縫い物の道具のほうを見た。"}, {"t": "p", "h": "針と糸とはぎれの横に、靴が一つ置いてあった。"}, {"t": "p", "h": "左の靴だった。"}, {"t": "p", "h": "甲の縫い目は、粗かった。針目の幅がそろっていない。糸を引きすぎたところが、革にしわを寄せている。"}, {"t": "p", "h": "ナオ吉は、その靴を知っていた。"}, {"t": "p", "h": "片方だけの靴を、ナオ吉は北の道で何年も直してきた。つま先の向きを直し、埃を払い、縫い目のほつれを見た。直してきたのは、右のほうだ。"}, {"t": "p", "h": "これは、その片割れだった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "床の本の前に、男が座っていた。"}, {"t": "p", "h": "両足とも、素足だった。"}, {"t": "p", "h": "ゆうべから、ここを出ていないらしかった。頁は、ゆうべの一枚から進んでいなかった。"}, {"t": "p", "h": "男が朝まで棚の奥にいるのは、はじめてだった。"}, {"t": "p", "h": "ナオ吉は、靴を指さした。"}, {"t": "p", "h": "「なんだ、これ」"}, {"t": "p", "h": "男は、ナオ吉のほうを向いた。姿勢は、いつものようによかった。"}, {"t": "p", "h": "「縫ってくれ」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ナオ吉は、拳を握った。"}, {"t": "p", "h": "指の関節が、白くなった。"}, {"t": "p", "h": "天井の棚板を、見上げた。"}, {"t": "p", "h": "棚板の木目が、暗がりに細く走っていた。"}, {"t": "p", "h": "粉の夜のことを、思い出した。"}, {"t": "p", "h": "賭場の奥で、粉の包みが、ラリオのほうへ滑らされた。ナオ吉は、その場にいた。見ていた。何もしなかった。"}, {"t": "p", "h": "あの夜から、ナオ吉の手は、何もしなかったことを覚えている。"}, {"t": "p", "h": "もう一つ、覚えていることがある。"}, {"t": "p", "h": "この町に来てから、一度も賭けていない。明かりの輪のふちまでは、行った。輪の中には、入らなかった。"}, {"t": "p", "h": "手が、空いていた。"}, {"t": "p", "h": "空いた手は、いつか、あの輪の中へ伸びる。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ナオ吉は、棚板から目を下ろした。"}, {"t": "p", "h": "靴を拾った。"}, {"t": "p", "h": "裏を返した。かかとの革が、薄くなっていた。穴になる、手前だった。"}, {"t": "p", "h": "甲の縫い目を、指でなぞった。"}, {"t": "p", "h": "「……へたくそだな」"}, {"t": "p", "h": "「知ってる」"}, {"t": "p", "h": "男は、そう言っただけだった。"}, {"t": "p", "h": "ナオ吉は、縫い目をもう一度なぞった。"}, {"t": "p", "h": "北の道で、はじめてあの右の靴を拾った夜のことを思い出した。"}, {"t": "p", "h": "甲のところに、縫い直した跡が、<strong>横に三本</strong>あった。"}, {"t": "p", "h": "ナオ吉の縫い方だった。だれにも教えたことのない縫い方だった。"}, {"t": "p", "h": "ナオ吉が縫ったのではなかった。"}, {"t": "p", "h": "許しを訊かれたことは、一度もなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ナオ吉は、靴を膝に置いた。"}, {"t": "p", "h": "「……横に三本で、いいか」"}, {"t": "p", "h": "男は、少し黙った。"}, {"t": "p", "h": "「ほかの縫い方を、知らない」"}, {"t": "p", "h": "ナオ吉は、靴を見た。"}, {"t": "p", "h": "それから、男を見た。"}, {"t": "p", "h": "「縫ってやる」"}, {"t": "p", "h": "男は、動かなかった。"}, {"t": "p", "h": "「<strong>許したわけじゃねえ</strong>」"}, {"t": "p", "h": "「……そうか」"}, {"t": "p", "h": "男の動きが、止まった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "男は、それから、腰の袋に手を入れた。"}, {"t": "p", "h": "革の切れはしを一枚、取り出した。人間の手袋の、指のところを切ったものだった。"}, {"t": "p", "h": "「これを、使ってくれ」"}, {"t": "p", "h": "男は、切れはしを、ナオ吉の縫い物の道具のわきに置いた。"}, {"t": "p", "h": "少しずらした。"}, {"t": "p", "h": "もう一度、ずらそうとした。"}, {"t": "p", "h": "「動かすな」"}, {"t": "p", "h": "男の手が、止まった。"}, {"t": "p", "h": "引っこんだ。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ナオ吉は、針を取った。"}, {"t": "p", "h": "糸の端を、口にくわえて湿らせた。指先で、よじった。"}, {"t": "p", "h": "針の穴を、街灯の明かりにかざした。"}, {"t": "p", "h": "男が、それを見ていた。"}, {"t": "p", "h": "「……見てんじゃねえ」"}, {"t": "p", "h": "男は、壁のほうを向いた。"}, {"t": "p", "h": "姿勢だけが、あいかわらずよかった。"}, {"t": "p", "h": "ナオ吉は、針の穴に糸を向けた。"}, {"t": "p", "h": "糸は、一度で、針の穴を通った。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "縫うのに、三日かかった。"}, {"t": "p", "h": "かかとの薄いところに、手袋の革を当てる。まわりを細かく縫いとめる。それから、甲へ。横に三本。糸を渡して、上から押さえる。"}, {"t": "p", "h": "男は、三晩とも、夜更けに来た。壁のほうを向いて座り、明け方になると、酒屋の裏へ帰っていった。床の本は、開いたままだった。頁は、一枚もめくられなかった。"}, {"t": "p", "h": "小石は、まっすぐなままだった。"}, {"t": "p", "h": "三日目の夜、ナオ吉は玉を結んで、糸を切った。"}, {"t": "p", "h": "靴を、床に置いた。"}, {"t": "p", "h": "つま先の向きを、直した。北の道で、毎朝そうしてきたように。"}, {"t": "p", "h": "「……できたぞ」"}, {"t": "p", "h": "男が、振り向いた。靴を見た。"}, {"t": "p", "h": "しばらく、見ていた。"}, {"t": "p", "h": "手が、靴のほうへ伸びかけた。"}, {"t": "p", "h": "「置き直すなよ」"}, {"t": "p", "h": "男の手が、膝に戻った。"}, {"t": "p", "h": "つま先は、北を向いていた。"}, {"t": "opener", "i": 10, "alt": "第十章　背表紙"}, {"t": "p", "h": "初冬の夜、ヤマは帳面のいちばんうしろをめくった。"}, {"t": "p", "h": "白い頁は、あと一枚だった。"}, {"t": "p", "h": "ヤマは、それを破って、ソラの前に置いた。"}, {"t": "p", "h": "「これで最後だよね? 帳面のほうが先に、なくなっちゃったじゃない」"}, {"t": "p", "h": "「はい」"}, {"t": "p", "h": "「で、明日からどうするの? 値札の裏に戻る?」"}, {"t": "p", "h": "ソラは、答えなかった。"}, {"t": "p", "h": "両手を、前で組んだ。"}, {"t": "p", "h": "「……まあ、いいけどね」"}, {"t": "p", "h": "ヤマは、背表紙だけになった帳面を、木箱の上に置いた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "次の日の夕方、持ち場に立つと、コウ吉とジュン吉が、隣の隙間から出てきた。"}, {"t": "p", "h": "二人とも、手を握っていた。"}, {"t": "p", "h": "「ソラ。よかったら」"}, {"t": "p", "h": "コウ吉が、握った手をソラの前に突き出した。"}, {"t": "p", "h": "「よかったら、なんですか」"}, {"t": "p", "h": "「よかったら、よかったら」"}, {"t": "p", "h": "コウ吉は、それしか言わなかった。"}, {"t": "p", "h": "ジュン吉が、横から手を突き出した。"}, {"t": "p", "h": "「張る! ソラの手紙が、届くほうに!」"}, {"t": "p", "h": "二人の手が、開いた。"}, {"t": "p", "h": "砂糖粒が、ソラの手のひらにこぼれ落ちた。"}, {"t": "p", "h": "「紙、買えるじゃん。酒屋の裏のじいさん、売ってるし」"}, {"t": "p", "h": "「全部です! 今日の分、全部張りました! もう無理です!」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ソラの左手の指が、動きかけた。"}, {"t": "p", "h": "粒の数を、数えようとした。"}, {"t": "p", "h": "指は、一本だけ折れて、止まった。"}, {"t": "p", "h": "ソラは、それ以上数えなかった。"}, {"t": "p", "h": "手のひらを閉じた。"}, {"t": "p", "h": "「……はい」"}, {"t": "p", "h": "コウ吉は、頭のうしろで手を組んだ。"}, {"t": "p", "h": "「礼は、いらねえからな」"}, {"t": "p", "h": "ジュン吉が、隙間へ戻りながら振り返った。"}, {"t": "p", "h": "「届いたら、倍にして返してもらいます!」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "その夜、明かりの輪のふちに、ナオ吉が立った。"}, {"t": "p", "h": "ソラは、持ち場を出て、輪の外まで行った。"}, {"t": "p", "h": "「あいつが、北へ行く」"}, {"t": "p", "h": "ナオ吉は、それだけ言った。"}, {"t": "p", "h": "ソラは、その「あいつ」がだれかを知っていた。ナオ吉が掴みかかった、片方だけ靴を履いた人だ。"}, {"t": "p", "h": "冬になると、あの人が北へ歩いていくことは、この辺りの子なら、だれでも知っていた。"}, {"t": "p", "h": "「三日後だ」"}, {"t": "p", "h": "ソラは、しばらく黙っていた。"}, {"t": "p", "h": "「……手紙、頼めますか」"}, {"t": "p", "h": "「自分で渡せ」"}, {"t": "p", "h": "ナオ吉は、背を向けた。"}, {"t": "p", "h": "「夜なら、棚の奥にいる」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ソラは、ヤマの帳面の最後の一枚に、字を書いた。"}, {"t": "p", "h": "米粒ほどの字で、言葉のあいだを空けて。"}, {"t": "quote", "h": "よしゆき　さんへ<br><br>てがみ　よみました。なんかいも。<br><br>もやすひとが　います。<br>でも　ぼくは　かきます。<br><br>ぼくも　まって　います。<br><br>ソラ"}, {"t": "sep", "h": ""}, {"t": "p", "h": "次の夜、店が閉まってから、ソラは古本屋の戸の下をくぐった。"}, {"t": "p", "h": "「おじゃまします」"}, {"t": "p", "h": "帳場には、だれもいなかった。"}, {"t": "p", "h": "ソラは、いつもの下の段の前を通りすぎた。棚のあいだを、奥へ歩いた。"}, {"t": "p", "h": "毎朝入っていた店なのに、ここから先へ来たことは、一度もなかった。"}, {"t": "p", "h": "いちばん奥の棚のうしろに、すきまがあった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "暗がりに、二人いた。"}, {"t": "p", "h": "床に開いた本の前に、姿勢のいい男が座っていた。その奥で、ナオ吉が毛布を広げていた。"}, {"t": "p", "h": "男の足もとに、左の靴があった。かかとに、新しい革が当ててある。甲には、縫い目が横に三本。"}, {"t": "p", "h": "壁に、細い線が並んでいるのが見えた。"}, {"t": "p", "h": "ソラは、男の前まで行って、頭を下げた。"}, {"t": "p", "h": "胸のところから、紙を出した。両手で、差し出した。"}, {"t": "p", "h": "「北へ、お願いします」"}, {"t": "p", "h": "男は、紙を見た。"}, {"t": "p", "h": "それから、手のひらで、受け取った。"}, {"t": "p", "h": "腰の袋の口を開けて、紙を中にしまった。しまったあと、袋の口を一度だけ押さえた。"}, {"t": "p", "h": "「……預かる」"}, {"t": "p", "h": "ソラは、もう一度、頭を下げた。"}, {"t": "p", "h": "「失礼しました」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "戸の下をくぐって外へ出ると、酒屋の角に、白い霜が降りはじめていた。"}, {"t": "p", "h": "ソラは、胸のところに手を当てた。"}, {"t": "p", "h": "紙は、もうなかった。"}, {"t": "p", "h": "<strong>はじめて、手で渡した手紙だった。</strong>"}, {"t": "opener", "i": 11, "alt": "終章　壁の線"}, {"t": "p", "h": "男が北へ発つ日の朝だった。"}, {"t": "p", "h": "いつもの時刻に、ナオ吉は目を覚ました。"}, {"t": "p", "h": "表の戸のガラス越しに、低い冬の日が差しこんでいた。街灯の明かりとは、ちがう向きだった。棚板のあいだを抜けて、奥の壁まで届いている。"}, {"t": "p", "h": "壁に、細い線が並んでいた。"}, {"t": "p", "h": "着いた晩から、そこにあるのは知っていた。引っかいたような傷だと思っていた。"}, {"t": "p", "h": "日の光の中で見ると、傷ではなかった。"}, {"t": "p", "h": "床から、同じくらいの高さのところに、横に一本ずつ。刃物の先か、釘の先で、ていねいに引いてある。"}, {"t": "p", "h": "線の下に、米粒ほどの字があった。"}, {"t": "p", "h": "名前だった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ナオ吉は、線を数えた。"}, {"t": "p", "h": "一本。二本。三本。"}, {"t": "p", "h": "数えるのは、じいさんの役目だった。ここには、じいさんがいない。"}, {"t": "p", "h": "十本。十五本。"}, {"t": "p", "h": "十八本目の下にも、名前があった。"}, {"t": "p", "h": "その隣に、もう一本、線があった。"}, {"t": "p", "h": "線の下は、空いていた。名前が書かれるはずの場所だけ、そのまま残してある。"}, {"t": "p", "h": "<strong>十九本だった。</strong>"}, {"t": "sep", "h": ""}, {"t": "p", "h": "ナオ吉は、しゃがんだまま、動かなかった。"}, {"t": "p", "h": "うろこ堂が閉まる少し前の夜のことを、思い出した。坂の途中で、ネネが話していた。"}, {"t": "p", "h": "若い衆が十九人、出ていった。全員、おんなじ道から。南だよ。"}, {"t": "p", "h": "便りは、一度も来なかった。"}, {"t": "p", "h": "あのとき、ナオ吉は坂の下のほうにいた。聞いていた。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "いちばん端の線の下の壁に、細い割れ目があった。"}, {"t": "p", "h": "割れ目の奥に、白いものが見えた。"}, {"t": "p", "h": "ナオ吉は、指を入れた。"}, {"t": "p", "h": "紙だった。小さく畳んである。角は、湿気を吸って丸くなっていた。"}, {"t": "p", "h": "広げた。"}, {"t": "quote", "h": "村の皆へ<br><br>南に着いた。<br>十八人、皆、達者だ。<br>春になったら、また便りを出す。"}, {"t": "p", "h": "その下に、名前が並んでいた。"}, {"t": "p", "h": "一つずつ、数えた。"}, {"t": "p", "h": "十八だった。"}, {"t": "p", "h": "壁の線は、十九本だった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "うしろで、床の本の頁がめくれる音がした。"}, {"t": "p", "h": "男は、もう来ていた。夜明け前に、酒屋の裏から来たらしかった。左の靴を履き、右の足は素足のまま、姿勢よく座っていた。腰の袋が、少しふくらんでいた。"}, {"t": "p", "h": "ナオ吉は、立ち上がった。"}, {"t": "p", "h": "男の前まで行った。"}, {"t": "p", "h": "畳み直した紙を、差し出した。"}, {"t": "p", "h": "「これも、持ってけ」"}, {"t": "p", "h": "男は、紙を見た。"}, {"t": "p", "h": "ナオ吉の顔は、見なかった。"}, {"t": "p", "h": "手のひらで、受け取った。"}, {"t": "p", "h": "腰の袋の口を開けた。中に、もう一枚、紙が入っていた。ソラの字の紙だった。"}, {"t": "p", "h": "男は、二枚を重ねて、袋の中にしまった。"}, {"t": "p", "h": "袋の口を、一度だけ押さえた。"}, {"t": "p", "h": "「……届け先は、ラリオが知ってる」"}, {"t": "p", "h": "男が、ナオ吉の顔を見た。"}, {"t": "p", "h": "「裏口の坂で、待ってろ。毎朝、荷車で通る」"}, {"t": "sep", "h": ""}, {"t": "p", "h": "男は、床の本の前に戻った。"}, {"t": "p", "h": "頁の隅に、小石を置いた。"}, {"t": "p", "h": "少しずらした。"}, {"t": "p", "h": "もう一度、ずらした。"}, {"t": "p", "h": "三度目で、手を離した。"}, {"t": "p", "h": "小石は、曲がっていた。"}, {"t": "p", "h": "男は、立ち上がった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "棚のすきまの出口で、男は足を止めた。"}, {"t": "p", "h": "ナオ吉は、そのうしろに立っていた。"}, {"t": "p", "h": "言うことは、なかった。"}, {"t": "p", "h": "言うことがないまま、声が出た。"}, {"t": "p", "h": "「ナオ吉だ」"}, {"t": "p", "h": "男は、振り返らなかった。"}, {"t": "p", "h": "「……あんたの靴を、縫ってた」"}, {"t": "p", "h": "走り屋だったころ、この男の靴を三度、直したことがある。胴元の靴だった。"}, {"t": "p", "h": "それから、いま男が履いている、左の靴を。"}, {"t": "p", "h": "男は、しばらく動かなかった。"}, {"t": "p", "h": "「……安藤直之」"}, {"t": "p", "h": "男は、名乗った。"}, {"t": "p", "h": "ナオ吉は、なにも返さなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "男は、戸の下をくぐって、外へ出た。"}, {"t": "p", "h": "ナオ吉は、戸のすきまから、それを見ていた。"}, {"t": "p", "h": "酒屋の角の霜の上に、跡が続いていく。"}, {"t": "p", "h": "片方は、靴の跡だった。"}, {"t": "p", "h": "もう片方は、素足の跡だった。"}, {"t": "p", "h": "かかとの跡のふちに、細かい縫い目の筋が、小さく残っていた。"}, {"t": "p", "h": "角を曲がるとき、男は一度だけ、振り返った。"}, {"t": "p", "h": "それから、見えなくなった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "十八日目の朝、ナオ吉は、いつもの時刻に目を覚ました。"}, {"t": "p", "h": "棚の奥に、低い冬の日が差しこんでいた。"}, {"t": "p", "h": "壁の十九本の線が、日の中に並んでいた。一本だけ、名前のない線があった。"}, {"t": "p", "h": "床の本の前に、しゃがんだ。"}, {"t": "p", "h": "頁の隅に、小石がある。男が最後に置いたまま、十八日、曲がっていた。"}, {"t": "p", "h": "手を伸ばしかけて、止めた。"}, {"t": "p", "h": "今日も、直さなかった。"}, {"t": "sep", "h": ""}, {"t": "p", "h": "同じ朝、安藤は北の町に着いた。"}, {"t": "p", "h": "うろこ堂の裏口の坂は、霜で白かった。戸は、閉まっていた。戸の前の貼り紙は、雨に打たれて、端がめくれていた。"}, {"t": "p", "h": "安藤は、坂の下に腰を下ろした。腰の袋の口を、一度だけ押さえた。"}, {"t": "p", "h": "荷車の音は、まだしなかった。"}, {"t": "p", "h": "安藤は、坂を見上げた。"}, {"t": "p", "h": "霜の上に、足跡があった。"}, {"t": "p", "h": "裏口の戸の前から、坂の下へ。一人分の、小さき者の足跡だった。"}, {"t": "p", "h": "坂の半ばで、足跡は向きを変えていた。つま先が、坂の上を向いている。そこで一度、振り返ったらしかった。"}, {"t": "p", "h": "その先に、足跡はなかった。坂の下までの霜が、そこだけ平らだった。指でなでつけたような、細い筋が残っていた。"}, {"t": "p", "h": "<strong>跡は、そこで消されていた。</strong>"}, {"t": "p", "h": "安藤は、しゃがんで、筋に触れた。霜は、まだ崩れていなかった。"}, {"t": "p", "h": "安藤は、自分の足もとを見た。"}, {"t": "p", "h": "片方は靴の跡で、片方は素足の跡だった。"}, {"t": "p", "h": "坂の上のほうで、車輪の音がした。"}, {"t": "p", "h": "からから、からから。"}, {"t": "end", "h": "了"}], "chapters": [{"title": "序章　凍った足跡", "b": 0}, {"title": "第一章　引っかき傷", "b": 56}, {"title": "第二章　なくなった欄", "b": 112}, {"title": "第三章　曲がった小石", "b": 176}, {"title": "第四章　丸くなった角", "b": 234}, {"title": "第五章　空いた行", "b": 288}, {"title": "第六章　焦げ跡", "b": 398}, {"title": "第七章　黒いすじ", "b": 472}, {"title": "第八章　薄いかかと", "b": 554}, {"title": "第九章　粗い針目", "b": 632}, {"title": "第十章　背表紙", "b": 731}, {"title": "終章　壁の線", "b": 810}]};

      s += `<g class="fp" id="fp${i}"><ellipse cx="${(x+3.4).toFixed(1)}" cy="${y}" rx="4.2" ry="3.1"/><ellipse cx="${(x-3.4).toFixed(1)}" cy="${y}" rx="2.5" ry="2.3"/></g>`;
    }
    for(let i=0;i<DATA.chapters.length;i++){
      s += `<line class="ct" id="ct${i}" x1="0" y1="23.2" x2="0" y2="26" style="display:none"/>`;
    }
    s += '<g id="finalmark" style="display:none"></g><g id="mark" style="display:none"></g>';
  } else if(MOTIF==='route'){
    s += '<line class="rulerline" x1="8" y1="20" x2="292" y2="20" stroke-dasharray="5 5"/>';
    for(let i=0;i<=5;i++){
      const x = 8 + (284*i/5);
      s += `<circle cx="${x}" cy="20" r="2.2" fill="none" stroke="#5c5343" stroke-width="1"/>`;
    }
    s += '<g id="finalmark"><circle cx="292" cy="20" r="4.4" fill="#a8402c"/></g>';
    s += '<g id="mark" transform="translate(8,0)"><circle cx="0" cy="20" r="3.4" fill="#4d5157"/></g>';
  } else {
    s += '<line class="rulerline" x1="8" y1="20" x2="292" y2="20"/>';
    for(let i=0;i<=10;i++){
      const x = 8 + (284*i/10), big = (i===0||i===10);
      s += `<line class="tick${big?'':' mm'}" x1="${x}" y1="${big?9:14}" x2="${x}" y2="20"/>`;
    }
    s += '<g id="finalmark"><line x1="292" y1="4" x2="292" y2="24"/></g>';
    s += '<g id="mark" transform="translate(8,0)"><line x1="0" y1="6" x2="0" y2="24"/></g>';
  }
  svg.innerHTML = s;
})();


/* ---------- しおり ---------- */
const BM_KEY = 'shiori:' + DATA.title;
DATA.blocks.forEach((b,i)=>{ b.src=i; });
let bm = null;
try{ const v = localStorage.getItem(BM_KEY); bm = v ? JSON.parse(v) : null; }catch(e){ bm = null; }
function saveBm(){ try{ if(bm) localStorage.setItem(BM_KEY, JSON.stringify(bm)); else localStorage.removeItem(BM_KEY); }catch(e){} }
function anchorOf(p){
  const pg = pages[p]; if(!pg) return null;
  for(const b of pg){ if(b && b.src!=null) return {s:b.src, p:b.part||0}; }
  if(pg[0] && pg[0].t==='toc') return {toc:true};
  return null;
}
function pageOfAnchor(a){
  if(!a) return -1;
  if(a.toc) return pages.findIndex(pg=>pg[0] && pg[0].t==='toc');
  for(let p=1;p<pages.length;p++) for(const b of pages[p]) if(b && b.src===a.s && (b.part||0)>=a.p) return p;
  for(let p=1;p<pages.length;p++) for(const b of pages[p]) if(b && b.src!=null && b.src>=a.s) return p;
  return -1;
}
function visiblePages(){ return (spread && idx>0) ? [idx, idx+1] : [idx]; }
function toggleBm(){
  const bp = pageOfAnchor(bm), vis = visiblePages();
  if(bm && vis.indexOf(bp)>=0){ bm = null; }
  else { const a = anchorOf(idx); if(!a) return; bm = a; }
  saveBm(); update(0);
}
function goBm(){ const p = pageOfAnchor(bm); if(p<0) return; idx = p; closeSheets(); update(1); }
function renderToc(host){
  const w = document.createElement('div'); w.className='tocpage';
  w.innerHTML = '<h2>目次</h2>';
  DATA.chapters.forEach((c,i)=>{
    const parts = c.title.split('\u3000');
    const row = document.createElement('div'); row.className='ti';
    const b = document.createElement('button'); b.className='tb'; b.type='button';
    b.setAttribute('aria-label', c.title.replace('\u3000',' ')+'へ移動');
    b.innerHTML = '<span class="n">'+parts[0]+'</span><span class="t">'+(parts[1]||'')+'</span>';
    b.onclick = (e)=>{ e.stopPropagation(); idx = chapPage[i]||1; update(1); };
    row.appendChild(b);
    row.insertAdjacentHTML('beforeend','<span class="d" aria-hidden="true"></span><span class="p" aria-hidden="true">'+(chapPage[i]||'')+'</span>');
    w.appendChild(row);
  });
  host.appendChild(w);
  let fs = 1;
  w.style.fontSize = fs+'em';
  const page = host.closest('.page');
  const fits = ()=>{ const r=w.getBoundingClientRect(), pr=page.getBoundingClientRect(); return vertical ? r.left >= pr.left+8 && w.scrollHeight<=w.clientHeight+2 : r.bottom <= pr.bottom-8; };
  let guard=0;
  while(!fits() && fs>0.5 && guard++<20){ fs -= 0.05; w.style.fontSize = fs.toFixed(2)+'em'; }
}

/* ---------- blocks -> DOM ---------- */
function makeEl(b){
  let el;
  if(b.t==='h2'){ el=document.createElement('h2'); el.innerHTML=b.h; }
  else if(b.t==='quote'){ el=document.createElement('blockquote'); el.innerHTML=b.h; }
  else if(b.t==='sep'){ el=document.createElement('div'); el.className='sep'; el.innerHTML=SEPSVG; }
  else if(b.t==='opener'){ el=document.createElement('div'); el.className='opener'; const im=document.createElement('img'); im.src=IMGS[b.i]; im.alt=b.alt.replace('\u3000',' '); el.appendChild(im); }
  else if(b.t==='end'){ el=document.createElement('p'); el.className='endmark'; el.textContent=b.h; }
  else if(b.t==='next'){ el=document.createElement('div'); el.className='nextnav'; el.innerHTML=b.h; }
  else { el=document.createElement('p'); el.innerHTML=b.h; }
  return el;
}
function contentBox(el){
  const r = el.getBoundingClientRect(), cs = getComputedStyle(el);
  return {
    left:   r.left   + parseFloat(cs.paddingLeft   || 0),
    right:  r.right  - parseFloat(cs.paddingRight  || 0),
    top:    r.top    + parseFloat(cs.paddingTop    || 0),
    bottom: r.bottom - parseFloat(cs.paddingBottom || 0)
  };
}
/* scrollWidth is unreliable in vertical-rl (content overflows leftward),
   so compare the last child's far edge with the page's content box. */
function over(el){
  const kids = el.children;
  if(!kids.length) return false;
  const box = contentBox(el);
  const k = kids[kids.length-1], r = k.getBoundingClientRect(), ks = getComputedStyle(k);
  return vertical
    ? (r.left - parseFloat(ks.marginLeft || 0)) < box.left - 0.5
    : (r.bottom + parseFloat(ks.marginBottom || 0)) > box.bottom + 0.5;
}
function splitText(t){
  const out=[]; let cur='';
  for(let i=0;i<t.length;i++){
    cur+=t[i];
    if('。！？」'.indexOf(t[i])>=0 && cur.length>=40){ out.push(cur); cur=''; }
  }
  if(cur) out.push(cur);
  return out.length?out:[t];
}

/* ---------- pagination ---------- */
function paginate(){
  const m = document.getElementById('measure'), mc = document.getElementById('mcol');
  const ref = document.getElementById('pageA').getBoundingClientRect();
  m.className='page';
  m.style.width = ref.width+'px';
  m.style.height = ref.height+'px';
  mc.innerHTML='';

  pages = [[{t:'cover'}],[{t:'toc'}]];
  chapPage = [];
  let cur = [];
  const push = ()=>{ if(cur.length){ pages.push(cur); cur=[]; } mc.innerHTML=''; };

  const esc = t => t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const drop = el => { if(el && el.parentNode) el.parentNode.removeChild(el); };

  // 1ページに単独で収まらない塊を、収まる単位に割って順番どおり流しこむ
  const flowSplit = (b)=>{
    let part = 0;
    if(b.t==='quote'){                    // 手紙は行単位で分ける
      const trim = a=>{ const c=a.slice();
        while(c.length && c[0]==='') c.shift();
        while(c.length && c[c.length-1]==='') c.pop();
        return c; };
      const lines = b.h.split('<br>');
      let buf=[], node=null;
      for(const ln of lines){
        const trial = buf.concat([ln]);
        drop(node);
        node = makeEl({t:'quote', h: trim(trial).join('<br>')});
        mc.appendChild(node);
        if(over(mc) && trim(buf).length){
          drop(node);
          cur.push({t:'quote', h: trim(buf).join('<br>'), src:b.src, part:part++});
          push();
          buf = (ln==='') ? [] : [ln];
          node = buf.length ? makeEl({t:'quote', h: ln}) : null;
          if(node) mc.appendChild(node);
        } else {
          buf = trial;
        }
      }
      if(trim(buf).length) cur.push({t:'quote', h: trim(buf).join('<br>'), src:b.src, part:part++});
      return;
    }
    for(const c of splitText(makeEl(b).textContent)){   // 段落は文単位で分ける
      const blk = {t:'p', h: esc(c), src:b.src, part:part++};
      let node = makeEl(blk);
      mc.appendChild(node);
      if(over(mc) && cur.length){ drop(node); push(); node = makeEl(blk); mc.appendChild(node); }
      cur.push(blk);
    }
  };

  const feed = (b, chIndex)=>{
    if(b.t==='opener'){ push(); if(chIndex!=null) chapPage[chIndex]=pages.length; pages.push([b]); mc.innerHTML=''; return; }
    const el = makeEl(b);
    mc.appendChild(el);
    if(over(mc)){
      mc.removeChild(el);
      if(cur.length) push();
      mc.appendChild(el);
      if(over(mc)){                       // ページ丸ごと使っても収まらない
        mc.removeChild(el);
        if(chIndex!=null) chapPage[chIndex] = pages.length;
        flowSplit(b);
        return;
      }
    }
    if(chIndex!=null) chapPage[chIndex] = pages.length;
    cur.push(b);
  };

  const chStart = {};
  DATA.chapters.forEach((c,i)=>{ chStart[c.b]=i; });
  DATA.blocks.forEach((b,i)=> feed(b, chStart[i]!=null?chStart[i]:null));
  push();

  // verify: re-measure every page and move any spilled block to the next one
  for(let p=1;p<pages.length;p++){
    if(pages[p][0] && (pages[p][0].t==='toc' || pages[p][0].t==='opener')) continue;
    mc.innerHTML='';
    const keep=[]; const spill=[];
    for(const b of pages[p]){
      if(spill.length){ spill.push(b); continue; }
      const el=makeEl(b); mc.appendChild(el);
      if(over(mc) && keep.length){ mc.removeChild(el); spill.push(b); }
      else keep.push(b);
    }
    if(spill.length){
      pages[p]=keep;
      pages.splice(p+1,0,spill);
      for(let c=0;c<chapPage.length;c++) if(chapPage[c]>p) chapPage[c]++;
    }
  }
  mc.innerHTML='';
  if(pages.length%2===0 && spread) pages.push([{t:'blank'}]);
}

/* ---------- render ---------- */
function renderPage(hostPage, page){
  const host = hostPage.querySelector('.col');
  host.innerHTML='';
  hostPage.classList.remove('blank');
  if(!page){ hostPage.classList.add('blank'); return; }
  if(page[0] && page[0].t==='cover'){
    host.innerHTML = '<div class="opener cov" style="background:#e0d8c4"><div class="covbg t" style="background-image:url('+COVER+')"></div><div class="covbg b" style="background-image:url('+COVER+')"></div><img alt="'+DATA.title+'　'+DATA.sub+'" src="'+COVER+'"></div>';
    setTimeout(fitCov,0);
    return;
  }
  if(page[0] && page[0].t==='blank'){ hostPage.classList.add('blank'); return; }
  if(page[0] && page[0].t==='toc'){ renderToc(host); return; }
  page.forEach(b=> host.appendChild(makeEl(b)));
}

function update(dir){
  const A=document.getElementById('pageA'), B=document.getElementById('pageB');
  if(spread && idx>0 && idx%2===0) idx--;
  idx = Math.max(0, Math.min(pages.length-1, idx));

  if(spread && idx>0){ renderPage(A,pages[idx]); renderPage(B,pages[idx+1]); }
  else { renderPage(A,pages[idx]); renderPage(B,null); }

  if(dir){
    const dx = (dir>0 ? (vertical?-14:14) : (vertical?14:-14))+'px';
    [A,B].forEach(el=>{ el.style.setProperty('--dx',dx); el.classList.remove('flip'); void el.offsetWidth; el.classList.add('flip'); });
  }

  const bp = pageOfAnchor(bm), vis = visiblePages();
  A.classList.toggle('marked', bm!=null && bp===vis[0]);
  B.classList.toggle('marked', bm!=null && vis.length>1 && bp===vis[1]);
  const here = bm!=null && vis.indexOf(bp)>=0;
  const bb = document.getElementById('bmBtn');
  bb.setAttribute('aria-pressed', String(here));
  bb.disabled = (idx===0 && !spread) || (idx===0);
  bb.setAttribute('aria-label', here ? 'しおりを外す' : 'このページにしおりをはさむ');
  document.getElementById('bmJump').hidden = !(bm && bp>0 && !here);
  const bi = document.getElementById('bmItem');
  bi.hidden = !(bm && bp>0);
  if(bp>0) bi.textContent = 'しおりのページへ（' + bp + '）';
  const last = pages.length-1;
  try{ if(idx===last && last>0) localStorage.setItem('done:'+DATA.title,'1'); }catch(e){}
  const prog = last>0 ? idx/last : 0;
  document.getElementById('mark').setAttribute('transform','translate('+(8+284*prog)+',0)');
  document.getElementById('finalmark').classList.toggle('show', idx===last);
  if(MOTIF==='foot'){
    const N = 18, shown = Math.max(1, Math.round(prog*(N-1))+1);
    for(let i=0;i<N;i++){
      const el = document.getElementById('fp'+i); if(!el) continue;
      el.classList.toggle('on', i < shown);
      el.classList.toggle('gone', idx===last && last>0 && i >= shown-3);
    }
    let cur = -1;
    DATA.chapters.forEach((c,i)=>{ if(chapPage[i]!=null && chapPage[i] <= idx) cur = i; });
    DATA.chapters.forEach((c,i)=>{
      const t = document.getElementById('ct'+i); if(!t) return;
      if(chapPage[i]==null || last<=0){ t.style.display='none'; return; }
      const x = (8 + 284*(chapPage[i]/last)).toFixed(1);
      t.setAttribute('x1',x); t.setAttribute('x2',x); t.style.display='';
      t.classList.toggle('now', i===cur && idx>0);
    });
    const rn = document.querySelectorAll('.ruler .rn');
    if(rn.length>=2){
      if(cur<0 || idx===0){ rn[0].textContent=''; rn[1].textContent=''; }
      else {
        rn[0].textContent = DATA.chapters[cur].title.split('\u3000')[0];
        rn[1].textContent = (cur+1) + '／' + DATA.chapters.length;
      }
    }
  }
  if(MOTIF==='rooms'){
    let cur = 0;
    DATA.chapters.forEach((c,i)=>{ if(chapPage[i]!=null && chapPage[i] <= idx) cur = i; });
    DATA.chapters.forEach((c,i)=>{
      const el = document.getElementById('win'+i); if(!el) return;
      const off = (idx===last) || i < cur;
      el.classList.toggle('off', off);
      el.classList.toggle('now', !off && i===cur && idx>0);
    });
  }

  let name='';
  for(let i=0;i<DATA.chapters.length;i++){ if(chapPage[i]!=null && chapPage[i]<=idx) name=DATA.chapters[i].title; }
  document.getElementById('chapNow').textContent = idx===0 ? '' : name;
  document.getElementById('pageNow').textContent = idx===0 ? '表紙' : (idx + ' / ' + last);
  document.querySelectorAll('.toc-item').forEach(el=>{
    el.setAttribute('aria-current', String(Number(el.dataset.p)<=idx && (Number(el.dataset.next)>idx || el.dataset.next==='')));
  });
}

function go(step){ const n=idx+step*(spread&&idx>0?2:1); if(n<0||n>pages.length-1) return; idx=n; update(step); }
function next(){ go(1); } function prev(){ go(-1); }

/* ---------- column fitting ---------- */
function fitColumn(){
  const pa = document.getElementById('pageA'), cs = getComputedStyle(pa);
  const avail = vertical
    ? pa.clientHeight - parseFloat(cs.paddingTop)  - parseFloat(cs.paddingBottom)
    : pa.clientWidth  - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const n = CHARS[sizeIdx];
  let fs = Math.min(SIZES[sizeIdx], avail / (n * KERN));
  fs = Math.max(12.5, fs);
  const colw = Math.min(avail, Math.floor(fs * n * KERN));
  document.documentElement.style.setProperty('--fs', fs.toFixed(2)+'px');
  document.documentElement.style.setProperty('--colw', colw+'px');
}

/* ---------- layout ---------- */
function layout(keepBlock){
  spread = window.innerWidth >= 940 && window.innerHeight >= 420;
  document.body.classList.toggle('spread', spread);
  document.body.classList.toggle('vert', vertical);
  document.documentElement.style.setProperty('--fs', SIZES[sizeIdx]+'px');
  document.documentElement.style.setProperty('--lh', vertical? '1.95' : '2.05');
  requestAnimationFrame(()=>{
    fitColumn();
    paginate();
    if(keepBlock!=null){
      let found=0;
      for(let p=1;p<pages.length;p++){ if(pages[p].some(b=>b===keepBlock)){ found=p; break; } }
      idx = found || Math.min(idx, pages.length-1);
    }
    buildToc();
    update(0);
  });
}
function currentBlock(){ const p=pages[idx]; return p && p[0] && p[0].t!=='cover' ? p[0] : null; }

/* ---------- toc ---------- */
function buildToc(){
  const list=document.getElementById('tocList');
  list.innerHTML='';
  DATA.chapters.forEach((c,i)=>{
    const b=document.createElement('button');
    b.className='toc-item'; b.dataset.p=chapPage[i]||1;
    b.dataset.next = (chapPage[i+1]!=null? chapPage[i+1] : '');
    b.innerHTML='<span>'+c.title+'</span><span class="pg">'+(chapPage[i]||1)+'</span>';
    b.onclick=()=>{ idx=chapPage[i]||1; closeSheets(); update(1); };
    list.appendChild(b);
  });
}

/* ---------- sheets ---------- */
function closeSheets(){ document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('open')); }
try{ if(!/claude\.ai$/i.test(location.hostname) && !/^blob:/.test(location.href)) document.getElementById('homeLink').hidden=false; }catch(e){}
document.getElementById('bmBtn').onclick=toggleBm;
document.getElementById('bmJump').onclick=goBm;
document.getElementById('bmItem').onclick=goBm;
document.getElementById('tocBtn').onclick=()=>document.getElementById('tocSheet').classList.add('open');
document.getElementById('setBtn').onclick=()=>document.getElementById('setSheet').classList.add('open');
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheets);
document.querySelectorAll('.sheet').forEach(s=>s.addEventListener('click',e=>{ if(e.target===s) closeSheets(); }));

document.getElementById('dirSeg').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  const keep=currentBlock();
  vertical = b.dataset.dir==='v';
  document.querySelectorAll('#dirSeg button').forEach(x=>x.setAttribute('aria-pressed', String(x===b)));
  layout(keep);
};
document.getElementById('sizeSeg').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  const keep=currentBlock();
  sizeIdx=Number(b.dataset.size);
  document.querySelectorAll('#sizeSeg button').forEach(x=>x.setAttribute('aria-pressed', String(x===b)));
  layout(keep);
};

/* ---------- input ---------- */
/* 目次ページの項目がページ送りの領域の下にあっても押せるようにする */
function tocHit(e){
  if(!e || (!e.clientX && !e.clientY)) return false;
  const zs=document.querySelectorAll('.zone'); zs.forEach(z=>z.style.pointerEvents='none');
  const el=document.elementFromPoint(e.clientX,e.clientY);
  zs.forEach(z=>z.style.pointerEvents='');
  const t=el && el.closest ? el.closest('.tocpage .tb') : null;
  if(t){ t.click(); return true; }
  return false;
}
document.getElementById('zoneL').onclick=e=>{ if(tocHit(e)) return; vertical? next() : prev(); };
document.getElementById('zoneR').onclick=e=>{ if(tocHit(e)) return; vertical? prev() : next(); };
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') vertical?prev():next();
  else if(e.key==='ArrowLeft') vertical?next():prev();
  else if(e.key===' '||e.key==='ArrowDown'){ e.preventDefault(); next(); }
  else if(e.key==='ArrowUp') prev();
  else if(e.key==='Escape') closeSheets();
});
let tx=0,ty=0;
const bookEl=document.getElementById('book');
bookEl.addEventListener('touchstart',e=>{ tx=e.changedTouches[0].clientX; ty=e.changedTouches[0].clientY; },{passive:true});
bookEl.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)<44 || Math.abs(dx)<Math.abs(dy)) return;
  if(dx<0) vertical?prev():next(); else vertical?next():prev();
},{passive:true});

let rt;
window.addEventListener('resize',()=>{ clearTimeout(rt); const keep=currentBlock(); rt=setTimeout(()=>layout(keep),180); });

if(document.fonts && document.fonts.ready){ document.fonts.ready.then(()=>layout(null)); }
layout(null);

/* 表紙の余白を、表紙の端の色でつなぐ（上下か左右かを画面の形で判定） */
function fitCov(){
  document.querySelectorAll('.opener.cov').forEach(function(op){
    var im=op.querySelector('img'); if(!im) return;
    var set=function(){
      var W=op.clientWidth, H=op.clientHeight; if(!W||!H) return;
      var r=(im.naturalWidth||600)/(im.naturalHeight||960);
      var lr = (W/H) > r;
      op.classList.toggle('lr', lr);
    };
    if(im.complete) set(); else im.addEventListener('load', set, {once:true});
  });
}
window.addEventListener('resize', function(){ setTimeout(fitCov, 250); });

/* shioriAuto: トップページからの「しおりの続きから」 */
if(/[?&]shiori=1/.test(location.search)){
  var _try=function(n){
    try{
      if(bm){ var p=pageOfAnchor(bm); if(p>0){ idx=p; update(0); return; } }
    }catch(e){}
    if(n>0) setTimeout(function(){ _try(n-1); }, 300);
  };
  setTimeout(function(){ _try(6); }, 300);
}
